---
name: Scheduled Cleanup

on:
  schedule:
    - cron: '0 3 * * *'  # Elke nacht om 3:00 UTC
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'List stale environments without deleting'
        type: boolean
        default: false

env:
  ZAD_PROJECT: regel-k4c

jobs:
  cleanup-stale-previews:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      packages: write
      actions: write

    steps:
      - name: Cleanup stale ZAD deployments and GitHub environments
        uses: RijksICTGilde/zad-actions/scheduled-cleanup@13434cd415db0cd195a2c5f12bf67645acfcb635  # v4.0.6
        with:
          api-key: ${{ secrets.RIG_API_KEY }}
          project-id: ${{ env.ZAD_PROJECT }}
          environment-pattern: '^pr[0-9]+$'
          pr-number-pattern: 's/^pr//'
          delete-github-env: true
          delete-github-deployments: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          dry-run: ${{ inputs.dry-run || false }}
          github-admin-token: ${{ secrets.ADMIN_TOKEN }}

      # De opruimlogica staat in script/ghcr-cleanup.mjs, niet hier. Ze moet de
      # referentiegraaf van de registry volgen om te weten welke untagged versie
      # een levend onderdeel van een getagde image is en welke een wees, en die
      # afweging hoort in code die je kunt testen (script/ghcr-cleanup.test.mjs)
      # in plaats van in een pipeline die je alleen in productie kunt proberen.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: '22'

      - name: Cleanup stale container images
        env:
          GH_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          ORG: ${{ github.repository_owner }}
          DRY_RUN: ${{ inputs.dry-run || false }}
        run: node script/ghcr-cleanup.mjs
