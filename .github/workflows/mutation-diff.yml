---
# Mutatietesten op alleen de gewijzigde regels van een PR. De volledige run
# (mutation-testing.yml) duurt uren en draait wekelijks; deze poort draait in
# minuten en meldt een ongetest codepad op het moment dat het geschreven wordt.
# De twee vervangen elkaar niet: --in-diff kijkt alleen naar productiecode die
# in de diff staat, en een wijziging hier kan code elders slechter getest maken
# zonder dat deze job dat ziet.
#
# De poort dekt engine en pipeline. De pipeline stond er eerst buiten, terwijl
# daar de deterministische poorten en de tellers zitten: de code die bepaalt of
# een vertaling deugt. Twee keer bleek daar een test te staan die zijn eigen
# regel niet vastpinde, en dat is precies wat een mutant vindt.
#
# De poort draait in drie stappen: `plan` telt de mutanten in de diff en kiest
# daarmee het aantal shards, `shard` test ze verdeeld over die shards, en
# `in-diff` voegt de uitkomsten samen onder de naam die de check altijd had.
# Waarom shards: een mutant kost hier zo'n 40 tot 60 seconden (bouwen plus
# testen), en binnen een shard gaan ze achter elkaar. #1549 had 87 mutanten en
# wachtte daarmee een uur op deze check; over vier shards is dat zo'n twintig
# minuten. Het kost wel iets meer runnerminuten, want elke shard bouwt en test
# eerst zijn eigen ongemuteerde baseline.
name: Mutation Testing (diff)

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/engine/**'
      - 'packages/pipeline/**'
      - '.github/workflows/mutation-diff.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_MUTANTS_VERSION: 27.1.0

jobs:
  plan:
    name: Mutation Testing (diff, plan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      count: ${{ steps.plan.outputs.count }}
      shards: ${{ steps.plan.outputs.shards }}
      shard-count: ${{ steps.plan.outputs.shard-count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # De diff wordt tegen de base-SHA van de PR gemaakt, dus die commit
          # moet lokaal bestaan.
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7  # stable

      - name: Restore cargo registry (shared met CI)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('packages/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - name: Restore cargo-mutants binary
        id: mutants-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-mutants
          key: ${{ runner.os }}-cargo-mutants-bin-${{ env.CARGO_MUTANTS_VERSION }}

      - name: Install cargo-mutants
        if: steps.mutants-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-mutants --locked --version "$CARGO_MUTANTS_VERSION"

      - name: Save cargo-mutants binary
        # Alleen deze baan slaat op. De shards lopen pas na het plan en vinden
        # de binary dan in de cache; zouden ze zelf ook opslaan, dan levert
        # elke save na de eerste op dezelfde sleutel een waarschuwing op.
        if: steps.mutants-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-mutants
          key: ${{ runner.os }}-cargo-mutants-bin-${{ env.CARGO_MUTANTS_VERSION }}

      - name: Tel de mutanten en kies het aantal shards
        id: plan
        working-directory: packages
        # Zelfde diff als in de shards: relatief aan packages/, driepunts. Zie
        # de toelichting bij die stap hieronder.
        #
        # `--list` bouwt niets, dus dit kost seconden. Het aantal shards volgt
        # uit het aantal mutanten: één per tien, hooguit vier. Een PR met drie
        # mutanten betaalt dan één baseline in plaats van drie, en een PR met
        # nul mutanten start geen enkele shard.
        #
        # Dit is de enige plek waar het aantal shards wordt bepaald. De matrix
        # en `--shard k/n` lezen allebei deze uitvoer, dus ze kunnen niet uit de
        # pas lopen en mutanten stil ongetest laten.
        run: |
          git diff --relative "${{ github.event.pull_request.base.sha }}...HEAD" \
            -- engine pipeline > "$RUNNER_TEMP/pr.diff"
          if [ -s "$RUNNER_TEMP/pr.diff" ]; then
            count=$(cargo mutants --list --in-diff "$RUNNER_TEMP/pr.diff" | wc -l)
          else
            count=0
          fi
          count=$((count))
          if [ "$count" -eq 0 ]; then
            n=0
          else
            n=$(( (count + 9) / 10 ))
            if [ "$n" -gt 4 ]; then n=4; fi
          fi
          if [ "$n" -gt 0 ]; then
            shards=$(seq 0 $((n - 1)) | jq -sRc 'split("\n")[:-1] | map(tonumber)')
          else
            shards='[]'
          fi
          echo "Mutanten in de diff: $count. Shards: $n ($shards)."
          {
            echo "count=$count"
            echo "shard-count=$n"
            echo "shards=$shards"
          } >> "$GITHUB_OUTPUT"

  shard:
    name: Mutation Testing (diff, shard ${{ matrix.shard }})
    needs: plan
    # Een matrix over een lege lijst is een fout in Actions, dus bij nul
    # mutanten slaat deze baan als geheel over. De samenvattende baan weet dan
    # uit het plan dat er niets te testen was.
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      # Elke shard maakt zijn eigen deel af: één rode shard mag de rest niet
      # afbreken, anders zie je maar een deel van de overlevers.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7  # stable

      - name: Install mold linker
        # Required by packages/.cargo/config.toml (mold linker on x86_64-linux).
        run: |
          # De runner-image draagt een Google Chrome-apt-bron mee die geregeld een
          # kapotte index geeft ("Hash Sum mismatch") en dan elke apt-get update laat
          # falen; wij gebruiken die bron niet, dus weg ermee vóór apt-get update.
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list
          sudo apt-get update && sudo apt-get install -y mold

      - name: Restore cargo registry (shared met CI)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('packages/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - name: Restore cargo-mutants binary
        id: mutants-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-mutants
          key: ${{ runner.os }}-cargo-mutants-bin-${{ env.CARGO_MUTANTS_VERSION }}

      - name: Install cargo-mutants
        # Het plan heeft de binary net opgeslagen, dus dit draait alleen als
        # die save mislukte. Dan installeren zonder zelf op te slaan.
        if: steps.mutants-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-mutants --locked --version "$CARGO_MUTANTS_VERSION"

      - name: Bepaal de gewijzigde regels
        working-directory: packages
        # cargo-mutants noemt bestanden relatief aan de workspace-root
        # (packages/), dus de diff moet dezelfde prefix hebben: `b/engine/src/…`
        # en niet `b/packages/engine/src/…`. Vandaar --relative vanuit packages/.
        #
        # Driepunts (`base...HEAD`), niet tweepunts: tweepunts vergelijkt twee
        # bomen, dus alles wat main na de aftakking veranderde telt mee als
        # wijziging van deze PR. Dan muteert de poort regels die de auteur niet
        # heeft aangeraakt, en kan hij rood worden op andermans werk.
        run: |
          git diff --relative "${{ github.event.pull_request.base.sha }}...HEAD" \
            -- engine pipeline > "$RUNNER_TEMP/pr.diff"

      - name: Draai mutatietesten op de gewijzigde regels
        # De workspace-root, net als de stap die de diff bepaalt. Vanuit
        # packages/engine filtert `--in-diff` tegen dat ene pakket, dus toen
        # deze workflow pipeline aan zijn paden toevoegde bleef hij nul
        # pipeline-mutanten draaien: 1015 stuks vielen stil weg en de job werd
        # groen zonder er een te hebben gezien.
        working-directory: packages
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_COUNT: ${{ needs.plan.outputs.shard-count }}
        run: |
          set +e
          # Een vaste ondergrens, geen multiplier op de baseline. De
          # baseline meet een warme testrun (seconden); een mutant draait
          # daarna op een runner die tegelijk compileert, en dan haalt
          # dezelfde suite die grens niet. Op 9 september 2026 liepen 46
          # van de 370 mutanten daardoor in een timeout terwijl de suite
          # in acht seconden groen was: de poort meldde "mogelijk een
          # oneindige lus" waar in werkelijkheid 46 overlevers verstopt
          # zaten. Twee minuten is ruim boven elke echte run en nog altijd
          # kort genoeg om een echte lus af te kappen.
          #
          # Round-robin in plaats van de standaard `slice`: slice geeft elke
          # shard een aaneengesloten stuk van de lijst, en overlevers (de
          # duurste mutanten) zitten vaak bij elkaar op een paar regels. Dan
          # wacht de hele poort op die ene shard.
          cargo mutants --in-place --timeout 120 \
            --in-diff "$RUNNER_TEMP/pr.diff" \
            --shard "${SHARD}/${SHARD_COUNT}" --sharding round-robin
          code=$?
          set -e
          case "$code" in
            0) echo "Alle mutanten in deze shard werden gevangen." ;;
            2)
              echo "::error::Er zijn regels gewijzigd waar een mutatie ongemerkt doorheen komt. Zie mutants.out/missed.txt in het artifact van deze shard."
              exit 1
              ;;
            3)
              echo "::error::Een test liep vast op een mutatie (mogelijk een oneindige lus, of de timeout staat te krap)."
              exit 1
              ;;
            *) exit "$code" ;;
          esac

      - name: Upload rapport
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: mutation-report-diff-shard-${{ matrix.shard }}
          # cargo-mutants schrijft naar de workspace-root (packages/), ook als
          # het commando vanuit packages/engine wordt gestart.
          path: packages/mutants.out/
          if-no-files-found: ignore

  # De naam die de check altijd had, zodat wie ernaar kijkt één uitkomst ziet
  # en niet een per shard. Deze check is niet verplicht; dat kan hij ook niet
  # zomaar worden, want de workflow heeft een `paths:`-filter en geen
  # `merge_group`-trigger, en zou in de merge queue dan op "Expected" blijven
  # staan (zie AGENTS.md, de merge queue).
  #
  # `always()` en niet `!cancelled()`: bij een afgebroken run moet dit rood
  # zijn en niet overgeslagen, want overgeslagen telt bij GitHub als geslaagd.
  # De prijs is een rode check op een commit die door een nieuwe push is
  # ingehaald; de check op de nieuwe commit is degene die telt.
  in-diff:
    name: Mutation Testing (diff)
    needs: [plan, shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Uitkomst van plan en shards
        env:
          PLAN: ${{ needs.plan.result }}
          COUNT: ${{ needs.plan.outputs.count }}
          SHARDS: ${{ needs.shard.result }}
        run: |
          if [ "$PLAN" != "success" ]; then
            echo "::error::Het plan is niet geslaagd ($PLAN), dus niemand weet hoeveel mutanten er getest hadden moeten worden."
            exit 1
          fi
          if [ "$COUNT" = "0" ]; then
            echo "Geen mutanten in de gewijzigde regels van packages/engine of packages/pipeline."
            exit 0
          fi
          if [ "$SHARDS" != "success" ]; then
            echo "::error::$COUNT mutanten gepland, maar minstens één shard is niet geslaagd ($SHARDS). Zie de shard-banen en hun artifacts mutation-report-diff-shard-N."
            exit 1
          fi
          echo "Alle $COUNT mutanten zijn getest; geen enkele overleefde."
