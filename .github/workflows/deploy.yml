---
name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed, labeled, unlabeled]

permissions: {}

env:
  REGISTRY: ghcr.io
  ZAD_PROJECT: regel-k4c

jobs:
  # Deze job is de poort van de hele keten: alles wat bouwt of deployt hangt er
  # via `needs: changes` aan, dus wat hier niet doorkomt kost geen runner.
  #
  # Een PR bouwt alleen met het label `preview` erop. Getoetst op aanwezigheid
  # van het label, niet op het soort gebeurtenis, zodat dezelfde regel geldt bij
  # openen, bij elke volgende commit en op het moment dat het label erbij komt.
  # Bij `unlabeled` bouwt de keten nooit; dat event bestaat hier alleen om
  # cleanup-preview af te trappen.
  #
  # Een fork-PR krijgt geen secrets en een read-only GITHUB_TOKEN, dus de push
  # naar GHCR faalt daar per definitie.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event.action != 'closed' &&
      github.event.action != 'unlabeled' &&
      github.event.pull_request.head.repo.fork != true &&
      (
        github.event_name == 'push' ||
        contains(github.event.pull_request.labels.*.name, 'preview')
      )
    permissions:
      contents: read
    outputs:
      editor: ${{ steps.filter.outputs.editor }}
      admin: ${{ steps.filter.outputs.admin }}
      harvester-worker: ${{ steps.filter.outputs.harvester-worker }}
      enrich-worker: ${{ steps.filter.outputs.enrich-worker }}
      pipeline-api: ${{ steps.filter.outputs.pipeline-api }}
      grafana: ${{ steps.filter.outputs.grafana }}
      lawmaking: ${{ steps.filter.outputs.lawmaking }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # De diff tegen de base (PR) of tegen de vorige commit (push) bepaalt
          # welke bestanden gewijzigd zijn.
          fetch-depth: 0

      - name: Bepaal gewijzigde bestanden
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Een lege of nul-SHA (nieuwe branch, eerste push) betekent: geen
          # betrouwbare diff, dus alles bouwen. Dat regelt het script zelf als
          # de lijst leeg blijft.
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --name-only "$BASE_SHA" HEAD > changed.txt
          else
            : > changed.txt
          fi
          echo "Gewijzigde bestanden: $(wc -l < changed.txt)"

      # Welke componenten geraakt worden volgt uit de dependency-graaf van
      # cargo, niet uit een handmatige padenlijst. Die lijst dreef weg:
      # packages/auth en packages/law-model stonden er nergens in, terwijl
      # editor-api en admin op auth leunen en engine, corpus, pipeline en
      # harvester op law-model. Faalt het script, dan zet het alles op true.
      # Dezelfde Node als waarmee de testsuite in ci.yml draait. Dit script
      # bepaalt wat er naar productie gaat; het hoort niet stil mee te
      # verschuiven met wat er toevallig op de runner staat.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: '22'

      - name: Bepaal geraakte componenten
        id: filter
        run: node script/deploy-filters.mjs --from-file changed.txt

  # -- Build jobs --
  build:
    needs: changes
    if: >-
      github.event.action != 'closed' &&
      (
        needs.changes.outputs.editor == 'true' ||
        contains(github.event.pull_request.labels.*.name, 'deploy:editor')
      )
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image-name: minbzk/regelrecht-editor
      dockerfile: frontend/Dockerfile
      cache-scope: editor
    # Only GITHUB_TOKEN is needed; it is automatically available to called workflows

  build-admin:
    needs: changes
    if: github.event.action != 'closed' && needs.changes.outputs.admin == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image-name: minbzk/regelrecht-admin
      dockerfile: packages/admin/Dockerfile
      cache-scope: admin
    # Only GITHUB_TOKEN is needed; it is automatically available to called workflows

  build-harvester-worker:
    needs: changes
    if: github.event.action != 'closed' && needs.changes.outputs.harvester-worker == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image-name: minbzk/regelrecht-harvester-worker
      dockerfile: packages/pipeline/Dockerfile
      target: harvester-worker
      build-args: BIN=regelrecht-harvest-worker
      cache-scope: harvester-worker
    # Only GITHUB_TOKEN is needed; it is automatically available to called workflows

  build-enrich-worker:
    needs: changes
    if: >-
      github.event.action != 'closed' &&
      (
        needs.changes.outputs.enrich-worker == 'true' ||
        contains(github.event.pull_request.labels.*.name, 'deploy:enrich-worker')
      )
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image-name: minbzk/regelrecht-enrich-worker
      dockerfile: packages/pipeline/Dockerfile
      target: enrich-worker
      build-args: BIN=regelrecht-enrich-worker
      cache-scope: enrich-worker
    # Only GITHUB_TOKEN is needed; it is automatically available to called workflows

  build-pipeline-api:
    needs: changes
    if: github.event.action != 'closed' && needs.changes.outputs.pipeline-api == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image-name: minbzk/regelrecht-pipeline-api
      dockerfile: packages/pipeline/Dockerfile
      target: pipeline-api
      build-args: BIN=regelrecht-pipeline-api
      cache-scope: pipeline-api

  build-grafana:
    needs: changes
    if: >-
      github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      needs.changes.outputs.grafana == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image-name: minbzk/regelrecht-grafana
      dockerfile: packages/grafana/Dockerfile
      context: ./packages/grafana
      cache-scope: grafana
    # Only GITHUB_TOKEN is needed; it is automatically available to called workflows

  build-lawmaking:
    needs: changes
    if: github.event.action != 'closed' && needs.changes.outputs.lawmaking == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image-name: minbzk/regelrecht-lawmaking
      dockerfile: frontend-lawmaking/Dockerfile
      cache-scope: lawmaking
    # Only GITHUB_TOKEN is needed; it is automatically available to called workflows

  build-docs:
    needs: changes
    if: github.event.action != 'closed' && needs.changes.outputs.docs == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      image-name: minbzk/regelrecht-docs
      dockerfile: docs/Dockerfile
      cache-scope: docs
    # Only GITHUB_TOKEN is needed; it is automatically available to called workflows

  # -- Deploy preview --
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, build-admin, build-harvester-worker, build-enrich-worker, build-pipeline-api, build-lawmaking, build-docs, changes]
    if: >-
      always() &&
      github.event_name == 'pull_request' && github.event.action != 'closed' &&
      !cancelled() &&
      (
        needs.build.result == 'success' ||
        needs.build-admin.result == 'success' ||
        needs.build-harvester-worker.result == 'success' ||
        needs.build-enrich-worker.result == 'success' ||
        needs.build-pipeline-api.result == 'success' ||
        needs.build-lawmaking.result == 'success' ||
        needs.build-docs.result == 'success'
      )
    permissions:
      pull-requests: write
    environment:
      name: pr${{ github.event.pull_request.number }}
      url: ${{ steps.editor-url.outputs.url }}

    steps:
      - name: Get short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      # ZAD kent per deployment één taak-scope: een tweede taak voor pr<N> zet de
      # eerste opzij ("superseded", zie RIG-Cluster features/task-supersede.md).
      # Componenten los deployen kan daarom niet parallel; ze gaan als één lijst
      # in één upsert-taak, die ze samen commit en in één ArgoCD-sync uitrolt.
      - name: Stel de componentenlijst samen
        id: plan
        env:
          SHA: ${{ steps.sha.outputs.short }}
          EDITOR: ${{ needs.build.result }}
          ADMIN: ${{ needs.build-admin.result }}
          HARVESTER_WORKER: ${{ needs.build-harvester-worker.result }}
          ENRICH_WORKER: ${{ needs.build-enrich-worker.result }}
          PIPELINE_API: ${{ needs.build-pipeline-api.result }}
          LAWMAKING: ${{ needs.build-lawmaking.result }}
          DOCS: ${{ needs.build-docs.result }}
        run: |
          set -euo pipefail
          COMPONENTS='[]'
          add() {
            COMPONENTS=$(jq -c --arg name "$1" --arg image "${REGISTRY}/minbzk/$2:sha-${SHA}" \
              '. + [{name: $name, image: $image}]' <<<"$COMPONENTS")
          }

          # De editor gaat als eerste in de lijst: de action leidt de
          # environment-URL af van de eerste component.
          if [ "$EDITOR" = success ]; then add editor regelrecht-editor; fi
          if [ "$ADMIN" = success ]; then add harvester-admin regelrecht-admin; fi
          if [ "$HARVESTER_WORKER" = success ]; then add harvester-worker regelrecht-harvester-worker; fi
          if [ "$ENRICH_WORKER" = success ]; then add enrichworker regelrecht-enrich-worker; fi
          if [ "$PIPELINE_API" = success ]; then add pipelineapi regelrecht-pipeline-api; fi
          if [ "$LAWMAKING" = success ]; then add lawmaking regelrecht-lawmaking; fi
          if [ "$DOCS" = success ]; then add docs regelrecht-docs; fi

          jq -r '.[] | "  \(.name): \(.image)"' <<<"$COMPONENTS"
          echo "components=$COMPONENTS" >> "$GITHUB_OUTPUT"

      - name: Deploy to ZAD (Preview)
        id: deploy
        uses: RijksICTGilde/zad-actions/deploy@13434cd415db0cd195a2c5f12bf67645acfcb635  # v4.0.6
        with:
          api-key: ${{ secrets.RIG_API_KEY }}
          project-id: ${{ env.ZAD_PROJECT }}
          deployment-name: pr${{ github.event.pull_request.number }}
          components: ${{ steps.plan.outputs.components }}
          # Bepaalt alleen de hostnaam-vorm. Of een component publiek bereikbaar
          # is, hangt aan publish-on-web in de gekloonde config: pipeline-api
          # heeft dat niet en blijft dus in-cluster, net als in productie.
          domain-format: component-deployment-project
          clone-from: regelrecht
          force-clone: false
          comment-on-pr: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-header: '## Preview Deployment'

      - name: Editor-URL voor de environment
        id: editor-url
        if: needs.build.result == 'success'
        env:
          URLS: ${{ steps.deploy.outputs.urls }}
        run: echo "url=$(jq -r '.editor // empty' <<<"$URLS")" >> "$GITHUB_OUTPUT"

      - name: Verklaar een mislukte deploy
        if: failure() && steps.deploy.outcome == 'failure'
        env:
          COMPONENTS: ${{ steps.plan.outputs.components }}
        run: |
          echo "::notice::Deploy van pr${{ github.event.pull_request.number }} mislukt voor: $(jq -r '[.[].name] | join(", ")' <<<"$COMPONENTS")"
          echo "'status: superseded' in de output hierboven betekent dat een nieuwere taak"
          echo "voor dit deployment (een nieuwe push, of het opruimen van een gesloten PR)"
          echo "het werk heeft overgenomen. Deze job opnieuw draaien is dan veilig."
          echo "Iets anders? Zie 'Debugging deploy-preview failures' in CLAUDE.md."

  # -- Deploy production --
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, build-admin, build-harvester-worker, build-enrich-worker, build-pipeline-api, build-grafana, build-lawmaking, build-docs]
    if: >-
      always() &&
      github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      !cancelled() &&
      (
        needs.build.result == 'success' ||
        needs.build-admin.result == 'success' ||
        needs.build-harvester-worker.result == 'success' ||
        needs.build-enrich-worker.result == 'success' ||
        needs.build-pipeline-api.result == 'success' ||
        needs.build-grafana.result == 'success' ||
        needs.build-lawmaking.result == 'success' ||
        needs.build-docs.result == 'success'
      )
    permissions:
      # Alleen om de CI-run van deze commit te mogen opzoeken.
      actions: read
      contents: read
    environment:
      name: production
      url: ${{ steps.editor-url.outputs.url }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      # ci.yml en deze workflow hangen allebei aan `push` op main en weten niets
      # van elkaar; er is geen `needs` tussen twee workflows. Op commit 4518c575
      # (7 augustus 2026) faalde CI op Security Audit en ging deze deploy
      # diezelfde minuut gewoon door. Deze stap is die ontbrekende koppeling.
      - name: Wacht op een groene CI voor deze commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: script/require-ci-green.sh

      # Faalt één gevraagd image, dan gaat er niets. De conditie hierboven laat
      # de deploy al door zodra één build slaagt, en de lijst hieronder neemt
      # alleen de geslaagde mee: het gevolg was dat een component stil op zijn
      # vorige image bleef staan terwijl de rest meeschoof. De editor en
      # editor-api delen een contract, dus dat is geen halve deploy maar een
      # inconsistente. Nooit gebeurd in de laatste honderd runs op main, en dat
      # is precies waarom het onopgemerkt kon blijven.
      - name: Weiger een halve deploy
        env:
          RESULTS: >-
            ${{ needs.build.result }} ${{ needs.build-admin.result }}
            ${{ needs.build-harvester-worker.result }} ${{ needs.build-enrich-worker.result }}
            ${{ needs.build-pipeline-api.result }} ${{ needs.build-grafana.result }}
            ${{ needs.build-lawmaking.result }} ${{ needs.build-docs.result }}
        run: |
          case " $RESULTS " in
            *" failure "*|*" cancelled "*)
              echo "::error title=Deploy-poort::Niet elk gevraagd image is gebouwd ($RESULTS). Een deploy zou de rest vooruit zetten en het gevallen component op zijn vorige image laten staan; er gaat daarom niets naar productie."
              exit 1
              ;;
          esac
          echo "Geen gevallen build; alle gevraagde images staan klaar."

      - name: Get short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      # Dezelfde reden als bij de preview: ZAD kent per deployment één
      # taak-scope, dus een tweede taak voor regelrecht zet de eerste opzij
      # ("superseded"). Alle componenten gaan als één lijst in één upsert-taak.
      - name: Stel de componentenlijst samen
        id: plan
        env:
          SHA: ${{ steps.sha.outputs.short }}
          EDITOR: ${{ needs.build.result }}
          ADMIN: ${{ needs.build-admin.result }}
          HARVESTER_WORKER: ${{ needs.build-harvester-worker.result }}
          ENRICH_WORKER: ${{ needs.build-enrich-worker.result }}
          PIPELINE_API: ${{ needs.build-pipeline-api.result }}
          GRAFANA: ${{ needs.build-grafana.result }}
          LAWMAKING: ${{ needs.build-lawmaking.result }}
          DOCS: ${{ needs.build-docs.result }}
        run: |
          set -euo pipefail
          COMPONENTS='[]'
          add() {
            COMPONENTS=$(jq -c --arg name "$1" --arg image "${REGISTRY}/minbzk/$2:sha-${SHA}" \
              '. + [{name: $name, image: $image}]' <<<"$COMPONENTS")
          }

          # De editor gaat als eerste in de lijst: de action leidt de
          # environment-URL af van de eerste component.
          if [ "$EDITOR" = success ]; then add editor regelrecht-editor; fi
          if [ "$ADMIN" = success ]; then add harvester-admin regelrecht-admin; fi
          if [ "$HARVESTER_WORKER" = success ]; then add harvester-worker regelrecht-harvester-worker; fi
          if [ "$ENRICH_WORKER" = success ]; then add enrichworker regelrecht-enrich-worker; fi
          if [ "$PIPELINE_API" = success ]; then add pipelineapi regelrecht-pipeline-api; fi
          # Grafana bouwt alleen op main, dus alleen productie kent deze regel.
          if [ "$GRAFANA" = success ]; then add grafana regelrecht-grafana; fi
          if [ "$LAWMAKING" = success ]; then add lawmaking regelrecht-lawmaking; fi
          if [ "$DOCS" = success ]; then add docs regelrecht-docs; fi

          jq -r '.[] | "  \(.name): \(.image)"' <<<"$COMPONENTS"
          echo "components=$COMPONENTS" >> "$GITHUB_OUTPUT"

      # Geen clone-from: regelrecht is zelf de bron waar de previews van
      # klonen. Geen domain-format: de hostnamen van productie liggen vast in
      # de bestaande config en moeten daar niet door een deploy verschuiven.
      - name: Deploy to ZAD (Production)
        id: deploy
        uses: RijksICTGilde/zad-actions/deploy@13434cd415db0cd195a2c5f12bf67645acfcb635  # v4.0.6
        with:
          api-key: ${{ secrets.RIG_API_KEY }}
          project-id: ${{ env.ZAD_PROJECT }}
          deployment-name: regelrecht
          components: ${{ steps.plan.outputs.components }}

      - name: Editor-URL voor de environment
        id: editor-url
        if: needs.build.result == 'success'
        env:
          URLS: ${{ steps.deploy.outputs.urls }}
        run: echo "url=$(jq -r '.editor // empty' <<<"$URLS")" >> "$GITHUB_OUTPUT"

      - name: Verklaar een mislukte deploy
        if: failure() && steps.deploy.outcome == 'failure'
        env:
          COMPONENTS: ${{ steps.plan.outputs.components }}
        run: |
          echo "::notice::Deploy van regelrecht mislukt voor: $(jq -r '[.[].name] | join(", ")' <<<"$COMPONENTS")"
          echo "'status: superseded' in de output hierboven betekent dat een nieuwere taak"
          echo "voor dit deployment (een volgende merge naar main) het werk heeft overgenomen."
          echo "Deze job opnieuw draaien is dan veilig."
          echo "Iets anders? Zie 'Debugging deploy-preview failures' in CLAUDE.md."

  # -- Cleanup preview --
  cleanup-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Het label eraf halen ruimt op, net als het sluiten van de PR: een preview
    # waar niemand meer naar kijkt hoort niet te blijven draaien. Sluiten ruimt
    # ook op zonder dat het label er ooit op zat, want dan valt er niets te
    # verwijderen en prunet deze job alsnog de verweesde sha-images.
    #
    # Een fork-PR heeft nooit gebouwd of gedeployd, dus er valt niets op te
    # ruimen en de GHCR-aanroepen zouden alleen maar op rechten stuklopen.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.fork != true &&
      (
        github.event.action == 'closed' ||
        (github.event.action == 'unlabeled' && github.event.label.name == 'preview')
      )
    permissions:
      packages: write
      deployments: write
      pull-requests: write

    steps:
      - name: Cleanup ZAD deployment and container images
        uses: RijksICTGilde/zad-actions/cleanup@13434cd415db0cd195a2c5f12bf67645acfcb635  # v4.0.6
        with:
          api-key: ${{ secrets.RIG_API_KEY }}
          project-id: ${{ env.ZAD_PROJECT }}
          deployment-name: pr${{ github.event.pull_request.number }}
          delete-github-env: true
          delete-github-deployments: true
          delete-container: true
          containers: >-
            [
              {"org": "${{ github.repository_owner }}", "name": "regelrecht-editor", "tag": "pr-${{ github.event.pull_request.number }}"},
              {"org": "${{ github.repository_owner }}", "name": "regelrecht-admin", "tag": "pr-${{ github.event.pull_request.number }}"},
              {"org": "${{ github.repository_owner }}", "name": "regelrecht-harvester-worker", "tag": "pr-${{ github.event.pull_request.number }}"},
              {"org": "${{ github.repository_owner }}", "name": "regelrecht-enrich-worker", "tag": "pr-${{ github.event.pull_request.number }}"},
              {"org": "${{ github.repository_owner }}", "name": "regelrecht-pipeline-api", "tag": "pr-${{ github.event.pull_request.number }}"},
              {"org": "${{ github.repository_owner }}", "name": "regelrecht-lawmaking", "tag": "pr-${{ github.event.pull_request.number }}"},
              {"org": "${{ github.repository_owner }}", "name": "regelrecht-docs", "tag": "pr-${{ github.event.pull_request.number }}"}
            ]
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-admin-token: ${{ secrets.ADMIN_TOKEN }}
          comment-header: '## Preview Deployment'

      - name: Prune orphaned SHA-tagged images
        env:
          GH_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          for PACKAGE in regelrecht-editor regelrecht-admin regelrecht-harvester-worker regelrecht-enrich-worker regelrecht-pipeline-api regelrecht-grafana regelrecht-lawmaking regelrecht-docs; do
            echo "Pruning sha-only images for $PACKAGE..."
            gh api --paginate \
              "/orgs/${{ github.repository_owner }}/packages/container/${PACKAGE}/versions" \
              --jq '.[] | select(
                (.metadata.container.tags | length == 0) or
                (.metadata.container.tags | all(startswith("sha-")))
              ) | .id' \
            2>/dev/null | while read -r VERSION_ID; do
              echo "Deleting $PACKAGE version $VERSION_ID"
              gh api --method DELETE \
                "/orgs/${{ github.repository_owner }}/packages/container/${PACKAGE}/versions/${VERSION_ID}" \
              2>/dev/null || true
            done
          done
