---
version: 2
updates:
  - package-ecosystem: cargo
    directory: /packages
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Een nieuwe versie moet vijf dagen bestaan voordat Dependabot er een PR
    # van maakt. De registry-compromitteringen van het afgelopen jaar
    # (chalk/debug, shai-hulud) werden binnen uren tot dagen ontdekt en
    # ingetrokken; met dit venster is dat gebeurd voordat de bump hier
    # binnenkomt. Security-updates vallen er buiten en komen onmiddellijk,
    # ongeacht deze instelling.
    cooldown:
      default-days: 5
    # Zonder dit gebruikt Dependabot `chore(deps-dev)` voor dev-dependencies,
    # en die scope staat niet in de lijst van `pr-title.yml` — waardoor elke
    # dev-dependency-PR op de titelcheck strandt. Eén spelling voor één
    # begrip is beter dan de scope-lijst uitbreiden: `deps` blijft dan de
    # enige term waar een toekomstig filter of changelog op hoeft te letten.
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps)
    labels:
      - dependencies
      - rust
    groups:
      opentelemetry:
        patterns:
          - opentelemetry
          - opentelemetry-*
          - opentelemetry_*
          - tracing-opentelemetry
        update-types:
          - minor
          - patch
          - major
      rust-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # chacha20poly1305 0.11 stapt over op de nieuwe RustCrypto
      # core-traits (crypto-common 0.2, aead 0.6, rand_core 0.10). Dat is
      # geen mechanische bump: `aead::OsRng` bestaat niet meer en
      # rand_core 0.10 heeft helemaal geen OsRng, dus de nonce-generatie in
      # packages/editor-api/src/crypto.rs moet met de hand een andere
      # randomness-bron krijgen (security-sensitief: nonce-hergebruik breekt
      # de versleuteling van de OAuth-tokencookie). Zolang sha2/hmac/digest
      # nog op crypto-common 0.1 zitten levert de bump alleen een dubbele
      # crypto-stack op zonder functioneel voordeel.
      # Let op: een ignore-regel onderdrukt ook Dependabot-*security*-updates
      # in het genegeerde bereik, niet alleen gewone versie-bumps. Op 0.10.1
      # staat vandaag geen advisory; komt die er wel, dan blijft `just audit`
      # (cargo-deny, blokkerende CI-job) het vangnet dat de build rood maakt.
      # Dat is meteen het signaal om deze regel te schrappen.
      # Patch-releases op de 0.10-lijn blijven welkom; minor/major pas als de
      # hele workspace in één keer meegaat.
      - dependency-name: chacha20poly1305
        update-types:
          - version-update:semver-major
          - version-update:semver-minor


  # Single entry for the root npm workspace. frontend, frontend-lawmaking and
  # packages/frontend-shared are workspace members sharing one root
  # package-lock.json (since #860). Dependabot must target the root directory so
  # it updates the member package.json *and* the root lockfile in sync;
  # targeting a member directory bumps only its package.json and leaves the root
  # lockfile out of sync, breaking `npm ci`. (/docs keeps its own lockfile and
  # has its own entry below.)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 5
    # Zie de toelichting bij het cargo-blok hierboven.
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps)
    labels:
      - dependencies
      - javascript
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Our own design package — bump manually, not via Dependabot
      - dependency-name: '@nldd/design-system'

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 5
    labels:
      - dependencies
      - docker
    ignore:
      - dependency-name: node
        versions:
          - '23'
          - '25'
          - '27'
          - '29'
          - '31'
      # The Rust image version must match rust-toolchain.toml (source of
      # truth); bump it manually together with the toolchain.
      - dependency-name: rust
        update-types:
          - version-update:semver-major
          - version-update:semver-minor


  - package-ecosystem: docker
    directory: /packages/admin
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 5
    labels:
      - dependencies
      - docker
    ignore:
      - dependency-name: node
        versions:
          - '23'
          - '25'
          - '27'
          - '29'
          - '31'
      # The Rust image version must match rust-toolchain.toml (source of
      # truth); bump it manually together with the toolchain.
      - dependency-name: rust
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  - package-ecosystem: docker
    directory: /packages/pipeline
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 5
    labels:
      - dependencies
      - docker
    ignore:
      # The Rust image version must match rust-toolchain.toml (source of
      # truth); bump it manually together with the toolchain.
      - dependency-name: rust
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 5
    # Zie de toelichting bij het cargo-blok hierboven.
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps)
    labels:
      - dependencies
      - javascript
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Our own design package — bump manually, not via Dependabot
      - dependency-name: '@nldd/design-system'

  - package-ecosystem: npm
    directory: /packages/arch-extract/ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 5
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps)
    labels:
      - dependencies
      - javascript
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 5
    labels:
      - dependencies
      - github-actions
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
