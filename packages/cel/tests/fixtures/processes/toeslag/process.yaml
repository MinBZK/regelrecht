---
# Fictief tweede proces: een maandelijkse toeslag, met meer dan een besluit
# in een zaak. Het draait op dezelfde runtime en dezelfde frontend als het
# proces van de afnemer; alleen deze configuratie en de regelingen
# verschillen. Het portaal biedt per maand een aanvraag aan (het tijdvak,
# uit het beleid). In de zaak neemt de behandelaar een voorschot, stelt na
# afloop de toeslag vast, wijzigt zo nodig die vaststelling (een eigen
# besluit, op grond van artikel 7 van de testregeling awb) en vordert terug
# wat te veel is betaald. Elk besluit wordt bekendgemaakt, met een eigen
# bezwaartermijn; het voorschot wordt betaald en het teruggevorderde
# terugbetaald. Welke handeling bij welk besluit hoort, volgt uit het
# artikel (een vervolg) of uit besluit (een feit, een wijziging).
id: test_toeslag_proces
actor: test_toeslagdienst
on_behalf_of: {regulation: testregeling_toeslag}
channels:
  persoon:
    label: Inloggen als persoon
    explanation: Vul een persoonsnummer van negen cijfers in.
    fields:
      - name: nummer
        label: Persoonsnummer
        pattern: '[0-9]{9}'
        message: een persoonsnummer heeft negen cijfers
        numeric: true
    owner: nummer
  medewerker:
    label: Inloggen als medewerker
    fields:
      - {name: naam, label: Naam}
roles:
  aanvrager: {channel: persoon, routes: [portal]}
  behandelaar: {channel: medewerker, routes: [handling], label: Behandelaar}
portal:
  cell: test_toeslag
  stream: test_toeslag_aanvragen
  event: aanvraag_ontvangen
  assessment:
    lexostatus: aanvraag
    regulation: testregeling_toeslag
    output: aanvraag_toelaatbaar
  offer:
    regulation: testbeleid_toeslag
    output: aanvraag_aangeboden
    deadline: aanvraagtermijn
    windows: aangeboden_maanden
    start: begin_maand
synthesis:
  - {cell: test_toeslag, lexostatus: aanvraag, case: true}
  - {cell: test_toeslag, lexostatus: besluiten, case: true}
handling:
  worklist: {cell: test_toeslag, lexostatus: werkvoorraad}
  actions:
    # Het voorschot: een besluit (stage BESLUIT).
    - name: voorschot
      label: Voorschot verlenen
      regulation: testregeling_toeslag
      outputs: [voorschot]
      record: {cell: test_toeslag, stream: test_toeslag_zaakverloop, event: voorschot_verleend}
    # Een latere stage van hetzelfde artikel: de bekendmaking van het
    # voorschot, met de bezwaartermijn die de haak op die stage uitrekent.
    - name: voorschot_bekendmaken
      label: Voorschot bekendmaken
      regulation: testregeling_toeslag
      outputs: [voorschot]
      record: {cell: test_toeslag, stream: test_toeslag_zaakverloop, event: besluit_bekendgemaakt}
    # De betaling voert het voorschot uit.
    - name: voorschot_betalen
      label: Voorschot betalen
      decision: voorschot
      regulation: testregeling_toeslag
      outputs: [nog_te_betalen_voorschot]
      record: {cell: test_toeslag, stream: test_toeslag_zaakverloop, event: voorschot_betaald}
    # De vaststelling: een tweede besluit in de zaak, van een eigen artikel.
    - name: vaststellen
      label: Toeslag vaststellen
      regulation: testregeling_toeslag
      outputs: [vastgestelde_toeslag]
      record: {cell: test_toeslag, stream: test_toeslag_zaakverloop, event: toeslag_vastgesteld}
    - name: vaststelling_bekendmaken
      label: Vaststelling bekendmaken
      regulation: testregeling_toeslag
      outputs: [vastgestelde_toeslag]
      record: {cell: test_toeslag, stream: test_toeslag_zaakverloop, event: besluit_bekendgemaakt}
    # De wijziging van de vaststelling: een eigen besluit met een eigen
    # grondslag, dat de vaststelling wijzigt (met een verwijzing wijzigt).
    - name: vaststelling_wijzigen
      label: Vaststelling wijzigen
      decision: vaststellen
      regulation: testregeling_toeslag
      outputs: [gewijzigde_toeslag]
      record: {cell: test_toeslag, stream: test_toeslag_zaakverloop, event: vaststelling_gewijzigd}
    - name: wijziging_bekendmaken
      label: Wijziging bekendmaken
      regulation: testregeling_toeslag
      outputs: [gewijzigde_toeslag]
      record: {cell: test_toeslag, stream: test_toeslag_zaakverloop, event: besluit_bekendgemaakt}
    # De terugvordering: een derde besluit in de zaak.
    - name: terugvorderen
      label: Terugvorderen
      regulation: testregeling_toeslag
      outputs: [terug_te_vorderen]
      record: {cell: test_toeslag, stream: test_toeslag_zaakverloop, event: terugvordering_vastgesteld}
    - name: terugvordering_bekendmaken
      label: Terugvordering bekendmaken
      regulation: testregeling_toeslag
      outputs: [terug_te_vorderen]
      record: {cell: test_toeslag, stream: test_toeslag_zaakverloop, event: besluit_bekendgemaakt}
    # De terugbetaling voert de terugvordering uit (naar Awb 4:57).
    - name: terugbetalen
      label: Terugbetaling ontvangen
      decision: terugvorderen
      regulation: testregeling_awb
      outputs: [nog_terug_te_betalen]
      record: {cell: test_toeslag, stream: test_toeslag_zaakverloop, event: terugbetaling_ontvangen}
examples:
  logins: [voorbeeld-login.json]
  application: voorbeeld-aanvraag.json
  actions:
    voorschot: voorbeeld-voorschot.json
    voorschot_bekendmaken: voorbeeld-bekendmaking.json
    voorschot_betalen: voorbeeld-voorschot-betalen.json
    vaststellen: voorbeeld-vaststelling.json
    vaststelling_bekendmaken: voorbeeld-bekendmaking.json
    vaststelling_wijzigen: voorbeeld-wijziging.json
    wijziging_bekendmaken: voorbeeld-bekendmaking.json
    terugvorderen: voorbeeld-terugvordering.json
    terugvordering_bekendmaken: voorbeeld-bekendmaking.json
    terugbetalen: voorbeeld-terugbetaling.json
