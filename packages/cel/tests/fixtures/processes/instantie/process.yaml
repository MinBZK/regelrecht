---
# Fictief proces met een portaal: de instantie toetst vóór het indienen of
# een aanvraag volledig is. Geen synthese: de toets leest alleen de
# proefreductie van het concept in de cel.
id: test_instantie_proces
actor: test_instantie
# Het portaal heeft twee kanalen: een organisatie (een nummer van acht
# cijfers) en een burger (een nummer van negen cijfers dat de elfproef
# doorstaat). Een medewerker aan het loket voert een aanvraag in die langs
# een andere weg binnenkwam, met de dag van ontvangst.
channels:
  eherkenning:
    label: Inloggen namens een organisatie
    fields:
      - {name: kvk, label: Organisatienummer, pattern: '[0-9]{8}', message: een organisatienummer heeft acht cijfers}
      - {name: persoon, label: Uw naam}
    owner: kvk
  burger:
    label: Inloggen als burger
    explanation: Vul een burgernummer van negen cijfers in.
    fields:
      - name: nummer
        label: Burgernummer
        pattern: '[0-9]{9}'
        check: elfproef
        message: dit is geen geldig burgernummer
        numeric: true
    owner: nummer
  medewerker:
    label: Inloggen als medewerker
    fields:
      - {name: naam, label: Naam}
roles:
  aanvrager: {channel: eherkenning, routes: [portal]}
  burger: {channel: burger, routes: [portal]}
  loket: {channel: medewerker, routes: [counter], label: Loketmedewerker}
portal:
  cell: test_instantie
  stream: test_aanvragen
  event: aanvraag_ontvangen
  assessment:
    lexostatus: aanvraag_inhoud
    regulation: testregeling_aanvraag
    output: aanvraag_volledig
  form:
    path: formulier.yaml
    screen: aanvraag
