---
# Fictief proces met een portaal, een synthese en een behandeling: de toets
# voegt de lexostatus van het concept (een proefreductie in de cel) samen
# met de registerstatus van de registercel (zonder url is het transport
# intern); de behandelaar ziet de werkvoorraad en rekent per zaak een
# proefbesluit uit, en doet de handelingen in een zaak: het besluit, de
# bekendmaking, een betaling en een verzoek om aanvulling. Het formulier van
# het besluit volgt uit de regeling: de parameters met origin OORDEEL.
id: test_afnemer_proces
# De actor legt vast (recording_actor); het proces handelt namens het
# bevoegd gezag van de testregeling ('Test afnemer').
actor: test_afnemer
on_behalf_of: {regulation: testregeling_afnemer}
# Twee nagebootste kanalen: een organisatie logt in met een nummer van acht
# cijfers en een naam, een medewerker met een naam.
channels:
  eherkenning:
    label: Inloggen namens een organisatie
    explanation: Vul een organisatienummer van acht cijfers in en uw naam.
    fields:
      - name: kvk
        label: Organisatienummer
        pattern: '[0-9]{8}'
        message: een organisatienummer heeft acht cijfers
        numeric: true
        legal_basis: [testregeling_register#1]   # het register kent de organisatie
      - {name: persoon, label: Uw naam}
    owner: kvk
    legal_basis: [testregeling_afnemer#1]
  medewerker:
    label: Inloggen als medewerker
    fields:
      - {name: naam, label: Naam}
roles:
  aanvrager: {channel: eherkenning, routes: [portal]}
  behandelaar: {channel: medewerker, routes: [handling], label: Behandelaar}
portal:
  cell: test_afnemer
  stream: test_afnemer_aanvragen
  event: aanvraag_ontvangen
  assessment:
    lexostatus: aanvraag_inhoud
    regulation: testregeling_afnemer
    output: aanvraag_toelaatbaar
synthesis:
  # De zaak zelf, uit de cel waarin het proces vastlegt.
  - {cell: test_afnemer, lexostatus: aanvraag_inhoud, case: true}
  - {cell: test_afnemer, lexostatus: zaakverloop, case: true}
  - {cell: test_afnemer, lexostatus: besluit, case: true}
  # De registercel spreekt de taal van haar eigen regeling; de afnemer
  # vertaalt naar de namen van zijn artikelen (synthese bij de afnemer), met
  # de grondslag van die vertaling: het artikel dat het feit vraagt en het
  # register dat het levert, voor het orgaan dat de invoer vast noemt.
  - cell: test_register
    lexostatus: register
    input:
      aanduiding: {lexostatus: aanvraag_inhoud, field: aanduiding}
      orgaan: {value: raad}
    parameters: {is_ingeschreven_in_register: is_ingeschreven_raad, is_geschrapt: is_geschrapt_raad}
    legal_basis: [testregeling_afnemer#1, testregeling_register#1]
  - cell: test_register
    lexostatus: registerstatus
    input:
      aanduiding: {lexostatus: aanvraag_inhoud, field: aanduiding}
    parameters:
      zetels_toegewezen: zetels_op_lijst
      datum_mededeling: datum_mededeling
      geblokkeerd: geblokkeerd_raad
      jaar_van_mededeling: jaar
    legal_basis: [testregeling_afnemer#1, testregeling_register#3]
handling:
  worklist: {cell: test_afnemer, lexostatus: werkvoorraad}
  actions:
    # Het besluit: een stage-decretogram (stage BESLUIT). Het formulier zijn
    # de parameters met origin OORDEEL.
    - name: besluit
      regulation: testregeling_afnemer
      outputs: [vastgesteld_bedrag, gebiedsbedrag, besluit_tijdig, besluitdeadline, zorgvuldig]
      # Synthese per regel: de gebiedstabel. De aanvraag levert de regels, de
      # kolommen die de instantie zelf vaststelt komen per regel uit een
      # andere cel.
      rows:
        - parameter: gebiedstabel
          table: {lexostatus: aanvraag_inhoud, field: gebieden}
          columns: {gebied: gebied, zetels: zetels}
          sources:
            - cell: test_register
              lexostatus: registratie_per_gebied
              input:
                aanduiding: {lexostatus: aanvraag_inhoud, field: aanduiding}
                gebied: {column: gebied}
              columns: {ingeschreven: ingeschreven}
            - cell: test_gebieden
              lexostatus: tarief
              input:
                gebied: {column: gebied}
                peildatum: {regulation: testregeling_afnemer, output: peildatum_tarief}   # de wet leidt haar af (art. 5)
              columns: {tarief: tarief}
      record: {cell: test_afnemer, stream: test_afnemer_zaakverloop, event: besluit_genomen}
    # De bekendmaking: een latere stage van hetzelfde besluit. Het formulier
    # is wat de stage vraagt; de haak op die stage rekent de bezwaartermijn uit.
    - name: bekendmaken
      outputs: [besluit_tijdig]
      regulation: testregeling_afnemer
      record: {cell: test_afnemer, stream: test_afnemer_zaakverloop, event: besluit_bekendgemaakt}
    # De betaling: een executogram, getoetst aan artikel 3 lid 1. Een
    # betaling boven het bedrag doet het proces niet uit zichzelf; gebeurde zij
    # toch, dan legt de cel haar vast en is het meerdere onverschuldigd betaald.
    - name: betalen
      decision: besluit                 # de betaling voert het besluit uit
      regulation: testregeling_awb
      outputs: [nog_te_betalen, onverschuldigd_betaald]
      record: {cell: test_afnemer, stream: test_afnemer_zaakverloop, event: betaling_verricht}
    # Een feit uit het verloop van de zaak.
    - name: aanvulling_vragen
      regulation: testregeling_awb
      outputs: [termijn_opgeschort]
      record: {cell: test_afnemer, stream: test_afnemer_zaakverloop, event: aanvulling_gevraagd}
# Standaardgegevens per handeling, voor een proefopstelling.
examples:
  logins: [voorbeeld-login.json, voorbeeld-login-ander.json]
  application: voorbeeld-aanvraag.json
  actions:
    besluit: voorbeeld-besluit.json
    bekendmaken: voorbeeld-bekendmaking.json
