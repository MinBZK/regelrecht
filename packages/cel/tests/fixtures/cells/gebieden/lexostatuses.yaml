---
# Fictieve lexostatus die alleen een kolom levert, geen parameter: het tarief
# is een kolom van de gebiedstabel van de afnemer. Daarom staat het onder
# extra_velden en gaat het nooit rechtstreeks naar de engine.
cell: test_gebieden
lexostatus_definitions:
  - name: tarief
    inputs:
      - {name: gebied, type: string}
      - {name: peildatum, type: date}
    reduction:
      chronicle: test_gebieden
      derivations: {}
      extra_fields:
        tarief:
          filter: {name: tarief_vastgesteld, gebied: $gebied, peildatum: $peildatum}
          pick: latest
          field: tarief
