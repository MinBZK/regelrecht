---
# De uitvoering van het voorschot: elke betaalde voorschottermijn. Wanneer er
# een termijn valt en hoe hoog die is, zegt de wet door haar uit te voeren:
# art. 22 Awir en het (fictieve) uitvoeringsbeleid van Toeslagen over het
# termijnbedrag. De cel voert het beleid per maand uit en legt alleen een gram
# vast als er in die maand een termijn valt. Het voorschot leest de cel uit
# haar eigen kroniek met het beleid van Toeslagen daarover
# (fictief_beleid_kroniek_toeslagen art. 1), met de aanvraag als `root`.
$id: zorgtoeslag_betalingen
recording_actor: belastingdienst_toeslagen
chronicle: toeslagen
events:
  - name: voorschottermijn_betaald
    establishes: fictief_beleid_termijnbedrag_voorschot#1
    reads: [{regulation: fictief_beleid_kroniek_toeslagen}]
