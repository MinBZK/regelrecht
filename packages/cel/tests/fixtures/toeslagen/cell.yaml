---
# Cel van de Belastingdienst/Toeslagen. Zij legt de ontvangst van een
# aanvraag om zorgtoeslag (Awir art. 15), het voorschot en de toekenning erop
# (Zorgtoeslagwet art. 2 in de procedure van de Awir), de
# betaalopdrachten voor de voorschottermijnen (Awir art. 22) en het antwoord
# van de bank erop vast als gram in haar kroniek (RFC-022).
# Wat de aanvraag, de besluiten en de termijnen bevatten, zegt de wet; zie de
# stromen.
id: toeslagen
recording_actor: belastingdienst_toeslagen   # Awir art. 14 lid 1
streams:
  - streams/zorgtoeslag_aanvragen.yaml
  - streams/zorgtoeslag_besluiten.yaml
  - streams/zorgtoeslag_betalingen.yaml
lexostatuses: lexostatuses.yaml
# De kroniek die het beleid van Toeslagen terugleest (RFC-045 §1): het
# beleidsartikel leest haar als invoer zonder bron (`source: {}`); alleen deze
# regel zegt dat die invoer de kroniek `toeslagen` van deze cel is.
registers:
  fictief_beleid_kroniek_toeslagen#kroniek:
    chronicle: toeslagen
