---
# Experiment A (niet voor productie): de lexostatus `aanvraag_inhoud` van de fictieve
# cel test_afnemer (cellen/afnemer/lexostatussen.yaml) als engine-regeling, voor de
# engine-route van de cel-runtime (koppeling.yaml naast dit bestand).
# Opgesteld met een hulpscript volgens vaste patronen per afleiding: `kies:
# laatste` is een hulpuitvoer met de hoogste `volgorde`, een veld van dat gram
# een FOREACH erop, met een IF waar een lege combine anders 0 of onwaar zou
# geven.
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.7.0/schema/v0.7.0/schema.json
$id: lexostatus_test_afnemer_aanvraag_inhoud
name: Lexostatus aanvraag inhoud, afnemer (experiment)
regulatory_layer: UITVOERINGSBELEID
publication_date: '2025-01-01'
valid_from: '2025-01-01'
url: https://example.com/lexostatus_test_afnemer_aanvraag_inhoud
articles:
  - number: '1'
    url: https://example.com/lexostatus_test_afnemer_aanvraag_inhoud/1
    text: De inhoud van de laatste aanvraag in een zaak.
    machine_readable:
      execution:
        parameters:
          - {name: wortel, type: string, required: true}
        input:
          - name: grams
            type: array
            source: {}
        output:
          - {name: latest, type: number, nullable: true}
          - {name: aanvraagdatum, type: date, nullable: true}
          - {name: bevat_aanduiding, type: boolean}
          - {name: aanduiding, type: string, nullable: true}
          - {name: gebieden, type: array, nullable: true}
        actions:
          - output: latest
            value:
              operation: FOREACH
              collection: $grams
              as: g
              filter:
                operation: AND
                conditions:
                  - {operation: EQUALS, subject: $g.type, value: submission}
                  - {operation: EQUALS, subject: $g.subtype, value: aanvraag}
                  - {operation: EQUALS, subject: $g.root, value: $root}
              body: $g.sequence
              combine: MAX
          - output: aanvraagdatum
            value:
              operation: IF
              cases:
                - when:
                    operation: FOREACH
                    collection: $grams
                    as: g
                    filter:
                      operation: AND
                      conditions:
                        - {operation: EQUALS, subject: $g.sequence, value: $latest}
                        - operation: NOT
                          value: {operation: EQUALS, subject: $g.effective_date, value: null}
                        - operation: NOT
                          value: {operation: EQUALS, subject: $g.effective_date, value: ''}
                    body: true
                    combine: OR
                  then:
                    operation: FOREACH
                    collection: $grams
                    as: g
                    filter:
                      operation: AND
                      conditions:
                        - {operation: EQUALS, subject: $g.sequence, value: $latest}
                        - operation: NOT
                          value: {operation: EQUALS, subject: $g.effective_date, value: null}
                        - operation: NOT
                          value: {operation: EQUALS, subject: $g.effective_date, value: ''}
                    body: $g.effective_date
                    combine: ADD
          - output: bevat_aanduiding
            value:
              operation: FOREACH
              collection: $grams
              as: g
              filter:
                operation: AND
                conditions:
                  - {operation: EQUALS, subject: $g.sequence, value: $latest}
                  - operation: NOT
                    value: {operation: EQUALS, subject: $g.fields.content.aanduiding, value: null}
                  - operation: NOT
                    value: {operation: EQUALS, subject: $g.fields.content.aanduiding, value: ''}
              body: true
              combine: OR
          - output: aanduiding
            value:
              operation: IF
              cases:
                - when:
                    operation: FOREACH
                    collection: $grams
                    as: g
                    filter:
                      operation: AND
                      conditions:
                        - {operation: EQUALS, subject: $g.sequence, value: $latest}
                        - operation: NOT
                          value: {operation: EQUALS, subject: $g.fields.content.aanduiding, value: null}
                        - operation: NOT
                          value: {operation: EQUALS, subject: $g.fields.content.aanduiding, value: ''}
                    body: true
                    combine: OR
                  then:
                    operation: FOREACH
                    collection: $grams
                    as: g
                    filter:
                      operation: AND
                      conditions:
                        - {operation: EQUALS, subject: $g.sequence, value: $latest}
                        - operation: NOT
                          value: {operation: EQUALS, subject: $g.fields.content.aanduiding, value: null}
                        - operation: NOT
                          value: {operation: EQUALS, subject: $g.fields.content.aanduiding, value: ''}
                    body: $g.fields.content.aanduiding
                    combine: ADD
          - output: gebieden
            value:
              operation: IF
              cases:
                - when:
                    operation: FOREACH
                    collection: $grams
                    as: g
                    filter:
                      operation: AND
                      conditions:
                        - {operation: EQUALS, subject: $g.sequence, value: $latest}
                        - operation: NOT
                          value: {operation: EQUALS, subject: $g.fields.content.gebieden, value: null}
                        - operation: NOT
                          value: {operation: EQUALS, subject: $g.fields.content.gebieden, value: ''}
                    body: true
                    combine: OR
                  then:
                    operation: FOREACH
                    collection: $grams
                    as: g
                    filter:
                      operation: AND
                      conditions:
                        - {operation: EQUALS, subject: $g.sequence, value: $latest}
                        - operation: NOT
                          value: {operation: EQUALS, subject: $g.fields.content.gebieden, value: null}
                        - operation: NOT
                          value: {operation: EQUALS, subject: $g.fields.content.gebieden, value: ''}
                    body: $g.fields.content.gebieden
                    combine: ADD
