---
# Experiment A (niet voor productie): de lexostatus `zaakverloop` van de fictieve
# cel test_afnemer (cellen/afnemer/lexostatussen.yaml) als engine-regeling, voor de
# engine-route van de cel-runtime (koppeling.yaml naast dit bestand).
# Opgesteld met een hulpscript volgens vaste patronen per afleiding: `kies:
# laatste` is een hulpuitvoer met de hoogste `volgorde`, een veld van dat gram
# een FOREACH erop, met een IF waar een lege combine anders 0 of onwaar zou
# geven.
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.7.0/schema/v0.7.0/schema.json
$id: lexostatus_test_afnemer_zaakverloop
name: Lexostatus zaakverloop, afnemer (experiment)
regulatory_layer: UITVOERINGSBELEID
publication_date: '2025-01-01'
valid_from: '2025-01-01'
url: https://example.com/lexostatus_test_afnemer_zaakverloop
articles:
  - number: '1'
    url: https://example.com/lexostatus_test_afnemer_zaakverloop/1
    text: Het verloop van een zaak.
    machine_readable:
      execution:
        parameters:
          - {name: wortel, type: string, required: true}
        input:
          - name: grams
            type: array
            source: {}
        output:
          - {name: latest_datum_uitnodiging_aanvulling, type: number, nullable: true}
          - {name: datum_uitnodiging_aanvulling, type: date, nullable: true}
          - {name: opgeschorte_dagen, type: number}
        actions:
          - output: latest_datum_uitnodiging_aanvulling
            value:
              operation: FOREACH
              collection: $grams
              as: g
              filter:
                operation: AND
                conditions:
                  - {operation: EQUALS, subject: $g.name, value: aanvulling_gevraagd}
                  - {operation: EQUALS, subject: $g.root, value: $root}
              body: $g.sequence
              combine: MAX
          - output: datum_uitnodiging_aanvulling
            value:
              operation: IF
              cases:
                - when:
                    operation: FOREACH
                    collection: $grams
                    as: g
                    filter:
                      operation: AND
                      conditions:
                        - operation: EQUALS
                          subject: $g.sequence
                          value: $latest_datum_uitnodiging_aanvulling
                        - operation: NOT
                          value: {operation: EQUALS, subject: $g.fields.datum_uitnodiging, value: null}
                        - operation: NOT
                          value: {operation: EQUALS, subject: $g.fields.datum_uitnodiging, value: ''}
                    body: true
                    combine: OR
                  then:
                    operation: FOREACH
                    collection: $grams
                    as: g
                    filter:
                      operation: AND
                      conditions:
                        - operation: EQUALS
                          subject: $g.sequence
                          value: $latest_datum_uitnodiging_aanvulling
                        - operation: NOT
                          value: {operation: EQUALS, subject: $g.fields.datum_uitnodiging, value: null}
                        - operation: NOT
                          value: {operation: EQUALS, subject: $g.fields.datum_uitnodiging, value: ''}
                    body: $g.fields.datum_uitnodiging
                    combine: ADD
          - output: opgeschorte_dagen
            value:
              operation: FOREACH
              collection: $grams
              as: g
              filter:
                operation: AND
                conditions:
                  - {operation: EQUALS, subject: $g.name, value: termijn_opgeschort}
                  - {operation: EQUALS, subject: $g.root, value: $root}
                  - operation: NOT
                    value: {operation: EQUALS, subject: $g.fields.dagen, value: null}
              body: $g.fields.dagen
              combine: ADD
