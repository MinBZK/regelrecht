---
# Experiment A (niet voor productie): de lexostatus `registratie_per_gebied` van de fictieve
# cel test_register (cellen/register/lexostatussen.yaml) als engine-regeling, voor de
# engine-route van de cel-runtime (koppeling.yaml naast dit bestand).
# Opgesteld met een hulpscript volgens vaste patronen per afleiding: `kies:
# laatste` is een hulpuitvoer met de hoogste `volgorde`, een veld van dat gram
# een FOREACH erop, met een IF waar een lege combine anders 0 of onwaar zou
# geven.
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.7.0/schema/v0.7.0/schema.json
$id: lexostatus_test_register_registratie_per_gebied
name: Lexostatus registratie per gebied (experiment)
regulatory_layer: UITVOERINGSBELEID
publication_date: '2025-01-01'
valid_from: '2025-01-01'
url: https://example.com/lexostatus_test_register_registratie_per_gebied
articles:
  - number: '1'
    url: https://example.com/lexostatus_test_register_registratie_per_gebied/1
    text: Is de aanduiding in dit gebied ingeschreven?
    machine_readable:
      execution:
        parameters:
          - {name: aanduiding, type: string, required: true}
          - {name: gebied, type: string, required: true}
        input:
          - name: grammen
            type: array
            source: {}
        output:
          - {name: ingeschreven, type: boolean}
        actions:
          - output: ingeschreven
            legal_basis: {law: Testregeling, article: '1'}
            value:
              operation: FOREACH
              collection: $grammen
              as: g
              filter:
                operation: AND
                conditions:
                  - {operation: EQUALS, subject: $g.name, value: aanduiding_ingeschreven}
                  - {operation: EQUALS, subject: $g.fields.aanduiding, value: $aanduiding}
                  - {operation: EQUALS, subject: $g.fields.gebied, value: $gebied}
              body: true
              combine: OR
