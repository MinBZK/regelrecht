---
# Fictieve testregeling: een tweede regeling waaruit artikel 2 van de
# testregeling aanvraag een invoer haalt, de procedure van een beschikking
# (RFC-008): na het besluit komt de bekendmaking, en daarna de bezwaartermijn
# (een haak op die stage), en een betaling die een besluit uitvoert.
# Artikel 6 gaat over de terugbetaling van wat bij beschikking is
# teruggevorderd (naar Awb 4:57), artikel 7 over de wijziging van een
# vaststelling (naar Awb 4:49): een eigen besluit met een eigen grondslag.
# Geen geldend recht.
$schema: >-
  https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.7.0/schema/v0.7.0/schema.json
$id: testregeling_awb
name: Testregeling verzuim
regulatory_layer: WET
bwb_id: BWBR9999951
publication_date: '2025-01-01'
valid_from: '2025-01-01'
url: https://example.com/testregeling_awb

# De procedure van een beschikking. Wat een stage pas vraagt, is in een
# eerdere stage nog niet gebeurd: bij het besluit is de bekendmaking er nog
# niet (zie besluit::stand_bij_besluit in de cel-runtime).
procedure:
  - id: beschikking
    default: true
    applies_to:
      legal_character: BESCHIKKING
    stages:
      - name: AANVRAAG
        description: De aanvrager dient de aanvraag in.
      - name: BESLUIT
        description: De instantie besluit.
      - name: BEKENDMAKING
        description: Het besluit wordt bekendgemaakt (artikel 2).
        requires:
          - {name: datum_bekendmaking, type: date}
          - {name: bekendgemaakt, type: boolean}
      - name: BEZWAAR
        description: De bezwaartermijn loopt (artikel 4).

articles:
  - number: '1'
    url: https://example.com/testregeling_awb/1
    text: Een aanvrager is in verzuim als hij meer dan nul verzuimdagen heeft.
    machine_readable:
      execution:
        parameters:
          - name: verzuimdagen
            type: number
            required: true
        output:
          - name: in_verzuim
            type: boolean
        actions:
          - output: in_verzuim
            value:
              operation: GREATER_THAN
              subject: $verzuimdagen
              value: 0
  - number: '2'
    url: https://example.com/testregeling_awb/2
    text: Een besluit is in werking als het is bekendgemaakt.
    machine_readable:
      execution:
        produces:
          legal_character: TOETS
          decision_type: GEEN_BESLUIT
        parameters:
          - name: datum_bekendmaking
            type: date
            nullable: true
            required: true
            origin: {waarde: DOSSIER, grondslag: testregeling_awb#2}
        output:
          - name: besluit_in_werking
            type: boolean
            legal_basis: {article: '2'}
        actions:
          - output: besluit_in_werking
            value:
              operation: NOT
              value:
                operation: EQUALS
                subject: $datum_bekendmaking
                value: null
  - number: '3'
    url: https://example.com/testregeling_awb/3
    text: |-
      1. Het vastgestelde bedrag wordt betaald, niet meer dan dat, en niet voordat het besluit in werking is.
      2. De dag van betaling telt.
      3. Wat boven het vastgestelde bedrag is betaald, is onverschuldigd betaald.
    machine_readable:
      execution:
        produces:
          legal_character: TOETS
          decision_type: GEEN_BESLUIT
        parameters:
          - name: vastgesteld_bedrag
            type: number
            required: true
            origin: {waarde: DOSSIER, grondslag: testregeling_awb#3 lid 1}
          - name: betaald_bedrag
            type: number
            required: true
            origin: {waarde: DOSSIER, grondslag: testregeling_awb#3 lid 1}
          - name: datum_bekendmaking
            type: date
            nullable: true
            required: true
            origin: {waarde: DOSSIER, grondslag: testregeling_awb#2}
        input:
          - name: besluit_in_werking
            type: boolean
            source:
              output: besluit_in_werking
              parameters:
                datum_bekendmaking: $datum_bekendmaking
        output:
          - name: nog_te_betalen
            type: number
          - name: betaling_conform
            type: boolean
            legal_basis: {article: '3', paragraph: '1'}
          - name: onverschuldigd_betaald
            type: number
        actions:
          - output: nog_te_betalen
            value:
              operation: MAX
              values:
                - 0
                - operation: SUBTRACT
                  values:
                    - $vastgesteld_bedrag
                    - $betaald_bedrag
          - output: onverschuldigd_betaald
            value:
              operation: MAX
              values:
                - 0
                - operation: SUBTRACT
                  values:
                    - $betaald_bedrag
                    - $vastgesteld_bedrag
          - output: betaling_conform
            value:
              operation: AND
              conditions:
                - operation: EQUALS
                  subject: $besluit_in_werking
                  value: true
                - operation: LESS_THAN_OR_EQUAL
                  subject: $betaald_bedrag
                  value: $vastgesteld_bedrag
  - number: '4'
    url: https://example.com/testregeling_awb/4
    text: |-
      1. De bezwaartermijn vangt aan op de dag na de bekendmaking van een beschikking en duurt zes weken.
    machine_readable:
      hooks:
        - hook_point: post_actions
          applies_to:
            legal_character: BESCHIKKING
            stage: BEKENDMAKING
      execution:
        produces:
          legal_character: TOETS
          decision_type: GEEN_BESLUIT
        parameters:
          - name: datum_bekendmaking
            type: date
            required: true
          - name: bekendgemaakt
            type: boolean
            required: true
        output:
          - name: aanvang_bezwaartermijn
            type: date
            nullable: true
          - name: einde_bezwaartermijn
            type: date
            nullable: true
        actions:
          - output: aanvang_bezwaartermijn
            value:
              operation: IF
              cases:
                - when: {operation: EQUALS, subject: $bekendgemaakt, value: true}
                  then: {operation: DATE_ADD, date: $datum_bekendmaking, days: 1}
              default: null
          - output: einde_bezwaartermijn
            value:
              operation: IF
              cases:
                - when: {operation: EQUALS, subject: $bekendgemaakt, value: true}
                  then: {operation: DATE_ADD, date: $datum_bekendmaking, days: 42}
              default: null
  - number: '5'
    url: https://example.com/testregeling_awb/5
    text: De termijn is opgeschort zolang de instantie om een aanvulling heeft gevraagd.
    machine_readable:
      execution:
        produces:
          legal_character: TOETS
          decision_type: GEEN_BESLUIT
        parameters:
          - name: datum_uitnodiging_aanvulling
            type: date
            nullable: true
            required: true
            origin: {waarde: DOSSIER, grondslag: testregeling_awb#5}
        output:
          - name: termijn_opgeschort
            type: boolean
        actions:
          - output: termijn_opgeschort
            value:
              operation: NOT
              value:
                operation: EQUALS
                subject: $datum_uitnodiging_aanvulling
                value: null
  - number: '6'
    url: https://example.com/testregeling_awb/6
    text: |-
      1. Wat onverschuldigd is betaald, kan bij beschikking worden teruggevorderd.
      2. De terugbetaling geschiedt overeenkomstig die beschikking, niet meer dan het teruggevorderde bedrag.
      3. De dag van terugbetaling telt.
    machine_readable:
      execution:
        produces:
          legal_character: TOETS
          decision_type: GEEN_BESLUIT
        parameters:
          - name: terug_te_betalen
            type: number
            required: true
            origin: {waarde: DOSSIER, grondslag: testregeling_awb#6 lid 2}
          - name: terugbetaald
            type: number
            required: true
            origin: {waarde: DOSSIER, grondslag: testregeling_awb#6 lid 2}
        output:
          - name: nog_terug_te_betalen
            type: amount
            type_spec: {unit: eurocent}
          - name: terugbetaling_conform
            type: boolean
            legal_basis: {article: '6', paragraph: '2'}
        actions:
          - output: nog_terug_te_betalen
            value:
              operation: MAX
              values:
                - 0
                - operation: SUBTRACT
                  values: [$terug_te_betalen, $terugbetaald]
          - output: terugbetaling_conform
            value: {operation: LESS_THAN_OR_EQUAL, subject: $terugbetaald, value: $terug_te_betalen}
  - number: '7'
    url: https://example.com/testregeling_awb/7
    text: >-
      1. Een vaststelling kan worden gewijzigd op grond van feiten of
      omstandigheden waarvan het bestuursorgaan bij de vaststelling
      redelijkerwijs geen kennis kon hebben.
    machine_readable:
      execution:
        produces:
          legal_character: TOETS
          decision_type: GEEN_BESLUIT
        parameters:
          - name: nieuwe_feiten
            type: boolean
            required: false
        output:
          - name: vaststelling_te_wijzigen
            type: boolean
            legal_basis: {article: '7', paragraph: '1'}
        actions:
          - output: vaststelling_te_wijzigen
            value: {operation: EQUALS, subject: $nieuwe_feiten, value: true}
