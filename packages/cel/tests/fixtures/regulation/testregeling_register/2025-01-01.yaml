---
# Fictieve testregeling voor een register. Geen geldend recht.
# De parameters heten per artikel generiek (is_ingeschreven_in_register), in
# de taal van deze regeling. De registercel levert ze onder die naam; een
# afnemer vraagt ze onder een eigen naam (testregeling_afnemer), en de
# vertaling staat in de synthese van zijn proces.
$schema: >-
  https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.7.0/schema/v0.7.0/schema.json
$id: testregeling_register
name: Testregeling register
regulatory_layer: WET
bwb_id: BWBR9999952
publication_date: '2025-01-01'
valid_from: '2025-01-01'
url: https://example.com/testregeling_register

articles:
  - number: '1'
    url: https://example.com/testregeling_register/1
    text: >-
      1. De registerhouder houdt per orgaan een register van aanduidingen bij.
      Een aanduiding is geregistreerd als zij in het register is ingeschreven
      en niet is geschrapt.
    machine_readable:
      execution:
        parameters:
          - name: is_ingeschreven_in_register
            type: boolean
            required: true
          - name: is_geschrapt
            type: boolean
            required: true
        output:
          - name: aanduiding_geregistreerd
            type: boolean
        actions:
          - output: aanduiding_geregistreerd
            value:
              operation: AND
              conditions:
                - operation: EQUALS
                  subject: $is_ingeschreven_in_register
                  value: true
                - operation: EQUALS
                  subject: $is_geschrapt
                  value: false
  - number: '2'
    url: https://example.com/testregeling_register/2
    text: >-
      De registerhouder stelt de uitslag vast en maakt haar openbaar: de
      zetels die aan een lijst zijn toegewezen.
    machine_readable:
      execution:
        parameters:
          - name: uitslag_openbaar
            type: boolean
            required: true
          - name: zetels_toegewezen
            type: number
            required: false
        output:
          - name: uitslag_bekend
            type: boolean
        actions:
          - output: uitslag_bekend
            value:
              operation: EQUALS
              subject: $uitslag_openbaar
              value: true
  - number: '3'
    url: https://example.com/testregeling_register/3
    text: >-
      De registerhouder deelt de registraties mee, en zegt daarbij voor welke
      organen de doorwerking is geblokkeerd.
    machine_readable:
      execution:
        parameters:
          - name: datum_mededeling
            type: date
            required: true
          - name: geblokkeerd
            type: boolean
            required: true
          - name: jaar_van_mededeling
            type: number
            required: false
        output:
          - name: doorwerking
            type: boolean
        actions:
          - output: doorwerking
            value:
              operation: EQUALS
              subject: $geblokkeerd
              value: false
