---
# Fictief uitvoeringsbeleid bij de testregeling maandtoeslag: welke maanden
# het portaal aanbiedt en wanneer een maand begint. Wat het portaal aanbiedt
# is beleid (de ruimte die Awb 4:2 lid 1 de dienst laat), geen configuratie.
# Het tijdvak is een maand, als de eerste dag ervan (RFC-001:
# temporal.period_type month). Artikel 4 en 5: wat het portaal bij een
# aanvraag vastlegt en vooraf invult (notitie "het gram uit de wet").
# Artikel 6: de kanalen van de dienst (RFC-047). Geen geldend recht.
$schema: >-
  https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.8.0/schema/v0.8.0/schema.json
$id: testbeleid_toeslag
name: Testbeleid maandtoeslag
regulatory_layer: UITVOERINGSBELEID
publication_date: '2025-01-01'
valid_from: '2025-01-01'
url: https://example.com/testbeleid_toeslag
competent_authority:
  name: De Toeslagdienst van Voorbeeld

articles:
  - number: '1'
    url: https://example.com/testbeleid_toeslag/1
    text: >-
      1. De dienst biedt de aanvraag aan voor een maand vanaf januari 2025.
      2. De aanvraag wordt gedaan voor het einde van de maand die op die
      maand volgt.
    machine_readable:
      execution:
        produces:
          legal_character: TOETS
          decision_type: GEEN_BESLUIT
        parameters:
          - name: maand
            type: date
            required: false
            temporal: {type: period, period_type: month}
            origin: {waarde: BELANGHEBBENDE, grondslag: testregeling_toeslag#1, rol: TIJDVAK}
        output:
          - name: aanvraag_aangeboden
            type: boolean
          - name: aanvraagtermijn
            type: date
        actions:
          - output: aanvraag_aangeboden
            value:
              operation: GREATER_THAN_OR_EQUAL
              subject: $maand
              value: {operation: DATE, year: 2025, month: 1, day: 1}
          - output: aanvraagtermijn
            value:
              operation: DATE_ADD
              date: $maand
              months: 2
              days: -1
  - number: '2'
    url: https://example.com/testbeleid_toeslag/2
    text: >-
      Het portaal biedt de lopende maand aan en de twee maanden die erop volgen.
    machine_readable:
      execution:
        output:
          - name: aangeboden_maanden
            type: array
        actions:
          - output: aangeboden_maanden
            value:
              operation: FOREACH
              collection: [0, 1, 2]
              as: verder
              body:
                operation: DATE_ADD
                date:
                  operation: DATE
                  year: $referencedate.year
                  month: $referencedate.month
                  day: 1
                months: $verder
  - number: '3'
    url: https://example.com/testbeleid_toeslag/3
    text: Een maand begint op de eerste dag ervan.
    machine_readable:
      execution:
        parameters:
          - name: maand
            type: date
            required: false
            temporal: {type: period, period_type: month}
            origin: {waarde: BELANGHEBBENDE, grondslag: testregeling_toeslag#1, rol: TIJDVAK}
        output:
          - name: begin_maand
            type: date
        actions:
          - output: begin_maand
            value: $maand
  - number: '4'
    url: https://example.com/testbeleid_toeslag/4
    text: |-
      1. Wie via het portaal een maandtoeslag aanvraagt, ondertekent de aanvraag met het persoonsnummer waarmee hij inlogt.
      2. Het portaal legt bij de aanvraag vast met welk persoonsnummer is ingelogd en langs welke weg de aanvraag binnenkwam.
    machine_readable:
      executes:
        - {article: testregeling_toeslag#1}
      origins:
        - regulation: testregeling_awb
          parameter: ondertekening
          origin: {waarde: KANAAL, grondslag: testbeleid_toeslag#4 lid 1}
      execution:
        produces:
          legal_character: TOETS
          decision_type: GEEN_BESLUIT
          extensions:
            chronolex:
              establishes:
                - extends: aanvraag_ontvangen
                  legal_basis: [testbeleid_toeslag#4 lid 2]
                  fields:
                    persoonsnummer: {type: string, origin: {waarde: KANAAL, grondslag: testbeleid_toeslag#4 lid 2}}
                    kanaal: {type: string, origin: {waarde: KANAAL, grondslag: testbeleid_toeslag#4 lid 2}}
              # Wat het kanaal persoon bij een aanvraag levert: de ondertekening
              # en het persoonsnummer uit de login (lid 1 en 2), en de weg (lid 2).
              supplies:
                persoon: {ondertekening: nummer, persoonsnummer: nummer, kanaal: $channel}
  - number: '5'
    url: https://example.com/testbeleid_toeslag/5
    text: >-
      De dienst vult de naam van de aanvrager vooraf in uit het personenregister,
      met het persoonsnummer waarmee hij inlogt. Kent het register hem niet, dan
      vult de aanvrager zijn naam zelf in.
    # Het personenregister is hier een vaste tabel: de fixture heeft geen
    # register, en het gaat om de vorm (notitie "het gram uit de wet", besluit
    # 3 van 29-09: herkomst per keer).
    machine_readable:
      execution:
        produces:
          legal_character: TOETS
          decision_type: GEEN_BESLUIT
          extensions:
            chronolex:
              establishes:
                - extends: aanvraag_ontvangen
                  prefill: {naam_aanvrager: {output: naam_in_personenregister}}
        parameters:
          - {name: persoonsnummer, type: string, required: true}
        output:
          - {name: naam_in_personenregister, type: string, nullable: true}
        actions:
          - output: naam_in_personenregister
            value:
              operation: IF
              cases:
                - when: {operation: EQUALS, subject: $persoonsnummer, value: '123456789'}
                  then: A. Voorbeeld
              default: null
  - number: '6'
    url: https://example.com/testbeleid_toeslag/6
    text: |-
      1. Het publieke portaal is het kanaal persoon. Wie daar inlogt, doet dat met zijn persoonsnummer en
      vraagt er de maandtoeslag van artikel 1 van de testregeling aan, die vooraf wordt getoetst.
      2. Het behandelportaal is het kanaal medewerker.
    machine_readable:
      executes:
        - {article: testregeling_toeslag#1}
      execution:
        produces:
          legal_character: TOETS
          decision_type: GEEN_BESLUIT
          extensions:
            chronolex:
              channels:
                persoon:
                  kind: portal
                  role: aanvrager
                  identifies: [nummer]
                  owner: persoonsnummer
                  submits: testregeling_toeslag#1
                  assesses: {output: aanvraag_toelaatbaar}
                  offers:
                    regulation: testbeleid_toeslag
                    output: aanvraag_aangeboden
                    deadline: aanvraagtermijn
                    windows: aangeboden_maanden
                    start: begin_maand
                  legal_basis: [testbeleid_toeslag#4 lid 1, testbeleid_toeslag#4 lid 2]
                medewerker: {kind: handling, role: behandelaar}
