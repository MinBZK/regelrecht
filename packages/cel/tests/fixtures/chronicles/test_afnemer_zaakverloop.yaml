---
# Fictieve teststroom: het verloop van een zaak bij de afnemer, in dezelfde
# kroniek als de aanvraag. Elk event volgt de zaak die de aanvraag opende.
# Het besluit zelf is een stage-decretogram (stage BESLUIT); de werkvoorraad
# laat een zaak met zo'n gram weg.
$id: test_afnemer_zaakverloop
recording_actor: test_afnemer
chronicle: test_afnemer
events:
  - name: aanvulling_gevraagd
    intake: behandelaar
    grondslag:
      - testregeling_afnemer#3
    type: executogram
    zaak: volgt
    fields:
      datum_uitnodiging: $external.datum_uitnodiging
  - name: termijn_opgeschort
    intake: behandelaar
    grondslag:
      - testregeling_afnemer#3
    type: executogram
    zaak: volgt
    fields:
      dagen: $external.dagen
  - name: besluit_genomen
    intake: behandelaar
    grondslag:
      - testregeling_afnemer#3
    type: decretogram
    stage: BESLUIT
    zaak: volgt
    fields:
      vastgesteld_bedrag: $external.vastgesteld_bedrag
    niet_gereduceerd:
      - veld: vastgesteld_bedrag
        reden: de uitkomst van het besluit zelf; de werkvoorraad leest alleen dat er een besluit is
