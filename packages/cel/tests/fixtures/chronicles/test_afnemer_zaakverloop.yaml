---
# Fictieve teststroom: het verloop bij de afnemer, in dezelfde kroniek als de
# aanvraag. Elk event verwijst naar de aanvraag of naar het besluit.
# Het besluit zelf is een stage-decretogram (stage BESLUIT); de werkvoorraad
# laat een zaak met zo'n gram weg. Het op_moment van het besluit is de
# besluitdatum. Daarna: de bekendmaking (stage BEKENDMAKING, een handeling),
# met de bezwaartermijn die de haak op die stage uitrekent, en de betaling
# (een executogram dat het besluit uitvoert). Het besluit verwijst naar de
# aanvraag (op_aanvraag); de bekendmaking en de betaling naar het besluit.
$id: test_afnemer_zaakverloop
recording_actor: test_afnemer
chronicle: test_afnemer
events:
  - name: aanvulling_gevraagd
    intake: medewerker
    legal_basis:
      - testregeling_afnemer#3
    type: executogram
    refers_to: {application: {to: aanvraag_ontvangen, required: true}}
    fields:
      datum_uitnodiging: $external.datum_uitnodiging
  - name: termijn_opgeschort
    intake: medewerker
    legal_basis:
      - testregeling_afnemer#3
    type: executogram
    refers_to: {application: {to: aanvraag_ontvangen, required: true}}
    fields:
      dagen: $external.dagen
  - name: besluit_genomen
    intake: medewerker
    legal_basis:
      - testregeling_afnemer#3 lid 1   # het besluit, niet de tijdigheid (lid 2)
    type: decretogram
    stage: BESLUIT
    refers_to: {on_application: {to: aanvraag_ontvangen, required: true}}
    effective_at:                         # de dag van het besluit, niet die van het vastleggen
      source: $external.besluitdatum
      legal_basis: [testregeling_afnemer#3 lid 1]
    fields:                            # de uitkomsten van het besluit
      vastgesteld_bedrag: $external.vastgesteld_bedrag
      gebiedsbedrag: $external.gebiedsbedrag
      besluit_tijdig: $external.besluit_tijdig
      besluitdeadline: $external.besluitdeadline
      zorgvuldig: $external.zorgvuldig
    not_reduced:
      - {field: gebiedsbedrag, reason: uitkomst van het besluit}
      - {field: besluit_tijdig, reason: uitkomst van het besluit}
      - {field: besluitdeadline, reason: uitkomst van het besluit}
      - {field: zorgvuldig, reason: uitkomst van het besluit}
  - name: besluit_bekendgemaakt
    intake: medewerker
    legal_basis:
      - testregeling_awb#2
    type: act
    subtype: bekendmaking
    stage: BEKENDMAKING
    refers_to: {decision: {to: {stage: BESLUIT}, required: true}}
    effective_at:
      source: $external.datum_bekendmaking
      legal_basis: [testregeling_awb#2]
    fields:                            # wat de stage vraagt, en wat zij uitrekent
      datum_bekendmaking: $external.datum_bekendmaking
      bekendgemaakt: $external.bekendgemaakt
      besluit_tijdig: $external.besluit_tijdig
      aanvang_bezwaartermijn: $external.aanvang_bezwaartermijn
      einde_bezwaartermijn: $external.einde_bezwaartermijn
    not_reduced:
      - {field: bekendgemaakt, reason: feit van de bekendmaking; het vervolg leest het uit het formulier}
      - {field: besluit_tijdig, reason: uitkomst van het besluit in de stage BEKENDMAKING}
  - name: betaling_verricht
    intake: medewerker
    legal_basis:
      - testregeling_awb#3 lid 1
    type: executogram
    subtype: betaling
    refers_to: {decision: {to: {stage: BESLUIT}, required: true}}
    effective_at:
      source: $external.datum_betaling
      legal_basis: [testregeling_awb#3 lid 2]
    fields:
      bedrag: $external.bedrag
