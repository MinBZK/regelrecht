---
# Fictieve teststroom: een afnemer ontvangt een aanvraag die een aanduiding
# noemt. Welke registerfeiten bij die aanduiding horen, vraagt de toets aan
# de registercel (synthese); de stroom legt ze niet vast.
$id: test_afnemer_aanvragen
recording_actor: test_afnemer
chronicle: test_afnemer
events:
  - name: aanvraag_ontvangen
    intake: portaal
    legal_basis:
      - testregeling_afnemer#1
    type: submission
    subtype: aanvraag
    stage: AANVRAAG                # RFC-008: de aanvraag opent de zaak
    fields:
      core:
        aanvrager:
          naam: $external.naam
          adres: $external.adres
        dagtekening: $external.dagtekening
        gevraagde_beschikking: testbeschikking, testregeling afnemer artikel 1
        signed_via:
          kanaal: $intake.channel
          kvk_nummer: $intake.eherkenning.kvk
          gemachtigde: $intake.eherkenning.persoon
      content:
        aanduiding: $external.aanduiding
        gebieden:                      # de regels van de gebiedstabel (artikel 3)
          table: $external.gebieden
          columns: [gebied, zetels]
    not_reduced:
      - {field: core, reason: de vaste kern van een aanvraag; geen artikel van de testregeling leest haar}
