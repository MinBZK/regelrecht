---
# Fictieve teststroom: het verloop van een toeslag. Op een aanvraag volgen
# hier meer besluiten, elk een eigen event met een eigen grondslag, en elk
# een eigen gram met een eigen id dat op de aanvraag verwijst (op_aanvraag):
# het voorschot, de vaststelling en de terugvordering. Een tweede
# vaststelling op dezelfde aanvraag weigert de cel; de wijziging van een
# vaststelling is een eigen besluit met een eigen grondslag, dat met wijzigt
# naar dat besluit verwijst (Awb 4:49). De bekendmaking is een event voor elk
# besluit: zij verwijst met besluit naar het besluit dat zij bekendmaakt, en
# elk besluit wordt een keer bekendgemaakt. De betaling van het voorschot en
# de terugbetaling verwijzen naar het besluit dat zij uitvoeren.
$id: test_toeslag_zaakverloop
recording_actor: test_toeslagdienst
chronicle: test_toeslag
events:
  - name: voorschot_verleend
    intake: behandelaar
    legal_basis:
      - testregeling_toeslag#2 lid 1
    type: decretogram
    subtype: voorschot
    stage: BESLUIT
    refers_to: {on_application: {to: aanvraag_ontvangen, required: true}}
    effective_at:
      source: $external.voorschotdatum
      legal_basis: [testregeling_toeslag#2 lid 1]
    fields:
      voorschot: $external.voorschot
  - name: toeslag_vastgesteld
    intake: behandelaar
    legal_basis:
      - testregeling_toeslag#3 lid 1
    type: decretogram
    subtype: vaststelling
    stage: BESLUIT
    refers_to: {on_application: {to: aanvraag_ontvangen, required: true}}
    effective_at:
      source: $external.vaststellingsdatum
      legal_basis: [testregeling_toeslag#3 lid 1]
    fields:
      vastgestelde_toeslag: $external.vastgestelde_toeslag
  - name: vaststelling_gewijzigd
    intake: behandelaar
    legal_basis:
      - testregeling_toeslag#4 lid 1
      - testregeling_awb#7 lid 1
    type: decretogram
    subtype: vaststelling
    stage: BESLUIT
    refers_to: {amends: {to: {stage: BESLUIT}, required: true}}
    effective_at:
      source: $external.wijzigingsdatum
      legal_basis: [testregeling_toeslag#4 lid 1]
    fields:
      vastgestelde_toeslag: $external.gewijzigde_toeslag   # de toeslag zoals zij nu is vastgesteld
  - name: terugvordering_vastgesteld
    intake: behandelaar
    legal_basis:
      - testregeling_toeslag#5 lid 1
      - testregeling_awb#6 lid 1
    type: decretogram
    subtype: terugvordering
    stage: BESLUIT
    refers_to: {on_application: {to: aanvraag_ontvangen, required: true}}
    effective_at:
      source: $external.terugvorderingsdatum
      legal_basis: [testregeling_toeslag#5 lid 1]
    fields:
      terug_te_vorderen: $external.terug_te_vorderen
  - name: besluit_bekendgemaakt
    intake: behandelaar
    legal_basis:
      - testregeling_awb#2
    type: act
    subtype: bekendmaking
    stage: BEKENDMAKING
    refers_to: {decision: {to: {stage: BESLUIT}, required: true}}
    effective_at:
      source: $external.datum_bekendmaking
      legal_basis: [testregeling_awb#2]
    fields:
      datum_bekendmaking: $external.datum_bekendmaking
      bekendgemaakt: $external.bekendgemaakt
      aanvang_bezwaartermijn: $external.aanvang_bezwaartermijn
      einde_bezwaartermijn: $external.einde_bezwaartermijn
    not_reduced:
      - {field: datum_bekendmaking, reason: feit van de bekendmaking; het vervolg leest het uit het formulier}
      - {field: bekendgemaakt, reason: feit van de bekendmaking; het vervolg leest het uit het formulier}
      - {field: aanvang_bezwaartermijn,
         reason: uitkomst van de haak op de bekendmaking; het zaakscherm leest haar per besluit}
      - {field: einde_bezwaartermijn, reason: uitkomst van de haak op de bekendmaking; het zaakscherm leest haar per besluit}
  - name: voorschot_betaald
    intake: behandelaar
    legal_basis:
      - testregeling_toeslag#8 lid 1
    type: executogram
    subtype: betaling
    refers_to: {decision: {to: {stage: BESLUIT}, required: true}}
    effective_at:
      source: $external.datum_betaling
      legal_basis: [testregeling_toeslag#8 lid 2]
    fields:
      bedrag: $external.bedrag
  - name: terugbetaling_ontvangen
    intake: behandelaar
    legal_basis:
      - testregeling_awb#6 lid 2
    type: executogram
    subtype: terugbetaling
    refers_to: {decision: {to: {stage: BESLUIT}, required: true}}
    effective_at:
      source: $external.datum_terugbetaling
      legal_basis: [testregeling_awb#6 lid 3]
    fields:
      bedrag: $external.bedrag
