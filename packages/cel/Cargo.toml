[package]
name = "regelrecht-cel"
version = "0.1.0"
edition = "2021"
authors = ["MinBZK <noreply@minbzk.nl>"]
description = "Een cel die feiten uit de wet vastlegt in een kroniek (chronolex, RFC-022): de aanvraag en het besluit erop"
license = "EUPL-1.2"
repository = "https://github.com/MinBZK/regelrecht"
publish = false

[dependencies]
regelrecht-engine = { path = "../engine" }
regelrecht-law-model = { path = "../law-model" }
chrono.workspace = true
