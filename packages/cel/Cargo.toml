serde_json.workspace = true
serde_yaml_ng.workspace = true
thiserror.workspace = true
uuid = { workspace = true, features = ["v7"] }
walkdir.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
