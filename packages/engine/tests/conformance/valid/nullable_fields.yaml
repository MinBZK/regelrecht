---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.5.8/schema/v0.5.8/schema.json
$id: test_conformance_nullable
regulatory_layer: MINISTERIELE_REGELING
publication_date: '2026-09-09'
valid_from: '2026-09-09'
bwb_id: BWBR0099998
name: Testregeling nullable velden
url: https://example.invalid/law
articles:
  - number: '1'
    text: Een parameter, een input en een output die afwezig mogen zijn (RFC-036).
    url: https://example.invalid/law/artikel/1
    machine_readable:
      execution:
        parameters:
          - name: toeslagpartner
            type: string
            required: false
            nullable: true
        input:
          - name: huur
            type: amount
            nullable: true
            source: {}
        output:
          - name: heeft_toeslagpartner
            type: boolean
          - name: huurklasse
            type: string
            nullable: true
        actions:
          # The suite strips `null` from the re-serialized model before it
          # re-validates, so this fixture tests the flag without a `null`
          # literal: the absence test itself lives in bdd/conformance.
          - output: heeft_toeslagpartner
            value:
              operation: EQUALS
              subject: $toeslagpartner
              value: ja
          - output: huurklasse
            value:
              operation: IF
              cases:
                - when:
                    operation: EQUALS
                    subject: $huur
                    value: 50000
                  then: hoog
