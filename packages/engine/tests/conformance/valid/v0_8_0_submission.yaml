---
# Tier C: an article that establishes a submission (RFC-046), a decision that
# is taken on it, a hook that applies to every such submission, and a hook
# that applies only to the submission of article 1 (`established_by`).
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.8.0/schema/v0.8.0/schema.json
$id: test_conformance_submission
regulatory_layer: WET
publication_date: '2025-01-01'
bwb_id: BWBR0123457
url: https://example.invalid/submission
articles:
  - number: '1'
    url: https://example.invalid/submission/1
    text: De vereniging kan een bijdrage aanvragen.
    machine_readable:
      execution:
        produces:
          legal_character: TOETS
          submission:
            kind: AANVRAAG
        output:
          - name: aangevraagd
            type: boolean
        actions:
          - output: aangevraagd
            value: true
  - number: '2'
    url: https://example.invalid/submission/2
    text: De instantie besluit op de aanvraag.
    machine_readable:
      execution:
        produces:
          legal_character: BESCHIKKING
          decides_on:
            - test_conformance_submission#1
        output:
          - name: bijdrage
            type: number
        actions:
          - output: bijdrage
            value: 100
  - number: '3'
    url: https://example.invalid/submission/3
    text: Een aanvraag om een beschikking wordt gedagtekend.
    machine_readable:
      hooks:
        - hook_point: post_actions
          applies_to:
            submission: AANVRAAG
            decided_by: BESCHIKKING
      execution:
        output:
          - name: gedagtekend
            type: boolean
        actions:
          - output: gedagtekend
            value: true
  - number: '4'
    url: https://example.invalid/submission/4
    text: Wie de bijdrage aanvraagt, geeft het rekeningnummer op.
    machine_readable:
      hooks:
        - hook_point: pre_actions
          applies_to:
            submission: AANVRAAG
            established_by: test_conformance_submission#1
      execution:
        output:
          - name: rekening_gevraagd
            type: boolean
        actions:
          - output: rekening_gevraagd
            value: true
