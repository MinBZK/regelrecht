      schema staat daarvoor alleen `year` en `month` toe: een weekbegin zou
      een conventie vergen die geen wettekst oplegt. Het model leest de
      eenheid als vrije string; de engine benoemt de fout pas op runtime,
      zoals bij DATE_PART.
