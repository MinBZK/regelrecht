regulatory_layer: WET
bwb_id: BWBR9999911
publication_date: '2025-01-01'
valid_from: '2025-01-01'
url: https://example.invalid/law
articles:
  - number: '1'
    text: >-
      De buitenste AND is welgevormd en de binnenste vergelijking noemt geen
      waarde. De untagged fallback laat de kapotte vergelijking dan als
      letterlijk object in de AND landen, waar een niet-leeg object als waar
      telt: de ontbrekende leeftijdstoets geldt als voldaan, zonder fout en
      zonder spoor in de trace.
    url: https://example.invalid/law/artikel/1
    machine_readable:
      execution:
        parameters:
          - name: leeftijd
            type: number
          - name: is_ingezetene
            type: boolean
        output:
          - name: heeft_recht
            type: boolean
        actions:
          - output: heeft_recht
            value:
              operation: AND
              conditions:
                - $is_ingezetene
                - operation: GREATER_THAN_OR_EQUAL
                  subject: $leeftijd
