# A marking without a reason states a wish: resolved_by follows from the
# diagnosis and the diagnosis cannot be read back out of it, so a gap somebody
# examined would look like a gap nobody opened. The schema rejects this; so
# must the model.
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.6.0/schema/v0.6.0/schema.json
$id: test_conformance_marking_no_reason
regulatory_layer: WET
publication_date: '2025-01-01'
bwb_id: BWBR0123459
url: https://example.invalid/law
articles:
  - number: '1'
    text: Een testartikel.
    url: https://example.invalid/law/artikel/1
    machine_readable:
      markings:
        - about: kwantificatie over de leden van het huishouden
          resolution: model
          resolved_by: een vorm voor een regel over een verzameling
          target: []
          legal_text_excerpt: de leden van het huishouden
