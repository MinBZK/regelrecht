# A void says the entitlement does not arise at all, which is a heavier claim
# than replacing its value: with an entitlement of zero there is a decision
# carrying legal remedies and a ground for recovery, and with none there is
# neither (RFC-027). The one thing a person is owed in return is the words that
# exclude them, so `voids: true` without `legal_text_excerpt` is the shape that
# must not be expressible. A replacement needs no such quotation and stays
# valid without one. The schema rejects this; so must the model.
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.7.0/schema/v0.7.0/schema.json
$id: test_conformance_void_no_excerpt
regulatory_layer: WET
publication_date: '2025-01-01'
bwb_id: BWBR0123459
url: https://example.invalid/law
articles:
  - number: '3'
    text: In afwijking van artikel 2 bestaat geen aanspraak.
    url: https://example.invalid/law/artikel/3
    machine_readable:
      overrides:
        - law: test_conformance_void_no_excerpt
          article: '2'
          output: aanspraak
          voids: true
