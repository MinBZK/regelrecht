---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.8.0/schema/v0.8.0/schema.json
$id: test_conformance_hook_established_by_with_paragraph
regulatory_layer: UITVOERINGSBELEID
publication_date: '2025-01-01'
valid_from: '2025-01-01'
url: https://example.invalid/law
articles:
  - number: '1'
    text: >-
      `applies_to.established_by` names the article that establishes the
      submission, `<regulation>#<article>` (articleReference). With a
      paragraph it is never the key of an establishing article, so the hook
      would never fire: the schema refuses the pattern and the model refuses
      it while reading (`optional_article_reference` in `model.rs`).
    url: https://example.invalid/law/artikel/1
    machine_readable:
      hooks:
        - hook_point: pre_actions
          applies_to:
            submission: AANVRAAG
            established_by: wet_bijdrage#1 lid 1
      execution:
        output:
          - name: gevraagd
            type: boolean
        actions:
          - output: gevraagd
            value: true
