articles:
  - number: '1'
    text: >-
      De actie berekent een bedrag en noemt geen naam om het onder op te
      bergen. Het schema eist `output`; het model heeft het veld als `Option`,
      omdat het ook bestanden moet lezen die van vóór dat veld zijn. De
      uitvoering weigert de actie sinds de berekening anders zonder fout en
      zonder spoor in de trace zou verdwijnen, met de aangekondigde uitvoer
      afwezig in het resultaat.
    url: https://example.invalid/law/artikel/1
    machine_readable:
      execution:
        parameters:
          - name: grondslag
            type: amount
        output:
          - name: bedrag
            type: amount
        actions:
          - value: $grondslag
