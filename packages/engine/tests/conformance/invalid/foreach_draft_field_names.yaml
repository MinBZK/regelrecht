---
# Earlier drafts of RFC-016 wrote FOREACH with subject/value/where. The schema
# has never allowed those names (foreachOperation is additionalProperties:
# false), so the model must reject them too. Accepting them as aliases would
# make the engine execute a document `just validate` refuses.
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.5.7/schema/v0.5.7/schema.json
$id: test_conformance_foreach_draft_names
regulatory_layer: WET
publication_date: '2025-01-01'
bwb_id: BWBR0123457
url: https://example.invalid/law
articles:
  - number: '1'
    text: Artikel met een FOREACH in de veldnamen van een eerdere RFC-versie.
    url: https://example.invalid/law/artikel/1
    machine_readable:
      execution:
        parameters:
          - name: bedragen
            type: array
            required: true
        output:
          - name: totaal
            type: number
        actions:
          - output: totaal
            value:
              operation: FOREACH
              subject: $bedragen
              as: bedrag
              where:
                operation: GREATER_THAN
                subject: $bedrag
                value: 0
              value: $bedrag
              combine: ADD
