[package]
name = "regelrecht-shared"
version = "0.1.0"
edition = "2021"
authors = ["MinBZK <noreply@minbzk.nl>"]
description = "RegelRecht shared types - Canonical domain types used across crates"
license = "EUPL-1.2"
repository = "https://github.com/MinBZK/regelrecht"
homepage = "https://github.com/MinBZK/regelrecht"
keywords = ["law", "legal", "dutch", "regelrecht", "types"]

[dependencies]
serde.workspace = true
tracing-subscriber = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
chrono-tz = { workspace = true, optional = true }

[features]
default = []
telemetry = ["dep:tracing-subscriber"]
# Europe/Amsterdam calendar dates. Optional so the crates that only want the
# domain types (law-model, and through it corpus) stay free of chrono.
dates = ["dep:chrono", "dep:chrono-tz"]

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
