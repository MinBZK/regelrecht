[package]
name = "regelrecht-law-model"
version = "0.1.0"
edition = "2021"
authors = ["MinBZK <noreply@minbzk.nl>"]
description = "RegelRecht canonical law-YAML document model - the single Rust representation of the law format"
license = "EUPL-1.2"
repository = "https://github.com/MinBZK/regelrecht"
homepage = "https://github.com/MinBZK/regelrecht"
keywords = ["law", "legal", "dutch", "regelrecht", "types"]
categories = ["parsing"]

[dependencies]
regelrecht-shared = { path = "../shared" }
# serde-with-float adds the opt-in `serde::float_option` module used by
# TypeSpec::min/max, which the schema types as JSON numbers. It does not change
# Decimal's default serialization (that is the differently-named `serde-float`).
rust_decimal = { workspace = true, features = ["serde-with-float"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
rust_decimal_macros.workspace = true
serde_yaml_ng.workspace = true

[lints]
workspace = true
