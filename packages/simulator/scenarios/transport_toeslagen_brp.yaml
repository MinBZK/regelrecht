---
name: een cel vraagt een lexostatus op bij een andere cel
description: >-
  Twee cellen en één vraag over de grens. De vraag gaat niet van cel naar cel:
  hij gaat van de veiligheidscontext van `toeslagen` naar het transport, en het
  transport komt bij de publieke ingang van `brp` uit. Dat is de hele
  bewijslast van dit scenario — er is precies één weg over een celgrens, en die
  is waarneembaar.

  Wat er níet gebeurt is even belangrijk. Het antwoord van `brp` verdwijnt niet
  in een kroniek van `toeslagen`: een kroniek bevat alleen wat de cel zelf
  overkwam, en een geaccepteerde waarde hoort in het besluit dat haar gebruikt.
  `toeslagen` legt hier dus niets vast, en bij een volgend besluit gaat de vraag
  opnieuw naar de bron.

clock:
  # De vastlegging staat als `events` in de celconfiguratie, dus ze staat er al
  # bij het optuigen; de klok begint ervoor en er is geen fixture die nog moet
  # landen.
  start: 2023-01-01

cells:
  # De bevraagde cel: een bron-cel zonder engine, precies zoals het
  # bron-celscenario hem laat zien. Ze merkt niet dat de vraag over een
  # celgrens kwam, en dat is het punt van het transport als naad: in-process
  # nu, HTTP later, zonder dat hier iets verandert.
  - id: brp
    laws: []

    chronicles:
      - stream: relaties
        key: bsn
        events:
          - name: relatie_gewijzigd
            intake: levering
            recording_actor: brp
            grondslag: eigen registratie
            op_moment: 2023-03-01
            fields:
              bsn: '999993653'
              partnerschap_type: HUWELIJK
              partner_bsn: '999993756'

    lexostatus_definitions:
      - name: partnerschap
        doc: >-
          De relatievorm van één persoon op één moment, zoals deze cel die
          vastlegde. Geen berekening: de laatste vastlegging op of vóór het
          gevraagde moment.
        inputs:
          - name: bsn
            type: string
        outputs:
          - partnerschap_type
          - partner_bsn
        reduction:
          chronicle: relaties
          key: bsn
          latest: true

  # De vragende cel. Ze publiceert hier zelf niets en legt niets vast: in dit
  # scenario is ze alleen vrager, en wat ze nodig heeft om een vraag over de
  # grens te zetten is een identiteit.
  #
  # Wat ze óók nodig heeft, is een *reden*. Invariant I3 zegt dat een cel alleen
  # de cellen bevraagt die haar eigen wetten of besluit-definities noemen, en de
  # gate rekent de sonde hieronder daar net zo hard op af als een besluit — zou
  # hij dat niet doen, dan lag er in elk scenario een weg omheen. Die reden
  # staat hier: haar wet vraagt via `source.regulation` om `partnerschap` bij de
  # cel `brp`, en `accepts_from` legt vast onder welke gepubliceerde naam dat
  # daar te halen is. Dat is geen recht maar een afspraak tussen twee
  # organisaties, en daarom staat het in de celconfiguratie en niet in de wet.
  - id: toeslagen
    laws:
      - test_partnerschapstoets

    accepts_from:
      - cell: brp
        output: partnerschap
        lexostatus: partnerschap
        field: partnerschap_type

# Het toegestane vraaggraf van dit scenario: precies één tak. Wat er straks over
# de grens gaat wordt hiermee vergeleken, beide kanten op — een vraag die hier
# niet staat is een fout, en deze tak zonder vraag ook.
query_graph:
  - doc: >-
      `toeslagen` mag bij `brp` de lexostatus `partnerschap` opvragen; haar
      eigen wet vraagt daarom.
    from: toeslagen
    to: brp
    lexostatus: partnerschap

query_via_transport:
  - description: >-
      `toeslagen` heeft de relatievorm van deze persoon nodig en stelt die niet
      zelf vast. Ze vraagt hem dus op bij de cel die hem wél vastlegde, onder de
      naam die die cel publiceert, met de parameters die daarbij horen, op een
      moment dat zij kiest.
    from: toeslagen
    cell: brp
    lexostatus: partnerschap
    params:
      bsn: '999993653'
    op_moment: 2024-01-01
    expect:
      partnerschap_type: HUWELIJK
      partner_bsn: '999993756'
