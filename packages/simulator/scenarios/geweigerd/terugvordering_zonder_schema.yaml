---
name: een stroom zonder schema voor de terugvordering wordt bij het optuigen geweigerd
description: >-
  Dezelfde wereld als `scenarios/toeslagen_terugvordering.yaml`, met één verschil:
  het schema van de betalingsstroom kent alleen `betaling_gedaan` en
  `betaling_gemeld`. De vaststelling gaat op artikel 1 van de testregeling, en dát
  artikel declareert `richting_bij_negatief: omkeren` — dus kan er een
  terugvordering uit komen, en die draagt een eigen naam in de kroniek.

  Zo'n stroom hoort bij het **optuigen** geweigerd te worden en niet pas als het
  slotbedrag onder nul uitkomt: dan zou het van de casus afhangen of een
  ontbrekend schema ooit boven water kwam, en strandde de run halverwege de
  tijdlijn. De melding noemt de namen die ontbreken.

  Afgerekend wordt hij in `tests/gebeurtenisschema.rs`.

clock:
  start: 2024-01-01

settings:
  betalingsritme: kwartaal

cells:
  - id: belastingdienst
    laws: []
    komt_na:
      - Dienst Toeslagen
    chronicles:
      - stream: betalingen
        key: zaakkenmerk
        # Het gebeurtenisschema van deze stroom: welke gebeurtenissen erin
        # thuishoren, op welke grondslag ze berusten en welke velden ze dragen.
        # Wat het platform van een betalingsstroom verlangt, staat hier als data;
        # het optuigen toetst of het er staat, en elke vastlegging of het klopt.
        gebeurtenissen: &betalingsschema
          - name: betaling_gedaan
            intake: betaling
            grondslag: Algemene wet bestuursrecht, art. 4:89
            fields: &betalingsvelden
              - name: zaakkenmerk
                type: string
              - name: bedrag
                type: amount
              - name: volgnummer
                type: number
              - name: besluit
                type: string
              - name: schuldenaar
                type: string
              - name: schuldeiser
                type: string
          - name: betaling_gemeld
            intake: levering
            grondslag: Algemene wet bestuursrecht, art. 4:89
            fields: *betalingsvelden

    lexostatus_definitions:
      - name: betaald_tot_nu_toe
        doc: wat deze cel op deze zaak betaald heeft, opgeteld
        inputs:
          - name: zaakkenmerk
            type: string
        outputs:
          - bedrag
        reduction:
          chronicle: betalingen
          key: zaakkenmerk
          sum: bedrag

  - id: toeslagen
    identity: Dienst Toeslagen
    laws:
      - wet_op_de_zorgtoeslag
      - algemene_wet_inkomensafhankelijke_regelingen
      - regeling_standaardpremie
      - test_terugvordering

    chronicles:
      - stream: relaties
        key: bsn
        events:
          - name: relatie_gewijzigd
            intake: levering
            recording_actor: toeslagen
            grondslag: melding uit de basisregistratie personen
            op_moment: 2023-01-01
            fields:
              bsn: '999993653'
              partnerschap_type: GEEN

      - stream: inkomensleveringen
        key: bsn
        events:
          - name: inkomenslevering
            intake: levering
            recording_actor: toeslagen
            grondslag: jaarlijkse inkomenslevering
            op_moment: 2023-11-15
            fields:
              bsn: '999993653'
              is_verzekerde: true
              verzamelinkomen: 79547
              buitenlands_inkomen: 0
              vermogen: 0

      - stream: betalingen
        key: zaakkenmerk
        gebeurtenissen: *betalingsschema

    besluit_definitions:
      - name: zorgtoeslag_toekenning
        doc: het voorschot, in het ritme van de uitvoerder
        regulation: wet_op_de_zorgtoeslag
        output: heeft_recht_op_zorgtoeslag
        outputs:
          - hoogte_zorgtoeslag
        zaakkenmerk: zorgtoeslag/{bsn}
        params:
          - name: bsn
            type: string
        inputs:
          bsn:
            param: bsn
          is_verzekerde:
            from_chronicle: inkomensleveringen
            field: is_verzekerde

      - name: zorgtoeslag_vaststelling
        doc: >-
          De vaststelling op artikel 1: die declareert `richting_bij_negatief:
          omkeren`, dus kan deze wereld een terugvordering voortbrengen — en dan
          hoort het schema van de betalingsstroom die naam te kennen.
        regulation: test_terugvordering
        output: nog_te_betalen
        zaakkenmerk: zorgtoeslag/{bsn}
        params:
          - name: bsn
            type: string
          - name: definitief_bedrag
            type: number
        inputs:
          bsn:
            param: bsn
          definitief_bedrag:
            param: definitief_bedrag
          betaald_bedrag:
            accept_from: belastingdienst
            lexostatus: betaald_tot_nu_toe
            field: bedrag
            params:
              zaakkenmerk: $zaakkenmerk

    lexostatus_definitions:
      - name: zorgtoeslagbeschikking
        doc: wat deze cel over deze zaak besloten heeft, op het gevraagde moment
        inputs:
          - name: zaakkenmerk
            type: string
        outputs:
          - heeft_recht_op_zorgtoeslag
          - hoogte_zorgtoeslag
          - nog_te_betalen
        reduction:
          chronicle: beschikkingen
          key: zaakkenmerk
          latest: true

query_graph:
  - doc: de vaststelling vraagt de betalende cel wat er betaald is
    from: toeslagen
    to: belastingdienst
    lexostatus: betaald_tot_nu_toe

decide:
  - description: het voorschot, vier kwartaaltermijnen
    cell: toeslagen
    besluit: zorgtoeslag_toekenning
    params:
      bsn: '999993653'
    op_moment: 2024-01-01
    expect:
      heeft_recht_op_zorgtoeslag: true
      hoogte_zorgtoeslag: 197205.31187

  - description: >-
      De vaststelling die onder nul uitkomt. Deze regel wordt nooit gehaald: de
      wereld komt niet voorbij het optuigen. Ze staat er omdat een scenario
      zonder besluiten niets voorstelt, en omdat dit bestand daarmee hetzelfde
      leest als het scenario waarvan het afstamt.
    cell: toeslagen
    besluit: zorgtoeslag_vaststelling
    params:
      bsn: '999993653'
      definitief_bedrag: 50000
    op_moment: 2024-06-15
    expect:
      nog_te_betalen: -48602
