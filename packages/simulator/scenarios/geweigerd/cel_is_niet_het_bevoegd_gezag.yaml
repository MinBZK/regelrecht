---
name: een cel die niet het bevoegd gezag is, besluit niet
description: >-
  De wereld van de publieke testopstelling, met één verschil: `toeslagen` geeft
  zich uit als `Belastingdienst`. De regeling die zij wil uitvoeren wijst
  `Dienst Toeslagen` aan als bevoegd gezag, dus dit besluit hoort niet genomen te
  worden — en er hoort niets vastgelegd te worden.

  Twee dingen maken dit een fixture en geen scenario. Het eerste is dat de
  weigering de run afbreekt: een besluit dat omvalt, breekt af, dus dit bestand
  kan zijn eigen falen niet als verwachting dragen. Het tweede is wat je er
  omheen wilt kunnen vaststellen en wat in geen enkel `expect` past: dat er ook
  níets over een celgrens is gegaan. De belastingdienst heeft geen vraag over
  deze persoon gezien, en dat hoort zo — een cel die de regeling niet mag
  uitvoeren, hoort een andere organisatie niet eerst te laten zien dat er iets
  over iemand werd opgevraagd.

  Afgerekend wordt hij in `tests/bevoegd_gezag.rs`.

clock:
  start: 2024-01-01

settings:
  # Artikel 2 van de Wet op de zorgtoeslag legt een betalingsverplichting op en
  # laat het ritme aan het beleid van de uitvoerder (`ritme: $betalingsritme`).
  betalingsritme: kwartaal

cells:
  - id: belastingdienst
    laws: []
    # Deze cel komt de betalingsverplichtingen na die Dienst Toeslagen oplegt.
    # Dat er hier nooit betaald wordt, komt doordat het besluit geweigerd wordt
    # — maar de wereld moet wel op te tuigen zijn.
    komt_na:
      - Dienst Toeslagen

    chronicles:
      - stream: betalingen
        key: zaakkenmerk
      - stream: aanslagen
        key: bsn
        events:
          - name: aanslag_vastgesteld
            intake: eigen_besluit
            recording_actor: belastingdienst
            grondslag: Wet inkomstenbelasting 2001, hoofdstuk 2
            op_moment: 2023-03-01
            fields:
              bsn: '999993653'
              toetsingsinkomen: 81000
              competent_authority: Belastingdienst

    lexostatus_definitions:
      - name: toetsingsinkomen
        doc: het vastgestelde toetsingsinkomen, met het bevoegd gezag erbij
        inputs:
          - name: bsn
            type: string
        outputs:
          - toetsingsinkomen
          - competent_authority
        reduction:
          chronicle: aanslagen
          key: bsn
          latest: true

  - id: toeslagen
    # De verkeerde bewering. Deze cel geeft zich uit als een organisatie die de
    # regeling hieronder niet uitvoert. Dat is precies wat er geweigerd hoort te
    # worden: de wet wijst het gezag aan, niet de celconfiguratie.
    identity: Belastingdienst
    laws:
      - wet_op_de_zorgtoeslag
      - algemene_wet_inkomensafhankelijke_regelingen
      - regeling_standaardpremie

    chronicles:
      # De besluitende cel houdt zelf ook een betalingsstroom: zij legt vast dat
      # haar gemeld is dat er betaald is.
      - stream: betalingen
        key: zaakkenmerk
      - stream: relaties
        key: bsn
        events:
          - name: relatie_gewijzigd
            intake: levering
            recording_actor: toeslagen
            grondslag: melding uit de basisregistratie personen
            op_moment: 2023-01-01
            fields:
              bsn: '999993653'
              partnerschap_type: GEEN

      - stream: inkomensleveringen
        key: bsn
        events:
          - name: inkomenslevering
            intake: levering
            recording_actor: toeslagen
            grondslag: jaarlijkse inkomenslevering
            op_moment: 2023-11-15
            fields:
              bsn: '999993653'
              is_verzekerde: true
              vermogen: 0

    besluit_definitions:
      - name: zorgtoeslag_vaststelling
        doc: >-
          Het besluit dat niet genomen mag worden. Dat het een waarde van een
          andere cel accepteert, staat er met opzet in: zo is te meten dat de
          weigering vóór de eerste vraag valt.
        regulation: wet_op_de_zorgtoeslag
        output: heeft_recht_op_zorgtoeslag
        outputs:
          - hoogte_zorgtoeslag
        zaakkenmerk: zorgtoeslag/{bsn}
        params:
          - name: bsn
            type: string
        inputs:
          bsn:
            param: bsn
          is_verzekerde:
            from_chronicle: inkomensleveringen
            field: is_verzekerde
          toetsingsinkomen:
            accept_from: belastingdienst
            lexostatus: toetsingsinkomen
            field: toetsingsinkomen
            params:
              bsn: $bsn

    lexostatus_definitions:
      - name: zorgtoeslagbeschikking
        doc: wat deze cel over deze zaak besloten heeft, op het gevraagde moment
        inputs:
          - name: zaakkenmerk
            type: string
        outputs:
          - heeft_recht_op_zorgtoeslag
          - hoogte_zorgtoeslag
        reduction:
          chronicle: beschikkingen
          key: zaakkenmerk
          latest: true

query_graph:
  - doc: >-
      Gedeclareerd, want de besluit-definitie vraagt erom. Dat de vraag nooit
      gesteld wordt, is de uitkomst van dit bestand en niet van het graf.
    from: toeslagen
    to: belastingdienst
    lexostatus: toetsingsinkomen

decide:
  - description: de cel probeert te besluiten onder een verkeerde identiteit
    cell: toeslagen
    besluit: zorgtoeslag_vaststelling
    params:
      bsn: '999993653'
    op_moment: 2024-06-01
    expect:
      heeft_recht_op_zorgtoeslag: true

queries:
  - description: >-
      Komt niet aan bod: de run breekt af op het besluit hierboven. Hij staat er
      omdat een scenario zonder vraag niets vastlegt.
    cell: toeslagen
    lexostatus: zorgtoeslagbeschikking
    params:
      zaakkenmerk: zorgtoeslag/999993653
    op_moment: 2024-06-01
    expect:
      heeft_recht_op_zorgtoeslag: true
