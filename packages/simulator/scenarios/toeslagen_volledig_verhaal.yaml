---
name: het volledige verhaal, gedreven door acties van actoren
description: >-
  Aanvraag → besluit → betalingen → tweede besluit, en niets ervan staat in Rust.
  De stappen hieronder roepen alleen `act` aan: welke actor wat kan doen, welk
  formulier daarbij hoort en wanneer een actie überhaupt kan, staat in `actions`
  van dit bestand. Een andere casus is een ander wereldbestand.

  Vijf dingen die dit scenario moet vastpinnen:

  1. **Een aanvraag is twee grammen.** De burger legt in haar eigen kroniek vast
     wat zij indiende; `toeslagen` legt in de zijne vast wat hem geleverd is.
     Niemand leest de kroniek van de ander, en beide kanten weten wat er gebeurde.
  2. **Een actie kan wachten tot het verhaal zover is.** Beslissen kan pas als er
     een aanvraag ligt. Dat staat nergens als voorwaarde opgeschreven: het volgt
     uit de inputs van het besluit zelf, dat een eigen feit over de aanvrager
     nodig heeft dat er vóór de aanvraag niet is.
  3. **Geen schaduwboekhouding.** Het tweede besluit rekent op twee bedragen die
     het zelf niet vaststelt, en het houdt van geen van beide een eigen kopie: het
     definitieve toetsingsinkomen vraagt het aan de cel die de aanslag vaststelde,
     wat er van het voorschot is uitbetaald aan de cel die uitbetaalde. Het
     toetsingsinkomen van de toekenning gaat langs dezelfde weg — naar de bron,
     niet naar een aantekening.
  4. **De tijd doet het werk.** Niemand betaalt iets; de klok laat de termijnen
     vervallen en dan legt de betalende cel vast dat zij betaalde. Wát er betaald
     moet worden staat in het lexogram van de wet die wordt uitgevoerd, en de twee
     besluiten voeren elk een eigen artikel uit: de toekenning betaalt het
     voorschot in termijnen (Awir art. 16 jo. art. 22), de vaststelling het
     slotbedrag ineens na verrekening van dat voorschot (Awir art. 19 jo. art.
     24). Wie het nakomt komt uit het wereldbestand (`komt_na`).
  5. **Een vaststelling is een herberekening.** De vaststelling neemt niet over
     wat er is toegekend, maar rekent de zorgtoeslag opnieuw uit op het inkomen
     van de láátste aanslag (Awir art. 19, eerste lid). Dat inkomen is hoger dan
     dat van de voorlopige aanslag, dus de tegemoetkoming valt lager uit dan het
     voorschot en het slotbedrag komt onder nul. Wat daaruit volgt is geen
     negatieve betaling maar een **terugvordering**: de aanvrager betaalt terug
     aan Dienst Toeslagen (Awir art. 24, derde lid jo. art. 26).

clock:
  start: 2024-01-01

settings:
  # Beleid en geen wet: de besluit-definitie verwijst ernaar met `$betalingsritme`
  # in plaats van een ritme voor te schrijven. Zodra het besluit genomen is, staat
  # deze instelling vast — het gram legt vast waarop besloten is.
  betalingsritme: kwartaal

cells:
  # De aanvrager. Een bron-cel: geen wetten, geen engine. Wat zij houdt is haar
  # eigen journaal van wat zij indiende — en, aan het eind van dit verhaal, van
  # wat zij terugbetaalde.
  - id: burger
    # De naam waaronder deze cel zich uitgeeft. Zij komt geen gezag na: ze ís de
    # partij, en dit is de naam die een omgekeerde verplichting als schuldenaar
    # aanwijst (zie de vaststelling). Daarom staat er geen `komt_na` onder.
    identity: '999993653'
    laws: []
    chronicles:
      - stream: aanvragen
        key: bsn
        # Wat deze cel in deze stroom vastlegt, en van welk type. Het formulier
        # van de actie wordt er bij het optuigen aan gehouden, en elke
        # vastlegging bij het vastleggen.
        gebeurtenissen:
          - name: aanvraag_ingediend
            intake: aanvraag
            grondslag: Algemene wet inkomensafhankelijke regelingen, art. 15
            fields:
              - name: bsn
                type: string
              - name: jaar
                type: number
              - name: ondertekend_op
                type: date

      # Wat zij betaalde. Leeg opgetuigd: er komt pas iets in als er een termijn
      # vervalt waarvan zíj de schuldenaar is.
      - stream: betalingen
        key: zaakkenmerk
        # Het gebeurtenisschema van een betalingsstroom: welke gebeurtenissen
        # erin thuishoren, op welke grondslag ze berusten en welke velden ze
        # dragen. Wat het platform van zo'n stroom verlangt, staat hier als
        # data; het optuigen toetst of het er staat, en elke vastlegging of het
        # klopt. De andere cellen in deze wereld delen dit schema.
        #
        # Vier gebeurtenissen en niet twee: de vaststelling van Awir art. 19
        # draagt `richting_bij_negatief: omkeren`, dus uit diezelfde
        # verplichting kan ook een terugvordering komen — met de partijen
        # omgekeerd en een eigen naam, want een betaling terug is geen betaling
        # met een minteken. Elke cel die zo'n verplichting nakomt of er de
        # melding van vastlegt, heeft alle vier de namen nodig.
        gebeurtenissen: &betalingsschema
          - name: betaling_gedaan
            intake: betaling
            grondslag: Algemene wet bestuursrecht, art. 4:89
            fields: &betalingsvelden
              - name: zaakkenmerk
                type: string
              - name: bedrag
                type: amount
              - name: volgnummer
                type: number
              # Wat voor termijn het was. Het staat ook in de naam van de
              # gebeurtenis, en hier nog eens als veld: een reductie leest velden
              # en geen namen, en wie terugleest hoort uit het feit zelf te zien
              # dat dit een terugvordering was en geen betaling.
              - name: soort
                type: string
              - name: besluit
                type: string
              - name: schuldenaar
                type: string
              - name: schuldeiser
                type: string
          - name: betaling_gemeld
            intake: levering
            grondslag: Algemene wet bestuursrecht, art. 4:89
            fields: *betalingsvelden
          - name: terugvordering_gedaan
            intake: betaling
            grondslag: Algemene wet inkomensafhankelijke regelingen, art. 26
            fields: *betalingsvelden
          - name: terugvordering_gemeld
            intake: levering
            grondslag: Algemene wet inkomensafhankelijke regelingen, art. 26
            fields: *betalingsvelden

    lexostatus_definitions:
      - name: ingediende_aanvraag
        doc: wat deze aanvrager zelf indiende, en wanneer
        inputs:
          - name: bsn
            type: string
        outputs:
          - jaar
        reduction:
          chronicle: aanvragen
          key: bsn
          latest: true

      - name: betaald_tot_nu_toe
        doc: wat deze cel op deze zaak betaald heeft, opgeteld
        inputs:
          - name: zaakkenmerk
            type: string
        outputs:
          - bedrag
        reduction:
          chronicle: betalingen
          key: zaakkenmerk
          sum: bedrag

      - name: laatste_betaling
        doc: >-
          De laatste termijn die deze cel betaalde, met de soort en de twee
          partijen erbij — zodat te lezen is dat het feit zelf zegt wie aan wie
          betaalde, en niet alleen het besluit waaruit het volgt.
        inputs:
          - name: zaakkenmerk
            type: string
        outputs:
          - bedrag
          - soort
          - schuldenaar
          - schuldeiser
        reduction:
          chronicle: betalingen
          key: zaakkenmerk
          latest: true

    # De stand van de zaak bij deze cel: welke reducties het journaal vóór en ná
    # elke gebeurtenis meet, om er een "was → is" van te maken. Casusdata — het
    # platform weet alleen dát er indicatoren zijn, niet welke. `$veld` wijst een
    # veld van de gebeurtenis aan; draagt een gebeurtenis dat veld niet, dan gaat
    # deze indicator er niet over en wordt hij niet gereduceerd.
    status_indicators:
      - lexostatus: ingediende_aanvraag
        label: ingediende aanvraag
        params:
          bsn: $bsn
      - lexostatus: betaald_tot_nu_toe
        label: terugbetaald
        params:
          zaakkenmerk: $zaakkenmerk

  # De cel die het toetsingsinkomen vaststelt, en die de betalingsverplichtingen
  # van Dienst Toeslagen nakomt. Twee aanslagen: de tweede corrigeert de eerste,
  # en dát verschil is waar dit verhaal om draait. Het eerste besluit is de
  # voorschotverlening (Awir art. 16 jo. art. 22) en rust op de eerste aanslag;
  # de vaststelling van art. 19 rust op de laatste, en dat levert een lagere
  # tegemoetkoming dan het voorschot op — dus een terugvordering.
  - id: belastingdienst
    laws: []
    # Deze cel komt de betalingsverplichtingen na die Dienst Toeslagen oplegt:
    # de wet zegt dát er betaald moet worden, dit zegt wie dat doet (Awir art.
    # 25). De binding loopt langs het bevoegd gezag en niet langs een cel-id:
    # de wet kent geen cellen, dus de enige naam die beide kanten kennen is die
    # van het gezag.
    komt_na:
      - Dienst Toeslagen
    chronicles:
      - stream: aanslagen
        key: bsn
        events:
          - name: aanslag_vastgesteld
            intake: eigen_besluit
            recording_actor: belastingdienst
            grondslag: Wet inkomstenbelasting 2001, hoofdstuk 2
            op_moment: 2024-03-01
            fields:
              bsn: '999993653'
              toetsingsinkomen: 81000
              competent_authority: Belastingdienst

          - name: aanslag_herzien
            intake: eigen_besluit
            recording_actor: belastingdienst
            grondslag: Wet inkomstenbelasting 2001, hoofdstuk 2
            op_moment: 2024-12-01
            fields:
              bsn: '999993653'
              toetsingsinkomen: 85000
              competent_authority: Belastingdienst

      - stream: betalingen
        key: zaakkenmerk
        # Hetzelfde schema als bij de aanvrager hierboven: wat er in een
        # betalingsstroom thuishoort, hangt aan de verplichting en niet aan de
        # cel die haar nakomt.
        gebeurtenissen: *betalingsschema

    lexostatus_definitions:
      - name: toetsingsinkomen
        doc: >-
          Het vastgestelde toetsingsinkomen op het gevraagde moment, met het
          bevoegd gezag erbij. Een consument die hierop leunt, hoort te kunnen
          zien wiens vaststelling dit is.
        inputs:
          - name: bsn
            type: string
        outputs:
          - toetsingsinkomen
          - competent_authority
        reduction:
          chronicle: aanslagen
          key: bsn
          latest: true

      - name: betaald_tot_nu_toe
        doc: wat deze cel op deze zaak betaald heeft, opgeteld
        inputs:
          - name: zaakkenmerk
            type: string
        outputs:
          - bedrag
        reduction:
          chronicle: betalingen
          key: zaakkenmerk
          sum: bedrag

    status_indicators:
      - lexostatus: toetsingsinkomen
        label: vastgesteld toetsingsinkomen
        params:
          bsn: $bsn
      # Op het zaakkenmerk van het besluit: daarop groepeert deze cel haar
      # betalingen, en dat is wat een betaling in haar velden draagt.
      - lexostatus: betaald_tot_nu_toe
        label: betaald
        params:
          zaakkenmerk: $zaakkenmerk

  - id: toeslagen
    # De naam waaronder deze cel zich uitgeeft. Het is een bewering: de
    # regeling die ze uitvoert wijst dit gezag aan, en een besluit door een cel
    # die iets anders beweert wordt geweigerd.
    identity: Dienst Toeslagen
    laws:
      - wet_op_de_zorgtoeslag
      - algemene_wet_inkomensafhankelijke_regelingen
      - regeling_standaardpremie

    chronicles:
      # De kroniek waarin de levering van de burger landt. Leeg opgetuigd: wat
      # erin komt, komt van een actie.
      - stream: aanvragen
        key: bsn
        # Dezelfde velden, een andere naam en een ander kanaal: wat de
        # aanvrager indiende, is bij deze cel een aanvraag die binnenkwam. Twee
        # grammen in twee kronieken, elk met een eigen schema.
        gebeurtenissen:
          - name: aanvraag_ontvangen
            intake: aanvraag
            grondslag: Algemene wet inkomensafhankelijke regelingen, art. 15
            fields:
              - name: bsn
                type: string
              - name: jaar
                type: number
              - name: ondertekend_op
                type: date

      - stream: relaties
        key: bsn
        gebeurtenissen:
          - name: relatie_gewijzigd
            intake: levering
            grondslag: melding uit de basisregistratie personen
            fields:
              - name: bsn
                type: string
              - name: partnerschap_type
                type: string
        events:
          - name: relatie_gewijzigd
            intake: levering
            recording_actor: toeslagen
            grondslag: melding uit de basisregistratie personen
            op_moment: 2023-01-01
            fields:
              bsn: '999993653'
              partnerschap_type: GEEN

      - stream: inkomensleveringen
        key: bsn
        gebeurtenissen:
          - name: inkomenslevering
            intake: levering
            grondslag: jaarlijkse inkomenslevering
            fields:
              - name: bsn
                type: string
              - name: is_verzekerde
                type: boolean
              - name: vermogen
                type: amount
        events:
          - name: inkomenslevering
            intake: levering
            recording_actor: toeslagen
            grondslag: jaarlijkse inkomenslevering
            op_moment: 2023-11-15
            fields:
              bsn: '999993653'
              is_verzekerde: true
              vermogen: 0

      # De besluitende cel houdt zelf ook een betalingsstroom: zij legt vast dat
      # haar gemeld is dat er betaald is.
      - stream: betalingen
        key: zaakkenmerk
        gebeurtenissen: *betalingsschema

    besluit_definitions:
      - name: zorgtoeslag_toekenning
        doc: >-
          Het eerste besluit over de zaak: recht en hoogte, met een
          betalingsverplichting eraan. Het toetsingsinkomen wordt geaccepteerd
          van de cel die het vaststelde en hier niet nagerekend (invariant I5).
        regulation: wet_op_de_zorgtoeslag
        output: heeft_recht_op_zorgtoeslag
        outputs:
          - hoogte_zorgtoeslag
        zaakkenmerk: zorgtoeslag/{bsn}
        params:
          # De persoon uit de aanvraag die deze cel geleverd kreeg; vóór de
          # aanvraag ligt daar niets en blijft het veld leeg.
          - name: bsn
            type: string
            prefill: $last:toeslagen.aanvragen.bsn
        inputs:
          bsn:
            param: bsn
          is_verzekerde:
            from_chronicle: inkomensleveringen
            field: is_verzekerde
          toetsingsinkomen:
            accept_from: belastingdienst
            lexostatus: toetsingsinkomen
            field: toetsingsinkomen
            params:
              bsn: $bsn

      - name: zorgtoeslag_vaststelling
        doc: >-
          Het tweede besluit over dezelfde zaak, en een ánder besluit: de
          vaststelling van de Awir (art. 19). Ze rekent de zorgtoeslag wél
          opnieuw uit, maar op het definitieve toetsingsinkomen — dát is wat lid
          1 aan de laatste aanslag knoopt — en het artikel haalt die berekening
          zelf bij de zorgtoeslagwet. Wat er van het voorschot is uitbetaald,
          vraagt ze aan de cel die uitbetaalde. Het verschil is het slotbedrag:
          de verrekening van art. 24, tweede lid.
        regulation: algemene_wet_inkomensafhankelijke_regelingen
        output: slotbedrag
        outputs:
          - vastgestelde_tegemoetkoming
        zaakkenmerk: zorgtoeslag/{bsn}
        params:
          # De persoon uit de aanvraag die deze cel geleverd kreeg; vóór de
          # aanvraag ligt daar niets en blijft het veld leeg.
          - name: bsn
            type: string
            prefill: $last:toeslagen.aanvragen.bsn
        inputs:
          bsn:
            param: bsn
          # Het **definitieve** toetsingsinkomen: de laatste aanslag, van de cel
          # die haar vaststelde. Awir art. 19, eerste lid knoopt de vaststelling
          # daaraan, en het artikel rekent er de zorgtoeslag mee uit — dus deze
          # cel levert hier hetzelfde feit aan als bij de toekenning, alleen
          # later — en de aanslag is inmiddels herzien. Niet nagerekend
          # (invariant I5).
          toetsingsinkomen:
            accept_from: belastingdienst
            lexostatus: toetsingsinkomen
            field: toetsingsinkomen
            params:
              bsn: $bsn
          # En over de celgrens, met het kenmerk van déze zaak: wat er als
          # voorschot is uitbetaald, weet de cel die het uitbetaalde. Niet
          # nagerekend en niet als eigen saldo bijgehouden (invariant I5).
          #
          # Art. 24, tweede lid verrekent wat er is *verleend*, en dat is op dit
          # moment hetzelfde bedrag: deze vaststelling vervangt het voorschot,
          # dus de termijnen die nog openstonden vervallen erdoor (gedeclareerd
          # in het lexogram van art. 19) en van de verlening blijft over wat er
          # is uitbetaald. Daardoor klopt de som op elk moment — ook als de
          # vaststelling vóór de laatste voorschottermijn valt.
          uitbetaalde_voorschotten:
            accept_from: belastingdienst
            lexostatus: betaald_tot_nu_toe
            field: bedrag
            params:
              zaakkenmerk: $zaakkenmerk

    lexostatus_definitions:
      - name: ontvangen_aanvraag
        doc: wat deze cel over deze persoon geleverd kreeg
        inputs:
          - name: bsn
            type: string
        outputs:
          - jaar
        reduction:
          chronicle: aanvragen
          key: bsn
          latest: true

      - name: zorgtoeslagbeschikking
        doc: >-
          Wat deze cel over deze zaak besloten heeft, op het gevraagde moment. De
          twee besluiten over één zaak leggen niet dezelfde uitkomsten vast — de
          toekenning zegt of er recht is en hoe hoog, de vaststelling wat er is
          vastgesteld en wat er nog volgt — dus ze staan hier alle vier, en een
          gram draagt waar het over ging.
        inputs:
          - name: zaakkenmerk
            type: string
        outputs:
          - heeft_recht_op_zorgtoeslag
          - hoogte_zorgtoeslag
          - vastgestelde_tegemoetkoming
          - slotbedrag
        reduction:
          chronicle: beschikkingen
          key: zaakkenmerk
          latest: true

      - name: betaald_tot_nu_toe
        doc: >-
          Wat er op deze zaak betaald is, voor zover deze cel dat weet: een som
          over haar eigen meldingen, en dus een reductie — geen saldo dat naast
          de kroniek wordt bijgehouden.
        inputs:
          - name: zaakkenmerk
            type: string
        outputs:
          - bedrag
        reduction:
          chronicle: betalingen
          key: zaakkenmerk
          sum: bedrag

    status_indicators:
      - lexostatus: ontvangen_aanvraag
        label: ontvangen aanvraag
        params:
          bsn: $bsn
      - lexostatus: zorgtoeslagbeschikking
        label: toekenningspositie
        params:
          zaakkenmerk: $zaakkenmerk
      - lexostatus: betaald_tot_nu_toe
        label: betaald volgens de meldingen
        params:
          zaakkenmerk: $zaakkenmerk

actions:
  - id: burger.aanvraag
    actor: burger
    label: Aanvraag zorgtoeslag indienen
    doc: >-
      De aanvrager legt vast wat zij indient, en levert hetzelfde feit aan de
      uitvoerder. Twee grammen, elk in een eigen kroniek.
    records:
      cell: burger
      chronicle: aanvragen
      name: aanvraag_ingediend
      intake: aanvraag
      # Geen `grondslag` hier: die staat in het schema van de stroom waarin dit
      # gram landt. Dat een aanvraag op Awir art. 15 berust, geldt voor elke
      # aanvraag en niet voor deze ene — en dan hoort het één keer opgeschreven
      # te staan, op de plek die over het soort gaat.
      fields:
        # Voorgevuld: dit verhaal gaat over deze persoon en dit jaar, en dat
        # hoort een invuller niet elke keer over te typen. Het blijft een
        # voorstel — wat vastligt, is wat verstuurd wordt.
        - name: bsn
          type: string
          prefill: '999993653'
        - name: jaar
          type: number
          prefill: 2024
        # Een datum als parameter: ISO op de draad, en bij het binden door
        # `NaiveDate` gehaald. De Nederlandse notatie hoort bij het scherm en
        # niet bij wat er vastligt. Zonder `prefill` staat de klok erin.
        - name: ondertekend_op
          type: date
      delivers_to:
        cell: toeslagen
        chronicle: aanvragen
        name: aanvraag_ontvangen
        intake: aanvraag

  - id: toeslagen.toekenning
    actor: toeslagen
    label: Beslis op de aanvraag
    # Geen voorwaarde in dit bestand: of dit besluit nu genomen kan worden,
    # volgt uit zijn eigen inputs. Het leest `is_verzekerde` uit de eigen
    # kroniek `inkomensleveringen`, op de persoon uit de aanvraag die deze cel
    # ontving — dus zolang die aanvraag er niet ligt, is er geen persoon en geen
    # feit, en zegt het beeld dat met zoveel woorden.
    doc: Kan pas als er een aanvraag ligt.
    decides:
      cell: toeslagen
      besluit: zorgtoeslag_toekenning

  - id: toeslagen.vaststelling
    actor: toeslagen
    label: Stel de zorgtoeslag definitief vast
    # Ook hier geen voorwaarde in dit bestand. Maar anders dan bij de toekenning
    # zegt het beeld hier niets zinnigs: dit besluit heeft géén eigen feit — het
    # inkomen en het uitbetaalde voorschot komen allebei van een andere cel — en
    # beschikbaarheid kijkt met opzet niet over een celgrens (invariant I1, zie
    # de README). De actie heet dus altijd mogelijk, ook voordat er iets te
    # verrekenen valt; wie haar dan neemt, krijgt van de bevraagde cel te horen
    # dat zij niets vaststelde.
    doc: >-
      Kan pas echt als het voorschot loopt; dat blijkt bij het besluit en niet
      aan de knop.
    decides:
      cell: toeslagen
      besluit: zorgtoeslag_vaststelling

deadlines:
  - label: aanvraag ontvangen vóór 1 maart
    at: 2024-03-01
    warn_if_missing:
      cell: toeslagen
      chronicle: aanvragen
      name: aanvraag_ontvangen

query_graph:
  # Twee takken naar dezelfde cel, elk met een eigen vraag. De eerste gebruiken
  # beide besluiten: de toekenning vraagt het toetsingsinkomen van de voorlopige
  # aanslag, de vaststelling dat van de laatste. Een graf zegt wie wie waarover
  # mag bevragen en niet hoe vaak. Wat er verder gebeurt — de aanvraag, de
  # levering — blijft binnen een cel, en hoort hier dus niet te staan.
  - doc: het toetsingsinkomen wordt geaccepteerd, niet nagerekend (I5)
    from: toeslagen
    to: belastingdienst
    lexostatus: toetsingsinkomen

  - doc: >-
      wat er als voorschot is uitbetaald, weet de cel die uitbetaalde; de
      vaststelling accepteert dat en telt het niet zelf op
    from: toeslagen
    to: belastingdienst
    lexostatus: betaald_tot_nu_toe

act:
  - description: >-
      De aanvrager dient in. Ze legt het vast in haar eigen kroniek, en
      `toeslagen` krijgt hetzelfde feit als levering in de zijne.
    action: burger.aanvraag
    values:
      bsn: '999993653'
      jaar: 2024
      ondertekend_op: '2024-01-09'
    op_moment: 2024-01-10

  - description: >-
      De uitvoerder beslist. Het toetsingsinkomen komt van de belastingdienst
      (81000, de aanslag van maart) en wordt hier niet nagerekend; de
      verplichting die eruit volgt kent vier kwartaaltermijnen, van maart tot en
      met december.
    action: toeslagen.toekenning
    values:
      bsn: '999993653'
    op_moment: 2024-03-01
    expect:
      heeft_recht_op_zorgtoeslag: true
      hoogte_zorgtoeslag: 197178.01
    expect_accepted:
      toetsingsinkomen: belastingdienst
    expect_computed:
      - is_verzekerde
      - heeft_recht_op_zorgtoeslag
      - hoogte_zorgtoeslag

  - description: >-
      De vaststelling, binnen acht weken na de laatste aanslag (Awir art. 19,
      eerste lid). Ze stelt niet vast wat is toegekend: ze rekent de zorgtoeslag
      opnieuw uit op het inkomen van díe aanslag (85000 in plaats van 81000), en
      dat levert € 1.971,03 op in plaats van de € 1.971,78 die als voorschot is
      verleend en uitbetaald. Het slotbedrag is het verschil (art. 24, tweede
      lid) en komt dus onder nul: € 0,75 terug in plaats van bij.
    action: toeslagen.vaststelling
    values:
      bsn: '999993653'
    op_moment: 2024-12-15
    expect:
      vastgestelde_tegemoetkoming: 197102.85
      slotbedrag: -75.16
    expect_accepted:
      # Geen van beide invoerwaarden rekent deze uitvoering na (invariant I5) —
      # ook het inkomen niet, nu de uitkomst ervan wél herrekend wordt.
      toetsingsinkomen: belastingdienst
      uitbetaalde_voorschotten: belastingdienst
    expect_computed:
      # Het tegenbewijs: dít is wat deze uitvoering zelf uitrekende. Zonder zo'n
      # uitkomst zeggen de regels hierboven niets. De vastgestelde
      # tegemoetkoming staat erbij, want juist die is hier gerekend en niet
      # overgeschreven.
      - vastgestelde_tegemoetkoming
      - slotbedrag

queries:
  - description: >-
      De aanvrager weet wat zij indiende, uit haar eigen kroniek. Niemand heeft
      haar dat geleverd en niemand leest het bij `toeslagen` op.
    cell: burger
    lexostatus: ingediende_aanvraag
    params:
      bsn: '999993653'
    op_moment: 2024-01-10
    expect:
      jaar: 2024

  - description: >-
      En de uitvoerder weet wat hem geleverd is — een eigen gram, met een eigen
      kanaal.
    cell: toeslagen
    lexostatus: ontvangen_aanvraag
    params:
      bsn: '999993653'
    op_moment: 2024-01-10
    expect:
      jaar: 2024

  - description: >-
      Op het moment vóór de aanvraag had de uitvoerder niets: de vraag over toen
      blijft dat antwoord geven, ook nu de klok jaren verder staat.
    cell: toeslagen
    lexostatus: ontvangen_aanvraag
    params:
      bsn: '999993653'
    op_moment: 2024-01-05
    expect_not_established: true

  - description: >-
      Halverwege het jaar zijn er twee kwartaaltermijnen verstreken (maart en
      juni). De betalende cel telt dat op over haar eigen betalingen; niemand
      houdt een saldo bij.
    cell: belastingdienst
    lexostatus: betaald_tot_nu_toe
    params:
      zaakkenmerk: zorgtoeslag/999993653
    op_moment: 2024-08-01
    expect:
      bedrag: 98588

  - description: >-
      Aan het eind van het jaar zijn alle vier de termijnen van het voorschot
      verstreken: 197178,01 — inclusief de rest die op de laatste termijn landde,
      en precies het bedrag dat is verleend. De terugvordering staat hier niet
      bij: die betaalde de aanvrager en niet deze cel, en elke cel telt alleen op
      wat zíj betaalde.
    cell: belastingdienst
    lexostatus: betaald_tot_nu_toe
    params:
      zaakkenmerk: zorgtoeslag/999993653
    op_moment: 2025-02-01
    expect:
      bedrag: 197178.01

  - description: >-
      De kernassertie van dit verhaal: de aanvrager betaalt € 0,75 terug. Haar
      cel komt de verplichting na omdat de omkering háár als schuldenaar
      aanwijst, en het bedrag is positief — een verplichting kent geen minteken,
      alleen een richting.
    cell: burger
    lexostatus: laatste_betaling
    params:
      zaakkenmerk: zorgtoeslag/999993653
    op_moment: 2024-12-15
    expect:
      soort: terugvordering
      schuldenaar: '999993653'
      schuldeiser: Dienst Toeslagen
      bedrag: 75.16

  - description: >-
      Vóór de vaststelling had zij niets terugbetaald: dezelfde som over dezelfde
      kroniek, een dag eerder gesteld.
    cell: burger
    lexostatus: betaald_tot_nu_toe
    params:
      zaakkenmerk: zorgtoeslag/999993653
    op_moment: 2024-12-14
    expect_not_established: true

  - description: >-
      De zaak terugvragen levert het laatste besluit over dat zaakkenmerk: de
      vaststelling, met wat er is vastgesteld en wat er na verrekening overbleef.
    cell: toeslagen
    lexostatus: zorgtoeslagbeschikking
    params:
      zaakkenmerk: zorgtoeslag/999993653
    op_moment: 2025-02-01
    expect:
      vastgestelde_tegemoetkoming: 197102.85
      slotbedrag: -75.16

  - description: >-
      En de toekenning is niet verdwenen: de vraag over het moment vóór de
      vaststelling levert het gram van toen. Een kroniek groeit, ze wijzigt niet.
    cell: toeslagen
    lexostatus: zorgtoeslagbeschikking
    params:
      zaakkenmerk: zorgtoeslag/999993653
    op_moment: 2024-12-10
    expect:
      hoogte_zorgtoeslag: 197178.01

# De termijn is gehaald: de aanvraag lag er op 1 maart. Een lege lijst is een
# volwaardige verwachting — een waarschuwing die hier zou opduiken, maakt deze
# run rood.
expect_warnings: []
