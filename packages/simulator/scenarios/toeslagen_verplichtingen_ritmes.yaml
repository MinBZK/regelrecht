---
name: hetzelfde bedrag in een ander ritme
description: >-
  Het tegenscenario naast `toeslagen_verplichtingen.yaml`. Hetzelfde bedrag,
  twee andere ritmes — en ze staan allebei in het **lexogram**, want een ritme is
  onderdeel van wat een beschikking oplegt. Artikel 1 van de testregeling betaalt
  `ineens`; artikel 2 laat het ritme aan het beleid van de uitvoerder
  (`$betalingsritme`, hier `maand` uit `settings`). Het ritme verandert de
  vervaldata en de termijnbedragen; het verandert niet wat er in totaal betaald
  wordt.

  Twee artikelen van één regeling en niet twee regelingen: een verplichting hangt
  aan het artikel dat de beschikking voortbrengt, net als het bevoegd gezag
  (RFC-002). Twee besluiten op hetzelfde artikel krijgen daarom hetzelfde schema,
  en twee besluiten op verschillende artikelen elk het hunne.

  Verder laat dit scenario `vanaf` zien: de maandelijkse verplichting begint niet
  bij het besluit maar op een datum die uit een parameter van dat besluit volgt.
  Zolang die datum niet vóór het besluit ligt, mag dat — een verplichting kan
  niet vervallen vóór het besluit waaruit ze volgt.

clock:
  start: 2024-01-01

settings:
  # Beleid en geen wet — en dat het hier staat is precies wat artikel 2 met
  # `ritme: $betalingsritme` zegt: de wet schrijft het ritme niet voor.
  betalingsritme: maand

cells:
  - id: toeslagen
    # De naam waaronder deze cel zich uitgeeft. Het is een bewering: de
    # regeling die ze uitvoert wijst dit gezag aan, en een besluit door een cel
    # die iets anders beweert wordt geweigerd.
    identity: Dienst Toeslagen
    laws:
      - test_betalingsritmes

    chronicles:
      # De besluitende cel houdt zelf ook een betalingsstroom: zij legt vast dat
      # haar gemeld is dat er betaald is.
      - stream: betalingen
        key: zaakkenmerk

    besluit_definitions:
      - name: toekenning_ineens
        doc: >-
          Eén termijn, op het moment van het besluit. Dat dat zo is, staat niet
          hier maar in artikel 1 van de regeling.
        regulation: test_betalingsritmes
        output: bedrag_ineens
        zaakkenmerk: ineens/{bsn}
        params:
          - name: bsn
            type: string
        inputs:
          bsn:
            param: bsn

      - name: toekenning_maandelijks
        doc: >-
          Twaalf termijnen, vanaf een datum die het besluit meekrijgt. Het
          sjabloon staat in artikel 2 en verwijst naar de gedocumenteerde
          parameters van dít besluit, net als het zaakkenmerk.
        regulation: test_betalingsritmes
        output: bedrag_maandelijks
        zaakkenmerk: maand/{bsn}
        params:
          - name: bsn
            type: string
          - name: jaar
            type: string
        inputs:
          bsn:
            param: bsn

    lexostatus_definitions:
      - name: betaald_tot_nu_toe
        inputs:
          - name: zaakkenmerk
            type: string
        outputs:
          - bedrag
        reduction:
          chronicle: betalingen
          key: zaakkenmerk
          sum: bedrag

  - id: belastingdienst
    laws: []
    # Deze cel komt de betalingsverplichtingen na die Dienst Toeslagen oplegt:
    # het lexogram zegt dát er betaald moet worden, dit zegt wie dat doet.
    komt_na:
      - Dienst Toeslagen
    chronicles:
      - stream: betalingen
        key: zaakkenmerk

    lexostatus_definitions:
      - name: betaald_tot_nu_toe
        inputs:
          - name: zaakkenmerk
            type: string
        outputs:
          - bedrag
        reduction:
          chronicle: betalingen
          key: zaakkenmerk
          sum: bedrag

decide:
  - description: ineens - één termijn, meteen
    cell: toeslagen
    besluit: toekenning_ineens
    params:
      bsn: '999993653'
    op_moment: 2024-01-01
    expect:
      bedrag_ineens: 120000

  - description: maandelijks - twaalf termijnen, vanaf februari
    cell: toeslagen
    besluit: toekenning_maandelijks
    params:
      bsn: '999993653'
      jaar: '2024'
    op_moment: 2024-01-01
    expect:
      bedrag_maandelijks: 120000

queries:
  - description: >-
      `ineens` betaalt op de dag van het besluit het hele bedrag; er is geen
      termijn die later vervalt.
    cell: belastingdienst
    lexostatus: betaald_tot_nu_toe
    params:
      zaakkenmerk: ineens/999993653
    op_moment: 2024-01-01
    expect:
      bedrag: 120000

  - description: >-
      De maandelijkse verplichting begint pas in februari, dus halverwege januari
      ligt er over die zaak nog niets vast.
    cell: belastingdienst
    lexostatus: betaald_tot_nu_toe
    params:
      zaakkenmerk: maand/999993653
    op_moment: 2024-01-15
    expect_not_established: true

  - description: >-
      Halverwege juni zijn er vijf maandtermijnen verstreken (februari tot en met
      juni). Deze vraag staat hier ook om de klok in kleine stappen te laten
      lopen: elke termijn gaat één keer af, hoe vaak de tijd ook wordt opgedeeld.
    cell: belastingdienst
    lexostatus: betaald_tot_nu_toe
    params:
      zaakkenmerk: maand/999993653
    op_moment: 2024-06-15
    expect:
      bedrag: 50000

  - description: na september acht termijnen
    cell: belastingdienst
    lexostatus: betaald_tot_nu_toe
    params:
      zaakkenmerk: maand/999993653
    op_moment: 2024-09-15
    expect:
      bedrag: 80000

  - description: >-
      Na de twaalfde termijn (januari van het volgende jaar) is er precies
      hetzelfde betaald als bij `ineens`. Het ritme bepaalt wanneer, niet hoeveel.
    cell: toeslagen
    lexostatus: betaald_tot_nu_toe
    params:
      zaakkenmerk: maand/999993653
    op_moment: 2025-01-05
    expect:
      bedrag: 120000
