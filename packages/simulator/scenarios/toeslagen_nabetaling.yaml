---
name: een vaststelling slaat terug op de toekenning over dezelfde zaak
description: >-
  Twee besluiten over één zaak, en het tweede heeft het eerste nodig. De cel
  `toeslagen` kent zorgtoeslag toe met een betalingsverplichting eraan; de klok
  laat een paar termijnen vervallen; daarna stelt dezelfde cel vast wat er nog te
  betalen is. Dat laatste besluit rekent op twee bedragen die het zelf niet
  vaststelt, en het haalt ze langs twee verschillende wegen:

  1. **Het toegekende bedrag leest ze terug uit haar eigen eerdere gram**
     (`from_decretogram`). Sleutel is het zaakkenmerk van het lopende besluit, uit
     het eigen sjabloon — dus de vaststelling kan alleen de toekenning over
     dezelfde zaak zien. Dat is geen eigen feit en geen herberekening: het bedrag
     komt uit het gram zoals het toen is vastgelegd, en de herkomst in het nieuwe
     gram zegt dat ook (`uit eerder besluit 'zorgtoeslag_toekenning'`).
  2. **Het betaalde bedrag accepteert ze van de cel die betaalde**
     (`accept_from`), met `$zaakkenmerk` als vraag: de ingebouwde verwijzing naar
     het kenmerk van dít besluit. Geen vrije parameter, want dan kon een besluit
     onder de vlag van "de zaak waarover ik nu besluit" naar de zaak van een ander
     vragen.

  Wat dit scenario moet weerleggen is dat teruglezen hetzelfde is als een eigen
  feit bijhouden. `from_chronicle: beschikkingen` blijft verboden — daar liggen
  besluiten en geen feiten — en deze vorm is de smalle uitzondering die er
  expliciet in staat en die het gram opschrijft.

clock:
  start: 2024-01-01

settings:
  # Beleid en geen wet: de besluit-definitie verwijst ernaar met `$betalingsritme`
  # in plaats van een ritme voor te schrijven.
  betalingsritme: kwartaal

cells:
  # De cel die betaalt. Een bron-cel: geen wetten, geen engine. Wat zij publiceert
  # is een reductie over haar eigen betalingen, en dat is precies wat de
  # vaststelling hieronder van haar accepteert.
  - id: belastingdienst
    laws: []
    # Deze cel komt de betalingsverplichtingen na die Dienst Toeslagen oplegt:
    # het lexogram zegt dát er betaald moet worden, dit zegt wie dat doet.
    komt_na:
      - Dienst Toeslagen
    chronicles:
      - stream: betalingen
        key: zaakkenmerk

    lexostatus_definitions:
      - name: betaald_tot_nu_toe
        doc: wat deze cel op deze zaak betaald heeft, opgeteld
        inputs:
          - name: zaakkenmerk
            type: string
        outputs:
          - bedrag
        reduction:
          chronicle: betalingen
          key: zaakkenmerk
          sum: bedrag

  - id: toeslagen
    # De naam waaronder deze cel zich uitgeeft. Beide regelingen hieronder wijzen
    # dit gezag aan; een besluit door een cel die iets anders beweert wordt
    # geweigerd.
    identity: Dienst Toeslagen
    laws:
      - wet_op_de_zorgtoeslag
      - algemene_wet_inkomensafhankelijke_regelingen
      - regeling_standaardpremie
      # Een testregeling van deze crate (`fixtures/regulation/`), met opzet niet in
      # het corpus: geen echte wet kent "wat er eerder is toegekend" en "wat er
      # sindsdien betaald is" als input, en een wet verbouwen omdat een
      # testopstelling iets wil laten zien is precies wat je niet wilt.
      - test_nabetaling

    chronicles:
      - stream: relaties
        key: bsn
        events:
          - name: relatie_gewijzigd
            intake: levering
            recording_actor: toeslagen
            grondslag: melding uit de basisregistratie personen
            op_moment: 2023-01-01
            fields:
              bsn: '999993653'
              partnerschap_type: GEEN

      - stream: inkomensleveringen
        key: bsn
        events:
          - name: inkomenslevering
            intake: levering
            recording_actor: toeslagen
            grondslag: jaarlijkse inkomenslevering
            op_moment: 2023-11-15
            fields:
              bsn: '999993653'
              is_verzekerde: true
              verzamelinkomen: 79547
              buitenlands_inkomen: 0
              vermogen: 0

      # De besluitende cel houdt zelf ook een betalingsstroom: haar wordt gemeld
      # dat er betaald is. Ze vraagt het bedrag hieronder tóch bij de betalende
      # cel op — de vaststelling gaat naar de organisatie die betaalde en niet
      # naar haar eigen aantekening ervan.
      - stream: betalingen
        key: zaakkenmerk

    besluit_definitions:
      - name: zorgtoeslag_toekenning
        doc: >-
          Het eerste besluit over de zaak: recht en hoogte, met een
          betalingsverplichting eraan.
        regulation: wet_op_de_zorgtoeslag
        output: heeft_recht_op_zorgtoeslag
        outputs:
          - hoogte_zorgtoeslag
        zaakkenmerk: zorgtoeslag/{bsn}
        params:
          - name: bsn
            type: string
        inputs:
          bsn:
            param: bsn
          is_verzekerde:
            from_chronicle: inkomensleveringen
            field: is_verzekerde

      - name: zorgtoeslag_nabetaling
        doc: >-
          De vaststelling. Ze rekent zelf niets van de toekenning na: het
          toegekende bedrag leest ze terug uit dat gram, het betaalde bedrag
          accepteert ze van de cel die betaalde.
        regulation: test_nabetaling
        output: nog_te_betalen
        zaakkenmerk: zorgtoeslag/{bsn}
        params:
          - name: bsn
            type: string
        inputs:
          bsn:
            param: bsn
          # Dezelfde zaak, een eerder moment. Sleutel is het zaakkenmerk van dít
          # besluit; genomen wordt het laatste gram van de toekenning op of vóór
          # nu.
          toegekend_bedrag:
            from_decretogram: zorgtoeslag_toekenning
            field: hoogte_zorgtoeslag
          # En de vraag over de celgrens, met het kenmerk van deze zaak erin.
          betaald_bedrag:
            accept_from: belastingdienst
            lexostatus: betaald_tot_nu_toe
            field: bedrag
            params:
              zaakkenmerk: $zaakkenmerk

    lexostatus_definitions:
      - name: zorgtoeslagbeschikking
        doc: wat deze cel over deze zaak besloten heeft, op het gevraagde moment
        inputs:
          - name: zaakkenmerk
            type: string
        outputs:
          - heeft_recht_op_zorgtoeslag
          - hoogte_zorgtoeslag
          - nog_te_betalen
        reduction:
          chronicle: beschikkingen
          key: zaakkenmerk
          latest: true

# Eén tak, en die hoort bij de vaststelling: de toekenning rekent op eigen feiten
# en vraagt niemand iets. Beide kanten worden afgerekend, dus dit bestand bewijst
# ook dat het teruglezen zélf geen vraag over een celgrens is — anders zou hier
# een tweede tak moeten staan.
query_graph:
  - doc: >-
      `toeslagen` mag bij de betalende cel opvragen wat er op deze zaak betaald
      is; haar besluit-definitie zegt dat met `accept_from`.
    from: toeslagen
    to: belastingdienst
    lexostatus: betaald_tot_nu_toe

decide:
  - description: >-
      De toekenning. Vier termijnen, elk kwartaal één; de eerste vervalt op het
      moment van het besluit zelf.
    cell: toeslagen
    besluit: zorgtoeslag_toekenning
    params:
      bsn: '999993653'
    op_moment: 2024-01-01
    expect:
      heeft_recht_op_zorgtoeslag: true
      hoogte_zorgtoeslag: 197205.31187
    expect_computed:
      - is_verzekerde
      - hoogte_zorgtoeslag

  - description: >-
      De vaststelling, halverwege het jaar: twee termijnen zijn verstreken
      (januari en april), dus er is € 986,02 betaald van de € 1.972,05 die
      toegekend is. Wat er nog te betalen is, is precies het verschil — en beide
      bedragen komen ergens anders vandaan dan uit deze uitvoering.
    cell: toeslagen
    besluit: zorgtoeslag_nabetaling
    params:
      bsn: '999993653'
    op_moment: 2024-06-15
    expect:
      nog_te_betalen: 98603.31187
    expect_accepted:
      # Wat de betalende cel vaststelde, wordt hier niet nagerekend (invariant I5).
      betaald_bedrag: belastingdienst
    expect_read_back:
      # Uit een eerder besluit van deze cel zelf, en uit dát besluit. Een eigen
      # verwachting en niet `expect_computed`: het bedrag komt wel uit de eigen
      # kroniek, maar deze cel heeft het hier niet vastgesteld — het is
      # overgeschreven uit een ouder gram, onder het recht dat toen gold.
      toegekend_bedrag: zorgtoeslag_toekenning
    expect_computed:
      # Wat er wél in deze uitvoering is uitgerekend. Zonder dit tegenbewijs zegt
      # de regel hierboven niets: een opstelling waarin álles teruggelezen heet,
      # haalt dezelfde assertie even makkelijk.
      - nog_te_betalen

queries:
  - description: >-
      De vaststelling ligt in dezelfde kroniek onder hetzelfde zaakkenmerk als de
      toekenning: één zaak, twee grammen. Een reductie erover levert het laatste
      besluit.
    cell: toeslagen
    lexostatus: zorgtoeslagbeschikking
    params:
      zaakkenmerk: zorgtoeslag/999993653
    op_moment: 2024-06-15
    expect:
      nog_te_betalen: 98603.31187

  - description: >-
      En over hetzelfde moment vóór de vaststelling staat er nog de toekenning.
      Het teruglezen heeft niets aan dat gram veranderd — een kroniek groeit.
    cell: toeslagen
    lexostatus: zorgtoeslagbeschikking
    params:
      zaakkenmerk: zorgtoeslag/999993653
    op_moment: 2024-01-01
    expect:
      hoogte_zorgtoeslag: 197205.31187

  - description: >-
      Wat de vaststelling accepteerde, is bij de bron nog steeds hetzelfde
      bedrag: de som over de betalingen die op dat moment gedaan waren.
    cell: belastingdienst
    lexostatus: betaald_tot_nu_toe
    params:
      zaakkenmerk: zorgtoeslag/999993653
    op_moment: 2024-06-15
    expect:
      bedrag: 98602
