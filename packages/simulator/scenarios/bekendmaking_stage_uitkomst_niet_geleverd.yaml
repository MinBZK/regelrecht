---
name: een gedeclareerde stage-uitkomst die niet ontstaat, valt niet stil weg
description: >-
  Het artikel van de vergunning declareert drie uitkomsten voor de
  bekendmaking: de dag vanaf wanneer de vergunning geldt (art. 3), de dag
  waarop de houder uiterlijk meldt dat hij aan de voorschriften voldoet
  (art. 2), en de dag waarop de uitvoerder uiterlijk controleert (art. 4). De
  laatste twee bestaan alleen bij een vergunning onder voorschriften, en de
  controle leunt dan op een verzoek van de houder dat bij de bekendmaking
  niemand aanlevert.

  Twee zaken. Bij de vergunning met voorschriften komen de geldigheid en de
  melding in het gram van de bekendmaking; de controle blijft onbekend. Die
  staat dan niet als waarde in het gram, maar wel onder
  `stage_uitkomst_niet_geleverd` — met het artikel en de feiten die ontbraken —
  en het journaal zegt het bij de bekendmaking. Zo is "gedeclareerd maar niet
  geleverd" te onderscheiden van "niet gedeclareerd".

  Bij de vergunning zonder voorschriften zegt de regeling voor de melding en de
  controle "er is er geen" (`null`). Dat is afwezigheid, een waarde (RFC-036):
  beide staan als `null` in het gram, en niets is niet geleverd.

clock:
  start: 2024-01-01

cells:
  - id: uitvoerder
    identity: Uitvoerder
    laws:
      - test_stage_uitkomst_niet_geleverd
      - test_awb_procedure

    besluit_definitions:
      - name: verlening
        doc: de verlening van de vergunning, met of zonder voorschriften
        regulation: test_stage_uitkomst_niet_geleverd
        output: vergunning_verleend
        zaakkenmerk: vergunning/{bsn}
        params:
          - name: bsn
            type: string
          - name: met_voorschriften
            type: boolean
        inputs:
          bsn:
            param: bsn
          met_voorschriften:
            param: met_voorschriften

    lexostatus_definitions:
      - name: bekendmaking
        doc: wat er bij de bekendmaking van de verlening vast kwam te staan
        inputs:
          - name: zaakkenmerk
            type: string
        outputs:
          - vergunning_geldig_vanaf
          - nakoming_gemeld_uiterlijk_op
        reduction:
          chronicle: beschikkingen
          key: zaakkenmerk
          latest: true
          where:
            stage: BEKENDMAKING

      - name: controle
        doc: de dag waarop de uitvoerder uiterlijk de naleving controleert
        inputs:
          - name: zaakkenmerk
            type: string
        outputs:
          - eerste_controle_uiterlijk_op
        reduction:
          chronicle: beschikkingen
          key: zaakkenmerk
          latest: true
          where:
            stage: BEKENDMAKING

actions:
  - id: uitvoerder.verlening
    actor: uitvoerder
    label: Verleen de vergunning
    decides:
      cell: uitvoerder
      besluit: verlening

  - id: uitvoerder.bekendmaking
    actor: uitvoerder
    label: Maak de verlening bekend
    publishes:
      cell: uitvoerder
      besluit: verlening

act:
  - description: de verlening onder voorschriften
    action: uitvoerder.verlening
    values:
      bsn: '999993653'
      met_voorschriften: true
    op_moment: 2024-03-01
    expect:
      vergunning_verleend: true

  - description: en haar bekendmaking
    action: uitvoerder.bekendmaking
    values:
      datum_bekendmaking: '2024-03-04'
      toegezonden_aan_belanghebbende: true
    op_moment: 2024-03-04

  - description: de verlening zonder voorschriften, over een andere zaak
    action: uitvoerder.verlening
    values:
      bsn: '999992788'
      met_voorschriften: false
    op_moment: 2024-03-05
    expect:
      vergunning_verleend: true

  - description: en haar bekendmaking
    action: uitvoerder.bekendmaking
    values:
      datum_bekendmaking: '2024-03-06'
      toegezonden_aan_belanghebbende: true
    op_moment: 2024-03-06

queries:
  - description: >-
      Onder voorschriften leverde de bekendmaking de geldigheid en de melding.
    cell: uitvoerder
    lexostatus: bekendmaking
    params:
      zaakkenmerk: vergunning/999993653
    op_moment: 2024-03-04
    expect:
      vergunning_geldig_vanaf: '2024-03-04'
      nakoming_gemeld_uiterlijk_op: '2024-04-01'

  - description: >-
      Maar de controle bleef onbekend: die staat er niet als waarde. Dat ze
      gedeclareerd was en niet kwam, zegt het gram zelf.
    cell: uitvoerder
    lexostatus: controle
    params:
      zaakkenmerk: vergunning/999993653
    op_moment: 2024-03-04
    expect_not_established: true

  - description: >-
      Zonder voorschriften zei de regeling "er is geen dag": dat is een waarde,
      en die staat in het gram.
    cell: uitvoerder
    lexostatus: bekendmaking
    params:
      zaakkenmerk: vergunning/999992788
    op_moment: 2024-03-06
    expect:
      vergunning_geldig_vanaf: '2024-03-06'
      nakoming_gemeld_uiterlijk_op: null

  - description: >-
      Ook voor de controle: geen dag, en dus niets dat niet geleverd is.
    cell: uitvoerder
    lexostatus: controle
    params:
      zaakkenmerk: vergunning/999992788
    op_moment: 2024-03-06
    expect:
      eerste_controle_uiterlijk_op: null
