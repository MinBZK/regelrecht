---
name: een vaststelling lager dan het voorschot wordt een terugvordering
description: >-
  Een negatief bedrag bestaat niet. De cel `toeslagen` kent zorgtoeslag toe met
  een betalingsverplichting eraan, de klok laat twee termijnen vervallen, en
  daarna stelt dezelfde cel het recht definitief vast op een bedrag dat lager is
  dan wat er al betaald is. Het slotbedrag is dan negatief — en wat daaruit volgt
  is geen negatieve betaling maar een verplichting de **andere kant op**: de
  aanvrager moet terugbetalen aan het bevoegd gezag (Awb 4:57).

  Wat dit scenario moet weerleggen is dat "wie betaalt" een eigenschap van de
  uitvoering is. De verplichting noemt een **schuldenaar** en een **schuldeiser**,
  allebei een naam uit het recht: standaard het bevoegd gezag en de partij die het
  zaakkenmerk identificeert. Bij de omkering wisselen die twee, en pas daarna kijkt
  de wereld welke cel er onder de naam van de schuldenaar nakomt. Bij de toekenning
  is dat `belastingdienst` (die komt Dienst Toeslagen na); bij de terugvordering is
  dat `aanvrager`, want die cel geeft zich uit als de partij zelf.

  De som die dat zichtbaar maakt is `betaald_tot_nu_toe` per cel: elke cel telt
  alleen op wat zíj betaalde. De terugvordering staat daarom in de kroniek van de
  aanvrager en niet in die van de belastingdienst, en de twee sommen lopen uiteen
  zonder dat er ergens een saldo wordt bijgehouden.

clock:
  start: 2024-01-01

settings:
  # Beleid en geen wet: het lexogram van de zorgtoeslag verwijst ernaar met
  # `ritme: $betalingsritme` in plaats van een ritme voor te schrijven.
  betalingsritme: kwartaal

cells:
  # De cel die namens Dienst Toeslagen betaalt. Een bron-cel: geen wetten, geen
  # engine. Wat zij publiceert is een reductie over haar eigen betalingen.
  - id: belastingdienst
    laws: []
    komt_na:
      - Dienst Toeslagen
    chronicles:
      - stream: betalingen
        key: zaakkenmerk
        # Het gebeurtenisschema van deze stroom: welke gebeurtenissen erin
        # thuishoren, op welke grondslag ze berusten en welke velden ze dragen.
        # Wat het platform van een betalingsstroom verlangt, staat hier als data;
        # het optuigen toetst of het er staat, en elke vastlegging of het klopt.
        gebeurtenissen: &betalingsschema
          - name: betaling_gedaan
            intake: betaling
            grondslag: Algemene wet bestuursrecht, art. 4:89
            fields: &betalingsvelden
              - name: zaakkenmerk
                type: string
              - name: bedrag
                type: amount
              - name: volgnummer
                type: number
              - name: besluit
                type: string
              - name: schuldenaar
                type: string
              - name: schuldeiser
                type: string
              - name: soort
                type: string
          - name: betaling_gemeld
            intake: levering
            grondslag: Algemene wet bestuursrecht, art. 4:89
            fields: *betalingsvelden
          # De omgekeerde kant (Awb 4:57): dezelfde velden, en ze ontstaat
          # doordat het bedrag negatief uitvalt en het artikel voor dat geval
          # omkeren declareert. Zonder deze twee namen zou de eerste
          # terugvordering pas bij het vastleggen stranden.
          - name: terugvordering_gedaan
            intake: betaling
            grondslag: Algemene wet bestuursrecht, art. 4:57
            fields: *betalingsvelden
          - name: terugvordering_gemeld
            intake: levering
            grondslag: Algemene wet bestuursrecht, art. 4:57
            fields: *betalingsvelden

    lexostatus_definitions:
      - name: betaald_tot_nu_toe
        doc: wat deze cel op deze zaak betaald heeft, opgeteld
        inputs:
          - name: zaakkenmerk
            type: string
        outputs:
          - bedrag
        reduction:
          chronicle: betalingen
          key: zaakkenmerk
          sum: bedrag

  # De aanvrager doet in deze wereld zelf mee als cel. Zij komt geen gezag na —
  # ze is de partij zelf: haar identiteit is de naam die de verplichting als
  # schuldenaar aanwijst zodra de richting omkeert. Dat is de hele binding; er
  # staat geen `komt_na` onder.
  - id: aanvrager
    identity: '999993653'
    laws: []
    chronicles:
      - stream: betalingen
        key: zaakkenmerk
        gebeurtenissen: *betalingsschema

    lexostatus_definitions:
      - name: betaald_tot_nu_toe
        doc: wat deze cel op deze zaak betaald heeft, opgeteld
        inputs:
          - name: zaakkenmerk
            type: string
        outputs:
          - bedrag
        reduction:
          chronicle: betalingen
          key: zaakkenmerk
          sum: bedrag

      - name: laatste_betaling
        doc: >-
          De laatste termijn die deze cel betaalde, met de soort en de twee
          partijen erbij — zodat te lezen is dat het feit zelf zegt wie aan wie
          betaalde, en niet alleen het besluit waaruit het volgt.
        inputs:
          - name: zaakkenmerk
            type: string
        outputs:
          - bedrag
          - soort
          - schuldenaar
          - schuldeiser
        reduction:
          chronicle: betalingen
          key: zaakkenmerk
          latest: true

  - id: toeslagen
    identity: Dienst Toeslagen
    laws:
      - wet_op_de_zorgtoeslag
      - algemene_wet_inkomensafhankelijke_regelingen
      - regeling_standaardpremie
      # Een testregeling van deze crate (`fixtures/regulation/`), met opzet niet
      # in het corpus: geen echte wet kent "wat er definitief is vastgesteld" en
      # "wat er sindsdien betaald is" als input.
      - test_terugvordering

    chronicles:
      - stream: relaties
        key: bsn
        events:
          - name: relatie_gewijzigd
            intake: levering
            recording_actor: toeslagen
            grondslag: melding uit de basisregistratie personen
            op_moment: 2023-01-01
            fields:
              bsn: '999993653'
              partnerschap_type: GEEN

      - stream: inkomensleveringen
        key: bsn
        events:
          - name: inkomenslevering
            intake: levering
            recording_actor: toeslagen
            grondslag: jaarlijkse inkomenslevering
            op_moment: 2023-11-15
            fields:
              bsn: '999993653'
              is_verzekerde: true
              verzamelinkomen: 79547
              buitenlands_inkomen: 0
              vermogen: 0

      # De besluitende cel houdt zelf ook een betalingsstroom: haar wordt gemeld
      # dat er betaald is — door de belastingdienst bij de toekenning, en door de
      # aanvrager bij de terugvordering.
      - stream: betalingen
        key: zaakkenmerk
        gebeurtenissen: *betalingsschema

    besluit_definitions:
      - name: zorgtoeslag_toekenning
        doc: >-
          Het voorschot: recht en hoogte, met een betalingsverplichting in het
          ritme van de uitvoerder.
        regulation: wet_op_de_zorgtoeslag
        output: heeft_recht_op_zorgtoeslag
        outputs:
          - hoogte_zorgtoeslag
        zaakkenmerk: zorgtoeslag/{bsn}
        params:
          - name: bsn
            type: string
        inputs:
          bsn:
            param: bsn
          is_verzekerde:
            from_chronicle: inkomensleveringen
            field: is_verzekerde

      - name: zorgtoeslag_vaststelling
        doc: >-
          De vaststelling. Wat er definitief toekomt, komt als parameter binnen;
          wat er betaald is, accepteert deze cel van de cel die betaalde. Het
          verschil is wat er nog te betalen is — en dat mag negatief uitvallen,
          want artikel 1 zegt wat dat dan betekent.
        regulation: test_terugvordering
        output: nog_te_betalen
        zaakkenmerk: zorgtoeslag/{bsn}
        params:
          - name: bsn
            type: string
          - name: definitief_bedrag
            type: number
        inputs:
          bsn:
            param: bsn
          definitief_bedrag:
            param: definitief_bedrag
          betaald_bedrag:
            accept_from: belastingdienst
            lexostatus: betaald_tot_nu_toe
            field: bedrag
            params:
              zaakkenmerk: $zaakkenmerk

    lexostatus_definitions:
      - name: zorgtoeslagbeschikking
        doc: wat deze cel over deze zaak besloten heeft, op het gevraagde moment
        inputs:
          - name: zaakkenmerk
            type: string
        outputs:
          - heeft_recht_op_zorgtoeslag
          - hoogte_zorgtoeslag
          - nog_te_betalen
        reduction:
          chronicle: beschikkingen
          key: zaakkenmerk
          latest: true

      - name: openstaande_termijnen
        doc: >-
          Wat er van deze zaak nog openstaat, per richting: de betalingen die
          deze cel oplegde en de terugvordering die eruit volgde, elk met wat er
          van die kant op ligt.
        inputs:
          - name: zaakkenmerk
            type: string
        reduction:
          openstaand: true
          key: zaakkenmerk

# Eén tak, en die hoort bij de vaststelling: de toekenning rekent op eigen feiten
# en vraagt niemand iets. De aanvrager wordt nergens iets gevraagd — zij betaalt,
# en dat is geen vraag over een celgrens maar een termijn die vervalt.
query_graph:
  - doc: >-
      `toeslagen` mag bij de betalende cel opvragen wat er op deze zaak betaald
      is; haar besluit-definitie zegt dat met `accept_from`.
    from: toeslagen
    to: belastingdienst
    lexostatus: betaald_tot_nu_toe

decide:
  - description: >-
      Het voorschot. Vier kwartaaltermijnen van € 493,01; de eerste vervalt op het
      moment van het besluit zelf. Schuldenaar is het bevoegd gezag, schuldeiser de
      aanvrager — en de cel die dat gezag nakomt, is `belastingdienst`.
    cell: toeslagen
    besluit: zorgtoeslag_toekenning
    params:
      bsn: '999993653'
    op_moment: 2024-01-01
    expect:
      heeft_recht_op_zorgtoeslag: true
      hoogte_zorgtoeslag: 197205.31187

  - description: >-
      De vaststelling, halverwege het jaar. Twee termijnen zijn verstreken
      (januari en april), dus er is € 986,02 betaald, terwijl er definitief maar
      € 500,00 toekomt. Het slotbedrag is dan negatief — en omdat artikel 1
      `richting_bij_negatief: omkeren` declareert, levert dat een terugvordering
      op: € 486,02 die de aanvrager aan Dienst Toeslagen betaalt.
    cell: toeslagen
    besluit: zorgtoeslag_vaststelling
    params:
      bsn: '999993653'
      definitief_bedrag: 50000
    op_moment: 2024-06-15
    expect:
      nog_te_betalen: -48602
    expect_accepted:
      # Wat de betalende cel vaststelde, wordt hier niet nagerekend (invariant I5).
      betaald_bedrag: belastingdienst
    expect_computed:
      - nog_te_betalen

queries:
  - description: >-
      De terugvordering vervalt op het moment van het besluit zelf, en de cel die
      haar nakomt is de aanvrager: haar identiteit is de naam die de omgekeerde
      verplichting als schuldenaar aanwijst. Het bedrag is positief — een
      verplichting kent geen minteken, alleen een richting.
    cell: aanvrager
    lexostatus: betaald_tot_nu_toe
    params:
      zaakkenmerk: zorgtoeslag/999993653
    op_moment: 2024-06-15
    expect:
      bedrag: 48602

  - description: >-
      Het feit zelf zegt wie aan wie betaalde. Bij de terugvordering staan de twee
      partijen omgekeerd ten opzichte van de toekenning, en de soort zegt welke
      van de twee verhoudingen dit is.
    cell: aanvrager
    lexostatus: laatste_betaling
    params:
      zaakkenmerk: zorgtoeslag/999993653
    op_moment: 2024-06-15
    expect:
      soort: terugvordering
      schuldenaar: '999993653'
      schuldeiser: Dienst Toeslagen
      bedrag: 48602

  - description: >-
      De kernassertie over de som: `betaald_tot_nu_toe` van de betalende cel telt
      alleen op wat zíj betaalde. De belastingdienst betaalde twee voorschottermijnen
      en heeft met de terugvordering niets te maken — er is geen saldo dat de twee
      kanten bij elkaar veegt.
    cell: belastingdienst
    lexostatus: betaald_tot_nu_toe
    params:
      zaakkenmerk: zorgtoeslag/999993653
    op_moment: 2024-06-15
    expect:
      bedrag: 98602

  - description: >-
      De besluitende cel weet van allebei: haar is gemeld dat er betaald is en dat
      er terugbetaald is. Dat is haar eigen kroniek en geen kopie van die van een
      ander — twee tegengestelde bedragen die hier bij elkaar opgeteld worden,
      zouden een saldo zijn, en dit is een som over vastleggingen.
    cell: toeslagen
    lexostatus: zorgtoeslagbeschikking
    params:
      zaakkenmerk: zorgtoeslag/999993653
    op_moment: 2024-06-15
    expect:
      nog_te_betalen: -48602

  - description: >-
      Openstaand houdt de twee richtingen uit elkaar. Twee voorschottermijnen van
      € 493,01 liepen van Dienst Toeslagen naar de aanvrager, de terugvordering
      van € 486,02 de andere kant op. Bij elkaar opgeteld zou dat € 1.472,04
      "verwacht" noemen, een bedrag dat niemand verschuldigd is; met een minteken
      verrekend zou het een saldo zijn. Per soort staat er wat er die kant op
      verwacht werd en wat er ligt — en elke termijn zegt van welke soort ze is.
    cell: toeslagen
    lexostatus: openstaande_termijnen
    params:
      zaakkenmerk: zorgtoeslag/999993653
    op_moment: 2024-06-15
    expect:
      betaling_verwacht: 98602
      betaling_betaald: 98602
      betaling_openstaand: 0
      terugvordering_verwacht: 48602
      terugvordering_betaald: 48602
      terugvordering_openstaand: 0
      termijnen:
        - besluit: zorgtoeslag_toekenning
          volgnummer: 1
          soort: betaling
          vervaldatum: '2024-01-01'
          bedrag: 49301
          status: betaald
        - besluit: zorgtoeslag_toekenning
          volgnummer: 2
          soort: betaling
          vervaldatum: '2024-04-01'
          bedrag: 49301
          status: betaald
        - besluit: zorgtoeslag_vaststelling
          volgnummer: 1
          soort: terugvordering
          vervaldatum: '2024-06-15'
          bedrag: 48602
          status: betaald

  - description: >-
      En over het moment vóór de vaststelling staat er nog de toekenning: het
      besluit dat erna kwam heeft aan dat gram niets veranderd.
    cell: toeslagen
    lexostatus: zorgtoeslagbeschikking
    params:
      zaakkenmerk: zorgtoeslag/999993653
    op_moment: 2024-01-01
    expect:
      hoogte_zorgtoeslag: 197205.31187
