---
name: de aanvraag draagt voorwaarden, en die tonen wat het recht zegt zonder te blokkeren
description: >-
  Een actie kan voorwaarden dragen: wat de wet of de eigen stand van de actor
  over die actie zegt. De aanvraag hieronder draagt er twee, één van elke soort.

  De eerste komt uit de wet: Awir art. 15, eerste lid, zegt tot wanneer een
  aanvraag over een berekeningsjaar kan. De aanvrager laadt die regeling zelf
  en rekent het uit met het jaar en de datum uit haar eigen formulier. In het
  wereldbestand staat alleen de verwijzing (regeling, uitkomst, parameters);
  de regel staat in de regeling.

  De tweede komt uit de eigen stand van de aanvrager: heeft zij al een aanvraag
  ingediend? Dat is geen recht maar wat haar overkwam, dus het komt uit een
  lexostatus over haar eigen kroniek.

  Twee keer dezelfde aanvraag. De eerste keer op tijd en voor het eerst: beide
  voorwaarden waar. De tweede keer na 1 april van het jaar erna, en er ligt er
  al een: beide onwaar. De tweede aanvraag gaat toch door, want een voorwaarde
  blokkeert niet: indienen kan altijd (Awb art. 4:1), en wat er met een te late
  aanvraag gebeurt, beslist het bestuursorgaan en niet de knop.

clock:
  start: 2024-01-01

cells:
  - id: burger
    laws:
      - algemene_wet_inkomensafhankelijke_regelingen
    chronicles:
      - stream: aanvragen
        key: bsn
        gebeurtenissen:
          - name: aanvraag_ingediend
            intake: aanvraag
            grondslag: Algemene wet inkomensafhankelijke regelingen, art. 15
            fields:
              - name: bsn
                type: string
              - name: jaar
                type: number
              - name: ondertekend_op
                type: date
    lexostatus_definitions:
      - name: ingediende_aanvraag
        doc: wat deze aanvrager zelf indiende, en wanneer
        inputs:
          - name: bsn
            type: string
        outputs:
          - jaar
          - ondertekend_op
        reduction:
          chronicle: aanvragen
          key: bsn
          latest: true

  - id: toeslagen
    laws: []
    chronicles:
      - stream: aanvragen
        key: bsn
        gebeurtenissen:
          - name: aanvraag_ontvangen
            intake: aanvraag
            grondslag: Algemene wet inkomensafhankelijke regelingen, art. 15
            fields:
              - name: bsn
                type: string
              - name: jaar
                type: number
              - name: ondertekend_op
                type: date
    lexostatus_definitions:
      - name: ontvangen_aanvraag
        doc: wat deze cel over deze persoon geleverd kreeg
        inputs:
          - name: bsn
            type: string
        outputs:
          - jaar
          - ondertekend_op
        reduction:
          chronicle: aanvragen
          key: bsn
          latest: true

actions:
  - id: burger.aanvraag
    actor: burger
    label: Aanvraag zorgtoeslag indienen
    records:
      cell: burger
      chronicle: aanvragen
      name: aanvraag_ingediend
      intake: aanvraag
      fields:
        - name: bsn
          type: string
        - name: jaar
          type: number
        - name: ondertekend_op
          type: date
      delivers_to:
        cell: toeslagen
        chronicle: aanvragen
        name: aanvraag_ontvangen
        intake: aanvraag
    conditions:
      - label: aanvraag binnen de termijn
        regulation: algemene_wet_inkomensafhankelijke_regelingen
        output: aanvraag_binnen_termijn
        params:
          berekeningsjaar: $jaar
          aanvraagdatum: $ondertekend_op
      - label: nog geen aanvraag ingediend
        lexostatus: ingediende_aanvraag
        output: jaar
        expect: null
        params:
          bsn: $bsn

act:
  - description: >-
      Op tijd, en de eerste: de wet zegt dat de termijn loopt, en in de eigen
      kroniek ligt nog niets.
    action: burger.aanvraag
    op_moment: 2024-01-10
    values:
      bsn: '999993653'
      jaar: 2024
      ondertekend_op: '2024-01-10'
    expect_conditions:
      aanvraag binnen de termijn: waar
      nog geen aanvraag ingediend: waar

  - description: >-
      Na 1 april van het jaar erna, en er ligt er al een. Beide voorwaarden
      onwaar, en de aanvraag gaat toch door: een voorwaarde toont, ze houdt
      niets tegen.
    action: burger.aanvraag
    op_moment: 2025-04-02
    values:
      bsn: '999993653'
      jaar: 2024
      ondertekend_op: '2025-04-02'
    expect_conditions:
      aanvraag binnen de termijn: onwaar
      nog geen aanvraag ingediend: onwaar

queries:
  - description: >-
      De late aanvraag is echt ingediend en geleverd: de voorwaarde op
      `onwaar` heeft haar niet tegengehouden.
    cell: toeslagen
    lexostatus: ontvangen_aanvraag
    params:
      bsn: '999993653'
    op_moment: 2025-04-02
    expect:
      jaar: 2024
      ondertekend_op: '2025-04-02'
