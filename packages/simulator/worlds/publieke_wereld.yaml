---
# De publieke wereld: het wereldbestand waarmee de HTTP-laag lokaal draait.
#
# Een **wereldbestand** is wat een wereld *is* — een klok, de cellen, de
# instellingen, de startstand, de acties en de termijnen — en niets van wat een
# scenario eroverheen legt (`act`, `decide`, `queries`, `query_graph`,
# `expect_*`). Een scenariobestand draagt zijn wereld in dezelfde velden inline,
# want een scenario is een run en niet een app; dit bestand is het omgekeerde:
# een wereld zonder run, om door een mens bespeeld te worden.
#
# De inhoud is die van `scenarios/toeslagen_volledig_verhaal.yaml`, met één cel
# erbij (`brp`) en zonder de stappen: aanvraag → besluit → betalingen → tweede
# besluit, allemaal aan te sturen via `actions`. Wat er in deze wereld gebeurt,
# gebeurt dus doordat iemand een actie kiest of de klok vooruit zet — precies
# waarvoor `packages/chrono-poc-web` bestaat.
#
# Er staat geen casus in Rust en geen casus in de frontend: elk label hieronder
# is data. Een andere casus is een ander bestand.

clock:
  start: 2024-01-01

settings:
  # Beleid en geen wet: de besluit-definitie verwijst ernaar met
  # `$betalingsritme` in plaats van een ritme voor te schrijven. Zodra het
  # besluit genomen is, staat deze instelling vast — het gram legt vast waarop
  # besloten is, en `PUT /api/settings` weigert haar daarna.
  betalingsritme: kwartaal

cells:
  # De aanvrager. Een bron-cel: geen wetten, geen engine. Wat zij houdt is haar
  # eigen journaal van wat zij indiende — en van wat zij terugbetaalde.
  - id: burger
    # De naam waaronder deze cel zich uitgeeft. Zij komt geen gezag na: ze ís de
    # partij, en dit is de naam die een omgekeerde verplichting als schuldenaar
    # aanwijst. Valt het slotbedrag van de vaststelling onder nul, dan is dit de
    # cel die terugbetaalt.
    identity: '999993653'
    laws: []
    chronicles:
      - stream: aanvragen
        key: bsn
        # Wat deze cel in deze stroom vastlegt, en van welk type. Het formulier
        # van de actie wordt er bij het optuigen aan gehouden, en elke
        # vastlegging bij het vastleggen.
        gebeurtenissen:
          - name: aanvraag_ingediend
            intake: aanvraag
            grondslag: Algemene wet inkomensafhankelijke regelingen, art. 15
            fields:
              - name: bsn
                type: string
              - name: jaar
                type: number
              - name: ondertekend_op
                type: date

      # Wat zij betaalde. Leeg opgetuigd: er komt pas iets in als er een termijn
      # vervalt waarvan zíj de schuldenaar is.
      - stream: betalingen
        key: zaakkenmerk
        # Het gebeurtenisschema van een betalingsstroom: welke gebeurtenissen
        # erin thuishoren, op welke grondslag ze berusten en welke velden ze
        # dragen. Wat het platform van zo'n stroom verlangt, staat hier als
        # data; het optuigen toetst of het er staat, en elke vastlegging of het
        # klopt. De andere cellen in deze wereld delen dit schema.
        #
        # Vier gebeurtenissen en niet twee: de vaststelling van Awir art. 19
        # draagt `richting_bij_negatief: omkeren`, dus uit diezelfde
        # verplichting kan ook een terugvordering komen — met de partijen
        # omgekeerd en een eigen naam, want een betaling terug is geen betaling
        # met een minteken. Elke cel die zo'n verplichting nakomt of er de
        # melding van vastlegt, heeft alle vier de namen nodig.
        gebeurtenissen: &betalingsschema
          - name: betaling_gedaan
            intake: betaling
            grondslag: Algemene wet bestuursrecht, art. 4:89
            fields: &betalingsvelden
              - name: zaakkenmerk
                type: string
              - name: bedrag
                type: amount
              - name: volgnummer
                type: number
              # Wat voor termijn het was. Het staat ook in de naam van de
              # gebeurtenis, en hier nog eens als veld: een reductie leest velden
              # en geen namen, en wie terugleest hoort uit het feit zelf te zien
              # dat dit een terugvordering was en geen betaling.
              - name: soort
                type: string
              - name: besluit
                type: string
              - name: schuldenaar
                type: string
              - name: schuldeiser
                type: string
          - name: betaling_gemeld
            intake: levering
            grondslag: Algemene wet bestuursrecht, art. 4:89
            fields: *betalingsvelden
          - name: terugvordering_gedaan
            intake: betaling
            grondslag: Algemene wet inkomensafhankelijke regelingen, art. 26
            fields: *betalingsvelden
          - name: terugvordering_gemeld
            intake: levering
            grondslag: Algemene wet inkomensafhankelijke regelingen, art. 26
            fields: *betalingsvelden

    lexostatus_definitions:
      - name: ingediende_aanvraag
        doc: wat deze aanvrager zelf indiende, en wanneer
        inputs:
          - name: bsn
            type: string
        outputs:
          - jaar
        reduction:
          chronicle: aanvragen
          key: bsn
          latest: true

      - name: betaald_tot_nu_toe
        doc: wat deze cel op deze zaak betaald heeft, opgeteld
        inputs:
          - name: zaakkenmerk
            type: string
        outputs:
          - bedrag
        reduction:
          chronicle: betalingen
          key: zaakkenmerk
          sum: bedrag

      - name: laatste_betaling
        doc: >-
          De laatste termijn die deze cel betaalde, met de soort en de twee
          partijen erbij — zodat te lezen is dat het feit zelf zegt wie aan wie
          betaalde, en niet alleen het besluit waaruit het volgt.
        inputs:
          - name: zaakkenmerk
            type: string
        outputs:
          - bedrag
          - soort
          - schuldenaar
          - schuldeiser
        reduction:
          chronicle: betalingen
          key: zaakkenmerk
          latest: true

    # De stand van de zaak bij deze cel: welke reducties het journaal vóór en ná
    # elke gebeurtenis meet, om er een "was → is" van te maken. Casusdata — het
    # platform weet alleen dát er indicatoren zijn, niet welke. `$veld` wijst een
    # veld van de gebeurtenis aan; draagt een gebeurtenis dat veld niet, dan gaat
    # deze indicator er niet over en wordt hij niet gereduceerd.
    status_indicators:
      - lexostatus: ingediende_aanvraag
        label: ingediende aanvraag
        params:
          bsn: $bsn
      - lexostatus: betaald_tot_nu_toe
        label: terugbetaald
        params:
          zaakkenmerk: $zaakkenmerk

  # Het register. Ook een bron-cel: ze legt vast en reduceert, en heeft geen
  # engine nodig om een gepubliceerde lexostatus te kunnen geven. Ze staat hier
  # zodat er in deze wereld één cel te bevragen is die niets berekent —
  # `GET /api/cells/brp/lexostatus/partnerschap` is het eenvoudigste antwoord
  # dat de opstelling kan geven, inclusief "niets vastgesteld" vóór 2023-03-01.
  - id: brp
    laws: []
    chronicles:
      - stream: relaties
        key: bsn
        gebeurtenissen:
          - name: relatie_gewijzigd
            intake: levering
            grondslag: eigen registratie
            fields:
              - name: bsn
                type: string
              - name: partnerschap_type
                type: string
              # Een veld dat `null` mag dragen: het register is hier
              # gezaghebbend en zegt dat er geen partner is. Dat is een waarde
              # en geen ontbrekend feit, en de typetoets laat haar dus door.
              - name: partner_bsn
                type: string
        events:
          - name: relatie_gewijzigd
            intake: levering
            recording_actor: brp
            grondslag: eigen registratie
            op_moment: 2023-03-01
            fields:
              bsn: '999993653'
              partnerschap_type: GEEN
              # Uitdrukkelijk leeg: het register is hier gezaghebbend en zegt
              # dat er geen partner is. Dat is een waarde, geen ontbrekend feit.
              partner_bsn: null

    lexostatus_definitions:
      - name: partnerschap
        doc: >-
          De relatievorm van één persoon op één moment, zoals deze cel die
          vastlegde. Geen berekening: de laatste vastlegging op of vóór het
          gevraagde moment.
        inputs:
          - name: bsn
            type: string
        outputs:
          - partnerschap_type
          - partner_bsn
        reduction:
          chronicle: relaties
          key: bsn
          latest: true

    status_indicators:
      - lexostatus: partnerschap
        label: partnerschap
        params:
          bsn: $bsn

  # De cel die het toetsingsinkomen vaststelt, en die de betalingsverplichtingen
  # van Dienst Toeslagen nakomt. Twee aanslagen: de tweede corrigeert de eerste,
  # en dat verschil is wat de vaststelling zichtbaar maakt — zij rekent op de
  # laatste aanslag en komt daarmee lager uit dan het voorschot.
  - id: belastingdienst
    laws: []
    # Deze cel komt de betalingsverplichtingen na die Dienst Toeslagen oplegt:
    # de wet zegt dát er betaald moet worden, dit zegt wie dat doet (Awir art.
    # 25). De binding loopt langs het bevoegd gezag en niet langs een cel-id:
    # de wet kent geen cellen, dus de enige naam die beide kanten kennen is die
    # van het gezag.
    komt_na:
      - Dienst Toeslagen
    chronicles:
      - stream: aanslagen
        key: bsn
        events:
          - name: aanslag_vastgesteld
            intake: eigen_besluit
            recording_actor: belastingdienst
            grondslag: Wet inkomstenbelasting 2001, hoofdstuk 2
            op_moment: 2024-03-01
            fields:
              bsn: '999993653'
              toetsingsinkomen: 81000
              competent_authority: Belastingdienst

          # De aanslag van de tweede aanvrager in het portaal (zie onderaan).
          # Een ander inkomen dan hierboven, zodat haar beschikking een ander
          # bedrag laat zien; en één aanslag, geen herziening — haar verhaal
          # hoeft niet het hele verhaal te zijn, alleen tot een besluit te
          # kunnen komen.
          - name: aanslag_vastgesteld
            intake: eigen_besluit
            recording_actor: belastingdienst
            grondslag: Wet inkomstenbelasting 2001, hoofdstuk 2
            op_moment: 2024-03-01
            fields:
              bsn: '999990019'
              toetsingsinkomen: 2800000
              competent_authority: Belastingdienst

          - name: aanslag_herzien
            intake: eigen_besluit
            recording_actor: belastingdienst
            grondslag: Wet inkomstenbelasting 2001, hoofdstuk 2
            op_moment: 2024-12-01
            fields:
              bsn: '999993653'
              toetsingsinkomen: 85000
              competent_authority: Belastingdienst

      - stream: betalingen
        key: zaakkenmerk
        # Hetzelfde schema als bij de aanvrager hierboven: wat er in een
        # betalingsstroom thuishoort, hangt aan de verplichting en niet aan de
        # cel die haar nakomt.
        gebeurtenissen: *betalingsschema

    lexostatus_definitions:
      - name: toetsingsinkomen
        doc: >-
          Het vastgestelde toetsingsinkomen op het gevraagde moment, met het
          bevoegd gezag erbij. Een consument die hierop leunt, hoort te kunnen
          zien wiens vaststelling dit is.
        inputs:
          - name: bsn
            type: string
        outputs:
          - toetsingsinkomen
          - competent_authority
        reduction:
          chronicle: aanslagen
          key: bsn
          latest: true

      - name: betaald_tot_nu_toe
        doc: wat deze cel op deze zaak betaald heeft, opgeteld
        inputs:
          - name: zaakkenmerk
            type: string
        outputs:
          - bedrag
        reduction:
          chronicle: betalingen
          key: zaakkenmerk
          sum: bedrag

    status_indicators:
      - lexostatus: toetsingsinkomen
        label: vastgesteld toetsingsinkomen
        params:
          bsn: $bsn
      # Op het zaakkenmerk van het besluit: daarop groepeert deze cel haar
      # betalingen, en dat is wat een betaling in haar velden draagt.
      - lexostatus: betaald_tot_nu_toe
        label: betaald
        params:
          zaakkenmerk: $zaakkenmerk

  - id: toeslagen
    # De naam waaronder deze cel zich uitgeeft. Het is een bewering: de
    # regeling die ze uitvoert wijst dit gezag aan, en een besluit door een cel
    # die iets anders beweert wordt geweigerd.
    identity: Dienst Toeslagen
    laws:
      - wet_op_de_zorgtoeslag
      - algemene_wet_inkomensafhankelijke_regelingen
      - regeling_standaardpremie

    chronicles:
      # De kroniek waarin de levering van de burger landt. Leeg opgetuigd: wat
      # erin komt, komt van een actie.
      - stream: aanvragen
        key: bsn
        # Dezelfde velden, een andere naam en een ander kanaal: wat de
        # aanvrager indiende, is bij deze cel een aanvraag die binnenkwam. Twee
        # grammen in twee kronieken, elk met een eigen schema.
        gebeurtenissen:
          - name: aanvraag_ontvangen
            intake: aanvraag
            grondslag: Algemene wet inkomensafhankelijke regelingen, art. 15
            fields:
              - name: bsn
                type: string
              - name: jaar
                type: number
              - name: ondertekend_op
                type: date

      - stream: relaties
        key: bsn
        gebeurtenissen:
          - name: relatie_gewijzigd
            intake: levering
            grondslag: melding uit de basisregistratie personen
            fields:
              - name: bsn
                type: string
              - name: partnerschap_type
                type: string
        events:
          - name: relatie_gewijzigd
            intake: levering
            recording_actor: toeslagen
            grondslag: melding uit de basisregistratie personen
            op_moment: 2023-01-01
            fields:
              bsn: '999993653'
              partnerschap_type: GEEN
          # En voor de tweede aanvrager in het portaal: de zorgtoeslagwet vraagt
          # naar het partnerschap, dus zonder deze melding valt er over haar
          # niets te berekenen.
          - name: relatie_gewijzigd
            intake: levering
            recording_actor: toeslagen
            grondslag: melding uit de basisregistratie personen
            op_moment: 2023-01-01
            fields:
              bsn: '999990019'
              partnerschap_type: GEEN

      - stream: inkomensleveringen
        key: bsn
        gebeurtenissen:
          - name: inkomenslevering
            intake: levering
            grondslag: jaarlijkse inkomenslevering
            fields:
              - name: bsn
                type: string
              - name: is_verzekerde
                type: boolean
              - name: vermogen
                type: amount
        events:
          - name: inkomenslevering
            intake: levering
            recording_actor: toeslagen
            grondslag: jaarlijkse inkomenslevering
            op_moment: 2023-11-15
            fields:
              bsn: '999993653'
              is_verzekerde: true
              vermogen: 0
          # Dezelfde levering voor de tweede aanvrager in het portaal: zonder
          # dit feit kan deze cel over haar niet besluiten.
          - name: inkomenslevering
            intake: levering
            recording_actor: toeslagen
            grondslag: jaarlijkse inkomenslevering
            op_moment: 2023-11-15
            fields:
              bsn: '999990019'
              is_verzekerde: true
              vermogen: 0

      # De besluitende cel houdt zelf ook een betalingsstroom: zij legt vast dat
      # haar gemeld is dat er betaald is.
      - stream: betalingen
        key: zaakkenmerk
        gebeurtenissen: *betalingsschema

    besluit_definitions:
      - name: zorgtoeslag_toekenning
        doc: >-
          Het eerste besluit over de zaak: recht en hoogte, met een
          betalingsverplichting eraan. Het toetsingsinkomen wordt geaccepteerd
          van de cel die het vaststelde en hier niet nagerekend (invariant I5).
        regulation: wet_op_de_zorgtoeslag
        output: heeft_recht_op_zorgtoeslag
        outputs:
          - hoogte_zorgtoeslag
        zaakkenmerk: zorgtoeslag/{bsn}
        params:
          # De persoon uit de aanvraag die deze cel geleverd kreeg. Vóór de
          # aanvraag ligt daar niets en staat het veld leeg.
          - name: bsn
            type: string
            prefill: $last:toeslagen.aanvragen.bsn
        inputs:
          bsn:
            param: bsn
          is_verzekerde:
            from_chronicle: inkomensleveringen
            field: is_verzekerde
          toetsingsinkomen:
            accept_from: belastingdienst
            lexostatus: toetsingsinkomen
            field: toetsingsinkomen
            params:
              bsn: $bsn

      - name: zorgtoeslag_vaststelling
        doc: >-
          Het tweede besluit over dezelfde zaak, en een ánder besluit: de
          vaststelling van de Awir (art. 19). Ze rekent de zorgtoeslag wél
          opnieuw uit, maar op het definitieve toetsingsinkomen — dát is wat lid
          1 aan de laatste aanslag knoopt — en het artikel haalt die berekening
          zelf bij de zorgtoeslagwet. Wat er van het voorschot is uitbetaald,
          vraagt ze aan de cel die uitbetaalde. Het verschil is het slotbedrag:
          de verrekening van art. 24, tweede lid.
        regulation: algemene_wet_inkomensafhankelijke_regelingen
        output: slotbedrag
        outputs:
          - vastgestelde_tegemoetkoming
        zaakkenmerk: zorgtoeslag/{bsn}
        params:
          # De persoon uit de aanvraag die deze cel geleverd kreeg. Vóór de
          # aanvraag ligt daar niets en staat het veld leeg.
          - name: bsn
            type: string
            prefill: $last:toeslagen.aanvragen.bsn
        inputs:
          bsn:
            param: bsn
          # Het **definitieve** toetsingsinkomen: de laatste aanslag, van de cel
          # die haar vaststelde. Awir art. 19, eerste lid knoopt de vaststelling
          # daaraan, en het artikel rekent er de zorgtoeslag mee uit — dus deze
          # cel levert hier hetzelfde feit aan als bij de toekenning, alleen
          # later, en de aanslag is inmiddels herzien. Niet nagerekend
          # (invariant I5).
          toetsingsinkomen:
            accept_from: belastingdienst
            lexostatus: toetsingsinkomen
            field: toetsingsinkomen
            params:
              bsn: $bsn
          # En over de celgrens, met het kenmerk van déze zaak: wat er als
          # voorschot is uitbetaald, weet de cel die het uitbetaalde. Niet
          # nagerekend en niet als eigen saldo bijgehouden (invariant I5).
          #
          # Art. 24, tweede lid verrekent wat er is *verleend*, en dat is op dit
          # moment hetzelfde bedrag: deze vaststelling vervangt het voorschot,
          # dus de termijnen die nog openstonden vervallen erdoor (gedeclareerd
          # in het lexogram van art. 19) en van de verlening blijft over wat er
          # is uitbetaald. Daardoor klopt de som op elk moment — ook als de
          # vaststelling vóór de laatste voorschottermijn valt.
          uitbetaalde_voorschotten:
            accept_from: belastingdienst
            lexostatus: betaald_tot_nu_toe
            field: bedrag
            params:
              zaakkenmerk: $zaakkenmerk

    lexostatus_definitions:
      - name: ontvangen_aanvraag
        doc: wat deze cel over deze persoon geleverd kreeg
        inputs:
          - name: bsn
            type: string
        outputs:
          - jaar
        reduction:
          chronicle: aanvragen
          key: bsn
          latest: true

      - name: zorgtoeslagbeschikking
        doc: >-
          Wat deze cel over deze zaak besloten heeft, op het gevraagde moment. De
          twee besluiten over één zaak leggen niet dezelfde uitkomsten vast — de
          toekenning zegt of er recht is en hoe hoog, de vaststelling wat er is
          vastgesteld en wat er nog volgt — dus ze staan hier alle vier, en een
          gram draagt waar het over ging.
        inputs:
          - name: zaakkenmerk
            type: string
        outputs:
          - heeft_recht_op_zorgtoeslag
          - hoogte_zorgtoeslag
          - vastgestelde_tegemoetkoming
          - slotbedrag
        reduction:
          chronicle: beschikkingen
          key: zaakkenmerk
          latest: true

      - name: openstaande_termijnen
        doc: >-
          Wat er van deze zaak nog openstaat: de termijnen die deze cel bij
          beschikking oplegde en die inmiddels vervielen, min wat er in haar
          eigen betalingenstroom op ligt. Naast wat er verwacht werd en wat er
          gebeurde, dus ook het verschil — en nog steeds een reductie over twee
          eigen kronieken, geen saldo dat ernaast wordt bijgehouden.
        inputs:
          - name: zaakkenmerk
            type: string
        reduction:
          openstaand: true
          key: zaakkenmerk

      - name: betaald_tot_nu_toe
        doc: >-
          Wat er op deze zaak betaald is, voor zover deze cel dat weet: een som
          over haar eigen meldingen, en dus een reductie — geen saldo dat naast
          de kroniek wordt bijgehouden.
        inputs:
          - name: zaakkenmerk
            type: string
        outputs:
          - bedrag
        reduction:
          chronicle: betalingen
          key: zaakkenmerk
          sum: bedrag

    status_indicators:
      - lexostatus: ontvangen_aanvraag
        label: ontvangen aanvraag
        params:
          bsn: $bsn
      - lexostatus: zorgtoeslagbeschikking
        label: toekenningspositie
        params:
          zaakkenmerk: $zaakkenmerk
      - lexostatus: betaald_tot_nu_toe
        label: betaald volgens de meldingen
        params:
          zaakkenmerk: $zaakkenmerk

actions:
  - id: burger.aanvraag
    actor: burger
    label: Aanvraag zorgtoeslag indienen
    doc: >-
      De aanvrager legt vast wat zij indient, en levert hetzelfde feit aan de
      uitvoerder. Twee grammen, elk in een eigen kroniek.
    records:
      cell: burger
      chronicle: aanvragen
      name: aanvraag_ingediend
      intake: aanvraag
      # Geen `grondslag` hier: die staat in het schema van de stroom waarin dit
      # gram landt. Dat een aanvraag op Awir art. 15 berust, geldt voor elke
      # aanvraag en niet voor deze ene — en dan hoort het één keer opgeschreven
      # te staan, op de plek die over het soort gaat.
      fields:
        # Voorgevuld met wat het register al weet. De aanvrager hoeft haar eigen
        # nummer niet over te typen; wie het anders wil, typt het anders.
        - name: bsn
          type: string
          prefill: $last:brp.relaties.bsn
        # Een letterlijke waarde: het berekeningsjaar van deze wereld.
        - name: jaar
          type: number
          prefill: 2024
        # Een datum als parameter. Op de draad ISO (jjjj-mm-dd); het scherm toont
        # de Nederlandse notatie, want dat is een kwestie van weergave en niet
        # van wat er vastligt. Zonder `prefill` staat de klok erin: een actor
        # doet iets op het moment dat de wereld staat.
        - name: ondertekend_op
          type: date
      delivers_to:
        cell: toeslagen
        chronicle: aanvragen
        name: aanvraag_ontvangen
        intake: aanvraag

  - id: toeslagen.toekenning
    actor: toeslagen
    label: Beslis op de aanvraag
    # Geen voorwaarde in dit bestand: of dit besluit nu genomen kan worden,
    # volgt uit zijn eigen inputs. Het leest `is_verzekerde` uit de eigen
    # kroniek `inkomensleveringen`, op de persoon uit de aanvraag die deze cel
    # ontving — dus zolang die aanvraag er niet ligt, is er geen persoon en geen
    # feit, en zegt het beeld dat met zoveel woorden.
    doc: Kan pas als er een aanvraag ligt.
    decides:
      cell: toeslagen
      besluit: zorgtoeslag_toekenning

  - id: toeslagen.vaststelling
    actor: toeslagen
    label: Stel de zorgtoeslag definitief vast
    # Ook hier geen voorwaarde in dit bestand. Maar anders dan bij de toekenning
    # zegt het beeld hier niets zinnigs: dit besluit heeft géén eigen feit — het
    # inkomen en het uitbetaalde voorschot komen allebei van een andere cel — en
    # beschikbaarheid kijkt met opzet niet over een celgrens (invariant I1, zie
    # de README). De actie heet dus altijd mogelijk, ook voordat er iets te
    # verrekenen valt; wie haar dan neemt, krijgt van de bevraagde cel te horen
    # dat zij niets vaststelde.
    doc: >-
      Kan pas echt als het voorschot loopt; dat blijkt bij het besluit en niet
      aan de knop.
    decides:
      cell: toeslagen
      besluit: zorgtoeslag_vaststelling

deadlines:
  - label: aanvraag ontvangen vóór 1 maart
    at: 2024-03-01
    warn_if_missing:
      cell: toeslagen
      chronicle: aanvragen
      name: aanvraag_ontvangen

# De blik van de aanvrager: twee pagina's naast "Achter de schermen". Op het
# aanvraagportaal staan alleen de acties van `actor`, met de formulieren
# ingevuld voor de gekozen persona; "inzicht in je aanvraag" stelt de vragen
# hieronder, elk aan één cel, en zet de antwoorden pas in de weergave naast
# elkaar (RFC-022 §4.1: combineren doet de consument, nooit een cel).
#
# Dit is inrichting van de opstelling en geen recht, en daarom staat het hier
# en niet in een regeling. Kiezen is een mock-login: er wordt niets vastgelegd.
portaal:
  actor: burger
  label: Aanvraagportaal
  personas:
    # De aanvrager over wie deze wereld het hele verhaal draagt: het
    # register, twee aanslagen (de tweede herziet de eerste) en de
    # inkomenslevering gaan over dit bsn. Met haar is alles te spelen, tot en
    # met de vaststelling.
    - id: aanvrager-a
      label: Aanvrager A (fictief)
      values:
        bsn: '999993653'
        jaar: 2024
    # Een tweede aanvrager: een ander bsn, hetzelfde berekeningsjaar (dan
    # gelden dezelfde wetsversies en past de klok) en een ander inkomen. Voor
    # haar liggen een aanslag, een relatiemelding en een inkomenslevering in
    # de startstand, dus over haar aanvraag kan besloten worden, en haar
    # beschikking toont een ander bedrag dan die van A.
    - id: aanvrager-b
      label: Aanvrager B (fictief)
      values:
        bsn: '999990019'
        jaar: 2024
  inzicht:
    - label: Beschikking zorgtoeslag
      cell: toeslagen
      lexostatus: zorgtoeslagbeschikking
      params:
        zaakkenmerk: zorgtoeslag/{bsn}
    - label: Uitbetaald
      cell: belastingdienst
      lexostatus: betaald_tot_nu_toe
      params:
        zaakkenmerk: zorgtoeslag/{bsn}
    - label: Openstaande termijnen
      cell: toeslagen
      lexostatus: openstaande_termijnen
      params:
        zaakkenmerk: zorgtoeslag/{bsn}
