---
$schema: >-
  https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.5.8/schema/v0.5.8/schema.json
$id: test_gezag_op_artikel
name: Testregeling met bevoegd gezag op het artikel
regulatory_layer: WET
bwb_id: BWBR9999904
publication_date: '2024-01-01'
valid_from: '2024-01-01'
url: https://example.com/test_gezag_op_artikel
competent_authority:
  name: Documentgezag

# Een testregeling, met opzet **niet** in het corpus: ze bestaat om een
# eigenschap van de opstelling aan te tonen en niet om recht weer te geven.
#
# Wat ze aantoont is RFC-002: het bevoegd gezag staat op het **artikel**, want
# één wet kan meer dan één gezag kennen. Het document hierboven noemt een
# gezag, en het artikel dat het besluit voortbrengt noemt een ander. Wie op
# dat artikel besluit, moet het gezag van het artikel dragen — het document is
# alleen de terugvaloptie voor een artikel dat zelf zwijgt.
articles:
  - number: '1'
    url: https://example.com/test_gezag_op_artikel#Artikel1
    text: >-
      De betrokkene komt in aanmerking indien hij verzekerd is. Het
      artikelgezag beslist hierover.
    machine_readable:
      competent_authority:
        name: Artikelgezag
      execution:
        produces:
          legal_character: BESCHIKKING
        parameters:
          - name: bsn
            type: string
            required: true
        input:
          - name: is_verzekerde
            type: boolean
            source:
              description: >-
                Wordt door de besluitende cel aangeleverd uit haar eigen
                kroniek; deze regeling wijst geen bron aan.
        output:
          - name: komt_in_aanmerking
            type: boolean
        actions:
          - output: komt_in_aanmerking
            value:
              operation: EQUALS
              subject: $is_verzekerde
              value: true
