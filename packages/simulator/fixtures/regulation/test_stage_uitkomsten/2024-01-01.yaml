---
$schema: >-
  https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.5.8/schema/v0.5.8/schema.json
$id: test_stage_uitkomsten
name: Testregeling subsidie met een uitkomst die van de bekendmaking afhangt
regulatory_layer: WET
bwb_id: BWBR9999920
publication_date: '2024-01-01'
valid_from: '2024-01-01'
url: https://example.com/test_stage_uitkomsten
competent_authority: Uitvoerder

# Een testregeling, met opzet **niet** in het corpus: ze bestaat om een
# eigenschap van de opstelling aan te tonen en niet om recht weer te geven.
#
# Wat ze aantoont is een uitkomst van de **eigen regeling** die pas bij de
# bekendmaking vaststaat, en die alleen bij het ene besluit hoort. Twee
# beschikkingen van hetzelfde soort (TOEKENNING): de verlening en de
# vaststelling. Een hook zou op allebei vuren; dat het uiterste moment van het
# voorschot van de bekendmaking afhangt, geldt alleen voor de verlening. Dat
# staat daarom op het artikel van de verlening, onder
# `stage_uitkomsten`, en niet in de algemene wet.
articles:
  - number: '1'
    url: https://example.com/test_stage_uitkomsten#Artikel1
    text: >-
      De uitvoerder verleent de subsidie. Het voorschot wordt betaald uiterlijk
      twee weken na de bekendmaking van de verlening.
    machine_readable:
      execution:
        produces:
          legal_character: BESCHIKKING
          decision_type: TOEKENNING
          extensions:
            chronolex:
              # Deze uitkomst van deze regeling staat pas bij de bekendmaking
              # vast (artikel 3 rekent haar uit), en ze hoort bij dít besluit.
              stage_uitkomsten:
                BEKENDMAKING:
                  - voorschot_uiterlijk_op
              verplichtingen:
                - soort: betaling
                  bedrag: $hoogte_voorschot
                  ritme: ineens
                  vanaf: bekendmaking
                  # De vervaldag komt uit de eigen regeling en niet uit de
                  # algemene wet: de verplichting noemt zelf welke uitkomst.
                  vervaldatum: voorschot_uiterlijk_op
                  grondslag: >-
                    Testregeling subsidie art. 1 jo. art. 3
        parameters:
          - name: bsn
            type: string
            required: true
        output:
          - name: subsidie_verleend
            type: boolean
          - name: hoogte_voorschot
            type: amount
            type_spec:
              unit: eurocent
        actions:
          - output: subsidie_verleend
            value: true
          - output: hoogte_voorschot
            value: 30000

  - number: '2'
    url: https://example.com/test_stage_uitkomsten#Artikel2
    text: >-
      De uitvoerder stelt de subsidie vast.
    machine_readable:
      # Hetzelfde soort beschikking als artikel 1, zonder `stage_uitkomsten`: bij
      # de bekendmaking van de vaststelling komt het uiterste moment van het
      # voorschot niet in het gram.
      execution:
        produces:
          legal_character: BESCHIKKING
          decision_type: TOEKENNING
        parameters:
          - name: bsn
            type: string
            required: true
        output:
          - name: subsidie_vastgesteld
            type: boolean
        actions:
          - output: subsidie_vastgesteld
            value: true

  - number: '3'
    url: https://example.com/test_stage_uitkomsten#Artikel3
    text: >-
      Het voorschot wordt betaald uiterlijk twee weken na de dag waarop de
      verlening is bekendgemaakt.
    machine_readable:
      execution:
        parameters:
          # De dag van de bekendmaking, onder de naam die de procedure van de
          # algemene wet ervoor gebruikt.
          - name: datum_bekendmaking
            type: date
            required: true
        output:
          - name: voorschot_uiterlijk_op
            type: date
        actions:
          - output: voorschot_uiterlijk_op
            value:
              operation: DATE_ADD
              date: $datum_bekendmaking
              weeks: 2

  - number: '4'
    url: https://example.com/test_stage_uitkomsten#Artikel4
    text: >-
      De uitvoerder verleent een aanvullende subsidie. Die wordt betaald
      uiterlijk vier weken na ontvangst van de aanvraag.
    machine_readable:
      # De vervaldag hangt hier niet aan de dag van de bekendmaking maar aan een
      # feit van het besluit zelf (art. 5). Wordt het besluit laat bekendgemaakt,
      # dan ligt die dag al achter de bekendmaking, en dan wordt de termijn op de
      # dag van de bekendmaking ingehaald: vóór die dag werkt het besluit niet.
      execution:
        produces:
          legal_character: BESCHIKKING
          decision_type: TOEKENNING
          extensions:
            chronolex:
              stage_uitkomsten:
                BEKENDMAKING:
                  - aanvulling_uiterlijk_op
              verplichtingen:
                - soort: betaling
                  bedrag: $hoogte_aanvulling
                  ritme: ineens
                  vanaf: bekendmaking
                  vervaldatum: aanvulling_uiterlijk_op
                  grondslag: >-
                    Testregeling subsidie art. 4 jo. art. 5
        parameters:
          - name: bsn
            type: string
            required: true
          - name: aanvraag_ontvangen_op
            type: date
            required: true
        output:
          - name: aanvulling_verleend
            type: boolean
          - name: hoogte_aanvulling
            type: amount
            type_spec:
              unit: eurocent
        actions:
          - output: aanvulling_verleend
            value: true
          - output: hoogte_aanvulling
            value: 20000

  - number: '5'
    url: https://example.com/test_stage_uitkomsten#Artikel5
    text: >-
      De aanvullende subsidie wordt betaald uiterlijk vier weken na ontvangst
      van de aanvraag.
    machine_readable:
      execution:
        parameters:
          # Een input van het besluit: de stage rekent op wat het besluit-gram
          # draagt, niet alleen op het formulier van de bekendmaking.
          - name: aanvraag_ontvangen_op
            type: date
            required: true
        output:
          - name: aanvulling_uiterlijk_op
            type: date
        actions:
          - output: aanvulling_uiterlijk_op
            value:
              operation: DATE_ADD
              date: $aanvraag_ontvangen_op
              weeks: 4
