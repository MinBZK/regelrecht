server {
    listen 8000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # The policy for this site; the header set that carries it lives in
    # /etc/nginx/security-headers.conf. Everything is served from this origin.
    #
    # script-src carries two allowances the other static sites do not need:
    # 'wasm-unsafe-eval' because the regelrecht engine runs as WebAssembly in
    # the browser, and blob: because the WASM glue is imported through a blob
    # URL (it lives under /wasm/pkg, outside the bundle; same as the editor).
    # style-src keeps 'unsafe-inline': the NDD components build a <style>
    # element and assign its textContent, which CSP counts as an inline style.
    set $csp "default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'";

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/wasm application/x-yaml text/yaml;

    # security.txt — redirect to the central NCSC file per the Rijksoverheid
    # CVD policy (https://www.ncsc.nl/.well-known/security.txt).
    location = /.well-known/security.txt {
        include /etc/nginx/security-headers.conf;
        return 302 https://www.ncsc.nl/.well-known/security.txt;
    }
    location = /security.txt {
        include /etc/nginx/security-headers.conf;
        return 302 https://www.ncsc.nl/.well-known/security.txt;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # The bundled corpus and the engine are fetched by the app; a file that is
    # not there must fail the fetch (404), not come back as index.html with 200.
    location ~ ^/(data|wasm)/ {
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # The WASM engine must be served with its own MIME type for streaming
    # compilation; nginx's default map lacks it.
    location ~* \.wasm$ {
        types { application/wasm wasm; }
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    location /health {
        access_log off;
        default_type text/plain;
        return 200 "OK";
    }
}
