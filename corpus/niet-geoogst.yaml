# Wetten die een binding in corpus/regulation leest, maar die nog niet in het
# corpus staan. script/cross-law-integriteit.py meldt zo'n binding als
# NIET-GEOOGST in plaats van hem rood te laten worden; een binding op een $id
# die hier niet staat, is een tikfout tot het tegendeel blijkt.
#
# Een regel die niet meer klopt, laat de controle rood worden: staat de wet
# inmiddels in het corpus, of leest geen binding hem meer, haal de regel dan weg.
# De lijst zegt dus altijd wat er nu ontbreekt.

verordening_eu_2018_1139:
