---
# Stand-off notes on the Healthcare Allowance Act (Wet op de zorgtoeslag).
# Format: RFC-005. Infrastructure: RFC-018. Validated by `just validate-annotations`.
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.5.2/schema/v0.5.2/annotation-schema.json
annotations:
  # Linking note: connects the text granting the allowance to the
  # machine_readable element that computes its amount. This makes the
  # interpretation chain from law text to executable logic auditable.
  - type: Annotation
    motivation: linking
    creator: Dienst Toeslagen
    target:
      source: regelrecht://wet_op_de_zorgtoeslag
      selector:
        type: TextQuoteSelector
        exact: zorgtoeslag
        prefix: 'heeft de verzekerde aanspraak op een '
        suffix: ' ter grootte van dat verschil'
    body:
      type: SpecificResource
      source: regelrecht://wet_op_de_zorgtoeslag/hoogte_zorgtoeslag
      purpose: linking
    resolution: found
    workflow: resolved

  # Commenting note: explains a domain term for readers.
  - type: Annotation
    motivation: commenting
    creator: J. de Vries
    target:
      source: regelrecht://wet_op_de_zorgtoeslag
      selector:
        type: TextQuoteSelector
        exact: normpremie
        prefix: 'Indien de '
        suffix: ' voor een verzekerde'
    body:
      type: TextualBody
      value: >-
        De normpremie is een fictief bedrag dat staat voor wat de verzekerde
        geacht wordt zelf aan zorgkosten bij te dragen. Het hangt af van het
        inkomen, niet van de feitelijk betaalde premie.
      purpose: commenting
      format: text/plain
      language: nl
    resolution: found

  # Questioning note over an open norm (RFC-018 Decision 6). The percentages
  # can be changed by ministerial regulation; until that regulation is located
  # and modelled, this is an open norm that is only partially filled in.
  - type: Annotation
    motivation: questioning
    creator: interpreter-team
    target:
      source: regelrecht://wet_op_de_zorgtoeslag
      selector:
        type: TextQuoteSelector
        exact: ministeriële regeling
        prefix: 'Bij '
        suffix: ' kunnen deze percentages'
    body:
      - type: TextualBody
        value: >-
          De percentages kunnen bij ministeriële regeling worden gewijzigd.
          De vigerende regeling is nog niet in het corpus opgenomen; de
          hardcoded percentages in machine_readable gelden tot dan.
        purpose: questioning
        format: text/plain
        language: nl
      - type: TextualBody
        value: open-norm-partial
        purpose: tagging
    workflow: open

  # The resolved end of the same lifecycle (RFC-018 Decision 6). The concrete
  # percentage for a verzekerde with a toeslagpartner is spelled out in the
  # law text and is modelled in machine_readable, so this part of the open
  # norm is filled in: the questioning note is kept for audit history but its
  # workflow is resolved.
  - type: Annotation
    motivation: questioning
    creator: interpreter-team
    target:
      source: regelrecht://wet_op_de_zorgtoeslag
      selector:
        type: TextQuoteSelector
        exact: 4,273 procent
        prefix: 'voor een verzekerde met een toeslagpartner '
        suffix: ' van het'
    body:
      - type: TextualBody
        value: >-
          Het percentage voor een verzekerde met toeslagpartner is in de
          wettekst opgenomen en gemodelleerd in machine_readable. Deze open
          norm is daarmee ingevuld; de note blijft staan voor de auditketen.
        purpose: questioning
        format: text/plain
        language: nl
      - type: TextualBody
        value: open-norm-partial
        purpose: tagging
    workflow: resolved

  # === Memorie van toelichting (RFC-039) ===
  # Notes that carry the legislature's own words to the text they explain, so a
  # trace can show not only what the engine computed but why the provision is
  # there. Every quotation below was retrieved from the published document and
  # checked literally against it; nothing here is paraphrase.

  # The MvT states the core of article 2 in one sentence, in the same terms the
  # article uses. It is the passage that justifies the subtraction the engine
  # performs, which is why it hangs on the words granting the difference.
  - type: Annotation
    motivation: describing
    creator: Kamerstukken II 2004/05, 29 762, nr. 3
    target:
      source: regelrecht://wet_op_de_zorgtoeslag
      selector:
        type: TextQuoteSelector
        exact: ter grootte van dat verschil
        prefix: 'heeft de verzekerde aanspraak op een zorgtoeslag '
        suffix: .
    body:
      - type: TextualBody
        value: >-
          Memorie van toelichting, artikelsgewijze toelichting bij artikel 2:
          "Een verzekerde komt in aanmerking voor een zorgtoeslag indien de voor
          hem geldende genormeerde kosten voor een zorgverzekeringsovereenkomst
          («normpremie») minder bedragen dan de geraamde gemiddelde premiekosten
          («standaardpremie»). De zorgtoeslag is gelijk aan het verschil tussen
          beide kostensoorten."
        purpose: describing
        format: text/plain
        language: nl
      - type: SpecificResource
        source: https://zoek.officielebekendmakingen.nl/kst-29762-3.html
        purpose: linking
    resolution: found
    workflow: resolved

  # Lid 4 is the one place where reading the original MvT actively misleads: it
  # explains a rule that never entered into force. The nota van wijziging
  # replaced it before enactment and called the original outcome unbalanced.
  # The note exists so that nobody mines the 2004 memorandum for this lid
  # without meeting the document that overruled it.
  - type: Annotation
    motivation: describing
    creator: Kamerstukken II 2004/05, 29 762, nr. 18
    target:
      source: regelrecht://wet_op_de_zorgtoeslag
      selector:
        type: TextQuoteSelector
        exact: vijftig procent
        prefix: 'die geen verzekerde is, '
        suffix: ' van het op grond'
    body:
      - type: TextualBody
        value: >-
          Dit lid stond niet in het wetsvoorstel. De nota van wijziging
          verving het: "Bij nader inzien achten wij de oorspronkelijke
          berekeningssystematiek, die erop neerkwam dat iemand met een
          niet-verzekerde partner vrijwel nooit in aanmerking kwam voor een
          zorgtoeslag, niet evenwichtig. Ten einde de verzekerde met een
          niet-verzekerde partner in een gelijke positie te brengen met een
          verzekerde wiens partner wel verzekerde is, bewerkstelligt het nieuwe
          vierde lid van artikel 2 [...] dat een verzekerde met een
          niet-verzekerde partner aanspraak heeft op de helft van het bedrag dat
          hem zou toekomen indien zowel de verzekerde als zijn partner verzekerd
          zouden zijn geweest."
        purpose: describing
        format: text/plain
        language: nl
      - type: TextualBody
        value: >-
          Let op bij het lezen van de oorspronkelijke memorie van toelichting:
          het derde rekenvoorbeeld daarin kent een verzekerde met een
          niet-verzekerde partner een zorgtoeslag van nul toe. Dat is juist de
          uitkomst die de wetgever ongewenst noemde en voor inwerkingtreding
          heeft gewijzigd. Het is geen wetgevingsbedoeling maar een verlaten
          ontwerp.
        purpose: commenting
        format: text/plain
        language: nl
      - type: SpecificResource
        source: https://zoek.officielebekendmakingen.nl/kst-29762-18.html
        purpose: linking
    resolution: found
    workflow: resolved
