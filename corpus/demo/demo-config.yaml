  TOESLAGEN/wet_op_het_kindgebonden_budget: kindgebonden_budget_jaar
  TOESLAGEN/wet_op_de_huurtoeslag: subsidiebedrag
  TOESLAGEN/wet_kinderopvang: jaarbedrag
  SVB/algemene_ouderdomswet: pensioenbedrag
  SVB/algemene_kinderbijslagwet: ontvangt_kinderbijslag
  SVB/algemene_nabestaandenwet: netto_uitkering
  SVB/participatiewet/aio: aio_aanvulling
  SZW/participatiewet/bijstand: basisbedrag
  SZW/besluit_bijstandverlening_zelfstandigen: algemene_bijstand_bedrag
  GEMEENTE_AMSTERDAM/participatiewet/bijstand/gemeenten: uitkeringsbedrag
  DUO/wet_studiefinanciering: studiefinanciering
  UWV/werkloosheidswet: ww_uitkering_per_maand
