---
# Demo configuration: the two presenter profiles and what each of them shows.
# Ported from the POC's web/demo_profiles.py, web/feature_flags.py and
# web/config/dashboard_outputs.json. Laws are addressed by `law_path`, the
# directory of the law file under corpus/demo/regulation/nl (the POC's law
# identifier), combined with the executing service.

default_profile: merijn

profiles:
  merijn:
    name: Merijn
    type: burger
    bsn: '999100001'
    kvk: null
    default_law: {law_path: zorgtoeslagwet, service: TOESLAGEN}
    default_feature: zorgtoeslagwet
    # Graaf: the laws that tell this persona's story (detentie -> verzekerd -> zorgtoeslag)
    graph_laws: [penitentiaire_beginselenwet, zvw, zorgtoeslagwet]
    zaaksysteem_service: TOESLAGEN
    portal_tab_label: Mijn overheid
    portal_heading: Waar heb ik recht op? Wat zijn mijn plichten?
    portal_subtitle: >-
      Bekijk hier uw toeslagen, uitkeringen, aangiften, en andere regelingen van de overheid.
    # DELEGATION staat aan: Merijn heeft ouderlijk gezag over twee kinderen
    # (Burgerlijk Wetboek) en vertegenwoordigt twee ondernemingen
    # (Machtigingenwet), waarvan één als vennoot met alleen leesrecht. Dat
    # verschil in rechten komt uit de wet zelf en is precies wat de demo laat
    # zien.
    # CHANGE_WIZARD: één ingang voor 'er is iets veranderd' (inkomen, huur,
    # adres, huishouden), naast de tegels die elk over één regeling gaan.
    # HARMONIZE: uit een simulatierun één vereenvoudigde regeling afleiden en
    # laten zien hoe dicht die bij de bestaande wetten blijft.
    feature_flags:
      DELEGATION: true
      AUTO_APPROVE_CLAIMS: false
      CHANGE_WIZARD: true
      HARMONIZE: true
    sidebar_laws: null
    disabled_laws:
      BELASTINGDIENST: [zorgverzekeringswet/bijdrage, zvw, zvw/werkgeversbijdrage]
      GEMEENTE_ROTTERDAM:
        - alcoholwet/vergunning/gemeenten
        - >-
          algemene_plaatselijke_verordening/exploitatievergunning/gemeenten
        - algemene_plaatselijke_verordening/terrassen
        - >-
          algemene_plaatselijke_verordening/ontheffingspas_geluid/gemeenten
        - verordening_precariobelasting/gemeenten
      KVK: [handelsregisterwet/jaarrekening]
      NVWA: [warenwet/haccp, warenwet/meldplicht]
      PENSIOENFONDS: [pensioenwet]
      RVO:
        - omgevingswet/werkgebonden_personenmobiliteit
        - omgevingswet/energiebesparing/informatieplicht
      SVB:
        - algemene_kinderbijslagwet
        - algemene_nabestaandenwet
        - algemene_ouderdomswet/leeftijdsbepaling
        - algemene_ouderdomswet_gegevens
        - participatiewet/aio
      TOESLAGEN: [wet_kinderopvang]
  claudia:
    name: Claudia
    type: ondernemer
    bsn: '999999990'
    kvk: '85234567'
    default_law:
      law_path: verordening_precariobelasting/gemeenten
      service: GEMEENTE_ROTTERDAM
    default_feature: verordening_precariobelasting
    # Graaf: the horeca chain in Rotterdam
    graph_laws:
      - alcoholwet/vergunning/rotterdam
      - alcoholwet/vergunning
      - algemene_plaatselijke_verordening/terrassen
      - verordening_precariobelasting
      - algemene_plaatselijke_verordening/exploitatievergunning
      - wet_bag
      - handelsregisterwet
      - handelsregisterwet/bedrijfsgegevens
    zaaksysteem_service: GEMEENTE_ROTTERDAM
    portal_tab_label: Mijn onderneming
    portal_heading: Welke regelingen passen bij mijn bedrijf?
    portal_subtitle: >-
      Bekijk beschikbare subsidies, rapportageverplichtingen, vergunningen, wetten en andere
      ondernemersregelingen.
    feature_flags: {DELEGATION: true, AUTO_APPROVE_CLAIMS: true}
    sidebar_laws: [verordening_precariobelasting/gemeenten]
    disabled_laws:
      BELASTINGDIENST: [zorgverzekeringswet/bijdrage, zvw, zvw/werkgeversbijdrage]
      DUO: [wet_studiefinanciering]
      GEMEENTE_AMSTERDAM: [participatiewet/bijstand/gemeenten]
      KIESRAAD: [kieswet]
      PENSIOENFONDS: [pensioenwet]
      RVO: [omgevingswet/werkgebonden_personenmobiliteit]
      SVB:
        - algemene_kinderbijslagwet
        - algemene_nabestaandenwet
        - algemene_ouderdomswet/leeftijdsbepaling
        - algemene_ouderdomswet_gegevens
        - participatiewet/aio
      SZW:
        - participatiewet/bijstand
        - besluit_bijstandverlening_zelfstandigen
      TOESLAGEN:
        - zorgtoeslagwet
        - wet_op_de_huurtoeslag
        - wet_op_het_kindgebonden_budget
        - wet_kinderopvang
      UWV:
        - werkloosheidswet
        - ziektewet
        - uwv_toetsingsinkomen
        - uwv_werkgegevens
        - wet_werk_en_inkomen_naar_arbeidsvermogen
        - wet_structuur_uitvoeringsorganisatie_werk_en_inkomen
        - wet_inkomstenbelasting

