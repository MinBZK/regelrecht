  LBB: [wet_bibob]
  SVH: [alcoholwet/register_sociale_hygiene]
  VWS: [alcoholwet/vergunning, zorgtoeslagwet/regelingen]
  ACICT: [wet_adviescollege_ict_toetsing]
  ANVS:
    - besluit_basisveiligheidsnormen_stralingsbescherming
    - besluit_kerninstallaties
    - kernenergiewet
  AWB: [algemene_wet_bestuursrecht/artikel_1_1_bestuursorgaan]
  RVO: [omgevingswet/werkgebonden_personenmobiliteit/gegevens]
  RvIG: [wet_brp, wet_brp/laa]
  BELASTINGDIENST: [wet_brp/terugmelding, belastingdienst_vermogen]
  CJIB: [wet_brp/terugmelding]
  TOESLAGEN: [wet_brp/terugmelding]
  JenV: [awb/bezwaar, awb/beroep]
  UWV:
    - wet_werk_en_inkomen_naar_arbeidsvermogen
    - ziektewet
    - uwv_werkgegevens
    - uwv_toetsingsinkomen
    - wet_structuur_uitvoeringsorganisatie_werk_en_inkomen
  RVZ: [zvw]
  NATIONAAL_ARCHIEF: [archiefwet]
  KVK: [handelsregisterwet/bedrijfsgegevens]
  SVB:
    - algemene_ouderdomswet_gegevens
    - algemene_ouderdomswet/leeftijdsbepaling
  CBS: [wet_op_het_centraal_bureau_voor_de_statistiek]

# Primary output per law for ranking tiles on the portal (largest impact first).
# Laws not listed fall back to their largest absolute numeric output.
dashboard_outputs:
  BELASTINGDIENST/wet_inkomstenbelasting: totale_belastingschuld
  TOESLAGEN/zorgtoeslagwet: hoogte_toeslag
  TOESLAGEN/wet_op_het_kindgebonden_budget: kindgebonden_budget_jaar
  TOESLAGEN/wet_op_de_huurtoeslag: subsidiebedrag
  TOESLAGEN/wet_kinderopvang: jaarbedrag
  SVB/algemene_ouderdomswet: pensioenbedrag
  SVB/algemene_kinderbijslagwet: ontvangt_kinderbijslag
  SVB/algemene_nabestaandenwet: netto_uitkering
  SVB/participatiewet/aio: aio_aanvulling
  SZW/participatiewet/bijstand: basisbedrag
  SZW/besluit_bijstandverlening_zelfstandigen: algemene_bijstand_bedrag
  GEMEENTE_AMSTERDAM/participatiewet/bijstand/gemeenten: uitkeringsbedrag
  DUO/wet_studiefinanciering: studiefinanciering
  UWV/werkloosheidswet: ww_uitkering_per_maand
  UWV/ziektewet: hoogte_ziekengeld
  UWV/wet_werk_en_inkomen_naar_arbeidsvermogen: hoogte_uitkering
  BELASTINGDIENST/zorgverzekeringswet/bijdrage: verschuldigde_bijdrage
  PENSIOENFONDS/pensioenwet: maandelijks_pensioen
  KIESRAAD/kieswet: heeft_stemrecht
  GEMEENTE_ROTTERDAM/verordening_precariobelasting/gemeenten: belasting_per_jaar
  GEMEENTE_ROTTERDAM/algemene_plaatselijke_verordening/terrassen: heeft_recht_op_terrasvergunning
  GEMEENTE_ROTTERDAM/alcoholwet/vergunning/gemeenten: heeft_recht_op_vergunning
  NVWA/warenwet/haccp: heeft_haccp_verplichting
  RVO/omgevingswet/energiebesparing/informatieplicht: heeft_informatieplicht
  NVWA/warenwet/meldplicht: heeft_meldplicht
  IND/vreemdelingenwet: heeft_verblijfsrecht

# Which YAML paths the law viewer opens by default for a law, so the audience
# sees the branch that matters (the POC's DEMO_COLLAPSE_CONFIG, trimmed to the
# laws on the default tabs). Paths are dotted, arrays by index or by the value
# of `output`/`name`.
# Simulatie: what adds up to a citizen's disposable income per month (the
# POC's "besteedbaar inkomen"). A law states its amount per month or per
# year; the law itself does not declare that, so it is configured here. Taxes
# are subtracted, benefits added, and only when the law's conditions are met.
simulation:
  disposable_income:
    - law: wet_inkomstenbelasting
      output: totale_belastingschuld
      period: year
      kind: tax
      label: Inkomstenbelasting
    - law: zorgverzekeringswet/bijdrage
      output: verschuldigde_bijdrage
      period: year
      kind: tax
      label: Bijdrage Zvw
    - law: zorgtoeslagwet
      output: hoogte_toeslag
      period: year
      kind: benefit
      label: Zorgtoeslag
    - law: wet_op_de_huurtoeslag
      output: subsidiebedrag
      period: month
      kind: benefit
      label: Huurtoeslag
    - law: wet_op_het_kindgebonden_budget
      output: kindgebonden_budget_jaar
      period: year
      kind: benefit
      label: Kindgebonden budget
    - law: wet_kinderopvang
      output: jaarbedrag
      period: year
      kind: benefit
      label: Kinderopvangtoeslag
    - law: algemene_ouderdomswet
      output: pensioenbedrag
      period: month
      kind: benefit
      label: AOW
    - law: algemene_nabestaandenwet
      output: netto_uitkering
      period: month
      kind: benefit
      label: Anw
    - law: participatiewet/aio
      output: aio_aanvulling
      period: month
      kind: benefit
      label: AIO
    - law: participatiewet/bijstand/amsterdam
      output: uitkeringsbedrag
      period: month
      kind: benefit
      label: Bijstand
    - law: participatiewet/bijstand/amsterdam
      output: woonkostentoeslag
      period: month
      kind: benefit
      label: Woonkostentoeslag
    - law: besluit_bijstandverlening_zelfstandigen
      output: algemene_bijstand_bedrag
      period: month
      kind: benefit
      label: Bbz
    - law: werkloosheidswet
      output: ww_uitkering_per_maand
      period: month
      kind: benefit
      label: WW

# What the Wetten tab shows unfolded per law, prepared for the story (the
# POC's DEMO_COLLAPSE_CONFIG). A path opens itself and everything above it;
# siblings stay folded, so the audience lands on the right lines instead of
# scrolling. `*` matches any article number; list items are addressed by their
# `name`/`output` or, without one, by their index.
expanded_paths:
  zorgtoeslagwet:
    # the insured-status input and where it comes from
    - articles.*.machine_readable.execution.input.is_verzekerde.source
    - articles.*.machine_readable.execution.output
    # the two requirements: age and insured
    - articles.*.machine_readable.execution.actions.voldoet_aan_voorwaarden.value.conditions.0
    - articles.*.machine_readable.execution.actions.voldoet_aan_voorwaarden.value.conditions.1
    # the calculation for a partner: joint income against the threshold
    - articles.*.machine_readable.execution.actions.hoogte_toeslag.value.default.value.cases.1.when
    - articles.*.machine_readable.execution.actions.hoogte_toeslag.value.default.value.cases.1.then.cases.0.when.subject.values
    - articles.*.machine_readable.execution.actions.hoogte_toeslag.value.default.value.cases.1.then.default.values.1.values.0.values.1.values.0.values
  zvw:
    - articles.*.machine_readable.execution.input.is_gedetineerd.source
    - articles.*.machine_readable.execution.output
    - articles.*.machine_readable.execution.actions.is_verzekerde.value.conditions.0.conditions
    - articles.*.machine_readable.execution.actions.is_verzekerde.value.conditions.1.value
  penitentiaire_beginselenwet:
    - articles.*.machine_readable.execution.input
    - articles.*.machine_readable.execution.output
    - articles.*.machine_readable.execution.actions.is_gedetineerd.value.conditions.0.values
    - articles.*.machine_readable.execution.actions.is_gedetineerd.value.conditions.1.values
  verordening_precariobelasting:
    - articles.*.machine_readable.execution.input
    - articles.*.machine_readable.execution.output
    - articles.*.machine_readable.execution.actions
  alcoholwet/vergunning/rotterdam:
    - articles.*.machine_readable.execution.output
  alcoholwet/vergunning:
    - articles.*.machine_readable.execution.output
  algemene_plaatselijke_verordening/terrassen:
    - articles.*.machine_readable.execution.input
    - articles.*.machine_readable.execution.output
  algemene_plaatselijke_verordening/exploitatievergunning:
    - articles.*.machine_readable.execution.output
  vliegbelasting_korting_klimaatneutraal_lu:
    - articles.*.machine_readable.execution.parameters
    - articles.*.machine_readable.execution.output
    - articles.*.machine_readable.execution.actions

# The presentation slides (Presentatie tab). A slide without `route` covers the
# screen (title, statement, closing); a slide with `route` puts the deck on the
# left and opens that tab, optionally switching the persona (`profile`) and
# pulsing a part of the screen (`highlight`, a CSS selector). `**text**` is bold.
slides:
  - kind: title
    title: RegelRecht
    subtitle: van wet naar digitale werking
    footer: Nederlandse Digitale Dienst
  - kind: statement
    overline: Huidige situatie
    lines:
      - Iedere organisatie
      - heeft een **eigen interpretatie** van de wet
      - die landt in **eigen software**
  - kind: statement
    overline: Het gevolg
    lines:
      - Geen overzicht
      - Onvoorspelbaar
      - Onbeheersbaar
  - kind: statement
    overline: Wat als
    lines:
      - We **beginnen met de wet**
      - Deze **machine-uitvoerbaar** maken
      - '**Openbaar** publiceren'
  - kind: section
    title: Demo RegelRecht
    lines:
      - Proof of concept
      - Compleet verhaal, geen eindproduct
      - We maken beleid door te doen
  - kind: demo
    overline: De wet
    title: De wet, machine-leesbaar
    lead: De wettekst en de uitvoerbare regel staan naast elkaar, per artikel.
    bullets:
      - 'Elk artikel heeft een **machine_readable**-deel: welke gegevens erin gaan, wat eruit komt en hoe.'
      - Een verwijzing naar een andere wet is expliciet, geen kopie van een bedrag.
      - Dezelfde YAML draait in de editor, in dit portaal en in de simulatie.
    route: /wetten
    highlight: .yaml-tree
  - kind: demo
    overline: Samenhang
    title: Wetten hangen samen
    lead: Of iemand verzekerd is, hangt af van detentie; of iemand zorgtoeslag krijgt, hangt af van verzekerd zijn.
    bullets:
      - 'Per wet: welke gegevens uit registers, welke uit andere wetten, wat eruit komt.'
      - Elke lijn is een echte verwijzing uit de wet, met de waarde voor deze persoon erbij.
      - Wijzigt een wet, dan zie je meteen wie dat raakt.
    route: /graaf
  - kind: demo
    overline: Toetsen
    title: De wet getoetst, in gewone taal
    lead: Scenario's beschrijven een persoon en wat de wet voor die persoon moet opleveren.
    bullets:
      - Gegeven een 17-jarige, dan geen zorgtoeslag. Gegeven een alleenstaande met laag inkomen, dan wel.
      - Dezelfde scenario's draaien hier in de browser en in de bouwstraat.
      - Wie de wet wijzigt, ziet welk scenario omvalt.
    route: /scenarios
  - kind: demo
    overline: Beleid
    title: Wat doet het met vijftigduizend mensen?
    lead: Een gegenereerde bevolking door alle regelingen, met de echte wetten.
    bullets:
      - Wie voldoet aan de voorwaarden, voor hoeveel, uitgesplitst naar leeftijd, inkomen, huishouden.
      - Draai aan een drempel in de wet en zie het verschil, voor de wet ingaat.
      - 'Ook voor ondernemers: vergunningen, meldplichten, precario.'
    route: /simulatie
  - kind: demo
    overline: De burger
    title: Eén burger, Merijn
    lead: ZZP'er in de thuiszorg, alleenstaande ouder met twee jonge kinderen.
    bullets:
      - Alles waar hij recht op heeft, live berekend door de wet zelf.
      - Elk gegeven is herleidbaar naar het register dat het leverde.
      - Klopt een gegeven niet? Hij corrigeert het, een behandelaar beoordeelt.
    route: /portaal
    profile: merijn
    highlight: nldd-card
  - kind: demo
    overline: Aanvragen
    title: Alleen vragen wat de overheid niet weet
    lead: De wet rekent met wat er al is en vraagt pas iets als ze vastloopt.
    bullets:
      - De huurtoeslag kent de huur niet. Dat is de enige vraag, op dat moment.
      - Na elk antwoord rekent de wet opnieuw.
      - Controleren, verklaren, indienen. Zonder formulier van tien pagina's.
    route: /portaal
    highlight: nldd-button[text="Gegevens aanvullen"]
  - kind: demo
    overline: De behandelaar
    title: Hetzelfde recht, andere kant van de balie
    lead: De aanvraag komt binnen met de berekening die de burger zag.
    bullets:
      - De engine rekent het opnieuw na met de geregistreerde gegevens.
      - Correcties van de burger staan klaar ter beoordeling.
      - Toekennen of afwijzen, met motivering; bezwaar komt via het portaal terug.
    route: /zaaksysteem
  - kind: demo
    overline: De ondernemer
    title: Een ondernemer, Claudia
    lead: Eigenaar van koffiezaak Noon in Rotterdam-West, met een terras.
    bullets:
      - 'Dezelfde engine, andere wetten: APV, Alcoholwet, Warenwet, precario.'
      - De terrasvergunning vraagt om locatie en oppervlakte; de precariobelasting rekent er meteen mee.
      - Gemeente, NVWA en RVO in één overzicht, zonder dat zij iets aan elkaar hoeven te vragen.
    route: /portaal
    profile: claudia
  - kind: statement
    overline: Ook buiten Nederland
    lines:
      - Dezelfde engine
      - werkt voor **andere jurisdicties**
      - hier: **Luxemburg**
  - kind: demo
    overline: Luxemburg
    title: Vliegbelasting, machine-uitvoerbaar
    lead: Een LU-demo-wet met Engelse scenario's — dezelfde engine als de Nederlandse wetten.
    bullets:
      - Klimaatneutraal én (binnenlands of korter dan 500 km) geeft **50% korting**.
      - Scenario's staan in het **Engels** voor internationale demos.
      - In de graaf kies je deze wet **los** bij; hij zit niet in het Merijn-verhaal.
    route: /scenarios
  - kind: closing
    overline: Demo RegelRecht
    title: Proof of concept
    lines:
      - Compleet verhaal, **geen eindproduct**
      - We maken beleid **door te doen**
    link:
      href: https://regelrecht.rijks.app
      label: regelrecht.rijks.app
