  GEMEENTE_ROTTERDAM/alcoholwet/vergunning/gemeenten: heeft_recht_op_vergunning
  NVWA/warenwet/haccp: heeft_haccp_verplichting
  RVO/omgevingswet/energiebesparing/informatieplicht: heeft_informatieplicht
