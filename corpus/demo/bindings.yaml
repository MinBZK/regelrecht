    # onbekende waarde (vgl. nullable: true op max_sluitingstijd_doordeweeks in de wet).
    absent: null
  max_sluitingstijd_weekend:
    table: terrassenbeleid
    field: max_sluitingstijd_weekend
    select_on:
      - name: adres
        value: $vestigingsadres
      - name: seizoen
        value: $seizoen
    kind: table
    service: GEMEENTE_ROTTERDAM
    # Art. 2:30b lid 1/2 APV Rotterdam: geen rij in terrassenbeleid betekent geen beleid voor dit
    # gebied/seizoen, dus geen maximum sluitingstijd vastgesteld: een echte afwezigheid, geen
    # onbekende waarde (vgl. nullable: true op max_sluitingstijd_weekend in de wet).
    absent: null
  tarief_per_m2:
    table: precario_tarieven
    field: tarief_per_m2
    select_on:
      - name: adres
        value: $vestigingsadres
      - name: gebruik
