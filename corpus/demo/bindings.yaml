    # Art. 2:30b lid 1/2 APV Rotterdam: geen rij in precario_tarieven betekent geen tarief
    # vastgesteld voor dit adres/gebruik: een echte afwezigheid, geen onbekende waarde
    # (vgl. nullable: true op tarief_per_m2 in de wet).
    absent: null
