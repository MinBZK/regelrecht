    service: GEMEENTE_ROTTERDAM
    # Art. 2:30b lid 1/2 APV Rotterdam: het register (BGT-terraslocaties) is gezaghebbend over
    # welke oppervlakte voor een adres/locatie is toegestaan. Geen rij betekent geen
    # BGT-terraslocatie voor dit adres/locatie, dus geen toegestane oppervlakte: een echte
    # afwezigheid, geen onbekende waarde (vgl. nullable: true op beschikbare_oppervlakte in de wet).
    absent: null
  functie_oppervlak:
    table: bgt_terraslocaties
    field: functie_oppervlak
    select_on:
      - name: adres
        value: $vestigingsadres
      - name: locatie
        value: $terras_locatie
