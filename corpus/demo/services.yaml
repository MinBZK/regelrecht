# Which organisation executes which law. This is a deployment choice, not
# something the statute says: GEMEENTE_ROTTERDAM is the municipality this demo
# picked, NOTARIAAT is a profession. It drives logos, graph colours, grouping
# and the "Bron: ..." line under a value, never who is competent to decide.
# That question is `competent_authority` on the article, and it is a smaller
# set: only the articles that actually produce a beschikking (RFC-002).
# Keyed by law `$id`; every version of a law shares one executing service.
