# Fryske oerlaach op demo-config.yaml en profiles.yaml.
#
# Het Nederlands in die bestanden is de bron en blijft daar staan; dit bestand
# zegt per pad wat de Friese tekst is. Elk pad moet bestaan: `check-i18n.mjs`
# weigert een pad dat nergens heen wijst, zodat deze vertaling niet stilletjes
# kan verouderen als de dia's veranderen.
#
# Vertaald door een taalmodel en nog niet nagekeken door een Friestalige
# revisor. Wat daarbij aandacht nodig heeft, staat in de PR-omschrijving.

