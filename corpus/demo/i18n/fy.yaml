slides.1.overline: Hjoeddeistige sitewaasje
slides.1.lines.0: Eltse organisaasje
slides.1.lines.1: hat in **eigen útlis** fan 'e wet
slides.1.lines.2: dy't lânet yn **eigen software**
slides.2.overline: It gefolch
slides.2.lines.0: Gjin oersjoch
slides.2.lines.1: Net te foarsizzen
slides.2.lines.2: Net te behearskjen
slides.3.overline: Wat as
slides.3.lines.0: Wy **begjinne by de wet**
slides.3.lines.1: Dy **masine-útfierber** meitsje
slides.3.lines.2: '**Iepenbier** publisearje'
slides.4.title: Demo RegelRecht
slides.4.lines.0: Folslein ferhaal, gjin einprodukt
slides.4.lines.1: Wy meitsje belied troch te dwaan
slides.5.overline: De wet
slides.5.title: De wet, masine-lêsber
slides.5.lead: De wettekst en de útfierbere regel steane neistinoar, per artikel.
slides.5.bullets.0: >-
  Elk artikel hat in **machine_readable**-diel: hokker gegevens deryn geane, wat derút komt en hoe.
slides.5.bullets.1: In ferwizing nei in oare wet is eksplisyt, gjin kopy fan in bedrach.
slides.5.bullets.2: Deselde YAML draait yn 'e editor, yn dit portaal en yn 'e simulaasje.
slides.6.overline: Gearhing
slides.6.title: Wetten hingje gear
slides.6.lead: >-
  Oft immen fersekere is, hinget ôf fan detinsje; oft immen soarchtaslach krijt, hinget ôf fan fersekere
  wêzen.
slides.6.bullets.0: 'Per wet: hokker gegevens út registers, hokker út oare wetten, wat derút komt.'
slides.6.bullets.1: Eltse line is in echte ferwizing út 'e wet, mei de wearde foar dizze persoan derby.
slides.6.bullets.2: Feroaret in wet, dan sjogge jo fuortendaliks wa't dat rekket.
slides.7.overline: Toetse
slides.7.title: De wet toetst, yn gewoane taal
slides.7.lead: Senario's beskriuwe in persoan en wat de wet foar dy persoan opsmite moat.
slides.7.bullets.0: >-
  Jûn in 17-jierrige, dan gjin soarchtaslach. Jûn in allinnichsteande mei leech ynkommen, dan al.
slides.7.bullets.1: Deselde senario's draaie hjir yn 'e browser en yn 'e boustrjitte.
slides.7.bullets.2: Wa't de wet feroaret, sjocht hokker senario omfalt.
slides.8.overline: Belied
slides.8.title: Wat docht it mei fyftichtûzen minsken?
slides.8.lead: In generearre befolking troch alle regelingen hinne, mei de echte wetten.
slides.8.bullets.0: >-
  Wa't oan 'e betingsten foldocht, foar hoefolle, útsplitst nei leeftyd, ynkommen, húshâlden.
slides.8.bullets.1: Draai oan in drompel yn 'e wet en sjoch it ferskil, foar't de wet yngiet.
slides.8.bullets.2: 'Ek foar ûndernimmers: fergunningen, meldplichten, prekario.'
slides.9.overline: De boarger
slides.9.title: Ien boarger, Merijn
slides.9.lead: ZZP'er yn 'e thússoarch, allinnichsteande âlder mei twa jonge bern.
slides.9.bullets.0: Alles dêr't er rjocht op hat, live berekkene troch de wet sels.
slides.9.bullets.1: Elk gegeven is werom te fieren op it register dat it levere.
slides.9.bullets.2: Kloppet in gegeven net? Hy korrizjearret it, in behanneler beoardielet.
slides.10.overline: Oanfreegje
slides.10.title: Allinne freegje wat de oerheid net wit
slides.10.lead: De wet rekkenet mei wat der al is en freget pas wat as se fêstrint.
slides.10.bullets.0: De hiertaslach ken de hier net. Dat is de iennige fraach, op dat stuit.
slides.10.bullets.1: Nei elk antwurd rekkenet de wet opnij.
slides.10.bullets.2: Kontrolearje, ferklearje, yntsjinje. Sûnder formulier fan tsien siden.
slides.11.overline: De behanneler
slides.11.title: Itselde rjocht, oare kant fan 'e baalje
slides.11.lead: De oanfraach komt binnen mei de berekkening dy't de boarger seach.
slides.11.bullets.0: De engine rekkenet it opnij nei mei de registrearre gegevens.
slides.11.bullets.1: Korreksjes fan 'e boarger steane klear om beoardiele te wurden.
slides.11.bullets.2: Takenne of ôfwize, mei motivearring; beswier komt fia it portaal werom.
slides.12.overline: De ûndernimmer
slides.12.title: In ûndernimmer, Claudia
slides.12.lead: Eigener fan koffiesaak Noon yn Rotterdam-West, mei in terras.
slides.12.bullets.0: 'Deselde engine, oare wetten: APV, Alcoholwet, Warenwet, prekario.'
slides.12.bullets.1: >-
  De terrasfergunning freget om lokaasje en oerflak; de prekariobelesting rekkenet der fuortendaliks mei.
slides.12.bullets.2: Gemeente, NVWA en RVO yn ien oersjoch, sûnder dat sy inoar wat freegje hoege.
