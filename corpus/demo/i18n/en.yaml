# ---- het presentatiedeck ----------------------------------------------------
slides.0.title: RegelRecht
slides.0.subtitle: from law to digital effect
slides.0.footer: Netherlands Digital Service

slides.1.overline: Today
slides.1.lines.0: Every organisation
slides.1.lines.1: has its **own reading** of the law
slides.1.lines.2: which lands in **its own software**

slides.2.overline: The result
slides.2.lines.0: No overview
slides.2.lines.1: Unpredictable
slides.2.lines.2: Unmanageable

slides.3.overline: What if
slides.3.lines.0: We **start with the law**
slides.3.lines.1: Make it **machine-executable**
slides.3.lines.2: Publish it **openly**

slides.4.title: RegelRecht demo
slides.4.lines.0: A complete story, not a finished product
slides.4.lines.1: We make policy by doing

slides.5.overline: The law
slides.5.title: The law, machine-readable
slides.5.lead: The legal text and the executable rule sit side by side, article by article.
slides.5.bullets.0: >-
  Every article has a **machine_readable** part: what goes in, what comes out,
  and how.
slides.5.bullets.1: A reference to another law is explicit, not a copied amount.
slides.5.bullets.2: The same YAML runs in the editor, in this portal and in the simulation.

slides.6.overline: Coherence
slides.6.title: Laws hang together
slides.6.lead: >-
  Whether you are insured depends on detention; whether you get healthcare
  allowance depends on being insured.
slides.6.bullets.0: 'Per law: which data from registers, which from other laws, what comes out.'
slides.6.bullets.1: Every line is a real reference from the law, with this person's value on it.
slides.6.bullets.2: Change a law and you see at once who it touches.

slides.7.overline: Testing
slides.7.title: The law tested, in plain language
slides.7.lead: A scenario describes a person and what the law should produce for them.
slides.7.bullets.0: >-
  Given a 17-year-old, no healthcare allowance. Given a single person on a low
  income, yes.
slides.7.bullets.1: The same scenarios run here in the browser and in the build pipeline.
slides.7.bullets.2: Change the law and you see which scenario falls over.

slides.8.overline: Policy
slides.8.title: What does it do to fifty thousand people?
slides.8.lead: A generated population through every scheme, with the real laws.
slides.8.bullets.0: >-
  Who meets the conditions, for how much, broken down by age, income and
  household.
slides.8.bullets.1: Turn a threshold in the law and see the difference, before it takes effect.
slides.8.bullets.2: 'For businesses too: permits, reporting duties, precario tax.'

slides.9.overline: The citizen
slides.9.title: One citizen, Merijn
slides.9.lead: Self-employed in home care, a single parent with two young children.
slides.9.bullets.0: Everything he is entitled to, computed live by the law itself.
slides.9.bullets.1: Every fact traces back to the register that supplied it.
slides.9.bullets.2: A fact wrong? He corrects it, a case officer assesses it.

slides.10.overline: Applying
slides.10.title: Asking only what government does not know
slides.10.lead: The law computes with what is already there, and asks only when it gets stuck.
slides.10.bullets.0: Housing benefit does not know the rent. That is the only question, at that moment.
slides.10.bullets.1: After every answer the law computes again.
slides.10.bullets.2: Check, declare, submit. Without a ten-page form.

slides.11.overline: The case officer
slides.11.title: The same right, the other side of the desk
slides.11.lead: The application arrives with the calculation the citizen saw.
slides.11.bullets.0: The engine recomputes it against the registered data.
slides.11.bullets.1: The citizen's corrections are waiting to be assessed.
slides.11.bullets.2: Grant or refuse, with reasons; an objection comes back through the portal.

slides.12.overline: The entrepreneur
slides.12.title: An entrepreneur, Claudia
slides.12.lead: Owner of the coffee bar Noon in Rotterdam West, with a terrace.
slides.12.bullets.0: 'The same engine, other laws: local by-laws, alcohol, food safety, precario tax.'
slides.12.bullets.1: >-
  The terrace permit asks for location and area; the precario tax computes with
  it straight away.
slides.12.bullets.2: >-
  The municipality, the food authority and the enterprise agency in one
  overview, without having to ask each other anything.

slides.13.overline: RegelRecht demo
slides.13.title: From law to digital effect
slides.13.lines.0: A complete story, **not a finished product**
slides.13.lines.1: We make policy **by doing**
slides.13.link.label: regelrecht.rijks.app
