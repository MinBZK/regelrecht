---
# Engelse overlay op demo-config.yaml.
#
# Het Nederlands in demo-config.yaml is de bron en blijft daar staan; dit
# bestand zegt per pad wat de Engelse tekst is. Elk pad moet bestaan in dat
# bestand: `check-i18n.mjs` weigert een pad dat nergens heen wijst, zodat deze
# vertaling niet stilletjes kan verouderen als de dia's veranderen.
#
# Een pad-gesleutelde sidecar en geen `_en`-velden in demo-config.yaml zelf:
# `slides:` is een lijst die iemand leest en bewerkt als lopende tekst, en daar
# om en om Nederlands en Engels doorheen zetten maakt precies het bestand
# onleesbaar waar het om de leesbaarheid gaat.
#
# Over het deck: Engels valt op een dia langer uit dan Nederlands. Deze
# vertaling is daarom op sommige plekken korter dan een letterlijke zou zijn,
# want een regel die omslaat kost meer dan een bijzin oplevert.

# ---- de twee persona's ------------------------------------------------------
