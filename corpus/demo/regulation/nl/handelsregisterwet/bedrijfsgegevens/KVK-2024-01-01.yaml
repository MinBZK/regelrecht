articles:
  - number: '14'
    text: >-
      1 In het handelsregister worden over een vestiging van een rechtspersoon waaraan geen
      onderneming toebehoort opgenomen:
        a. een door de Kamer toegekend uniek nummer;
        b. de naam;
        c. het post- en bezoekadres;
        d. de datum van ingebruikname of beëindiging.
      2 Indien een rechtspersoon meerdere vestigingen heeft, wordt in het handelsregister
      opgenomen welke vestiging de hoofdvestiging of de hoofdnederzetting is.
