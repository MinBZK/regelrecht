articles:
  - number: '3'
    text: >-
      1. Het CBS heeft tot taak het van overheidswege verrichten van statistisch onderzoek ten
      behoeve van praktijk, beleid en wetenschap en het openbaar maken van de op grond van
      zodanig onderzoek samengestelde statistieken. 2. Het CBS bevordert: a. een statistische
      informatievoorziening van overheidswege die voorziet in de behoeften van praktijk, beleid
      en wetenschap; b. de nauwkeurigheid en volledigheid van de van overheidswege openbaar te
      maken statistieken. 3. Door Onze Minister of een van Onze andere Ministers wordt slechts
      een nieuw statistisch onderzoek ingesteld of in een onderzoek dat reeds plaatsvindt
      wijziging gebracht, nadat de directeur-generaal is gehoord.
    url: https://wetten.overheid.nl/BWBR0015926/2024-01-01#Artikel3
    machine_readable:
      execution:
        produces:
          legal_character: INFORMATIEF
          decision_type: GEEN_BESLUIT
        parameters:
          # Art. 3, eerste lid: het CBS voert onderzoek uit en maakt statistieken openbaar
          # (levensverwachting); de tekst kent geen aanwijzing van een individuele burger.
          # De aanroep vanuit algemene_ouderdomswet/leeftijdsbepaling geeft bsn wel door,
          # maar de binding (bindings.yaml) selecteert de levensverwachting uitsluitend op
          # jaar, niet op bsn. Daarom optioneel in plaats van verplicht.
          - name: bsn
            type: string
            required: false
        input:
          - name: verwachting_65
            type: number
            source: {}
        output:
          - name: levensverwachting_65
            type: number
            type_spec:
              unit: years
              precision: 2
              min: 0
        actions:
          - output: levensverwachting_65
            value: $verwachting_65
