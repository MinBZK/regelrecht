$id: algemene_kinderbijslagwet
regulatory_layer: WET
publication_date: '2020-01-01'
valid_from: '2020-01-01'
name: Kinderbijslag gegevens
bwb_id: BWBR0002368
url: https://wetten.overheid.nl/BWBR0002368/2020-01-01
service: SVB
uuid: 2e4f7a9b-5c8d-4e1a-9f3b-6d2e8a4c7f1b
articles:
  - number: '6'
    text: >-
      1 Verzekerd overeenkomstig de bepalingen van deze wet is degene, die
        a. ingezetene is;
        b. geen ingezetene is, doch ter zake van in Nederland of op het continentaal plat
      in dienstbetrekking verrichte arbeid aan de loonbelasting is onderworpen. 2 Niet verzekerd
      is de vreemdeling die niet rechtmatig in Nederland verblijf houdt in de zin van artikel 8,
      onder a tot en met e en l, van de Vreemdelingenwet 2000.

      3 Bij of krachtens algemene maatregel van bestuur kan, in afwijking van het eerste en
      tweede lid, uitbreiding dan wel beperking worden gegeven aan de kring der verzekerden.

      4 Bij een maatregel, als bedoeld in het derde lid, kan worden bepaald dat bij een niet
      rechtmatig verblijf in Nederland in de zin van artikel 8, onder a tot en met e en l,
      verzekerd zijn:
        a. vreemdelingen die rechtmatig in Nederland arbeid verrichten, dan wel hebben
      verricht;
        b. vreemdelingen die, na rechtmatig verblijf te hebben gehouden in de zin van artikel
      8, onder a tot en met e en l, van de Vreemdelingenwet 2000, rechtmatig in Nederland
      verblijf hebben als bedoeld in artikel 8, onder g of h, van de Vreemdelingenwet 2000.
    url: https://wetten.overheid.nl/BWBR0002368/2020-01-01#Artikel6
    machine_readable:
      execution:
        produces:
          legal_character: BESCHIKKING
          decision_type: TOEKENNING
        parameters:
          - name: bsn
            type: string
            required: true
        input:
          - name: kinderen_data
            type: object
            nullable: true
            source: {}
        output:
          - name: ontvangt_kinderbijslag
            type: boolean
          - name: aantal_kinderen
            type: number
            type_spec:
              precision: 0
              min: 0
          - name: kinderen_leeftijden
            type: array
        actions:
          - output: ontvangt_kinderbijslag
            # Art. 7 AKW: recht op kinderbijslag bestaat voor een kind waarvoor de SVB het recht
            # heeft vastgesteld. De SVB is daarvoor gezaghebbend: zonder dossier ontvangt niemand
            # kinderbijslag, is er geen kind waarvoor zij wordt betaald en zijn er geen leeftijden
            # te tellen. Zonder deze gevallen waren de drie uitkomsten afwezig (een eigenschap van
            # een afwezig dossier) en kon het kindgebonden budget er niet mee rekenen (RFC-036).
            value:
              operation: IF
              cases:
                - when:
                    operation: NOT
                    value:
                      operation: EQUALS
                      subject: $kinderen_data
                      value: null
                  then: $kinderen_data.ontvangt_kinderbijslag
              default: false
          - output: aantal_kinderen
            value:
              operation: IF
              cases:
                - when:
                    operation: NOT
                    value:
                      operation: EQUALS
                      subject: $kinderen_data
                      value: null
                  then: $kinderen_data.aantal_kinderen
              default: 0
          - output: kinderen_leeftijden
            value:
              operation: IF
              cases:
                - when:
                    operation: NOT
                    value:
                      operation: EQUALS
                      subject: $kinderen_data
                      value: null
                  then: $kinderen_data.kinderen_leeftijden
              default:
                operation: LIST
                items: []
