---
$schema: >-
  https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.5.8/schema/v0.5.8/schema.json
$id: besluit_bijstandverlening_zelfstandigen
regulatory_layer: WET
publication_date: '2025-01-01'
valid_from: '2025-01-01'
name: Bijstand voor Zelfstandigen (Bbz 2004)
bwb_id: BWBR0015711
url: https://wetten.overheid.nl/BWBR0015711/2025-01-01
service: SZW
uuid: 7d4e8f2a-3b6c-4a9d-8e1f-5c2d7a9b4e3f
discoverable: CITIZEN
articles:
  - number: '2'
    text: >-
      1 Algemene bijstand kan worden verleend aan:
        a. de zelfstandige die gedurende een redelijke termijn als zodanig werkzaam is
      geweest en wiens bedrijf of zelfstandig beroep levensvatbaar is;
        b. de persoon of de echtgenoot van de persoon die uit hoofde van werkloosheid een
      uitkering ontvangt en die een bedrijf of zelfstandig beroep begint dat levensvatbaar is;
        c. de zelfstandige geboren voor 1 januari 1960, wiens bedrijf of zelfstandig beroep
      niet levensvatbaar is en die het bedrijf of zelfstandig beroep gedurende een
      aaneengesloten periode van 10 jaar onmiddellijk voorafgaand aan de aanvraag heeft
      uitgeoefend en hieruit een inkomen geniet dat duurzaam ontoereikend is om in de
      noodzakelijke kosten van het bestaan te voorzien;
        d. de zelfstandige wiens bedrijf of zelfstandig beroep niet levensvatbaar is en
      die zich verplicht de activiteiten in het bedrijf of zelfstandig beroep zo spoedig
      mogelijk, doch uiterlijk binnen 12 maanden, te beëindigen. 2 Bijstand ter voorziening in
      de behoefte aan bedrijfskapitaal kan slechts worden verleend aan de zelfstandige, bedoeld
      in de onderdelen a, b en c van het eerste lid.

      3 Bijstandsverlening aan een persoon die algemene bijstand ontvangt, die voornemens is een
      bedrijf of zelfstandig beroep te beginnen en zich in verband hiermee niet beschikbaar
      stelt voor arbeid in dienstbetrekking kan gedurende een voorbereidingsperiode van ten
      hoogste 12 maanden worden voortgezet. In een zodanig geval:
        a. zijn de artikelen 9, met uitzondering van het eerste lid, onderdeel c, en 10
      van de wet niet van toepassing;
        b. is de belanghebbende verplicht mee te werken aan door het college aangewezen
      begeleiding.
    url: https://wetten.overheid.nl/BWBR0015711/2025-01-01#Artikel2
    machine_readable:
      definitions:
        vermogensgrens_laag: 5803500
        bedrijfskapitaal_gevestigd: 25342000
        bedrijfskapitaal_beginnend: 4665600
        bedrijfskapitaal_ouder: 1267100
        rente_percentage: 0.08
        belasting_percentage: 0.2
        geboren_voor_datum: '1960-01-01'
        urencriterium_per_jaar: 1225
        max_duur_gevestigd: 12
        max_duur_beginnend: 36
        max_duur_beeindigend: 12
        max_duur_ouder: 0
        minimum_leeftijd: 18
        categorie_gevestigd: GEVESTIGD
        categorie_beginnend: BEGINNEND
        categorie_ouder: OUDER
        categorie_beeindigend: BEEINDIGEND
        type_lening_rente: LENING_RENTE
        type_lening_renteloos: LENING_RENTELOOS
        type_om_niet: OM_NIET
      execution:
        produces:
          legal_character: BESCHIKKING
          decision_type: TOEKENNING
        parameters:
          - name: bsn
            type: string
            required: true
        input:
          # Art. 2 lid 1 onder c: "geboren voor 1 januari 1960" is de enige datumtoets die de
          # tekst stelt; alleen geboortedatum is hier nog nodig (leeftijd/pensioenleeftijd
          # hadden geen grondslag in dit artikel, zie de verwijderde minimum-/pensioenleeftijd-
          # voorwaarde bij voldoet_aan_voorwaarden).
          - name: geboortedatum
            type: date
            source:
              regulation: wet_brp
              output: geboortedatum
              parameters:
                bsn: $bsn
                referentiedatum: $referencedate
            temporal:
              type: point_in_time
          - name: is_actieve_ondernemer
            type: boolean
            source:
              regulation: handelsregisterwet
              output: is_actieve_ondernemer
              parameters:
                bsn: $bsn
          - name: heeft_ww_uitkering
            type: boolean
            source:
              regulation: werkloosheidswet
              output: heeft_recht_op_ww
              parameters:
                bsn: $bsn
          # Art. 2 lid 1 onder b noemt naast de aanvrager ook "de echtgenoot van de persoon"
          # die een WW-uitkering ontvangt; partner_bsn komt uit de BRP-partnerregistratie en is
          # afwezig zonder partner (RFC-036).
          - name: partner_bsn
            type: string
            nullable: true
            source:
              regulation: wet_brp
              output: partner_bsn
              parameters:
                bsn: $bsn
                referentiedatum: $referencedate
            temporal:
              type: point_in_time
          - name: partner_heeft_ww_uitkering
            type: boolean
            nullable: true
            source:
              regulation: werkloosheidswet
              output: heeft_recht_op_ww
              parameters:
                bsn: $partner_bsn
          - name: basisbedrag_bijstand
            type: amount
            type_spec:
              unit: eurocent
              precision: 0
              min: 0
            source:
              regulation: participatiewet/bijstand
              output: basisbedrag
              parameters:
                bsn: $bsn
          - name: bbz_aanvraag
            type: object
            nullable: true
            source: {}
        output:
          - name: voldoet_aan_voorwaarden
            type: boolean
          - name: is_gerechtigd
            type: boolean
          - name: categorie_zelfstandige
            type: string
            nullable: true
          - name: algemene_bijstand_bedrag
            type: amount
            type_spec:
              unit: eurocent
              precision: 0
              min: 0
          - name: max_duur_maanden
            type: number
            type_spec:
              precision: 0
              min: 0
          - name: bedrijfskapitaal_max
            type: amount
            type_spec:
              unit: eurocent
              precision: 0
              min: 0
          - name: bedrijfskapitaal_type
            type: string
        actions:
          - output: voldoet_aan_voorwaarden
            # Art. 2 lid 1 jo. art. 35 Bbz 2004: bijstand wordt op aanvraag verleend; zonder
            # aanvraagdossier is er niets te beoordelen. De overige voorwaarden lezen eigenschappen
            # van het dossier, dat afwezig is voor wie geen aanvraag deed (RFC-036).
            #
            # Verwijderd t.o.v. eerdere versie (audit getrouwheid):
            # - Het urencriterium (1225 uur/jaar) stond hier als blanket-voorwaarde op alle vier
            #   onderdelen; art. 2 noemt geen urencriterium en dit bestand bevat geen ander
            #   artikel dat het stelt, dus geen legal_basis mogelijk. `urencriterium_per_jaar`
            #   blijft als ongebruikte definitie staan totdat het brondocument bekend is; niet
            #   verwijderd omdat de bron kan opduiken bij een volgend artikel.
            # - De minimum-/pensioenleeftijdstoets (leeftijd >= minimum_leeftijd, leeftijd <
            #   pensioenleeftijd) had geen grondslag in art. 2; dit bestand bevat geen andere
            #   Participatiewet-bepaling om naar te verwijzen. `minimum_leeftijd` blijft als
            #   ongebruikte definitie staan.
            # - De vermogenstoets-OR (vermogen <= vermogensgrens_*) stond hier als voorwaarde
            #   voor algemene bijstand; lid 2 beperkt met die grens niet de bijstand zelf maar
            #   uitsluitend de bedrijfskapitaalcategorie (zie output bedrijfskapitaal_max). De
            #   vermogenstoets is dus verwijderd van hier.
            value:
              operation: AND
              conditions:
                - operation: NOT
                  value:
                    operation: EQUALS
                    subject: $bbz_aanvraag
                    value: null
                - subject: $is_actieve_ondernemer
                  operation: EQUALS
                  value: true
                - operation: OR
                  conditions:
                    - operation: AND
                      conditions:
                        - subject: $bbz_aanvraag.type_zelfstandige
                          operation: EQUALS
                          value: GEVESTIGD
                        - subject: $bbz_aanvraag.bedrijf_levensvatbaar
                          operation: EQUALS
                          value: true
                    - operation: AND
                      conditions:
                        - subject: $bbz_aanvraag.type_zelfstandige
                          operation: EQUALS
                          value: BEGINNEND
                        # Art. 2 lid 1 onder b: "de persoon of de echtgenoot van de persoon die
                        # uit hoofde van werkloosheid een uitkering ontvangt" - de OR dekt zowel
                        # de aanvrager als de partner (partner_heeft_ww_uitkering is null zonder
                        # partner, RFC-036, en EQUALS met null is dan gewoon false).
                        - operation: OR
                          conditions:
                            - subject: $heeft_ww_uitkering
                              operation: EQUALS
                              value: true
                            - subject: $partner_heeft_ww_uitkering
                              operation: EQUALS
                              value: true
                        - subject: $bbz_aanvraag.bedrijf_levensvatbaar
                          operation: EQUALS
                          value: true
                    - operation: AND
                      conditions:
                        - subject: $bbz_aanvraag.type_zelfstandige
                          operation: EQUALS
                          value: OUDER
                        - subject: $geboortedatum
                          operation: LESS_THAN
                          value: $geboren_voor_datum
                        - subject: $bbz_aanvraag.bedrijf_levensvatbaar
                          operation: EQUALS
                          value: false
                        - operation: GREATER_THAN_OR_EQUAL
                          subject: $bbz_aanvraag.jaren_ondernemerschap
                          value: 10
                    - operation: AND
                      conditions:
                        - subject: $bbz_aanvraag.type_zelfstandige
                          operation: EQUALS
                          value: BEEINDIGEND
                        - operation: NOT
                          value:
                            operation: EQUALS
                            subject: $bbz_aanvraag.beeindigingsdatum
                            value: null
          - output: is_gerechtigd
            value: true
            legal_basis:
              law: Besluit bijstandverlening zelfstandigen 2004
              bwb_id: BWBR0015711
              article: '2'
              url: >-
                https://wetten.overheid.nl/BWBR0015711/2025-01-01#Hoofdstuk1_Artikel2
              juriconnect: jci1.3:c:BWBR0015711&artikel=2&z=2025-01-01&g=2025-01-01
              explanation: >-
                Als aan alle voorwaarden is voldaan, is de zelfstandige gerechtigd tot Bbz
          - output: categorie_zelfstandige
            value: $bbz_aanvraag.type_zelfstandige
            legal_basis:
              law: Besluit bijstandverlening zelfstandigen 2004
              bwb_id: BWBR0015711
              article: '2'
              paragraph: '1'
              url: >-
                https://wetten.overheid.nl/BWBR0015711/2025-01-01#Hoofdstuk1_Artikel2
              juriconnect: >-
                jci1.3:c:BWBR0015711&artikel=2&lid=1&z=2025-01-01&g=2025-01-01
              explanation: De categorie wordt overgenomen uit de aanvraag
          - output: algemene_bijstand_bedrag
            value: $basisbedrag_bijstand
            legal_basis:
              law: Besluit bijstandverlening zelfstandigen 2004
              bwb_id: BWBR0015711
              article: '10'
              url: >-
                https://wetten.overheid.nl/BWBR0015711/2025-01-01#Hoofdstuk2_Artikel10
              juriconnect: jci1.3:c:BWBR0015711&artikel=10&z=2025-01-01&g=2025-01-01
              explanation: >-
                Artikel 10 bepaalt dat de algemene bijstand wordt vastgesteld volgens de Participatiewet
          - output: max_duur_maanden
            value:
              operation: IF
              cases:
                - when:
                    operation: EQUALS
                    subject: $bbz_aanvraag.type_zelfstandige
                    value: GEVESTIGD
                  then: $max_duur_gevestigd
                - when:
                    operation: EQUALS
                    subject: $bbz_aanvraag.type_zelfstandige
                    value: BEGINNEND
                  then: $max_duur_beginnend
                - when:
                    operation: EQUALS
                    subject: $bbz_aanvraag.type_zelfstandige
                    value: OUDER
                  then: $max_duur_ouder
              default: $max_duur_beeindigend
            legal_basis:
              law: Besluit bijstandverlening zelfstandigen 2004
              bwb_id: BWBR0015711
              article: '18'
              url: >-
                https://wetten.overheid.nl/BWBR0015711/2025-01-01#Hoofdstuk3_Paragraaf1_Artikel18
              juriconnect: jci1.3:c:BWBR0015711&artikel=18&z=2025-01-01&g=2025-01-01
              explanation: De maximale duur verschilt per categorie zelfstandige
          - output: bedrijfskapitaal_max
            # Art. 2 lid 2: "Bijstand ter voorziening in de behoefte aan bedrijfskapitaal kan
            # slechts worden verleend aan de zelfstandige, bedoeld in de onderdelen a, b en c" -
            # dit is een categorie-restrictie op het bedrijfskapitaal, niet een voorwaarde voor
            # algemene bijstand (zie de verwijderde vermogenstoets bij voldoet_aan_voorwaarden).
            # De default 0 voor onderdeel d (BEEINDIGEND) implementeert die restrictie al juist.
            value:
              operation: IF
              cases:
                - when:
                    operation: EQUALS
                    subject: $bbz_aanvraag.type_zelfstandige
                    value: GEVESTIGD
                  then: $bedrijfskapitaal_gevestigd
                - when:
                    operation: EQUALS
                    subject: $bbz_aanvraag.type_zelfstandige
                    value: BEGINNEND
                  then: $bedrijfskapitaal_beginnend
                - when:
                    operation: EQUALS
                    subject: $bbz_aanvraag.type_zelfstandige
                    value: OUDER
                  then: $bedrijfskapitaal_ouder
              default: 0
            legal_basis:
              law: Besluit bijstandverlening zelfstandigen 2004
              bwb_id: BWBR0015711
              article: '20'
              url: >-
                https://wetten.overheid.nl/BWBR0015711/2025-01-01#Hoofdstuk3_Paragraaf1_Artikel20
              juriconnect: jci1.3:c:BWBR0015711&artikel=20&z=2025-01-01&g=2025-01-01
              explanation: >-
                Het maximale bedrijfskapitaal verschilt per categorie zelfstandige
          - output: bedrijfskapitaal_type
            value:
              operation: IF
              cases:
                - when:
                    operation: EQUALS
                    subject: $bbz_aanvraag.type_zelfstandige
                    value: OUDER
                  then: $type_om_niet
                - when:
                    operation: EQUALS
                    subject: $bbz_aanvraag.type_zelfstandige
                    value: BEEINDIGEND
                  then: GEEN
              default: $type_lening_rente
            legal_basis:
              law: Besluit bijstandverlening zelfstandigen 2004
              bwb_id: BWBR0015711
              article: '14'
              url: >-
                https://wetten.overheid.nl/BWBR0015711/2025-01-01#Hoofdstuk2_Artikel14
              juriconnect: jci1.3:c:BWBR0015711&artikel=14&z=2025-01-01&g=2025-01-01
              explanation: >-
                Het type bedrijfskapitaal verschilt per categorie zelfstandige
      untranslatables:
        - construct: >-
            "een inkomen geniet dat duurzaam ontoereikend is om in de noodzakelijke kosten
            van het bestaan te voorzien" (art. 2 lid 1 onder c)
          reason: >-
            De tekst geeft geen inkomensgrens of berekeningswijze voor "duurzaam ontoereikend";
            dat is een discretionair oordeel van het college. Dit bestand bevat geen ander
            artikel dat de grens stelt, en de eerder gebruikte definitie min_inkomen_ouder had
            geen bron in de tekst (verwijderd bij de getrouwheidsaudit).
          suggestion: >-
            Voeg een inkomensgrens toe zodra een artikel of ministeriële regeling die stelt, of
            modelleer het oordeel als open_term met de collegebeslissing als input
          accepted: true
