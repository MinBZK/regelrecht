---
$schema: >-
  https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.5.9/schema/v0.5.9/schema.json
$id: wgbo_vertegenwoordiger
regulatory_layer: WET
publication_date: '2024-01-01'
valid_from: '2024-01-01'
name: Bepalen WGBO-vertegenwoordiger voor wilsonbekwame patienten
bwb_id: BWBR0005290
url: https://wetten.overheid.nl/BWBR0005290/2024-01-01
service: RvIG
uuid: 54ba9cdb-61ff-4735-a650-8ccee6ef0bb8
articles:
  - number: '465'
    text: >-
      1 De verplichtingen die voor de hulpverlener uit deze afdeling jegens de patiënt
      voortvloeien worden, indien de patiënt de leeftijd van twaalf jaren nog niet heeft
      bereikt, door de hulpverlener nagekomen jegens de ouders die het gezag over de patiënt
      uitoefenen dan wel jegens zijn voogd.

      2 Hetzelfde geldt indien de patiënt de leeftijd van twaalf jaren heeft bereikt, maar niet
      in staat kan worden geacht tot een redelijke waardering van zijn belangen ter zake, tenzij
      zodanige patiënt meerderjarig is en onder curatele staat of ten behoeve van hem het
      mentorschap is ingesteld, in welke gevallen nakoming jegens de curator of de mentor
      geschiedt.

      3 Indien een meerderjarige patiënt die niet in staat kan worden geacht tot een redelijke
      waardering van zijn belangen ter zake, niet onder curatele staat of ten behoeve van hem
      niet het mentorschap is ingesteld, worden de verplichtingen die voor de hulpverlener uit
      deze afdeling jegens de patiënt voortvloeien, door de hulpverlener nagekomen jegens de
      persoon die daartoe door de patiënt schriftelijk is gemachtigd in zijn plaats op te
      treden. Ontbreekt zodanige persoon, of treedt deze niet op, dan worden de verplichtingen
      nagekomen jegens de echtgenoot, de geregistreerde partner of andere levensgezel van de
      patiënt, tenzij deze persoon dat niet wenst, dan wel, indien ook zodanige persoon
      ontbreekt, jegens een ouder, kind, broer, zus, grootouder of kleinkind van de patiënt,
      tenzij deze persoon dat niet wenst.

      4 De hulpverlener komt zijn verplichtingen na jegens de in de leden 1 en 2 bedoelde
      wettelijke vertegenwoordigers van de patiënt en de in lid 3 bedoelde personen, tenzij die
      nakoming niet verenigbaar is met de zorg van een goed hulpverlener.

      5 De persoon jegens wie de hulpverlener krachtens de leden 2 of 3 gehouden is de uit deze
      afdeling jegens de patiënt voortvloeiende verplichtingen na te komen, betracht de zorg van
      een goed vertegenwoordiger. Deze persoon is gehouden de patiënt zoveel mogelijk bij de
      vervulling van zijn taak te betrekken.

      6 Verzet de patiënt zich tegen een verrichting van ingrijpende aard waarvoor een persoon
      als bedoeld in de leden 2 of 3 toestemming heeft gegeven, dan kan de verrichting slechts
      worden uitgevoerd indien zij kennelijk nodig is teneinde ernstig nadeel voor de patiënt te
      voorkomen.
    url: https://wetten.overheid.nl/BWBR0005290/2024-01-01#Artikel465
    machine_readable:
      definitions:
        # Art. 7:465 lid 3 BW: rangorde is schriftelijk gemachtigde, dan partnercategorie
        # (echtgenoot/geregistreerd partner/levensgezel), dan familiecategorie (ouder, kind,
        # broer, zus, grootouder, kleinkind); elke categorie kent een "tenzij deze persoon dat
        # niet wenst"-uitzondering. wgbo_relatie_hierarchie blijft de volledige lijst voor de
        # IN-toets die bepaalt of een familierelatie überhaupt vertegenwoordigingsbevoegdheid kan
        # geven; grootouder/kleinkind stonden hier ten onrechte niet in (audit).
        wgbo_relatie_hierarchie:
          - ECHTGENOOT
          - GEREGISTREERD_PARTNER
          - LEVENSGEZEL
          - OUDER
          - KIND
          - BROER
          - ZUS
          - GROOTOUDER
          - KLEINKIND
        wgbo_vertegenwoordiger_rechten:
          - LEZEN
          - CLAIMS_INDIENEN
          - BESLUITEN_ONTVANGEN
      execution:
        produces:
          legal_character: RECHTSPOSITIE
          decision_type: GEEN_BESLUIT
        parameters:
          - name: bsn
            type: string
            required: true
        input:
          # Elk item draagt, naast de familierelatie, of deze persoon door de patiënt schriftelijk
          # is gemachtigd (is_gemachtigd) en of de persoon niet wenst op te treden
          # (wenst_niet_op_te_treden) — de twee feiten die de rangorde van lid 3 nodig heeft.
          # Item-niveau nullable is niet declareerbaar in dit schema (zie untranslatables); de
          # afwezigheid van een schriftelijk gemachtigde wordt daarom getoetst met
          # "geen enkele relatie in de lijst is gemachtigd", niet met een null-veld.
          - name: familie_relaties
            type: array
            source: {}
        output:
          - name: voldoet_aan_voorwaarden
            type: boolean
          - name: heeft_delegaties
            type: boolean
          - name: subject_ids
            type: array
          - name: subject_names
            type: array
          - name: subject_types
            type: array
          - name: delegation_types
            type: array
          - name: permissions
            type: array
          - name: valid_from_dates
            type: array
          - name: valid_until_dates
            type: array
        actions:
          - output: voldoet_aan_voorwaarden
        # POC: EXISTS op lijst $familie_relaties (uitvoer voldoet_aan_voorwaarden) betekende 'niet leeg'; expliciet als
        # telling (RFC-016)
            value:
              operation: GREATER_THAN
              subject:
                operation: FOREACH
                collection: $familie_relaties
                body: 1
                combine: ADD
              value: 0
          # Art. 7:465 lid 3 BW: rangorde. Een relatie telt alleen als vertegenwoordiger als de
          # persoon niet heeft laten weten dat hij dat niet wenst ("tenzij deze persoon dat niet
          # wenst"); voor de gemachtigde geldt die uitzondering niet (die staat in de tekst alleen
          # bij de partner- en familiecategorie). Lid 1 (patiënt onder de twaalf, ouders met gezag
          # of voogd) en lid 2 (curatele/mentorschap) blijven buiten deze actie: dat vergt een
          # opzoeking in een ander register (burgerlijk_wetboek_gezag resp. _curatele/_mentorschap)
          # per patiënt uit deze lijst, en de engine kan geen cross-law source binnen een FOREACH
          # per item aanroepen (zie untranslatables).
          - output: wgbo_vertegenwoordigingen
            value:
              operation: FOREACH
              collection: $familie_relaties
              filter:
                operation: AND
                conditions:
                  - operation: EQUALS
                    subject: $current.is_wilsonbekwaam
                    value: true
                  - operation: OR
                    conditions:
                      - operation: EQUALS
                        subject: $current.is_gemachtigd
                        value: true
                      - operation: AND
                        conditions:
                          - operation: IN
                            subject: $current.relatie_type
                            value: $wgbo_relatie_hierarchie
                          - operation: NOT
                            value:
                              operation: EQUALS
                              subject: $current.wenst_niet_op_te_treden
                              value: true
              body: $current
              as: current
            legal_basis:
              law: Burgerlijk Wetboek Boek 7
              bwb_id: BWBR0005290
              article: '465'
              paragraph: '3'
              url: >-
                https://wetten.overheid.nl/BWBR0005290/2024-01-01#Boek7_Titeldeel7_Afdeling5_Artikel465
              juriconnect: >-
                jci1.3:c:BWBR0005290&boek=7&artikel=465&lid=3&z=2024-01-01&g=2024-01-01
              explanation: >
                Art. 7:465 lid 3 BW: bij ontbreken van gezag/voogd/curator/mentor kan de schriftelijk
                gemachtigde, en anders de partner- of familiecategorie, optreden als vertegenwoordiger.
                Een partner of familielid dat dit niet wenst, telt niet mee.
          - output: heeft_delegaties
        # POC: EXISTS op lijst $wgbo_vertegenwoordigingen (uitvoer heeft_delegaties) betekende 'niet leeg'; expliciet
        # als telling (RFC-016)
            value:
              operation: GREATER_THAN
              subject:
                operation: FOREACH
                collection: $wgbo_vertegenwoordigingen
                body: 1
                combine: ADD
              value: 0
            legal_basis:
              law: Burgerlijk Wetboek Boek 7
              bwb_id: BWBR0005290
              article: '465'
              url: >-
                https://wetten.overheid.nl/BWBR0005290/2024-01-01#Boek7_Titeldeel7_Afdeling5_Artikel465
              juriconnect: >-
                jci1.3:c:BWBR0005290&boek=7&artikel=465&z=2024-01-01&g=2024-01-01
              explanation: |
                Art. 7:465 BW bepaalt dat familieleden kunnen vertegenwoordigen.
          - output: subject_ids
        # POC: impliciete map over een lijst ($wgbo_vertegenwoordigingen.bsn_patient); expliciet als FOREACH (RFC-016)
            value:
              operation: FOREACH
              collection: $wgbo_vertegenwoordigingen
              as: item
              body: $item.bsn_patient
            legal_basis:
              law: Burgerlijk Wetboek Boek 7
              bwb_id: BWBR0005290
              article: '465'
              url: >-
                https://wetten.overheid.nl/BWBR0005290/2024-01-01#Boek7_Titeldeel7_Afdeling5_Artikel465
              juriconnect: >-
                jci1.3:c:BWBR0005290&boek=7&artikel=465&z=2024-01-01&g=2024-01-01
              explanation: BSN nummers van wilsonbekwame patienten
          - output: subject_names
        # POC: impliciete map over een lijst ($wgbo_vertegenwoordigingen.naam_patient); expliciet als FOREACH (RFC-016)
            value:
              operation: FOREACH
              collection: $wgbo_vertegenwoordigingen
              as: item
              body: $item.naam_patient
            legal_basis:
              law: Burgerlijk Wetboek Boek 7
              bwb_id: BWBR0005290
              article: '465'
              url: >-
                https://wetten.overheid.nl/BWBR0005290/2024-01-01#Boek7_Titeldeel7_Afdeling5_Artikel465
              juriconnect: >-
                jci1.3:c:BWBR0005290&boek=7&artikel=465&z=2024-01-01&g=2024-01-01
              explanation: Namen van wilsonbekwame patienten
          - output: subject_types
            value:
              operation: FOREACH
              collection: $wgbo_vertegenwoordigingen
              body: CITIZEN
            legal_basis:
              law: Burgerlijk Wetboek Boek 7
              bwb_id: BWBR0005290
              article: '465'
              url: >-
                https://wetten.overheid.nl/BWBR0005290/2024-01-01#Boek7_Titeldeel7_Afdeling5_Artikel465
              juriconnect: >-
                jci1.3:c:BWBR0005290&boek=7&artikel=465&z=2024-01-01&g=2024-01-01
              explanation: Patienten zijn natuurlijke personen, altijd CITIZEN
          # Art. 7:465 lid 3 BW: rangorde-labels. Een gemachtigde krijgt een eigen categorie
          # (voorrang boven de familiecategorieën); grootouder en kleinkind ontbraken hier
          # (audit) en krijgen, net als broer/zus, elk hun eigen waarde in plaats van de
          # SIBLING-default op te vangen.
          - output: delegation_types
            value:
              operation: FOREACH
              collection: $wgbo_vertegenwoordigingen
              body:
                operation: IF
                cases:
                  - when:
                      operation: EQUALS
                      subject: $current.is_gemachtigd
                      value: true
                    then: WGBO_VERTEGENWOORDIGER_GEMACHTIGDE
                  - when:
                      operation: IN
                      subject: $current.relatie_type
                      values:
                        - ECHTGENOOT
                        - GEREGISTREERD_PARTNER
                        - LEVENSGEZEL
                    then: WGBO_VERTEGENWOORDIGER_PARTNER
                  - when:
                      operation: EQUALS
                      subject: $current.relatie_type
                      value: OUDER
                    then: WGBO_VERTEGENWOORDIGER_OUDER
                  - when:
                      operation: EQUALS
                      subject: $current.relatie_type
                      value: KIND
                    then: WGBO_VERTEGENWOORDIGER_KIND
                  - when:
                      operation: IN
                      subject: $current.relatie_type
                      values:
                        - BROER
                        - ZUS
                    then: WGBO_VERTEGENWOORDIGER_SIBLING
                  - when:
                      operation: EQUALS
                      subject: $current.relatie_type
                      value: GROOTOUDER
                    then: WGBO_VERTEGENWOORDIGER_GROOTOUDER
                default: WGBO_VERTEGENWOORDIGER_KLEINKIND
              as: current
            legal_basis:
              law: Burgerlijk Wetboek Boek 7
              bwb_id: BWBR0005290
              article: '465'
              paragraph: '3'
              url: >-
                https://wetten.overheid.nl/BWBR0005290/2024-01-01#Boek7_Titeldeel7_Afdeling5_Artikel465
              juriconnect: >-
                jci1.3:c:BWBR0005290&boek=7&artikel=465&lid=3&z=2024-01-01&g=2024-01-01
              explanation: >-
                Type gebaseerd op familierelatie conform hierarchie Art. 7:465 lid 3 BW
          - output: permissions
            value:
              operation: FOREACH
              collection: $wgbo_vertegenwoordigingen
              body: $wgbo_vertegenwoordiger_rechten
            legal_basis:
              law: Burgerlijk Wetboek Boek 7
              bwb_id: BWBR0005290
              article: '465'
              paragraph: '3'
              url: >-
                https://wetten.overheid.nl/BWBR0005290/2024-01-01#Boek7_Titeldeel7_Afdeling5_Artikel465
              juriconnect: >-
                jci1.3:c:BWBR0005290&boek=7&artikel=465&lid=3&z=2024-01-01&g=2024-01-01
              explanation: >
                Art. 7:465 lid 3 BW: vertegenwoordiger neemt beslissingen over medische behandeling namens
                wilsonbekwame patient.
          - output: valid_from_dates
        # POC: impliciete map over een lijst ($wgbo_vertegenwoordigingen.datum_wilsonbekwaamheid); expliciet als FOREACH
        # (RFC-016)
            value:
              operation: FOREACH
              collection: $wgbo_vertegenwoordigingen
              as: item
              body: $item.datum_wilsonbekwaamheid
            legal_basis:
              law: Burgerlijk Wetboek Boek 7
              bwb_id: BWBR0005290
              article: '465'
              url: >-
                https://wetten.overheid.nl/BWBR0005290/2024-01-01#Boek7_Titeldeel7_Afdeling5_Artikel465
              juriconnect: >-
                jci1.3:c:BWBR0005290&boek=7&artikel=465&z=2024-01-01&g=2024-01-01
              explanation: Vertegenwoordiging start bij vaststelling wilsonbekwaamheid
          - output: valid_until_dates
            value:
              operation: FOREACH
              collection: $wgbo_vertegenwoordigingen
              body: null
            legal_basis:
              law: Burgerlijk Wetboek Boek 7
              bwb_id: BWBR0005290
              article: '465'
              url: >-
                https://wetten.overheid.nl/BWBR0005290/2024-01-01#Boek7_Titeldeel7_Afdeling5_Artikel465
              juriconnect: >-
                jci1.3:c:BWBR0005290&boek=7&artikel=465&z=2024-01-01&g=2024-01-01
              explanation: >-
                Vertegenwoordiging eindigt bij herstel wilsbekwaamheid of overlijden
      untranslatables:
        - construct: iteratie over variabel aantal WGBO-vertegenwoordigingen
          reason: >-
            FOREACH niet beschikbaar in v0.5.1 schema; het aantal vertegenwoordigingsrelaties is
            dynamisch en kan niet vooraf worden uitgerold
          suggestion: >-
            Voeg FOREACH toe aan het schema of beperk het aantal registraties tot een vast maximum
          accepted: true
        - construct: >-
            Art. 7:465 lid 1 en 2 BW ("indien de patiënt de leeftijd van twaalf jaren nog niet
            heeft bereikt ... jegens de ouders die het gezag over de patiënt uitoefenen dan wel
            jegens zijn voogd" resp. "tenzij zodanige patiënt meerderjarig is en onder curatele
            staat of ten behoeve van hem het mentorschap is ingesteld, in welke gevallen nakoming
            jegens de curator of de mentor geschiedt")
          reason: >-
            Deze leden vergen, per patiënt in $familie_relaties, een opzoeking in
            burgerlijk_wetboek_gezag (patiënt onder de twaalf) resp. burgerlijk_wetboek_curatele en
            burgerlijk_wetboek_mentorschap (patiënt meerderjarig en wilsonbekwaam). Een cross-law
            `source` wordt eenmalig bij het inladen van een input opgelost met de
            actie-parameters (bv. $bsn); er is geen operatie om die aanroep te herhalen per item
            van een FOREACH over $familie_relaties met het bsn van dat item als parameter. Zonder
            die opzoeking kan de actie niet vaststellen of lid 3 (de rangorde die deze actie wel
            modelleert) hier toepassing mist doordat lid 1 of 2 al voorziet.
          suggestion: >-
            Voeg een operatie toe die een regeling per FOREACH-item met een dynamische parameter
            kan aanroepen (of maak $familie_relaties zelf een first-class binding die deze feiten
            al meelevert), zodat lid 1 en 2 hier naast lid 3 gemodelleerd kunnen worden.
          accepted: true
        - construct: >-
            nullable veld binnen een item van de array-input $familie_relaties (bv. of een
            specifieke relatie schriftelijk is gemachtigd, of "dat niet wenst")
          reason: >-
            `nullable` is in dit schema alleen declareerbaar op een top-level input of output,
            niet op een veld binnen een item van een array. De afwezigheid van een schriftelijk
            gemachtigde ("ontbreekt zodanige persoon") wordt daarom getoetst als "geen enkele
            relatie in de lijst heeft is_gemachtigd true", niet als een nullable veld.
          suggestion: >-
            Voeg item-niveau nullable-declaraties toe aan het array input-schema.
          accepted: true
