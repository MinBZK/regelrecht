---
# Beleid van de Dienst Toeslagen over het teruglezen van haar eigen kroniek:
# hoe zij een vastgelegd voorschot, de rekening uit de aanvraag en wat er
# achterstallig is weer leest als de gegevens die art. 22 Awir en het beleid
# over de uitbetaling van het voorschot vragen. Dit is de reductie van de
# kroniek zoals RFC-045 die plaatst: een artikel in het beleid van de houder,
# in het wetsformaat, door de engine uitgevoerd. Welke kroniek de invoer
# `grams` is, zegt de configuratie van de cel (`registers:` in cell.yaml), niet
# dit beleid.
#
# AANNAME (RFC-045 §4). De Dienst Toeslagen heeft dit beleid niet vastgesteld;
# het is in deze modellering namens haar geschreven, zodat het niet voor beleid
# met een eigenaar kan doorgaan. Elke keuze erin die niet uit de wet volgt, is
# als aanname gemarkeerd.
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.8.0/schema/v0.8.0/schema.json
$id: fictief_beleid_kroniek_toeslagen
regulatory_layer: UITVOERINGSBELEID
publication_date: '2024-01-01'
valid_from: '2024-01-01'
# Er is geen bekendgemaakt beleid hierover. De url wijst daarom naar het
# artikel waarop het voorschot rust, niet naar een bekendmaking.
url: https://wetten.overheid.nl/BWBR0018472/2024-01-01#Artikel16
name: Teruglezen van de kroniek van Toeslagen (fictief uitvoeringsbeleid, aanname)
competent_authority:
  name: Dienst Toeslagen
legal_basis:
  - law_id: algemene_wet_inkomensafhankelijke_regelingen
    article: '16'
  - law_id: algemene_wet_inkomensafhankelijke_regelingen
    article: '22'
articles:
  - number: '1'
    url: https://wetten.overheid.nl/BWBR0018472/2024-01-01#Artikel16
    text: >-
      FICTIEF, aanname namens de Dienst Toeslagen: geen bekendgemaakt beleid.
      1. Het voorschot op een aanvraag is het laatste besluit in de fase
      VOORSCHOT van de procedure van de Algemene wet inkomensafhankelijke
      regelingen dat Toeslagen op die aanvraag vastlegde. Het laatste is het
      besluit dat het laatst rechtens geldt, en bij gelijk moment het besluit
      dat het laatst is vastgelegd. [Aanname: een herziening vervangt het
      eerdere voorschot; het eerdere blijft in de kroniek.]
      2. Het voorschotbedrag is het bedrag dat dat besluit verleent (artikel 16,
      eerste lid, van die wet).
      3. De dagtekening van het voorschot is de dag waarop dat besluit is
      genomen (artikel 22, eerste lid, van die wet). [Aanname: de dagtekening
      is de dag van het besluit.]
      4. Het berekeningsjaar is het jaar waarop dat besluit betrekking heeft
      (artikel 2, eerste lid, onder b, van die wet).
    machine_readable:
      execution:
        parameters:
          - name: root
            type: string
            required: true
            description: >-
              Het kenmerk van de aanvraag: het gram waarmee Toeslagen de
              ontvangst vastlegde.
        input:
          # De kroniek van Toeslagen; de configuratie van de cel bindt haar.
          - name: grams
            type: array
            source: {}
        output:
          # Hulpuitvoer: het kenmerk van de aanvraag, buiten de FOREACH
          # gelezen. Binnen de FOREACH is `$root` het veld `root` van de
          # gram zelf (een veld van het element schaduwt een parameter met
          # dezelfde naam, RFC-016), dus zou elke gram bij de aanvraag horen.
          - name: aanvraag_van_het_voorschot
            type: string
            description: Het kenmerk van de aanvraag waarnaar gevraagd wordt.
          # Lid 1. Hulpuitvoer: de plaats in de tijd van het voorschot dat
          # geldt; null als er op deze aanvraag geen voorschot is.
          - name: laatste_voorschot
            type: number
            nullable: true
            description: De plaats in de kroniek van het laatste voorschot op deze aanvraag; null als er geen is.
          - name: voorschotbedrag
            type: amount
            type_spec:
              unit: eurocent
            nullable: true
            description: Het bedrag van het voorschot.
            legal_basis:
              law: Algemene wet inkomensafhankelijke regelingen
              article: '16'
              paragraph: '1'
          - name: dagtekening_voorschot
            type: date
            nullable: true
            description: De dagtekening van de beschikking die het voorschot verleent.
            legal_basis:
              law: Algemene wet inkomensafhankelijke regelingen
              article: '22'
              paragraph: '1'
          - name: berekeningsjaar
            type: number
            nullable: true
            description: Het kalenderjaar waarop het voorschot betrekking heeft.
            legal_basis:
              law: Algemene wet inkomensafhankelijke regelingen
              article: '2'
              paragraph: '1'
        actions:
          - output: aanvraag_van_het_voorschot
            value: $root
          # Lid 1. Het wetsformaat kent geen LAST: het laatste besluit is het
          # besluit met de hoogste plaats in de tijd.
          - output: laatste_voorschot
            value:
              operation: FOREACH
              collection: $grams
              as: g
              filter:
                operation: AND
                conditions:
                  - {operation: EQUALS, subject: $g.stage, value: VOORSCHOT}
                  - {operation: EQUALS, subject: $g.root, value: $aanvraag_van_het_voorschot}
              body: $g.sequence
              combine: MAX
          # Lid 2 tot en met 4. Eén besluit: ADD over één waarde geeft die
          # waarde (ook een datum als tekst).
          - output: voorschotbedrag
            value:
              operation: IF
              cases:
                - when: {operation: EQUALS, subject: $laatste_voorschot, value: null}
                  then: null
              default:
                operation: FOREACH
                collection: $grams
                as: g
                filter: {operation: EQUALS, subject: $g.sequence, value: $laatste_voorschot}
                body: $g.voorschotbedrag
                combine: ADD
          - output: dagtekening_voorschot
            value:
              operation: IF
              cases:
                - when: {operation: EQUALS, subject: $laatste_voorschot, value: null}
                  then: null
              default:
                operation: FOREACH
                collection: $grams
                as: g
                filter: {operation: EQUALS, subject: $g.sequence, value: $laatste_voorschot}
                body: $g.effective_date
                combine: ADD
          - output: berekeningsjaar
            value:
              operation: IF
              cases:
                - when: {operation: EQUALS, subject: $laatste_voorschot, value: null}
                  then: null
              default:
                operation: FOREACH
                collection: $grams
                as: g
                filter: {operation: EQUALS, subject: $g.sequence, value: $laatste_voorschot}
                body: $g.period
                combine: ADD

  - number: '2'
    url: https://wetten.overheid.nl/BWBR0018472/2024-01-01#Artikel15
    text: >-
      FICTIEF, aanname namens de Dienst Toeslagen: geen bekendgemaakt beleid.
      De rekening waarop het voorschot op een aanvraag wordt betaald, is de
      rekening die de aanvrager in die aanvraag opgaf. Gaf hij er geen op, dan
      is er geen rekening.
    machine_readable:
      execution:
        parameters:
          - name: root
            type: string
            required: true
            description: Het kenmerk van de aanvraag.
        input:
          - name: grams
            type: array
            source: {}
        output:
          # Hulpuitvoer: het kenmerk van de aanvraag, buiten de FOREACH
          # gelezen. Binnen de FOREACH is `$root` het veld `root` van de
          # gram zelf (een veld van het element schaduwt een parameter met
          # dezelfde naam, RFC-016), dus zou elke gram bij de aanvraag horen.
          - name: aanvraag_van_de_rekening
            type: string
            description: Het kenmerk van de aanvraag waarnaar gevraagd wordt.
          - name: rekeningnummer
            type: string
            nullable: true
            description: De rekening die de aanvrager in de aanvraag opgaf.
        actions:
          - output: aanvraag_van_de_rekening
            value: $root
          - output: rekeningnummer
            value:
              operation: IF
              cases:
                # Geen aanvraag met dit kenmerk.
                - when:
                    operation: NOT
                    value:
                      operation: FOREACH
                      collection: $grams
                      as: g
                      filter: {operation: EQUALS, subject: $g.id, value: $aanvraag_van_de_rekening}
                      body: {operation: EQUALS, subject: $g.id, value: $aanvraag_van_de_rekening}
                      combine: OR
                  then: null
                # Een aanvraag zonder rekening. ADD over één null is een
                # fout (RFC-036), daarom eerst de vraag of het veld leeg is.
                - when:
                    operation: FOREACH
                    collection: $grams
                    as: g
                    filter: {operation: EQUALS, subject: $g.id, value: $aanvraag_van_de_rekening}
                    body: {operation: EQUALS, subject: $g.rekeningnummer, value: null}
                    combine: OR
                  then: null
              default:
                operation: FOREACH
                collection: $grams
                as: g
                filter: {operation: EQUALS, subject: $g.id, value: $aanvraag_van_de_rekening}
                body: $g.rekeningnummer
                combine: ADD

  - number: '3'
    url: https://wetten.overheid.nl/BWBR0018472/2024-01-01#Artikel22
    text: >-
      FICTIEF, aanname namens de Dienst Toeslagen: geen bekendgemaakt beleid.
      Achterstallig op een aanvraag is wat de bank van betaalopdrachten op die
      aanvraag niet bijschreef, verminderd met wat Toeslagen daarvan sindsdien
      opnieuw opdroeg.
    machine_readable:
      execution:
        parameters:
          - name: root
            type: string
            required: true
            description: Het kenmerk van de aanvraag.
        input:
          - name: grams
            type: array
            source: {}
        output:
          # Hulpuitvoer: het kenmerk van de aanvraag, buiten de FOREACH
          # gelezen. Binnen de FOREACH is `$root` het veld `root` van de
          # gram zelf (een veld van het element schaduwt een parameter met
          # dezelfde naam, RFC-016), dus zou elke gram bij de aanvraag horen.
          - name: aanvraag_van_de_achterstand
            type: string
            description: Het kenmerk van de aanvraag waarnaar gevraagd wordt.
          - name: achterstallig_bedrag
            type: amount
            type_spec:
              unit: eurocent
            description: Wat van eerdere betaalopdrachten niet is bijgeschreven en nog niet opnieuw is opgedragen.
        actions:
          - output: aanvraag_van_de_achterstand
            value: $root
          - output: achterstallig_bedrag
            value:
              operation: SUBTRACT
              values:
                - operation: FOREACH
                  collection: $grams
                  as: g
                  filter:
                    operation: AND
                    conditions:
                      - {operation: EQUALS, subject: $g.event, value: betaling_mislukt}
                      - {operation: EQUALS, subject: $g.root, value: $aanvraag_van_de_achterstand}
                  body: $g.mislukt_bedrag
                  combine: ADD
                - operation: FOREACH
                  collection: $grams
                  as: g
                  filter:
                    operation: AND
                    conditions:
                      - {operation: EQUALS, subject: $g.event, value: betaalopdracht_gegeven}
                      - {operation: EQUALS, subject: $g.root, value: $aanvraag_van_de_achterstand}
                  body: $g.meegenomen_achterstand
                  combine: ADD
