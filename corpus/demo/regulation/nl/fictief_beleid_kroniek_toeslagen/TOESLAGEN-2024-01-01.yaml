                operation: AND
                conditions:
                  - {operation: EQUALS, subject: $g.stage, value: TOEKENNING}
                  - {operation: EQUALS, subject: $g.root, value: $aanvraag_van_de_toekenning}
                  - {operation: EQUALS, subject: $g.period, value: $jaar_van_de_toekenning}
              body: $g.sequence
              combine: MAX
          - output: nog_uit_te_betalen
            value:
              operation: IF
              cases:
                - when: {operation: EQUALS, subject: $laatste_toekenning, value: null}
                  then: null
              default:
                operation: FOREACH
                collection: $grams
                as: g
                filter: {operation: EQUALS, subject: $g.sequence, value: $laatste_toekenning}
                body: $g.nog_uit_te_betalen
                combine: ADD
          - output: terug_te_vorderen
