  - number: '6'
    url: https://wetten.overheid.nl/BWBR0018472/2024-01-01#Artikel24
    text: >-
      FICTIEF, aanname namens de Dienst Toeslagen: geen bekendgemaakt beleid.
      De toekenning op een aanvraag voor een berekeningsjaar is het laatste
      besluit in de fase TOEKENNING van de procedure van de Algemene wet
      inkomensafhankelijke regelingen dat Toeslagen op die aanvraag voor dat
      berekeningsjaar vastlegde. Wat er na de verrekening nog uit te betalen
      is (artikel 24, eerste en tweede lid, van die wet) en wat er terug te
      vorderen is (artikel 24, derde lid, en artikel 26a van die wet), zijn de
      bedragen die dat besluit vaststelt; de dagtekening is de dag van dat
      besluit. [Aanname: de dagtekening is de dag van het besluit.]
