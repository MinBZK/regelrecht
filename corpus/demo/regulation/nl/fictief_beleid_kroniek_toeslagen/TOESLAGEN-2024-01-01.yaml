          - name: nog_uit_te_betalen
            type: amount
            type_spec:
              unit: eurocent
            nullable: true
            description: Wat er na de verrekening nog uit te betalen is.
            legal_basis:
              law: Algemene wet inkomensafhankelijke regelingen
              article: '24'
              paragraph: '1'
          - name: terug_te_vorderen
            type: amount
            type_spec:
              unit: eurocent
            nullable: true
            description: Wat er na de verrekening en art. 26a terug te vorderen is.
            legal_basis:
