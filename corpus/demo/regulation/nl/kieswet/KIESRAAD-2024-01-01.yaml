---
$schema: >-
  https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.5.8/schema/v0.5.8/schema.json
$id: kieswet
regulatory_layer: WET
publication_date: '2024-01-01'
valid_from: '2024-01-01'
name: Kiesrecht Tweede Kamer
bwb_id: BWBR0004627
url: https://wetten.overheid.nl/BWBR0004627/2024-01-01
service: KIESRAAD
uuid: 96d926a0-b45f-4cf3-92af-01b167221a00
discoverable: CITIZEN
articles:
  - number: B1
    text: >-
      1. De leden van de Tweede Kamer der Staten-Generaal worden gekozen door degenen die op de
      dag van de kandidaatstelling Nederlander zijn en op de dag van de stemming de leeftijd van
      achttien jaar hebben bereikt, met uitzondering van degenen die op de dag van de
      kandidaatstelling hun werkelijke woonplaats hebben in Aruba, Curacao of Sint Maarten. 2.
      Deze uitzondering geldt niet voor: a. de Nederlander die gedurende ten minste tien jaren
      ingezetene van Nederland is geweest; b. de Nederlander die in Nederlandse openbare dienst
      in Aruba, Curacao of Sint Maarten werkzaam is, alsmede zijn Nederlandse echtgenoot,
      geregistreerde partner of levensgezel en kinderen, voor zover dezen met hem een
      gemeenschappelijke huishouding voeren.
    url: https://wetten.overheid.nl/BWBR0004627/2024-01-01#ArtikelB1
    machine_readable:
      definitions:
        minimum_leeftijd: 18
      execution:
        parameters:
          - name: bsn
            type: string
            required: true
        input:
      # Declared first: the engine resolves inputs in declaration order and the
      # `leeftijd` input below passes $verkiezingsdatum as a parameter (the POC
      # resolved inputs lazily, so its position did not matter there).
          - name: verkiezingsdatum
            type: date
            source: {}
          - name: leeftijd
            type: number
            source:
              regulation: wet_brp
              output: leeftijd
              parameters:
                bsn: $bsn
                referentiedatum: $verkiezingsdatum
          - name: nationaliteit
            type: boolean
            source:
              regulation: wet_brp
              output: heeft_nederlandse_nationaliteit
              parameters:
                bsn: $bsn
                referentiedatum: $verkiezingsdatum
          - name: is_gedetineerd
            type: boolean
            source:
              regulation: penitentiaire_beginselenwet
              output: is_gedetineerd
              parameters:
                bsn: $bsn
          - name: gerechtelijke_uitsluiting
            type: boolean
            source:
              regulation: wetboek_van_strafrecht
              output: heeft_stemrecht_uitsluiting
              parameters:
                bsn: $bsn
            temporal:
              type: point_in_time
          # Lid 1 (uitzondering): "werkelijke woonplaats" op de dag van kandidaatstelling in
          # Aruba, Curacao of Sint Maarten. De demo-corpus heeft geen apart feitelijk
          # woonplaats-begrip; wet_brp.land_van_verblijf (RvIG-registratie) is de enige
          # beschikbare bron en wordt hier als die woonplaats gelezen (zie ook de aantekening
          # bij de action hieronder). land_verblijf is in bindings.yaml `absent: unknown`
          # (RFC-036), dus deze input is nullable en kan onbekend zijn.
          - name: land_van_verblijf
            type: string
            nullable: true
            source:
              regulation: wet_brp
              output: land_van_verblijf
              parameters:
                bsn: $bsn
                referentiedatum: $verkiezingsdatum
          # Lid 2 onder a: "gedurende ten minste tien jaren ingezetene van Nederland is
          # geweest". Geen bronregister in de demo-corpus voor ingezetenschapsduur; de
          # binding (bindings.yaml, kieswet.ingezetenschapsduur_jaren) is `kind: claim` en
          # dus altijd onbekend totdat iemand het opgeeft. Nullable, geen default: de tekst
          # geeft geen grond om bij ontbreken "nee" of "ja" te veronderstellen.
          - name: ingezetenschapsduur_jaren
            type: number
            nullable: true
            source: {}
          # Lid 2 onder b: "in Nederlandse openbare dienst in Aruba, Curacao of Sint Maarten
          # werkzaam is". De gezinsleden-clausule ("alsmede zijn Nederlandse echtgenoot,
          # geregistreerde partner of levensgezel en kinderen, voor zover dezen met hem een
          # gemeenschappelijke huishouding voeren") heeft geen bronveld in de demo-corpus
          # (geen huishoudensrelatie-koppeling beschikbaar); zie untranslatables. Alleen de
          # ambtsstatus van de kiesgerechtigde zelf is hier gemodelleerd. Geen bronregister
          # in de demo-corpus (bindings.yaml, kieswet.ambtsstatus, `kind: claim`), dus
          # nullable en onbekend tot opgave.
          - name: werkzaam_in_nederlandse_openbare_dienst
            type: boolean
            nullable: true
            source: {}
        output:
          - name: voldoet_aan_voorwaarden
            type: boolean
          - name: uitzondering_caribisch_nederland_van_toepassing
            type: boolean
          - name: heeft_stemrecht
            type: boolean
        actions:
          - output: voldoet_aan_voorwaarden
            value:
              operation: AND
              conditions:
                - subject: $nationaliteit
                  operation: EQUALS
                  value: true
                - subject: $leeftijd
                  operation: GREATER_THAN_OR_EQUAL
                  value: $minimum_leeftijd
                - subject: $gerechtelijke_uitsluiting
                  operation: EQUALS
                  value: false
          # Lid 1 laatste zinsdeel: "met uitzondering van degenen die ... hun werkelijke
          # woonplaats hebben in Aruba, Curacao of Sint Maarten", lid 2: "Deze uitzondering
          # geldt niet voor" a. of b. De uitzondering van lid 1 slaat dus alleen toe als de
          # persoon in een van de drie landen woont EN geen van de twee lid-2-gronden
          # opgaat. OR van de twee lid-2-gronden binnen NOT: bij onbekende
          # ingezetenschapsduur of ambtsstatus (Kleene, RFC-036) blijft de uitkomst
          # onbekend in plaats van dat de uitzondering stilzwijgend toeslaat of wegvalt.
          - output: uitzondering_caribisch_nederland_van_toepassing
            value:
              operation: AND
              conditions:
                - operation: IN
                  subject: $land_van_verblijf
                  values:
                    - ARUBA
                    - CURACAO
                    - SINT_MAARTEN
                - operation: NOT
                  value:
                    operation: OR
                    conditions:
                      - operation: AND
                        conditions:
                          - operation: NOT
                            value:
                              operation: EQUALS
                              subject: $ingezetenschapsduur_jaren
                              value: null
                          - subject: $ingezetenschapsduur_jaren
                            operation: GREATER_THAN_OR_EQUAL
                            value: 10
                      - subject: $werkzaam_in_nederlandse_openbare_dienst
                        operation: EQUALS
                        value: true
            legal_basis:
              law: Kieswet
              bwb_id: BWBR0004627
              article: B1
              url: >-
                https://wetten.overheid.nl/BWBR0004627/2025-02-12#AfdelingII_HoofdstukB_ArtikelB1
              juriconnect: jci1.3:c:BWBR0004627&artikel=B1&z=2025-02-12&g=2025-02-12
              explanation: >-
                Artikel B1 lid 1 (uitzondering werkelijke woonplaats Aruba, Curacao,
                Sint Maarten) en lid 2 (uitzonderingen op de uitzondering: tien jaar
                ingezetenschap of Nederlandse openbare dienst)
          - output: heeft_stemrecht
            value:
              operation: AND
              conditions:
                - operation: EQUALS
                  subject: $nationaliteit
                  value: true
                - operation: GREATER_THAN_OR_EQUAL
                  subject: $leeftijd
                  value: $minimum_leeftijd
                - operation: EQUALS
                  subject: $gerechtelijke_uitsluiting
                  value: false
                - operation: EQUALS
                  subject: $uitzondering_caribisch_nederland_van_toepassing
                  value: false
            legal_basis:
              law: Kieswet
              bwb_id: BWBR0004627
              article: B1
              url: >-
                https://wetten.overheid.nl/BWBR0004627/2025-02-12#AfdelingII_HoofdstukB_ArtikelB1
              juriconnect: jci1.3:c:BWBR0004627&artikel=B1&z=2025-02-12&g=2025-02-12
              explanation: >-
                De bepaling van stemrecht gebeurt volgens de cumulatieve voorwaarden uit artikel B1 en B3
                van de Kieswet
      untranslatables:
        - construct: >-
            "alsmede zijn Nederlandse echtgenoot, geregistreerde partner of levensgezel en
            kinderen, voor zover dezen met hem een gemeenschappelijke huishouding voeren"
            (art. B1 lid 2 onder b)
          reason: >-
            De demo-corpus heeft geen bronveld dat een huishoudensrelatie tussen de
            kiesgerechtigde en zijn echtgenoot, geregistreerde partner, levensgezel of
            kinderen koppelt aan de ambtsstatus van die kiesgerechtigde ("in Nederlandse
            openbare dienst werkzaam"). werkzaam_in_nederlandse_openbare_dienst is daarom
            alleen gemodelleerd voor de kiesgerechtigde zelf, niet voor gezinsleden die
            via hem onder de uitzondering van lid 2 onder b vallen.
          suggestion: >-
            Voeg een bron toe die de ambtsstatus van een referentiepersoon koppelt aan de
            huishoudensrelatie (partner/kind, gemeenschappelijke huishouding) uit de Wet
            BRP, of harvest dit zodra de demo-corpus een huishoudensregistratie heeft.
          accepted: true
