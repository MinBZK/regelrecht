---
$schema: >-
  https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.5.8/schema/v0.5.8/schema.json
$id: machtigingenwet
regulatory_layer: WET
publication_date: '2024-01-01'
valid_from: '2024-01-01'
name: Bepalen vertegenwoordigingsbevoegdheid namens rechtspersonen
bwb_id: BWBR0003045
url: https://wetten.overheid.nl/BWBR0003045/2024-01-01
service: KVK
uuid: 3f8a2b1c-9d4e-4f5a-b8c7-6e1d2f3a4b5c
discoverable: DELEGATION_PROVIDER
articles:
  - number: '240'
    text: >-
      1 Het bestuur vertegenwoordigt de vennootschap, voor zover uit de wet niet anders
      voortvloeit.

      2 De bevoegdheid tot vertegenwoordiging komt mede aan iedere bestuurder toe. De statuten
      kunnen echter bepalen dat zij behalve aan het bestuur slechts toekomt aan een of meer
      bestuurders. Zij kunnen voorts bepalen dat een bestuurder de vennootschap slechts met
      medewerking van een of meer anderen mag vertegenwoordigen.

      3 Bevoegdheid tot vertegenwoordiging die aan het bestuur of aan een bestuurder toekomt, is
      onbeperkt en onvoorwaardelijk, voor zover uit de wet niet anders voortvloeit. Een
      wettelijk toegelaten of voorgeschreven beperking van of voorwaarde voor de bevoegdheid tot
      vertegenwoordiging kan slechts door de vennootschap worden ingeroepen.

      4 De statuten kunnen ook aan andere personen dan bestuurders bevoegdheid tot
      vertegenwoordiging toekennen.
    url: https://wetten.overheid.nl/BWBR0003045/2024-01-01#Artikel240
    machine_readable:
      definitions:
        # Art. 2:240 lid 2 BW: "De bevoegdheid tot vertegenwoordiging komt mede aan iedere
        # bestuurder toe." Alleen bestuurders van rechtspersonen (Boek 2 BW) vallen hieronder.
        bestuurder_functies:
          - BESTUURDER
          - DIRECTEUR
          - ALGEMEEN_DIRECTEUR
        # Art. 2:240 lid 4 BW: "De statuten kunnen ook aan andere personen dan bestuurders
        # bevoegdheid tot vertegenwoordiging toekennen." Dit zijn statutair gemachtigden van de
        # rechtspersoon zelf, niet de bestuurders van lid 2. VOORZITTER (bv. van een vereniging)
        # is zo'n statutair aangewezen andere persoon en staat daarom hier, niet bij bestuurders.
        gemachtigde_functies:
          - GEMACHTIGDE
          - PROCURATIEHOUDER
          - GEVOLMACHTIGDE
          - VOORZITTER
        # Vallen NIET onder art. 2:240 BW: dat artikel regelt de vertegenwoordiging van
        # rechtspersonen (Boek 2 BW). Eigenaar (eenmanszaak), vennoot/maat (VOF/maatschap,
        # Boek 7A BW) en beherend vennoot (CV) zijn geen rechtspersonen met een bestuur in de zin
        # van Boek 2. Hun vertegenwoordigingsbevoegdheid berust op andere titels (Boek 7A BW,
        # niet in dit corpus aanwezig); zie de untranslatable hieronder. Grondslag hier is daarom
        # de Handelsregisterwet-registratie van de functie, niet art. 2:240.
        eigenaar_functies:
          - EIGENAAR
          - VENNOOT
          - BEHEREND_VENNOOT
          - MAAT
        bevoegde_functies:
          - BESTUURDER
          - DIRECTEUR
          - ALGEMEEN_DIRECTEUR
          - GEMACHTIGDE
          - PROCURATIEHOUDER
          - GEVOLMACHTIGDE
          - VOORZITTER
          - EIGENAAR
          - VENNOOT
          - BEHEREND_VENNOOT
          - MAAT
        volledige_bevoegdheid_rechten:
          - LEZEN
          - CLAIMS_INDIENEN
          - BESLUITEN_ONTVANGEN
        beperkte_bevoegdheid_rechten:
          - LEZEN
      execution:
        produces:
          legal_character: BESCHIKKING
          decision_type: ANDERE_HANDELING
        parameters:
          - name: bsn
            type: string
            required: true
        input:
          - name: functionarissen
            type: array
            source: {}
        output:
          - name: voldoet_aan_voorwaarden
            type: boolean
          - name: heeft_delegaties
            type: boolean
          - name: subject_ids
            type: array
          - name: subject_names
            type: array
          - name: subject_types
            type: array
          - name: delegation_types
            type: array
          - name: permissions
            type: array
          - name: valid_from_dates
            type: array
          - name: valid_until_dates
            type: array
          - name: bevoegdheden
            type: array
        actions:
          - output: voldoet_aan_voorwaarden
        # POC: EXISTS op lijst $functionarissen (uitvoer voldoet_aan_voorwaarden) betekende 'niet leeg'; expliciet als
        # telling (RFC-016)
            value:
              operation: GREATER_THAN
              subject:
                operation: FOREACH
                collection: $functionarissen
                body: 1
                combine: ADD
              value: 0
          - output: bevoegde_functionarissen
            value:
              operation: FOREACH
              collection: $functionarissen
              filter:
                operation: IN
                subject: $current.functie
                value: $bevoegde_functies
              body: $current
              as: current
            # De filter combineert drie verschillende grondslagen (lid 2, lid 4, en buiten
            # art. 2:240) tot één bevoegdheidscontrole; de opsplitsing staat in de definities
            # hierboven en de aparte legal_basis-vermelding bij "heeft_delegaties" hieronder.
            legal_basis:
              law: Burgerlijk Wetboek Boek 2
              bwb_id: BWBR0003045
              article: '240'
              paragraph: '2'
              url: >-
                https://wetten.overheid.nl/BWBR0003045/2024-01-01#Boek2_Titeldeel5_Afdeling4_Artikel240
              juriconnect: >-
                jci1.3:c:BWBR0003045&boek=2&artikel=240&lid=2&z=2024-01-01&g=2024-01-01
              explanation: >
                Art. 2:240 lid 2 BW: bestuurders hebben vertegenwoordigingsbevoegdheid. Art. 2:240 lid 4
                BW: de statuten kunnen ook aan andere personen dan bestuurders bevoegdheid toekennen
                (gemachtigde, procuratiehouder, gevolmachtigde, voorzitter). Eigenaar/vennoot/maat/beherend
                vennoot vallen buiten art. 2:240 (geen rechtspersoon-bestuur in de zin van Boek 2); zie
                de untranslatable onderaan dit artikel. Commissarissen en andere toezichthouders zijn
                NIET bevoegd de rechtspersoon te vertegenwoordigen.
          - output: heeft_delegaties
        # POC: EXISTS op lijst $bevoegde_functionarissen (uitvoer heeft_delegaties) betekende 'niet leeg'; expliciet als
        # telling (RFC-016)
            value:
              operation: GREATER_THAN
              subject:
                operation: FOREACH
                collection: $bevoegde_functionarissen
                body: 1
                combine: ADD
              value: 0
            legal_basis:
              law: Burgerlijk Wetboek Boek 2
              bwb_id: BWBR0003045
              article: '240'
              paragraph: '2'
              url: >-
                https://wetten.overheid.nl/BWBR0003045/2024-01-01#Boek2_Titeldeel5_Afdeling4_Artikel240
              juriconnect: >-
                jci1.3:c:BWBR0003045&boek=2&artikel=240&lid=2&z=2024-01-01&g=2024-01-01
              explanation: >
                Art. 2:240 lid 2 en lid 4 BW bepalen wie voor een rechtspersoon vertegenwoordigingsbevoegd
                is (bestuurders, en bij statuten aangewezen andere personen). Eigenaar/vennoot/maat/
                beherend vennoot tellen hier ook mee op grond van hun Handelsregisterinschrijving, niet
                op grond van art. 2:240 (zie de untranslatable onderaan dit artikel). Alleen functies
                met vertegenwoordigingsbevoegdheid worden meegeteld.
          - output: subject_ids
        # POC: impliciete map over een lijst ($bevoegde_functionarissen.kvk_nummer); expliciet als FOREACH (RFC-016)
            value:
              operation: FOREACH
              collection: $bevoegde_functionarissen
              as: item
              body: $item.kvk_nummer
            legal_basis:
              law: Handelsregisterwet 2007
              bwb_id: BWBR0021777
              article: '18'
              url: >-
                https://wetten.overheid.nl/BWBR0021777/2024-01-01#Hoofdstuk3_Artikel18
              juriconnect: jci1.3:c:BWBR0021777&artikel=18&z=2024-01-01&g=2024-01-01
              explanation: >-
                KVK nummers van bedrijven waarvoor bevoegde vertegenwoordiging is geregistreerd
          - output: subject_names
        # POC: impliciete map over een lijst ($bevoegde_functionarissen.handelsnaam); expliciet als FOREACH (RFC-016)
            value:
              operation: FOREACH
              collection: $bevoegde_functionarissen
              as: item
              body: $item.handelsnaam
            legal_basis:
              law: Handelsregisterwet 2007
              bwb_id: BWBR0021777
              article: '9'
              url: >-
                https://wetten.overheid.nl/BWBR0021777/2024-01-01#Hoofdstuk3_Artikel9
              juriconnect: jci1.3:c:BWBR0021777&artikel=9&z=2024-01-01&g=2024-01-01
              explanation: Handelsnaam uit inschrijving in Handelsregister
          - output: subject_types
            value:
              operation: FOREACH
              collection: $bevoegde_functionarissen
              body: BUSINESS
            legal_basis:
              law: Handelsregisterwet 2007
              bwb_id: BWBR0021777
              article: '9'
              url: >-
                https://wetten.overheid.nl/BWBR0021777/2024-01-01#Hoofdstuk3_Artikel9
              juriconnect: jci1.3:c:BWBR0021777&artikel=9&z=2024-01-01&g=2024-01-01
              explanation: >-
                Deze wet behandelt alleen rechtspersonen (BUSINESS), geen natuurlijke personen
          - output: delegation_types
        # POC: impliciete map over een lijst ($bevoegde_functionarissen.functie); expliciet als FOREACH (RFC-016)
            value:
              operation: FOREACH
              collection: $bevoegde_functionarissen
              as: item
              body: $item.functie
            legal_basis:
              law: Handelsregisterwet 2007
              bwb_id: BWBR0021777
              article: '18'
              url: >-
                https://wetten.overheid.nl/BWBR0021777/2024-01-01#Hoofdstuk3_Artikel18
              juriconnect: jci1.3:c:BWBR0021777&artikel=18&z=2024-01-01&g=2024-01-01
              explanation: Functie uit functionaris-registratie in Handelsregister
          - output: bevoegdheden
        # POC: impliciete map over een lijst ($bevoegde_functionarissen.bevoegdheid); expliciet als FOREACH (RFC-016)
            value:
              operation: FOREACH
              collection: $bevoegde_functionarissen
              as: item
              body: $item.bevoegdheid
            legal_basis:
              law: Burgerlijk Wetboek Boek 2
              bwb_id: BWBR0003045
              article: '240'
              paragraph: '3'
              url: >-
                https://wetten.overheid.nl/BWBR0003045/2024-01-01#Boek2_Titeldeel5_Afdeling4_Artikel240
              juriconnect: >-
                jci1.3:c:BWBR0003045&boek=2&artikel=240&lid=3&z=2024-01-01&g=2024-01-01
              explanation: >
                Art. 2:240 lid 3 BW: de bevoegdheid van het bestuur kan in de statuten worden beperkt. Het
                Handelsregister registreert dit als VOLLEDIG of BEPERKT.
          - output: permissions
            value:
              operation: FOREACH
              collection: $bevoegdheden
              body:
                operation: IF
                cases:
                  - when:
                      operation: EQUALS
                      subject: $current
                      value: VOLLEDIG
                    then: $volledige_bevoegdheid_rechten
                default: $beperkte_bevoegdheid_rechten
              as: current
            legal_basis:
              law: Burgerlijk Wetboek Boek 2
              bwb_id: BWBR0003045
              article: '240'
              paragraph: '3'
              url: >-
                https://wetten.overheid.nl/BWBR0003045/2024-01-01#Boek2_Titeldeel5_Afdeling4_Artikel240
              juriconnect: >-
                jci1.3:c:BWBR0003045&boek=2&artikel=240&lid=3&z=2024-01-01&g=2024-01-01
              explanation: >
                Bepaalt per bedrijf de rechten op basis van de geregistreerde bevoegdheid. VOLLEDIG = alle
                rechten, BEPERKT = alleen leesrechten.
          - output: valid_from_dates
        # POC: impliciete map over een lijst ($bevoegde_functionarissen.datum_inschrijving); expliciet als FOREACH (RFC-016)
            value:
              operation: FOREACH
              collection: $bevoegde_functionarissen
              as: item
              body: $item.datum_inschrijving
            legal_basis:
              law: Handelsregisterwet 2007
              bwb_id: BWBR0021777
              article: '18'
              url: >-
                https://wetten.overheid.nl/BWBR0021777/2024-01-01#Hoofdstuk3_Artikel18
              juriconnect: jci1.3:c:BWBR0021777&artikel=18&z=2024-01-01&g=2024-01-01
              explanation: Inschrijvingsdatum uit Handelsregister
          - output: valid_until_dates
        # POC: impliciete map over een lijst ($bevoegde_functionarissen.datum_uitschrijving); expliciet als FOREACH (RFC-016)
            value:
              operation: FOREACH
              collection: $bevoegde_functionarissen
              as: item
              body: $item.datum_uitschrijving
            legal_basis:
              law: Handelsregisterwet 2007
              bwb_id: BWBR0021777
              article: '18'
              url: >-
                https://wetten.overheid.nl/BWBR0021777/2024-01-01#Hoofdstuk3_Artikel18
              juriconnect: jci1.3:c:BWBR0021777&artikel=18&z=2024-01-01&g=2024-01-01
              explanation: >-
                Uitschrijvingsdatum uit Handelsregister, null indien nog actief
      untranslatables:
        - construct: >-
            iteratie over variabel aantal functionarissen en bevoegdheden
          reason: >-
            FOREACH niet beschikbaar in v0.5.1 schema; het aantal functionarissen en bevoegdheden per
            rechtspersoon is dynamisch en kan niet vooraf worden uitgerold
          suggestion: >-
            Voeg FOREACH toe aan het schema of beperk het aantal functionarissen tot een vast maximum
          accepted: true
        - construct: >-
            vertegenwoordigingsbevoegdheid van eigenaar (eenmanszaak), vennoot/maat (VOF, maatschap)
            en beherend vennoot (CV) (definitie eigenaar_functies)
          reason: >-
            Art. 2:240 BW regelt uitsluitend de vertegenwoordiging van rechtspersonen met een bestuur
            in de zin van Boek 2 BW. Eenmanszaak, VOF, maatschap en CV zijn geen rechtspersonen en
            hebben geen bestuur; hun vertegenwoordigingsbevoegdheid berust op Boek 7A BW (titel 9,
            maatschap/vennootschap) en op de vennootschapsovereenkomst, niet op art. 2:240. Die
            wettekst staat niet in dit corpus (alleen Burgerlijk Wetboek Boek 2 en de
            Handelsregisterwet 2007), dus de grondslag kan hier niet worden aangehaald.
          legal_text_excerpt: >-
            2 De bevoegdheid tot vertegenwoordiging komt mede aan iedere bestuurder toe.
          suggestion: >-
            Boek 7A BW (maatschap/vennootschap onder firma) opnemen in het corpus en eigenaar_functies
            daaraan koppelen in plaats van aan art. 2:240
          accepted: true
