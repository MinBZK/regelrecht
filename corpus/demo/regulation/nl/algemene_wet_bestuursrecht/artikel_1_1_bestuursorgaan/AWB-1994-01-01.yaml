---
$schema: >-
  https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.5.8/schema/v0.5.8/schema.json
$id: algemene_wet_bestuursrecht
regulatory_layer: WET
publication_date: '1994-01-01'
valid_from: '1994-01-01'
name: Bestuursorgaan Definitie
bwb_id: BWBR0005537
url: https://wetten.overheid.nl/BWBR0005537/1994-01-01
service: AWB
uuid: 7b2c4d8e-3f91-4a6b-9c5e-8d7f6a5b4c3d
discoverable: BUSINESS
articles:
  - number: '1'
    text: >-
      1. Onder bestuursorgaan wordt verstaan: a. een orgaan van een rechtspersoon die krachtens
      publiekrecht is ingesteld, of b. een ander persoon of college, met enig openbaar gezag
      bekleed. 2. De volgende organen, personen en colleges worden niet als bestuursorgaan
      aangemerkt: a. de wetgevende macht; b. de kamers en de verenigde vergadering der
      Staten-Generaal; c. onafhankelijke, bij de wet ingestelde organen die met rechtspraak zijn
      belast, alsmede de Raad voor de rechtspraak en het College van afgevaardigden; d. de Raad
      van State en zijn afdelingen; e. de Algemene Rekenkamer; f. de Nationale ombudsman en de
      substituut-ombudsmannen als bedoeld in artikel 9, eerste lid, van de Wet Nationale
      ombudsman, en ombudsmannen en ombudscommissies als bedoeld in artikel 9:17, onderdeel b;
      g. de voorzitters, leden, griffiers en secretarissen van de in de onderdelen b tot en met
      f bedoelde organen, de procureur-generaal, de plaatsvervangend procureur-generaal en de
      advocaten-generaal bij de Hoge Raad, de besturen van de in onderdeel c bedoelde organen
      alsmede de voorzitters van die besturen, alsmede de commissies uit het midden van de in de
      onderdelen b tot en met f bedoelde organen; h. de commissie van toezicht op de
      inlichtingen- en veiligheidsdiensten en haar afdelingen, bedoeld in artikel 97 van de Wet
      op de inlichtingen- en veiligheidsdiensten 2017; i. de toetsingscommissie inzet
      bevoegdheden, bedoeld in artikel 32 van de Wet op de inlichtingen- en veiligheidsdiensten
      2017. 3. Een ingevolge het tweede lid uitgezonderd orgaan, persoon of college wordt wel
      als bestuursorgaan aangemerkt voor zover het orgaan, de persoon of het college besluiten
      neemt of handelingen verricht ten aanzien van een persoon met betrekking tot diens in
      artikel 3 van de Ambtenarenwet 2017 bedoelde hoedanigheid, zijn nagelaten betrekkingen of
      zijn rechtverkrijgenden, met uitzondering van een voor het leven benoemde ambtenaar
      werkzaam bij de Raad van State en zijn afdelingen en de Algemene Rekenkamer. 4. De
      vermogensrechtelijke gevolgen van een handeling van een bestuursorgaan treffen de
      rechtspersoon waartoe het bestuursorgaan behoort.
    url: https://wetten.overheid.nl/BWBR0005537/1994-01-01#Artikel1
    machine_readable:
      definitions:
        twee_derde_drempel: 66.67
      execution:
        parameters:
          - name: organisatie_id
            type: string
            required: true
        input:
          - name: is_orgaan_van_rechtspersoon
            type: boolean
            nullable: true
            source: {}
          - name: publiekrechtelijke_rechtspersoon_type
            type: string
            nullable: true
            source: {}
          - name: heeft_publiekrechtelijke_bevoegdheid
            type: boolean
            nullable: true
            source: {}
          - name: bevoegdheid_bij_of_krachtens_wet
            type: boolean
            nullable: true
            source: {}
          - name: overheidsfinanciering_percentage
            type: number
            source: {}
          - name: criteria_door_overheid_bepaald
            type: boolean
            nullable: true
            source: {}
          - name: is_uitsluitend_financiele_uitkering
            type: boolean
            nullable: true
            source: {}
          - name: is_volksvertegenwoordigend_orgaan
            type: boolean
            nullable: true
            source: {}
          - name: is_rechterlijk_orgaan
            type: boolean
            nullable: true
            source: {}
          - name: is_ombudsman
            type: boolean
            nullable: true
            source: {}
          - name: is_algemene_rekenkamer
            type: boolean
            nullable: true
            source: {}
          # Lid 2 onder a: de wetgevende macht. Nullable boolean; afwezig (unknown)
          # betekent geen uitsluitingsgrond, niet "nee" (RFC-036 absentiesemantiek).
          - name: is_wetgevende_macht
            type: boolean
            nullable: true
            source: {}
          # Lid 2 onder d: de Raad van State en zijn afdelingen.
          - name: is_raad_van_state
            type: boolean
            nullable: true
            source: {}
          # Lid 2 onder g: voorzitters, leden, griffiers en secretarissen van de in
          # onderdelen b t/m f bedoelde organen, de procureur-generaal, de plaatsvervangend
          # procureur-generaal en de advocaten-generaal bij de Hoge Raad, de besturen van de
          # in onderdeel c bedoelde organen en hun voorzitters, en de commissies uit het
          # midden van de in b t/m f bedoelde organen. Eén functionaris-grond: de tekst
          # somt verschillende ambten op maar koppelt ze allemaal aan hetzelfde in onderdeel
          # g bedoelde uitsluitingsgevolg.
          - name: is_functionaris_uitgezonderd_orgaan
            type: boolean
            nullable: true
            source: {}
          # Lid 2 onder h: de commissie van toezicht op de inlichtingen- en
          # veiligheidsdiensten (CTIVD) en haar afdelingen.
          - name: is_ctivd
            type: boolean
            nullable: true
            source: {}
          # Lid 2 onder i: de toetsingscommissie inzet bevoegdheden (TIB).
          - name: is_tib
            type: boolean
            nullable: true
            source: {}
          # Lid 3: voor de terug-uitzondering is nodig of het uitgezonderde orgaan/de
          # uitgezonderde persoon een ambtenaarrechtelijk besluit neemt (jegens eigen
          # personeel, nagelaten betrekkingen of rechtverkrijgenden in de zin van art. 3
          # Ambtenarenwet 2017), en of het gaat om een voor het leven benoemde ambtenaar bij
          # de Raad van State (en zijn afdelingen) of de Algemene Rekenkamer — voor hen geldt
          # de terug-uitzondering weer niet.
          - name: is_ambtenarenrechtelijk_besluit_eigen_personeel
            type: boolean
            nullable: true
            source: {}
          - name: is_voor_het_leven_benoemde_ambtenaar_rvs_of_rekenkamer
            type: boolean
            nullable: true
            source: {}
        output:
          - name: is_bestuursorgaan
            type: boolean
          - name: bestuursorgaan_type
            type: string
          - name: exclusion_reason
            type: string
            nullable: true
          - name: is_excluded
            type: boolean
          - name: qualifies_as_bestuursorgaan
            type: boolean
          - name: is_a_orgaan
            type: boolean
          - name: is_b_orgaan
            type: boolean
        actions:
          - output: is_excluded
            # Lid 2: alle negen gronden (a t/m i) als OR-takken. a, d, g, h, i zijn
            # toegevoegd; b/c/e/f waren al gemodelleerd als
            # is_volksvertegenwoordigend_orgaan / is_rechterlijk_orgaan / is_ombudsman /
            # is_algemene_rekenkamer.
            value:
              operation: OR
              conditions:
                - operation: EQUALS
                  subject: $is_wetgevende_macht
                  value: true
                - operation: EQUALS
                  subject: $is_volksvertegenwoordigend_orgaan
                  value: true
                - operation: EQUALS
                  subject: $is_rechterlijk_orgaan
                  value: true
                - operation: EQUALS
                  subject: $is_raad_van_state
                  value: true
                - operation: EQUALS
                  subject: $is_algemene_rekenkamer
                  value: true
                - operation: EQUALS
                  subject: $is_ombudsman
                  value: true
                - operation: EQUALS
                  subject: $is_functionaris_uitgezonderd_orgaan
                  value: true
                - operation: EQUALS
                  subject: $is_ctivd
                  value: true
                - operation: EQUALS
                  subject: $is_tib
                  value: true
          - output: qualifies_as_bestuursorgaan
            value:
              operation: OR
              conditions:
                - operation: AND
                  conditions:
                    - operation: EQUALS
                      subject: $is_orgaan_van_rechtspersoon
                      value: true
                    - operation: IN
                      subject: $publiekrechtelijke_rechtspersoon_type
                      values:
                        - RIJK
                        - PROVINCIE
                        - WATERSCHAP
                        - GEMEENTE
                        - OPENBAAR_LICHAAM
                - operation: AND
                  conditions:
                    - operation: EQUALS
                      subject: $heeft_publiekrechtelijke_bevoegdheid
                      value: true
                    - operation: EQUALS
                      subject: $bevoegdheid_bij_of_krachtens_wet
                      value: true
                    - operation: EQUALS
                      subject: $is_uitsluitend_financiele_uitkering
                      value: false
                - operation: AND
                  conditions:
                    - operation: EQUALS
                      subject: $is_uitsluitend_financiele_uitkering
                      value: true
                    - operation: GREATER_THAN_OR_EQUAL
                      subject: $overheidsfinanciering_percentage
                      value: $twee_derde_drempel
                    - operation: EQUALS
                      subject: $criteria_door_overheid_bepaald
                      value: true
          - output: is_bestuursorgaan
            # Lid 3: een op grond van lid 2 uitgezonderd orgaan/persoon/college wordt tóch
            # als bestuursorgaan aangemerkt voor zover het ambtenarenrechtelijke besluiten
            # neemt over eigen personeel (art. 3 Ambtenarenwet 2017), met een terug-
            # uitzondering voor een voor het leven benoemde ambtenaar bij de Raad van State
            # (en zijn afdelingen) of de Algemene Rekenkamer. Gemodelleerd als OR naast de
            # reguliere lid 1-toets, conform de wettekst.
            value:
              operation: OR
              conditions:
                - operation: AND
                  conditions:
                    - operation: EQUALS
                      subject: $qualifies_as_bestuursorgaan
                      value: true
                    - operation: NOT
                      value:
                        operation: EQUALS
                        subject: $is_excluded
                        value: true
                - operation: AND
                  conditions:
                    - operation: EQUALS
                      subject: $is_excluded
                      value: true
                    - operation: EQUALS
                      subject: $is_ambtenarenrechtelijk_besluit_eigen_personeel
                      value: true
                    - operation: NOT
                      value:
                        operation: EQUALS
                        subject: $is_voor_het_leven_benoemde_ambtenaar_rvs_of_rekenkamer
                        value: true
          - output: is_a_orgaan
            value:
              operation: AND
              conditions:
                - operation: EQUALS
                  subject: $is_orgaan_van_rechtspersoon
                  value: true
                - operation: IN
                  subject: $publiekrechtelijke_rechtspersoon_type
                  values:
                    - RIJK
                    - PROVINCIE
                    - WATERSCHAP
                    - GEMEENTE
                    - OPENBAAR_LICHAAM
          - output: is_b_orgaan
            value:
              operation: OR
              conditions:
                - operation: AND
                  conditions:
                    - operation: EQUALS
                      subject: $heeft_publiekrechtelijke_bevoegdheid
                      value: true
                    - operation: EQUALS
                      subject: $bevoegdheid_bij_of_krachtens_wet
                      value: true
                    - operation: EQUALS
                      subject: $is_uitsluitend_financiele_uitkering
                      value: false
                - operation: AND
                  conditions:
                    - operation: EQUALS
                      subject: $is_uitsluitend_financiele_uitkering
                      value: true
                    - operation: GREATER_THAN_OR_EQUAL
                      subject: $overheidsfinanciering_percentage
                      value: $twee_derde_drempel
                    - operation: EQUALS
                      subject: $criteria_door_overheid_bepaald
                      value: true
          - output: bestuursorgaan_type
            value:
              operation: IF
              cases:
                - when:
                    operation: AND
                    conditions:
                      - operation: EQUALS
                        subject: $is_bestuursorgaan
                        value: true
                      - operation: EQUALS
                        subject: $is_a_orgaan
                        value: true
                  then: A_ORGAAN
                - when:
                    operation: AND
                    conditions:
                      - operation: EQUALS
                        subject: $is_bestuursorgaan
                        value: true
                      - operation: EQUALS
                        subject: $is_b_orgaan
                        value: true
                  then: B_ORGAAN
              default: GEEN_BESTUURSORGAAN
          - output: exclusion_reason
            # Volgorde volgt de opsomming van lid 2 (a t/m i). Bij lid 3-terugval blijft
            # exclusion_reason de oorspronkelijke lid 2-grond tonen; is_bestuursorgaan is
            # dan alsnog true, wat samen laat zien dát en waaróm de terugval toepast.
            value:
              operation: IF
              cases:
                - when:
                    operation: EQUALS
                    subject: $is_wetgevende_macht
                    value: true
                  then: WETGEVENDE_MACHT
                - when:
                    operation: EQUALS
                    subject: $is_volksvertegenwoordigend_orgaan
                    value: true
                  then: VOLKSVERTEGENWOORDIGEND_ORGAAN
                - when:
                    operation: EQUALS
                    subject: $is_rechterlijk_orgaan
                    value: true
                  then: RECHTERLIJK_ORGAAN
                - when:
                    operation: EQUALS
                    subject: $is_raad_van_state
                    value: true
                  then: RAAD_VAN_STATE
                - when:
                    operation: EQUALS
                    subject: $is_algemene_rekenkamer
                    value: true
                  then: ALGEMENE_REKENKAMER
                - when:
                    operation: EQUALS
                    subject: $is_ombudsman
                    value: true
                  then: OMBUDSMAN
                - when:
                    operation: EQUALS
                    subject: $is_functionaris_uitgezonderd_orgaan
                    value: true
                  then: FUNCTIONARIS_UITGEZONDERD_ORGAAN
                - when:
                    operation: EQUALS
                    subject: $is_ctivd
                    value: true
                  then: CTIVD
                - when:
                    operation: EQUALS
                    subject: $is_tib
                    value: true
                  then: TIB
