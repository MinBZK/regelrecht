            origin:
              waarde: BELANGHEBBENDE
              grondslag: algemene_wet_inkomensafhankelijke_regelingen#16 lid 1
          - name: tegemoetkoming
            type: amount
            required: false
            description: >-
              De tegemoetkoming die de inkomensafhankelijke regeling in de fase
