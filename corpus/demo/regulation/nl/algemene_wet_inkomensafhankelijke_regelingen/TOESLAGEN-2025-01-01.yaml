---
$schema: >-
  https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.8.0/schema/v0.8.0/schema.json
$id: algemene_wet_inkomensafhankelijke_regelingen
regulatory_layer: WET
publication_date: '2022-12-27'
valid_from: '2025-01-01'
name: Algemene wet inkomensafhankelijke regelingen
bwb_id: BWBR0018472
url: https://wetten.overheid.nl/BWBR0018472/2025-01-01
articles:
  - number: '15'
    text: >-
      Artikel 15. Aanvraag tegemoetkoming 1. Een aanvraag om een tegemoetkoming met betrekking tot een berekeningsjaar
      kan tot 1. april van het jaar volgend op het berekeningsjaar worden ingediend bij de Belastingdienst/Toeslagen. 2.
      Indien de belanghebbende een partner heeft, wordt de aanvraag mede ondertekend door de partner. 3. Indien in een
      inkomensafhankelijke regeling is bepaald dat naast de draagkracht van belanghebbende en diens partner ook de
      draagkracht van medebewoners van belang is voor de beoordeling van de aanspraak op of de bepaling van de hoogte van
      een tegemoetkoming, wordt de aanvraag mede ondertekend door de medebewoners. 4. Een aanvraag wordt geacht mede te
      zijn gedaan voor op het berekeningsjaar volgende berekeningsjaren. 5. Indien de Belastingdienst/Toeslagen van
      oordeel is dat toepassing van het vierde lid kan worden beëindigd, deelt hij dit de belanghebbende schriftelijk
      mee. 6. De Belastingdienst/Toeslagen kan op eigen initiatief een aanvraagformulier toezenden aan degene die
      vermoedelijk voor een tegemoetkoming in aanmerking komt. Op dat formulier kunnen voor de belanghebbende en zijn
      niet duurzaam gescheiden levende echtgenoot of geregistreerde partner de gegevens worden vermeld die van belang
      kunnen zijn voor de beoordeling van de aanspraak of de bepaling van de hoogte van de tegemoetkoming. 7. In bij
      algemene maatregel van bestuur te bepalen gevallen kan de in het zesde lid bedoelde vermelding van gegevens ook
      plaatsvinden voor de partner die niet is de in dat lid bedoelde partner. De voordracht voor een krachtens de eerste
      volzin vast te stellen algemene maatregel van bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp aan
      beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0018472/2025-01-01#Artikel15
    machine_readable:
      execution:
        produces:
          # Lid 1: de belanghebbende vraagt een tegemoetkoming aan bij de
          # Belastingdienst/Toeslagen, dus dit artikel vestigt de aanvraag
          # (RFC-046). Op die aanvraag wordt een beschikking genomen (de
          # zorgtoeslag, Zorgtoeslagwet art. 2), zodat Awb 4:2 en 4:13 erop
          # haken. Wat de aanvrager hier invult, wordt een veld van de aanvraag
          # (chronolex).
          submission:
            kind: AANVRAAG
          legal_character: TOETS
          decision_type: GEEN_BESLUIT
          extensions:
            chronolex:
              establishes:
                - event: aanvraag_ontvangen
                  fields: parameters
        parameters:
          - name: bsn
            type: string
            nullable: true
            required: true
            description: Het burgerservicenummer van de aanvrager (art. 13).
            origin:
              waarde: BELANGHEBBENDE
              grondslag: algemene_wet_inkomensafhankelijke_regelingen#15 lid 1
          - name: aangevraagd_berekeningsjaar
            type: number
            required: true
            description: Het berekeningsjaar waarop de aanvraag betrekking heeft (lid 1).
            origin:
              waarde: BELANGHEBBENDE
              grondslag: algemene_wet_inkomensafhankelijke_regelingen#15 lid 1
          - name: ondertekening_partner
            type: string
            nullable: true
            required: false
            description: Wie als partner de aanvraag mede ondertekende (lid 2).
            origin:
              waarde: BELANGHEBBENDE
              grondslag: algemene_wet_inkomensafhankelijke_regelingen#15 lid 2
          - name: datum_ontvangst
            type: date
            required: true
            description: >-
              De dag waarop de Belastingdienst/Toeslagen de aanvraag ontving
              (Awb 4:13 lid 1).
            origin:
              waarde: DOSSIER
              grondslag: algemene_wet_bestuursrecht#4:13 lid 1
        output:
          - name: aanvraag_binnen_termijn
            type: boolean
            description: >-
              Lid 1: de aanvraag is ingediend vóór 1 april van het jaar volgend
              op het berekeningsjaar.
        actions:
          - output: aanvraag_binnen_termijn
            value:
              operation: LESS_THAN
              subject: $datum_ontvangst
              value:
                operation: DATE
                year:
                  operation: ADD
                  values:
                    - $aangevraagd_berekeningsjaar
                    - 1
                month: 4
                day: 1
