  - number: '22'
    text: >-
      1 Een voorschot dat wordt verleend vóór de aanvang van het berekeningsjaar waarop het voorschot betrekking
      heeft, wordt uitbetaald in 12 termijnen. De uitbetaling van de eerste termijn vindt plaats in de maand december
      voorafgaand aan het berekeningsjaar en elke volgende termijn telkens een maand later.


      2 Een voorschot dat wordt verleend in de loop van het berekeningsjaar waarop het voorschot betrekking heeft, en
      waarvan de beschikking een dagtekening heeft die ligt vóór 1 november van dat jaar, wordt uitbetaald in zoveel
      termijnen als er na de maand van dagtekening nog kalendermaanden van dat jaar overblijven. De uitbetaling van de
      eerste termijn vindt plaats in de maand van dagtekening en elke volgende termijn telkens een maand later.


      3 Indien de belanghebbende voor een deel van het berekeningsjaar aanspraak heeft op een tegemoetkoming wordt,
      in zoverre in afwijking van de voorgaande leden, het voorschot in zoveel termijnen uitbetaald als het aantal
      kalendermaanden waarin de aanspraak bestaat. De uitbetaling van de eerste termijn vindt niet eerder plaats dan in
      de maand voorafgaand aan de maand waarin de aanspraak ontstaat.


      4 Indien een beschikking waarbij over het berekeningsjaar voor het eerst een voorschot wordt verleend een
      dagtekening heeft die ligt na de maand waarin de aanspraak is ontstaan, wordt het voorschot voorzover dat
      betrekking heeft op de in het berekeningsjaar reeds verstreken kalendermaanden waarin de aanspraak bestond met
      inbegrip van de maand van dagtekening van de beschikking, in één bedrag uitbetaald in de maand van dagtekening en
      wordt het daarna nog resterende deel van het voorschot uitbetaald overeenkomstig het tweede lid.


      5 Een voorschot dat wordt verleend in de loop van of na afloop van het berekeningsjaar waarop het voorschot
      betrekking heeft en waarvan de beschikking een dagtekening heeft die ligt na 31 oktober van dat jaar, wordt in één
      bedrag uitbetaald in de maand van dagtekening.


      6 Ingeval er bij de uitbetaling van een voorschot een situatie van interregionaal of internationaal recht van
      toepassing is, kan de uitbetaling op een ander moment dan als bepaald in de voorgaande leden plaatsvinden.


      7 Indien executoriaal beslag is gelegd op een in een of meer termijnen uit te betalen bedrag op grond van een
      voorschot, wordt het beslag geacht mede te omvatten een in termijnen uit te betalen bedrag van een voorschot in het
      kader van dezelfde inkomensafhankelijke regeling voor een volgend jaar voor zover:


      a. de uit te betalen termijnen van de voorschotten op elkaar aansluiten, en


      b. de schuld waarvoor beslag is gelegd niet geheel is voldaan.
    url: https://wetten.overheid.nl/BWBR0018472/2025-01-01#Artikel22
    machine_readable:
      # Een regel per maand (ontwerpnotitie par. 4, besloten 6 oktober 2026):
      # het artikel zegt voor een maand of daarin een termijn van het voorschot
      # valt, uit de dagtekening van de beschikking die het voorschot verleent.
      # Een termijn die nog moet komen is geen feit; wie wil weten of er in een
      # maand een termijn valt, vraagt het hier op. Over de hoogte van een
      # termijn zegt het artikel niets; die staat in het uitvoeringsbeleid.
      #
      # Een maand telt hier als het aantal maanden na januari van het
      # berekeningsjaar: december ervoor is -1, november 10.
      # Lid 3 (aanspraak voor een deel van het berekeningsjaar) is niet
      # gemodelleerd: dit artikel gaat uit van een aanspraak over het hele
      # berekeningsjaar, die dus in januari ontstaat (lid 4). De overige leden
      # regelen uitzonderingen en beslag en zijn niet gemodelleerd.
      execution:
        parameters:
          - name: dagtekening_voorschot
            type: date
            required: true
            description: De dagtekening van de beschikking die het voorschot verleent.
          - name: berekeningsjaar
            type: number
            required: true
            description: Het berekeningsjaar waarop het voorschot betrekking heeft.
          - name: maand
            type: date
            required: true
            description: Een dag in de maand waarnaar gevraagd wordt.
        output:
          - name: maand_dagtekening
            type: number
            description: De maand van dagtekening, geteld vanaf januari van het berekeningsjaar.
          - name: gevraagde_maand
            type: number
            description: De gevraagde maand, geteld vanaf januari van het berekeningsjaar.
          - name: maand_eerste_termijn
            type: number
          - name: maand_laatste_termijn
            type: number
          - name: aantal_termijnen
            type: number
          - name: maanden_ineens
            type: number
            description: >-
              Over hoeveel maanden het voorschot in één bedrag wordt uitbetaald
              in de maand van dagtekening (lid 4 en 5).
          - name: termijn_in_maand
            type: boolean
          - name: eerste_termijn
            type: boolean
          - name: laatste_termijn
            type: boolean
        actions:
          - output: maand_dagtekening
            value:
              operation: DATE_DIFF
              from:
                operation: DATE
                year: $berekeningsjaar
                month: 1
                day: 1
              to:
                operation: START_OF
                date: $dagtekening_voorschot
                in: month
              in: months
          - output: gevraagde_maand
            value:
              operation: DATE_DIFF
              from:
                operation: DATE
                year: $berekeningsjaar
                month: 1
                day: 1
              to:
                operation: START_OF
                date: $maand
                in: month
              in: months
          # Lid 1: een voorschot dat vóór de aanvang van het berekeningsjaar
          # wordt verleend, gaat in 12 termijnen vanaf december daarvoor.
          # Lid 2 en 5: anders is de eerste termijn in de maand van dagtekening.
          - output: maand_eerste_termijn
            value:
              operation: IF
              cases:
                - when:
                    operation: LESS_THAN
                    subject: $maand_dagtekening
                    value: 0
                  then: -1
              default: $maand_dagtekening
          # Lid 1 en 2: de laatste termijn valt in november (12 termijnen vanaf
          # december; "zoveel termijnen als er na de maand van dagtekening nog
          # kalendermaanden van dat jaar overblijven", de eerste in de maand van
          # dagtekening). Lid 5: na 31 oktober één bedrag in de maand van
          # dagtekening, hier één termijn.
          - output: maand_laatste_termijn
            value:
              operation: IF
              cases:
                - when:
                    operation: GREATER_THAN
                    subject: $maand_dagtekening
                    value: 9
                  then: $maand_dagtekening
              default: 10
          - output: aantal_termijnen
            value:
              operation: ADD
              values:
                - operation: SUBTRACT
                  values:
                    - $maand_laatste_termijn
                    - $maand_eerste_termijn
                - 1
          # Lid 4: is de dagtekening na januari, dan gaat het deel over de
          # verstreken maanden, met de maand van dagtekening, in één bedrag.
          # Lid 5: na 31 oktober het hele voorschot.
          - output: maanden_ineens
            value:
              operation: IF
              cases:
                - when:
                    operation: GREATER_THAN
                    subject: $maand_dagtekening
                    value: 9
                  then: 12
                - when:
                    operation: GREATER_THAN
                    subject: $maand_dagtekening
                    value: 0
                  then:
                    operation: ADD
                    values:
                      - $maand_dagtekening
                      - 1
              default: 0
          - output: termijn_in_maand
            value:
              operation: AND
              conditions:
                - operation: GREATER_THAN_OR_EQUAL
                  subject: $gevraagde_maand
                  value: $maand_eerste_termijn
                - operation: LESS_THAN_OR_EQUAL
                  subject: $gevraagde_maand
                  value: $maand_laatste_termijn
          - output: eerste_termijn
            value:
              operation: EQUALS
              subject: $gevraagde_maand
              value: $maand_eerste_termijn
          - output: laatste_termijn
            value:
              operation: EQUALS
              subject: $gevraagde_maand
              value: $maand_laatste_termijn
