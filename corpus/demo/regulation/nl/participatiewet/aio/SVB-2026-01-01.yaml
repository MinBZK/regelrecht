$id: participatiewet/aio
regulatory_layer: WET
publication_date: '2026-01-01'
valid_from: '2026-01-01'
name: AIO-aanvulling
bwb_id: BWBR0015703
url: https://wetten.overheid.nl/BWBR0015703/2026-01-01
service: SVB
uuid: 4d6e8f0a-3c5b-4e7f-a8b9-1c2d3e4f5a6b
articles:
  - number: 47a
    text: >-
      1 De Sociale verzekeringsbank heeft tot taak het verlenen van algemene bijstand in de vorm
      van een aanvullende inkomensvoorziening ouderen aan:
        a. alleenstaanden en alleenstaande ouders die de pensioengerechtigde leeftijd hebben
      bereikt;
        b. gehuwden, van wie beide echtgenoten de pensioengerechtigde leeftijd hebben bereikt
      dan wel van wie één echtgenoot de pensioengerechtigde leeftijd heeft bereikt; hier te
      lande die in zodanige omstandigheden verkeren of dreigen te geraken dat zij niet over de
      middelen beschikken om in de noodzakelijke kosten van het bestaan te voorzien.

      2 De artikelen 1 tot en met 6, hoofdstuk 2, met uitzondering van artikel 18, hoofdstuk 3,
      de paragrafen 5.1 en 5.2, hoofdstuk 6 en de artikelen 79, 80 en 81 zijn van toepassing op
      de uitvoering van de taak, bedoeld in het eerste lid, door de Sociale verzekeringsbank,
      tenzij in deze paragraaf anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0015703/2026-01-01#Artikel47a
    machine_readable:
      # Art. 33 lid 5 Participatiewet kent een inkomensvrijlating (een vast bedrag
      # per maand op het inkomen van een AOW- of Anw-gerechtigde) die hier niet is
      # gemodelleerd: de tekst van art. 33 staat niet in dit bestand en niet in
      # corpus/regulation, dus de bedragen zijn niet uit een wettekst in de corpus af
      # te leiden (RFC-012).
      untranslatables:
        - construct: inkomensvrijlating art. 33 lid 5 op het inkomen van een AOW- of
            Anw-gerechtigde bij de AIO-berekening
          reason: >-
            De tekst van art. 33 Participatiewet staat niet in dit bestand en niet in
            corpus/regulation, dus de hoogte van de vrijlating volgt niet uit een
            wettekst in de corpus.
          suggestion: >-
            Art. 33 lid 5 als tekst opnemen (in dit bestand of in corpus/regulation)
            zodra beschikbaar, en de vrijlating aftrekken van totaal_inkomen.
          accepted: true
      # Art. 22 lid 1 onderdeel a en b Participatiewet (niet in dit bestand, wel in
      # corpus/regulation/nl/wet/participatiewet/2022-03-15.yaml): de norm voor
      # AIO-gerechtigden (pensioengerechtigde leeftijd bereikt) staat in art. 22,
      # niet in art. 21 (dat regelt de norm van 21 jaar tot de pensioengerechtigde
      # leeftijd). De bedragen hieronder zijn de per 2022-03-15 geldende bedragen uit
      # die tekst (€ 1.213,06 resp. € 1.642,54 per kalendermaand); de op 2026-01-01
      # geldende bedragen (audit noemt 156469/214416) staan nergens in de corpus als
      # wettekst, dus die worden hier niet overgenomen.
      definitions:
        norm_alleenstaand: 121306
        norm_gehuwden: 164254
        vermogensgrens_alleenstaand: 800000
        vermogensgrens_gehuwden: 1600000
        maanden_per_jaar: 12
      execution:
        produces:
          legal_character: BESCHIKKING
          decision_type: TOEKENNING
        parameters:
          - name: bsn
            type: string
            required: true
        input:
          - name: leeftijd
            type: number
            type_spec:
              unit: years
              precision: 0
              min: 0
            source:
              regulation: wet_brp
              output: leeftijd
              parameters:
                bsn: $bsn
                referentiedatum: $referencedate
            temporal:
              type: point_in_time
          - name: geboortedatum
            type: date
            source:
              regulation: wet_brp
              output: geboortedatum
              parameters:
                bsn: $bsn
                referentiedatum: $referencedate
            temporal:
              type: point_in_time
          - name: pensioenleeftijd
            type: number
            type_spec:
              unit: years
              precision: 2
              min: 65
            source:
              regulation: algemene_ouderdomswet/leeftijdsbepaling
              output: pensioenleeftijd
              parameters:
                geboortedatum: $geboortedatum
                bsn: $bsn
            temporal:
              type: point_in_time
          - name: heeft_partner
            type: boolean
            source:
              regulation: wet_brp
              output: heeft_partner
              parameters:
                bsn: $bsn
                referentiedatum: $referencedate
            temporal:
              type: point_in_time
          - name: inkomen
            type: amount
            type_spec:
              unit: eurocent
              precision: 0
              min: 0
            source:
              regulation: wet_inkomstenbelasting
              output: inkomen
              parameters:
                bsn: $bsn
            temporal:
              type: period
              period_type: year
          - name: vermogen
            type: amount
            type_spec:
              unit: eurocent
              precision: 0
              min: 0
            source:
              regulation: wet_inkomstenbelasting
              output: vermogen
              parameters:
                bsn: $bsn
            temporal:
              type: point_in_time
          - name: aow_uitkering
            type: amount
            type_spec:
              unit: eurocent
              precision: 0
              min: 0
            source:
              regulation: algemene_ouderdomswet
              output: pensioenbedrag
              parameters:
                bsn: $bsn
            temporal:
              type: period
              period_type: month
        output:
          - name: voldoet_aan_voorwaarden
            type: boolean
          - name: is_gerechtigd
            type: boolean
          - name: sociaal_minimum
            type: amount
            type_spec:
              unit: eurocent
              precision: 0
              min: 0
          - name: totaal_inkomen
            type: amount
            type_spec:
              unit: eurocent
              precision: 0
              min: 0
          - name: aio_aanvulling
            type: amount
            type_spec:
              unit: eurocent
              precision: 0
              min: 0
        actions:
          - output: voldoet_aan_voorwaarden
            value:
              operation: AND
              conditions:
                - subject: $leeftijd
                  operation: GREATER_THAN_OR_EQUAL
                  value: $pensioenleeftijd
                - operation: OR
                  conditions:
                    - operation: AND
                      conditions:
                        - subject: $heeft_partner
                          operation: EQUALS
                          value: false
                        - subject: $vermogen
                          operation: LESS_THAN
                          value: $vermogensgrens_alleenstaand
                    - operation: AND
                      conditions:
                        - subject: $heeft_partner
                          operation: EQUALS
                          value: true
                        - subject: $vermogen
                          operation: LESS_THAN
                          value: $vermogensgrens_gehuwden
          - output: is_gerechtigd
            value: true
            legal_basis:
              law: Participatiewet
              bwb_id: BWBR0015703
              article: 47a
              url: >-
                https://wetten.overheid.nl/BWBR0015703/2024-01-01#Hoofdstuk5_Paragraaf5.4_Artikel47a
              juriconnect: jci1.3:c:BWBR0015703&artikel=47a&z=2024-01-01&g=2024-01-01
              explanation: 'Artikel 47a: toekenning AIO-aanvulling'
          - output: sociaal_minimum
            value:
              operation: IF
              cases:
                - when:
                    operation: EQUALS
                    subject: $heeft_partner
                    value: true
                  then: $norm_gehuwden
              default: $norm_alleenstaand
            # Art. 22, niet art. 21: AIO-gerechtigden hebben de pensioengerechtigde
            # leeftijd bereikt (voorwaarde art. 47a lid 1), en art. 21 regelt juist de
            # norm van 21 jaar tot de pensioengerechtigde leeftijd. Art. 22 regelt de
            # norm voor pensioengerechtigden. Ankers verwijzen naar de vindplaats van
            # art. 22 in corpus/regulation (2022-03-15; hoofdstuk 3, paragraaf 3.2).
            legal_basis:
              law: Participatiewet
              bwb_id: BWBR0015703
              article: '22'
              url: >-
                https://wetten.overheid.nl/BWBR0015703/2022-03-15#Hoofdstuk3_Paragraaf3.2_Artikel22
              juriconnect: jci1.3:c:BWBR0015703&artikel=22&z=2022-03-15&g=2022-03-15
              explanation: 'Artikel 22: normen voor pensioengerechtigden'
          - output: totaal_inkomen
            # Art. 32/33: totaal_inkomen was algebraïsch gelijk aan inkomen/12, want de
            # AOW-term werd opgeteld en in dezelfde som weer afgetrokken. Bedoeld is het
            # in aanmerking te nemen inkomen als AOW-uitkering plus het overige
            # maandinkomen (art. 32 lid 1: "de op grond van deze wet, de Ziektewet en
            # de Werkloosheidswet toegekende uitkeringen" resp. overig inkomen, samen
            # het inkomen waarmee de bijstandsnorm wordt verminderd). De vrijlating van
            # art. 33 lid 5 (een vast bedrag per maand op het inkomen van een AOW- of
            # Anw-gerechtigde) staat niet als tekst in dit bestand of in corpus/regulation;
            # de bedragen (€ 26,50 / € 53,00) komen uit de audit, niet uit een wettekst
            # in de corpus, dus die worden hier niet verzonnen. Zie untranslatables
            # hieronder.
            value:
              operation: ADD
              values:
                - $aow_uitkering
                - operation: DIVIDE
                  values:
                    - $inkomen
                    - $maanden_per_jaar
            legal_basis:
              law: Participatiewet
              bwb_id: BWBR0015703
              article: '32'
              url: >-
                https://wetten.overheid.nl/BWBR0015703/2024-01-01#Hoofdstuk3_Paragraaf3.4_Artikel32
              juriconnect: jci1.3:c:BWBR0015703&artikel=32&z=2024-01-01&g=2024-01-01
              explanation: 'Artikel 32: totaal inkomen (AOW-uitkering plus overig maandinkomen) voor AIO-berekening'
          - output: aio_aanvulling
            value:
              operation: MAX
              values:
                - operation: SUBTRACT
                  values:
                    - $sociaal_minimum
                    - $totaal_inkomen
                - 0
            legal_basis:
              law: Participatiewet
              bwb_id: BWBR0015703
              article: 47a
              url: >-
                https://wetten.overheid.nl/BWBR0015703/2024-01-01#Hoofdstuk5_Paragraaf5.4_Artikel47a
              juriconnect: jci1.3:c:BWBR0015703&artikel=47a&z=2024-01-01&g=2024-01-01
              explanation: >-
                Artikel 47a: berekening AIO als verschil tussen norm en inkomen
