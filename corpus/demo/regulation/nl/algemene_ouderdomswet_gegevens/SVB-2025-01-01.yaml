articles:
  - number: 7a
    text: >-
      1 De pensioengerechtigde leeftijd en de aanvangsleeftijd zijn:
        a. vóór 1 januari 2013: 65, respectievelijk 15 jaar;
        b. in 2013: 65 jaar en één maand, respectievelijk 15 jaar en één maand;
        c. in 2014: 65 jaar en twee maanden, respectievelijk 15 jaar en twee maanden;
        d. in 2015: 65 jaar en drie maanden, respectievelijk 15 jaar en drie maanden;
        e. in 2016: 65 jaar en zes maanden, respectievelijk 15 jaar en zes maanden;
        f. in 2017: 65 jaar en negen maanden, respectievelijk 15 jaar en negen maanden;
        g. in 2018: 66 jaar, respectievelijk 16 jaar;
        h. in 2019: 66 jaar en vier maanden, respectievelijk 16 jaar en vier maanden;
        i. in 2020: 66 jaar en vier maanden, respectievelijk 16 jaar en vier maanden;
        j. in 2021: 66 jaar en vier maanden, respectievelijk 16 jaar en vier maanden;
        k. in 2022: 66 jaar en zeven maanden, respectievelijk 16 jaar en zeven maanden;
        l. in 2023: 66 jaar en tien maanden, respectievelijk 16 jaar en tien maanden;
        m. in 2024: 67 jaar, respectievelijk 17 jaar;
        n. in 2025 en de kalenderjaren daarna: de pensioengerechtigde leeftijd en de
      aanvangsleeftijd,
      die jaarlijks op basis van de verhoging van de pensioengerechtigde leeftijd en de
      aanvangsleeftijd op grond van het tweede lid worden vastgesteld. Op pensioengerechtigden
      die in een bepaald kalenderjaar de pensioengerechtigde leeftijd hebben bereikt zijn de
      pensioengerechtigde leeftijd en de aanvangsleeftijd in de kalenderjaren daarna niet van
      toepassing.

      2 De verhoging van de pensioengerechtigde leeftijd en de aanvangsleeftijd in 2025 en de
      kalenderjaren daarna wordt jaarlijks, voor de eerste maal uiterlijk op 1 januari 2020 voor
      het jaar 2025, vastgesteld volgens de volgende formule:

      V = (L – 18,26) – (P – 65)

      waarbij:

      V staat voor de periode waarmee de pensioengerechtigde leeftijd respectievelijk
      aanvangsleeftijd wordt verhoogd, uitgedrukt in perioden van een jaar;

      L staat voor de geraamde macro gemiddelde resterende levensverwachting op 65-jarige
      leeftijd in het kalenderjaar van verhoging;

      P staat voor de pensioengerechtigde leeftijd in het kalenderjaar voorafgaande aan het
      kalenderjaar van verhoging.

      Indien V negatief is of minder dan 0,25 bedraagt, wordt deze gesteld op 0. Indien V 0,25
      of meer bedraagt, wordt deze gesteld op drie maanden.

      De volgens de formule vastgestelde verdere verhoging van de pensioengerechtigde leeftijd
      en de aanvangsleeftijd wordt door of namens Onze Minister medegedeeld in de Staatscourant.

      3 De verhoging, bedoeld in het tweede lid, treedt telkens in werking vijf jaar na de
      uiterste datum van vaststelling, bedoeld in het tweede lid, voor de eerste maal met ingang
      van 1 januari 2025.

      4 De ramingen van de macro gemiddelde resterende levensverwachting, bedoeld in het tweede
      lid, worden uitgevoerd en bekendgemaakt door het CBS.
    url: https://wetten.overheid.nl/BWBR0002221/2020-01-01#Artikel7a
    machine_readable:
      # Lid 1 onder a t/m m: de tabel geeft de pensioengerechtigde leeftijd per kalenderjaar
      # tot en met 2024 met een vast, in de tekst genoemd getal. Vanaf lid 1 onder n (2025
      # en later) verwijst de tekst zelf naar de formule van het tweede lid, niet naar een
      # getal: die tak is daarom als untranslatable gemarkeerd (zie onder) en leest de
      # geregistreerde pensioenleeftijd, in lijn met de audit (AUDIT_GETROUWHEID.md).
      untranslatables:
        - construct: >-
            formule van lid 2 (V = (L - 18,26) - (P - 65)) voor het kalenderjaar van
            verhoging vanaf 2025
          reason: >-
            P is de pensioengerechtigde leeftijd in het voorafgaande kalenderjaar, dus de
            uitkomst van diezelfde formule een jaar eerder. De tekst geeft geen getal voor
            P in enig jaar vanaf 2025 (in tegenstelling tot de tabel in lid 1 onder a t/m m,
            die tot en met 2024 wel vaste getallen geeft); zonder een jaarreeks van eerder
            vastgestelde P-waarden (het "landelijk vastgesteld gegeven" waarnaar Onze
            Minister via de Staatscourant verwijst, lid 2 slot) kan de cascade voor 2025 en
            later niet uit deze tekst worden afgeleid. Zie ook de leeftijdsbepaling-wet
            (algemene_ouderdomswet/leeftijdsbepaling/SVB-2024-01-01.yaml), die dezelfde
            formule voor 2026+ modelleert met een reeks vaste jaarwaarden
            (`verhoging_2013`..`verhoging_2025`) die evenmin uit déze wettekst blijken.
          suggestion: >-
            Voeg een jaargebonden gegeven `pensioengerechtigde_leeftijd_kalenderjaar` toe
            (bv. als source: {} tabel per jaar) zodat P voor elk jaar vanaf 2025 uit een
            vastgestelde reeks kan worden gelezen in plaats van uit het register.
          legal_text_excerpt: >-
            n. in 2025 en de kalenderjaren daarna: de pensioengerechtigde leeftijd en de
            aanvangsleeftijd, die jaarlijks op basis van de verhoging van de
            pensioengerechtigde leeftijd en de aanvangsleeftijd op grond van het tweede lid
            worden vastgesteld.
          accepted: true
      definitions:
        # Lid 1 onder a t/m m: vaste, in de tekst genoemde pensioengerechtigde leeftijd
        # per kalenderjaar (afgerond op hele jaren; de maanden in de tekst tellen niet mee
        # voor deze wet, die alleen de pensioenleeftijd in jaren uitgeeft).
        pensioenleeftijd_voor_2013: 65
        pensioenleeftijd_2013: 65
        pensioenleeftijd_2014: 65
        pensioenleeftijd_2015: 65
        pensioenleeftijd_2016: 65
        pensioenleeftijd_2017: 65
        pensioenleeftijd_2018: 66
        pensioenleeftijd_2019: 66
        pensioenleeftijd_2020: 66
        pensioenleeftijd_2021: 66
        pensioenleeftijd_2022: 66
        pensioenleeftijd_2023: 66
        pensioenleeftijd_2024: 67
      execution:
        produces:
          legal_character: INFORMATIEF
          decision_type: GEEN_BESLUIT
        parameters:
          - name: bsn
            type: string
            required: true
        input:
          # Register-uitkomst voor 2025 en later (lid 1 onder n): zie untranslatables
          # hierboven. Voor jaren tot en met 2024 wordt deze niet gebruikt; de tabel in
          # lid 1 geeft dan zelf het getal.
          - name: pensioengegevens
            type: object
            source: {}
        output:
          - name: pensioenleeftijd
            type: number
            type_spec:
              unit: years
              precision: 0
              # Geen min/max: de wettekst stelt geen ondergrens of bovengrens aan de
              # pensioengerechtigde leeftijd (audit: "geen wettelijke grens"). De vorige
              # min: 65 / max: 70 was een ongefundeerde redelijkheidscontrole en is
              # verwijderd in plaats van gedocumenteerd, omdat lid 1 onder n zelf al laat
              # zien dat de leeftijd boven 70 kan uitkomen (jaarlijkse verhoging zonder
              # wettelijk plafond).
        actions:
          - output: pensioenleeftijd
            value:
              operation: IF
              cases:
                - when:
                    operation: LESS_THAN
                    subject: $referencedate.year
                    value: 2013
                  then: $pensioenleeftijd_voor_2013
                - when:
                    operation: EQUALS
                    subject: $referencedate.year
                    value: 2013
                  then: $pensioenleeftijd_2013
                - when:
                    operation: EQUALS
                    subject: $referencedate.year
                    value: 2014
                  then: $pensioenleeftijd_2014
                - when:
                    operation: EQUALS
                    subject: $referencedate.year
                    value: 2015
                  then: $pensioenleeftijd_2015
                - when:
                    operation: EQUALS
                    subject: $referencedate.year
                    value: 2016
                  then: $pensioenleeftijd_2016
                - when:
                    operation: EQUALS
                    subject: $referencedate.year
                    value: 2017
                  then: $pensioenleeftijd_2017
                - when:
                    operation: EQUALS
                    subject: $referencedate.year
                    value: 2018
                  then: $pensioenleeftijd_2018
                - when:
                    operation: EQUALS
                    subject: $referencedate.year
                    value: 2019
                  then: $pensioenleeftijd_2019
                - when:
                    operation: EQUALS
                    subject: $referencedate.year
                    value: 2020
                  then: $pensioenleeftijd_2020
                - when:
                    operation: EQUALS
                    subject: $referencedate.year
                    value: 2021
                  then: $pensioenleeftijd_2021
                - when:
                    operation: EQUALS
                    subject: $referencedate.year
                    value: 2022
                  then: $pensioenleeftijd_2022
                - when:
                    operation: EQUALS
                    subject: $referencedate.year
                    value: 2023
                  then: $pensioenleeftijd_2023
                - when:
                    operation: EQUALS
                    subject: $referencedate.year
                    value: 2024
                  then: $pensioenleeftijd_2024
              # Lid 1 onder n (2025 en later): geen getal in de tekst, zie untranslatables.
              # De geregistreerde pensioenleeftijd is de enige beschikbare bron voor deze tak.
              default: $pensioengegevens.pensioenleeftijd
