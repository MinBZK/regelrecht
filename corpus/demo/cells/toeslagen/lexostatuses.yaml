---
# Wat de cel uit haar eigen kroniek terugleest. De reductie hoort bij de bron:
# de wet vraagt een gegeven (het burgerservicenummer, de dag van ontvangst);
# dat Toeslagen het in een kroniek bewaart, is haar zaak.
#
# Het voorschot, de schatting van het inkomen, de achterstand, het
# ontvangen inkomensgegeven, de toekenning, de nabetaling, de terugvordering
# en de incasso leest de cel al terug met artikelen in het beleid van
# Toeslagen (fictief_beleid_kroniek_toeslagen art. 1 tot en met 8,
# `registers:` in cell.yaml), in dezelfde regeltaal als de wet. De aanvraag
# en wat er is uitbetaald volgen later; tot dan staan ze hier.
cell: toeslagen
lexostatus_definitions:
  # De aanvraag, zoals Toeslagen haar ontving. `root` is het id van het gram
  # van de aanvraag.
  - name: aanvraag
    inputs: [root]
    reduction:
      chronicle: toeslagen
      filter: {type: submission, subtype: aanvraag, root: $root}
      pick: latest
      derivations:
        bsn:
          field: bsn
          legal_basis: [algemene_wet_inkomensafhankelijke_regelingen#13]
        aangevraagd_berekeningsjaar:
          field: aangevraagd_berekeningsjaar
          legal_basis: [algemene_wet_inkomensafhankelijke_regelingen#15 lid 1]
        # Awb 4:13 lid 1: de aanvraag telt vanaf de ontvangst.
        datum_ontvangst:
          moment: effective_at
          legal_basis: [algemene_wet_bestuursrecht#4:13 lid 1]
  # Wat er op het voorschot van de aanvraag `root` voor het berekeningsjaar
  # `berekeningsjaar` is uitbetaald: de som van wat de bank bijschreef, zoals
  # de kroniek die kent op het moment van lezen. Art. 24 lid 2 verrekent de
  # uitbetaalde voorschotten, niet de verleende: een betaalopdracht die de
  # bank niet bijschreef, telt niet. Geen termijn is nul. Per berekeningsjaar:
  # de aanvraag geldt ook voor de jaren erna (Awir 15 lid 5), en de
  # toekenning over een jaar verrekent alleen het voorschot van dat jaar.
  - name: uitbetaald
    inputs: [root, berekeningsjaar]
    reduction:
      chronicle: toeslagen
      filter:
        type: executogram
        event: voorschottermijn_betaald
        root: $root
        period: $berekeningsjaar
      pick: all
      derivations:
        uitbetaalde_voorschotten:
          sum: betaald_bedrag
          legal_basis: [algemene_wet_inkomensafhankelijke_regelingen#24 lid 2]
