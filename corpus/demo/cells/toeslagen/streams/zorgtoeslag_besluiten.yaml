---
# De besluiten op de aanvraag om zorgtoeslag: het voorschot (Awir 16) en de
# toekenning (Awir 14 lid 1, 19), elk een decretogram met de uitkomsten van
# Zorgtoeslagwet art. 2 en de haken in zijn fase van de procedure van de Awir.
# Dat art. 2 in twee fasen besluit, zegt de procedure van de Awir (`is:
# BESLUIT`); welk van de twee besluiten dit event vastlegt, zegt `stage`.
# De parameters leest de cel uit
# haar eigen kroniek. Wat het besluit vraagt en de aanvraag bevat, leest zij
# uit de aanvraag waarop het besluit wordt genomen (de lexostatus `aanvraag`,
# zoals de wet haar beschrijft: Awir 15 met de haken erop); de rest met het
# beleid van Toeslagen over haar kroniek: bij het voorschot de schatting van
# het inkomen (art. 4), bij de toekenning wat er op het voorschot is
# uitbetaald (art. 3a, Awir 24 lid 2).
#
# Een aanvraag geldt ook voor de berekeningsjaren erna (Awir 15 lid 5): elk
# besluit betreft één berekeningsjaar (`period`), het eerste het aangevraagde,
# het volgende van dezelfde gebeurtenis het jaar erna. Dat jaar geeft de cel;
# zij leest de zaak voor dat jaar. Het voorschot voor een volgend jaar neemt
# Toeslagen op de dag die haar (fictieve) beleid geeft (`decided_on`).
$id: zorgtoeslag_besluiten
recording_actor: belastingdienst_toeslagen
chronicle: toeslagen
events:
  - name: voorschot_verleend
    stage: VOORSCHOT
    establishes: zorgtoeslagwet#2
    reads:
      - {regulation: fictief_beleid_kroniek_toeslagen, article: '4'}
    decided_on: fictief_beleid_termijnbedrag_voorschot#4
  # De toekenning rekent op het inkomensgegeven dat de inspecteur verstrekte
  # (het beleid van Toeslagen, art. 5 van het teruglezen en art. 2 van de
  # toekenning) en neemt Toeslagen op de dag van de aanslag, zodra dat
  # inkomensgegeven er is (`decided_on`).
  - name: zorgtoeslag_toegekend
    stage: TOEKENNING
    establishes: zorgtoeslagwet#2
    reads:
      - {regulation: fictief_beleid_kroniek_toeslagen, article: 3a}
      - {regulation: fictief_beleid_kroniek_toeslagen, article: '5'}
    decided_on: fictief_beleid_toekenning_toeslagen#3
  # De beschikking tot terugvordering (Awir 26): een eigen besluit op dezelfde
  # aanvraag, in een eigen procedure, voor het jaar van een toekenning die iets
  # terug te vorderen laat (na Awir 26a). Wat er terug te vorderen is, leest de
  # cel uit die toekenning (art. 6 van het teruglezen); de dag geeft het
  # beleid van Toeslagen (`decided_on`): de dag van de toekenning.
  - name: terugvordering_vastgesteld
    establishes: algemene_wet_inkomensafhankelijke_regelingen#26
    reads:
      - {regulation: fictief_beleid_kroniek_toeslagen, article: '6'}
    decided_on: fictief_beleid_toekenning_toeslagen#6
