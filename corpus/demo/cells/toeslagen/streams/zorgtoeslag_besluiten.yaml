---
# De besluiten op de aanvraag om zorgtoeslag: het voorschot (Awir 16) en de
# toekenning (Awir 14 lid 1, 19), elk een decretogram met de uitkomsten van
# Zorgtoeslagwet art. 2 en de haken in zijn fase van de procedure van de Awir.
# Dat art. 2 in twee fasen besluit, zegt de procedure van de Awir (`is:
# BESLUIT`); welk van de twee besluiten dit event vastlegt, zegt `stage`.
# De parameters leest de cel uit
# haar eigen kroniek: de lexostatus `aanvraag`, bij het voorschot de schatting
# van het inkomen (het beleid van Toeslagen, art. 4), en bij de toekenning ook
# `uitbetaald`, wat er op het voorschot is betaald (Awir 24 lid 2).
#
# Een aanvraag geldt ook voor de berekeningsjaren erna (Awir 15 lid 5): elk
# besluit betreft één berekeningsjaar (`period`), het eerste het aangevraagde,
# het volgende van dezelfde gebeurtenis het jaar erna. Dat jaar geeft de cel;
# zij leest de zaak voor dat jaar. Het voorschot voor een volgend jaar neemt
# Toeslagen op de dag die haar (fictieve) beleid geeft (`decided_on`).
$id: zorgtoeslag_besluiten
recording_actor: belastingdienst_toeslagen
chronicle: toeslagen
events:
  - name: voorschot_verleend
    stage: VOORSCHOT
    establishes: zorgtoeslagwet#2
    reads:
      - aanvraag
      - {regulation: fictief_beleid_kroniek_toeslagen, article: '4'}
    decided_on: fictief_beleid_termijnbedrag_voorschot#4
  - name: zorgtoeslag_toegekend
    stage: TOEKENNING
    establishes: zorgtoeslagwet#2
    reads: [aanvraag, uitbetaald]
