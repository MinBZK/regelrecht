              in artikel 3, punt 9. De Nederlandse tekst gebruikt twee woorden voor één begrip:
              "overbrengingssysteem" hier, in bijlage I, deel A, in bijlage II, punt 1, en in
              bijlage III, punt 3.4.7, en "overbrengingsinrichting" in de definitie. De Engelse tekst gebruikt op al
              die plaatsen "removable mechanical transmission device", en bijlage III, punt
              3.4.7, herhaalt onder het woord "systemen" de elementen van punt 9. Alle taalversies
              zijn gelijkelijk authentiek, dus de definitie geldt ook voor onderdeel e.
            source:
              output: is_verwijderbare_mechanische_overbrengingsinrichting
          - name: is_niet_voltooide_machine
            type: boolean
            description: Tweede alinea, zoals gedefinieerd in artikel 3, punt 10.
            source:
              output: is_niet_voltooide_machine
        output:
          - name: is_verwant_product
            type: boolean
            description: >-
              Het product is een van de verwante producten die de eerste alinea in de onderdelen
              a tot en met e opsomt.
          - name: is_machine_of_verwant_product
            type: boolean
            description: >-
              Eerste alinea: de verordening is van toepassing op het product als machine of
