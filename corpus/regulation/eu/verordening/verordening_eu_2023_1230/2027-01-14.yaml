                c: eenheidskeuring (module G).
  - number: '25.3'
    text: >-
      Als de machine of het verwante product in bijlage I, deel B, is opgenomen, passen fabrikanten
      of de in artikel 18 bedoelde natuurlijke personen of rechtspersonen een van de volgende
      procedures toe: a) interne productiecontrole (module A) als vastgesteld in bijlage VI;
      b) EU-typeonderzoek (module B) als vastgesteld in bijlage VII, gevolgd door conformiteit
      met het type op basis van interne productiecontrole (module C) als vastgesteld in bijlage
      VIII; c) conformiteit op basis van volledige kwaliteitsborging (module H) als vastgesteld
      in bijlage IX; d) conformiteit op basis van eenheidskeuring (module G) als vastgesteld
      in bijlage X. Indien fabrikanten de in punt a) bedoelde procedure voor interne productiecontrole
      toepassen, ontwerpen en bouwen zij de machine of het verwante product overeenkomstig
      de voor die categorie machines of verwante producten specifieke geharmoniseerde normen
      of gemeenschappelijke specificaties die alle relevante essentiële gezondheids- en veiligheidseisen
      bestrijken. Wanneer de categorie machines of verwante producten in bijlage I, deel B,
      is opgenomen en de machine of het verwante product niet werd vervaardigd overeenkomstig
      de geharmoniseerde normen of gemeenschappelijke specificaties die alle relevante essentiële
      gezondheids- en veiligheidseisen voor die categorie machines of verwante producten bestrijken,
      passen de fabrikanten, waaronder de in artikel 18 bedoelde natuurlijke personen of rechtspersonen,
      een van de in punt b), c) of d), van dit lid bedoelde procedures toe.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_25
    machine_readable:
      execution:
        parameters:
          - name: categorie_bijlage_i
            type: string
            required: true
            description: >-
              Het punt van bijlage I waaronder de categorie valt, of "geen"; zie de beschrijving
              bij bijlage I.
          - name: vervaardigd_volgens_normen_die_alle_eisen_bestrijken
            type: boolean
            required: true
            description: >-
              De machine of het verwante product is vervaardigd overeenkomstig de geharmoniseerde
              normen of gemeenschappelijke specificaties die alle relevante essentiële gezondheids-
              en veiligheidseisen voor die categorie bestrijken.
        input:
          - name: in_bijlage_i_deel_b
            type: boolean
            source:
              output: in_bijlage_i_deel_b
              parameters:
                categorie_bijlage_i: $categorie_bijlage_i
        output:
          - name: lid_3_van_toepassing
            type: boolean
          - name: procedures_lid_3
            type: array
        actions:
          - output: lid_3_van_toepassing
            value: $in_bijlage_i_deel_b
            legal_basis:
              law: Verordening (EU) 2023/1230
              article: '25'
              paragraph: '3'
              explanation: '"Als de machine of het verwante product in bijlage I, deel B,
                is opgenomen".'
          - output: procedures_lid_3
            value:
              operation: IF
              cases:
                - when: $vervaardigd_volgens_normen_die_alle_eisen_bestrijken
                  then:
                    operation: LIST
                    items:
                      - A
                      - B+C
                      - H
                      - G
              default:
                operation: LIST
                items:
                  - B+C
                  - H
                  - G
            legal_basis:
              law: Verordening (EU) 2023/1230
              article: '25'
              paragraph: '3'
              explanation: >-
                De eerste alinea noemt de procedures a) tot en met d). De tweede alinea bindt
                interne productiecontrole (punt a) aan ontwerp en bouw overeenkomstig de normen
                of specificaties die alle relevante eisen bestrijken; de derde alinea zegt
                dat een product dat daar niet overeenkomstig is vervaardigd een van de procedures
                uit punt b), c) of d) volgt.
  - number: '25.4'
    text: >-
      Als de categorie machines of verwante producten niet in bijlage I opgenomen is, passen
      fabrikanten, waaronder de in artikel 18 bedoelde natuurlijke personen of rechtspersonen,
      de in bijlage VI vastgestelde procedure voor interne productiecontrole (module A) toe.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_25
