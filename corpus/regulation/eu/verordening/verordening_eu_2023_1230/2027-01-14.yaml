  - number: bijlage II
    text: >-
      INDICATIEVE LIJST VAN VEILIGHEIDSCOMPONENTEN 1. Afschermingen voor verwijderbare mechanische
      overbrengingssystemen. 2. Beveiligingsinrichtingen voor de detectie van personen. 3.
      Aangedreven beweegbare afschermingen met vergrendeling die bestemd zijn om te worden
      gebruikt voor de beveiliging van de in de punten 9, 10 en 11 van deel B van bijlage
      I bedoelde machines. 4. Logische eenheden ter verzekering van veiligheidsfuncties. 5.
      Kleppen met extra voorzieningen voor storingsdetectie voor de beheersing van gevaarlijke
      bewegingen of machines. 6. Systemen voor de afvoer van emissies van machines. 7. Afschermingen
      en beveiligingsinrichtingen om personen te beschermen tegen bewegende delen van de machine
      die voor de bewerking dienen. 8. Bewakingsvoorzieningen voor belastingsbegrenzing en
      beheersing van de bewegingen bij hijs- of hefmachines. 9. Veiligheidsmiddelen om personen
      op hun zitplaatsen te houden. 10. Noodstopvoorzieningen. 11. Ontladingssystemen om accumulatie
      van potentieel gevaarlijke elektrostatische lading te voorkomen. 12. Energiebeperkingsvoorzieningen
      en voorzieningen voor drukontlasting als bedoeld in de punten 1.5.7, 3.4.7 en 4.1.2.6
      van bijlage III. 13. Systemen en voorzieningen om geluidsemissies en trillingen te beperken.
      14. Kantelbeveiligingsinrichtingen (ROPS). 15. Constructies ter bescherming tegen vallende
      voorwerpen (FOPS). 16. Met twee handen te bedienen bedieningsorganen. 17. De volgende
      componenten voor machines voor het heffen en/of laten dalen van personen tussen verschillende
      stopplaatsen: a) grendelinrichtingen van schachtdeuren; b) vanginrichtingen die de vrije
      val van de drager of ongecontroleerde opwaartse bewegingen moeten verhinderen; c) snelheidsbegrenzers;
      d) energieopnemende buffers, met niet-lineaire karakteristiek of met terugslagdemping;
      e) energieafvoerende buffers; f) veiligheidsinrichtingen op vijzels van de hydraulische
      circuits en als vanginrichtingen gebruikt; g) veiligheidsschakelaars met elektronische
      componenten. 18. Software voor de werking van veiligheidsfuncties. 19. Veiligheidscomponenten
      met volledig of gedeeltelijk zelfontwikkelend gedrag waarbij wordt gebruikgemaakt van
      methoden op basis van machinaal leren die veiligheidsfuncties waarborgen. 20. Filtersystemen
      die bestemd zijn om in machinecabines te worden ingebouwd om bedieners of andere personen
      te beschermen tegen gevaarlijke materialen en stoffen waaronder gewasbeschermingsmiddelen,
      en filters voor dergelijke filtersystemen.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230
  - number: bijlage III
    text: >-
      ESSENTIËLE VEILIGHEIDS- EN GEZONDHEIDSEISEN BETREFFENDE HET ONTWERP EN DE BOUW VAN MACHINES
      EN VERWANTE PRODUCTEN DEEL A Definities Voor de toepassing van deze bijlage wordt verstaan
      onder: a) “gevaar”: een mogelijke bron van verwonding of aantasting van de gezondheid;
      b) “gevarenzone”: zone in en/of rondom een machine of een verwant product waarin een
      persoon blootstaat aan gevaar voor zijn of haar veiligheid of gezondheid; c) “blootgestelde
      persoon”: persoon die zich geheel of gedeeltelijk in een gevarenzone bevindt; d) “bediener”:
      persoon die een machine of een verwant product installeert, laat werken, afstelt, onderhoudt,
      reinigt, herstelt of verplaatst; e) “risico”: combinatie van de waarschijnlijkheid en
      de ernst van een letsel dat of een aantasting van de gezondheid die zich kan voordoen
      in een gevaarlijke situatie; f) “afscherming”: een onderdeel van een machine of een
      verwant product dat specifiek wordt gebruikt om te beschermen door middel van een materiële
      barrière; g) “beveiligingsinrichting”: inrichting (anders dan een afscherming) die,
      alleen of in combinatie met een afscherming, een risico vermindert; h) “beoogd gebruik”:
      gebruik van een machine of een verwant product overeenkomstig de informatie in de gebruiksaanwijzing;
      i) “redelijkerwijs voorzienbaar verkeerd gebruik”: gebruik van een machine of een verwant
      product op een manier die niet in de gebruiksaanwijzing staat maar het resultaat kan
      zijn van gemakkelijk voorspelbaar menselijk gedrag. DEEL B Algemene beginselen 1. De
      fabrikant van een machine of een verwant product moet ervoor zorgen dat een risicobeoordeling
      wordt uitgevoerd om na te gaan welke essentiële veiligheids- en gezondheidseisen op
      die machine of op dat verwant product van toepassing zijn. Bij het ontwerpen en bouwen
      van de machine of het verwante product wordt vervolgens rekening gehouden met de resultaten
      van deze risicobeoordeling om gevaren weg te nemen of, indien dat niet mogelijk is,
      alle relevante risico’s tot een minimum te beperken. Via het herhalen van in de eerste
      alinea bedoelde risicobeoordeling en -beperking moet de fabrikant: a) de grenzen van
      de machine of het verwante product bepalen, zowel uitgaande van het beoogde gebruik
      als van elk redelijkerwijs voorzienbare verkeerde gebruik daarvan; b) nagaan welke gevaren
      door de machine of het verwante product kunnen worden veroorzaakt en welke gevaarlijke
      situaties daaraan verbonden zijn; c) de risico’s inschatten met inachtneming van de
      ernst van het mogelijke letsel of de aantasting van de gezondheid en de waarschijnlijkheid
      dat het letsel of de aantasting zich voordoet; d) de risico’s beoordelen teneinde, overeenkomstig
      de doelstelling van deze verordening, te bepalen of risicoreductie vereist is; e) de
      gevaren wegnemen of de aan deze gevaren verbonden risico’s verminderen door de toepassing
      van beschermingsmaatregelen in de in punt 1.1.2, b), vastgestelde volgorde. De risicobeoordeling
      en de risicoreductie omvatten de gevaren die tijdens de levenscyclus van de machine
      of het verwante product zouden kunnen optreden en die, op het moment dat de machine
      of het verwante product in de handel wordt gebracht, voorzienbaar zijn, omdat het de
      beoogde ontwikkeling betreft van het volledig of gedeeltelijk zelfontwikkelende gedrag
      of de volledig of gedeeltelijk zelfontwikkelende logica van de machine of het verwante
      product dat ontworpen is om met variërende niveaus van autonomie te functioneren. De
      risicobeoordeling en de risicoreductie omvatten de risico’s die voortvloeien uit de
      interacties tussen machines die, teneinde tot hetzelfde resultaat te komen, zodanig
      zijn opgesteld en worden bestuurd dat zij als één geheel functioneren en dus een machine
      vormen als omschreven in artikel 3, punt 1), d). 2. De verplichtingen die zijn vervat
      in de essentiële veiligheids- en gezondheidseisen zijn alleen van toepassing indien
      het gevaar in kwestie bij de betrokken machine of het betrokken verwante product aanwezig
      is wanneer die machine of dat product op de door de fabrikant bedoelde wijze, dan wel
      in voorzienbare abnormale omstandigheden wordt gebruikt. De beginselen van geïntegreerde
      veiligheid die zijn vastgesteld in punt 1.1.2 en de voorschriften inzake markering van
      machines en verwante producten als bedoeld in punt 1.7.3 en inzake de gebruiksaanwijzing
      als bedoeld in punt 1.7.4 gelden echter in alle gevallen. 3. De in deze bijlage vermelde
      essentiële veiligheids- en gezondheidseisen zijn dwingend; gezien de stand van de techniek
      is het evenwel mogelijk dat de daarin gestelde doelen niet kunnen worden bereikt. In
      dat geval moeten die doelstellingen bij het ontwerp en de bouw van de machine of het
      verwante product zoveel mogelijk worden nagestreefd. 4. Deze bijlage bestaat uit zes
      hoofdstukken. Het eerste hoofdstuk heeft een algemene werkingssfeer en is van toepassing
      op alle machines en verwante producten. De andere hoofdstukken betreffen bepaalde soorten
      meer specifieke gevaren. De gehele bijlage moet evenwel worden bekeken om zeker te zijn
      dat aan alle relevante essentiële veiligheids- en gezondheidseisen is voldaan. Bij het
      ontwerpen van een machine of een verwant product worden de eisen van het eerste hoofdstuk
      en de eisen van één of meer andere hoofdstukken in aanmerking genomen, naargelang van
      de resultaten van de risicobeoordeling uitgevoerd overeenkomstig punt 1 van deze algemene
      beginselen. Essentiële gezondheids- en veiligheidseisen voor de bescherming van het
      milieu zijn enkel van toepassing op de machines of verwante producten als bedoeld in
      punt 2.4. 5. Deze algemene beginselen zijn van toepassing op de risicobeoordeling die
      door de fabrikant van niet voltooide machines wordt verricht. 1. ESSENTIËLE GEZONDHEIDS-
      EN VEILIGHEIDSEISEN 1.1. Algemeen 1.1.1. Toepasbaarheid De verplichtingen uit hoofde
      van de essentiële veiligheids- en gezondheidseisen zijn van toepassing op niet voltooide
      machines, voor zover die eisen relevant zijn. De relevante eisen met betrekking tot
      niet voltooide machines hebben geen betrekking op de eisen waaraan alleen kan worden
      voldaan op het moment dat de niet voltooide machine wordt ingebouwd. De in punt 1.1.2
      vastgestelde beginselen van geïntegreerde veiligheid zijn echter in alle gevallen van
      toepassing. 1.1.2. Beginselen van geïntegreerde veiligheid a) Machines en verwante producten
      moeten zodanig ontworpen en gebouwd zijn dat zij geschikt zijn voor hun functie, en
      bediend, afgesteld en onderhouden kunnen worden zonder dat personen aan een risico worden
      blootgesteld, waarbij niet alleen rekening wordt gehouden met de omstandigheden tijdens
      het beoogde gebruik, maar ook met redelijkerwijs voorzienbaar verkeerd gebruik. De beschermingsmaatregelen
      zijn erop gericht elk risico gedurende de te verwachten levensduur van de machine of
      het verwante product, met inbegrip van de fasen van het vervoer, het monteren, het ontmantelen,
      de buitenbedrijfstelling en de sloop, uit te sluiten. b) Bij het kiezen van de meest
      geschikte oplossingen moet de fabrikant de volgende beginselen toepassen, in de aangeduide
      volgorde: i) de gevaren wegnemen, of, indien dat niet mogelijk is, de risico’s tot een
      minimum beperken (veiligheid in het ontwerp en de bouw van de machine of het verwante
      product integreren); ii) de noodzakelijke beschermingsmaatregelen treffen voor risico’s
      die niet kunnen worden uitgesloten; iii) de gebruikers informeren over de restrisico’s
      ten gevolge van een tekortkoming van de getroffen beschermingsmaatregelen, aangeven
      of een bijzondere opleiding vereist is en aangeven of en wanneer het nodig is om persoonlijke
      beschermingsmiddelen te verstrekken. c) Bij ontwerp en bouw van een machine of een verwant
      product en bij het opstellen van de gebruiksaanwijzing moet de fabrikant niet alleen
      het beoogde gebruik van de machine of het verwante product maar ook elk redelijkerwijs
      voorzienbare verkeerd gebruik voor ogen houden. De machine of het verwante product moet
      zodanig ontworpen en gebouwd zijn dat abnormaal gebruik, indien dat een risico zou inhouden,
      wordt voorkomen. In voorkomend geval moet de gebruiksaanwijzing de aandacht van de gebruiker
      vestigen op manieren waarop de machine of het verwante product niet mag worden gebruikt,
      maar waarvan de praktijk heeft uitgewezen dat dit wel gebeurt. d) Bij ontwerp en bouw
      van machines of verwante producten moet rekening worden gehouden met de belemmeringen
      die de bediener ondervindt door een noodzakelijk of voorzienbaar gebruik van persoonlijke
      beschermingsmiddelen. e) Machines en verwante producten moeten zodanig ontworpen en
      gebouwd zijn dat de gebruiker de veiligheidsfuncties in voorkomend geval kan testen.
      De machine of het verwante product moet worden geleverd met alle speciale uitrusting
      en toebehoren en, in voorkomend geval, met een beschrijving van specifieke functionele
      testprocedures die essentieel zijn om die machine of dat product veilig te kunnen testen,
      afstellen, onderhouden en gebruiken. 1.1.3. Materialen en producten De materialen die
      zijn gebruikt om een machine of een verwant product te bouwen of producten die zijn
      gebruikt of ontstaan gedurende het gebruik ervan mogen geen gevaar voor de gezondheid
      of de veiligheid van personen opleveren. Met name bij het gebruik van fluïda moeten
      machines en verwante producten ontworpen en gebouwd zijn om risico’s als gevolg van
      vullen, gebruiken, opvangen en afvoeren te voorkomen. 1.1.4. Verlichting Machines en
      verwante producten moeten worden geleverd met een ingebouwde, aan de werkzaamheden aangepaste
      verlichting indien afwezigheid van die ingebouwde verlichting ondanks een normale ruimteverlichting
      een risico kan inhouden. Een machine of een verwant product moet zodanig ontworpen en
      gebouwd zijn dat de verlichting geen hinderlijke schaduwzones, verblinding of gevaarlijke
      stroboscopische effecten op de bewegende delen veroorzaakt. Indien bepaalde onderdelen
      aan de binnenzijde dikwijls moeten worden geïnspecteerd en afgeregeld, moeten zij van
      een passende verlichting voorzien zijn; dit geldt tevens voor de zones waar afstelling
      en onderhoud plaatsvinden. 1.1.5. Ontwerp van een machine of een verwant product om
      het hanteren ervan gemakkelijker te maken Een machine of een verwant product of elk
      van de componenten daarvan moet: a) veilig kunnen worden gehanteerd en vervoerd; b)
      verpakt of ontworpen zijn om veilig en zonder beschadigingen te kunnen worden opgeslagen.
      Bij vervoer van de machine of het verwante product of onderdelen daarvan mogen zich
      geen plotselinge verplaatsingen kunnen voordoen en mag er geen gevaar ontstaan door
      gebrek aan stabiliteit, indien de machine of het verwante product of onderdelen daarvan
      volgens de gebruiksaanwijzing worden gehanteerd. Wanneer het gewicht, de omvang of de
      vorm van een machine of een verwant product of de verschillende componenten ervan handmatige
      verplaatsing onmogelijk maakt, moet ervoor worden gezorgd dat de machine of het verwante
      product of elk samenstellend deel: a) voorzien is van bevestigingspunten voor een hefinrichting,
      of b) zodanig is ontworpen dat dergelijke bevestigingspunten kunnen worden aangebracht,
      of c) een vorm heeft die gemakkelijke bevestiging van standaard hijs- en hefgereedschap
      mogelijk maakt. Wanneer een machine of een verwant product of een van de samenstellende
      delen daarvan met de hand wordt verplaatst, moet deze/dit: a) gemakkelijk verplaatsbaar
      zijn, of b) uitgerust zijn om veilig te kunnen worden opgepakt en verplaatst. Bijzondere
      voorzieningen moeten worden getroffen voor het hanteren van gereedschappen en/of onderdelen
      van machines of verwante producten die gevaarlijk zouden kunnen zijn, zelfs als deze
      een gering gewicht hebben. 1.1.6. Ergonomie Onder de beoogde gebruiksomstandigheden
      moeten de hinder, vermoeidheid en fysieke en psychische belasting waarmee de bediener
      wordt geconfronteerd, worden weggenomen of tot een minimum worden beperkt, met inachtneming
      van ten minste de volgende ergonomische beginselen: a) het rekening houden met de verscheidenheid
      aan fysieke afmetingen, kracht en uithoudingsvermogen van de bedieners; b) het vermijden
      van de noodzakelijkheid van veeleisende werkhoudingen of bewegingen en van krachtinspanningen
      die de capaciteit van de bediener te boven gaan; c) het voorhanden zijn van voldoende
      ruimte opdat de bediener zijn lichaamsdelen vrijelijk kan bewegen; d) het vermijden
      dat de machine het werktempo bepaalt; e) het vermijden dat langdurige concentratie is
      vereist; f) het aanpassen van het raakvlak tussen mens en machine op de te voorziene
      eigenschappen van de bedieners, ook met betrekking tot een machine of een verwant product
      met voorzien volledig of gedeeltelijk zelfontwikkelend gedrag of voorziene volledig
      of gedeeltelijk zelfontwikkelende logica die/dat is ontworpen om met verschillende niveaus
      van autonomie te werken; g) waar relevant, het aanpassen van een machine of een verwant
      product met voorzien volledig of gedeeltelijk zelfontwikkelend gedrag of voorziene volledig
      of gedeeltelijk zelfontwikkelende logica die/dat is ontworpen om met verschillende niveaus
      van autonomie te werken om adequaat en passend te reageren op mensen (bijvoorbeeld verbaal
      via woorden en non-verbaal door middel van gebaren, gezichtsuitdrukkingen of lichaamsbewegingen)
      en om haar of zijn geplande handelingen (bijvoorbeeld wat de machine of het verwant
      product gaat doen en waarom) op begrijpelijke wijze aan de bedieners mee te delen. 1.1.7.
      Bedienerspost De bedienerspost moet zodanig ontworpen en gebouwd zijn dat ieder risico
      door uitlaatgassen of zuurstofgebrek wordt vermeden. Indien de machine of het verwante
      product bedoeld is om te worden gebruikt in een gevaarlijke omgeving die risico’s voor
      de gezondheid of de veiligheid van de bediener vertoont, dan wel indien de machine of
      het verwante product zelf een gevaarlijke omgeving creëert, moet er met passende middelen
      voor worden gezorgd dat de bediener in goede arbeidsomstandigheden werkt en beschermd
      is tegen alle voorzienbare gevaren. In voorkomend geval moet de werkplek van een deugdelijke
      cabine zijn voorzien, die zo moet zijn ontworpen, gebouwd of uitgerust dat aan de bovengenoemde
      eisen wordt voldaan. De uitgang moet een snelle ontruiming mogelijk maken. Bovendien
      moet, in voorkomend geval, een nooduitgang worden voorzien in een andere richting dan
      de gewone uitgang. 1.1.8. Zitplaatsen In voorkomend geval en wanneer de arbeidsomstandigheden
      dit toelaten, moeten de bedieningsposten die een integrerend deel van de machine of
      het verwante product uitmaken, zo ontworpen zijn dat zitplaatsen kunnen worden geïnstalleerd.
      Indien het de bedoeling is dat de bediener tijdens het werk zit en indien de bedieningspost
      een integrerend deel van de machine of het verwante product uitmaakt, moet op de machine
      of het verwante product een zitplaats zijn aangebracht. De zitplaats moet de bediener
      de mogelijkheid bieden een stabiele positie te behouden. Bovendien moeten de zitplaats
      en de afstand tussen de zitplaats en de bedieningsorganen kunnen worden aangepast aan
      de bediener. Als de machine of het verwante product aan trillingen onderhevig is, moet
      de zitplaats zodanig zijn ontworpen en gebouwd dat het doorgeven van trillingen aan
      de bediener zoveel als redelijkerwijs mogelijk is, wordt beperkt. De verankering van
      de zitplaats moet tegen alle mogelijke belastingen bestand zijn. Indien zich onder de
      voeten van de bediener geen vloer bevindt, moet deze kunnen gebruikmaken van voetsteunen
      met een antislip-bekleding. 1.1.9. Bescherming tegen corruptie De machine of het verwante
      product moet zodanig ontworpen en gebouwd zijn dat de verbinding ervan met een ander
      apparaat, via een functie van het aangesloten apparaat zelf of via een apparaat op afstand
      dat communiceert met de machine of het verwante product, niet tot een gevaarlijke situatie
      leidt. Een hardwarecomponent die een signaal of gegevens uitzendt die relevant zijn
      voor aansluiting op of toegang tot software die van essentieel belang is voor de overeenstemming
      van de machine of het verwante product met de relevante essentiële veiligheids- en gezondheidseisen,
      moet zodanig ontworpen zijn dat deze afdoende beschermd is tegen al dan niet opzettelijke
      corruptie. De machine of het verwante product moet bewijzen verzamelen van al dan niet
      rechtmatige ingrepen in de bovenvermelde hardwarecomponent indien deze relevant zijn
      voor de aansluiting op of de toegang tot software die van essentieel belang is voor
      de overeenstemming van de machine of het verwante product. Software en gegevens die
      van cruciaal belang zijn voor de overeenstemming van de machine of het verwante product
      met de relevante essentiële gezondheids- en veiligheidseisen, moeten als zodanig herkenbaar
      zijn en afdoende beveiligd worden tegen al dan niet opzettelijke corruptie. De machine
      of het verwante product moet de in zich geïnstalleerde software die nodig is om veilig
      te functioneren identificeren en deze informatie te allen tijde in een gemakkelijk toegankelijke
      vorm kunnen verstrekken. De machine of het verwante product moet bewijzen van al dan
      niet rechtmatige ingrepen in en wijzigingen van de in de machine of het verwante product
      of een configuratie ervan geïnstalleerde software verzamelen. 1.2. Besturingssystemen
      1.2.1. Veiligheid en betrouwbaarheid van de besturingssystemen De besturingssystemen
      moeten zodanig ontworpen en gebouwd zijn dat er geen gevaarlijke situaties ontstaan.
      De besturingssystemen moeten zodanig ontworpen en gebouwd zijn dat: a) zij, gezien de
      omstandigheden en de risico’s, bestand zijn tegen de voorziene bedrijfsbelasting en
      tegen al dan niet voorziene invloeden van buitenaf, met inbegrip van redelijkerwijs
      voorzienbare kwaadwillige pogingen van derden die tot een gevaarlijke situatie leiden;
      b) een storing in de hardware of de besturingslogica niet tot een gevaarlijke situatie
      leidt; c) fouten in de besturingslogica niet tot een gevaarlijke situatie leiden; d)
      de grenzen van de veiligheidsfuncties moeten worden vastgesteld in het kader van de
      risicobeoordeling door de fabrikant, en er geen wijzigingen mogelijk zijn aan de instellingen
      of regels die door de machine of het verwante product of door de bedieners worden gegenereerd,
      ook niet in de leerfase van de machine of het verwante product, indien dergelijke wijzigingen
      tot een gevaarlijke situatie zouden kunnen leiden; e) redelijkerwijs voorzienbare menselijke
      fouten gedurende de werking niet tot een gevaarlijke situatie leiden; f) het traceringslogboek
      de gegevens die bij een ingreep zijn gegenereerd, en de versies van veiligheidssoftware
      die zijn geüpload nadat de machine of het verwante product in de handel is gebracht
      of in bedrijf is gesteld, registreert en gedurende vijf jaar na het uploaden ter beschikking
      stelt, uitsluitend om de overeenstemming van de machine of het verwante product met
      deze bijlage aan te tonen, indien een nationale bevoegde autoriteit daar een met redenen
      omkleed verzoek toe doet. De besturingssystemen van machines en verwante producten met
      volledig of gedeeltelijk zelfontwikkelend gedrag of volledig of gedeeltelijk zelfontwikkelende
      logica die zijn ontworpen om met verschillende niveaus van autonomie te werken, zijn
      zodanig ontworpen en gebouwd dat: a) zij de machine of het verwante product geen handelingen
      laten uitvoeren buiten zijn vastgelegde taak en bewegingsruimte; b) gegevens worden
      geregistreerd over het veiligheidsgerelateerde besluitvormingsproces voor op software
      gebaseerde veiligheidssystemen die veiligheidsfuncties waarborgen, met inbegrip van
      veiligheidscomponenten, nadat de machine of het verwante product in de handel is gebracht
      of in bedrijf is gesteld, en dat dergelijke gegevens gedurende één jaar na de verzameling
      ervan worden bewaard, uitsluitend om de overeenstemming van de machine of het verwante
      product met deze bijlage aan te tonen, indien een bevoegde nationale autoriteit daar
      een met redenen omkleed verzoek toe doet; c) het te allen tijde mogelijk is de machine
      of het verwante product te corrigeren om de intrinsieke veiligheid ervan te handhaven.
      De volgende punten verdienen bijzondere aandacht: a) de machine of het verwante product
      mag niet onverwacht starten; b) de parameters van de machine of het verwante product
      mogen niet op ongecontroleerde wijze veranderen wanneer dit tot gevaarlijke situaties
      zou kunnen leiden; c) wijzigingen van de instellingen of regels die door de machine
      of het verwante product of door de bedieners worden gegenereerd, ook in de leerfase
      van de machine of het verwante product, moeten worden voorkomen indien dergelijke wijzigingen
      tot gevaarlijke situaties zouden kunnen leiden; d) het stopzetten van de machine of
      het verwante product mag niet worden verhinderd indien de stopopdracht reeds is gegeven;
      e) geen enkel bewegend deel van de machine of het verwante product en geen enkel stuk
      dat door de machine of het verwante product wordt vastgehouden mag vallen of worden
      uitgeworpen; f) het automatisch of manueel stopzetten van enig bewegend deel mag niet
      worden gehinderd; g) de beveiligingsinrichtingen moeten volkomen functioneel blijven
      of een opdracht tot stopzetten geven; h) de veiligheidsgerelateerde elementen van het
      besturingssysteem gelden op een coherente wijze voor een samenstel van machines of verwante
      producten, of deels voltooide machines of een combinatie daarvan. In het geval van draadloze
      besturing mag een storing in de communicatie of verbinding of een gebrekkige verbinding
      niet tot een gevaarlijke situatie leiden. 1.2.2. Bedieningsorganen De bedieningsorganen
      moeten: a) duidelijk zichtbaar en herkenbaar zijn en, waar nodig, voorzien zijn van
      pictogrammen; b) zodanig zijn geplaatst dat de bediening veilig, zonder aarzeling of
      tijdverlies en zonder misverstand kan gebeuren; c) zodanig zijn ontworpen dat er een
      logisch verband bestaat tussen de beweging van het bedieningsorgaan en het bewerkstelligde
      effect; d) buiten de gevarenzones geplaatst zijn, behalve wanneer dit voor bepaalde
      bedieningsorganen, zoals noodstoporganen of hangende bedieningsstations, nodig is; e)
      zodanig geplaatst zijn dat hun bediening geen extra risico met zich meebrengt: f) zodanig
      zijn ontworpen of beveiligd dat het beoogde effect, indien dat gevaar kan opleveren,
      uitsluitend door een opzettelijke handeling kan plaatsvinden; g) zodanig zijn vervaardigd
      dat zij de voorzienbare krachten kunnen weerstaan, waarbij bijzondere aandacht wordt
      geschonken aan de noodstopvoorzieningen, die sterk belast kunnen worden. Als een bedieningsorgaan
      zodanig is ontworpen en gebouwd dat er verschillende handelingen mee kunnen worden verricht,
      dat wil zeggen dat de werking ervan niet eenduidig is, moet duidelijk worden aangegeven
      welke handeling is gekozen en moet deze keuze zo nodig worden bevestigd. De bedieningsorganen
      moeten zodanig zijn uitgevoerd dat, rekening houdend met de ergonomische beginselen,
      de opstelling, het bereik en de bedieningsweerstand verenigbaar zijn met de te verrichten
      handeling. De machines of verwante producten moeten zijn voorzien van signalerings-
      en aanwijsinrichtingen die noodzakelijk zijn voor een veilige werking. De bediener moet
      deze signalen en aanwijzingen vanaf de bedieningspost kunnen lezen. De bediener moet
      zich er vanaf iedere bedieningspost van kunnen vergewissen dat er zich geen personen
      in de gevarenzones bevinden of het bedieningssysteem moet zodanig zijn ontworpen en
      uitgevoerd dat het inschakelen van de machine wordt verhinderd zolang er zich iemand
      in de gevarenzone bevindt. Wanneer geen van deze mogelijkheden kan worden toegepast,
      moet vóór het inschakelen van de machine of het verwante product een geluids- en/of
      lichtsignaal worden gegeven. Blootgestelde personen moeten voldoende tijd hebben om
      de gevarenzone te verlaten of het inschakelen van de machine te verhinderen. Zo nodig
      moeten voorzieningen worden getroffen om zeker te stellen dat de machine of het verwante
      product uitsluitend vanaf bedieningsposten in een of meer vooraf bepaalde zones of plaatsen
      kan worden bediend. Wanneer er meer dan één bedieningspost is, moet het besturingssysteem
      zodanig zijn ontworpen dat bij gebruik van één van de posten het gebruik van de overige
      posten onmogelijk wordt, met uitzondering van stopinrichtingen en noodstops. Wanneer
      de machine of het verwante product twee of meer bedienersposten heeft, moet iedere post
      voorzien zijn van alle noodzakelijke bedieningsorganen, zonder dat de bedieners elkaar
      hinderen of in een gevaarlijke situatie brengen. 1.2.3. In werking stellen Het in werking
      stellen van de machine of het verwante product mag alleen geschieden door een opzettelijk
      verrichte handeling met een hiervoor bestemd bedieningsorgaan. Dezelfde eis geldt wanneer:
      a) de machine of het verwante product opnieuw in werking wordt gesteld na een stilstand,
      ongeacht de oorzaak daarvan; b) een belangrijke wijziging in de bedrijfsomstandigheden
      wordt bewerkstelligd. Voor zover dit niet tot een gevaarlijke situatie leidt, mag het
      opnieuw in werking stellen van de machine of het verwante product of het wijzigen van
      de bedrijfsomstandigheden geschieden door een opzettelijk verrichte handeling met een
      ander orgaan dan het hiervoor bestemde bedieningsorgaan. Bij machines of verwante producten
      die werken in automatische modus mag het in werking stellen, het opnieuw in werking
      stellen na een stilstand of het wijzigen van de bedrijfsomstandigheden, zonder interventie
      kunnen plaatsvinden als dit geen gevaarlijke situatie oplevert. Wanneer de machine of
      het verwante product door meer dan één bedieningsorgaan in werking kan worden gesteld
      en de bedieners elkaar daardoor in gevaar kunnen brengen, moeten aanvullende inrichtingen
      worden aangebracht om dit risico uit te sluiten. Wanneer het om veiligheidsredenen nodig
      is de machine of het verwante product volgens een specifieke volgorde in werking te
      stellen en/of stop te zetten, moeten er inrichtingen zijn die waarborgen dat deze handelingen
      in de correcte volgorde worden uitgevoerd. 1.2.4. Stopzetting 1.2.4.1. Normale stopzetting
      Machines en verwante producten moeten voorzien zijn van een bedieningsorgaan waarmee
      zij op veilige wijze volledig kunnen worden stopgezet. Elke werkplek moet voorzien zijn
      van een bedieningsorgaan waarmee, naargelang van de bestaande gevaren, hetzij alle functies
      van de machine of het verwante product, hetzij een aantal daarvan kunnen worden stilgelegd,
      zodat de machine of het verwante product in veilige toestand wordt gebracht. De stopopdracht
      aan de machine of het verwante product moet voorrang hebben op startopdrachten. Wanneer
      de machine of het verwante product of de gevaarlijke functies ervan tot stilstand zijn
      gekomen, moet de energievoorziening van de betrokken aandrijvingen worden onderbroken.
      1.2.4.2. Operationele stopzetting Indien om operationele redenen een stopopdracht moet
      worden gegeven die de energievoorziening van de aandrijvingen niet onderbreekt, moet
      de stoptoestand worden bewaakt en gehandhaafd. 1.2.4.3. Noodstop Machines en verwante
      producten moeten voorzien zijn van een of meer noodstopvoorzieningen waarmee reële of
      dreigende gevaarlijke situaties kunnen worden afgewend. Dit geldt niet voor: a) machines
      en verwante producten waarbij het risico niet verminderd zou worden door de noodstopvoorziening,
      hetzij omdat deze de normale tijd waarbinnen het machineproduct stopt, niet vermindert,
      hetzij omdat deze het niet mogelijk maakt de bijzondere maatregelen te nemen die het
      risico vereist; b) draagbare machines en verwante producten die met de hand worden vastgehouden
      of met de hand worden geleid. De voorziening moet: a) duidelijk herkenbare, goed zichtbare
      en snel bereikbare bedieningsorganen hebben; b) stopzetting van een gevaarlijk proces
      binnen de kortst mogelijke tijd bewerkstelligen zonder aanvullende risico’s te scheppen;
      c) indien nodig, bepaalde veiligheidsbewegingen in gang zetten of ervoor zorgen dat
      deze in gang kunnen worden gezet. Wanneer de werking van de noodstopvoorziening wordt
      beëindigd nadat een stopopdracht is gegeven, moet de opdracht door inschakeling van
      de noodstopvoorziening gehandhaafd blijven totdat deze specifiek wordt opgeheven; de
      voorziening mag niet kunnen worden ingeschakeld zonder een stopopdracht te genereren;
      de voorziening mag alleen met een passende handeling kunnen worden uitgeschakeld en
      het uitschakelen mag de machine of het verwante product niet herstarten, maar mag het
      herstarten ervan alleen mogelijk maken. De noodstopfunctie moet te allen tijde beschikbaar
      zijn en operationeel zijn, ongeacht de bedrijfsmodus. Noodstopvoorzieningen dienen ter
      ondersteuning van andere veiligheidsmaatregelen, niet ter vervanging ervan. 1.2.4.4.
      Samenstel van machines en verwante producten In het geval van machines of verwante producten
      of onderdelen van machines of verwante producten die ontworpen zijn om samen te functioneren,
      moeten de machines zodanig zijn ontworpen en gebouwd dat de stopvoorzieningen, met inbegrip
      van de noodstopvoorzieningen, niet alleen de machines en verwante producten, maar tevens
      alle daarmee verbonden installaties kunnen stopzetten, indien het blijven werken daarvan
      een gevaar kan vormen. 1.2.5. Keuze van de bedienings- of bedrijfsmodus De gekozen bedienings-
      of bedrijfsmodus moet voorrang hebben op alle andere bedienings- of bedrijfsmodi, met
      uitzondering van de noodstopvoorziening. Indien machines of verwante producten zijn
      ontworpen en gebouwd om gebruikt te worden volgens verschillende bedienings- of bedrijfsmodi
      die verschillende beschermingsmaatregelen en/of werkwijzen vereisen, moeten zij zijn
      voorzien van een functiekeuzeschakelaar die in elke stand kan worden vergrendeld. Elke
      positie van de functiekeuzeschakelaar moet duidelijk herkenbaar zijn en mag slechts
      met één bedienings- of bedrijfsmodus verbonden zijn. Om het gebruik van bepaalde functies
      van machines of verwante producten tot bepaalde categorieën bedieners te beperken, mag
      de keuzeschakelaar door andere keuzemethoden worden vervangen. Indien machines of verwante
      producten voor bepaalde handelingen moeten kunnen functioneren met een verplaatste of
      verwijderde afscherming en/of een uitgeschakelde beveiligingsinrichting, moet de functiekeuzeschakelaar
      voor de bedienings- of bedrijfsmodus tegelijkertijd: a) alle andere bedienings- en bedrijfsmodi
      uitschakelen; b) de werking van gevaarlijke functies alleen mogelijk maken door middel
      van bedieningsorganen die onafgebroken moeten worden bediend; c) de werking van gevaarlijke
      functies alleen mogelijk maken in omstandigheden met een verlaagd risico en daarbij
      gevaren in verband met aan elkaar geschakelde regelingen voorkomen; d) de werking van
      gevaarlijke functies door gewilde of ongewilde invloed op de sensoren van de machines
      of de verwante producten onmogelijk maken. Indien niet gelijktijdig aan deze vier voorwaarden
      kan worden voldaan, moet de functiekeuzeschakelaar andere beschermingsmaatregelen in
      werking stellen die ontworpen en gebouwd zijn om een veilige werkruimte te waarborgen.
      Voorts moeten bedieners vanaf de bedieningspost de werking van de onderdelen waarop
      zij invloed uitoefenen, kunnen beheersen. 1.2.6. Defecten in de energievoorziening of
      de verbinding met het communicatienetwerk Een onderbreking, het herstel na een onderbreking
      of een schommeling van welke aard ook in de energievoorziening van een machine of verwant
      product of de verbinding ervan met het communicatienetwerk, mag niet tot gevaarlijke
      situaties leiden. Hierbij moet in het bijzonder op de volgende punten worden gelet:
      a) de machine of het verwante product mag niet onverwacht in werking worden gesteld;
      b) de parameters van de machine of het verwante product mogen niet op ongecontroleerde
      wijze veranderen indien hierdoor gevaarlijke situaties kunnen ontstaan; c) de stopzetting
      van de machine of het verwante product mag niet worden verhinderd indien de stopopdracht
      reeds is gegeven; d) geen enkel bewegend deel van de machine of het verwante product
      en geen enkel stuk dat door de machine of het verwante product wordt vastgehouden mag
      vallen of worden uitgeworpen; e) de automatische of handmatige stopzetting van bewegende
      delen mag niet worden belemmerd; f) de beveiligingsinrichtingen moeten volkomen functioneel
      blijven of een stopopdracht geven. 1.3. Maatregelen ter beveiliging tegen mechanische
      risico’s 1.3.1. Risico op verlies van stabiliteit Machines en verwante producten en
      onderdelen en toebehoren ervan moeten voldoende stabiel zijn opdat kantelen, omvallen
      of niet-gecontroleerde bewegingen worden vermeden tijdens het vervoer, de montage, de
      ontmanteling en elke andere handeling waarbij de machines of verwante producten betrokken
      zijn. Als de vorm van de machines of verwante producten zelf of de beoogde installatie
      daarvan onvoldoende stabiliteit biedt, moeten passende verankeringsmiddelen worden ingebouwd,
      die in de gebruiksaanwijzing moeten worden vermeld. 1.3.2. Risico op breuken tijdens
      het gebruik De verschillende onderdelen van machines en verwante producten en hun verbindingen
      moeten bestand zijn tegen de belasting waaraan zij tijdens het gebruik worden blootgesteld.
      De duurzaamheid van de gebruikte materialen moet toereikend zijn voor de gebruiksomgeving
      waarvoor de fabrikant de machine of het verwante product heeft bestemd, met name wat
      betreft moeheids-, verouderings-, corrosie- en slijtageverschijnselen. In de gebruiksaanwijzing
      moeten de aard en frequentie worden vermeld van het onderhoud en de inspecties die om
      veiligheidsredenen vereist zijn. In voorkomend geval moet worden aangegeven welke onderdelen
      aan slijtage onderhevig zijn en welke criteria gehanteerd worden voor vervanging. Indien
      ondanks de getroffen maatregelen een risico op scheuring of afbrokkeling blijft bestaan,
      moeten de betreffende onderdelen zodanig worden aangebracht, gepositioneerd of beschermd
      dat brokstukken worden ingekapseld en gevaarlijke situaties worden voorkomen. Zowel
      stijve als flexibele leidingen voor fluïda, en met name hogedrukleidingen, moeten bestand
      zijn tegen de beoogde interne en externe druk; zij moeten stevig zijn bevestigd of afgeschermd
      om ervoor te zorgen dat scheuring geen risico’s met zich meebrengt. Bij automatische
      toevoer van het te bewerken materiaal naar het gereedschap moet aan de volgende voorwaarden
      worden voldaan om risico’s voor personen uit de weg te gaan: a) wanneer het stuk met
      het gereedschap in aanraking komt, moet het gereedschap zijn normale bedrijfsomstandigheden
      hebben bereikt; b) wanneer het gereedschap (al dan niet opzettelijk) in werking wordt
      gesteld en/of wordt stopgezet, moeten de toevoerbeweging en de beweging van het gereedschap
      gelijklopen. 1.3.3. Risico’s in verband met vallende of uitgeworpen voorwerpen Er moeten
      voorzorgsmaatregelen worden getroffen om risico’s in verband met vallende of uitgeworpen
      voorwerpen te voorkomen. 1.3.4. Risico’s in verband met oppervlakken, randen en hoeken
      Bereikbare onderdelen van machines of verwante producten mogen, voor zover hun functie
      dit toelaat, geen scherpe randen of hoeken of ruwe oppervlakken hebben die gemakkelijk
      verwondingen kunnen veroorzaken. 1.3.5. Risico’s in verband met gecombineerde machines
      en verwante producten Indien machines of verwante producten bedoeld zijn om verschillende
      bewerkingen te verrichten waarbij het stuk na iedere bewerking handmatig wordt verwijderd
      (gecombineerde machine of gecombineerd verwant product), moeten de machines of verwante
      producten zodanig zijn ontworpen en gebouwd dat het mogelijk is ieder element afzonderlijk
      te gebruiken zonder dat de overige elementen voor de blootgestelde persoon een risico
      met zich mee brengen. Hiertoe moet ieder element dat niet volledig is afgeschermd, afzonderlijk
      in werking gesteld of gestopt kunnen worden. 1.3.6. Risico’s in verband met verschillende
      bedrijfsomstandigheden Machines en verwante producten die bedoeld zijn om in verschillende
      omstandigheden te worden gebruikt, moeten zodanig zijn ontworpen en gebouwd dat deze
      gebruiksomstandigheden op veilige en betrouwbare wijze kunnen worden gekozen en ingesteld.
      1.3.7. Risico’s in verband met bewegende delen De bewegende delen van machines en verwante
      producten moeten zijn ontworpen en gebouwd om een risico op aanraking waardoor zich
      ongelukken zouden kunnen voordoen, te voorkomen, of moeten, wanneer risico’s blijven
      bestaan, voorzien zijn van afschermingen of beveiligingsinrichtingen. Alle nodige maatregelen
      moeten worden genomen om onverwachte blokkering van bewegende delen te voorkomen. Wanneer
      ondanks deze voorzorgsmaatregelen een grote kans bestaat dat een blokkering optreedt,
      moet er waar nodig voor worden gezorgd dat deze blokkering zonder gevaar kan worden
      verholpen met behulp van de nodige specifieke beveiligingsinrichtingen en gereedschappen.
      Deze specifieke beveiligingsinrichtingen moeten in de gebruiksaanwijzing en, indien
      mogelijk, op de machine of het verwante product zelf worden vermeld, met een beschrijving
      van de manier waarop ze moeten worden gebruikt. De voorkoming van een risico op aanraking
      die tot gevaarlijke situaties kan leiden en de psychische belasting die door het gebruik
      van de machine of het verwante product kan ontstaan, moet worden afgestemd op: a) het
      naast elkaar bestaan van mens en machine in een gedeelde ruimte zonder rechtstreekse
      samenwerking; b) de interactie tussen mens en machine. 1.3.8. Keuze van beveiliging
      tegen risico’s in verband met bewegende delen Afschermingen of beveiligingsinrichtingen
      die dienen ter bescherming tegen risico’s in verband met bewegende delen, moeten op
      basis van het soort risico worden gekozen. De volgende richtsnoeren moeten helpen bij
      het maken van deze keuze. 1.3.8.1. Risico’s in verband met bewegende overbrengingsorganen
      Afschermingen die dienen ter bescherming van personen tegen gevaren in verband met bewegende
      overbrengingsorganen, moeten: a) vaste afschermingen zijn als bedoeld in punt 1.4.2.1;
      of b) beweegbare afschermingen met vergrendeling zijn als bedoeld in punt 1.4.2.2. Als
      frequente toegang te verwachten is, moeten beweegbare afschermingen met vergrendeling
      worden gebruikt. 1.3.8.2. Bewegende delen voor bewerking Afschermingen of beveiligingsinrichtingen
      die dienen ter bescherming van personen tegen gevaren in verband met bewegende delen
      voor bewerking, moeten: a) vaste afschermingen zijn als bedoeld in punt 1.4.2.1; of
      b) beweegbare afschermingen met vergrendeling zijn als bedoeld in punt 1.4.2.2; of c)
      beveiligingsinrichtingen zijn als bedoeld in punt 1.4.3; of d) een combinatie zijn van
      bovenstaande elementen. Indien bepaalde bewegende delen voor bewerking echter niet volledig
      onbereikbaar kunnen worden gemaakt wanneer zij in werking zijn omdat een handeling van
      de bediener vereist is, moeten deze delen worden voorzien van: a) vaste afschermingen
      of beweegbare afschermingen met vergrendeling die de niet bij de werkzaamheden gebruikte
      delen onbereikbaar maken; en b) instelbare afschermingen als bedoeld in punt 1.4.2.3
      die de toegang beperken tot de bij de werkzaamheden gebruikte bewegende delen die bereikbaar
      moeten zijn. 1.3.9. Risico’s in verband met niet-gecontroleerde bewegingen Wanneer een
      deel van een machine of verwant product tot stilstand is gebracht, moet iedere verschuiving
      vanuit die stilstandpositie door ongeacht welke andere oorzaak dan het hanteren van
      de bedieningsorganen worden voorkomen of dusdanig geschieden dat zij geen gevaar vormt.
      1.4. Vereiste kenmerken van afschermingen en beveiligingsinrichtingen 1.4.1. Algemene
      eisen Afschermingen en beveiligingsinrichtingen: a) moeten stevig in elkaar zitten;
      b) moeten stevig op hun plaats worden gehouden; c) mogen geen nieuwe gevaren met zich
      meebrengen; d) mogen niet gemakkelijk omzeild of buiten werking gesteld kunnen worden;
      e) moeten ver genoeg van de gevarenzone verwijderd zijn; f) dienen het zicht op de werkzaamheden
      zo min mogelijk te belemmeren; en g) moeten essentiële werkzaamheden met betrekking
      tot de installatie en/of vervanging van apparatuur alsmede onderhoudswerkzaamheden mogelijk
      maken door de toegang te beperken tot uitsluitend het gedeelte waar de werkzaamheden
      moeten worden verricht, indien mogelijk zonder dat de afscherming hoeft te worden verwijderd
      of de beveiligingsinrichting hoeft te worden uitgeschakeld. Afschermingen moeten bovendien,
      voor zover mogelijk, bescherming bieden tegen vallende of uitgeworpen materialen of
      voorwerpen, alsook tegen emissies die door machines of verwante producten worden uitgestoten.
      1.4.2. Bijzondere eisen voor afschermingen 1.4.2.1. Vaste afschermingen Vaste afschermingen
      moeten zodanig zijn bevestigd dat zij alleen met behulp van gereedschap kunnen worden
      geopend of verwijderd. Bij demontage moeten de bevestigingsmiddelen met de afschermingen
      of met de machine of het verwante product verbonden blijven. Waar mogelijk moet ervoor
      worden gezorgd dat afschermingen niet zonder hun bevestigingsmiddelen op hun plaats
      kunnen blijven. 1.4.2.2. Beweegbare afschermingen met vergrendeling Beweegbare afschermingen
      met vergrendeling moeten: a) wanneer zij geopend zijn, zoveel mogelijk met de machine
      of het verwante product verbonden blijven; en b) zodanig worden ontworpen en gebouwd
      dat zij enkel met een opzettelijke handeling kunnen worden afgesteld. Beweegbare afschermingen
      met vergrendeling moeten vergezeld gaan van een vergrendelinrichting die: a) voorkomt
      dat de gevaarlijke functies van de machine of het verwante product in werking treden
      voordat die afscherming gesloten is; en b) een stopopdracht geeft wanneer die afscherming
      niet langer gesloten is. Indien de bediener de gevarenzone kan bereiken voordat het
      risico dat uit de gevaarlijke functies van de machine of het verwante product voortvloeit,
      is geweken, moeten de beweegbare afschermingen niet alleen met een vergrendelinrichting,
      maar ook met een voorziening voor het vergrendelen van de afscherming worden gecombineerd
      die: a) voorkomt dat de gevaarlijke functies van de machine of het verwante product
      in werking treden voordat de afscherming gesloten en vergrendeld is; en b) ervoor zorgt
      dat de afscherming gesloten en vergrendeld blijft totdat het risico op verwonding door
      de gevaarlijke functies van de machine of het verwante product is geweken. Beweegbare
      afschermingen met vergrendeling moeten zodanig worden ontworpen dat het ontbreken van
      of een defect aan een van de onderdelen het in werking stellen van de gevaarlijke functies
      van de machine of het verwante product verhindert of deze functies tot stilstand brengt.
      1.4.2.3. Afstelbare afschermingen die de toegang beperken Afstelbare afschermingen die
      de toegang beperken tot de bewegende delen die voor de werkzaamheden strikt noodzakelijk
      zijn, moeten: a) afhankelijk van de aard van de te verrichten werkzaamheden, handmatig
      of automatisch kunnen worden afgesteld; en b) gemakkelijk kunnen worden afgesteld zonder
      het gebruik van gereedschap. 1.4.3. Bijzondere eisen voor beveiligingsinrichtingen Beveiligingsinrichtingen
      moeten zodanig worden ontworpen en in het bedieningssysteem worden ingebouwd dat: a)
      bewegende delen niet in werking kunnen worden gesteld zolang zij binnen het bereik van
      de bediener zijn; b) bewegende delen niet door personen kunnen worden bereikt terwijl
      zij bewegen; en c) het ontbreken van of een defect aan een van de onderdelen het in
      werking stellen van de bewegende delen verhindert of de bewegende delen tot stilstand
      brengt. De beveiligingsinrichtingen mogen alleen met een opzettelijke handeling kunnen
      worden ingesteld. 1.5. Risico’s in verband met andere gevaren 1.5.1. Stroomvoorziening
      Indien machines of verwante producten een stroomvoorziening hebben, moeten zij zodanig
      zijn ontworpen, gebouwd en uitgerust dat alle gevaren in verband met elektriciteit worden
      of kunnen worden voorkomen. De veiligheidsdoelstellingen van Richtlijn 2014/35/EU zijn
      van toepassing op machines of verwante producten. Evenwel vallen de verplichtingen betreffende
      de conformiteitsbeoordeling en het in de handel brengen of de inbedrijfstelling van
      machines of verwante producten, wat betreft risico’s in verband met elektriciteit, uitsluitend
      onder de bepalingen van deze verordening. 1.5.2. Statische elektriciteit Machines en
      verwante producten moeten zodanig zijn ontworpen en gebouwd dat accumulatie van elektrostatische
      lading die een gevaar kan vormen, wordt voorkomen of beperkt, en/of zijn uitgerust met
      een ontladingssysteem. 1.5.3. Andere dan elektrische energievoorziening Indien machines
      of verwante producten door een andere energiebron dan elektriciteit worden aangedreven,
      moeten zij zodanig zijn ontworpen, gebouwd en uitgerust dat alle potentiële risico’s
      in verband met het gebruik van deze energiebronnen worden voorkomen. 1.5.4. Montagefouten
      Voor de hand liggende fouten bij het (opnieuw) monteren van bepaalde onderdelen, waardoor
      risico’s kunnen ontstaan, moeten door middel van het ontwerp en de bouw van deze onderdelen
      onmogelijk worden gemaakt, of anderszins door middel van aanwijzingen op de onderdelen
      zelf of op de behuizing daarvan. Dezelfde aanwijzingen moeten worden aangebracht op
      de bewegende delen of de behuizing daarvan indien men de richting van de beweging moet
      kennen om risico’s uit de weg te gaan. In voorkomend geval moet de gebruiksaanwijzing
      aanvullende informatie over deze risico’s bevatten. Indien incorrecte aansluiting risico’s
      met zich meebrengt, moeten incorrecte aansluitingen worden uitgesloten door middel van
      het ontwerp of, anderszins, door middel van aanwijzingen op de aan te sluiten elementen
      en, in voorkomend geval, op de aansluitingsmiddelen. 1.5.5. Extreme temperaturen Er
      moeten voorzieningen worden getroffen om elk risico op verwonding door aanraking van
      of geringe afstand tot onderdelen of materialen van machines of verwante producten met
      een hoge of zeer lage temperatuur te voorkomen. Tevens moeten de nodige voorzieningen
      worden getroffen om het risico op uitwerping van hete of zeer koude materialen te voorkomen
      of daartegen te beschermen. 1.5.6. Brand Machines en verwante producten moeten zodanig
      zijn ontworpen en gebouwd dat elk potentieel risico op brand of oververhitting van de
      machines of verwante producten zelf of door gassen, vloeistoffen, stofdeeltjes, dampen
      en andere door de machines of verwante producten geproduceerde of gebruikte stoffen,
      wordt vermeden. 1.5.7. Ontploffing Machines en verwante producten moeten zodanig zijn
      ontworpen en gebouwd dat de machines of verwante producten zelf en de gassen, vloeistoffen,
      stofdeeltjes, dampen en andere door de machines of verwante producten geproduceerde
      of gebruikte stoffen geen risico op ontploffing met zich meebrengen. Machines en verwante
      producten moeten, wat betreft het risico op ontploffing door gebruik in een omgeving
      met ontploffingsgevaar, in overeenstemming zijn met de bepalingen van de specifieke
      harmonisatiewetgeving van de Unie. 1.5.8. Geluid Machines en verwante producten moeten
      zodanig zijn ontworpen en gebouwd dat risico’s als gevolg van de emissie van luchtgeluid
      tot een minimum worden beperkt, rekening houdend met de technologische vooruitgang en
      de beschikbaarheid van middelen waarmee het geluid kan worden verminderd, in het bijzonder
      bij de bron. Voor de beoordeling van de geluidsemissiewaarde kan worden uitgegaan van
      vergelijkbare emissiegegevens voor soortgelijke machines en verwante producten. 1.5.9.
      Trillingen Machines en verwante producten moeten zodanig zijn ontworpen en gebouwd dat
      risico’s die voortvloeien uit door de machines of verwante producten veroorzaakte trillingen
      tot een minimum worden beperkt, rekening houdend met de technologische vooruitgang en
      de beschikbaarheid van middelen waarmee de trillingen kunnen worden verminderd, in het
      bijzonder bij de bron. Voor de beoordeling van de waarde van de geproduceerde trillingen
      kan worden uitgegaan van vergelijkbare emissiegegevens voor soortgelijke machines en
      verwante producten. 1.5.10. Straling De ongewenste emissie van straling van machines
      en verwante producten moet worden geëlimineerd of beperkt tot een niveau dat geen schadelijke
      gevolgen heeft voor personen. De emissie van functionele ioniserende straling moet worden
      beperkt tot het laagste niveau dat toereikend is voor de goede werking van machines
      en verwante producten tijdens de installatie, de werking en de reiniging ervan. In geval
      van risico’s moeten de nodige beschermingsmaatregelen worden genomen. De emissie van
      functionele niet-ioniserende straling die tijdens de installatie, werking of reiniging
      vrijkomt, moet worden beperkt tot een niveau dat geen schadelijke gevolgen heeft voor
      personen. 1.5.11. Uitwendige straling Machines en verwante producten moeten zodanig
      zijn ontworpen en gebouwd dat uitwendige straling de werking ervan niet kan verstoren.
      1.5.12. Laserstraling Bij gebruik van laserapparatuur moeten de volgende voorschriften
      in acht worden genomen: a) laserapparatuur op machines en verwante producten moet zodanig
      zijn ontworpen en gebouwd dat geen onopzettelijke straling kan vrijkomen; b) laserapparatuur
      op machines en verwante producten moet zodanig zijn beveiligd dat noch nuttige straling,
      noch straling door reflectie of diffusie, noch secundaire straling schade aan de gezondheid
      toebrengt; c) optische apparatuur voor de waarneming of afstelling van laserapparatuur
      op machines en verwante producten moet van dien aard zijn dat de vrijkomende laserstraling
      geen risico voor de gezondheid oplevert. 1.5.13. Uitstoot van gevaarlijke materialen
      en stoffen Machines en verwante producten moeten zodanig zijn ontworpen en gebouwd dat
      het risico op inademing, inslikken en contact met de huid, ogen en slijmvliezen van
      en doordringing van de huid door de gevaarlijke materialen en stoffen die zij produceren,
      wordt vermeden. Indien dergelijke gevaren niet kunnen worden geëlimineerd, moeten machines
      en verwante producten zijn uitgerust met voorzieningen om gevaarlijke materialen en
      stoffen op te vangen, af te vangen, af te zuigen, neer te slaan door waterverneveling,
      te filteren of met een andere, even doeltreffende methode te behandelen. Wanneer het
      werkproces niet in een volledig afgesloten ruimte plaatsvindt tijdens de normale werking
      van de machines en verwante producten, moeten de opvang-, afvang-, filtratie- of scheidings-
      en afzuigvoorzieningen zich op de plaats bevinden waar zij een zo groot mogelijk effect
      sorteren. 1.5.14. Risico om in een machine opgesloten te raken Machines en verwante
      producten moeten zijn ontworpen, gebouwd of uitgerust met een voorziening die voorkomt
      dat personen erin opgesloten kunnen raken of moeten, indien dit niet kan worden voorkomen,
      zijn voorzien van een middel waarmee om hulp kan worden gevraagd. 1.5.15. Risico op
      uitglijden, struikelen of vallen Delen van machines en verwante producten waaromtrent
      personen zich geregeld verplaatsen of waar zij geregeld staan, moeten zodanig zijn ontworpen
      en gebouwd dat personen niet kunnen uitglijden op, struikelen over of vallen op of van
      deze delen. Deze delen moeten in voorkomend geval zijn voorzien van vaste handgrepen
      die gebruikers in staat stellen hun stabiliteit te behouden. 1.5.16. Blikseminslag Machines
      en verwante producten die, wanneer zij gebruikt worden, tegen blikseminslag moeten worden
      beschermd, moeten voorzien zijn van een systeem om de opgevangen elektrische lading
      naar de aarde te geleiden. 1.6. Onderhoud 1.6.1. Onderhoud van machines en verwante
      producten De afstel- en onderhoudspunten moeten zich buiten de gevarenzones bevinden.
      Machines en verwante producten moeten kunnen worden afgesteld, onderhouden, gerepareerd
      en gereinigd en moeten een onderhoudsbeurt kunnen krijgen wanneer zij tot stilstand
      zijn gekomen. Indien om technische redenen niet aan een of meer van de bovenstaande
      voorwaarden kan worden voldaan, moeten maatregelen worden genomen om ervoor te zorgen
      dat deze verrichtingen veilig kunnen worden uitgevoerd (zie punt 1.2.5). Op geautomatiseerde
      machines en, waar nodig, op andere machines of verwante producten moet diagnostische
      foutopsporingsapparatuur kunnen worden aangesloten. Onderdelen van geautomatiseerde
      machines of verwante producten die regelmatig moeten worden vervangen, moeten gemakkelijk
      en veilig kunnen worden verwijderd en vervangen. Deze onderdelen moeten zodanig bereikbaar
      zijn dat de desbetreffende taken met de benodigde technische middelen en volgens een
      gespecificeerde werkwijze kunnen worden uitgevoerd. 1.6.2. Toegang tot bedienersposten
      en plaatsen waar onderhoudsbeurten worden verricht Machines en verwante producten moeten
      zodanig zijn ontworpen en gebouwd dat alle plaatsen waar tijdens de werking, de afstelling,
      het onderhoud en de reiniging ervan handelingen moeten worden verricht, veilig kunnen
      worden bereikt. In het geval van machines en verwante producten die betreden moeten
      worden om te worden bediend, afgesteld, onderhouden of gereinigd, moet de toegang groot
      genoeg en geschikt zijn voor het gebruik van reddingsmiddelen met het oog op de verlening
      van noodhulp aan personen. 1.6.3. Onderbreking van de energietoevoer Machines en verwante
      producten moeten voorzien zijn van inrichtingen waarmee de energietoevoer uit alle energiebronnen
      kan worden onderbroken. Deze inrichtingen moeten duidelijk te herkennen zijn. Zij moeten
      kunnen worden vergrendeld indien het opnieuw aansluiten van de machines of verwante
      producten personen in gevaar zou kunnen brengen. Deze inrichtingen moeten ook kunnen
      worden vergrendeld indien de bediener niet vanaf alle bereikbare plaatsen kan nagaan
      of de energietoevoer nog altijd onderbroken is. Bij machines en verwante producten die
      met behulp van een stekker van elektriciteit kunnen worden voorzien, volstaat het de
      stekker te verwijderen, mits de bediener vanaf alle bereikbare plaatsen kan nagaan of
      de stekker nog altijd verwijderd is. Nadat de energietoevoer is onderbroken, moet de
      in de stroomkringen van de machine of het verwante product resterende of opgeslagen
      energie kunnen worden afgevoerd zonder dat daarbij risico voor personen ontstaat. In
      afwijking van het voorschrift dat in bovenstaande alinea’s is neergelegd, mogen bepaalde
      stroomkringen aangesloten blijven op hun energiebron, bijvoorbeeld om bepaalde onderdelen
      op hun plaats te houden, bepaalde informatie te behouden of inwendige gedeelten te verlichten.
      In dit geval moeten speciale maatregelen worden getroffen om de veiligheid van de bediener
      te waarborgen. 1.6.4. Ingreep door de bediener Machines en verwante producten moeten
      zodanig zijn ontworpen, gebouwd en uitgerust dat de bediener slechts in beperkte mate
      hoeft in te grijpen. Wanneer de bediener toch moet ingrijpen, moet de ingreep gemakkelijk
      en veilig kunnen verlopen. 1.6.5. Reiniging van inwendige delen Machines en verwante
      producten moeten zodanig zijn ontworpen en gebouwd dat de inwendige delen ervan die
      voorheen gevaarlijke stoffen of mengsels bevatten, kunnen worden gereinigd zonder dat
      de inwendige delen betreden hoeven te worden; eventuele blokkering moet ook van buitenaf
      kunnen worden verholpen. Indien het betreden van de inwendige delen onvermijdelijk is,
      moeten de machines en verwante producten zodanig zijn ontworpen en gebouwd dat zij op
      een veilige manier kunnen worden gereinigd. 1.7. Informatie 1.7.1. Informatie en waarschuwingen
      op machines en verwante producten Informatie en waarschuwingen op machines en verwante
      producten moeten bij voorkeur worden verstrekt in de vorm van gemakkelijk te begrijpen
      symbolen of pictogrammen. Schriftelijke of verbale informatie en waarschuwingen moeten
      worden gesteld in een taal die de gebruikers gemakkelijk verstaan, zoals bepaald door
      de betrokken lidstaat. 1.7.1.1. Informatie en informatiesystemen De informatie die nodig
      is voor de bediening van machines en verwante producten, moet in een ondubbelzinnige
      en gemakkelijk te begrijpen vorm worden verstrekt. Deze informatie mag niet zo uitgebreid
      zijn dat te hoge eisen aan de bediener worden gesteld. Beeldschermen en andere interactieve
      middelen die bestemd zijn voor communicatie tussen de bediener en de machine of het
      verwante product, moeten gemakkelijk te begrijpen en te gebruiken zijn. 1.7.1.2. Waarschuwingssystemen
      Indien de gezondheid of veiligheid van personen in gevaar kan komen als gevolg van de
      gebrekkige werking van machines of verwante producten die zonder toezicht werken, moeten
      die machines en verwante producten zijn uitgerust met een inrichting die een passend
      geluids- of lichtsignaal afgeeft. Indien machines of verwante producten zijn uitgerust
      met een waarschuwingssysteem, moeten de signalen die daardoor worden afgegeven ondubbelzinnig
      zijn en gemakkelijk kunnen worden opgemerkt. De bediener moet te allen tijde kunnen
      nagaan of deze waarschuwingssystemen naar behoren functioneren. De voorschriften van
      de specifieke rechtshandelingen van de Unie inzake kleuren en veiligheidssignalen moeten
      in acht worden genomen. 1.7.2. Waarschuwing voor restrisico’s Indien er ondanks de maatregelen
      die eigen zijn aan een veilig ontwerp en de genomen en aanvullende beschermingsmaatregelen
      risico’s blijven bestaan, moet in de nodige waarschuwingen en waarschuwingssystemen
      worden voorzien. 1.7.3. Markeringen op machines en verwante producten In aanvulling
      op de in de artikelen 10 en 24 vastgestelde markeringseisen moeten op machines en verwante
      producten zichtbare, duidelijk leesbare en onuitwisbare markeringen worden aangebracht.
      Machines en verwante producten die onder de hoofdstukken 2 tot en met 6 van deze bijlage
      vallen, moeten ook overeenkomstig de in die hoofdstukken vastgestelde aanvullende eisen
      worden gemarkeerd. Indien een machine of verwant product is ontworpen en gebouwd om
      gebruikt te worden in een omgeving met ontploffingsgevaar, moet dit eveneens worden
      vermeld. Op machines en verwante producten moet bovendien volledige informatie worden
      vermeld over het type machine of verwant product, alsook essentiële informatie voor
      het veilige gebruik ervan. Deze informatie is onderworpen aan de in punt 1.7.1 opgenomen
      eisen. Indien tijdens het gebruik van een machine of verwant product een onderdeel moet
      worden verplaatst met behulp van hijs- of hefwerktuigen, moet de massa van dit onderdeel
      leesbaar, onuitwisbaar en ondubbelzinnig worden aangegeven. 1.7.4. Gebruiksaanwijzing
      In aanvulling op de in artikel 10, lid 7, vastgestelde verplichtingen moet een gebruiksaanwijzing
      worden opgesteld, zoals hieronder uiteengezet. In afwijking van artikel 10, lid 7, hoeven
      onderhoudsinstructies die bestemd zijn voor gespecialiseerd personeel dat voor de fabrikant
      of de gemachtigde van de fabrikant werkt, slechts in één van de door dat personeel begrepen
      officiële talen van de Unie te worden verstrekt. 1.7.4.1. Algemene beginselen voor de
      opstelling van de gebruiksaanwijzing a) In de inhoud van de gebruiksaanwijzing mag niet
      alleen worden uitgegaan van het beoogde gebruik van machines en verwante producten,
      maar moet tevens rekening worden gehouden met elk redelijkerwijs voorzienbaar verkeerd
      gebruik daarvan. b) Indien machines of verwante producten bestemd zijn voor gebruik
      door niet-professionele bedieners, moet bij de formulering en presentatie van de gebruiksaanwijzing
      rekening worden gehouden met het algemene opleidingsniveau en inzicht dat redelijkerwijs
      van deze bedieners kan worden verwacht. 1.7.4.2. Inhoud van de gebruiksaanwijzing 1.
      De gebruiksaanwijzing moet, indien van toepassing, ten minste de volgende informatie
      bevatten: a) de firmanaam en het volledige adres van de fabrikant en, indien van toepassing,
      de gemachtigde van de fabrikant; b) de typeaanduiding van de machine of het verwante
      product als aangegeven op de machine of het verwante product zelf, met uitzondering
      van het serienummer (zie punt 1.7.3); c) de EU-conformiteitsverklaring of het internetadres
      of de machineleesbare code waar de EU-conformiteitsverklaring kan worden geraadpleegd,
      overeenkomstig artikel 10, lid 8; d) een algemene beschrijving van de machine of het
      verwante product; e) de tekeningen, schema’s, beschrijvingen en toelichtingen die nodig
      zijn om de machine of het verwante product te gebruiken, te onderhouden en te repareren,
      en om de correcte werking ervan te controleren; f) een beschrijving van de werkplek(ken)
      die de bedieners naar alle waarschijnlijkheid zullen innemen; g) een beschrijving van
      het beoogde gebruik van de machine of het verwante product; h) waarschuwingen betreffende
      te ontraden gebruik dat, naar uit ervaring is gebleken, van de machine of het verwante
      product kan worden gemaakt; i) instructies voor de montage, installatie en aansluiting
      van de machine of het verwante product, met inbegrip van tekeningen, schema’s en bevestigingsmiddelen,
      alsmede de aanduiding van het chassis of de installatie waarop de machine of het verwante
      product moet worden gemonteerd; j) instructies voor een zodanige installatie en montage
      dat geluid of trillingen worden beperkt; k) instructies voor de inbedrijfstelling en
      het gebruik van de machine of het verwante product, en zo nodig instructies voor de
      opleiding van bedieners; l) informatie over de restrisico’s die ondanks de geïntegreerde
      veiligheid bij ontwerp en de genomen en aanvullende beschermingsmaatregelen blijven
      bestaan; m) instructies betreffende de door de gebruiker te nemen beschermende maatregelen,
      waaronder, in voorkomend geval, de persoonlijke beschermingsmiddelen waarin moet worden
      voorzien; n) de essentiële kenmerken van apparatuur die op de machine of het verwante
      product kan worden gemonteerd; o) de voorwaarden waaronder de machine of het verwante
      product voldoet aan de stabiliteitseis tijdens gebruik, vervoer, montage, demontage,
      wanneer de machine of het verwante product buiten bedrijf is, tijdens tests en bij voorzienbare
      storingen; p) instructies met het oog op het veilig vervoeren, verplaatsen en opslaan,
      met vermelding van de massa van de machine of het verwante product en van de verschillende
      onderdelen ervan, indien deze regelmatig afzonderlijk moeten worden vervoerd; q) de
      te volgen werkwijze bij ongevallen of storingen; indien er een grote kans op blokkering
      bestaat, de werkwijze om de blokkering van de apparatuur zonder risico te verhelpen;
      r) de beschrijving van de afstellings- en onderhoudswerkzaamheden die de gebruiker moet
      verrichten alsook van het in acht te nemen preventieve onderhoud, waarbij rekening moet
      worden gehouden met het ontwerp en het gebruik van de machine of het verwante product;
      s) instructies met het oog op het veilig afstellen en onderhouden van de machine of
      het verwante product, met inbegrip van de daarbij te nemen beschermingsmaatregelen;
      t) specificaties betreffende de te gebruiken vervangingsonderdelen, indien deze van
      invloed zijn op de gezondheid en de veiligheid van de bedieners; u) de volgende informatie
      over de emissie van luchtgeluid: i) het A-gewogen geluidsdrukniveau van de emissie op
      de werkplekken, wanneer deze meer dan 70 dB(A) bedraagt; wanneer deze waarde niet meer
      dan 70 dB(A) bedraagt, moet dit worden vermeld; ii) de maximale waarde van de C-gewogen
      momentane geluidsemissiedruk op de werkplekken, wanneer deze meer dan 63 Pa bedraagt
      (130 dB ten opzichte van 20 μPa); iii) het A-gewogen geluidsvermogen dat door de machine
      of het verwante product wordt geproduceerd, wanneer de A-gewogen geluidsemissiedruk
      op de werkplekken meer dan 80 dB(A) bedraagt. Deze waarden moeten voor de betreffende
      machine of het betreffende verwante product daadwerkelijk worden gemeten, dan wel worden
      vastgesteld op basis van metingen die zijn verricht bij een technisch vergelijkbare
      machine die of een technisch vergelijkbaar verwant product dat typerend is voor de te
      produceren machine of het te produceren verwante product. Indien een machine of verwant
      product zeer grote afmetingen heeft, kan de aanduiding van het A-gewogen geluidsvermogen
      worden vervangen door de aanduiding van de A-gewogen geluidsemissiedruk op gespecificeerde
      plekken rondom de machine of het verwante product. Wanneer de geharmoniseerde normen
      of de door de Commissie overeenkomstig artikel 20, lid 3, vastgestelde gemeenschappelijke
      specificaties niet kunnen worden toegepast, moeten de geluidswaarden worden gemeten
      met de voor de betreffende machine of het betreffende verwante product meest geschikte
      meetnorm. Indien geluidsemissiewaarden worden vermeld, moeten de onzekerheidsfactoren
      in verband met deze waarden worden gespecificeerd. De bedrijfsomstandigheden van de
      machine of het verwante product tijdens de metingen en de voor de metingen gebruikte
      methoden moeten worden beschreven. Indien de werkplek(ken) niet is/zijn bepaald of niet
      kan/kunnen worden bepaald, moet de meting van het A-gewogen geluidsdrukniveau worden
      verricht op 1 m van het oppervlak van de machine of het verwante product en 1,60 m boven
      het grondvlak of het toegangsplatform. De positie en de waarde van de maximale geluidsdruk
      moeten worden aangegeven. Met betrekking tot geluiddempende machines of verwante producten
      moet in de gebruiksaanwijzing in voorkomend geval worden gespecificeerd hoe die apparatuur
      correct moet worden gemonteerd en geïnstalleerd (zie ook punt 1.7.4.2, punt 1, j)).
      Indien in specifieke rechtshandelingen van de Unie andere voorschriften zijn neergelegd
      voor het meten van het geluidsdruk- of geluidsvermogenniveau, moeten die rechtshandelingen
      worden toegepast en zijn de desbetreffende bepalingen van dit punt niet van toepassing;
      v) informatie over de voorzorgsmaatregelen, voorzieningen en middelen die nodig zijn
      om personen onmiddellijk en voorzichtig te kunnen redden; w) indien een grote kans bestaat
      dat uit de machine of het verwante product niet-ioniserende straling zal vrijkomen die
      gevaarlijk kan zijn voor personen, en met name voor personen met actieve of niet-actieve
      medische implantaten, informatie over de hoeveelheid straling waaraan de bediener en
      andere personen worden blootgesteld; x) indien vanwege het ontwerp van de machine of
      het verwante product emissies van gevaarlijke stoffen uit de machine of het verwante
      product kunnen vrijkomen, de kenmerken van de afvang-, filtratie- of afvoervoorzieningen
      indien de machine of het verwante product niet met dergelijke voorzieningen is uitgerust,
      alsmede de volgende informatie: i) het debiet van de emissie van gevaarlijke materialen
      en stoffen uit de machine of het verwante product; ii) het gehalte aan gevaarlijke materialen
      of stoffen in de omgeving van de machine of het verwante product die afkomstig zijn
      van de machine of het verwante product of van materialen of stoffen die met de machine
      of het verwante product worden gebruikt; iii) de doeltreffendheid van de afvang- of
      filtratievoorzieningen en de voorwaarden waaraan moet worden voldaan om de doeltreffendheid
      daarvan in de loop van de tijd te handhaven. De in de eerste alinea genoemde waarden
      moeten voor de betreffende machine of het betreffende verwante product daadwerkelijk
      worden gemeten, dan wel worden vastgesteld op basis van metingen die zijn verricht bij
      een technisch vergelijkbare machine die of een technisch vergelijkbaar verwant product
      dat naar de stand van de techniek is vervaardigd. 1.7.5. Verkoopdocumentatie Verkoopdocumentatie
      waarin machines of verwante producten worden beschreven, mag niet in tegenspraak zijn
      met de gebruiksaanwijzing inzake gezondheids- en veiligheidsaspecten. Verkoopdocumentatie
      waarin de prestatiekenmerken van machines of verwante producten worden beschreven, moet
      dezelfde gegevens over emissies bevatten als de gebruiksaanwijzing. 2. AANVULLENDE ESSENTIËLE
      GEZONDHEIDS- EN VEILIGHEIDSEISEN VOOR BEPAALDE CATEGORIEËN MACHINES EN VERWANTE PRODUCTEN
      Machines en verwante producten voor de verwerking van levensmiddelen, machines en verwante
      producten voor de verwerking van cosmetica of farmaceutische producten, draagbare machines
      en verwante producten die met de hand worden vastgehouden of met de hand worden geleid,
      draagbare bevestigingswerktuigen en andere slagwerktuigen en verwante producten, alsook
      machines en verwante producten voor de bewerking van hout en materiaal met gelijkaardige
      fysieke kenmerken en machines en verwante producten voor het aanbrengen van gewasbeschermingsmiddelen
      moeten aan alle in dit hoofdstuk opgenomen essentiële gezondheids- en veiligheidseisen
      voldoen (zie algemene beginselen, punt 4). 2.1. Machines en verwante producten voor
      de verwerking van levensmiddelen en machines en verwante producten voor de verwerking
      van cosmetica en farmaceutische producten 2.1.1. Algemeen Machines en verwante producten
      voor de verwerking van levensmiddelen en machines en verwante producten voor de verwerking
      van cosmetica en farmaceutische producten moeten zodanig zijn ontworpen en gebouwd dat
      risico’s op infectie, ziekte en besmetting worden voorkomen. Hierbij moet aan de volgende
      eisen worden voldaan: a) materialen die met levensmiddelen, voor menselijke consumptie
      bestemd water, cosmetica of farmaceutische producten in aanraking komen of bedoeld zijn
      om daarmee in aanraking te komen, moeten voldoen aan de voorwaarden die in de desbetreffende
      rechtshandelingen van de Unie zijn neergelegd; de gebruikte machines en verwante producten
      moeten zodanig zijn ontworpen en gebouwd dat deze materialen voor elk gebruik gereinigd
      kunnen worden; indien dit niet mogelijk is, moeten wegwerponderdelen worden gebruikt;
      b) alle oppervlakken, met uitzondering van de oppervlakken van wegwerponderdelen, die
      met levensmiddelen, voor menselijke consumptie bestemd water, cosmetica of farmaceutische
      producten in aanraking komen, moeten: i) glad zijn en mogen geen ribbels of spleten
      bevatten waarin zich organisch materiaal kan ophopen; dit geldt ook voor de verbindingen
      tussen twee oppervlakken; ii) zodanig zijn ontworpen en gebouwd dat uitstekende delen,
      randen en uitsparingen voor montage tot een minimum zijn beperkt; iii) gemakkelijk gereinigd
      en gedesinfecteerd kunnen worden, indien nodig na verwijdering van gemakkelijk te demonteren
      onderdelen; inwendige oppervlakken moeten gebogen zijn en een straal hebben die groot
      genoeg is om grondige reiniging mogelijk te maken; c) uit levensmiddelen, cosmetica
      of farmaceutische producten en uit reinigings-, ontsmettings- en spoelmiddelen afkomstige
      vloeistoffen, gassen en aerosolen moeten volledig uit de machines of verwante producten
      kunnen worden afgevoerd (indien mogelijk door middel van een “reinigingsstand”); d)
      de machines en verwante producten moeten zodanig zijn ontworpen en gebouwd dat infiltratie
      van stoffen, binnendringing door levende wezens, met name door insecten, en ophoping
      van organisch materiaal in delen die niet gereinigd kunnen worden, wordt voorkomen;
      e) de machines en verwante producten moeten zodanig zijn ontworpen en gebouwd dat hulpmiddelen,
      met inbegrip van de gebruikte smeermiddelen, die een gevaar vormen voor de gezondheid,
      niet met levensmiddelen of voor menselijke consumptie bestemd water, cosmetica of farmaceutische
      producten in aanraking kunnen komen; waar nodig moeten de machines en verwante producten
      zodanig zijn ontworpen en gebouwd dat kan worden nagegaan of voortdurend aan deze eis
      wordt voldaan. 2.1.2. Gebruiksaanwijzing In de gebruiksaanwijzing voor machines en verwante
      producten voor de verwerking van levensmiddelen en machines en verwante producten voor
      de verwerking van cosmetica en farmaceutische producten moeten de aanbevolen producten
      en methoden worden vermeld voor het reinigen, desinfecteren en afspoelen ervan; niet
      alleen van de delen die gemakkelijk te bereiken zijn, maar ook van de delen die onbereikbaar
      zijn of beter niet kunnen worden bereikt. 2.2. Draagbare machines en verwante producten
      die met de hand worden vastgehouden of met de hand worden geleid 2.2.1. Algemeen Draagbare
      machines en verwante producten die met de hand worden vastgehouden of met de hand worden
      geleid: a) moeten afhankelijk van het type machine of verwant product een steunvlak
      hebben dat groot genoeg is en genoeg zodanig aangebrachte handvatten en steunen van
      gepast formaat hebben dat de stabiliteit van de machine of het verwante product in de
      beoogde bedrijfsomstandigheden verzekerd is; b) moeten, tenzij dit technisch onmogelijk
      is of indien er sprake is van een onafhankelijk bedieningsorgaan en de handvatten niet
      volkomen veilig kunnen worden losgelaten, voorzien zijn van handmatige bedieningsorganen
      voor het in werking stellen en stopzetten van de machine of het verwante product, die
      zodanig zijn aangebracht dat zij door de bediener bediend kunnen worden zonder dat de
      handvatten hoeven te worden losgelaten; c) mogen geen risico met zich meebrengen op
      het onopzettelijk in werking stellen of in werking blijven van de machine of het verwante
      product nadat de handvatten door de bediener zijn losgelaten; indien deze eis technisch
      onhaalbaar is, moeten gelijkwaardige voorzieningen worden getroffen; d) moeten, waar
      nodig, zicht bieden op de gevarenzone en de werking van de apparatuur en het materiaal
      dat daarmee wordt bewerkt; e) moeten beschikken over een voorziening of een aangesloten
      uitlaatsysteem met een extractieaansluiting of een gelijkwaardig systeem voor het afvangen
      of beperken van emissies van gevaarlijke stoffen; deze eis is niet van toepassing indien
      daardoor een nieuw gevaar tot stand komt noch indien de voornaamste functie van de machine
      of het verwante product het aanbrengen van gevaarlijke stoffen is, en is evenmin van
      toepassing op emissies uit inwendige verbrandingsmotoren; f) moeten zodanig worden ontworpen
      en gebouwd dat de handvatten van de draagbare machine of het verwante draagbare product
      het in werking stellen en stopzetten van de machine of het verwante product eenvoudig
      maken. 2.2.1.1. Gebruiksaanwijzing De gebruiksaanwijzing moet de volgende informatie
      bevatten over de trillingen, uitgedrukt als versnelling (m/s²), die worden overgebracht
      door draagbare machines of verwante producten die met de hand worden vastgehouden of
      met de hand worden geleid: a) de totale waarde van de trillingen waaraan het hand-armstelsel
      wordt blootgesteld als gevolg van continue trillingen; b) de gemiddelde waarde van de
      piekamplitude van de versnelling ten gevolge van herhaalde schoktrillingen waaraan het
      hand-armstelsel wordt blootgesteld; c) de onzekerheid van beide metingen. De in de eerste
      alinea genoemde waarden moeten voor de betreffende machine of het betreffende verwante
      product daadwerkelijk worden gemeten, dan wel worden vastgesteld op basis van metingen
      die zijn verricht bij een technisch vergelijkbare machine die of een technisch vergelijkbaar
      verwant product dat naar de stand van de techniek is vervaardigd. Wanneer de geharmoniseerde
      normen of de door de Commissie overeenkomstig artikel 20, lid 3, vastgestelde gemeenschappelijke
      specificaties niet kunnen worden toegepast, moeten de trillingen worden gemeten met
      de voor de betreffende machine of het betreffende verwante product meest geschikte meetcode.
      De bedrijfsomstandigheden van de machine tijdens de metingen en de voor de metingen
      gebruikte methoden, of de referentie van de toegepaste geharmoniseerde norm moeten worden
      gespecificeerd. 2.2.2. Draagbare bevestigings- en andere slagwerktuigen of verwante
      producten 2.2.2.1. Algemeen Draagbare bevestigings- en andere slagwerktuigen of verwante
      producten moeten zodanig zijn ontworpen en gebouwd dat: a) de overbrenging van energie
      naar het beslagen element plaatsvindt via een intermediair onderdeel dat niet van het
      werktuig loslaat; b) de slag door een vrijgavevoorziening wordt voorkomen indien de
      machine of het verwante product onjuist op het basismateriaal is geplaatst en indien
      onvoldoende druk wordt uitgeoefend; c) ongewilde inwerkingstelling wordt voorkomen;
      indien nodig moeten met de vrijgave- en bedieningsvoorziening een serie handelingen
      worden verricht om de slag teweeg te brengen; d) ongewilde inwerkingstelling tijdens
      het verplaatsen of bij schokken wordt voorkomen; e) toevoer- en afvoerhandelingen gemakkelijk
      en veilig kunnen worden verricht. Indien nodig, moet het werktuig kunnen worden voorzien
      van (een) door de fabrikant van de machine of het verwante product te verstrekken splinterscherm(en).
      2.2.2.2. Gebruiksaanwijzing De gebruiksaanwijzing moet de nodige informatie bevatten
      over: a) toebehoren en verwisselbare uitrustingsstukken die met de machine of het verwante
      product kunnen worden gebruikt; b) passende bevestigings- of andere slagelementen die
      met de machine of het verwante product kunnen worden gebruikt; c) in voorkomend geval,
      de te gebruiken geschikte patronen. 2.3. Machines en verwante producten voor de bewerking
      van hout en materialen met gelijkaardige fysieke kenmerken Machines en verwante producten
      voor de bewerking van hout en materialen met gelijkaardige fysieke kenmerken moeten
      aan de volgende eisen voldoen: a) de machines en verwante producten moeten zodanig zijn
      ontworpen, gebouwd of uitgerust dat het te bewerken stuk veilig kan worden geplaatst
      en geleid; indien het stuk met de hand op een werkbank wordt gehouden, moet de werkbank
      tijdens de bewerking voldoende stabiliteit bieden en mag zij de verplaatsing van het
      stuk niet belemmeren; b) indien een grote kans bestaat dat de machines of verwante producten
      worden gebruikt in omstandigheden waarbij stukken in hun geheel of gedeeltelijk kunnen
      worden uitgeworpen, moeten de machines en verwante producten zodanig zijn ontworpen,
      gebouwd of uitgerust dat uitwerping wordt voorkomen of, indien dit niet mogelijk is,
      dat uitgeworpen materiaal geen gevaar vormt voor de bediener en/of andere blootgestelde
      personen; c) de machines en verwante producten moeten zijn uitgerust met een automatische
      rem die het werktuig binnen voldoende korte tijd tot stilstand brengt wanneer het risico
      bestaat dat het werktuig wordt aangeraakt terwijl het vertraagt; d) wanneer het werktuig
      deel uitmaakt van een niet geheel automatische machine of een niet geheel automatisch
      verwant product, moet deze machine of dit verwante product zodanig zijn ontworpen en
      gebouwd dat het risico op letsel door een ongeval wordt voorkomen of verlaagd. 2.4.
      Machines en verwante producten voor het aanbrengen van gewasbeschermingsmiddelen 2.4.1.
      Voor de toepassing van punt 2.4. wordt verstaan onder: “machines en verwante producten
      voor het aanbrengen van gewasbeschermingsmiddelen”: machines of verwante producten die
      specifiek bedoeld zijn voor het aanbrengen van gewasbeschermingsmiddelen in de zin van
      artikel 2, lid 1, van Verordening (EG) nr. 1107/2009 van het Europees Parlement en de
      Raad . 2.4.2. Algemeen De fabrikant van machines en verwante producten voor het aanbrengen
      van gewasbeschermingsmiddelen of de gemachtigde van deze fabrikant zorgt ervoor dat
      een beoordeling wordt uitgevoerd van het risico op onopzettelijke blootstelling van
      het milieu aan gewasbeschermingsmiddelen, in overeenstemming met de in punt 1 van de
      algemene beginselen bedoelde risicobeoordelings- en risicobeperkingsprocedure. Bij het
      ontwerp en de bouw van machines en verwante producten voor het aanbrengen van gewasbeschermingsmiddelen
      moet rekening worden gehouden met de resultaten van de in de eerste alinea bedoelde
      risicobeoordeling, zodat de machines en verwante producten kunnen worden bediend, afgesteld
      en onderhouden zonder dat het milieu daarbij onopzettelijk aan gewasbeschermingsmiddelen
      wordt blootgesteld. Lekkage moeten te allen tijde worden voorkomen. 2.4.3. Controle
      en monitoring Het aanbrengen van gewasbeschermingsmiddelen moet vanaf de bedienersposten
      op eenvoudige en nauwkeurige manier kunnen worden gecontroleerd en gemonitord en onmiddellijk
      kunnen worden stopgezet. 2.4.4. Vullen en legen De machines en verwante producten moeten
      zodanig zijn ontworpen en gebouwd dat zij gemakkelijk en nauwkeurig met de benodigde
      hoeveelheid gewasbeschermingsmiddelen kunnen worden gevuld en tevens gemakkelijk en
      volledig kunnen worden geleegd, waarbij morsen van gewasbeschermingsmiddelen en verontreiniging
      van de waterbron tijdens deze handelingen worden voorkomen. 2.4.5. Aanbrengen van gewasbeschermingsmiddelen
      2.4.5.1. Dosering De machines en verwante producten moeten zijn uitgerust met een voorziening
      waarmee de dosering gemakkelijk, nauwkeurig en op betrouwbare wijze kan worden afgestemd.
      2.4.5.2. Verspreiding, afzetting en drift van gewasbeschermingsmiddelen De machines
      en verwante producten moeten zodanig zijn ontworpen en gebouwd dat gewasbeschermingsmiddelen
      over de doelgebieden worden verspreid, verliezen op andere gebieden tot een minimum
      worden beperkt en drift van gewasbeschermingsmiddelen in het milieu wordt voorkomen.
      In voorkomend geval moet worden gezorgd voor een gelijkmatige verspreiding en homogene
      afzetting. 2.4.5.3. Tests Om te verifiëren of de relevante onderdelen van de machines
      en verwante producten aan de eisen van de punten 2.4.5.1 en 2.4.5.2 voldoen, moet de
      fabrikant voor elk type machine en verwant product in kwestie passende tests verrichten
      of laten verrichten. 2.4.5.4. Verliezen bij stilstand De machines en verwante producten
      moeten zodanig zijn ontworpen en gebouwd dat verlies van gewasbeschermingsmiddelen wordt
      voorkomen wanneer de aanbrengfunctie wordt uitgeschakeld. 2.4.6. Onderhoud 2.4.6.1.
      Reiniging De machines en verwante producten moeten zodanig zijn ontworpen en gebouwd
      dat zij gemakkelijk en grondig kunnen worden gereinigd zonder dat het milieu daarbij
      wordt verontreinigd. 2.4.6.2. Onderhoudsbeurten De machines en verwante producten moeten
      zodanig zijn ontworpen en gebouwd dat versleten onderdelen gemakkelijk kunnen worden
      vervangen zonder dat het milieu daarbij wordt verontreinigd. 2.4.7. Inspecties De nodige
      meetinstrumenten moeten gemakkelijk op de machines en verwante producten kunnen worden
      aangesloten om de correcte werking van de machines en verwante producten te controleren.
      2.4.8. Markering van spuitdoppen, zeven en filters Spuitdoppen, zeven en filters moeten
      gemarkeerd worden zodat duidelijk is om welk type en om welke maat het gaat. 2.4.9.
      Aanduiding van het gebruikte gewasbeschermingsmiddel In voorkomend geval moeten de machines
      en verwante producten een specifieke plaats hebben waar de bediener de naam kan aanbrengen
      van het gewasbeschermingsmiddel dat op het betreffende moment in gebruik is. 2.4.10.
      Gebruiksaanwijzing De gebruiksaanwijzing moet de volgende informatie bevatten: a) de
      voorzorgsmaatregelen die bij het mengen, laden, aanbrengen, legen en reinigen, alsook
      bij onderhoudsbeurten en vervoer moeten worden genomen om verontreiniging van het milieu
      te voorkomen; b) gedetailleerde gebruiksomstandigheden voor de verschillende beoogde
      gebruiksomgevingen, met inbegrip van de daarmee gepaard gaande voorbereiding en de vereiste
      afstelling om ervoor te zorgen dat het gewasbeschermingsmiddel wordt afgezet op de doelgebieden,
      dat verliezen op andere gebieden tot een minimum worden beperkt en dat drift van pesticiden
      in het milieu wordt voorkomen, en, in voorkomend geval, om te zorgen voor de gelijkmatige
      verspreiding en homogene afzetting van het gewasbeschermingsmiddel; c) de verschillende
      typen en maten van spuitdoppen, zeven en filters die met de machine of het verwante
      product kunnen worden gebruikt; d) de frequentie van de controles van en de criteria
      en methode voor de vervanging van onderdelen die aan slijtage onderhevig zijn, zoals
      spuitdoppen, zeven en filters, en de correcte werking van de machine of het verwante
      product kunnen beïnvloeden; e) de specificatie van de kalibratie, het dagelijks onderhoud,
      de voorbereiding voor de winter en andere controles die nodig zijn om de correcte werking
      van de machine of het verwante product te garanderen; f) de typen gewasbeschermingsmiddelen
      die kunnen leiden tot een incorrecte werking van de machine of het verwante product;
      g) de boodschap dat de bediener te allen tijde op de in punt 2.4.9 bedoelde specifieke
      plaats de naam moet aanbrengen van het gewasbeschermingsmiddel dat op het betreffende
      moment in gebruik is; h) de aansluiting en het gebruik van speciale apparatuur of toebehoren,
      en de noodzakelijke voorzorgsmaatregelen die getroffen moeten worden; i) de boodschap
      dat de machine of het verwante product onderworpen kan zijn aan nationale eisen betreffende
      regelmatige inspectie door bevoegde instanties, zoals is vastgelegd in Richtlijn 2009/128/EG
      van het Europees Parlement en de Raad ; j) de onderdelen van de machine of het verwante
      product die geïnspecteerd moeten worden om de correcte werking van de machine of het
      verwante product te waarborgen; k) instructies voor de aansluiting van de nodige meetinstrumenten.
      3. AANVULLENDE ESSENTIËLE VEILIGHEIDS- EN GEZONDHEIDSEISEN OM DE RISICO’S IN VERBAND
      MET DE MOBILITEIT VAN MACHINES OF VERWANTE PRODUCTEN TE VERHELPEN Machines en verwante
      producten waaraan risico’s in verband met de mobiliteit verbonden zijn, moeten aan alle
      in dit hoofdstuk opgenomen essentiële veiligheids- en gezondheidseisen voldoen (zie
      Algemene beginselen, punt 4). 3.1. Algemeen 3.1.1. Voor de toepassing van dit punt wordt
      verstaan onder: a) “machines of verwante producten waaraan risico’s verbonden zijn in
      verband met de mobiliteit ervan”: i) machines of verwante producten waarvan de werking
      hetzij een mobiliteit bij het werk hetzij een continue of halfcontinue verplaatsing
      langs een reeks vaste werklocaties vereist; of ii) machines of verwante producten die
      zonder verplaatsing werken, maar die voorzien kunnen zijn van middelen om ze gemakkelijker
      te verplaatsen van de ene plaats naar de andere; b) “bestuurder”: een bediener die belast
      is met het verplaatsen van een machine of verwant product, die hetzij door de machine
      wordt meegevoerd, hetzij de machine te voet begeleidt, hetzij de machine op afstand
      bedient; c) “autonome mobiele machine”: een mobiele machine met een autonome modus waarin
      alle essentiële veiligheidsfuncties van de mobiele machine in het bewegings- en werkgebied
      ervan zijn gewaarborgd zonder permanente interactie van een bediener; d) “toezichthouder”:
      een persoon die verantwoordelijk is voor het toezicht op autonome mobiele machines;
      e) “toezichtfunctie”: niet-permanente bewaking op afstand van autonome mobiele machines
      door middel van een inrichting waarmee informatie of waarschuwingen kunnen worden ontvangen
      en beperkte opdrachten aan deze machines kunnen worden gegeven. 3.2. Werkplekken 3.2.1.
      Bestuurdersplaats Het zicht vanaf de bestuurdersplaats moet zodanig zijn dat de bestuurder
      de machine of het verwante product met de gereedschappen daarvan in de redelijkerwijs
      voorzienbare werkomstandigheden veilig kan laten werken zonder dat de bediener of andere
      personen aan gevaar worden blootgesteld. Indien nodig moeten risico’s wegens ontoereikend
      direct zicht met behulp van passende middelen worden weggenomen. De machine of het verwante
      product waarop de bestuurder wordt meegevoerd, moet zo zijn ontworpen en gebouwd dat
      er vanaf de bestuurdersplaats geen risico bestaat dat de bestuurder onopzettelijk met
      de wielen of rupsbanden in aanraking komt. Indien de afmetingen dit toelaten en dit
      de risico’s niet vergroot, moet de bestuurdersplaats van een met de machine meegevoerde
      bestuurder zodanig zijn ontworpen en gebouwd dat zij met een cabine kan worden uitgerust.
      De cabine moet een ruimte bevatten waar de gebruiksaanwijzing voor de bestuurder kan
      worden opgeborgen. 3.2.2. Zitplaatsen Als het risico bestaat dat door de machine meegevoerde
      bedieners of andere personen bij kanteling of omslaan bekneld kunnen raken tussen de
      delen van de machine en de omgeving, met name in geval van machines die zijn uitgerust
      met een beschermende structuur als bedoeld in punt 3.4.3 of punt 3.4.4: a) moet de machine
      voorzien zijn van of uitgerust worden met een beveiligingssysteem dat de personen op
      hun zitplaats of in de beschermende structuur houdt zonder de noodzakelijke handelingen
      bij het werk of de bewegingen ten opzichte van de structuur als gevolg van de vering
      van de zitplaats te belemmeren; als er een aanzienlijk risico bestaat op kantelen of
      omslaan en het beveiligingssysteem van de machine niet wordt gebruikt, mag de machine
      niet kunnen bewegen; dergelijke beveiligingssystemen moeten rekening houden met ergonomische
      beginselen en mogen niet geplaatst worden als daardoor het risico wordt vergroot; b)
      moet op de bestuurdersplaats worden voorzien in een visueel en akoestisch signaal dat
      de bestuurder waarschuwt wanneer de bestuurder zich op de bestuurdersplaats bevindt
      en het beveiligingssysteem niet gebruikt. 3.2.3. Plaatsen voor andere personen Indien
      in verband met de gebruiksomstandigheden voorzien wordt dat af en toe of regelmatig
      ook andere personen dan de bestuurder op de machine meegevoerd zullen worden of ermee
      werken, moeten daarvoor passende plaatsen worden voorzien die het vervoer of het werk
      zonder risico mogelijk maken. De tweede en derde alinea van punt 3.2.1 zijn ook van
      toepassing op plaatsen voorzien voor andere personen dan de bestuurder. 3.2.4. Toezichtfunctie
      In voorkomend geval moeten autonome mobiele machines of verwante producten over een
      voor de autonome modus specifieke toezichtfunctie beschikken. Met deze functie moet
      de toezichthouder op afstand informatie van de machine kunnen ontvangen. De toezichtfunctie
      staat alleen handelingen toe om de machine op afstand te stoppen en in werking te stellen
      of om de machine of het verwante product naar een veilige positie te verplaatsen of
      in een veilige toestand te krijgen om andere risico’s te voorkomen. De functie moet
      zodanig zijn ontworpen en ontwikkeld dat deze handelingen alleen mogelijk zijn wanneer
      de toezichthouder direct of indirect het bewegings- en werkgebied van de machine kan
      zien en de beveiligingsinrichtingen in werking zijn. De informatie die de toezichthouder
      van de machine ontvangt wanneer de toezichtfunctie actief is, moet de toezichthouder
      in staat stellen een volledig en juist beeld te krijgen van de werking, beweging en
      veilige positie van de machine in het verplaatsings- en werkgebied. Deze informatie
      moet de toezichthouder waarschuwen voor onvoorziene of bestaande of dreigende gevaarlijke
      situaties die de interventie van de toezichthouder vereisen. Indien de toezichtfunctie
      niet actief is, mag de machine niet kunnen functioneren. 3.3. Besturingssystemen Zo
      nodig moeten maatregelen worden genomen om niet toegelaten gebruik van de bedieningen
      te verhinderen. Bij bediening op afstand moet op iedere besturingsinrichting duidelijk
      zijn aangegeven welke machine of welk verwant product vanaf die besturingsinrichting
      wordt bediend. Het systeem voor besturing op afstand moet zo zijn ontworpen en gebouwd
      dat het alleen uitwerking heeft op: a) de machine of het verwante product in kwestie;
      b) de functies in kwestie. Op afstand bestuurde machines of verwante producten moeten
      zo zijn ontworpen en gebouwd dat zij uitsluitend reageren op signalen van de desbetreffende
      besturingsinrichting. Voor autonome mobiele machines en verwante producten moet het
      besturingssysteem zodanig ontworpen zijn dat het de veiligheidsfuncties zelf uitvoert,
      zoals in dit punt beschreven, zelfs wanneer via een toezichtfunctie op afstand de opdracht
      voor de handelingen wordt gegeven. 3.3.1. Bedieningsorganen Vanaf de bestuurdersplaats
      moet de bestuurder alle bedieningsorganen kunnen bedienen die nodig zijn voor de werking
      van de machine of het verwante product, behalve voor functies die slechts met behulp
      van elders gesitueerde bedieningsorganen veilig in werking kunnen worden gesteld. Het
      gaat dan met name om functies waarvoor andere bedieners dan de bestuurder verantwoordelijk
      zijn, of om gevallen waarin de bestuurder de bestuurdersplaats moet verlaten om deze
      veilig te kunnen bedienen. Eventuele pedalen moeten zo zijn ontworpen, gebouwd en geplaatst
      dat zij door de bestuurder veilig en met een zo gering mogelijk risico voor verkeerde
      bediening kunnen worden bediend. Zij moeten van een antisliplaag zijn voorzien en gemakkelijk
      schoon te maken zijn. Wanneer de bediening van de bedieningsorganen, met uitzondering
      van de organen met vaste standen, risico’s kan veroorzaken, met name voor gevaarlijke
      bewegingen, moeten zij in de neutrale stand terugkeren zodra de bediener deze loslaat.
      Bij machines op wielen moet de stuurinrichting zodanig zijn ontworpen en gebouwd dat
      deze de kracht van plotselinge bewegingen van het stuurwiel of de stuurhendel als gevolg
      van schokken op de gestuurde wielen afzwakt. Ieder bedieningsorgaan waarmee het differentieel
      wordt geblokkeerd, moet zodanig zijn ontworpen en aangebracht dat het blokkering van
      het differentieel mogelijk maakt wanneer de machine in beweging is. De zesde alinea
      van punt 1.2.2, betreffende geluids- en/of lichtsignalen, is uitsluitend van toepassing
      als achteruit wordt gereden. 3.3.2. In werking stellen/verplaatsen Elke gewilde en ongewilde
      verplaatsing van een machine met eigen aandrijving met een daarop meegevoerde bestuurder
      mag uitsluitend mogelijk zijn indien de bestuurder zich op de bedieningspost bevindt.
      Wanneer een machine voor het uit te voeren werk is uitgerust met inrichtingen die uitsteken
      buiten de normale vrije zone (bijvoorbeeld stabilisatoren, giek enz.), moet de bestuurder
      vóór het verplaatsen van de machine gemakkelijk kunnen nagaan of die inrichtingen in
      een bepaalde stand zijn die een veilige verplaatsing mogelijk maken. Hetzelfde geldt
      voor alle andere delen die voor een veilige verplaatsing in een bepaalde, zo nodig vergrendelde
      stand moeten staan. Indien dit niet tot andere gevaren of hogere risico’s leidt, mag
      de verplaatsing van de machine alleen mogelijk zijn bij een veilige stand van bovengenoemde
      delen. Een ongewilde verplaatsing van de machine mag niet mogelijk zijn tijdens het
      in werking stellen van de motor. Bij de verplaatsing van een autonome mobiele machine
      moet rekening worden gehouden met de risico’s die verbonden zijn aan het gebied waarbinnen
      zij moet bewegen en werken. 3.3.3. Verplaatsingsfunctie Onverminderd de reglementering
      inzake het wegverkeer, moeten machines met eigen aandrijving en de aanhangers daarvan
      voldoen aan de eisen betreffende snelheidsvermindering, stoppen, remmen, en in parkeerstand
      zetten waarbij de veiligheid onder alle voorziene bedrijfsomstandigheden, belastingen,
      snelheden, bodemtoestanden en hellingen, verzekerd wordt. De bestuurder moet snelheidsvermindering
      en het tot stilstand brengen van een machine met eigen aandrijving door middel van een
      hoofdremmechanisme kunnen bewerkstelligen. Voor zover dat in verband met de veiligheid
      nodig is, moet het, indien het hoofdremmechanisme defect raakt of als er niet de benodigde
      energie is om dit mechanisme in werking te stellen, mogelijk zijn de machine met behulp
      van een noodinrichting met een volledig onafhankelijk gemakkelijk bereikbaar bedieningsorgaan
      af te remmen en te stoppen. Voor zover nodig in verband met de veiligheid, moet de stilstand
      van de machine met behulp van een parkeerrem worden voorzien. Deze inrichting mag gecombineerd
      worden met een van de in de tweede alinea bedoelde inrichtingen indien zij louter mechanisch
      werkt. Een machine met afstandsbesturing moet zijn voorzien van de nodige middelen om
      de machine automatisch en onmiddellijk tot stilstand te brengen en om een potentieel
      gevaarlijk gebruik te voorkomen in de volgende situaties: a) wanneer de bestuurder er
      de macht over heeft verloren; b) wanneer een stopsignaal wordt ontvangen; c) wanneer
      een defect in een met de veiligheid verband houdend deel van het systeem wordt ontdekt;
      d) wanneer geen valideringssignaal gedurende een gespecificeerd tijdsverloop wordt ontdekt.
      Punt 1.2.4 is niet van toepassing op de verplaatsingsfunctie. Autonome mobiele machines
      of verwante producten moeten, indien noodzakelijk op grond van de risicobeoordeling,
      aan één of beide van de volgende voorwaarden voldoen: i) ze moeten bewegen en werken
      in een afgesloten gebied dat is voorzien van een perifeer beveiligingssysteem bestaande
      uit afschermingen of beveiligingsinrichtingen; ii) ze moeten zijn uitgerust met voorzieningen
      voor het detecteren van mensen, huisdieren of andere obstakels in hun omgeving, wanneer
      deze obstakels een risico zouden kunnen vormen voor de gezondheid en veiligheid van
      personen of huisdieren of voor de veilige werking van de machine of het verwante product.
      De bewegingen van mobiele machines of verwante producten die verbonden zijn met een
      of meer aanhangwagens of getrokken voorwerpen, met inbegrip van autonome mobiele machines
      of verwante producten die verbonden zijn met een of meer aanhangwagens of getrokken
      voorwerpen, mogen geen risico’s opleveren voor personen, huisdieren of andere obstakels
      in de gevarenzone van dergelijke machines of verwante producten en aanhangwagens of
      getrokken voorwerpen. 3.3.4. Verplaatsen van machines met een bestuurder te voet Verplaatsing
      van een machine met eigen aandrijving en een bestuurder te voet mag alleen kunnen plaatsvinden
      indien de bestuurder het betrokken bedieningsorgaan blijvend bedient. In het bijzonder
      mag er geen verplaatsing kunnen optreden tijdens het in werking stellen van de motor.
      De besturingssystemen van machines met bestuurder te voet moeten zodanig zijn ontworpen
      dat er een zo gering mogelijk risico bestaat als gevolg van een ongewilde verplaatsing
      van de machine in de richting van de bestuurder, met name: a) beknelling; b) verwonding
      als gevolg van draaiende gereedschappen. De verplaatsingssnelheid van de machine moet
      afgestemd zijn op de snelheid van een bestuurder te voet. Bij machines waarop een draaiend
      gereedschap kan worden gemonteerd, mag het in werking stellen van het gereedschap niet
      mogelijk zijn wanneer de achteruitrijstand is ingeschakeld, behalve indien de verplaatsing
      van de machine het resultaat is van de beweging van het werktuig. In dit laatste geval
      moet de snelheid tijdens het achteruitrijden zo laag zijn dat dit geen gevaar voor de
      bestuurder oplevert. 3.3.5. Defecten in het besturingscircuit Bij een defect in de voeding
      van de eventueel aanwezige stuurbekrachtiging moet de machine zolang bestuurbaar blijven
      als nodig is om haar tot stilstand te kunnen brengen. Bij autonome mobiele machines
      mag een defect in de stuurinrichting geen invloed hebben op de veiligheid van de machine.
      3.4. Maatregelen ter beveiliging tegen mechanische risico’s 3.4.1. Niet-gecontroleerde
      bewegingen Een machine of verwant product moet zodanig zijn ontworpen, gebouwd en, in
      voorkomend geval, op een mobiele draagconstructie zijn gemonteerd, dat bij verplaatsing
      onbeheerste schommelingen van het zwaartepunt de stabiliteit niet aantasten en geen
      overmatige krachten op de constructie uitoefenen. 3.4.2. Bewegende overbrengingsonderdelen
      In afwijking van punt 1.3.8.1 is het bij motoren toegestaan dat de beweegbare afschermingen
      die de toegang tot de bewegende delen in het motorcompartiment afsluiten, niet in elkaar
      grijpen, op voorwaarde dat ze slechts kunnen worden geopend met behulp van een werktuig
      of sleutel of met een bedieningsorgaan vanaf de bestuurdersplaats, mits deze laatste
      zich in een volledig afgesloten en permanent vergrendelde cabine bevindt die verhindert
      dat niet-bevoegde personen toegang hebben. 3.4.3. Omvallen en kantelen Wanneer bij een
      machine met eigen aandrijving, met daarop een bestuurder, bediener(s) of andere persoon
      of personen, gevaar voor omvallen of kantelen bestaat, moet de machine van een passende
      beschermingsstructuur zijn voorzien, tenzij daardoor een groter risico ontstaat. Deze
      structuur moet zodanig zijn dat zij bij omvallen of kantelen de persoon of personen
      die zich op de machine bevinden, een doeltreffend vervormingsbeperkend volume garandeert.
      Om te verifiëren of de structuur aan de eis van de tweede alinea voldoet, moet de fabrikant
      voor elk type structuur passende tests verrichten of laten verrichten. 3.4.4. Vallende
      voorwerpen Wanneer bij een machine met eigen aandrijving met daarop een bestuurder,
      bediener(s) of andere persoon of personen, een risico bestaat door vallende voorwerpen
      of materialen, moet in het ontwerp en de bouw van de machine met dit risico rekening
      zijn gehouden en moet de machine, indien de afmetingen dit toelaten, van een passende
      beschermingsstructuur zijn voorzien. Deze structuur moet zodanig zijn dat zij de meegevoerde
      personen bij het vallen van voorwerpen of materialen een doeltreffend vervormingsbeperkend
      volume garandeert. Om te verifiëren of de structuur aan de eis van de tweede alinea
      voldoet, moet de fabrikant voor elk type structuur passende tests verrichten of laten
      verrichten. 3.4.5. Toegangsmiddelen Handgrepen en voetsteunen moeten zodanig zijn ontworpen,
      gebouwd en geplaatst dat de bedieners deze instinctief gebruiken en niet de bedieningsorganen
      gebruiken als hulpmiddel om toegang te verkrijgen. 3.4.6. Trekhaken en -inrichtingen
      Elke machine die als trekker wordt gebruikt of zelf moet worden voortgetrokken, moet
      zijn uitgerust met een trekhaakvoorziening of koppeling die zodanig is ontworpen, gebouwd
      en aangebracht dat het koppelen en loskoppelen gemakkelijk en veilig geschiedt en het
      ongewild losraken tijdens gebruik wordt voorkomen. Voor zover dit met het oog op de
      trekstangbelasting vereist is, moeten deze machines zijn uitgerust met een ondersteuning
      waarvan het draagvlak op de belasting en het terrein is afgestemd. 3.4.7. Krachtoverbrenging
      tussen een machine (of trekker) met eigen aandrijving en de aangedreven machine Verwijderbare
      mechanische overbrengingssystemen die de verbinding moeten vormen tussen een machine
      met eigen aandrijving (of een trekker) en de eerste vaste aslager van de aangedreven
      machine, moeten zo zijn ontworpen en gebouwd dat ieder tijdens de werking bewegend deel
      over zijn gehele lengte wordt afgeschermd. Aan de zijde van de machine met eigen aandrijving
      (of de trekker) moet de aftakas waaraan het verwijderbare mechanische overbrengingssysteem
      is gekoppeld, zijn beveiligd hetzij met behulp van een aan deze machine (of de trekker)
      bevestigde en daarmee verbonden afscherming hetzij door een andere inrichting die een
      gelijkwaardige bescherming verzekert. Deze afscherming moet geopend kunnen worden om
      toegang te krijgen tot het verwijderbare overbrengingssysteem. Wanneer de afscherming
      is geïnstalleerd, moet er voldoende plaats vrij blijven om te voorkomen dat de afscherming
      wordt beschadigd door de aandrijfas wanneer de machine (of de trekker) zich voortbeweegt.
      Aan de zijde van de aangedreven machine moet de aangedreven as geplaatst zijn in een
      beveiligingshuis dat aan de voortgetrokken machine is bevestigd. Bij een cardanoverbrenging
      mag een koppelbegrenzer of een vrijloop uitsluitend worden toegepast aan de zijde van
      de koppeling aan de aangedreven machine. In dit geval moet op het verwijderbare mechanische
      overbrengingssysteem de monteerrichting worden aangegeven. Elke aangedreven machine
      waarvan voor de werking een verwijderbaar mechanisch overbrengingssysteem nodig is dat
      haar verbindt met een machine met eigen aandrijving (of met een trekker), moet van een
      zodanig koppelsysteem voor het verwijderbare mechanische overbrengingssysteem zijn voorzien
      dat bij ontkoppeling van de machine het verwijderbare mechanische overbrengingssysteem
      en zijn afscherming niet beschadigd kunnen worden door contact met de grond of een onderdeel
      van de machine. De uitwendige delen van de afscherming moeten zodanig zijn ontworpen,
      gebouwd en aangebracht dat ze niet met het verwijderbare mechanische overbrengingssysteem
      kunnen meedraaien. De overbrenging moet in haar geheel zijn afgeschermd tot aan de uiteinden
      waar de binnenste vorken zich bevinden in het geval van een enkelvoudige cardankoppeling
      en ten minste tot het midden van de buitenste verbinding(en) in het geval van een zogenaamde
      groothoekcardankoppeling. Indien zich toegangen tot de werkplekken in de nabijheid van
      het verwijderbare mechanische overbrengingssysteem bevinden, moeten deze zo zijn ontworpen
      en gebouwd dat de afschermingen van deze assen niet als opstap kunnen worden gebruikt,
      tenzij zij daartoe zijn ontworpen en gebouwd. 3.5. Maatregelen ter beveiliging tegen
      andere risico’s 3.5.1. Accu’s De behuizing voor de accu moet zodanig zijn ontworpen
      en gebouwd dat wordt voorkomen dat in geval van kanteling of omslaan, de bediener met
      opspattend elektrolyt in aanraking komt en dat wordt voorkomen dat de bedieningsruimten
      met dampen gevuld raken. Machines of verwante producten moeten zodanig zijn ontworpen
      en gebouwd dat de accu’s kunnen worden ontkoppeld door middel van een daarvoor aangebrachte
      inrichting die gemakkelijk bereikbaar is. De accu’s van mobiele machines of verwante
      producten, met inbegrip van autonome mobiele machines of verwante producten, die automatisch
      opladen, moeten zodanig zijn ontworpen dat gevaren als bedoeld in de punten 1.3.8.2
      en 1.5.1, met inbegrip van risico’s van contact of aanrijding van de machine of het
      verwante product met een persoon of een andere machine of ander verwant product wanneer
      de machine autonoom naar het laadstation beweegt, worden voorkomen. 3.5.2. Brand Afhankelijk
      van de gevaren die de fabrikant voorziet moet de machine, indien de afmetingen ervan
      dit toelaten: a) hetzij met gemakkelijk bereikbare brandblusapparaten kunnen worden
      uitgerust; b) hetzij zijn voorzien van brandblussystemen die een integrerend deel van
      de machine uitmaken. 3.5.3. Emissie van gevaarlijke stoffen De tweede en derde alinea
      van punt 1.5.13 zijn niet van toepassing wanneer het aanbrengen van gevaarlijke stoffen
      de hoofdfunctie van de machine is. De bediener moet echter worden beschermd tegen het
      risico van blootstelling aan dergelijke uitgestoten gevaarlijke stoffen. Mobiele machines
      met een bestuurdersplaats die als hoofdfunctie het aanbrengen van gevaarlijke stoffen
      hebben, moeten beschikken over met filters uitgeruste cabines of gelijkwaardige veiligheidsmaatregelen.
      3.5.4. Risico’s van contact met onder stroom staande bovengrondse elektriciteitsleidingen
      Afhankelijk van de hoogte ervan moeten mobiele machines of verwante producten, indien
      van toepassing, zodanig zijn ontworpen, gebouwd en uitgerust dat het risico van contact
      met een onder stroom staande bovengrondse elektriciteitsleiding of het risico dat er
      een elektrische boog ontstaat tussen een onderdeel van de machine of een bediener die
      de machine bestuurt, en een onder stroom staande bovengrondse elektriciteitsleiding
      wordt voorkomen. Wanneer het risico van contact met een onder stroom staande bovengrondse
      elektriciteitsleiding voor de personen die de machines bedienen niet volledig kan worden
      vermeden, moeten de mobiele machines of verwante producten zodanig zijn ontworpen, gebouwd
      en uitgerust dat gevaren in verband met elektriciteit worden voorkomen. 3.6. Informatie
      en aanduidingen 3.6.1. Signalisatie, signalen en waarschuwingen Alle machines en verwante
      producten moeten, daar waar dat nodig is voor de gezondheid en veiligheid van personen,
      zijn uitgerust met signalisatie en/of met bordjes met aanwijzingen omtrent het gebruik,
      het afstellen en het onderhoud. Die middelen moeten zodanig zijn gekozen, ontworpen
      en uitgevoerd dat ze duidelijk zichtbaar en onuitwisbaar zijn. Onverminderd de bepalingen
      van de wegverkeerswetgeving moeten machines en verwante producten met daarop een bestuurder,
      de volgende uitrusting hebben: a) een geluidsignaleerinrichting om personen te kunnen
      waarschuwen; b) een lichtsignaleringssysteem dat is afgestemd op de voorziene gebruiksomstandigheden;
      deze laatste eis is niet van toepassing op machines en verwante producten die uitsluitend
      voor ondergrondse werkzaamheden zijn bestemd en die geen elektriciteit verbruiken; c)
      indien nodig, een aangepaste verbinding tussen de aanhanger en de machine of het verwante
      product om de signalen te doen werken. Wanneer bij gebruik van op afstand bestuurde
      machines of verwante producten onder normale gebruiksomstandigheden personen gevaar
      lopen op botsingen of beknellingen, moeten deze machines van passende middelen zijn
      voorzien om hun bewegingen te signaleren of van middelen om personen tegen die risico’s
      te beschermen. Dit geldt ook voor machines en verwante producten waarvan het gebruik
      een systematische herhaling van voor- en achteruitbewegingen op één lijn impliceert
      en wanneer de bestuurder geen rechtstreeks zicht heeft op de zone achter de machine.
      Machines en verwante producten moeten zodanig gebouwd zijn dat een ongewilde buitendienststelling
      van de waarschuwings- en signaleringsinrichtingen onmogelijk is. Als dit met het oog
      op de veiligheid noodzakelijk is, moeten deze inrichtingen zijn uitgerust met middelen
      aan de hand waarvan men kan opmaken of alles goed functioneert en die de bediener opmerkzaam
      maken op elk defect. Indien de bewegingen van een machine of bijbehorend gereedschap
      bijzondere gevaren met zich meebrengen, moet op de machine een opschrift zijn aangebracht
      dat op voldoende afstand leesbaar is voor iemand die de machine nadert en hem of haar
      in verband met zijn of haar veiligheid verbiedt zich tijdens de werkzaamheden in de
      nabijheid van de machine te begeven. 3.6.2. Merktekens 1) Machines en verwante producten
      moeten goed leesbaar en onuitwisbaar de volgende aanduidingen hebben: a) het nominale
      vermogen uitgedrukt in kilowatt (kW); b) de massa van de meest gangbare configuratie
      uitgedrukt in kilogram (kg). 2) Daarnaast moeten machines en verwante producten in voorkomend
      geval goed leesbaar en onuitwisbaar de volgende aanduidingen hebben: a) de voorziene
      maximale trekkracht op de trekhaak, uitgedrukt in Newton (N); b) de voorziene maximale
      verticale belasting op de trekhaak, uitgedrukt in Newton (N). 3.6.3. Gebruiksaanwijzing
      3.6.3.1. Trillingen In de gebruiksaanwijzing moeten de volgende gegevens worden vermeld
      betreffende de trillingen, uitgedrukt als versnelling (m/s²), die door de machine of
      het verwante product worden doorgegeven aan het hand-armstelsel dan wel aan het gehele
      lichaam: a) de totale waarde van de trillingen waaraan het hand-armstelsel wordt blootgesteld
      als gevolg van continue trillingen; b) de gemiddelde waarde van de piekamplitude van
      de versnelling ten gevolge van herhaalde schoktrillingen waaraan het hand-armstelsel
      wordt blootgesteld; c) de maximale kwadratische gemiddelde waarde van de frequentie
      van de gewogen versnelling waaraan het gehele lichaam wordt blootgesteld, wanneer deze
      meer dan 0,5 m/s² bedraagt. Wanneer deze waarde niet meer dan 0,5 m/s² bedraagt, moet
      dit worden vermeld; d) de onzekerheid van de metingen. Deze waarden moeten voor de betrokken
      machine of het betrokken verwante product daadwerkelijk worden gemeten, dan wel vastgesteld
      uitgaande van metingen bij een technisch vergelijkbare machine die of een technisch
      vergelijkbaar verwant product dat representatief is voor de te vervaardigen machine
      of het te vervaardigen verwante product. Wanneer de geharmoniseerde normen of de door
      de Commissie overeenkomstig artikel 20, lid 3, vastgestelde gemeenschappelijke specificaties
      niet kunnen worden toegepast, moeten de trillingen worden gemeten met de voor de betreffende
      machine of het betreffende verwante product meest geschikte meetnorm. De bedrijfsomstandigheden
      van de machine tijdens de metingen en de voor de metingen gebruikte meetnorm moeten
      worden beschreven. 3.6.3.2. Multifunctioneel gebruik De gebruiksaanwijzing van een machine
      die of verwant product dat afhankelijk van de gebruikte uitrusting voor verschillende
      gebruiksdoeleinden geschikt is, en de gebruiksaanwijzing van verwisselbare uitrustingsstukken
      moeten de noodzakelijke gegevens bevatten om de eigenlijke machine of het eigenlijke
      verwante product en de verwisselbare uitrustingsstukken die erop kunnen worden gemonteerd,
      zonder gevaar te kunnen monteren en gebruiken. 3.6.3.3. Autonome mobiele machines of
      verwante producten In de gebruiksaanwijzing van autonome mobiele machines of verwante
      producten moeten de kenmerken van de voorziene bewegings- en werkgebieden en gevarenzones
      worden vermeld. 4. AANVULLENDE ESSENTIËLE VEILIGHEIDS- EN GEZONDHEIDSEISEN OM DE AAN
      HIJS- OF HEFVERRICHTINGEN VERBONDEN RISICO’S TE VERHELPEN Machines of verwante producten
      waaraan risico’s in verband met hijs- of hefverrichtingen verbonden zijn, moeten aan
      alle in dit hoofdstuk opgenomen relevante essentiële veiligheids- en gezondheidseisen
      voldoen (zie Algemene beginselen, punt 4). 4.1. Algemeen 4.1.1. Voor de toepassing van
      punt 4.1. wordt verstaan onder: a) “hijs- of hefverrichting”: verplaatsing van ladingseenheden
      bestaande uit goederen en/of personen waarbij op een bepaald moment een verandering
      van niveau vereist is; b) “geleide last”: last waarvan de volledige verplaatsing gebeurt
      langs starre of soepele geleiders waarvan de plaats in de ruimte door vaste punten wordt
      bepaald; c) “gebruikscoëfficiënt”: rekenkundige verhouding tussen de door de fabrikant
      gegarandeerde last die door een component kan worden gehouden, en de maximale werklast
      die op de component is aangegeven; d) “testcoëfficiënt”: rekenkundige verhouding tussen
      de last die voor de statische of dynamische test van de machine of het verwante product
      of het hijs- of hefgereedschap wordt gebruikt, en de maximale werklast die respectievelijk
      op de machine of het verwante product of het hijs- of hefgereedschap is aangegeven;
      e) “statische test”: test waarbij de machine of het verwante product of het hijs- of
      hefgereedschap eerst wordt geïnspecteerd, waarbij daarop vervolgens een kracht wordt
      uitgeoefend overeenkomende met de maximale werklast vermenigvuldigd met de passende
      statische testcoëfficiënt, en waarbij de machine of het gereedschap nadat de uitoefening
      van de kracht is stopgezet, opnieuw wordt geïnspecteerd om te verifiëren of er geen
      schade is opgetreden; f) “dynamische test”: test waarbij de machine of het verwante
      product in alle mogelijke configuraties in werking wordt gesteld met de maximale werklast
      vermenigvuldigd met de juiste dynamische-testcoëfficiënt, waarbij rekening wordt gehouden
      met het dynamische gedrag van de hijs- of hefmachine teneinde de goede werking ervan
      te verifiëren; g) “drager”: gedeelte van de machine of het verwante product dat de personen
      en/of goederen draagt. 4.1.2. Beveiliging tegen mechanische risico’s 4.1.2.1. Risico’s
      door onvoldoende stabiliteit Machines en verwante producten moeten zodanig zijn ontworpen
      en gebouwd dat de overeenkomstig punt 1.3.1 vereiste stabiliteit in en buiten bedrijf
      gehandhaafd blijft, met inbegrip van alle stadia van het vervoer, het monteren en het
      ontmantelen, bij voorzienbare defecten van componenten en ook tijdens de tests die overeenkomstig
      de gebruiksaanwijzing worden verricht. De fabrikant gebruikt hiertoe de passende verificatiemethoden.
      4.1.2.2. Machines en verwante producten die zich over geleide rails en loopsporen bewegen
      De machine of het verwante product moet uitgerust zijn met voorzieningen die inwerken
      op de geleiding of loopsporen om ontsporing te voorkomen. Indien er ondanks de aanwezigheid
      van dergelijke voorzieningen een risico op ontsporing of op een defect aan een geleiding
      of loopspoor blijft bestaan, moeten er voorzieningen zijn die verhinderen dat uitrustingen,
      componenten of lasten vallen of dat de machine kantelt. 4.1.2.3. Mechanische sterkte
      Machines en verwante producten, waaronder hijs- of hefgereedschappen en de componenten
      ervan, moeten bestand zijn tegen de belastingen waaraan zij tijdens hun levensduur in
      en eventueel buiten bedrijf en in alle mogelijke desbetreffende configuraties worden
      onderworpen onder de aangegeven installatie- en bedrijfsomstandigheden, waarbij in voorkomend
      geval rekening wordt gehouden met de effecten van klimatologische omstandigheden en
      door personen uitgeoefende krachten. Aan deze eis moet ook gedurende het vervoer, het
      monteren en het demonteren worden voldaan. Machines en verwante producten, waaronder
      hijs- of hefgereedschappen, moeten zodanig zijn ontworpen en gebouwd dat er, rekening
      houdend met het beoogde gebruik en redelijkerwijs voorzienbaar verkeerd gebruik, geen
      defecten ten gevolge van moeheid of slijtage optreden. De keuze van de gebruikte materialen
      moet zijn afgestemd op de verwachte gebruiksomstandigheden, met name waar het gaat om
      corrosie, slijtage, schokken, extreme temperaturen, moeheid, broosheid, straling en
      veroudering. Machines en verwante producten, waaronder hijs- of hefgereedschappen, moeten
      zodanig zijn ontworpen en gebouwd dat zij de overbelasting waaraan zij bij statische
      test worden blootgesteld, zonder blijvende vervorming of kennelijk defect kunnen doorstaan.
      Bij de berekeningen van de sterkte moet worden gebruikgemaakt van de waarden van de
      statische-testcoëfficiënt, die zodanig wordt gekozen dat een adequaat veiligheidsniveau
      is gewaarborgd. Die coëfficiënt heeft in de regel de volgende waarden: a) met fysieke
      kracht bediende machines of verwante producten, waaronder hijs- of hefgereedschappen:
      1,5; b) andere machines of verwante producten: 1,25. De machines of de verwante producten
      moet zodanig zijn ontworpen en gebouwd dat zij zonder defect de dynamische test, die
      wordt verricht met de maximale werklast vermenigvuldigd met de dynamische-testcoëfficiënt,
      kunnen doorstaan. Deze dynamische-testcoëfficiënt wordt zodanig gekozen dat een adequaat
      veiligheidsniveau is gewaarborgd; deze coëfficiënt bedraagt in de regel 1,1. Deze tests
      worden in de regel uitgevoerd met de aangegeven nominale snelheden. Wanneer de bedieningskring
      van de machine of het verwante product meerdere gelijktijdige bewegingen toelaat, moeten
      de tests worden uitgevoerd onder de ongunstigste omstandigheden, hetgeen over het algemeen
      het geval is wanneer de bewegingen worden gecombineerd. 4.1.2.4. Schijven, trommels,
      rollen, kabels en kettingen De diameter van de schijven, trommels en rollen moet zijn
      afgestemd op de afmetingen van de kabels of kettingen waarmee zij kunnen worden uitgerust.
      De trommels en schijven moeten zodanig zijn ontworpen, gebouwd en aangebracht dat de
      kabels of kettingen waarmee zij zijn uitgerust, kunnen oprollen zonder dat zij er zijdelings
      aflopen. De kabels die rechtstreeks lasten dragen of ondersteunen mogen alleen aan de
      uiteinden een splits hebben. Splitsen zijn echter wel toegelaten in installaties die
      door hun ontwerp bestemd zijn om regelmatig aan andere gebruiksdoeleinden te worden
      aangepast. De gebruikscoëfficiënt van het geheel van kabel en uiteinden wordt zodanig
      gekozen dat een adequaat veiligheidsniveau is gewaarborgd. Deze coëfficiënt bedraagt
      in de regel 5. De gebruikscoëfficiënt van hijskettingen wordt zodanig gekozen dat een
      adequaat veiligheidsniveau is gewaarborgd. Deze coëfficiënt bedraagt in de regel 4.
      Om te controleren of de adequate gebruikscoëfficiënt wordt bereikt, moet de fabrikant
      voor elk rechtstreeks voor het hijsen van de last gebruikt type ketting en kabel en
      voor elk type kabeluiteinde de passende tests verrichten of laten verrichten. 4.1.2.5.
      Hijs- of hefgereedschappen en de componenten ervan Bij de bepaling van de afmetingen
      van de hijs- of hefgereedschappen en de componenten ervan moet rekening zijn gehouden
      met moeheids- en verouderingsverschijnselen over een met de beoogde levensduur overeenkomend
      aantal bedrijfscycli onder de voor de aangegeven toepassing gespecificeerde bedrijfsomstandigheden.
      Bovendien geldt het volgende: a) de gebruikscoëfficiënt van het geheel van metalen kabel
      en kabeluiteinden moet zodanig worden gekozen dat een adequaat veiligheidsniveau is
      gewaarborgd; deze coëfficiënt bedraagt in de regel 5. De kabels mogen alleen aan de
      uiteinden een splits of lus hebben; b) wanneer kettingen van gelaste schalmen worden
      gebruikt, moeten deze van het type met korte schalmen zijn. De gebruikscoëfficiënt van
      de kettingen wordt zodanig gekozen dat een adequaat veiligheidsniveau is gewaarborgd;
      deze coëfficiënt bedraagt in de regel 4; c) de gebruikscoëfficiënt van kabels, stroppen
      of banden van textielvezel hangt af van het materiaal, de wijze van vervaardiging, de
      afmetingen en het gebruik. De coëfficiënt moet zodanig worden gekozen dat een adequaat
      veiligheidsniveau is gewaarborgd; deze coëfficiënt bedraagt in de regel 7, op voorwaarde
      dat de gebruikte materialen van een zeer goede, gecontroleerde kwaliteit zijn en dat
      de wijze van vervaardiging geschikt is voor het beoogde gebruik. Indien zulks niet het
      geval is, heeft de coëfficiënt in het algemeen een hogere waarde om een gelijkwaardig
      veiligheidsniveau te bieden. Kabels, stroppen of banden van textielvezel mogen geen
      knopen, splitsen of verbindingen hebben, behalve aan het uiteinde van de strop of aan
      de verbinding van een gesloten strop/lus; d) de gebruikscoëfficiënt van alle metalen
      componenten van een strop, of de in combinatie met een strop gebruikte metalen delen,
      wordt zodanig gekozen dat een adequaat veiligheidsniveau is gewaarborgd; deze coëfficiënt
      bedraagt in de regel 4; e) de maximale werklast van een meerwegstrop wordt berekend
      op basis van de gebruikscoëfficiënt van het zwakste deel, het aantal delen en een verminderingsfactor
      die afhangt van de wijze waarop de last wordt aangeslagen; f) om te controleren of de
      adequate gebruikscoëfficiënt wordt bereikt, moet de fabrikant voor elk van de in de
      punten a) tot en met d) genoemde typen onderdelen de passende tests verrichten of laten
      verrichten. 4.1.2.6. Beheersing van de bewegingen De inrichtingen voor het beheersen
      van de bewegingen moeten zodanig werken dat de machine of het verwante product waarop
      zij zijn aangebracht, veilig blijft. a) Machines of verwante producten moeten zodanig
      zijn ontworpen, gebouwd of uitgerust met inrichtingen dat de amplitude van de bewegingen
      van de componenten ervan binnen de daarvoor vastgestelde grenzen blijft. Een waarschuwingssignaal
      moet in voorkomend geval van tevoren aankondigen dat die inrichtingen in werking treden.
      b) Wanneer verscheidene vaste of op rails voortbewogen machines of verwante producten
      tegelijkertijd bewegingen kunnen uitvoeren waarbij kans op botsingen bestaat, moeten
      deze machines of verwante producten zodanig zijn ontworpen en gebouwd dat zij kunnen
      worden uitgerust met systemen waarmee dit risico kan worden vermeden. c) Machines en
      verwante producten moeten zo zijn ontworpen en gebouwd dat de lasten niet op gevaarlijke
      wijze uit hun baan of onverwachts in een vrije val kunnen geraken, zelfs niet wanneer
      de krachtbron geheel of gedeeltelijk uitvalt of wanneer de bediener ophoudt de machine
      te bedienen. d) Het mag onder normale bedrijfsomstandigheden niet mogelijk zijn de last
      uitsluitend met gebruikmaking van de frictierem te laten zakken, behalve bij machines
      of verwante producten waarvan de functie een dergelijke toepassing vereist. e) De grijporganen
      moeten zo zijn ontworpen en geconstrueerd dat een ongewild vallen van de last wordt
      vermeden. 4.1.2.7. Bewegingen van lasten tijdens behandeling daarvan De bedieningspost
      van de machines moet zich op een plaats bevinden waar het zicht op de baan van de bewegende
      delen optimaal is om mogelijke botsingen met personen, materieel of andere machines
      die tegelijkertijd kunnen bewegen en die een mogelijke bron van gevaar zijn, te voorkomen.
      Machines met geleide last moeten zodanig zijn ontworpen en gebouwd dat wordt voorkomen
      dat personen verwond kunnen worden door bewegingen van de last, de drager of eventuele
      tegengewichten. 4.1.2.8. Machines die vaste stopplaatsen bedienen 4.1.2.8.1. Bewegingen
      van de drager De bewegingen van de drager van machines die vaste stopplaatsen bedienen,
      moeten gebeuren langs starre geleiders voor de bewegingen naar en op de stopplaatsen.
      Schaarsystemen worden eveneens als starre geleiding beschouwd. 4.1.2.8.2. Toegang tot
      de drager Wanneer personen toegang tot de drager hebben, moet de machine zodanig ontworpen
      en gebouwd zijn dat de drager stationair blijft gedurende de tijd dat personen toegang
      tot de drager hebben, in het bijzonder tijdens het laden en lossen. De machine moet
      zodanig ontworpen en gebouwd zijn dat het niveauverschil tussen de drager en de stopplaats
      geen risico voor struikelen oplevert. 4.1.2.8.3. Risico’s in verband met contact met
      de bewegende drager De doorlopen ruimte moet tijdens de normale werking ontoegankelijk
      worden gemaakt indien dat nodig is om te voldoen aan het vereiste van punt 4.1.2.7,
      tweede alinea. Indien het risico bestaat dat personen die zich tijdens inspectie of
      onderhoud onder of boven de drager bevinden, bekneld kunnen raken tussen de drager en
      vaste gedeelten, moet voor voldoende vrije ruimte worden gezorgd door middel van veiligheidsruimten
      of door mechanische inrichtingen die de beweging van de drager blokkeren. 4.1.2.8.4.
      Risico in verband met een last die van de drager valt Indien er een risico kan ontstaan
      doordat de last van de drager valt, moet de machine zodanig zijn ontworpen en gebouwd
      dat dit risico wordt voorkomen. 4.1.2.8.5. Stopplaatsen Risico’s in verband met contact
      van personen op stopplaatsen met de bewegende drager of andere bewegende delen moeten
      worden voorkomen. Indien het risico bestaat dat personen in de door de drager doorlopen
      ruimte vallen wanneer de drager niet op de stopplaats aanwezig is, moeten afschermingen
      worden aangebracht om dit risico te voorkomen. Die afschermingen mogen niet in de richting
      van de doorlopen ruimte opengaan. Ze moeten voorzien zijn van een vergrendelingsinrichting
      met een door de positie van de drager gecontroleerde vergrendeling van de afscherming,
      ter voorkoming van: a) gevaarlijke bewegingen van de drager, voordat de afschermingen
      gesloten en vergrendeld zijn; b) de gevaarlijke opening van een afscherming, voordat
      de drager is gestopt op de overeenstemmende stopplaats. 4.1.3. Geschiktheid voor het
      beoogde gebruik De fabrikant moet op het tijdstip van het in de handel brengen of van
      de eerste inbedrijfstelling van hijs- of hefmachines of verwante producten, waaronder
      hijs- of hefgereedschappen alle passende maatregelen nemen of laten nemen teneinde te
      waarborgen dat de bedrijfsklare machines of verwante producten, waaronder bedrijfsklare
      hijs- of hefgereedschappen, ongeacht of deze met mankracht of machinaal werken, hun
      gespecificeerde functies veilig kunnen verrichten. De in punt 4.1.2.3 bedoelde statische
      en dynamische tests moeten worden uitgevoerd op alle bedrijfsklare hijs- of hefmachines
      of verwante producten. Wanneer de machines of verwante producten niet kunnen worden
      gemonteerd in de lokalen van de fabrikant, moeten de nodige maatregelen worden genomen
      op de plaats van gebruik door de fabrikant. In het tegengestelde geval kunnen zij worden
      genomen hetzij in de ruimten van de fabrikant hetzij op de plaats van gebruik. 4.2.
      Eisen voor andere dan met mankracht aangedreven machines of verwante producten 4.2.1.
      Besturing van de bewegingen De besturingsorganen waarmee de bewegingen van de machine
      of het verwante product of de uitrusting ervan worden bestuurd, moeten van het “hold-to-run”-type
      (besturing waarbij het bedieningsorgaan moet worden aangehouden) zijn. Voor gedeeltelijk
      of geheel uitgevoerde bewegingen, waarbij geen gevaar bestaat voor het tegen elkaar
      botsen van last en machine of verwant product, mogen bovengenoemde organen echter worden
      vervangen door bedieningsorganen die bewegingen met automatische stilstand op van tevoren
      ingestelde posities mogelijk maken, zonder dat de bediener de bedieningsorganen ingeschakeld
      houdt. 4.2.2. Belastingsbegrenzing Machines en verwante producten waarvan de maximale
      werklast ten minste 1 000 kg of het kantelmoment ten minste 40 000 Nm bedraagt, moeten
      zijn uitgerust met inrichtingen die de bestuurder waarschuwen en gevaarlijke bewegingen
      voorkomen in geval van: a) overbelasting door overschrijding van de maximale werklast
      of van het maximale kantelmoment door een te zware werklast, of b) overschrijding van
      het kantelmoment. 4.2.3. Door kabels geleide installaties Draag-, trek- of draag-trekkabels
      moeten worden gespannen door een tegengewicht of door een inrichting waarmee permanent
      de spanning kan worden geregeld. 4.3. Informatie en merktekens 4.3.1. Kettingen, kabels
      en banden Iedere ketting-, kabel- of bandlengte die geen deel uitmaakt van een samenstel
      moet een merkteken of, wanneer dat niet mogelijk is, een etiket of een niet verwijderbare
      ring dragen met de gegevens van de fabrikant, alsmede de identificatie van het desbetreffende
      certificaat. Het hierboven genoemde certificaat moet de volgende minimumgegevens bevatten:
      a) naam en adres van de fabrikant; b) een beschrijving van de ketting of kabel met vermelding
      van: i) de nominale afmetingen; ii) de uitvoering; iii) het fabricagemateriaal; iv)
      elke speciale metallurgische behandeling van het materiaal; c) de toegepaste testmethode;
      d) de maximale belasting van de ketting of de kabel bij gebruik. Naargelang van de beoogde
      toepassingen kan een reeks van waarden worden aangegeven. 4.3.2. Hijs- of hefgereedschappen
      Hijs- of hefgereedschappen moeten de volgende informatie dragen: a) identificatie van
      het materiaal wanneer deze informatie nodig is met het oog op het veilige gebruik ervan;
      b) de maximale werklast. Indien het onmogelijk is deze informatie op de hijs- of hefgereedschappen
      aan te brengen, moet de in de eerste alinea vermelde informatie worden aangebracht op
      een etiket of een ander gelijkwaardig middel en stevig aan het gereedschap worden bevestigd.
      De informatie moet leesbaar zijn en moet aangebracht worden op een plaats waar zij niet
      kan verdwijnen als gevolg van slijtage en waar zij geen gevaar vormt voor de sterkte
      van het gereedschap. 4.3.3. Hijs- of hefmachines of verwante producten De maximale werklast
      moet goed zichtbaar op hijs- of hefmachines of verwante producten worden aangegeven.
      Deze markering moet leesbaar, onuitwisbaar en ongecodeerd zijn. Als de maximale werklast
      afhangt van de configuratie van de hijs- of hefmachine of het verwante product, moet
      elke bedieningspost zijn voorzien van een plaatje dat bij voorkeur in tabelvorm of schematisch
      de toegestane werklast voor elke configuratie vermeldt. Op machines of verwante producten
      die uitsluitend zijn bedoeld voor het hijsen of heffen van goederen en die zijn uitgerust
      met een drager die toegankelijk is voor personen, moet duidelijk en onuitwisbaar vermeld
      staan dat het heffen van personen verboden is. Deze vermelding moet duidelijk zichtbaar
      zijn op iedere plaats waar toegang mogelijk is. 4.4. Gebruiksaanwijzing 4.4.1. Hijs-
      of hefgereedschappen Ieder hijs- of hefgereedschap of iedere commercieel ondeelbare
      partij hijs- of hefgereedschappen moet vergezeld gaan van een gebruiksaanwijzing die
      ten minste de volgende gegevens bevat: a) het beoogde gebruik; b) de gebruiksgrenzen
      (met name voor hijs- of hefgereedschappen zoals magnetische of vacuümzuignappen die
      niet geheel aan punt 4.1.2.6, e), voldoen); c) aanwijzingen voor het monteren, het gebruik
      en het onderhoud; d) de gebruikte statischetestcoëfficiënt. 4.4.2. Hijs- of hefmachines
      of verwante producten Bij hijs- of hefmachines of verwante producten moet een gebruiksaanwijzing
      met de volgende gegevens zijn gevoegd: a) de technische kenmerken van de hijs- of hefmachine
      of het verwante product, met name: i) de maximale werklast en zo nodig een kopie van
      het plaatje of de tabel met de werklasten als omschreven in punt 4.3.3, tweede alinea;
      ii) de op steun- en bevestigingspunten uitgeoefende krachten en, in voorkomend geval,
      de kenmerken van de banen; iii) zo nodig een omschrijving van de ballast en de manieren
      om deze aan te brengen; b) de inhoud van het onderhoudsboekje voor de hijs- of hefmachine,
      indien dit niet met de hijs- of hefmachine wordt meegeleverd; c) de werkwijze die moet
      worden gevolgd, met name indien het rechtstreekse zicht dat de bediener op de last heeft,
      niet toereikend is; d) indien nodig, een testverslag met details betreffende de statische
      en dynamische tests die door of voor de fabrikant zijn verricht; e) voor hijs- of hefmachines
      of verwante producten die niet in de lokalen van de fabrikant gebruiksklaar worden gemonteerd,
      de nodige instructies voor het nemen van de in punt 4.1.3 bedoelde maatregelen vóór
      de eerste inbedrijfstelling ervan. 5. AANVULLENDE ESSENTIËLE VEILIGHEIDS- EN GEZONDHEIDSEISEN
      VOOR MACHINES EN VERWANTE PRODUCTEN DIE BESTEMD ZIJN VOOR GEBRUIK BIJ ONDERGRONDSE WERKZAAMHEDEN
      Machines en verwante producten bestemd om bij ondergrondse werkzaamheden te worden gebruikt,
      moeten aan alle in dit hoofdstuk opgenomen essentiële veiligheids- en gezondheidseisen
      voldoen (zie Algemene beginselen, punt 4). 5.1. Risico door onvoldoende stabiliteit
      Wandelondersteuningen moeten zodanig zijn ontworpen en gebouwd dat bij verplaatsing
      ervan een goede oriëntatie mogelijk is en dat zij niet kantelen voor en tijdens het
      onder druk brengen en na het wegnemen van de druk. Zij moeten zijn voorzien van verankeringen
      voor de kopplaten van de afzonderlijke hydraulische steunbalken. 5.2. Doortocht Wandelondersteuningen
      moeten personen een ongehinderde doortocht bieden. 5.3. Bedieningsorganen De bedieningsorganen
      voor het versnellen en afremmen van op rails rijdende machines moeten met de hand worden
      bediend. Vrijgavevoorzieningen mogen echter met voetbediening zijn uitgevoerd. De bedieningsorganen
      van wandelondersteuningen moeten zodanig zijn ontworpen en aangebracht dat de bedieners
      tijdens het schiften beschut zijn door een ter plaatse aanwezige stut. De bedieningsorganen
      moeten beschermd zijn tegen iedere ongewilde inschakeling. 5.4. Stoppen Machines op
      rails met eigen aandrijving die bestemd zijn voor ondergrondse werkzaamheden, moeten
      zijn uitgerust met een vrijgavevoorziening die ingrijpt op het circuit dat de beweging
      van de machine bepaalt, zodat de verplaatsing wordt stopgezet wanneer de bediener de
      verplaatsing niet langer beheerst. 5.5. Brand Het vereiste van punt 3.5.2, punt b),
      is verplicht voor machines en verwante producten die sterk ontvlambare delen bevatten.
      Het remsysteem van machines en verwante producten die bestemd zijn om bij ondergrondse
      werkzaamheden te worden gebruikt, moet zodanig zijn ontworpen en geconstrueerd dat het
      geen vonken of brand kan veroorzaken. Machines en verwante producten met een verbrandingsmotor
      die bestemd zijn om bij ondergrondse werkzaamheden te worden gebruikt, mogen uitsluitend
      zijn uitgerust met een motor waarbij een brandstof met lage dampspanning wordt gebruikt
      en waarbij elektrische vonken uitgesloten zijn. 5.6. Uitstoot van gassen De uitstoot
      van uitlaatgassen van verbrandingsmotoren mag niet naar boven worden afgevoerd. 6. AANVULLENDE
      ESSENTIËLE VEILIGHEIDS- EN GEZONDHEIDSEISEN VOOR MACHINES EN VERWANTE PRODUCTEN WAARAAN
      SPECIFIEKE RISICO’S IN VERBAND MET HET HEFFEN VAN PERSONEN ZIJN VERBONDEN Machines en
      verwante producten waaraan specifieke risico’s in verband met het heffen of hijsen van
      personen verbonden zijn, moeten aan alle in dit hoofdstuk opgenomen relevante essentiële
      veiligheids- en gezondheidseisen voldoen (zie Algemene beginselen, punt 4). 6.1. Algemeen
      6.1.1. Mechanische sterkte De drager en eventuele luiken moeten zodanig ontworpen en
      gebouwd zijn dat zij qua ruimte en sterkte berekend zijn op het maximale aantal personen
      dat is toegelaten op de drager en de maximale werklast. De in de punten 4.1.2.4 en 4.1.2.5
      bepaalde gebruikscoëfficiënten voor componenten zijn niet voldoende voor machines of
      verwante producten die bestemd zijn voor het heffen of hijsen van personen, en moeten
      in de regel worden verdubbeld. Machines en verwante producten die bestemd zijn voor
      het heffen van personen of personen en goederen, moeten voorzien zijn van een ophangings-
      of ondersteuningsinrichting voor de drager die zodanig is ontworpen en gebouwd dat een
      aanvaardbaar algemeen veiligheidsniveau wordt gegarandeerd en dat wordt voorkomen dat
      de drager valt. Wanneer de drager aan kabels of kettingen is opgehangen, zijn in de
      regel ten minste twee onafhankelijke kabels of kettingen vereist, elk met een eigen
      verankering. 6.1.2. Controle van de belasting voor machines of verwante producten die
      worden aangedreven door een andere krachtbron dan menskracht De eisen van punt 4.2.2
      zijn van toepassing ongeacht de waarden van de maximale werklast en het maximale kantelmoment,
      tenzij de fabrikant kan aantonen dat er geen risico voor overbelasting of kantelen bestaat.
      6.2. Bedieningsorganen Wanneer de veiligheidseisen niet verplichten tot andere oplossingen,
      moet de drager in de regel zodanig zijn ontworpen en gebouwd dat de personen in de drager
      beschikken over bedieningsorganen om de drager te laten stijgen en dalen en in voorkomend
      geval andere verplaatsingen te laten uitvoeren. Tijdens bedrijf moeten deze bedieningsorganen
      voorrang hebben op alle andere bedieningsorganen voor dezelfde bewegingen, behalve op
      de noodstopinrichtingen. De bedieningsorganen voor de in de eerste alinea bedoelde bewegingen
      moeten van het “hold-to-run”-type (waarbij de bediening moet worden aangehouden) zijn,
      behalve indien de drager volledig omsloten is. Indien er geen risico bestaat dat personen
      of voorwerpen op de drager botsen of vallen en er geen andere risico’s verbonden zijn
      het laten stijgen en dalen van de drager, mogen bedieningsorganen die bewegingen met
      automatische stilstand op van tevoren ingestelde posities mogelijk maken, worden gebruikt
      in plaats van bedieningsorganen van het “hold-to-run”-type. 6.3. Risico’s voor personen
      in of op de drager 6.3.1. Risico’s in verband met bewegingen van de drager Machines
      en verwante producten voor het heffen of hijsen van personen moeten zodanig zijn ontworpen,
      gebouwd of uitgerust dat versnelling of vertraging van de drager geen risico voor personen
      oplevert. 6.3.2. Risico van het uit of van de drager vallen De drager mag niet zodanig
      hellen dat er risico voor vallen van de vervoerde personen ontstaat, ook niet tijdens
      de bewegingen van de machine of het verwante product en drager. Indien de drager is
      ontworpen om als werkplek te worden gebruikt, moet de stabiliteit ervan worden gewaarborgd
      en moeten gevaarlijke bewegingen worden voorkomen. Indien de in punt 1.5.15 bedoelde
      maatregelen niet voldoende zijn, moet de drager zijn uitgerust met voldoende passende
      verankeringspunten voor het aantal personen dat zich in de drager mag bevinden. De verankeringspunten
      moeten sterk genoeg zijn om de persoonlijke beschermingsmiddelen tegen vallen te bevestigen.
      Luiken in het grondvlak of het plafond of zijdeuren moeten zodanig zijn ontworpen en
      gebouwd dat zij niet onopzettelijk kunnen worden geopend, en dat de openingsrichting
      ervan het risico van vallen bij onverwacht opengaan ondervangt. 6.3.3. Risico in verband
      met voorwerpen die op de drager vallen Indien het risico bestaat dat voorwerpen op de
      drager vallen en personen in gevaar brengen, moet de drager voorzien zijn van een beschermdak.
      6.4. Machines en verwante producten die vaste stopplaatsen bedienen 6.4.1. Risico’s
      voor personen die zich in of op de drager bevinden De drager moet zodanig zijn ontworpen
      en gebouwd dat risico’s in verband met contacten tussen personen en/of voorwerpen in
      of op de drager, en vaste of bewegende elementen worden voorkomen. Indien nodig moet
      de drager zelf daartoe volledig worden omsloten en worden uitgerust met deuren die voorzien
      zijn van een vergrendelingsmechanisme dat gevaarlijke bewegingen van de drager verhindert
      zolang de deuren niet gesloten zijn. De deuren moeten gesloten blijven wanneer de drager
      stopt tussen stopplaatsen en als er gevaar bestaat voor uit of van de drager vallen.
      Machines en verwante producten moeten zodanig zijn ontworpen en gebouwd, en indien nodig
      uitgerust zijn met inrichtingen, dat onbeheerste bewegingen van de drager naar boven
      of naar beneden worden voorkomen. De inrichtingen moeten in staat zijn om een drager
      met de maximale werklast bij de voorzienbare maximumsnelheid te stoppen. De remvertraging
      bij het stoppen mag geen gevaar opleveren voor de personen die zich in of op de drager
      bevinden, ongeacht de belasting van de drager. 6.4.2. Besturingssysteem bij de stopplaatsen
      De bedieningsorganen bij stopplaatsen, met uitzondering van de noodinrichtingen, mogen
      geen bewegingen van de drager teweegbrengen wanneer: a) de bedieningsorganen in of op
      de drager worden bediend; b) de drager niet bij een stopplaats is. 6.4.3. Toegang tot
      de drager De afschermingen bij de stopplaatsen en op de drager moeten zodanig zijn ontworpen
      en gebouwd dat een veilige overgang naar en van de drager wordt gewaarborgd, rekening
      houdend met het voorzienbare scala van goederen en personen die moeten worden gehesen
      of geheven. 6.5. Merktekens Op de drager moet de noodzakelijke informatie met het oog
      de veiligheid zijn aangebracht, met inbegrip van: a) het maximumaantal personen dat
      in of op de drager is toegestaan; b) de maximale werklast.
