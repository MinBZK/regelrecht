          - name: valt_binnen_toepassingsgebied_verordening_168_2013
            type: boolean
            description: Onderdeel h. Het product valt binnen het toepassingsgebied van Verordening (EU) nr. 168/2013.
            source:
              regulation: verordening_eu_168_2013
              output: verordening_van_toepassing
          - name: valt_binnen_toepassingsgebied_verordening_167_2013
            type: boolean
            description: Onderdeel i. Het product valt binnen het toepassingsgebied van Verordening (EU) nr. 167/2013.
            source:
              regulation: verordening_eu_167_2013
              output: verordening_van_toepassing
          - name: valt_binnen_toepassingsgebied_richtlijn_2014_35
            type: boolean
            description: Onderdeel p. Het product valt binnen het toepassingsgebied van Richtlijn 2014/35/EU.
            source:
              regulation: richtlijn_2014_35_eu
              output: richtlijn_van_toepassing
          - name: valt_binnen_toepassingsgebied_richtlijn_2014_53
            type: boolean
            description: Onderdeel p. Het product valt binnen het toepassingsgebied van Richtlijn 2014/53/EU.
            source:
              regulation: richtlijn_2014_53_eu
              output: richtlijn_van_toepassing
        output:
          - name: uitgesloten_onderdeel_a
            type: boolean
            description: Onderdeel a, vervangende veiligheidscomponenten van de oorspronkelijke fabrikant.
          - name: uitgesloten_onderdeel_b
            type: boolean
            description: Onderdeel b, materieel voor kermissen of amusementsparken.
          - name: uitgesloten_onderdeel_c
            type: boolean
            description: Onderdeel c, kerninstallaties.
          - name: uitgesloten_onderdeel_d
            type: boolean
            description: Onderdeel d, wapens.
          - name: uitgesloten_onderdeel_e
            type: boolean
            description: Onderdeel e, vervoermiddelen door de lucht, over het water en via het spoor.
          - name: uitgesloten_onderdeel_f
            type: boolean
            nullable: true
            description: >-
              Onderdeel f, luchtvaartproducten; zie de markering. Null als een onderdeel zonder andere regeling het product
              al uitsluit: dan is dit onderdeel niet beoordeeld.
          - name: uitgesloten_onderdeel_g
            type: boolean
            nullable: true
            description: >-
              Onderdeel g, motorvoertuigen en aanhangwagens (Verordening (EU) 2018/858). Null
              als een onderdeel zonder andere regeling het product
              al uitsluit: dan is dit onderdeel niet beoordeeld.
          - name: uitgesloten_onderdeel_h
            type: boolean
            nullable: true
            description: >-
              Onderdeel h, twee- of driewielige voertuigen en vierwielers (Verordening (EU) nr.
              168/2013). Null als een onderdeel zonder andere regeling het product
              al uitsluit: dan is dit onderdeel niet beoordeeld.
          - name: uitgesloten_onderdeel_i
            type: boolean
            nullable: true
            description: >-
              Onderdeel i, landbouw- en bosbouwtrekkers (Verordening (EU) nr. 167/2013). Null
              als een onderdeel zonder andere regeling het product
              al uitsluit: dan is dit onderdeel niet beoordeeld.
          - name: uitgesloten_onderdeel_j
            type: boolean
            description: Onderdeel j, motorvoertuigen uitsluitend voor wedstrijden.
          - name: uitgesloten_onderdeel_k
            type: boolean
            description: Onderdeel k, zeeschepen en mobiele offshore-eenheden.
          - name: uitgesloten_onderdeel_l
            type: boolean
            description: Onderdeel l, militaire of politiedoeleinden.
          - name: uitgesloten_onderdeel_m
            type: boolean
            description: Onderdeel m, onderzoek in laboratoria.
          - name: uitgesloten_onderdeel_n
            type: boolean
            description: Onderdeel n, mijnliften.
          - name: uitgesloten_onderdeel_o
            type: boolean
            description: Onderdeel o, verplaatsen van kunstenaars.
          - name: uitgesloten_onderdeel_p
            type: boolean
            nullable: true
            description: >-
              Onderdeel p, elektrische en elektronische producten (Richtlijn 2014/35/EU of
              2014/53/EU). Null als een onderdeel zonder andere regeling het product
              al uitsluit: dan is dit onderdeel niet beoordeeld.
          - name: uitgesloten_onderdeel_q
            type: boolean
            description: Onderdeel q, elektrische hoogspanningsproducten.
          - name: zonder_andere_regeling_uitgesloten
            type: boolean
            description: >-
              Het product valt onder een onderdeel van lid 2 dat alleen feiten van het product
              leest: a tot en met e, j tot en met o, of q.
          - name: uitgesloten_op_grond_van_lid_2
            type: boolean
            description: Het product valt onder een of meer van de onderdelen a tot en met q van lid 2.
          - name: verordening_van_toepassing
            type: boolean
            description: >-
              De verordening is op het product van toepassing: het is een product dat binnen het
              toepassingsgebied valt (lid 1) en het valt onder geen onderdeel van lid 2.
        actions:
          - output: uitgesloten_onderdeel_a
            value:
              operation: AND
              conditions:
                - $bestemd_om_identieke_componenten_te_vervangen
                - $geleverd_door_fabrikant_van_oorspronkelijk_product
                - $is_veiligheidscomponent
            legal_basis:
              law: Verordening (EU) 2023/1230
              article: '2'
              paragraph: '2'
              explanation: >-
                Onderdeel a: "veiligheidscomponenten die bestemd zijn om identieke componenten
                te vervangen en die geleverd zijn door de fabrikant van de oorspronkelijke machine,
                het oorspronkelijke verwante product of de oorspronkelijke niet voltooide machine".
          - output: uitgesloten_onderdeel_b
            value: $specifiek_bestemd_voor_kermissen_of_amusementsparken
            legal_basis:
              law: Verordening (EU) 2023/1230
              article: '2'
              paragraph: '2'
              explanation: >-
                Onderdeel b: "specifiek voor kermissen of amusementsparken bestemd materieel". Het
                onderdeel noemt elk materieel, ook een niet voltooide machine.
          - output: uitgesloten_onderdeel_c
            value:
              operation: AND
              conditions:
                - operation: OR
                  conditions:
                    - $speciaal_ontworpen_voor_gebruik_in_kerninstallatie
                    - $gebruikt_in_kerninstallatie
                - $overeenstemming_kan_nucleaire_veiligheid_ondermijnen
                - $is_machine_of_verwant_product
            legal_basis:
              law: Verordening (EU) 2023/1230
              article: '2'
              paragraph: '2'
              explanation: >-
                Onderdeel c: "machines en verwante producten die speciaal zijn ontworpen voor
                gebruik binnen of die gebruikt worden in een kerninstallatie en waarvan de overeenstemming
                met deze verordening de nucleaire veiligheid van die installatie kan ondermijnen".
                Niet voltooide machines noemt het onderdeel niet.
          - output: uitgesloten_onderdeel_d
            value: $is_wapen
            legal_basis:
              law: Verordening (EU) 2023/1230
              article: '2'
              paragraph: '2'
              explanation: 'Onderdeel d: "wapens, met inbegrip van vuurwapens".'
          - output: uitgesloten_onderdeel_e
            value:
              operation: AND
              conditions:
                - $is_middel_voor_vervoer_door_lucht_over_water_of_via_spoor
                - operation: NOT
                  value:
                    operation: AND
                    conditions:
                      - $gemonteerd_op_vervoermiddel_door_lucht_over_water_of_via_spoor
                      - $is_machine
            legal_basis:
              law: Verordening (EU) 2023/1230
              article: '2'
              paragraph: '2'
              explanation: >-
                Onderdeel e: "middelen voor vervoer door de lucht, over het water en via het
                spoor, met uitzondering van machines die op die vervoermiddelen zijn gemonteerd".
                De uitzondering noemt machines, geen verwante producten.
          - output: uitgesloten_onderdeel_j
            value: $is_motorvoertuig_uitsluitend_bestemd_voor_wedstrijden
            legal_basis:
              law: Verordening (EU) 2023/1230
              article: '2'
              paragraph: '2'
              explanation: 'Onderdeel j: "motorvoertuigen die uitsluitend bestemd zijn voor wedstrijden".'
          - output: uitgesloten_onderdeel_k
            value:
              operation: OR
              conditions:
                - $is_zeeschip_of_mobiele_offshore_eenheid
                - operation: AND
                  conditions:
                    - $geinstalleerd_aan_boord_van_zeeschip_of_offshore_eenheid
                    - $is_machine
            legal_basis:
              law: Verordening (EU) 2023/1230
              article: '2'
              paragraph: '2'
              explanation: >-
                Onderdeel k: "zeeschepen en mobiele offshore-eenheden, alsmede machines die
                aan boord van dergelijke schepen of eenheden zijn geïnstalleerd". "Alsmede"
                voegt de machines aan boord toe aan de uitsluiting; verwante producten aan boord
                noemt het onderdeel niet.
          - output: uitgesloten_onderdeel_l
            value:
              operation: AND
              conditions:
                - $specifiek_ontworpen_en_gebouwd_voor_militaire_of_politiedoeleinden
                - $is_machine_of_verwant_product
            legal_basis:
              law: Verordening (EU) 2023/1230
              article: '2'
              paragraph: '2'
              explanation: >-
                Onderdeel l: "machines of verwante producten die specifiek zijn ontworpen en
                gebouwd voor militaire of politiedoeleinden".
          - output: uitgesloten_onderdeel_m
            value:
              operation: AND
              conditions:
                - $specifiek_ontworpen_en_gebouwd_voor_onderzoek_voor_tijdelijk_gebruik_in_laboratoria
                - $is_machine_of_verwant_product
            legal_basis:
              law: Verordening (EU) 2023/1230
              article: '2'
              paragraph: '2'
              explanation: >-
                Onderdeel m: "machines of verwante producten die specifiek zijn ontworpen en
                gebouwd voor onderzoeksdoeleinden voor tijdelijk gebruik in laboratoria".
          - output: uitgesloten_onderdeel_n
            value: $is_mijnlift
            legal_basis:
              law: Verordening (EU) 2023/1230
              article: '2'
              paragraph: '2'
              explanation: 'Onderdeel n: "mijnliften".'
          - output: uitgesloten_onderdeel_o
            value:
              operation: AND
              conditions:
                - $voor_verplaatsen_van_kunstenaars_tijdens_optreden
                - $is_machine_of_verwant_product
            legal_basis:
              law: Verordening (EU) 2023/1230
              article: '2'
              paragraph: '2'
              explanation: >-
                Onderdeel o: "machines of verwante producten voor het verplaatsen van kunstenaars
                tijdens een optreden".
          - output: uitgesloten_onderdeel_q
            value:
              operation: AND
              conditions:
                - $is_elektrisch_hoogspanningsproduct
                - operation: OR
                  conditions:
                    - $is_schakelmaterieel_of_besturingsapparatuur
                    - $is_transformator
            legal_basis:
              law: Verordening (EU) 2023/1230
              article: '2'
              paragraph: '2'
              explanation: >-
                Onderdeel q: "de volgende elektrische hoogspanningsproducten: i) schakelmaterieel
                en besturingsapparatuur; ii) transformators".
          - output: zonder_andere_regeling_uitgesloten
            value:
              operation: OR
              conditions:
                - $uitgesloten_onderdeel_a
                - $uitgesloten_onderdeel_b
                - $uitgesloten_onderdeel_c
                - $uitgesloten_onderdeel_d
                - $uitgesloten_onderdeel_e
                - $uitgesloten_onderdeel_j
                - $uitgesloten_onderdeel_k
                - $uitgesloten_onderdeel_l
                - $uitgesloten_onderdeel_m
                - $uitgesloten_onderdeel_n
                - $uitgesloten_onderdeel_o
                - $uitgesloten_onderdeel_q
            legal_basis:
              law: Verordening (EU) 2023/1230
              article: '2'
              paragraph: '2'
              explanation: >-
                De onderdelen van lid 2 die geen toepassingsgebied van een andere EU-regeling
                lezen. Zie de uitleg bij uitgesloten_op_grond_van_lid_2.
          - output: uitgesloten_onderdeel_f
            value:
              operation: IF
              cases:
                - when:
                    operation: AND
                    conditions:
                      - $is_luchtvaartproduct_onderdeel_of_apparatuur
                      - $is_machine
                      - $verordening_2018_1139_heeft_betrekking_op_alle_relevante_eisen
                  then:
                    operation: IF
                    cases:
                      - when: $zonder_andere_regeling_uitgesloten
                        then: null
                    default: $valt_binnen_toepassingsgebied_verordening_2018_1139
              default: false
            legal_basis:
              law: Verordening (EU) 2023/1230
              article: '2'
              paragraph: '2'
              explanation: >-
                Onderdeel f: "luchtvaartproducten, -onderdelen en -apparatuur die binnen het
                toepassingsgebied van Verordening (EU) 2018/1139 [...] en de definitie van machines
                in het kader van deze verordening vallen, voor zover Verordening (EU) 2018/1139
                betrekking heeft op de relevante essentiële gezondheids- en veiligheidseisen
                van deze verordening". De voorwaarden gelden samen, als een EN. Het toepassingsgebied
                van 2018/1139 komt uit die verordening en wordt pas gelezen als de andere voorwaarden
                vaststaan; is een ervan onbekend, dan is het onderdeel onbekend. Wat "voor zover"
                van de uitsluiting maakt, staat in de markering.
          - output: uitgesloten_onderdeel_g
            value:
              operation: IF
              cases:
                - when:
                    operation: AND
                    conditions:
                      - operation: OR
                        conditions:
                          - $is_motorvoertuig_of_aanhangwagen
                          - $is_voertuigdeel_voor_motorvoertuig_of_aanhangwagen
                      - operation: NOT
                        value:
                          operation: AND
                          conditions:
                            - $gemonteerd_op_motorvoertuig_of_aanhangwagen
                            - $is_machine
                  then:
                    operation: IF
                    cases:
                      - when: $zonder_andere_regeling_uitgesloten
                        then: null
                    default: $valt_binnen_toepassingsgebied_verordening_2018_858
              default: false
            legal_basis:
              law: Verordening (EU) 2023/1230
              article: '2'
              paragraph: '2'
              explanation: >-
                Onderdeel g: motorvoertuigen en aanhangwagens, en de systemen, onderdelen, technische
                eenheden, voertuigdelen en uitrustingsstukken die daarvoor zijn ontworpen en
                gebouwd, "die binnen het toepassingsgebied vallen van Verordening (EU) 2018/858,
                met uitzondering van machines die op die voertuigen zijn gemonteerd". Het product
                en de bijzin gelden samen, als een EN; het toepassingsgebied van 2018/858 wordt
                pas gelezen als vaststaat dat het product onder de opsomming valt en geen gemonteerde
                machine is.
          - output: uitgesloten_onderdeel_h
            value:
              operation: IF
              cases:
                - when:
                    operation: AND
                    conditions:
                      - operation: OR
                        conditions:
                          - $is_twee_of_driewielig_voertuig_of_vierwieler
                          - $is_voertuigdeel_voor_twee_of_driewielig_voertuig_of_vierwieler
                      - operation: NOT
                        value:
                          operation: AND
                          conditions:
                            - $gemonteerd_op_twee_of_driewielig_voertuig_of_vierwieler
                            - $is_machine
                  then:
                    operation: IF
                    cases:
                      - when: $zonder_andere_regeling_uitgesloten
                        then: null
                    default: $valt_binnen_toepassingsgebied_verordening_168_2013
              default: false
            legal_basis:
              law: Verordening (EU) 2023/1230
              article: '2'
              paragraph: '2'
              explanation: >-
                Onderdeel h: twee- of driewielige voertuigen en vierwielers, en de onderdelen
                die daarvoor zijn ontworpen en gebouwd, "die binnen het toepassingsgebied van
                Verordening (EU) nr. 168/2013 vallen, met uitzondering van machines die op die
                voertuigen zijn gemonteerd". Opgebouwd als onderdeel g.
          - output: uitgesloten_onderdeel_i
            value:
              operation: IF
              cases:
                - when:
                    operation: AND
                    conditions:
                      - operation: OR
                        conditions:
                          - $is_landbouw_of_bosbouwtrekker
                          - $is_voertuigdeel_voor_landbouw_of_bosbouwtrekker
                      - operation: NOT
                        value:
                          operation: AND
                          conditions:
                            - $gemonteerd_op_landbouw_of_bosbouwtrekker
                            - $is_machine
                  then:
                    operation: IF
                    cases:
                      - when: $zonder_andere_regeling_uitgesloten
                        then: null
                    default: $valt_binnen_toepassingsgebied_verordening_167_2013
              default: false
            legal_basis:
              law: Verordening (EU) 2023/1230
              article: '2'
              paragraph: '2'
              explanation: >-
                Onderdeel i: landbouw- en bosbouwtrekkers, en de onderdelen die daarvoor zijn
                ontworpen en gebouwd, "die binnen het toepassingsgebied van Verordening (EU)
                nr. 167/2013 vallen, met uitzondering van machines die op die trekkers zijn gemonteerd".
                Opgebouwd als onderdeel g.
          - output: uitgesloten_onderdeel_p
            value:
              operation: IF
              cases:
                - when:
                    operation: OR
                    conditions:
                      - operation: AND
                        conditions:
                          - $is_huishoudelijk_apparaat_voor_huishoudelijk_gebruik
                          - operation: NOT
                            value: $is_elektronisch_bedienbaar_meubel
                      - $is_audio_of_videoapparatuur
                      - $is_apparatuur_voor_informatietechnologie
                      - operation: AND
                        conditions:
                          - $is_gewone_kantoormachine
                          - operation: NOT
                            value: $is_additieve_drukmachine_voor_driedimensionale_producten
                      - operation: AND
                        conditions:
                          - $is_schakelmaterieel_of_besturingsapparatuur
                          - $is_voor_laagspanning
                      - $is_elektromotor
                  then:
                    operation: IF
                    cases:
                      - when: $zonder_andere_regeling_uitgesloten
                        then: null
                    default:
                      operation: OR
                      conditions:
                        - $valt_binnen_toepassingsgebied_richtlijn_2014_35
                        - $valt_binnen_toepassingsgebied_richtlijn_2014_53
              default: false
            legal_basis:
              law: Verordening (EU) 2023/1230
              article: '2'
              paragraph: '2'
              explanation: >-
                Onderdeel p: de producten van de punten i tot en met vi, "voor zover zij binnen
                het toepassingsgebied van Richtlijn 2014/35/EU of Richtlijn 2014/53/EU vallen".
                "Voor zover" heeft hier het product als onderwerp ("zij") en werkt als voorwaarde:
                een product valt binnen het toepassingsgebied van een richtlijn of niet. Punt
                i sluit elektronisch bedienbare meubels uit, punt iv additieve drukmachines voor
                driedimensionale producten. De richtlijnen worden pas gelezen als vaststaat dat
                het product onder een van de punten valt.
          - output: uitgesloten_op_grond_van_lid_2
            value:
              operation: OR
              conditions:
                - $zonder_andere_regeling_uitgesloten
                - operation: EQUALS
                  subject: $uitgesloten_onderdeel_f
                  value: true
                - operation: EQUALS
                  subject: $uitgesloten_onderdeel_g
                  value: true
                - operation: EQUALS
                  subject: $uitgesloten_onderdeel_h
                  value: true
                - operation: EQUALS
                  subject: $uitgesloten_onderdeel_i
                  value: true
                - operation: EQUALS
                  subject: $uitgesloten_onderdeel_p
                  value: true
            legal_basis:
              law: Verordening (EU) 2023/1230
              article: '2'
              paragraph: '2'
              explanation: >-
                Aanhef: "Deze verordening is niet van toepassing op:" gevolgd door de onderdelen
                a tot en met q. Eén onderdeel volstaat. De onderdelen f, g, h, i en p lezen
                het toepassingsgebied van een andere EU-regeling, en doen dat alleen als hun
                eigen feiten vaststaan en geen onderdeel zonder andere regeling het product al
                uitsluit. Zo vraagt een raceauto (onderdeel j) niet om Verordening (EU)
                2018/858, die nog niet in het corpus staat. Zo'n onderdeel geeft dan zelf geen
                oordeel (null): dat een ander onderdeel al volstaat, zegt niets over de vraag
                of het product ook onder de andere regeling valt. Een onderdeel telt daarom
                alleen mee als het uitdrukkelijk true is.
          - output: verordening_van_toepassing
            value:
              operation: AND
              conditions:
                - $is_product_binnen_toepassingsgebied
                - operation: NOT
                  value: $uitgesloten_op_grond_van_lid_2
            legal_basis:
              law: Verordening (EU) 2023/1230
              article: '2'
              paragraph: '2'
              explanation: >-
                Lid 1 zegt op welke producten de verordening van toepassing is, lid 2 op welke
                zij "niet van toepassing" is. Van toepassing is zij dus op een product van lid 1
                dat onder geen onderdeel van lid 2 valt. Lid 2 is geen afwijking "in afwijking van"
                lid 1, maar een beperking ervan; de aanduiding van lid 1, derde alinea, blijft
                daardoor ongewijzigd.
  - number: '3'
    text: >-
      **Definities**


      Voor de toepassing van deze verordening wordt verstaan onder: 1) “machine”: a) samenstel,
      voorzien van of bestemd om te worden voorzien van een aandrijfsysteem – maar niet op
      basis van rechtstreeks gebruikte menselijke of dierlijke spierkracht –, van onderling
      verbonden onderdelen of componenten waarvan er ten minste één kan bewegen, en die samengevoegd
      worden voor een bepaalde toepassing; b) samenstel als bedoeld in punt a), waaraan slechts
      de componenten voor de montage op de plaats van gebruik of voor de aansluiting op kracht-
      of aandrijfbronnen ontbreken; c) samenstel als bedoeld in de punten a) en b) dat gereed
      is voor montage en dat alleen in deze staat kan functioneren na montage op een vervoermiddel
      of montage in een gebouw of bouwwerk; d) samenstel van machines als bedoeld in de punten
      a), b) en c) of van niet voltooide machines, dat – teneinde tot hetzelfde resultaat
      te komen – zodanig is opgesteld en wordt bestuurd dat het als één geheel functioneert;
      e) samenstel van onderling verbonden onderdelen of componenten waarvan er ten minste
      één kan bewegen, die in hun samenhang bestemd zijn voor het heffen van lasten en waarvan
      de enige krachtbron rechtsreeks uitgeoefende menselijke spierkracht is; f) samenstel
      als bedoeld in de punten a) tot en met e) waarop enkel de software voor de specifieke,
      door de fabrikant bedoelde toepassing ervan ontbreekt; 2) “verwisselbaar uitrustingsstuk”:
      inrichting die na inbedrijfstelling van een machine of een landbouw- of bosbouwtrekker
      door de bediener hieraan wordt gekoppeld om deze een andere of nieuwe functie te geven,
      mits het uitrustingsstuk geen gereedschap is; 3) “veiligheidscomponent”: fysieke of
      digitale component, met inbegrip van software, van een product dat binnen het toepassingsgebied
      van deze verordening valt, die ontworpen of bedoeld is om een veiligheidsfunctie te
      vervullen en die afzonderlijk in de handel wordt gebracht, waarvan het niet of verkeerd
      functioneren de veiligheid van personen in gevaar brengt, maar die niet nodig is voor
      de werking van dat product, of die door gewone componenten kan worden vervangen om dat
      product te doen werken; 4) “veiligheidsfunctie”: functie van een beschermende maatregel
      die ontworpen is om een risico weg te nemen of, indien dat niet mogelijk is, te verminderen,
      en die, indien zij uitvalt, tot een toename van dat risico zou kunnen leiden; 5) “hijs-
      of hefgereedschap”: niet vast met de hijs- of hefmachine verbonden onderdeel of uitrustingsstuk
      voor het hijsen of heffen van een last dat tussen de machine en de last of op de last
      zelf wordt aangebracht dan wel bestemd is om een integrerend deel van de last uit te
      maken en dat afzonderlijk in de handel wordt gebracht, met inbegrip van stroppen en
      componenten daarvan; 6) “kettingen”: kettingen die zijn ontworpen en geproduceerd voor
      hijs- en hefdoeleinden als onderdeel van hijs- of hefmachines of van hijs- of hefgereedschap;
      7) “kabels”: kabels die zijn ontworpen en geproduceerd voor hijs- en hefdoeleinden als
      onderdeel van hijs- of hefmachines of van hijs- of hefgereedschap; 8) “banden”: banden
      die zijn ontworpen en geproduceerd voor hijs- en hefdoeleinden als onderdeel van hijs-
      of hefmachines of van hijs- of hefgereedschap; 9) “verwijderbare mechanische overbrengingsinrichting”:
      een verwijderbare component voor krachtoverbrenging tussen een machine met eigen aandrijving
      of een trekker en een andere machine of een verwant product door ze te verbinden bij
      de eerste vaste aslager; wanneer de inrichting samen met een afscherming in de handel
      wordt gebracht, moeten de inrichting en de afscherming als één product worden beschouwd;
      10) “niet voltooide machine”: samenstel dat nog geen machine vormt, aangezien het niet
      zelfstandig een bepaalde toepassing kan realiseren, en dat slechts is bedoeld om te
      worden ingebouwd in of te worden samengebouwd met andere, al dan niet voltooide, machines
      of uitrusting om een machine te vormen; 11) “op de markt aanbieden”: het in het kader
      van een handelsactiviteit, al dan niet tegen betaling, verstrekken van een product dat
      binnen het toepassingsgebied van deze verordening valt, met het oog op distributie of
      gebruik op de markt van de Unie; 12) “in de handel brengen”: het voor het eerst in de
      Unie op de markt aanbieden van een product dat binnen het toepassingsgebied van deze
      verordening valt; 13) “inbedrijfstelling”: eerste gebruik in de Unie van machines of
      verwante producten overeenkomstig het gebruiksdoel; 14) “essentiële gezondheids- en
      veiligheidseisen”: de in bijlage III opgenomen bindende bepalingen betreffende het ontwerp
      en de bouw van producten die binnen het toepassingsgebied van deze verordening vallen,
      om te zorgen voor een hoog beschermingsniveau van de gezondheid en de veiligheid van
      personen en, in voorkomend geval, huisdieren en eigendommen en, indien van toepassing,
      van het milieu; 15) “harmonisatiewetgeving van de Unie”: alle wetgeving van de Unie
      die de voorwaarden voor het verhandelen van producten harmoniseert; 16) “substantiële
      wijziging”: niet door de fabrikant voorziene of geplande wijziging van een machine of
      verwant product met fysieke of digitale middelen nadat die machine of dat verwante product
      in de handel is gebracht of in bedrijf is gesteld, die gevolgen heeft voor de veiligheid
      van die machine of dat verwante product, door een nieuw gevaar te creëren of een bestaand
      risico te vergroten, zodat het volgende vereist is: a) de toevoeging van afschermingen
      of beveiligingsinrichtingen aan die machine of dat verwante product waarvan de realisatie
      een wijziging vereist van het bestaande veiligheidscontrolesysteem, of b) de vaststelling
      van aanvullende beschermingsmaatregelen om de stabiliteit of de mechanische sterkte
      van de machine of dat verwante product te waarborgen; 17) “gebruiksaanwijzing”: door
      de fabrikant bij het in de handel brengen of in bedrijf stellen van de machine of het
      verwante product verstrekte informatie om de gebruiker van de machine of het verwante
      product op de hoogte te brengen van het beoogde en juiste gebruik van die machine of
      dat verwante product, alsook informatie over bij het gebruik of de installatie van de
      machine of het verwante product te nemen voorzorgsmaatregelen, met inbegrip van informatie
      over de veiligheidsaspecten en over de wijze waarop ervoor moet worden gezorgd dat die
      machine of dat verwante product veilig blijft en gedurende zijn hele levensduur berekend
      blijft op zijn taak; 18) “fabrikant”: elke natuurlijke of rechtspersoon die: a) producten
      die binnen het toepassingsgebied van deze verordening vallen, vervaardigt of deze producten
      laat ontwerpen of vervaardigen, en die die producten onder zijn of haar eigen naam of
      merk in de handel brengt; of b) producten die binnen het toepassingsgebied van deze
      verordening vallen, voor eigen gebruik vervaardigt en in bedrijf stelt; 19) “gemachtigde”:
      in de Unie gevestigde natuurlijke persoon of rechtspersoon die schriftelijk door de
      fabrikant is gemachtigd om namens de fabrikant specifieke taken te vervullen; 20) “importeur”:
      in de Unie gevestigde natuurlijke persoon of rechtspersoon die een product dat binnen
      het toepassingsgebied van deze verordening valt, uit een derde land in de Unie in de
      handel brengt; 21) “distributeur”: andere natuurlijke persoon of rechtspersoon in de
      toeleveringsketen dan de fabrikant of de importeur, die een product dat binnen het toepassingsgebied
      van deze verordening valt, op de markt aanbiedt; 22) “marktdeelnemer”: de fabrikant,
      de gemachtigde, de importeur of de distributeur; 23) “technische specificaties”: document
      dat technische eisen voorschrijft waaraan producten die binnen het toepassingsgebied
      van deze verordening vallen, moeten voldoen; 24) “geharmoniseerde norm”: geharmoniseerde
      norm zoals gedefinieerd in artikel 2, punt 1, c), van Verordening (EU) nr. 1025/2012;
      25) “CE-markering”: markering waarmee de fabrikant aangeeft dat een machine of een verwant
      product in overeenstemming is met alle toepasselijke eisen van de harmonisatiewetgeving
      van de Unie die in het aanbrengen ervan voorziet; 26) “accreditatie”: accreditatie als
      gedefinieerd in artikel 2, punt 10, van Verordening (EG) nr. 765/2008; 27) “nationale
      accreditatie-instantie”: nationale accreditatie-instantie zoals gedefinieerd in artikel
      2, punt 11, van Verordening (EG) nr. 765/2008; 28) “conformiteitsbeoordeling”: proces
      waarmee wordt aangetoond of machines of verwante producten voldoen aan de toepasselijke
      essentiële gezondheids- en veiligheidseisen in deze verordening; 29) “conformiteitsbeoordelingsinstantie”:
      instantie die conformiteitsbeoordelingsactiviteiten, zoals ijken, testen, certificeren
      en inspecteren, uitvoert; 30) “aangemelde instantie”: conformiteitsbeoordelingsinstantie
      die overeenkomstig deze verordening is aangemeld; 31) “markttoezichtautoriteit”: markttoezichtautoriteit
      zoals gedefinieerd in artikel 3, punt 4, van Verordening (EU) 2019/1020; 32) “terugroepen”:
      maatregel waarmee wordt beoogd een product dat binnen het toepassingsgebied van deze
      verordening valt en dat al aan een gebruiker ter beschikking is gesteld, te doen terugkeren;
      33) “uit de handel nemen”: voor een product: maatregel waarmee wordt beoogd te voorkomen
      dat een product dat binnen het toepassingsgebied van deze verordening valt en dat zich
      in de toeleveringsketen bevindt, op de markt wordt aangeboden; 34) “levensduur”: periode
      vanaf het moment waarop een machine of een verwant product in de handel wordt gebracht
      of in bedrijf wordt gesteld tot het moment van de verwijdering ervan, met inbegrip van
      de effectieve periode waarin de machine of het verwante product kan worden gebruikt
      en de fasen van vervoer, montage, ontmanteling, uitschakeling, sloop of andere fysieke
      of digitale wijzigingen waarin door de fabrikant is voorzien; 35) “broncode”: op het
      moment in kwestie geïnstalleerde versie van de software van een product dat binnen het
      toepassingsgebied van deze verordening valt, op zodanige wijze in een programmeertaal
      opgesteld dat de code ondubbelzinnig en begrijpelijk is voor de mens; 36) “professionele
      gebruiker”: natuurlijke persoon die in het kader van zijn of haar beroepsactiviteit
      of werk een machine of verwant product gebruikt of bedient.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_3
    machine_readable:
      markings:
        - about: een begrip dat het beoordeelde product kenmerkt naar een ander product
          reason: >-
            Punt 3 noemt een component een veiligheidscomponent als het een component is "van
            een product dat binnen het toepassingsgebied van deze verordening valt". Dat is de
            uitkomst van artikel 2, lid 1, maar voor een ander product dan het product dat wordt
            beoordeeld. Punt 1, onder d) ("samenstel van machines als bedoeld in de punten a),
            b) en c)"), punt 2 ("een machine of een landbouw- of bosbouwtrekker"), punt 9 ("een
            andere machine of een verwant product") en punt 10 ("andere, al dan niet voltooide,
            machines") hebben dezelfde vorm. Een uitvoering
            beoordeelt één product, dat alleen bestaat als de feiten die de aanroeper als parameters
            meegeeft. Een verwijzing naar een uitkomst van deze verordening binnen hetzelfde
            document krijgt diezelfde parameters, en de engine herkent een uitkomst die al wordt
            berekend aan zijn naam, niet aan het product waarvoor hij wordt gevraagd. Een tweede
            product kan dus niet worden aangewezen, en het model neemt het oordeel over dat andere
            product als feit van de aanroeper aan.
          resolution: model
          resolved_by: >-
            Een productsleutel als parameter, waarop de feiten van een product uit een bron komen,
            zodat een definitie de uitkomst van deze verordening voor een ander product kan opvragen
            met de sleutel van dat product, zoals een wet de gegevens van een partner opvraagt
            met diens bsn.
          target: []
          legal_text_excerpt: van een product dat binnen het toepassingsgebied van deze verordening valt
          accepted: false
        - about: inrichting en afscherming worden als één product beschouwd
          reason: >-
            Punt 9 bepaalt dat een overbrengingsinrichting die samen met een afscherming in de
            handel wordt gebracht, met die afscherming "als één product" wordt beschouwd. Dat
            is een fictie over wat het product is. Het model beoordeelt één product dat de
            aanroeper met zijn feiten beschrijft, en kent geen vorm waarin twee dingen samen
            één product worden, zodat de feiten van de afscherming meetellen bij die van de
            inrichting.
          resolution: model
          resolved_by: >-
            Een vorm waarin een product uit samengestelde delen bestaat, met een regel die zegt
            wanneer die delen als één product gelden.
          target: []
          legal_text_excerpt: moeten de inrichting en de afscherming als één product worden beschouwd
          accepted: false
      # Dit artikel telt 36 punten. Uitvoerbaar zijn de punten 1 tot en met 10: de begrippen
      # die artikel 2, lid 1, leest. De punten 11 tot en met 36 hebben nog geen model. Een
      # paar ervan gebruiken de uitvoerbare artikelen wel, maar dan als feit dat de aanroeper
      # vaststelt: "in de handel brengen" (punt 12) en "inbedrijfstelling" (punt 13) in de
      # punten 2, 3 en 5 hierboven, "fabrikant" (punt 18) in artikel 2, lid 2, onder a, en
      # "essentiële gezondheids- en veiligheidseisen" (punt 14) en "geharmoniseerde norm"
      # (punt 24) in artikel 25, lid 3. Zo'n feit wordt een binding naar dit artikel zodra
      # dat punt een model krijgt. De punten 24, 26, 27 en 31 zijn definities door verwijzing,
      # naar Verordening (EU) nr. 1025/2012 (punt 24), Verordening (EG) nr. 765/2008 (punten
      # 26 en 27) en Verordening (EU) 2019/1020 (punt 31); hun model wordt een binding naar
      # die regelingen.
      execution:
        parameters:
          - name: samenstel_met_ten_minste_een_beweegbaar_onderdeel
            type: boolean
            required: false
            description: >-
              Punt 1, onder a en e. Het product is een samenstel van onderling verbonden onderdelen
              of componenten waarvan er ten minste één kan bewegen.
          - name: voorzien_van_of_bestemd_voor_aandrijfsysteem
            type: boolean
            required: false
            description: >-
              Punt 1, onder a. Het samenstel is voorzien van, of bestemd om te worden voorzien
              van, een aandrijfsysteem.
          - name: aandrijfsysteem_op_basis_van_rechtstreekse_spierkracht
            type: boolean
            required: false
            description: >-
              Punt 1, onder a. Het aandrijfsysteem werkt op basis van rechtstreeks gebruikte
              menselijke of dierlijke spierkracht.
          - name: samengevoegd_voor_bepaalde_toepassing
            type: boolean
            required: false
            description: Punt 1, onder a. De onderdelen worden samengevoegd voor een bepaalde toepassing.
          - name: samenstel_als_a_waaraan_slechts_montage_of_aansluitcomponenten_ontbreken
            type: boolean
            required: false
            description: >-
              Punt 1, onder b. Een samenstel als bedoeld in punt a, waaraan slechts de componenten
              voor de montage op de plaats van gebruik of voor de aansluiting op kracht- of aandrijfbronnen
              ontbreken.
          - name: gereed_voor_montage_en_functioneert_alleen_na_montage_op_vervoermiddel_of_in_gebouw
            type: boolean
            required: false
            description: >-
              Punt 1, onder c. Het samenstel is gereed voor montage en kan alleen in deze staat
              functioneren na montage op een vervoermiddel of montage in een gebouw of bouwwerk.
          - name: samenstel_van_machines_dat_als_een_geheel_functioneert
            type: boolean
            required: false
            description: >-
              Punt 1, onder d. Een samenstel van machines als bedoeld in de punten a, b en c,
              of van niet voltooide machines, dat teneinde tot hetzelfde resultaat te komen zodanig
              is opgesteld en wordt bestuurd dat het als één geheel functioneert. Of de delen
              machines zijn, stelt de aanroeper vast; zie de markering.
          - name: in_samenhang_bestemd_voor_heffen_van_lasten
            type: boolean
            required: false
            description: Punt 1, onder e. De onderdelen zijn in hun samenhang bestemd voor het heffen van lasten.
          - name: enige_krachtbron_is_rechtstreeks_uitgeoefende_menselijke_spierkracht
            type: boolean
            required: false
            description: Punt 1, onder e.
          - name: samenstel_als_a_tot_en_met_e_waarop_enkel_software_ontbreekt
            type: boolean
            required: false
            description: >-
              Punt 1, onder f. Een samenstel als bedoeld in de punten a tot en met e waarop enkel
              de software voor de specifieke, door de fabrikant bedoelde toepassing ervan ontbreekt.
          - name: door_bediener_gekoppeld_aan_machine_of_trekker_voor_andere_of_nieuwe_functie
            type: boolean
            required: false
            description: >-
              Punt 2. Een inrichting die na inbedrijfstelling van een machine of een landbouw-
              of bosbouwtrekker door de bediener hieraan wordt gekoppeld om deze een andere of
              nieuwe functie te geven.
          - name: is_gereedschap
            type: boolean
            required: false
            description: Punt 2, "mits het uitrustingsstuk geen gereedschap is".
          - name: component_van_product_binnen_toepassingsgebied
            type: boolean
            required: false
            description: >-
              Punt 3. Een fysieke of digitale component, met inbegrip van software, van een product
              dat binnen het toepassingsgebied van deze verordening valt. Dat andere product beoordeelt
              de aanroeper; zie de markering.
          - name: functie_van_beschermende_maatregel_tegen_risico
            type: boolean
            required: false
            description: >-
              Punt 4. De functie waarvoor de component is ontworpen of bedoeld, is een functie
              van een beschermende maatregel die ontworpen is om een risico weg te nemen of, indien
              dat niet mogelijk is, te verminderen.
          - name: uitval_kan_tot_toename_van_risico_leiden
            type: boolean
            required: false
            description: Punt 4. Uitval van die functie zou tot een toename van dat risico kunnen leiden.
          - name: afzonderlijk_in_de_handel_gebracht
            type: boolean
            required: false
            description: Punten 3 en 5. Het product wordt afzonderlijk in de handel gebracht.
          - name: niet_of_verkeerd_functioneren_brengt_veiligheid_van_personen_in_gevaar
            type: boolean
            required: false
            description: Punt 3.
          - name: niet_nodig_voor_werking_van_dat_product
            type: boolean
            required: false
            description: Punt 3.
          - name: door_gewone_componenten_vervangbaar_om_product_te_doen_werken
            type: boolean
            required: false
            description: Punt 3.
          - name: niet_vast_verbonden_onderdeel_voor_hijsen_of_heffen_van_last
            type: boolean
            required: false
            description: >-
              Punt 5. Een niet vast met de hijs- of hefmachine verbonden onderdeel of uitrustingsstuk
              voor het hijsen of heffen van een last.
          - name: aangebracht_tussen_machine_en_last_of_op_last
            type: boolean
            required: false
            description: Punt 5. Wordt tussen de machine en de last of op de last zelf aangebracht.
          - name: bestemd_om_integrerend_deel_van_last_uit_te_maken
            type: boolean
            required: false
            description: Punt 5.
          - name: is_strop_of_component_daarvan
            type: boolean
            required: false
            description: Punt 5, "met inbegrip van stroppen en componenten daarvan".
          - name: is_ketting_als_voorwerp
            type: boolean
            required: false
            description: Punt 6. Het voorwerp is een ketting.
          - name: is_kabel_als_voorwerp
            type: boolean
            required: false
            description: Punt 7. Het voorwerp is een kabel.
          - name: is_band_als_voorwerp
            type: boolean
            required: false
            description: Punt 8. Het voorwerp is een band.
          - name: ontworpen_en_geproduceerd_voor_hijs_en_hefdoeleinden
            type: boolean
            required: false
            description: >-
              Punten 6, 7 en 8. Ontworpen en geproduceerd voor hijs- en hefdoeleinden als onderdeel
              van hijs- of hefmachines of van hijs- of hefgereedschap.
          - name: verwijderbare_component_voor_krachtoverbrenging
            type: boolean
            required: false
            description: Punt 9. Het product is een verwijderbare component voor krachtoverbrenging.
          - name: tussen_machine_met_eigen_aandrijving_of_trekker_en_andere_machine_of_verwant_product
            type: boolean
            required: false
            description: >-
              Punt 9. De krachtoverbrenging loopt tussen een machine met eigen aandrijving of
              een trekker en een andere machine of een verwant product. Of dat andere product
              een machine of verwant product is, neemt het model als feit aan; zie de markering
              over een begrip dat naar een ander product verwijst.
          - name: verbindt_bij_eerste_vaste_aslager
            type: boolean
            required: false
            description: Punt 9. De component verbindt die twee bij de eerste vaste aslager.
          - name: kan_niet_zelfstandig_bepaalde_toepassing_realiseren
            type: boolean
            required: false
            description: >-
              Punt 10. Het samenstel kan niet zelfstandig een bepaalde toepassing realiseren:
              het is nog bedoeld om met andere machines of uitrusting een machine te vormen.
              Dat een samenstel pas na montage op een vervoermiddel of in een gebouw kan
              functioneren (punt 1, onder c), valt hier niet onder.
          - name: slechts_bedoeld_om_te_worden_ingebouwd_om_machine_te_vormen
            type: boolean
            required: false
            description: >-
              Punt 10. Slechts bedoeld om te worden ingebouwd in of te worden samengebouwd met
              andere, al dan niet voltooide, machines of uitrusting om een machine te vormen.
        output:
          - name: machine_onder_a
            type: boolean
            description: Punt 1, onder a.
          - name: machine_onder_b
            type: boolean
            description: Punt 1, onder b.
          - name: machine_onder_c
            type: boolean
            description: Punt 1, onder c.
          - name: machine_onder_e
            type: boolean
            description: Punt 1, onder e.
          - name: is_machine
            type: boolean
            description: Punt 1, "machine".
          - name: is_verwisselbaar_uitrustingsstuk
            type: boolean
            description: Punt 2.
          - name: is_veiligheidsfunctie
            type: boolean
            description: Punt 4, voor de functie waarvoor de component is ontworpen of bedoeld.
          - name: is_veiligheidscomponent
            type: boolean
            description: Punt 3.
          - name: is_hijs_of_hefgereedschap
            type: boolean
            description: Punt 5.
          - name: is_ketting
            type: boolean
            description: Punt 6, "kettingen".
          - name: is_kabel
            type: boolean
            description: Punt 7, "kabels".
          - name: is_band
            type: boolean
            description: Punt 8, "banden".
          - name: is_verwijderbare_mechanische_overbrengingsinrichting
            type: boolean
            description: Punt 9.
          - name: is_niet_voltooide_machine
            type: boolean
            description: Punt 10.
        actions:
          - output: machine_onder_a
            value:
              operation: AND
              conditions:
                - $samenstel_met_ten_minste_een_beweegbaar_onderdeel
                - $voorzien_van_of_bestemd_voor_aandrijfsysteem
                - operation: NOT
                  value: $aandrijfsysteem_op_basis_van_rechtstreekse_spierkracht
                - $samengevoegd_voor_bepaalde_toepassing
                - operation: NOT
                  value: $kan_niet_zelfstandig_bepaalde_toepassing_realiseren
            legal_basis:
              law: Verordening (EU) 2023/1230
              article: '3'
              explanation: >-
                Punt 1, onder a: "samenstel, voorzien van of bestemd om te worden voorzien van
                een aandrijfsysteem – maar niet op basis van rechtstreeks gebruikte menselijke
                of dierlijke spierkracht –, van onderling verbonden onderdelen of componenten
                waarvan er ten minste één kan bewegen, en die samengevoegd worden voor een bepaalde
                toepassing". Punt 10 zegt dat een samenstel "nog geen machine vormt, aangezien
                het niet zelfstandig een bepaalde toepassing kan realiseren". Een samenstel dat
                dat niet kan, is daarom geen machine onder a, ook niet als het voor een toepassing
                is samengevoegd. Punt 1, onder c, verwijst naar a en b; voor zijn a-tak geldt dit
                daardoor ook. De onderdelen b, d, e en f noemen hun eigen feiten, en daar leest
                het model punt 10 niet in.
          - output: machine_onder_b
            value: $samenstel_als_a_waaraan_slechts_montage_of_aansluitcomponenten_ontbreken
            legal_basis:
              law: Verordening (EU) 2023/1230
              article: '3'
              explanation: >-
                Punt 1, onder b: een samenstel als bedoeld in punt a, waaraan slechts de componenten
                voor montage of aansluiting ontbreken. Omdat die componenten ontbreken, voldoet
                het samenstel zelf niet aan punt a; het is een eigen feit.
          - output: machine_onder_c
            value:
              operation: AND
              conditions:
                - operation: OR
                  conditions:
                    - $machine_onder_a
                    - $machine_onder_b
                - $gereed_voor_montage_en_functioneert_alleen_na_montage_op_vervoermiddel_of_in_gebouw
            legal_basis:
              law: Verordening (EU) 2023/1230
              article: '3'
              explanation: >-
                Punt 1, onder c: "samenstel als bedoeld in de punten a) en b) dat gereed is voor
                montage en dat alleen in deze staat kan functioneren na montage op een vervoermiddel
                of montage in een gebouw of bouwwerk".
          - output: machine_onder_e
            value:
              operation: AND
              conditions:
                - $samenstel_met_ten_minste_een_beweegbaar_onderdeel
                - $in_samenhang_bestemd_voor_heffen_van_lasten
                - $enige_krachtbron_is_rechtstreeks_uitgeoefende_menselijke_spierkracht
            legal_basis:
              law: Verordening (EU) 2023/1230
              article: '3'
              explanation: >-
                Punt 1, onder e: "samenstel van onderling verbonden onderdelen of componenten
                waarvan er ten minste één kan bewegen, die in hun samenhang bestemd zijn voor
                het heffen van lasten en waarvan de enige krachtbron rechtsreeks uitgeoefende
                menselijke spierkracht is".
          - output: is_machine
            value:
              operation: OR
              conditions:
                - $machine_onder_a
                - $machine_onder_b
                - $machine_onder_c
                - $samenstel_van_machines_dat_als_een_geheel_functioneert
                - $machine_onder_e
                - $samenstel_als_a_tot_en_met_e_waarop_enkel_software_ontbreekt
            legal_basis:
              law: Verordening (EU) 2023/1230
              article: '3'
              explanation: >-
                Punt 1: een machine is een samenstel als bedoeld in een van de onderdelen a tot
                en met f. Onderdeel d (samenstel van machines of niet voltooide machines dat als
                één geheel functioneert) en onderdeel f (samenstel als bedoeld in a tot en met
                e waarop enkel de software ontbreekt) zijn feiten van de aanroeper.
          - output: is_verwisselbaar_uitrustingsstuk
            value:
              operation: AND
              conditions:
                - $door_bediener_gekoppeld_aan_machine_of_trekker_voor_andere_of_nieuwe_functie
                - operation: NOT
                  value: $is_gereedschap
            legal_basis:
              law: Verordening (EU) 2023/1230
              article: '3'
              explanation: >-
                Punt 2: "inrichting die na inbedrijfstelling van een machine of een landbouw-
                of bosbouwtrekker door de bediener hieraan wordt gekoppeld om deze een andere
                of nieuwe functie te geven, mits het uitrustingsstuk geen gereedschap is".
          - output: is_veiligheidsfunctie
            value:
              operation: AND
              conditions:
                - $functie_van_beschermende_maatregel_tegen_risico
                - $uitval_kan_tot_toename_van_risico_leiden
            legal_basis:
              law: Verordening (EU) 2023/1230
              article: '3'
              explanation: >-
                Punt 4: "functie van een beschermende maatregel die ontworpen is om een risico
                weg te nemen of, indien dat niet mogelijk is, te verminderen, en die, indien zij
                uitvalt, tot een toename van dat risico zou kunnen leiden".
          - output: is_veiligheidscomponent
            value:
              operation: AND
              conditions:
                - $component_van_product_binnen_toepassingsgebied
                - $is_veiligheidsfunctie
                - $afzonderlijk_in_de_handel_gebracht
                - $niet_of_verkeerd_functioneren_brengt_veiligheid_van_personen_in_gevaar
                - operation: OR
                  conditions:
                    - $niet_nodig_voor_werking_van_dat_product
                    - $door_gewone_componenten_vervangbaar_om_product_te_doen_werken
            legal_basis:
              law: Verordening (EU) 2023/1230
              article: '3'
              explanation: >-
                Punt 3: "fysieke of digitale component, met inbegrip van software, van een product
                dat binnen het toepassingsgebied van deze verordening valt, die ontworpen of bedoeld
                is om een veiligheidsfunctie te vervullen en die afzonderlijk in de handel wordt
                gebracht, waarvan het niet of verkeerd functioneren de veiligheid van personen
                in gevaar brengt, maar die niet nodig is voor de werking van dat product, of die
                door gewone componenten kan worden vervangen om dat product te doen werken". De
                "of" staat tussen de twee laatste bijzinnen; de veiligheidsfunctie komt uit punt
                4.
          - output: is_hijs_of_hefgereedschap
            value:
              operation: OR
              conditions:
                - operation: AND
                  conditions:
                    - $niet_vast_verbonden_onderdeel_voor_hijsen_of_heffen_van_last
                    - operation: OR
                      conditions:
                        - $aangebracht_tussen_machine_en_last_of_op_last
                        - $bestemd_om_integrerend_deel_van_last_uit_te_maken
                    - $afzonderlijk_in_de_handel_gebracht
                - $is_strop_of_component_daarvan
            legal_basis:
              law: Verordening (EU) 2023/1230
              article: '3'
              explanation: >-
                Punt 5: een niet vast verbonden onderdeel of uitrustingsstuk voor het hijsen of
                heffen van een last "dat tussen de machine en de last of op de last zelf wordt
                aangebracht dan wel bestemd is om een integrerend deel van de last uit te maken
                en dat afzonderlijk in de handel wordt gebracht, met inbegrip van stroppen en
                componenten daarvan".
          - output: is_ketting
            value:
              operation: AND
              conditions:
                - $is_ketting_als_voorwerp
                - $ontworpen_en_geproduceerd_voor_hijs_en_hefdoeleinden
            legal_basis:
              law: Verordening (EU) 2023/1230
              article: '3'
              explanation: >-
                Punt 6: "kettingen die zijn ontworpen en geproduceerd voor hijs- en hefdoeleinden
                als onderdeel van hijs- of hefmachines of van hijs- of hefgereedschap".
          - output: is_kabel
            value:
              operation: AND
              conditions:
                - $is_kabel_als_voorwerp
                - $ontworpen_en_geproduceerd_voor_hijs_en_hefdoeleinden
            legal_basis:
              law: Verordening (EU) 2023/1230
              article: '3'
              explanation: 'Punt 7: "kabels die zijn ontworpen en geproduceerd voor hijs- en hefdoeleinden [...]".'
          - output: is_band
            value:
              operation: AND
              conditions:
                - $is_band_als_voorwerp
                - $ontworpen_en_geproduceerd_voor_hijs_en_hefdoeleinden
            legal_basis:
              law: Verordening (EU) 2023/1230
              article: '3'
              explanation: 'Punt 8: "banden die zijn ontworpen en geproduceerd voor hijs- en hefdoeleinden [...]".'
          - output: is_verwijderbare_mechanische_overbrengingsinrichting
            value:
              operation: AND
              conditions:
                - $verwijderbare_component_voor_krachtoverbrenging
                - $tussen_machine_met_eigen_aandrijving_of_trekker_en_andere_machine_of_verwant_product
                - $verbindt_bij_eerste_vaste_aslager
            legal_basis:
              law: Verordening (EU) 2023/1230
              article: '3'
              explanation: >-
                Punt 9: "een verwijderbare component voor krachtoverbrenging tussen een machine
                met eigen aandrijving of een trekker en een andere machine of een verwant product
                door ze te verbinden bij de eerste vaste aslager". De tweede helft van punt 9,
                over inrichting en afscherming als één product, staat in een markering.
          - output: is_niet_voltooide_machine
            value:
              operation: AND
              conditions:
                - operation: NOT
                  value: $is_machine
                - $kan_niet_zelfstandig_bepaalde_toepassing_realiseren
                - $slechts_bedoeld_om_te_worden_ingebouwd_om_machine_te_vormen
            legal_basis:
              law: Verordening (EU) 2023/1230
              article: '3'
              explanation: >-
                Punt 10: "samenstel dat nog geen machine vormt, aangezien het niet zelfstandig
                een bepaalde toepassing kan realiseren, en dat slechts is bedoeld om te worden
                ingebouwd in of te worden samengebouwd met andere, al dan niet voltooide, machines
                of uitrusting om een machine te vormen". "Nog geen machine" is de ontkenning van
                punt 1.
  - number: '4'
    text: >-
      **Vrij verkeer**


      1. Het is de lidstaten niet toegestaan het op de markt aanbieden van producten die binnen
      het toepassingsgebied van deze verordening vallen, of het in bedrijf stellen van machines
      of verwante producten die voldoen aan deze verordening, te belemmeren om redenen die
      verband houden met aspecten die door deze verordening worden geregeld.


      2. De lidstaten beletten niet dat een product dat binnen het toepassingsgebied van deze
      verordening valt en niet met deze verordening in overeenstemming is, op jaarbeurzen
      of tentoonstellingen, dan wel bij demonstraties en soortgelijke evenementen, wordt tentoongesteld,
      mits duidelijk zichtbaar is aangegeven dat dat product niet met deze verordening in
      overeenstemming is en niet op de markt wordt aangeboden voordat het met deze verordening
      in overeenstemming is gebracht. Bij demonstraties worden alle nodige maatregelen getroffen
      om de bescherming van personen te waarborgen.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_4
  - number: '5'
    text: >-
      **Bescherming van personen tijdens de installatie of het gebruik van machines of verwante
      producten**


      De lidstaten kunnen eisen vaststellen om de bescherming van personen, onder wie werknemers,
      te waarborgen bij de installatie of het gebruik van machines of verwante producten,
      mits machines of verwante producten op grond van dergelijke voorschriften niet kunnen
      worden gewijzigd op een manier die niet in overeenstemming is met deze verordening.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_5
  - number: '6'
    text: >-
      **In bijlage I vermelde categorieën machines en verwante producten waarvoor specifieke
      conformiteitsbeoordelingsprocedures gelden**


      1. Voor machines en verwante producten die in de in bijlage I, deel A, vermelde categorieën
      vallen, gelden de specifieke, in artikel 25, lid 2, genoemde conformiteitsbeoordelingsprocedures
      en voor machines en verwante producten die in de in bijlage I, deel B, vermelde categorieën
      vallen, gelden de specifieke, in artikel 25, lid 3, genoemde conformiteitsbeoordelingsprocedures.


      2. Overeenkomstig artikel 47 is de Commissie bevoegd, na raadpleging van de betrokken
      belanghebbenden, gedelegeerde handelingen vast te stellen om bijlage I, in het licht
      van technische vooruitgang, nieuwe kennis of nieuw wetenschappelijk bewijs en overeenkomstig
      de in de leden 4, 5 en 7 van dit artikel genoemde criteria en procedures, te wijzigen
      door een nieuwe categorie machines of verwante producten aan de lijst van categorieën
      machines of verwante producten in bijlage I toe te voegen of een bestaande categorie
      machines of verwante producten van die lijst te schrappen, of een categorie machines
      of verwante producten van een deel van bijlage I naar een ander deel van die bijlage
      te verplaatsen.


      3. Alvorens een gedelegeerde handeling vast te stellen, wint de Commissie overeenkomstig
      artikel 47, lid 4, het advies in van deskundigen in de relevante deskundigengroep.


      4. De Commissie beoordeelt de ernst van het intrinsieke potentiële risico dat een categorie
      machines of verwante producten oplevert om te bepalen of die categorie machines of verwante
      producten aan bijlage I moet worden toegevoegd dan wel of die categorie machines of
      verwante producten uit bijlage I moet worden geschrapt. Die beoordeling wordt uitgevoerd
      op basis van een combinatie van de kans op schade en de ernst van die schade. Bij het
      bepalen van de kans op schade en de ernst daarvan wordt in voorkomend geval rekening
      gehouden met de volgende criteria: a) de aard van het gevaar dat intrinsiek is aan de
      functie van de categorie machines of verwante producten, rekening houdend met het beoogde
      gebruik en enig redelijkerwijs voorzienbaar verkeerd gebruik; b) de ernst van de schade
      die een persoon zou lijden, met inbegrip van de mate waarin die schade omkeerbaar is;
      c) het aantal potentieel door de schade getroffen personen; d) de frequentie en de duur
      van de blootstelling aan het gevaar waaraan een persoon bij het beoogde gebruik of elk
      redelijkerwijs voorzienbaar verkeerd gebruik van de categorie machines of verwante producten
      zou worden blootgesteld; e) de mogelijkheden om schade te voorkomen of te beperken;
      f) in het geval van veiligheidscomponenten, de waarschijnlijkheid van ernstige gevolgen
      voor de veiligheid van de aan schade blootgestelde personen ingeval de veiligheidscomponenten
      uitvallen.


      5. Bij het uitvoeren van de in lid 4 bedoelde beoordeling houdt de Commissie rekening
      met de volgende elementen: a) vermeldingen van in het verleden veroorzaakte schade door
      machines of verwante producten die werden gebruikt voor hun beoogde doel of als gevolg
      van een redelijkerwijs voorzienbaar verkeerd gebruik; b) informatie over veiligheidsgebreken
      die tijdens het markttoezicht aan het licht zijn gekomen, en materiaal dat mogelijk
      beschikbaar is in de door de Commissie beheerde informatiesystemen; c) informatie over
      bekende ongevallen en ernstige bijna-ongevallen (“close calls”), met inbegrip van de
      kenmerken van die ongevallen of bijna-ongevallen; d) gegevens over door de machine of
      het verwante product veroorzaakte ongelukken of schade aan de gezondheid voor minimum
      de voorgaande vier jaar, met name informatie verkregen uit onder meer het informatie-
      en communicatiesysteem voor markttoezicht ( Information and Communication System on
      Market Surveillance - ICSMS), vrijwaringsclausules, het systeem voor snelle waarschuwingen
      Safety Gate, de Europese letseldatabank ( European Injury Database - EU-IDB ), de Europese
      statistieken over arbeidsongevallen ( European Statistics on Accidents at Work - ESAW
      ) van Eurostat en de groep voor administratieve samenwerking inzake machines ( Machinery
      Administrative Cooperation Group - AdCo ). Naast de punten a) tot en met d) van dit
      lid houdt de Commissie rekening met alle andere beschikbare informatie die relevant
      is voor de in lid 4 bedoelde beoordeling.


      6. De in lid 5, punten a) tot en met d), bedoelde gegevens en informatie worden door
      de lidstaten verstrekt overeenkomstig lid 9.


      7. Een categorie machines of verwante producten wordt opgenomen in bijlage I, deel A,
      indien deze volgens de in lid 4 bedoelde beoordeling en rekening houdend met de beschikbare
      informatie, met inbegrip van de in lid 5 bedoelde gegevens, een ernstig intrinsiek potentieel
      risico oplevert en indien aan een of meer van de volgende voorwaarden is voldaan: a)
      er is een gebrek aan geharmoniseerde normen of gemeenschappelijke specificaties met
      betrekking tot de relevante essentiële gezondheids- en veiligheidseisen; b) er bestaan
      restrisico’s, met inbegrip van risico’s die volgens de fabrikant kunnen worden verminderd
      door middel van specifieke opleiding of persoonlijke beschermingsmiddelen, en de in
      lid 5 bedoelde gegevens en informatie tonen aan dat soortgelijke ernstige of dodelijke
      ongevallen of schade aan de gezondheid in verband met die restrisico’s zich herhaaldelijk
      hebben voorgedaan; c) er zijn gegevens en informatie voorhanden die volgens de Commissie
      aantonen dat de relevante geharmoniseerde normen of gemeenschappelijke specificaties
      herhaaldelijk onjuist zijn toegepast en dat de markttoezichtactiviteiten die in verband
      hiermee zijn uitgevoerd, niet binnen een redelijke termijn tot aanzienlijke verbeteringen
      van de marktsituatie hebben geleid; d) er bestaat een zekere mate van onzekerheid in
      de bestaande risicobeoordelingsmethoden met betrekking tot nieuwe categorieën machines
      of technologieën. Elke andere categorie machines of verwante producten die volgens die
      beoordeling een ernstig intrinsiek potentieel risico vormt, maar niet aan een of meer
      van de voorwaarden in de punten a) tot en met d) voldoet, wordt opgenomen in bijlage
      I, deel B.


      8. Als een lidstaat zich zorgen maakt over het feit dat een categorie machines of verwante
      producten wel of niet in bijlage I is opgenomen, stelt die lidstaat de Commissie onmiddellijk
      in kennis van die bezorgdheid en verstrekt hij redenen daarvoor. De Commissie verricht
      de in lid 4 bedoelde beoordeling onmiddellijk nadat zij door een lidstaat in kennis
      is gesteld. Na het uitvoeren van die beoordeling kan de Commissie de procedure van lid
      2 inleiden.


      9. Uiterlijk op 14 juli 2025, en vervolgens om de vijf jaar, verstrekken de lidstaten
      de in lid 5 bedoelde gegevens en informatie, met inbegrip van informatie waaruit blijkt
      dat geen van de in lid 5 bedoelde gebeurtenissen zich heeft voorgedaan, voor elke categorie
      machines of verwante producten die in bijlage I is opgenomen of die niet in bijlage
      I is opgenomen, wanneer die niet-opneming een reden tot bezorgdheid vormt voor de lidstaat.


      10. De Commissie stelt uitvoeringshandelingen vast tot vaststelling en, indien nodig
      in het licht van de technologische en marktontwikkelingen, bijwerking van een model
      voor de verzameling door de lidstaten van de in lid 5, punten a) tot en met d), bedoelde
      gegevens en informatie. Bij de vaststelling van die uitvoeringshandelingen verstrekt
      de Commissie de lidstaten richtsnoeren voor het verzamelen en indienen van vergelijkbare,
      hoogwaardige gegevens en informatie. Die uitvoeringshandelingen worden volgens de in
      artikel 48, lid 3, bedoelde onderzoeksprocedure vastgesteld. De eerste van deze gedelegeerde
      handelingen wordt uiterlijk op 14 juli 2024 vastgesteld.


      11. Indien nodig stelt de Commissie, na haar in artikel 53, lid 3, bedoelde verslag,
      overeenkomstig artikel 47 gedelegeerde handelingen vast om lid 5 van dit artikel aan
      te vullen door nadere invulling te geven aan de verplichtingen van de lidstaten om de
      krachtens dit artikel vereiste gegevens en informatie te verstrekken door een gemeenschappelijke
      methodiek vast te stellen voor de te verzamelen gegevens en informatie, met inbegrip
      van de methoden voor het verzamelen en samenstellen ervan, de procedures voor de indiening
      ervan, alsmede de relevante definities, om ervoor te zorgen dat de Commissie over voldoende
      en vergelijkbare gegevens beschikt om de in lid 4 bedoelde beoordeling uit te voeren.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_6
  - number: '7'
    text: >-
      **Veiligheidscomponenten**


      1. In bijlage II is een indicatieve lijst opgenomen van veiligheidscomponenten.


      2. Overeenkomstig artikel 47 is de Commissie bevoegd gedelegeerde handelingen vast te
      stellen om bijlage II in het licht van technische vooruitgang en kennis of nieuw wetenschappelijk
      bewijs te wijzigen door nieuwe veiligheidscomponenten in de indicatieve lijst van veiligheidscomponenten
      op te nemen of een bestaande veiligheidscomponent uit die lijst te schrappen.


      3. Als een lidstaat zich zorgen maakt over het feit dat een veiligheidscomponent wel
      of niet in bijlage II is opgenomen, stelt die lidstaat de Commissie onmiddellijk in
      kennis van zijn zorgen en verstrekt redenen daarvoor.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_7
  - number: '8'
    text: >-
      **Essentiële gezondheids- en veiligheidseisen voor producten die binnen het toepassingsgebied
      van deze verordening vallen**


      Machines of verwante producten worden alleen op de markt aangeboden of in bedrijf gesteld
      indien zij aan de essentiële gezondheids- en veiligheidseisen van bijlage III voldoen
      als zij juist geïnstalleerd en onderhouden worden en voor het beoogde gebruik of onder
      redelijkerwijs te voorziene omstandigheden worden gebruikt. Niet voltooide machines
      worden alleen op de markt aangeboden indien zij aan de relevante essentiële gezondheids-
      en veiligheidseisen van bijlage III voldoen.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_8
  - number: '9'
    text: >-
      **Specifieke harmonisatiewetgeving van de Unie**


      Indien voor bepaalde producten die binnen het toepassingsgebied van deze verordening
      vallen, de risico’s die met de essentiële gezondheids- en veiligheidseisen van bijlage
      III worden aangepakt volledig of gedeeltelijk vallen onder harmonisatiewetgeving van
      de Unie die specifieker is dan deze verordening, is deze verordening niet van toepassing
      op dat product voor zover dergelijke risico’s onder die specifieke Uniewetgeving vallen.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_9
  - number: '10'
    text: >-
      **Verplichtingen van fabrikanten van machines en verwante producten**


      1. Wanneer fabrikanten een machine of verwant product in de handel brengen of in bedrijf
      stellen, waarborgen zij dat deze machine of dit verwante product overeenkomstig de essentiële
      gezondheids- en veiligheidseisen van bijlage III is ontworpen en gebouwd.


      2. Voordat zij een machine of verwant product in de handel brengen of in bedrijf stellen,
      stellen fabrikanten de in bijlage IV, deel A, beschreven technische documentatie op
      en voeren zij de in artikel 25 bedoelde relevante conformiteitsbeoordelingsprocedure
      uit of laten deze uitvoeren. Wanneer door middel van die conformiteitsbeoordelingsprocedure
      is aangetoond dat de machine of het verwante product voldoet aan de essentiële gezondheids-
      en veiligheidseisen van bijlage III, stellen de fabrikanten overeenkomstig artikel 21
      de EU-conformiteitsverklaring op en brengen zij overeenkomstig artikel 24 de CE-markering
      aan.


      3. De fabrikanten houden de technische documentatie en de EU-conformiteitsverklaring
      gedurende ten minste tien jaar nadat de machine of het verwante product in de handel
      is gebracht of in bedrijf is gesteld ter beschikking van de markttoezichtautoriteiten.
      In voorkomend geval wordt de in de technische documentatie opgenomen broncode of programmeerlogica
      op een met redenen omkleed verzoek ter beschikking gesteld van de bevoegde nationale
      autoriteiten, mits zij die broncode of programmeerlogica nodig hebben om de overeenstemming
      met de relevante gezondheids- en veiligheidseisen van bijlage III te controleren.


      4. De fabrikanten zorgen ervoor dat zij beschikken over procedures om de conformiteit
      van machines of verwante producten die in serie worden geproduceerd met deze verordening
      te blijven waarborgen. Er wordt terdege rekening gehouden met veranderingen in het productieproces,
      het ontwerp of de kenmerken van de machine of het verwante product en veranderingen
      in de geharmoniseerde normen, in andere technische specificaties of in de gemeenschappelijke
      specificaties als bedoeld in artikel 20, die als referentie dienen om een machine of
      verwant product conform te verklaren. Indien dit rekening houdend met de risico’s van
      machines of verwante producten passend wordt geacht, voeren fabrikanten ter bescherming
      van de gezondheid en veiligheid van de gebruikers steekproeven uit op machines of verwante
      producten die op de markt worden aangeboden en onderzoeken zij de resultaten hiervan.
      Zo nodig houden fabrikanten een register bij van klachten, niet-conforme machines of
      verwante producten en teruggeroepen machines of verwante producten en houden zij de
      distributeurs op de hoogte van de controle hiervan.


      5. De fabrikanten zorgen ervoor dat op de machines of verwante producten die zij in
      de handel brengen of in bedrijf stellen, minstens een aanduiding van de machine of het
      model van het verwante product, de serie of het type, het bouwjaar, dat wil zeggen het
      jaar waarin het productieproces werd afgerond, en elk bestaand partij- of serienummer,
      dan wel ander bestaand identificatiemiddel, is aangebracht, of wanneer dit door de omvang
      of aard van de machine of het verwante product niet mogelijk is, dat de vereiste informatie
      op de verpakking of in een bij de machine of het verwante product gevoegd document is
      vermeld.


      6. De fabrikanten vermelden hun naam, geregistreerde handelsnaam of geregistreerd handelsmerk
      en hun postadres en website, e-mailadres of andere digitale contactgegevens waarop zij
      bereikbaar zijn op de machine of het verwante product, of wanneer dit niet mogelijk
      is, op de verpakking of in een bij de machine of het verwante product gevoegd document.
      Het adres vermeldt één plaats waar contact kan worden opgenomen met de fabrikant. De
      contactgegevens worden gesteld in een taal die de gebruikers en markttoezichtautoriteiten
      gemakkelijk kunnen begrijpen.


      7. De fabrikanten zien erop toe dat machines of verwante producten vergezeld gaan van
      de gebruiksaanwijzing en informatie die zijn vermeld in bijlage III. De gebruiksaanwijzing
      mag worden verstrekt in digitaal formaat. De gebruiksaanwijzing en informatie geven
      een duidelijke beschrijving van het productmodel waarop zij betrekking hebben. Wanneer
      de gebruiksaanwijzing wordt verstrekt in digitaal formaat, doet de fabrikant het volgende:
      a) op de machine of het verwante product of, wanneer dit niet mogelijk is, op de verpakking
      ervan of in een begeleidend document aangeven hoe de digitale gebruiksaanwijzing kan
      worden geraadpleegd; b) de gebruiksaanwijzing ter beschikking stellen in een formaat
      dat de gebruiker in staat stelt de gebruiksaanwijzing af te drukken, te downloaden en
      op een elektronisch apparaat op te slaan zodat hij of zij deze te allen tijde kan raadplegen,
      met name bij een storing van de machine of het verwante product; dit vereiste geldt
      ook wanneer de gebruiksaanwijzing is geïntegreerd in de software van de machine of het
      verwante product; c) de gebruiksaanwijzing online toegankelijk maken gedurende de verwachte
      levensduur van de machine of het verwante product en gedurende ten minste tien jaar
      nadat de machine of het verwante product in de handel is gebracht. Indien de gebruiker
      hier bij de aankoop om vraagt, verstrekt de fabrikant de gebruiksaanwijzing echter binnen
      een maand kosteloos op papier. In het geval van machines of verwante producten die bestemd
      zijn voor niet-professionele gebruikers of die onder redelijkerwijs voorzienbare omstandigheden
      door niet-professionele gebruikers kunnen worden gebruikt, ook al zijn zij niet voor
      hen bestemd, verstrekt de fabrikant op papier de veiligheidsinformatie die essentieel
      is om de machine of het verwante product in bedrijf te stellen en op een veilige manier
      te gebruiken. De gebruiksaanwijzing, de veiligheidsinformatie en de in bijlage III vervatte
      informatie worden opgesteld in een voor gebruikers gemakkelijk te begrijpen taal, zoals
      bepaald door de betrokken lidstaat, en zijn duidelijk, begrijpelijk en leesbaar.


      8. De fabrikanten zorgen ervoor dat de machine of het verwante product vergezeld gaat
      van de in bijlage V, deel A, beschreven EU-conformiteitsverklaring of zij vermelden,
      als alternatief, het internetadres waarop of de machineleesbare code waarmee die EU-conformiteitsverklaring
      kan worden geraadpleegd in de gebruiksaanwijzing en de informatie als bepaald in bijlage
      III. De digitale EU-conformiteitsverklaring wordt online toegankelijk gemaakt gedurende
      de verwachte levensduur van de machine of het verwante product en in elk geval gedurende
      ten minste tien jaar nadat de machine of het verwante product in de handel is gebracht
      of in bedrijf is gesteld.


      9. Fabrikanten die van mening zijn of redenen hebben om aan te nemen dat een door hen
      in de handel gebrachte of in bedrijf gestelde machine of een door hen in de handel gebracht
      of in bedrijf gesteld verwant product niet in overeenstemming is met deze verordening,
      nemen onmiddellijk de nodige corrigerende maatregelen om die machine of dat verwante
      product in overeenstemming te brengen, uit de handel te nemen of terug te roepen, zoals
      van toepassing. Indien de machine of het verwante product een risico oplevert voor de
      gezondheid of veiligheid van personen en indien passend huisdieren of eigendommen, alsook
      in voorkomend geval voor het milieu, brengen de fabrikanten bovendien onmiddellijk de
      bevoegde nationale autoriteiten van de lidstaten waar zij de machine of het verwante
      product op de markt hebben aangeboden of in bedrijf hebben gesteld hiervan op de hoogte,
      waarbij zij in het bijzonder de niet-conformiteit en alle getroffen corrigerende maatregelen
      in detail beschrijven.


      10. Indien een bevoegde nationale autoriteit daar een met redenen omkleed verzoek toe
      doet, verstrekken de fabrikanten haar op papier of in digitale vorm alle informatie
      en documentatie die nodig is om de overeenstemming van de machine of het verwante product
      met deze verordening aan te tonen, in een taal die die autoriteit gemakkelijk kan begrijpen.
      Op verzoek van die autoriteit verlenen zij medewerking aan alle maatregelen die worden
      genomen om de risico’s van de machine die of het verwante product dat zij in de handel
      hebben gebracht of in bedrijf hebben gesteld, weg te nemen.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_10
  - number: '11'
    text: >-
      **Verplichtingen van fabrikanten van niet voltooide machines**


      1. Wanneer fabrikanten een niet voltooide machine in de handel brengen, waarborgen zij
      dat deze overeenkomstig de relevante essentiële gezondheids- en veiligheidseisen van
      bijlage III is ontworpen en gebouwd.


      2. Alvorens niet voltooide machines in de handel te brengen, stellen fabrikanten de
      in bijlage IV, deel B, beschreven technische documentatie op. Wanneer in de in bijlage
      IV, deel B, beschreven technische documentatie is aangetoond dat een niet voltooide
      machine voldoet aan de relevante essentiële veiligheids- en gezondheidseisen van bijlage
      III, stellen fabrikanten de EU-inbouwverklaring op overeenkomstig artikel 22.


      3. De fabrikanten houden de technische documentatie en de EU-inbouwverklaring gedurende
      ten minste tien jaar nadat de niet voltooide machine in de handel is gebracht ter beschikking
      van de markttoezichtautoriteiten. In voorkomend geval wordt de in de technische documentatie
      opgenomen broncode of programmeerlogica op een met redenen omkleed verzoek ter beschikking
      gesteld van de bevoegde nationale autoriteiten, mits zij die broncode of programmeerlogica
      nodig hebben om de overeenstemming met de relevante essentiële gezondheids- en veiligheidseisen
      van bijlage III te controleren.


      4. Fabrikanten zorgen ervoor dat zij beschikken over procedures om de conformiteit van
      een in serie geproduceerde niet voltooide machine met deze verordening te blijven waarborgen.
      Er wordt terdege rekening gehouden met veranderingen in het productieproces, het ontwerp
      of de kenmerken van de niet voltooide machine en veranderingen in de geharmoniseerde
      normen, in andere technische specificaties of in de gemeenschappelijke specificaties
      als bedoeld in artikel 20, die als referentie dienen om de conformiteit van een niet
      voltooide machine te verklaren of te verifiëren.


      5. De fabrikanten zorgen ervoor dat op de niet voltooide machines die zij in de handel
      brengen, minstens een aanduiding van de niet voltooide machine, het bouwjaar, dat wil
      zeggen het jaar waarin het productieproces werd afgerond, het model en de serie of het
      type en elk bestaand partij- of serienummer, dan wel een ander bestaand identificatiemiddel,
      is aangebracht, of wanneer dit door de omvang of aard van de niet voltooide machine
      niet mogelijk is, dat de vereiste informatie op de verpakking of in een bij de niet
      voltooide machine gevoegd document is vermeld.


      6. De fabrikanten vermelden hun naam, geregistreerde handelsnaam of geregistreerd handelsmerk
      en hun postadres en website, e-mailadres of andere digitale contactgegevens waarop zij
      bereikbaar zijn op de niet voltooide machine, of wanneer dit niet mogelijk is, op de
      verpakking of in een bij de niet voltooide machine gevoegd document. Het adres vermeldt
      één plaats waar contact kan worden opgenomen met de fabrikant. De contactgegevens worden
      gesteld in een taal die de persoon die de niet voltooide machine in een machine inbouwt,
      en de markttoezichtautoriteiten gemakkelijk kunnen begrijpen.


      7. Fabrikanten zorgen ervoor dat de niet voltooide machine vergezeld gaat van de montagehandleiding
      in bijlage XI. De montagehandleiding mag door de fabrikant worden verstrekt in digitaal
      formaat. Wanneer de montagehandleiding wordt verstrekt in digitaal formaat, doet de
      fabrikant het volgende: a) op de niet voltooide machine of, wanneer dit niet mogelijk
      is, op de verpakking ervan of in een begeleidend document aangeven hoe de digitale montagehandleiding
      kan worden geraadpleegd; b) de gebruiksaanwijzing ter beschikking stellen in een formaat
      dat de persoon die de niet voltooide machine in een machine inbouwt, in staat stelt
      de montagehandleiding af te drukken, te downloaden en op een elektronisch apparaat op
      te slaan zodat hij of zij deze te allen tijde kan raadplegen, met name bij een storing
      van de niet voltooide machine; dit vereiste geldt ook wanneer de montagehandleiding
      is geïntegreerd in de software van de niet voltooide machine; c) de montagehandleiding
      online toegankelijk maken gedurende ten minste tien jaar nadat de niet voltooide machine
      in de handel is gebracht. Indien de persoon die de niet voltooide machine in een machine
      inbouwt hierom verzoekt op het ogenblik van aankoop, verstrekt de fabrikant de montagehandleiding
      echter binnen een maand kosteloos op papier. De montagehandleiding wordt opgesteld in
      een voor de persoon die de niet voltooide machine in een machine inbouwt, gemakkelijk
      te begrijpen taal, zoals bepaald door de betrokken lidstaat, en is duidelijk, begrijpelijk
      en leesbaar.


      8. De fabrikanten zorgen ervoor dat de niet voltooide machine vergezeld gaat van de
      in bijlage V, deel B, beschreven EU-inbouwverklaring of, als alternatief, vermelden
      zij het internetadres waarop of de machineleesbare code waarmee die EU-inbouwverklaring
      kan worden geraadpleegd in de montagehandleiding als bepaald in bijlage XI. Digitale
      EU-inbouwverklaringen worden online toegankelijk gemaakt gedurende ten minste tien jaar
      nadat de niet voltooide machine in de handel is gebracht.


      9. Fabrikanten die van mening zijn of redenen hebben om aan te nemen dat een door hen
      in de handel gebrachte niet voltooide machine niet in overeenstemming is met deze verordening,
      nemen onmiddellijk de nodige corrigerende maatregelen om die niet voltooide machine
      in overeenstemming te brengen, uit de handel te nemen of terug te roepen, zoals van
      toepassing. Indien de niet voltooide machine een risico oplevert in verband met de relevante
      essentiële gezondheids- en veiligheidseisen, brengen de fabrikanten bovendien onmiddellijk
      de bevoegde nationale autoriteiten van de lidstaten waar zij de niet voltooide machine
      op de markt hebben aangeboden hiervan op de hoogte, waarbij zij in het bijzonder de
      niet-conformiteit en alle genomen corrigerende maatregelen in detail beschrijven.


      10. Indien een bevoegde nationale autoriteit daar een met redenen omkleed verzoek toe
      doet, verstrekken de fabrikanten haar op papier of in digitale vorm alle informatie
      en documentatie die nodig is om de overeenstemming van de niet voltooide machine met
      deze verordening aan te tonen, in een taal die die autoriteit gemakkelijk kan begrijpen.
      Op verzoek van die autoriteit verlenen zij medewerking aan alle maatregelen die worden
      genomen om de risico’s in verband met de relevante essentiële gezondheids- en veiligheidseisen
      van de niet voltooide machines die zij in de handel hebben gebracht, weg te nemen.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_11
  - number: '12'
    text: >-
      **Gemachtigden**


      1. Een fabrikant kan van een product dat binnen het toepassingsgebied van deze verordening
      valt, kan via een schriftelijk mandaat een gemachtigde aanstellen. De verplichtingen
      uit hoofde van artikel 10, lid 1, en artikel 11, lid 1, en de verplichting om de in
      bijlage IV beschreven technische documentatie op te stellen, maken geen deel uit van
      het mandaat van de gemachtigde.


      2. Een gemachtigde voert de taken uit die gespecificeerd zijn in het van de fabrikant
      ontvangen mandaat. De gemachtigde mag uit hoofde van het mandaat ten minste de volgende
      taken verrichten: a) de technische documentatie en de EU-conformiteitsverklaring van
      machines en verwante producten of de EU-inbouwverklaring van niet voltooide machines
      gedurende ten minste tien jaar nadat het product in de handel is gebracht ter beschikking
      van de nationale markttoezichtautoriteiten houden; b) een bevoegde nationale autoriteit
      alle informatie en documentatie verstrekken die nodig zijn om de conformiteit van het
      product dat binnen het toepassingsgebied van deze verordening valt, aan te tonen, op
      papier of in digitaal formaat, indien die autoriteit daar een met redenen omkleed verzoek
      toe doet; c) op verzoek van de bevoegde nationale autoriteiten medewerking verlenen
      aan eventuele getroffen maatregelen om de risico’s van producten die binnen het toepassingsgebied
      van deze verordening vallen, die onder het mandaat van de gemachtigde vallen weg te
      nemen.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_12
  - number: '13'
    text: >-
      **Verplichtingen van importeurs van machines en verwante producten**


      1. De importeurs brengen alleen conforme machines of verwante producten in de handel.


      2. Alvorens machines of een verwant product in de handel te brengen, zien de importeurs
      erop toe dat de fabrikant de juiste in artikel 25 bedoelde conformiteitsbeoordelingsprocedures
      heeft uitgevoerd. Zij zien erop toe dat de fabrikant de in bijlage IV, deel A, beschreven
      technische documentatie heeft opgesteld, dat de machine of het verwante product voorzien
      is van de in artikel 23 bedoelde CE-markering en vergezeld gaat van de vereiste documenten,
      en dat de fabrikant aan de eisen van artikel 10, leden 5, 6 en 8, heeft voldaan. Importeurs
      die van mening zijn of redenen hebben om aan te nemen dat een machine of verwant product
      niet in overeenstemming met deze verordening is, brengen de machine of het verwante
      product niet in de handel voordat het conform is gemaakt. Indien een machine of verwant
      product een risico voor de gezondheid en veiligheid van personen en indien passend huisdieren
      en eigendommen, alsook in voorkomend geval het milieu, oplevert, brengt de importeur
      bovendien de fabrikant en de markttoezichtautoriteiten daarvan op de hoogte.


      3. De importeurs vermelden hun naam, geregistreerde handelsnaam of geregistreerd handelsmerk
      en hun postadres en website, e-mailadres of andere digitale contactgegevens waarop zij
      bereikbaar zijn op de machine of het verwante product, of wanneer dit niet mogelijk
      is, op de verpakking of in een bij de machine of het verwante product gevoegd document.
      De contactgegevens worden gesteld in een taal die de gebruikers en markttoezichtautoriteiten
      gemakkelijk kunnen begrijpen.


      4. De importeurs zien erop toe dat de machine of het verwante product vergezeld gaat
      van de gebruiksaanwijzing en informatie die zijn vermeld in artikel 10, lid 7.


      5. De importeurs zorgen gedurende de periode dat zij voor de machine of het verwante
      product verantwoordelijk zijn, voor zodanige opslag- en vervoersomstandigheden dat de
      overeenstemming ervan met de essentiële gezondheids- en veiligheidseisen van bijlage
      III niet in het gedrang komt.


      6. Indien dit rekening houdend met de risico’s van de machine of het verwante product
      passend wordt geacht, voeren de importeurs ter bescherming van de gezondheid en veiligheid
      van personen en indien passend huisdieren en eigendommen, alsook in voorkomend geval
      het milieu, steekproeven uit op machines of verwante producten die op de markt worden
      aangeboden, onderzoeken zij klachten, niet-conforme machines en verwante producten en
      teruggeroepen machines en verwante producten en houden zij daarvan zo nodig een register
      bij, en houden zij de distributeurs op de hoogte van deze controles.


      7. Importeurs die van mening zijn of redenen hebben om aan te nemen dat een door hen
      in de handel gebrachte machine of een door hen in de handel gebracht verwant product,
      niet in overeenstemming is met deze verordening, nemen onmiddellijk de nodige corrigerende
      maatregelen om die machine of dat verwante product in overeenstemming te brengen, uit
      de handel te nemen of terug te roepen, zoals van toepassing. Indien de machine of het
      verwante product een risico oplevert voor de gezondheid en veiligheid van personen,
      en, indien passend, huisdieren en eigendommen, alsook in voorkomend geval voor het milieu,
      brengen de importeurs bovendien onmiddellijk de bevoegde nationale autoriteiten van
      de lidstaten waar zij de machine of het verwante product op de markt hebben aangeboden
      hiervan op de hoogte, waarbij zij in het bijzonder de niet-conformiteit en alle genomen
      corrigerende maatregelen in detail beschrijven.


      8. De importeurs houden gedurende ten minste tien jaar nadat de machine of het verwante
      product in de handel is gebracht, een kopie van de EU-conformiteitsverklaring ter beschikking
      van de markttoezichtautoriteiten en zorgen ervoor dat de in bijlage IV, deel A, beschreven
      technische documentatie op verzoek aan die autoriteiten kan worden verstrekt. In voorkomend
      geval wordt de in de technische documentatie opgenomen broncode of programmeerlogica
      op een met redenen omkleed verzoek ter beschikking gesteld van de bevoegde nationale
      autoriteiten, mits zij die broncode of programmeerlogica nodig hebben om de overeenstemming
      met de relevante gezondheids- en veiligheidseisen van bijlage III te controleren.


      9. Indien een bevoegde nationale autoriteit daar een met redenen omkleed verzoek toe
      doet, verstrekken de importeurs aan die autoriteit alle informatie en documentatie die
      nodig is om de overeenstemming van de machine of het verwante product met deze verordening
      aan te tonen, in een taal die die autoriteit gemakkelijk kan begrijpen, op papier of
      in digitaal formaat. Op verzoek van die autoriteit verlenen zij medewerking aan alle
      genomen maatregelen om de risico’s van machines of verwante producten die zij in de
      handel hebben gebracht voor de gezondheid en veiligheid van personen, en, indien passend,
      huisdieren en eigendommen, alsook in voorkomend geval voor het milieu, weg te nemen.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_13
  - number: '14'
    text: >-
      **Verplichtingen van importeurs van niet voltooide machines**


      1. Importeurs brengen alleen conforme niet voltooide machines in de handel.


      2. Alvorens niet voltooide machines in de handel te brengen, zien importeurs erop toe
      dat de fabrikant de in bijlage IV, deel B, beschreven technische documentatie heeft
      opgesteld, dat de niet voltooide machines vergezeld zijn van de vereiste documenten,
      en dat de fabrikant aan de eisen van artikel 11, leden 5, 6 en 8, heeft voldaan. Importeurs
      die van mening zijn of redenen hebben om aan te nemen dat een niet voltooide machine
      niet in overeenstemming is met deze verordening, brengen de niet voltooide machine niet
      in de handel voordat deze conform is gemaakt. Indien de niet voltooide machine een risico
      oplevert met betrekking tot de relevante essentiële gezondheids- en veiligheidseisen,
      brengt de importeur bovendien de fabrikant en de markttoezichtautoriteiten hiervan op
      de hoogte.


      3. De importeurs vermelden hun naam, geregistreerde handelsnaam of geregistreerd handelsmerk
      en hun postadres en website, e-mailadres of andere digitale contactgegevens waarop zij
      bereikbaar zijn op de niet voltooide machine, of wanneer dit niet mogelijk is, op de
      verpakking of in een bij de niet voltooide machine gevoegd document. De contactgegevens
      worden gesteld in een taal die de persoon die de niet voltooide machine inbouwt, en
      de markttoezichtautoriteiten gemakkelijk kunnen begrijpen.


      4. Importeurs zorgen ervoor dat de niet voltooide machine vergezeld gaat van de montagehandleiding
      als bedoeld in artikel 11, lid 7.


      5. De importeurs zorgen gedurende de periode dat zij voor de niet voltooide machine
      verantwoordelijk zijn voor zodanige opslag- en vervoersomstandigheden dat de overeenstemming
      van de niet voltooide machine met de relevante essentiële gezondheids- en veiligheidseisen
      van bijlage III niet in het gedrang komt.


      6. Importeurs die van mening zijn of redenen hebben om aan te nemen dat een door hen
      in de handel gebrachte niet voltooide machine niet in overeenstemming is met deze verordening,
      nemen onmiddellijk de nodige corrigerende maatregelen om die niet voltooide machine
      in overeenstemming te brengen, uit de handel te nemen of terug te roepen, zoals van
      toepassing. Indien de niet voltooide machine een risico oplevert in verband met de relevante
      essentiële gezondheids- en veiligheidseisen, brengen de importeurs bovendien onmiddellijk
      de bevoegde nationale autoriteiten van de lidstaten waar zij de niet voltooide machine
      op de markt hebben aangeboden hiervan op de hoogte, waarbij zij in het bijzonder de
      niet-conformiteit en alle genomen corrigerende maatregelen in detail beschrijven.


      7. De importeurs houden gedurende ten minste tien jaar nadat de niet voltooide machine
      in de handel is gebracht, een kopie van de EU-inbouwverklaring ter beschikking van de
      markttoezichtautoriteiten en zorgen ervoor dat de in bijlage IV, deel B, beschreven
      technische documentatie op verzoek aan die autoriteiten kan worden verstrekt.


      8. Indien een bevoegde nationale autoriteit daar een met redenen omkleed verzoek toe
      doet, verstrekken de importeurs haar op papier of in digitaal formaat alle informatie
      en documentatie die nodig is om de overeenstemming van de niet voltooide machine met
      deze verordening aan te tonen, in een taal die die autoriteit gemakkelijk kan begrijpen.
      De importeurs werken op verzoek van de autoriteit met haar samen wat betreft alle eventuele
      maatregelen om de risico’s in verband met de relevante essentiële gezondheids- en veiligheidseisen
      van een door hen in de handel gebrachte niet voltooide machine weg te nemen.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_14
  - number: '15'
    text: >-
      **Verplichtingen van distributeurs van machines en verwante producten**


      1. Distributeurs die een machine of een verwant product op de markt aanbieden, betrachten
      de nodige zorgvuldigheid in verband met de voorschriften van deze verordening.


      2. Alvorens een machine of verwant product op de markt aan te bieden, controleren de
      distributeurs of: a) de CE-markering op de machine of het verwante product is aangebracht;
      b) de machine of het verwante product vergezeld gaat van de in artikel 10, lid 8, bedoelde
      EU-conformiteitsverklaring; c) de machine of het verwante product vergezeld gaat van
      de in artikel 10, lid 7, bedoelde gebruiksaanwijzing en informatie en of die gesteld
      zijn in een door de gebruikers gemakkelijk te begrijpen taal, zoals bepaald door de
      lidstaat waar de machine of het verwante product op de markt wordt aangeboden; d) de
      fabrikant en de importeur hebben voldaan aan de in artikel 10, leden 5 en 6, respectievelijk
      artikel 13, lid 3, bedoelde eisen.


      3. Distributeurs die van mening zijn of redenen hebben om aan te nemen dat een machine
      of een verwant product niet overeenstemt met deze verordening, bieden de machine of
      het verwante product pas op de markt aan nadat het conform is gemaakt. Indien de machine
      of het verwante product een risico oplevert voor de gezondheid en veiligheid van personen
      en indien passend huisdieren en eigendommen, alsook in voorkomend geval voor het milieu,
      brengt de distributeur bovendien de fabrikant of de importeur alsmede de markttoezichtautoriteiten
      daarvan op de hoogte.


      4. De distributeurs zorgen gedurende de periode dat zij voor een machine of verwant
      product verantwoordelijk zijn voor zodanige opslag- en vervoersomstandigheden dat de
      overeenstemming van de machine of het verwante product met de essentiële gezondheids-
      en veiligheidseisen van bijlage III niet in het gedrang komt.


      5. Distributeurs die van mening zijn of redenen hebben om aan te nemen dat een door
      hen op de markt aangeboden machine of verwant product niet overeenstemt met deze verordening,
      zorgen ervoor dat de nodige corrigerende maatregelen worden genomen om de machine of
      het verwante product conform te maken of zo nodig uit de handel te nemen of terug te
      roepen. Indien de machine of het verwante product een risico oplevert voor de gezondheid
      en veiligheid van personen en indien passend huisdieren en eigendommen, alsook in voorkomend
      geval voor het milieu, brengen de distributeurs bovendien onmiddellijk de bevoegde nationale
      autoriteiten van de lidstaten waar zij de machine of het verwante product op de markt
      hebben aangeboden hiervan op de hoogte, waarbij zij met name de niet-conformiteit en
      alle genomen corrigerende maatregelen in detail beschrijven.


      6. Distributeurs verstrekken op een met redenen omkleed verzoek van een bevoegde nationale
      autoriteit aan deze autoriteit op papier of digitaal alle benodigde informatie en documentatie
      om de conformiteit van de machine of het verwante product met deze verordening aan te
      tonen, in een taal die die autoriteit gemakkelijk kan begrijpen. Op verzoek van die
      autoriteit verlenen zij medewerking aan alle eventuele maatregelen die worden genomen
      om de risico’s van machines of verwante producten die zij op de markt hebben aangeboden
      voor de gezondheid en veiligheid van personen en indien passend huisdieren en eigendommen,
      alsook in voorkomend geval voor het milieu, weg te nemen.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_15
  - number: '16'
    text: >-
      **Verplichtingen van distributeurs van niet voltooide machines**


      1. Distributeurs die niet voltooide machines op de markt aanbieden, betrachten de nodige
      zorgvuldigheid in verband met de voorschriften van deze verordening.


      2. Alvorens een niet voltooide machine op de markt aan te bieden, controleren de distributeurs
      of: a) de niet voltooide machine vergezeld gaat van de in artikel 11, lid 8, bedoelde
      EU-inbouwverklaring; b) de niet voltooide machine vergezeld gaat van de in artikel 11,
      lid 7, bedoelde montagehandleiding en of die gesteld is in een taal die de persoon die
      de niet voltooide machine inbouwt, gemakkelijk kan begrijpen, zoals bepaald door de
      lidstaat waar de niet voltooide machine op de markt wordt aangeboden; c) de fabrikant
      en de importeur hebben voldaan aan de in artikel 11, leden 5 en 6, respectievelijk artikel
      14, lid 3, bedoelde eisen.


      3. Distributeurs die van mening zijn of redenen hebben om aan te nemen dat een niet
      voltooide machine niet overeenstemt met deze verordening, bieden de niet voltooide machine
      pas op de markt aan nadat deze in overeenstemming is gebracht. Indien de niet voltooide
      machine een risico oplevert in verband met relevante essentiële gezondheids- en veiligheidseisen,
      brengt de distributeur bovendien de fabrikant of de importeur alsmede de markttoezichtautoriteiten
      daarvan op de hoogte.


      4. De distributeurs zorgen gedurende de periode dat zij voor een niet voltooide machine
      verantwoordelijk zijn, voor zodanige opslag- en vervoersomstandigheden dat de overeenstemming
      van de niet voltooide machine met de relevante essentiële gezondheids- en veiligheidseisen
      van bijlage III niet in het gedrang komt.


      5. Distributeurs die van mening zijn of redenen hebben om aan te nemen dat een door
      hen op de markt aangeboden niet voltooide machine niet overeenstemt met deze verordening,
      zorgen ervoor dat de nodige corrigerende maatregelen worden genomen om die niet voltooide
      machine conform te maken of zo nodig uit de handel te nemen of terug te roepen. Indien
      de niet voltooide machine een risico oplevert in verband met de relevante essentiële
      gezondheids- en veiligheidseisen, brengen de distributeurs bovendien onmiddellijk de
      bevoegde nationale autoriteiten van de lidstaten waar zij de niet voltooide machine
      op de markt hebben aangeboden hiervan op de hoogte, waarbij zij met name de niet-conformiteit
      en alle genomen corrigerende maatregelen in detail beschrijven.


      6. Distributeurs verstrekken op een met redenen omkleed verzoek van een bevoegde nationale
      autoriteit aan deze autoriteit op papier of digitaal alle benodigde informatie en documentatie
      om de conformiteit van de niet voltooide machine met deze verordening aan te tonen.
      Op verzoek van deze autoriteit verlenen zij medewerking aan alle maatregelen die worden
      genomen om de risico’s in verband met de essentiële gezondheids- en veiligheidseisen
      van de niet voltooide machines die zij op de markt hebben aangeboden, weg te nemen.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_16
  - number: '17'
    text: >-
      **Gevallen waarin de verplichtingen van fabrikanten van toepassing zijn op importeurs
      en distributeurs**


      Importeurs of distributeurs worden voor de toepassing van deze verordening als fabrikant
      beschouwd en moeten aan de in de artikelen 10 en 11 vastgestelde verplichtingen van
      de fabrikant voldoen wanneer die importeurs of distributeurs een product dat binnen
      het toepassingsgebied van deze verordening valt, onder hun eigen naam of merk in de
      handel brengen of een reeds in de handel gebracht product zodanig wijzigen dat de conformiteit
      met de toepasselijke eisen in het gedrang kan komen.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_17
  - number: '18'
    text: >-
      **Andere gevallen waarin de verplichtingen van fabrikanten van toepassing zijn**


      Een natuurlijke persoon of een rechtspersoon die een machine of een verwant product
      substantieel wijzigt, wordt voor de toepassing van deze verordening als fabrikant beschouwd
      en is onderworpen aan de in artikel 10 vastgestelde verplichtingen van de fabrikant
      voor die machine of dat verwante product of, indien de substantiële wijziging alleen
      van invloed is op de veiligheid van een machine die of een verwant product dat deel
      uitmaakt van een samenstel van machines, voor de machine of het verwante product in
      kwestie, zoals aangetoond in de risicobeoordeling. De persoon die de substantiële wijziging
      uitvoert, zorgt er met name, maar onverminderd andere verplichtingen van artikel 10,
      voor dat de machine of het verwante product in kwestie in overeenstemming is met de
      toepasselijke eisen van deze verordening, verklaart op eigen verantwoordelijkheid dat
      dit het geval is en past de desbetreffende conformiteitsbeoordelingsprocedure van artikel
      25, leden 2, 3 en 4, van deze verordening toe. Niet-professionele gebruikers die hun
      machine of verwant product substantieel wijzigen voor eigen gebruik, worden voor de
      toepassing van deze verordening niet als fabrikant beschouwd en zijn niet onderworpen
      aan de in artikel 10 vastgestelde verplichtingen van de fabrikant.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_18
  - number: '19'
    text: >-
      **Identificatie van marktdeelnemers**


      1. Marktdeelnemers delen, op verzoek, aan de markttoezichtautoriteiten mee: a) welke
      marktdeelnemers een binnen het toepassingsgebied van deze verordening vallend product
      aan hen hebben geleverd; b) aan welke marktdeelnemers zij een binnen het toepassingsgebied
      van deze verordening vallend product hebben geleverd.


      2. Om aan de verplichting van lid 1 te kunnen voldoen, bewaren marktdeelnemers de in
      dat lid bedoelde informatie gedurende ten minste tien jaar nadat zij de binnen het toepassingsgebied
      van deze verordening vallende producten hebben geleverd of ontvangen.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_19
  - number: '20'
    text: >-
      **Vermoeden van conformiteit van binnen het toepassingsgebied van deze verordening vallende
      producten**


      1. Een binnen het toepassingsgebied van deze verordening vallend product dat overeenstemt
      met geharmoniseerde normen of delen daarvan, waarvan de referenties in het Publicatieblad
      van de Europese Unie zijn bekendgemaakt, wordt geacht in overeenstemming te zijn met
      de essentiële gezondheids- en veiligheidseisen van bijlage III die onder die normen
      of delen daarvan vallen.


      2. Overeenkomstig artikel 10, lid 1, van Verordening (EU) nr. 1025/2012 verzoekt de
      Commissie één of meer Europese normalisatieorganisaties geharmoniseerde normen voor
      de essentiële gezondheids- en veiligheidseisen van bijlage III op te stellen.


      3. De Commissie kan uitvoeringshandelingen vaststellen met gemeenschappelijke specificaties
      inzake technische voorschriften die een middel bieden om te voldoen aan de essentiële
      veiligheids- en gezondheidseisen van bijlage III voor binnen het toepassingsgebied van
      deze verordening vallende producten. Die uitvoeringshandelingen worden alleen vastgesteld
      indien aan de volgende voorwaarden is voldaan: a) de Commissie heeft overeenkomstig
      artikel 10, lid 1, van Verordening (EU) nr. 1025/2012 één of meer Europese normalisatieorganisaties
      verzocht geharmoniseerde normen voor de essentiële gezondheids- en veiligheidseisen
      van bijlage III op te stellen en: i) het verzoek is niet aanvaard; of ii) de geharmoniseerde
      normen waarop dat verzoek betrekking heeft, worden niet binnen de overeenkomstig artikel
      10, lid 1, van Verordening (EU) nr. 1025/2012 vastgestelde termijn geleverd; of iii)
      de geharmoniseerde normen voldoen niet aan het verzoek; en b) er is geen referentie
      van geharmoniseerde normen overeenkomstig Verordening (EU) nr. 1025/2012 bekendgemaakt
      in het Publicatieblad van de Europese Unie voor de desbetreffende relevante essentiële
      gezondheids- en veiligheidseisen van bijlage III, en een dergelijke referentie zal naar
      verwachting niet binnen een redelijke termijn worden bekendgemaakt. Die uitvoeringshandelingen
      worden volgens de in artikel 48, lid 3, bedoelde onderzoeksprocedure vastgesteld.


      4. Alvorens de in lid 3 bedoelde ontwerpuitvoeringshandeling op te stellen, stelt de
      Commissie het in artikel 22 van Verordening (EU) nr. 1025/2012 bedoelde comité ervan
      in kennis dat zij van oordeel is dat aan de voorwaarden van lid 3 is voldaan.


      5. Bij het opstellen van de in lid 3 bedoelde ontwerpuitvoeringshandeling houdt de Commissie
      rekening met de standpunten van de relevante instanties of de deskundigengroep en raadpleegt
      zij naar behoren alle relevante belanghebbenden.


      6. Een binnen het toepassingsgebied van deze verordening vallend product dat overeenstemt
      met de gemeenschappelijke specificaties die zijn vastgesteld bij de in lid 3 bedoelde
      uitvoeringshandelingen, of delen daarvan, wordt geacht in overeenstemming te zijn met
      de essentiële gezondheids- en veiligheidseisen van bijlage III die onder die gemeenschappelijke
      specificaties of delen daarvan vallen.


      7. Wanneer een geharmoniseerde norm door een Europese normalisatieorganisatie wordt
      vastgesteld en aan de Commissie wordt voorgesteld met het oog op de bekendmaking van
      de referentie ervan in het Publicatieblad van de Europese Unie , beoordeelt de Commissie
      de geharmoniseerde norm overeenkomstig Verordening (EU) nr. 1025/2012. Wanneer de referentie
      van een geharmoniseerde norm in het Publicatieblad van de Europese Unie wordt bekendgemaakt,
      trekt de Commissie de in lid 3 bedoelde uitvoeringshandelingen of delen daarvan die
      dezelfde essentiële gezondheids- en veiligheidseisen bestrijken als die geharmoniseerde
      norm, in.


      8. Wanneer een lidstaat van oordeel is dat een gemeenschappelijke specificatie niet
      volledig aan de essentiële veiligheids- en gezondheidseisen van bijlage III voldoet,
      stelt hij de Commissie daarvan in kennis door middel van een gedetailleerde toelichting.
      De Commissie beoordeelt die gedetailleerde toelichting en kan de uitvoeringshandeling
      tot vaststelling van de gemeenschappelijke specificatie in kwestie indien nodig wijzigen.


      9. Machines en verwante producten die zijn gecertificeerd of waarvoor een conformiteitsverklaring
      is afgegeven in het kader van een overeenkomstig Verordening (EU) 2019/881 vastgestelde
      cyberbeveiligingscertificeringsregeling waarvan de referenties in het Publicatieblad
      van de Europese Unie zijn bekendgemaakt, worden geacht in overeenstemming te zijn met
      de essentiële gezondheids- en veiligheidseisen van bijlage III, punten 1.1.9 en 1.2.1,
      wat betreft de bescherming tegen corruptie en de veiligheid en betrouwbaarheid van controlesystemen,
      voor zover die eisen onder het cyberbeveiligingscertificaat, de conformiteitsverklaring
      of delen daarvan vallen.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_20
  - number: '21'
    text: >-
      **EU-conformiteitsverklaring van machines en verwante producten**


      1. In de EU-conformiteitsverklaring wordt vermeld dat is aangetoond dat aan de toepasselijke
      essentiële gezondheids- en veiligheidseisen van bijlage III is voldaan.


      2. De EU-conformiteitsverklaring komt qua structuur overeen met het model in bijlage
      V, deel A, en bevat de in de desbetreffende modules van de bijlagen VI, VIII, IX en
      X vermelde elementen. Zij wordt voortdurend bijgewerkt en wordt vertaald in de taal
      of talen zoals gevraagd door de lidstaat waar de machine of het verwante product in
      de handel wordt gebracht, op de markt wordt aangeboden of in bedrijf wordt gesteld.


      3. Als voor een machine of verwant product uit hoofde van meer dan één rechtshandeling
      van de Unie een EU-conformiteitsverklaring vereist is, wordt met betrekking tot al die
      handelingen één enkele EU-conformiteitsverklaring opgesteld. In die verklaring wordt
      aangegeven om welke rechtshandelingen van de Unie het gaat, met vermelding van de publicatiegegevens
      ervan.


      4. Door de EU-conformiteitsverklaring op te stellen, neemt de fabrikant de verantwoordelijkheid
      op zich voor de overeenstemming van de machine of het verwante product met de eisen
      van deze verordening.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_21
  - number: '22'
    text: >-
      **EU-inbouwverklaring van niet voltooide machines**


      1. In de EU-inbouwverklaring wordt vermeld dat is aangetoond dat aan de relevante essentiële
      gezondheids- en veiligheidseisen van bijlage III is voldaan.


      2. De EU-inbouwverklaring komt qua structuur overeen met het in bijlage V, deel B, opgenomen
      model. Zij wordt voortdurend bijgewerkt en wordt vertaald in de taal of talen zoals
      gevraagd door de lidstaat waar de niet voltooide machine in de handel wordt gebracht
      of op de markt wordt aangeboden.


      3. Als voor een niet voltooide machine uit hoofde van meer dan één rechtshandeling van
      de Unie een EU-conformiteitsverklaring vereist is, bevat de EU-inbouwverklaring een
      verklaring van overeenstemming met die handelingen. In die verklaring wordt aangegeven
      om welke rechtshandelingen van de Unie het gaat, met vermelding van de publicatiegegevens
      ervan.


      4. Door de EU-inbouwverklaring op te stellen, neemt de fabrikant de verantwoordelijkheid
      op zich voor de overeenstemming van de niet voltooide machine met de eisen van deze
      verordening.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_22
  - number: '23'
    text: >-
      **Algemene beginselen van de CE-markering**


      De CE-markering is onderworpen aan de algemene beginselen die zijn vastgesteld in artikel
      30 van Verordening (EG) nr. 765/2008.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_23
  - number: '24'
    text: >-
      **Voorschriften voor het aanbrengen van de CE-markering op machines en verwante producten**


      1. De CE-markering wordt zichtbaar, leesbaar en onuitwisbaar op de machine of het verwante
      product aangebracht. Indien dit door de aard van de machine of het verwante product
      niet mogelijk of niet gerechtvaardigd is, wordt de CE-markering aangebracht op de verpakking
      en in de documenten die de machine of het verwante product vergezellen.


      2. De CE-markering wordt aangebracht voordat de machine of het verwante product in de
      handel gebracht of in bedrijf gesteld wordt.


      3. Wanneer de conformiteit van een machine of verwant product wordt beoordeeld volgens
      de conformiteitsbeoordelingsprocedure als bedoeld in artikel 25, lid 2, punten a), b)
      en c), en artikel 25, lid 3, punten b), c) en d), wordt de CE-markering gevolgd door
      het identificatienummer van de aangemelde instantie die bij die procedure betrokken
      is. Het identificatienummer van die aangemelde instantie wordt aangebracht door die
      instantie zelf, dan wel door de fabrikant of diens gemachtigde overeenkomstig de instructies
      van de aangemelde instantie.


      4. Na de CE-markering en in voorkomend geval het identificatienummer van de aangemelde
      instantie, kan een pictogram of een ander teken dat een bijzonder risico of gebruik
      aanduidt, worden aangebracht.


      5. De lidstaten bouwen voort op bestaande mechanismen om te zorgen voor een juiste toepassing
      van de voorschriften inzake de CE-markering en nemen passende maatregelen tegen oneigenlijk
      gebruik van die markering.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_24
  - number: '25.1'
    text: >-
      **Conformiteitsbeoordelingsprocedures voor machines en verwante producten**


      Fabrikanten of de in artikel 18 bedoelde natuurlijke personen of rechtspersonen passen
      een van de in de leden 2, 3 en 4 genoemde conformiteitsbeoordelingsprocedures toe.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_25
    machine_readable:
      execution:
        parameters:
          - name: categorie_bijlage_i
            type: string
            required: true
            description: >-
              Het punt van bijlage I waaronder de categorie valt, of "geen"; zie de beschrijving
              bij bijlage I.
          - name: vervaardigd_volgens_normen_die_alle_eisen_bestrijken
            type: boolean
            required: true
            description: >-
              De machine of het verwante product is vervaardigd overeenkomstig de geharmoniseerde
              normen of gemeenschappelijke specificaties die alle relevante essentiële gezondheids-
              en veiligheidseisen voor die categorie bestrijken (artikel 25, lid 3).
        input:
          - name: lid_2_van_toepassing
            type: boolean
            source:
              output: lid_2_van_toepassing
              parameters:
                categorie_bijlage_i: $categorie_bijlage_i
          - name: procedures_lid_2
            type: array
            source:
              output: procedures_lid_2
              parameters:
                categorie_bijlage_i: $categorie_bijlage_i
          - name: lid_3_van_toepassing
            type: boolean
            source:
              output: lid_3_van_toepassing
              parameters:
                categorie_bijlage_i: $categorie_bijlage_i
          - name: procedures_lid_3
            type: array
            source:
              output: procedures_lid_3
              parameters:
                categorie_bijlage_i: $categorie_bijlage_i
                vervaardigd_volgens_normen_die_alle_eisen_bestrijken: $vervaardigd_volgens_normen_die_alle_eisen_bestrijken
          - name: lid_4_van_toepassing
            type: boolean
            source:
              output: lid_4_van_toepassing
              parameters:
                categorie_bijlage_i: $categorie_bijlage_i
          - name: procedures_lid_4
            type: array
            source:
              output: procedures_lid_4
              parameters:
                categorie_bijlage_i: $categorie_bijlage_i
          - name: is_machine_of_verwant_product
            type: boolean
            description: >-
              Artikel 2, lid 1, eerste alinea. De feiten over het product zijn dezelfde feiten
              die de aanroeper voor dit artikel meegeeft; zie verordening_van_toepassing.
            source:
              output: is_machine_of_verwant_product
          - name: verordening_van_toepassing
            type: boolean
            description: >-
              Artikel 2, lid 2. Deze binding en de vorige noemen geen parameters: de feiten over
              het product (uit de artikelen 2 en 3) gaan ongewijzigd mee, omdat een
              verwijzing binnen deze verordening alle parameters van de aanroep doorgeeft. Een
              scenario rekent de uitsluiting van een wapen hier vanaf die feiten uit, zodat een
              engine die dat anders gaat doen, niet stil een verkeerde uitkomst geeft.
            source:
              output: verordening_van_toepassing
        output:
          - name: toegestane_conformiteitsbeoordelingsprocedures
            type: array
            nullable: true
            description: >-
              De conformiteitsbeoordelingsprocedures waarvan de fabrikant, of de in artikel
              18 bedoelde persoon, er een toepast. Codes: A (interne productiecontrole, bijlage
              VI), B+C (EU-typeonderzoek, bijlage VII, gevolgd door conformiteit met het type
              op basis van interne productiecontrole, bijlage VIII), H (volledige kwaliteitsborging,
              bijlage IX), G (eenheidskeuring, bijlage X). Geen uitkomst (null) voor een product
              dat geen machine of verwant product is, of waarop de verordening volgens artikel
              2 niet van toepassing is.
        actions:
          - output: toegestane_conformiteitsbeoordelingsprocedures
            value:
              operation: IF
              cases:
                - when:
                    operation: AND
                    conditions:
                      - $lid_2_van_toepassing
                      - $is_machine_of_verwant_product
                      - $verordening_van_toepassing
                  then: $procedures_lid_2
                - when:
                    operation: AND
                    conditions:
                      - $lid_3_van_toepassing
                      - $is_machine_of_verwant_product
                      - $verordening_van_toepassing
                  then: $procedures_lid_3
                - when:
                    operation: AND
                    conditions:
                      - $lid_4_van_toepassing
                      - $is_machine_of_verwant_product
                      - $verordening_van_toepassing
                  then: $procedures_lid_4
              default: null
            legal_basis:
              law: Verordening (EU) 2023/1230
              article: '25'
              paragraph: '1'
              explanation: >-
                Lid 1: fabrikanten of de in artikel 18 bedoelde personen passen een van de
                in de leden 2, 3 en 4 genoemde procedures toe. Welk lid geldt, volgt uit de
                plaats van de categorie in bijlage I. Is de opgegeven categorie geen punt
                van bijlage I en ook niet "geen", dan geldt geen van de leden en is er geen
                uitkomst (null). Het opschrift ("voor machines en verwante producten") en de
                leden 2 tot en met 4 ("de categorie machines of verwante producten") beperken
                het artikel tot de groep van artikel 2, lid 1, eerste alinea; een niet voltooide
                machine krijgt hier geen procedure. Artikel 2, lid 2, zegt dat "deze verordening",
                en dus ook dit artikel, niet van toepassing is op de daar genoemde producten;
                zo'n product krijgt evenmin een procedure (null).
  - number: '25.2'
    text: >-
      Als de categorie machines of verwante producten in bijlage I, deel A, is opgenomen,
      passen fabrikanten of de in artikel 18 bedoelde natuurlijke personen of rechtspersonen
      een van de volgende procedures toe: a) EU-typeonderzoek (module B) als vastgesteld in
      bijlage VII, gevolgd door conformiteit met het type op basis van interne productiecontrole
      (module C) als vastgesteld in bijlage VIII; b) conformiteit op basis van volledige kwaliteitsborging
      (module H) als vastgesteld in bijlage IX; c) conformiteit op basis van eenheidskeuring
      (module G) als vastgesteld in bijlage X.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_25
    machine_readable:
      execution:
        parameters:
          - name: categorie_bijlage_i
            type: string
            required: true
            description: >-
              Het punt van bijlage I waaronder de categorie valt, of "geen"; zie de beschrijving
              bij bijlage I.
        input:
          - name: in_bijlage_i_deel_a
            type: boolean
            source:
              output: in_bijlage_i_deel_a
              parameters:
                categorie_bijlage_i: $categorie_bijlage_i
        output:
          - name: lid_2_van_toepassing
            type: boolean
          - name: procedures_lid_2
            type: array
        actions:
          - output: lid_2_van_toepassing
            value: $in_bijlage_i_deel_a
            legal_basis:
              law: Verordening (EU) 2023/1230
              article: '25'
              paragraph: '2'
              explanation: >-
                "Als de categorie machines of verwante producten in bijlage I, deel A, is
                opgenomen".
          - output: procedures_lid_2
            value:
              operation: LIST
              items:
                - B+C
                - H
                - G
            legal_basis:
              law: Verordening (EU) 2023/1230
              article: '25'
              paragraph: '2'
              explanation: >-
                Onderdeel a: EU-typeonderzoek (module B) gevolgd door interne productiecontrole
