                - $is_kabel
                - $is_band
                - $is_verwijderbare_mechanische_overbrengingsinrichting
            legal_basis:
              law: Verordening (EU) 2023/1230
              article: '2'
              paragraph: '1'
              explanation: >-
                "de volgende verwante producten: a) verwisselbare uitrustingsstukken; b) veiligheidscomponenten;
                c) hijs- en hefgereedschappen; d) kettingen, kabels en banden; e) verwijderbare
                mechanische overbrengingssystemen". De begrippen komen uit artikel 3, punten
                2 tot en met 9. Voor onderdeel e heet het begrip in de definitie van punt 9
                "overbrengingsinrichting"; zie de beschrijving van die input.
          - output: is_machine_of_verwant_product
            value:
              operation: OR
              conditions:
                - $is_machine
                - $is_verwant_product
            legal_basis:
              law: Verordening (EU) 2023/1230
              article: '2'
              paragraph: '1'
              explanation: >-
                Eerste alinea: "Deze verordening is van toepassing op machines en de volgende
                verwante producten".
          - output: is_product_binnen_toepassingsgebied
            value:
              operation: OR
              conditions:
                - $is_machine_of_verwant_product
                - $is_niet_voltooide_machine
            legal_basis:
              law: Verordening (EU) 2023/1230
              article: '2'
              paragraph: '1'
              explanation: >-
                Tweede alinea: "ook van toepassing op niet voltooide machines". Derde alinea:
                machines, de verwante producten van de eerste alinea en niet voltooide machines
                worden "samen aangeduid als producten die binnen het toepassingsgebied van deze
                verordening vallen". Die aanduiding noemt alleen deze drie groepen; de uitsluitingen
                van lid 2 staan er niet in.
  - number: '2.2'
    text: >-
      Deze verordening is niet van toepassing op: a) veiligheidscomponenten die bestemd
      zijn om identieke componenten te vervangen en die geleverd zijn door de fabrikant van
      de oorspronkelijke machine, het oorspronkelijke verwante product of de oorspronkelijke
      niet voltooide machine; b) specifiek voor kermissen of amusementsparken bestemd materieel;
      c) machines en verwante producten die speciaal zijn ontworpen voor gebruik binnen of
      die gebruikt worden in een kerninstallatie en waarvan de overeenstemming met deze verordening
      de nucleaire veiligheid van die installatie kan ondermijnen; d) wapens, met inbegrip
      van vuurwapens; e) middelen voor vervoer door de lucht, over het water en via het spoor,
      met uitzondering van machines die op die vervoermiddelen zijn gemonteerd; f) luchtvaartproducten,
      -onderdelen en -apparatuur die binnen het toepassingsgebied van Verordening (EU) 2018/1139
      van het Europees Parlement en de Raad en de definitie van machines in het kader van
      deze verordening vallen, voor zover Verordening (EU) 2018/1139 betrekking heeft op de
      relevante essentiële gezondheids- en veiligheidseisen van deze verordening; g) motorvoertuigen
      en aanhangwagens daarvan, alsook systemen, onderdelen en technische eenheden, en voertuigdelen
      en uitrustingsstukken die voor dergelijke voertuigen zijn ontworpen en gebouwd, die
      binnen het toepassingsgebied vallen van Verordening (EU) 2018/858, met uitzondering
      van machines die op die voertuigen zijn gemonteerd; h) twee- of driewielige voertuigen
      en vierwielers, alsook systemen, onderdelen, technische eenheden, voertuigdelen en uitrustingsstukken
      die voor dergelijke voertuigen zijn ontworpen en gebouwd, die binnen het toepassingsgebied
      van Verordening (EU) nr. 168/2013 vallen, met uitzondering van machines die op die voertuigen
      zijn gemonteerd; i) landbouw- en bosbouwtrekkers, alsook systemen, onderdelen, technische
      eenheden, voertuigdelen en uitrustingsstukken die voor dergelijke trekkers zijn ontworpen
      en gebouwd, die binnen het toepassingsgebied van Verordening (EU) nr. 167/2013 vallen,
      met uitzondering van machines die op die trekkers zijn gemonteerd; j) motorvoertuigen
      die uitsluitend bestemd zijn voor wedstrijden; k) zeeschepen en mobiele offshore-eenheden,
      alsmede machines die aan boord van dergelijke schepen of eenheden zijn geïnstalleerd;
      l) machines of verwante producten die specifiek zijn ontworpen en gebouwd voor militaire
      of politiedoeleinden; m) machines of verwante producten die specifiek zijn ontworpen
      en gebouwd voor onderzoeksdoeleinden voor tijdelijk gebruik in laboratoria; n) mijnliften;
      o) machines of verwante producten voor het verplaatsen van kunstenaars tijdens een optreden;
      p) de volgende elektrische en elektronische producten, voor zover zij binnen het toepassingsgebied
      van Richtlijn 2014/35/EU of Richtlijn 2014/53/EU vallen: i) huishoudelijke apparaten
      die voor huishoudelijk gebruik zijn bestemd en geen elektronisch bedienbare meubels
      zijn; ii) audio- en videoapparatuur; iii) apparatuur die wordt gebruikt in de informatietechnologie;
      iv) gewone kantoormachines, met uitzondering van additieve drukmachines voor het maken
      van driedimensionale producten; v) schakelmaterieel en besturingsapparatuur voor laagspanning;
      vi) elektromotoren; q) de volgende elektrische hoogspanningsproducten: i) schakelmaterieel
      en besturingsapparatuur; ii) transformators.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_2
    machine_readable:
      markings:
        - about: het bereik van "deze verordening is niet van toepassing op" over alle bepalingen van de verordening
          reason: >-
            Lid 2 neemt de genoemde producten weg uit elke bepaling van de verordening, ook uit
            een bepaling die artikel 2 niet noemt. De vorm die het dichtst komt is een source-binding:
            een artikel dat verordening_van_toepassing zelf opvraagt, zoals artikel 25, lid 1,
            is aan dit lid gebonden. Een bepaling die later uitvoerbaar wordt zonder die binding,
            rekent ook voor een uitgesloten product. Een materieel toepassingsgebied op het niveau
            van het document, zoals valid_from dat in de tijd geeft, heeft geen veld.
          resolution: model
          resolved_by: >-
            Een materieel toepassingsgebied op documentniveau, naast valid_from, dat de engine
            vóór elke bepaling van het document toetst en dat verwijst naar de output die het
            bepaalt (hier verordening_van_toepassing).
          target: []
          legal_text_excerpt: Deze verordening is niet van toepassing op
          accepted: false
        - about: >-
            de uitsluiting van luchtvaartproducten voor zover Verordening (EU) 2018/1139 de relevante
            essentiële eisen bestrijkt
          reason: >-
            Onderdeel f sluit een luchtvaartproduct uit "voor zover" Verordening (EU) 2018/1139
            betrekking heeft op de relevante essentiële gezondheids- en veiligheidseisen van
            deze verordening. Voor de eisen die 2018/1139 niet bestrijkt, blijft deze verordening
            op hetzelfde product van toepassing. Het model kent de toepasselijkheid als één booleaanse
            uitkomst per product. Het sluit het product daarom alleen uit als 2018/1139 op alle
            relevante eisen betrekking heeft. Bestrijkt 2018/1139 een deel van de eisen, dan
            is de verordening volgens het model op het hele product van toepassing, ook voor
            de eisen die 2018/1139 wel bestrijkt en die onderdeel f wegneemt.
          resolution: model
          resolved_by: >-
            Een toepasselijkheid per essentiële gezondheids- en veiligheidseis van bijlage III,
            zodat een uitsluiting een deel van de eisen kan wegnemen en de rest laat staan.
          target: []
          legal_text_excerpt: >-
            voor zover Verordening (EU) 2018/1139 betrekking heeft op de relevante essentiële
            gezondheids- en veiligheidseisen van deze verordening
          accepted: false
