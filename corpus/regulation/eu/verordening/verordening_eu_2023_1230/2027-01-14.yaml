$schema: >-
  https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.7.1/schema/v0.7.1/schema.json
$id: verordening_eu_2023_1230
name: Verordening (EU) 2023/1230 betreffende machines
officiele_titel: >-
  Verordening (EU) 2023/1230 van het Europees Parlement en de Raad van 14 juni 2023 betreffende
  machines en tot intrekking van Richtlijn 2006/42/EG van het Europees Parlement en de Raad
  en Richtlijn 73/361/EEG van de Raad
regulatory_layer: EU_VERORDENING
celex_nummer: 32023R1230
eli: http://data.europa.eu/eli/reg/2023/1230/oj
publication_date: '2023-06-29'
valid_from: '2027-01-14'
url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230
articles:
  - number: '1'
    text: >-
      **Onderwerp**


      In deze verordening worden gezondheids- en veiligheidseisen vastgesteld voor het ontwerp
      en de bouw van machines, verwante producten en niet voltooide machines opdat deze op
      de markt kunnen worden aangeboden en in bedrijf kunnen worden gesteld, terwijl tegelijkertijd
      een hoog niveau van bescherming van de gezondheid en veiligheid van personen, met name
      consumenten en professionele gebruikers, en indien passend huisdieren en eigendommen,
      alsook in voorkomend geval van het milieu wordt gewaarborgd. In deze verordening worden
      ook voorschriften vastgesteld voor het vrije verkeer van producten die binnen het toepassingsgebied
      van deze verordening vallen, in de Unie.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_1
  - number: '2.1'
    text: >-
      **Toepassingsgebied**


      Deze verordening is van toepassing op machines en de volgende verwante producten:
      a) verwisselbare uitrustingsstukken; b) veiligheidscomponenten; c) hijs- en hefgereedschappen;
      d) kettingen, kabels en banden; e) verwijderbare mechanische overbrengingssystemen.
      Deze verordening is ook van toepassing op niet voltooide machines. Voor de toepassing
      van deze verordening worden machines, de in de eerste alinea genoemde verwante producten
      en niet voltooide machines samen aangeduid als “producten die binnen het toepassingsgebied
      van deze verordening vallen” of “binnen het toepassingsgebied van deze verordening vallende
      producten”.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_2
    machine_readable:
      execution:
        input:
