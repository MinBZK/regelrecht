  - number: '25.5'
    text: >-
      De aangemelde instanties houden bij het vaststellen van de tarieven voor conformiteitsbeoordelingen
      rekening met de specifieke belangen en behoeften van kleine en middelgrote ondernemingen.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_25
    machine_readable:
      open_terms:
        - id: rekening_houden_met_belangen_kmo_bij_tarieven
          type: string
          required: true
          decided_per_case_by: de aangemelde instantie (artikel 25, lid 5)
          legal_basis: artikel 25, lid 5, Verordening (EU) 2023/1230
  - number: '26'
    text: >-
      **Aanmelding**


      De lidstaten melden de instanties die bevoegd zijn om uit hoofde van deze verordening
      conformiteitsbeoordelingstaken van derden te verrichten, aan bij de Commissie en de
      andere lidstaten.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_26
  - number: '27'
    text: >-
      **Aanmeldende autoriteiten**


      1. De lidstaten wijzen een aanmeldende autoriteit aan die verantwoordelijk is voor de
      opstelling en uitvoering van de nodige procedures voor de beoordeling en aanmelding
      van conformiteitsbeoordelingsinstanties en het toezicht op de aangemelde instanties,
      met inbegrip van de naleving van artikel 32.


      2. De lidstaten kunnen de beoordeling en het toezicht als bedoeld in lid 1 overeenkomstig
      Verordening (EG) nr. 765/2008 laten uitvoeren door een nationale accreditatie-instantie,
      zoals gedefinieerd in die verordening.


      3. Wanneer de aanmeldende autoriteit de beoordeling, de aanmelding of het toezicht,
      zoals bedoeld in lid 1, delegeert of op een andere wijze toevertrouwt aan een instantie
      die geen overheidsinstantie is, is die instantie een rechtspersoon en voldoet zij mutatis
      mutandis aan de eisen die zijn vastgesteld in artikel 28. Bovendien treft deze instantie
      regelingen om de aansprakelijkheid voor haar activiteiten te dekken.


      4. De aanmeldende autoriteit is volledig aansprakelijk voor de taken die de in lid 3
      bedoelde instantie verricht.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_27
  - number: '28'
    text: >-
      **Eisen voor aanmeldende autoriteiten**


      1. Een aanmeldende autoriteit is zodanig opgericht dat zich geen belangenconflicten
      met conformiteitsbeoordelingsinstanties voordoen.


      2. Een aanmeldende autoriteit is zodanig georganiseerd en functioneert zodanig dat de
      objectiviteit en onpartijdigheid van haar activiteiten gewaarborgd zijn.


      3. Een aanmeldende autoriteit is zodanig georganiseerd dat elk besluit in verband met
      de aanmelding van een conformiteitsbeoordelingsinstantie wordt genomen door bekwame
      personen die niet de beoordeling hebben verricht.


      4. Een aanmeldende autoriteit verricht geen activiteiten die worden uitgevoerd door
      conformiteitsbeoordelingsinstanties en verleent geen adviesdiensten op commerciële basis
      of in concurrentie, noch biedt zij zulke activiteiten of diensten aan.


      5. Een aanmeldende autoriteit waarborgt dat de verkregen informatie vertrouwelijk wordt
      behandeld.


      6. Een aanmeldende autoriteit beschikt over een voldoende aantal bekwame personeelsleden
      om haar taken naar behoren uit te voeren.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_28
  - number: '29'
    text: >-
      **Informatieverplichting voor aanmeldende autoriteiten**


      De lidstaten brengen de Commissie op de hoogte van hun procedures voor de beoordeling
      en aanmelding van conformiteitsbeoordelingsinstanties en voor het toezicht op de aangemelde
      instanties, alsook van alle wijzigingen daarvan. De Commissie maakt die informatie openbaar.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_29
  - number: '30'
    text: >-
      **Eisen voor aangemelde instanties**


      1. Om te kunnen worden aangemeld, moeten conformiteitsbeoordelingsinstanties voldoen
      aan de eisen van de leden 2 tot en met 11.


      2. Een conformiteitsbeoordelingsinstantie is opgericht naar het nationale recht van
      een lidstaat en heeft rechtspersoonlijkheid.


      3. Een conformiteitsbeoordelingsinstantie is een derde partij die onafhankelijk is van
      de door haar beoordeelde organisaties of machines of verwante producten. Een instantie
      die lid is van een organisatie van ondernemers of van een vakorganisatie die ondernemingen
      vertegenwoordigt die betrokken zijn bij het ontwerp, het vervaardigen, de levering,
      de montage, het gebruik of het onderhoud van de door haar beoordeelde machines of verwante
      producten, kan als een dergelijke conformiteitsbeoordelingsinstantie worden beschouwd,
      mits haar onafhankelijkheid en de afwezigheid van belangenconflicten worden aangetoond.


      4. Een conformiteitsbeoordelingsinstantie, haar hoogste leidinggevenden en het personeel
      dat de conformiteitsbeoordelingstaken verricht, zijn niet de ontwerper, fabrikant, leverancier,
      importeur, distributeur, installateur, koper, eigenaar, gebruiker of uitvoerder van
      onderhoud van door hen beoordeelde machines of verwante producten, vervullen geen van
      deze rollen met betrekking tot niet voltooide machines die in het beoordeelde product
      zijn ingebouwd, en zijn evenmin de vertegenwoordiger van een van deze partijen. Dit
      vormt echter geen beletsel voor het gebruik van beoordeelde machines of verwante producten
      die nodig zijn voor de activiteiten van de conformiteitsbeoordelingsinstantie, noch
      voor het gebruik van de machines of verwante producten voor persoonlijke doeleinden.
      Een conformiteitsbeoordelingsinstantie, haar hoogste leidinggevenden en het personeel
      dat de conformiteitsbeoordelingstaken verricht, zijn niet rechtstreeks of als vertegenwoordiger
      van de betrokken partijen betrokken bij het ontwerpen, invoeren, distribueren, vervaardigen,
      verhandelen, installeren, gebruiken of onderhouden van de machines of verwante producten.
      Zij voeren geen activiteiten uit die hun onafhankelijk oordeel of hun integriteit met
      betrekking tot de conformiteitsbeoordelingsactiviteiten waarvoor zij zijn aangemeld
      in het gedrang kunnen brengen. Dit geldt met name voor adviesdiensten. Een conformiteitsbeoordelingsinstantie
      zorgt ervoor dat de activiteiten van haar dochterondernemingen of onderaannemers geen
      afbreuk doen aan de vertrouwelijkheid, objectiviteit of onpartijdigheid van haar conformiteitsbeoordelingsactiviteiten.


      5. Een conformiteitsbeoordelingsinstantie en haar personeel voeren de conformiteitsbeoordelingsactiviteiten
      uit met de grootste mate van beroepsintegriteit en met de vereiste technische bekwaamheid
      op het specifieke gebied en zij zijn vrij van elke druk en beïnvloeding, met name van
      financiële aard, die hun oordeel of de resultaten van hun conformiteitsbeoordelingsactiviteiten
      kunnen beïnvloeden, met name van personen of groepen van personen die belang hebben
      bij de resultaten van die activiteiten.


      6. Een conformiteitsbeoordelingsinstantie is in staat alle conformiteitsbeoordelingstaken
      te verrichten die in de bijlagen VII, IX en X aan haar zijn toegewezen en waarvoor zij
      is aangemeld, ongeacht of deze taken door de conformiteitsbeoordelingsinstantie zelf
      of namens haar en onder haar verantwoordelijkheid worden verricht. Een conformiteitsbeoordelingsinstantie
      beschikt te allen tijde, voor elke conformiteitsbeoordelingsprocedure en voor elk soort
      machines of verwante producten waarvoor zij is aangemeld, over: a) voldoende personeel
      met technische kennis en voldoende relevante ervaring om de conformiteitsbeoordelingstaken
      uit te voeren; b) de nodige beschrijvingen van de procedures voor de uitvoering van
      de conformiteitsbeoordeling, waarbij de transparantie en de mogelijkheid tot reproductie
      van deze procedures worden gewaarborgd; c) een passend beleid en geschikte procedures
      om een onderscheid te maken tussen taken die zij als aangemelde instantie verricht en
      andere activiteiten; d) de nodige procedures om bij de uitoefening van haar conformiteitsbeoordelingsactiviteiten
      naar behoren rekening te houden met de omvang van een onderneming, de sector waarin
      deze actief is, haar structuur, de relatieve complexiteit van de desbetreffende technologie
      van de machines of verwante producten en het massa- of seriële karakter van het productieproces.
      Een conformiteitsbeoordelingsinstantie beschikt over de middelen die nodig zijn om de
      technische en administratieve taken in verband met de conformiteitsbeoordelingsactiviteiten
      op passende wijze uit te voeren en heeft toegang tot alle vereiste apparatuur en faciliteiten.


      7. Het voor de uitvoering van de conformiteitsbeoordelingstaken verantwoordelijke personeel
      beschikt over: a) een gedegen technische en beroepsopleiding die alle conformiteitsbeoordelingsactiviteiten
      omvat waarvoor de conformiteitsbeoordelingsinstantie is aangemeld; b) voldoende kennis
      van de eisen inzake de beoordelingen die het verricht en voldoende bevoegdheden om deze
      beoordelingen uit te voeren; c) voldoende kennis van en inzicht in de essentiële gezondheids-
      en veiligheidseisen van bijlage III, de toepasselijke geharmoniseerde normen en gemeenschappelijke
      specificaties als bedoeld in artikel 20, en de relevante bepalingen van de harmonisatiewetgeving
      van de Unie en de nationale wetgeving; d) de bekwaamheid om certificaten, dossiers en
      rapporten op te stellen die aantonen dat de conformiteitsbeoordelingen zijn verricht.


      8. De onpartijdigheid van een conformiteitsbeoordelingsinstantie, haar hoogste leidinggevenden
      en het personeel dat de conformiteitsbeoordelingstaken verricht, wordt gewaarborgd.
      De beloning van de hoogste leidinggevenden en het personeel dat de conformiteitsbeoordelingstaken
      verricht, hangt niet af van het aantal uitgevoerde conformiteitsbeoordelingen of van
      de resultaten daarvan.


      9. Een conformiteitsbeoordelingsinstantie sluit een aansprakelijkheidsverzekering af,
      tenzij de wettelijke aansprakelijkheid op basis van het nationale recht door de lidstaat
      wordt gedekt of de lidstaat zelf rechtstreeks verantwoordelijk is voor de conformiteitsbeoordeling.


      10. Het personeel van een conformiteitsbeoordelingsinstantie is gebonden aan het beroepsgeheim
      ten aanzien van alle informatie waarvan het kennisneemt bij de verrichting van de conformiteitsbeoordelingstaken
      overeenkomstig de bijlagen VII, IX en X, behalve ten opzichte van de bevoegde autoriteiten
      van de lidstaat waarin de taken plaatsvinden. Eigendomsrechten, intellectuele-eigendomsrechten
      en bedrijfsgeheimen worden beschermd.


      11. Een conformiteitsbeoordelingsinstantie neemt deel aan, of zorgt ervoor dat haar
      personeel dat de conformiteitsbeoordelingstaken verricht in kennis wordt gesteld van,
      de desbetreffende normalisatieactiviteiten en de activiteiten van de coördinatiegroep
      van de aangemelde instantie die is opgericht uit hoofde van artikel 42, en past de op
      grond van de werkzaamheden van die groep genomen administratieve beslissingen en geproduceerde
      documenten toe als algemene richtsnoeren.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_30
  - number: '31'
    text: >-
      **Vermoeden van conformiteit van aangemelde instanties**


      Wanneer een conformiteitsbeoordelingsinstantie aantoont dat zij voldoet aan de criteria
      in de ter zake doende geharmoniseerde normen of delen daarvan, waarvan de referenties
      in het Publicatieblad van de Europese Unie zijn bekendgemaakt, wordt zij geacht aan
      de eisen van artikel 30 te voldoen, op voorwaarde dat de van toepassing zijnde geharmoniseerde
      normen deze eisen dekken.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_31
  - number: '32'
    text: >-
      **Gebruik van onderaannemers en dochterondernemingen door aangemelde instanties**


      1. Wanneer een aangemelde instantie specifieke taken in verband met de conformiteitsbeoordeling
      uitbesteedt of door een dochteronderneming laat uitvoeren, waarborgt zij dat de onderaannemer
      of dochteronderneming aan de eisen van artikel 30 voldoet, en brengt zij de aanmeldende
      autoriteit hiervan op de hoogte.


      2. Een aangemelde instantie is volledig aansprakelijk voor de taken die worden verricht
      door onderaannemers of dochterondernemingen, ongeacht waar deze gevestigd zijn.


      3. Activiteiten mogen uitsluitend met instemming van de klant worden uitbesteed of door
      een dochteronderneming worden uitgevoerd.


      4. Een aangemelde instantie houdt alle relevante documenten over de beoordeling van
      de kwalificaties van de onderaannemer of de dochterondernemingen over de door de onderaannemer
      of de dochteronderneming uit hoofde van de bijlagen VII, IX en X uitgevoerde werkzaamheden
      ter beschikking van de aanmeldende autoriteit.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_32
  - number: '33'
    text: >-
      **Verzoek om aanmelding**


      1. Een conformiteitsbeoordelingsinstantie dient een verzoek om aanmelding in bij de
      aanmeldende autoriteit van de lidstaat waar zij gevestigd is.


      2. Het verzoek om aanmelding gaat vergezeld van een beschrijving van de conformiteitsbeoordelingsactiviteiten,
      van de in de bijlagen VII, IX en X beschreven conformiteitsbeoordelingsprocedures en
      van de soorten of categorieën machines of verwante producten waarvoor de conformiteitsbeoordelingsinstantie
      verklaart bevoegd te zijn, alsook in voorkomend geval van een accreditatiecertificaat
      dat is afgegeven door een nationale accreditatie-instantie waarin wordt verklaard dat
      de conformiteitsbeoordelingsinstantie voldoet aan de eisen van artikel 30.


      3. Wanneer de betrokken conformiteitsbeoordelingsinstantie geen accreditatiecertificaat
      als bedoeld in lid 2 kan overleggen, verstrekt zij de aanmeldende autoriteit alle bewijsstukken
      die nodig zijn om haar overeenstemming met de eisen van artikel 30 te verifiëren en
      te erkennen en daar geregeld toezicht op te houden.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_33
  - number: '34'
    text: >-
      **Aanmeldingsprocedure**


      1. Een aanmeldende autoriteit meldt alleen conformiteitsbeoordelingsinstanties aan die
      aan de eisen van artikel 30 voldoen.


      2. De aanmeldende autoriteit stelt de Commissie en de andere lidstaten in kennis door
      middel van het door de Commissie ontwikkelde en beheerde elektronische aanmeldingssysteem.


      3. De in lid 2 bedoelde kennisgeving omvat het volgende: a) volledige details van de
      uit te voeren conformiteitsbeoordelingsactiviteiten; b) een indicatie van de conformiteitsbeoordelingsmodule(s)
      en de betrokken soorten of categorieën machines of verwante producten; c) het desbetreffende
      bekwaamheidsattest.


      4. Wanneer een aanmelding niet gebaseerd is op een accreditatiecertificaat als bedoeld
      in artikel 33, lid 2, verschaft de aanmeldende autoriteit de Commissie en de andere
      lidstaten de bewijsstukken waaruit de bekwaamheid van de conformiteitsbeoordelingsinstantie
      blijkt, evenals de regelingen waarmee wordt gewaarborgd dat die instantie regelmatig
      wordt gecontroleerd en aan de eisen van artikel 30 blijft voldoen.


      5. De betrokken conformiteitsbeoordelingsinstantie mag de activiteiten van een aangemelde
      instantie alleen verrichten als de Commissie en de andere lidstaten binnen twee weken
      na goedkeuring van de aanmelding indien een accreditatiecertificaat in de zin van artikel
      33, lid 2, wordt gebruikt, of binnen twee maanden na de aanmelding indien de in lid
      4 van dit artikel bedoelde bewijsstukken worden gebruikt, geen bezwaar hebben ingediend.
      Alleen een dergelijke instantie wordt voor de toepassing van deze verordening als aangemelde
      instantie beschouwd.


      6. De aanmeldende autoriteit stelt de Commissie en de andere lidstaten in kennis van
      alle relevante latere wijzigingen van de in lid 2 bedoelde aanmelding.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_34
  - number: '35'
    text: >-
      **Identificatienummers en lijsten van aangemelde instanties**


      1. De Commissie kent aangemelde instanties een identificatienummer toe. Zij kent per
      instantie slechts één nummer toe, ook als de instantie uit hoofde van diverse handelingen
      van de Unie is aangemeld.


      2. De Commissie maakt de lijst van uit hoofde van deze verordening aangemelde instanties
      openbaar, onder vermelding van de toegekende identificatienummers en de conformiteitsbeoordelingsactiviteiten
      waarvoor zij zijn aangemeld. De Commissie zorgt ervoor dat de lijst actueel wordt gehouden.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_35
  - number: '36'
    text: >-
      **Wijziging van aanmeldingen**


      1. Wanneer een aanmeldende autoriteit heeft geconstateerd of vernomen dat een aangemelde
      instantie niet meer aan de eisen van artikel 30 voldoet of dat die instantie haar in
      artikel 38 vastgestelde verplichtingen niet nakomt, wordt de aanmelding door de aanmeldende
      autoriteit naargelang het geval beperkt, geschorst of ingetrokken, afhankelijk van de
      ernst van het niet-voldoen aan die eisen of het niet-nakomen van die verplichtingen.
      Zij brengt de Commissie en de andere lidstaten daarvan onmiddellijk op de hoogte.


      2. Wanneer de aanmelding wordt beperkt, geschorst of ingetrokken, of wanneer de aangemelde
      instantie haar activiteiten heeft gestaakt, doet de aanmeldende autoriteit het nodige
      om ervoor te zorgen dat de dossiers van die instantie hetzij door een andere aangemelde
      instantie worden behandeld, hetzij aan de verantwoordelijke aanmeldende autoriteiten
      en markttoezichtautoriteiten op hun verzoek ter beschikking kunnen worden gesteld.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_36
  - number: '37'
    text: >-
      **Betwisting van de bekwaamheid van aangemelde instanties**


      1. De Commissie onderzoekt alle gevallen waarin zij twijfelt of in kennis wordt gesteld
      van twijfels over de bekwaamheid van een aangemelde instantie of over de vraag of een
      aangemelde instantie nog aan de eisen voldoet en haar verantwoordelijkheden nakomt.


      2. De aanmeldende lidstaat verstrekt de Commissie op verzoek alle informatie over de
      grondslag van de aanmelding of het op peil houden van de bekwaamheid van de betrokken
      aangemelde instantie.


      3. De Commissie zorgt ervoor dat alle tijdens haar onderzoek ontvangen gevoelige informatie
      vertrouwelijk wordt behandeld.


      4. Indien de Commissie vaststelt dat een aangemelde instantie niet of niet meer aan
      de aanmeldingseisen voldoet, stelt zij een uitvoeringshandeling vast waarin de aanmeldende
      lidstaat wordt verzocht de nodige corrigerende maatregelen te nemen, en zo nodig de
      aanmelding in te trekken. Die uitvoeringshandeling wordt volgens de in artikel 48, lid
      2, bedoelde raadplegingsprocedure vastgesteld.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_37
  - number: '38'
    text: >-
      **Operationele verplichtingen van aangemelde instanties**


      1. Een aangemelde instantie voert conformiteitsbeoordelingen uit volgens de conformiteitsbeoordelingsprocedures
      in de bijlagen VII, IX en X.


      2. Een aangemelde instantie voert haar activiteiten op evenredige wijze uit, waarbij
      zij voorkomt de marktdeelnemers onnodig te belasten en naar behoren rekening houdt met
      de omvang van de onderneming, de sector waarin de onderneming actief is, haar structuur,
      de relatieve complexiteit van de desbetreffende technologie en het massa- of seriële
      karakter van het productieproces. Hierbij eerbiedigt de aangemelde instantie echter
      de striktheid en het beschermingsniveau die nodig zijn opdat de machine of het verwante
      product voldoet aan de eisen van deze verordening.


      3. Indien een aangemelde instantie vaststelt dat een fabrikant niet heeft voldaan aan
      de essentiële gezondheids- en veiligheidseisen van bijlage III of in artikel 20 bedoelde
      overeenkomstige geharmoniseerde normen of gemeenschappelijke specificaties, eist zij
      van de fabrikant dat deze passende corrigerende maatregelen neemt en verleent zij geen
      certificaat van EU-typeonderzoek, stelt zij geen goedkeuringsbesluit voor kwaliteitssystemen
      vast en geeft zij ook geen certificaat voor eenheidskeuring af.


      4. Wanneer een aangemelde instantie bij het toezicht op de conformiteit na de vaststelling
      van een goedkeuringsbesluit overeenkomstig bijlage IX vaststelt dat een machine of een
      verwant product niet meer conform is, verlangt zij van de fabrikant dat deze passende
      corrigerende maatregelen neemt en schorst zij zo nodig het goedkeuringsbesluit of trekt
      zij dit in. Indien geen corrigerende maatregelen worden genomen of de genomen maatregelen
      niet het vereiste effect hebben, worden goedkeuringsbesluiten door de aangemelde instantie
      naargelang het geval beperkt, geschorst of ingetrokken.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_38
  - number: '39'
    text: >-
      **Beroep tegen besluiten van aangemelde instanties**


      Een aangemelde instantie voorziet in een transparante en toegankelijke procedure om
      beroep aan te tekenen tegen haar besluiten.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_39
  - number: '40'
    text: >-
      **Informatieverplichting van aangemelde instanties**


      1. Een aangemelde instantie brengt de aanmeldende autoriteit op de hoogte van: a) elke
      weigering, beperking, schorsing of intrekking van een certificaat van EU-typeonderzoek,
      een goedkeuringsbesluit voor kwaliteitssystemen of een certificaat voor eenheidskeuring;
      b) alle omstandigheden die van invloed zijn op de werkingssfeer van en de voorwaarden
      voor hun aanmelding; c) informatieverzoeken over haar conformiteitsbeoordelingsactiviteiten
      die zij van markttoezichtautoriteiten ontvangt; d) op verzoek, de binnen de werkingssfeer
      van haar aanmelding verrichte conformiteitsbeoordelingsactiviteiten en andere activiteiten,
      waaronder grensoverschrijdende activiteiten en uitbesteding.


      2. Een aangemelde instantie verstrekt de andere uit hoofde van deze verordening aangemelde
      instanties die soortgelijke conformiteitsbeoordelingsactiviteiten voor dezelfde soorten
      machines of verwante producten verrichten, relevante informatie over negatieve conformiteitsbeoordelingsresultaten,
      en op verzoek ook over positieve conformiteitsbeoordelingsresultaten.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_40
  - number: '41'
    text: >-
      **Uitwisseling van ervaringen**


      De Commissie voorziet in de organisatie van de uitwisseling van ervaringen tussen de
      nationale autoriteiten van de lidstaten die verantwoordelijk zijn voor het aanmeldingsbeleid.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_41
  - number: '42'
    text: >-
      **Coördinatie van aangemelde instanties**


      De Commissie zorgt voor de totstandbrenging en goede werking van passende coördinatie
      en samenwerking tussen uit hoofde van deze verordening aangemelde instanties in de vorm
      van een sectorale groep van aangemelde instanties. Aangemelde instanties nemen rechtstreeks
      of via aangestelde vertegenwoordigers aan de werkzaamheden van die groep deel.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_42
  - number: '43'
    text: >-
      **Procedure op nationaal niveau voor binnen het toepassingsgebied van deze verordening
      vallende producten die een risico opleveren**


      1. Als de markttoezichtautoriteiten van een lidstaat voldoende redenen hebben om aan
      te nemen dat een binnen het toepassingsgebied van deze verordening vallend product een
      risico oplevert voor de gezondheid of veiligheid van personen en indien passend huisdieren
      of eigendommen, alsook in voorkomend geval voor het milieu, voeren zij een evaluatie
      van het product uit met betrekking tot alle relevante eisen van deze verordening. De
      desbetreffende marktdeelnemers werken hiertoe op elke vereiste wijze samen met de markttoezichtautoriteiten.
      Indien de markttoezichtautoriteiten bij de in de eerste alinea bedoelde evaluatie vaststellen
      dat het binnen het toepassingsgebied van deze verordening vallende product niet aan
      de eisen van deze verordening voldoet, verlangen zij onverwijld van de betrokken marktdeelnemer
      dat die passende en evenredige corrigerende maatregelen treft, als bedoeld in artikel
      16, lid 3, van Verordening (EU) 2019/1020, om een einde te maken aan de niet-conformiteit
      of om de gevaren weg te nemen, of, indien dat niet mogelijk is, om het door de markttoezichtautoriteiten
      aangegeven risico tot een minimum te beperken binnen een redelijke termijn die evenredig
      is met de aard van het in de eerste alinea bedoelde risico. De markttoezichtautoriteiten
      stellen de desbetreffende aangemelde instantie hiervan op de hoogte.


      2. Indien de markttoezichtautoriteiten van oordeel zijn dat de niet-conformiteit niet
      tot hun nationale grondgebied beperkt is, brengen zij de Commissie en de andere lidstaten
      op de hoogte van de resultaten van de evaluatie en van de maatregelen die zij van de
      marktdeelnemer hebben vereist.


      3. De marktdeelnemer zorgt ervoor dat in de hele Unie alle passende corrigerende maatregelen
      worden toegepast op alle betrokken binnen het toepassingsgebied van deze verordening
      vallende producten die deze marktdeelnemer op de markt heeft aangeboden.


      4. Wanneer de desbetreffende marktdeelnemer niet binnen de vastgestelde termijn de in
      lid 1, tweede alinea, bedoelde corrigerende maatregelen treft, of wanneer de niet-conformiteit
      als bedoeld in lid 1, tweede alinea, of het risico als bedoeld in lid 1, eerste alinea,
      blijft bestaan, zorgen de markttoezichtautoriteiten ervoor dat het betrokken product
      uit de handel wordt genomen of wordt teruggeroepen, of dat het op de markt aanbieden
      ervan wordt verboden of beperkt. In dergelijke gevallen zorgen de markttoezichtautoriteiten
      ervoor dat het publiek, de Commissie en de andere lidstaten daarvan onverwijld op de
      hoogte worden gebracht.


      5. De in lid 4 bedoelde informatie omvat alle bekende bijzonderheden, met name de gegevens
      die nodig zijn om het niet-conforme binnen het toepassingsgebied van deze verordening
      vallende product te identificeren en om de oorsprong van dat product, de aard van de
      beweerde niet-conformiteit en van het risico, en de aard en de duur van de nationale
      maatregelen vast te stellen, evenals de argumenten die worden aangevoerd door de desbetreffende
      marktdeelnemer. De markttoezichtautoriteiten vermelden met name of de niet-conformiteit
      een van de volgende oorzaken heeft: a) het product voldoet niet aan de essentiële gezondheids-
      en veiligheidseisen van bijlage III; b) onvolkomenheden in de in artikel 20, lid 1,
      bedoelde geharmoniseerde normen; c) een leemte in de in artikel 20, lid 6, bedoelde
      gemeenschappelijke specificaties.


      6. Andere lidstaten dan de lidstaat die de procedure krachtens dit artikel in gang heeft
      gezet, brengen de Commissie en de andere lidstaten onverwijld op de hoogte van door
      hen genomen maatregelen en van aanvullende informatie over de niet-conformiteit van
      het betrokken binnen het toepassingsgebied van deze verordening vallende product waarover
      zij beschikken, en van hun bezwaren indien zij het niet eens zijn met de genomen nationale
      maatregel.


      7. Indien binnen drie maanden na de ontvangst van de in lid 4 bedoelde informatie geen
      bezwaar tegen een voorlopige maatregel van een lidstaat is ingebracht door een lidstaat
      of de Commissie, wordt die maatregel geacht gerechtvaardigd te zijn.


      8. De lidstaten zorgen ervoor dat onmiddellijk passende beperkende maatregelen worden
      getroffen ten aanzien van het betrokken product dat binnen het toepassingsgebied van
      deze verordening valt, bijvoorbeeld de onverwijlde intrekking van dat product.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_43
  - number: '44'
    text: >-
      **Vrijwaringsprocedure van de Unie**


      1. Wanneer na voltooiing van de in artikel 43, leden 4, 6 en 7, beschreven procedure
      bezwaren tegen een door een lidstaat genomen maatregel worden aangetekend of de Commissie
      van mening is dat een nationale maatregel in strijd is met rechtshandelingen van de
      Unie, treedt de Commissie onverwijld in overleg met de lidstaten en de betrokken marktdeelnemer
      of marktdeelnemers en voert zij een evaluatie van de nationale maatregel uit. Op grond
      van de resultaten van die evaluatie stelt de Commissie een uitvoeringshandeling vast
      in de vorm van een besluit waarin wordt bepaald of de nationale maatregel al dan niet
      gerechtvaardigd is. De Commissie richt haar besluit tot alle lidstaten en stelt de lidstaten
      en de betrokken marktdeelnemer of marktdeelnemers er onverwijld van op de hoogte.


      2. Indien de nationale maatregel gerechtvaardigd wordt geacht, zorgen alle lidstaten
      ervoor dat passende beperkende maatregelen, zoals uit de handel nemen, worden genomen
      ten aanzien van het niet-conforme binnen het toepassingsgebied van deze verordening
      vallende product, en stellen zij de Commissie daarvan in kennis. Indien de nationale
      maatregel niet gerechtvaardigd wordt geacht, trekt de betrokken lidstaat die maatregel
      in.


      3. Indien de nationale maatregel gerechtvaardigd wordt geacht en de niet-conformiteit
      van het binnen het toepassingsgebied van deze verordening vallende product wordt toegeschreven
      aan tekortkomingen in de geharmoniseerde normen als bedoeld in artikel 43, lid 5, punt
      b), van deze verordening of in de gemeenschappelijke specificaties als bedoeld in artikel
      43, lid 5, punt c), van deze verordening, past de Commissie de procedure toe die is
      vastgelegd in artikel 11 van Verordening (EU) nr. 1025/2012, respectievelijk artikel
      20, lid 8, van deze verordening.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_44
  - number: '45'
    text: >-
      **Conforme binnen het toepassingsgebied van deze verordening vallende producten die
      een risico opleveren**


      1. Wanneer een lidstaat na uitvoering van een evaluatie overeenkomstig artikel 43, lid
      1, vaststelt dat een binnen het toepassingsgebied van deze verordening vallend product
      voldoet aan de essentiële gezondheids- en veiligheidseisen van bijlage III, maar toch
      een risico oplevert voor de gezondheid en veiligheid van personen en indien passend
      huisdieren of eigendommen, alsook in voorkomend geval voor het milieu, verlangt die
      lidstaat van de desbetreffende marktdeelnemer dat deze alle passende maatregelen neemt
      om ervoor te zorgen dat het product dat risico niet meer oplevert wanneer het in de
      handel wordt gebracht of dat dat product binnen een redelijke termijn die evenredig
      is met de aard van het risico uit de handel wordt genomen of wordt teruggeroepen.


      2. De marktdeelnemer zorgt ervoor dat in de hele Unie alle passende corrigerende maatregelen
      worden getroffen met betrekking tot alle binnen het toepassingsgebied van deze verordening
      vallende betrokken producten die deze marktdeelnemer op de markt heeft aangeboden.


      3. De lidstaat stelt de Commissie en de andere lidstaten onmiddellijk in kennis van
      het product dat een risico oplevert, als bedoeld in lid 1. Die informatie omvat alle
      bekende bijzonderheden, met name de gegevens die nodig zijn om het betrokken product
      te identificeren en om de oorsprong en de toeleveringsketen van dat product, de aard
      van het risico en de aard en de duur van de genomen nationale maatregelen vast te stellen.


      4. De Commissie treedt onverwijld in overleg met de lidstaten en de betrokken marktdeelnemer
      of marktdeelnemers, en beoordeelt de genomen nationale maatregelen. Op grond van de
      resultaten van die evaluatie stelt de Commissie een uitvoeringshandeling vast in de
      vorm van een besluit waarin wordt bepaald of de nationale maatregel al dan niet gerechtvaardigd
      is en waarin zo nodig passende maatregelen worden gelast. Die uitvoeringshandeling wordt
      volgens de in artikel 48, lid 3, bedoelde onderzoeksprocedure vastgesteld. Om naar behoren
      gemotiveerde dwingende redenen van urgentie die verband houden met de bescherming van
      de gezondheid en veiligheid van personen stelt de Commissie volgens de in artikel 48,
      lid 4, bedoelde procedure een onmiddellijk toepasselijke uitvoeringshandeling vast.


      5. De Commissie richt haar beschikking tot alle lidstaten en brengt de lidstaten en
      de betrokken marktdeelnemer of marktdeelnemers er onmiddellijk van op de hoogte.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_45
  - number: '46'
    text: >-
      **Formele niet-conformiteit**


      1. Onverminderd artikel 43 verlangt een lidstaat, indien hij met betrekking tot een
      machine of een verwant product een van de volgende feiten vaststelt, van de betrokken
      marktdeelnemer dat deze een einde maakt aan de niet-conformiteit: a) de CE-markering
      is in strijd met artikel 30 van Verordening (EG) nr. 765/2008 of met artikel 24 van
      de onderhavige verordening aangebracht; b) de CE-markering is niet aangebracht; c) het
      identificatienummer van de aangemelde instantie die is betrokken bij de productiecontrolefase
      is niet volgens de voorschriften van artikel 24, lid 3, aangebracht of is niet aangebracht;
      d) de EU-conformiteitsverklaring is niet of niet correct opgesteld; e) de technische
      documentatie is niet beschikbaar of is onvolledig; f) de gegevens als bedoeld in artikel
      10, lid 6, of artikel 13, lid 3, ontbreken, zijn onjuist of zijn onvolledig; g) er wordt
      niet voldaan aan een ander administratief voorschrift van artikel 10 of artikel 13.


      2. Onverminderd artikel 43 verlangt een lidstaat, indien hij met betrekking tot een
      niet voltooide machine een van de volgende feiten vaststelt, van de betrokken marktdeelnemer
      dat deze een einde maakt aan de niet-conformiteit: a) de EU-inbouwverklaring is niet
      of niet correct opgesteld; b) de technische documentatie is niet beschikbaar of is onvolledig;
      c) de gegevens als bedoeld in artikel 11, lid 5, of artikel 14, lid 3, ontbreken, zijn
      onjuist of zijn onvolledig; d) er wordt niet voldaan aan een ander administratief voorschrift
      van artikel 11 of artikel 14.


      3. Wanneer de in de leden 1 en 2 bedoelde niet-conformiteit voortduurt, neemt de betrokken
      lidstaat alle passende maatregelen om het op de markt aanbieden van het betrokken binnen
      het toepassingsgebied van deze verordening vallende product te beperken of te verbieden,
      of het product terug te roepen of uit de handel te nemen.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_46
  - number: '47'
    text: >-
      **Uitoefening van de bevoegdheidsdelegatie**


      1. De bevoegdheid om gedelegeerde handelingen vast te stellen, wordt aan de Commissie
      toegekend onder de in dit artikel neergelegde voorwaarden.


      2. De in artikel 6, lid 2, artikel 6, lid 11, en artikel 7, lid 2, bedoelde bevoegdheid
      om gedelegeerde handelingen vast te stellen, wordt aan de Commissie toegekend voor een
      termijn van vijf jaar, met ingang van 13 juli 2023. De Commissie stelt uiterlijk negen
      maanden voor het einde van de termijn van vijf jaar een verslag op over de bevoegdheidsdelegatie.
      De bevoegdheidsdelegatie wordt stilzwijgend met termijnen van dezelfde duur verlengd,
      tenzij het Europees Parlement of de Raad zich uiterlijk drie maanden voor het einde
      van elke termijn tegen deze verlenging verzet.


      3. Het Europees Parlement of de Raad kan de in artikel 6, lid 2, artikel 6, lid 11,
      en artikel 7, lid 2, bedoelde bevoegdheidsdelegatie te allen tijde intrekken. Het besluit
      tot intrekking beëindigt de delegatie van de in dat besluit genoemde bevoegdheid. Het
      wordt van kracht op de dag na die van de bekendmaking ervan in het Publicatieblad van
      de Europese Unie of op een daarin genoemde latere datum. Het laat de geldigheid van
      de reeds van kracht zijnde gedelegeerde handelingen onverlet.


      4. Vóór de vaststelling van een gedelegeerde handeling raadpleegt de Commissie de door
      elke lidstaat aangewezen deskundigen overeenkomstig de beginselen die zijn neergelegd
      in het Interinstitutioneel Akkoord van 13 april 2016 over beter wetgeven.


      5. Zodra de Commissie een gedelegeerde handeling heeft vastgesteld, doet zij daarvan
      gelijktijdig kennisgeving aan het Europees Parlement en de Raad.


      6. Een overeenkomstig artikel 6, lid 2, artikel 6, lid 11, of artikel 7, lid 2, vastgestelde
      gedelegeerde handeling treedt alleen in werking indien het Europees Parlement noch de
      Raad daartegen binnen een termijn van twee maanden na de kennisgeving van de handeling
      aan het Europees Parlement en de Raad bezwaar heeft gemaakt, of indien zowel het Europees
      Parlement als de Raad voor het verstrijken van die termijn de Commissie hebben meegedeeld
      dat zij daartegen geen bezwaar zullen maken. Die termijn wordt op initiatief van het
      Europees Parlement of de Raad met twee maanden verlengd.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_47
  - number: '48'
    text: >-
      **Comitéprocedure**


      1. De Commissie wordt bijgestaan door een comité. Dat comité is een comité in de zin
      van Verordening (EU) nr. 182/2011.


      2. Wanneer naar dit lid wordt verwezen, is artikel 4 van Verordening (EU) nr. 182/2011
      van toepassing.


      3. Wanneer naar dit lid wordt verwezen, is artikel 5 van Verordening (EU) nr. 182/2011
      van toepassing. Indien het comité geen advies uitbrengt inzake de in artikel 20, lid
      3, bedoelde ontwerpuitvoeringshandeling, is artikel 5, lid 4, derde alinea, van Verordening
      (EU) nr. 182/2011 van toepassing.


      4. Wanneer naar dit lid wordt verwezen, is artikel 8 van Verordening (EU) nr. 182/2011,
      in samenhang met artikel 5 van die verordening, van toepassing.


      5. Het comité wordt door de Commissie geraadpleegd over elke aangelegenheid waarvoor
      krachtens Verordening (EU) nr. 1025/2012 of een andere rechtshandeling van de Unie raadpleging
      van deskundigen uit de sector vereist is. Het comité kan voorts overeenkomstig zijn
      reglement van orde elke kwestie in verband met de toepassing van deze verordening onderzoeken
      die door zijn voorzitter of door een vertegenwoordiger van een lidstaat aan de orde
      wordt gesteld.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_48
  - number: '49'
    text: >-
      **Vertrouwelijkheid**


      1. Alle partijen eerbiedigen de vertrouwelijkheid van de volgende bij het uitvoeren
      van hun taken overeenkomstig deze verordening verkregen informatie en gegevens: a) persoonsgegevens;
      b) commercieel vertrouwelijke informatie en bedrijfsgeheimen van een natuurlijke of
      rechtspersoon, waaronder intellectuele eigendomsrechten, tenzij openbaarmaking daarvan
      in het algemeen belang is.


      2. Onverminderd lid 1 wordt informatie die op basis van vertrouwelijkheid tussen bevoegde
      nationale autoriteiten onderling en tussen de bevoegde autoriteiten en de Commissie
      wordt uitgewisseld niet openbaar gemaakt zonder voorafgaande toestemming van de bevoegde
      nationale autoriteit waarvan die informatie afkomstig is.


      3. De leden 1 en 2 laten de rechten en verplichtingen van de Commissie, de lidstaten
      en de aangemelde instanties met betrekking tot de uitwisseling van informatie en de
      verspreiding van waarschuwingen, alsook de verplichtingen van de betrokken personen
      om in het kader van het strafrecht informatie te verstrekken, onverlet.


      4. De Commissie en de lidstaten mogen vertrouwelijke informatie uitwisselen met regelgevende
      autoriteiten van derde landen waarmee zij bilaterale of multilaterale vertrouwelijkheidsovereenkomsten
      en -regelingen hebben gesloten, indien die overeenkomsten en regelingen waarborgen dat
      de uitwisseling van informatie overeenkomstig het toepasselijke Unierecht gebeurt.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_49
  - number: '50'
    text: >-
      **Sancties**


      1. De lidstaten stellen voorschriften vast ten aanzien van de sancties die van toepassing
      zijn op overtredingen van deze verordening door marktdeelnemers, en nemen alle nodige
      maatregelen om ervoor te zorgen dat deze sancties worden toegepast. De sancties moeten
      doeltreffend, evenredig en afschrikkend zijn, en kunnen in het geval van ernstige overtredingen
      strafrechtelijke sancties omvatten.


      2. De lidstaten stellen de Commissie uiterlijk op 14 oktober 2026 van die voorschriften
      en maatregelen in kennis en delen haar onverwijld alle latere wijzigingen daarvan mee.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_50
  - number: '51'
    text: >-
      **Intrekkingen**


      1. Richtlijn 73/361/EEG wordt ingetrokken. Verwijzingen naar de ingetrokken Richtlijn
      73/361/EEG gelden als verwijzingen naar deze verordening.


      2. Richtlijn 2006/42/EG wordt met ingang van 14 januari 2027 ingetrokken. Verwijzingen
      naar de ingetrokken Richtlijn 2006/42/EG gelden als verwijzingen naar deze verordening
      en worden gelezen volgens de concordantietabel in bijlage XII.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_51
  - number: '52'
    text: >-
      **Overgangsbepalingen**


      1. De lidstaten belemmeren niet dat producten die vóór 14 januari 2027 overeenkomstig
      Richtlijn 2006/42/EG in de handel zijn gebracht, op de markt worden aangeboden. Hoofdstuk
      VI van deze verordening is echter met ingang van 13 juli 2023 in plaats van artikel
      11 van Richtlijn 2006/42/EG van overeenkomstige toepassing op dergelijke producten,
      met inbegrip van producten waarvoor al een procedure overeenkomstig dat artikel is ingeleid.


      2. Certificaten van EG-typeonderzoek en goedkeuringsbesluiten die overeenkomstig artikel
      12 van Richtlijn 2006/42/EG zijn afgegeven, blijven geldig totdat zij verstrijken.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_52
  - number: '53'
    text: >-
      **Evaluatie en herziening**


      1. Uiterlijk op 14 juli 2028 en daarna om de vier jaar, dient de Commissie bij het Europees
      Parlement en de Raad een verslag in over de evaluatie en herziening van deze verordening.
      De verslagen worden openbaar gemaakt.


      2. Met inachtneming van de technische vooruitgang en de in de lidstaten opgedane ervaring
      als bedoeld in artikel 6, neemt de Commissie in haar verslag een evaluatie op van de
      volgende aspecten van deze verordening: a) de essentiële gezondheids- en veiligheidseisen
      van bijlage III; b) de conformiteitsbeoordelingsprocedure voor in bijlage I opgenomen
      machines en verwante producten. Indien nodig gaat het verslag vergezeld van een wetgevingsvoorstel
      tot wijziging van de desbetreffende bepalingen van deze verordening.


      3. Uiterlijk op 14 juli 2026 en daarna om de vijf jaar dient de Commissie bij het Europees
      Parlement en de Raad een verslag in dat specifiek de beoordeling van artikel 6, leden
      4 en 5, van deze verordening betreft. De verslagen worden openbaar gemaakt. De Commissie
      neemt in haar verslagen de volgende elementen op: a) een samenvatting van de gegevens
      en informatie die de lidstaten overeenkomstig artikel 6, lid 5, tijdens de verslagperiode
      hebben verstrekt; b) een beoordeling van de lijst van categorieën van machines en verwante
      producten in bijlage I, in het licht van de criteria van artikel 6, lid 4. In de verslagen
      gaat de Commissie na of de door de lidstaten verstrekte gegevens en informatie beschikbaar
      en adequaat zijn, onder andere wat betreft de toereikendheid en geschiktheid ervan voor
      het maken van vergelijkingen, en stelt zij de eventuele tekortkomingen vast die een
      doeltreffende werking en handhaving van artikel 6 in de weg staan.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_53
  - number: '54'
    text: >-
      **Inwerkingtreding en toepassing**


      Deze verordening treedt in werking op de twintigste dag na die van de bekendmaking ervan
      in het Publicatieblad van de Europese Unie . Zij is van toepassing met ingang van 14
      januari 2027. De volgende artikelen zijn evenwel van toepassing met ingang van de volgende
      data: a) de artikelen 26 tot en met 42 met ingang van 14 januari 2024; b) artikel 50,
      lid 1, met ingang van 14 oktober 2023; c) artikel 6, lid 7, en de artikelen 48 en 52
      met ingang van 13 juli 2023; d) artikel 6, leden 2 tot en met 6, lid 8 en lid 11, artikel
      47 en artikel 53, lid 3, met ingang van 14 juli 2024. Deze verordening is verbindend
      in al haar onderdelen en is rechtstreeks toepasselijk in elke lidstaat.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230#art_54
    machine_readable:
      declares:
        - property: valid_from
          value: '2027-01-14'
      markings:
        - about: de artikelen die met ingang van een eerdere datum van toepassing zijn
          reason: >-
            Artikel 54 geeft vier groepen bepalingen een eigen datum van toepassing, die vóór
            de algemene datum van 14 januari 2027 ligt. Het model kent één valid_from per
            document: een bepaling in dit bestand geldt vanaf de datum van het bestand, en
            niet eerder.
          resolution: model
          resolved_by: >-
            Een datum van toepassing per bepaling, naast die van het document, die de engine
            bij de peildatum weegt.
          target: []
          legal_text_excerpt: >-
            De volgende artikelen zijn evenwel van toepassing met ingang van de volgende data
          accepted: false
  - number: bijlage I.A
    text: >-
      CATEGORIEËN VAN MACHINES EN VERWANTE PRODUCTEN WAARVOOR EEN VAN DE IN ARTIKEL 25, LEDEN
      2 EN 3, BEDOELDE PROCEDURES MOET WORDEN GEVOLGD


      DEEL A Categorieën machines en verwante producten waarvoor een procedure als bedoeld
      in artikel 25, lid 2, moet worden gevolgd 1. Verwijderbare mechanische overbrengingssystemen,
      inclusief hun afschermingen. 2. Afschermingen voor verwijderbare mechanische overbrengingssystemen.
      3. Hefbruggen voor voertuigen. 4. Draagbare bevestigingswerktuigen met explosieve lading
      en andere slagwerktuigen. 5. Veiligheidscomponenten met volledig of gedeeltelijk zelfontwikkelend
      gedrag waarbij wordt gebruikgemaakt van methoden op basis van machinaal leren die veiligheidsfuncties
      waarborgen. 6. Machines met geïntegreerde, niet onafhankelijk in de handel gebrachte
      systemen met volledig of gedeeltelijk zelfontwikkelend gedrag waarbij wordt gebruikgemaakt
      van methoden op basis van machinaal leren die veiligheidsfuncties waarborgen, enkel
      met betrekking tot die systemen.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230
    machine_readable:
      markings:
        - about: enkel met betrekking tot die systemen
          reason: >-
            Punt 6 van deel A legt de procedure van artikel 25, lid 2, alleen op voor de geïntegreerde
            systemen met zelfontwikkelend gedrag, en niet voor de rest van de machine. Het
            model kent de indeling in een categorie alleen voor het product als geheel: één
            waarde per product, zonder een deel van het product waarvoor een andere procedure
            geldt.
          resolution: model
          resolved_by: >-
            Een vorm waarin een product uit onderdelen bestaat die elk hun eigen conformiteitsbeoordelingsprocedure
            kunnen hebben.
          target: []
          legal_text_excerpt: enkel met betrekking tot die systemen
          accepted: false
      execution:
        parameters:
          - name: categorie_bijlage_i
            type: string
            required: true
            description: >-
              Het punt van bijlage I waaronder de categorie van de machine of het verwante
              product valt, als "A.<punt>" of "B.<punt>" (bijvoorbeeld "A.3" of "B.1.2"),
              of "geen" als de categorie niet in bijlage I is opgenomen. Een andere waarde
              is geen categorie van bijlage I en leidt in artikel 25 tot geen uitkomst. Welke
              categorie het is, stelt de fabrikant vast aan de hand van het product; de verordening
              geeft daar geen rekenregel voor. De punten 1, 4 en 12 van deel B zijn zelf geen
              categorie, alleen hun subpunten ("B.1.1", "B.4.2", "B.12.1").
        output:
          - name: in_bijlage_i_deel_a
            type: boolean
            description: De categorie is opgenomen in bijlage I, deel A.
        actions:
          - output: in_bijlage_i_deel_a
            value:
              operation: IN
              subject: $categorie_bijlage_i
              values:
                - A.1
                - A.2
                - A.3
                - A.4
                - A.5
                - A.6
            legal_basis:
              law: Verordening (EU) 2023/1230
              article: bijlage I, deel A
              explanation: >-
                Deel A somt in de punten 1 tot en met 6 de categorieën op waarvoor een procedure
                als bedoeld in artikel 25, lid 2, moet worden gevolgd.
  - number: bijlage I.B
    text: >-
      DEEL B Categorieën van machines of verwante producten waarvoor een van de in artikel
      25, lid 3, bedoelde procedures moet worden gevolgd 1. De volgende types cirkelzagen
      (eenbladig of meerbladig) voor de bewerking van hout en materialen met gelijkaardige
      fysieke eigenschappen of voor de bewerking van vlees en materiaal met gelijkaardige
      fysieke eigenschappen: 1.1. zaagmachines waarvan het zaagblad (de zaagbladen) zich tijdens
      het zagen in een vaste stand bevindt (bevinden), voorzien van een vast tafelblad of
      vaste werkstukdrager en met manuele toevoer van het werkstuk of met verwijderbare meenemer;
      1.2. zaagmachines waarvan het zaagblad (de zaagbladen) zich tijdens het zagen in een
      vaste stand bevindt (bevinden), voorzien van een tafelzaagbok of een heen en weer gaande
      slede die met de hand wordt verplaatst; 1.3. zaagmachines waarvan het zaagblad (de zaagbladen)
      zich tijdens het zagen in een vaste stand bevindt (bevinden) en die bij de constructie
      zijn uitgerust met een geïntegreerde voedingsinrichting voor de te zagen werkstukken,
      waarbij het materiaal met de hand wordt toegevoerd en/of afgevoerd; 1.4. zaagmachines
      waarvan het zaagblad (de zaagbladen) tijdens het zagen beweegbaar is (zijn), uitgerust
      met een mechanisch beweegbaar blad, waarbij het materiaal met de hand wordt toegevoerd
      en/of afgevoerd. 2. Vlakschaafmachines met handmatige toevoer voor houtbewerking. 3.
      Eenzijdige schaafmachines met geïntegreerde voeding, met handmatige toevoer en/of afvoer
      voor houtbewerking. 4. De volgende types lintzagen, met handmatige toevoer en/of afvoer
      voor de bewerking van hout en materialen met gelijkaardige fysieke eigenschappen of
      voor de bewerking van vlees en materialen met gelijkaardige fysieke eigenschappen: 4.1.
      zaagmachines waarvan het zaagblad (de zaagbladen) zich tijdens het zagen in een vaste
      stand bevindt (bevinden), voorzien van een vast(e) of heen en weer gaand(e) tafelblad
      of werkstukdrager; 4.2. zaagmachines waarvan het zaagblad op een heen en weer gaande
      slede is gemonteerd. 5. Gecombineerde machines van de in de punten 1 tot en met 4 en
      7 bedoelde typen voor de bewerking van hout en materialen met gelijkaardige fysieke
      eigenschappen. 6. Pennenbanken met verschillende spillen met handmatige toevoer voor
      houtbewerking. 7. Freesmachines met verticale as, met handmatige toevoer, voor de bewerking
      van hout en materialen met gelijkaardige fysieke eigenschappen. 8. Draagbare kettingzaagmachines
      voor houtbewerking. 9. Persen, met inbegrip van buigmachines, voor koude metaalbewerking,
      waarbij het materiaal met de hand wordt toegevoerd en/of afgevoerd en de beweegbare
      werktuigen een slaglengte kunnen hebben van meer dan 6 mm en een snelheid van meer dan
      30 mm/s. 10. Machines voor het spuitgieten en persen van kunststoffen met handmatige
      toevoer of afvoer van het materiaal. 11. Machines voor het spuitgieten en persen van
      rubber met handmatige toevoer of afvoer van het materiaal. 12. De volgende types machines
      voor ondergrondse werkzaamheden: 12.1. locomotieven en remwagens; 12.2. hydraulische
      wandelondersteuningen. 13. Met de hand geladen vuilniswagens met perssysteem. 14. Hijs-
      en hefwerktuigen voor het heffen van personen of van personen en goederen waarbij een
      gevaar voor een vrije val van meer dan drie meter bestaat. 15. Beveiligingsinrichtingen
      voor de detectie van personen. 16. Aangedreven beweegbare afschermingen met vergrendeling
      die bestemd zijn om te worden gebruikt voor de beveiliging van de in de punten 9, 10
      en 11 van dit deel bedoelde machines. 17. Logische eenheden ter verzekering van veiligheidsfuncties.
      18. Kantelbeveiligingsinrichtingen (ROPS). 19. Constructies ter bescherming tegen vallende
      voorwerpen (FOPS).
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230
