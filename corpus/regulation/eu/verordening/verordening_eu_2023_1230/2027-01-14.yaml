  - number: bijlage IV
    text: >-
      Technische documentatie DEEL A Technische documentatie voor machines en verwante producten
      De technische documentatie moet de middelen specificeren die de fabrikant heeft gebruikt
      om ervoor te zorgen dat de machine of het verwante product voldoet aan de in bijlage
      III vastgestelde toepasselijke essentiële gezondheids- en veiligheidseisen. De technische
      documentatie moet minimaal de volgende elementen omvatten: a) een volledige beschrijving
      van de machine of het verwante product en van het beoogde gebruik ervan; b) de documentatie
      over de risicobeoordeling waaruit de gevolgde procedure blijkt, met inbegrip van de
      volgende gegevens: i) een lijst van de essentiële gezondheids- en veiligheidseisen die
      op de machine of het verwante product van toepassing zijn; ii) de beschrijving van de
      beschermende maatregelen die zijn uitgevoerd om aan alle toepasselijke gezondheids-
      en veiligheidseisen te voldoen en, in voorkomend geval, informatie over de restrisico’s
      in verband met de machine of het verwante product; c) ontwerp- en fabricagetekeningen,
      alsmede schema’s van de machine of het verwante product en van de onderdelen, subassemblages
      en circuits; d) de beschrijvingen en toelichtingen die nodig zijn voor het begrijpen
      van de in punt c) bedoelde tekeningen en schema’s en van de werking van de machine of
      het verwante product; e) de referenties van de geharmoniseerde normen als bedoeld in
      artikel 20, lid 1, of de door de Commissie overeenkomstig artikel 20, lid 3, vastgestelde
      gemeenschappelijke technische specificaties die zijn toegepast bij het ontwerp en de
      vervaardiging van de machine of het verwante product. Bij gedeeltelijk toegepaste geharmoniseerde
      normen of gemeenschappelijke specificaties moet in de technische documentatie worden
      gespecificeerd welke delen zijn toegepast; f) wanneer geharmoniseerde normen of gemeenschappelijke
      specificaties niet of slechts gedeeltelijk zijn toegepast, een beschrijving van de andere
      technische specificaties die zijn toegepast om te voldoen aan alle toepasselijke essentiële
      gezondheids- en veiligheidseisen; g) rapporten en/of resultaten van de ontwerpberekeningen,
      tests, inspecties en onderzoeken die zijn uitgevoerd om de overeenstemming van de machine
      of het verwante product met de toepasselijke essentiële gezondheids- en veiligheidseisen
      te controleren; h) een beschrijving van de middelen die de fabrikant bij de productie
      van de machine of het verwante product heeft gebruikt om de overeenstemming van de machine
      of het verwante product met de ontwerpspecificaties te garanderen; i) een kopie van
      de in punt 1.7.4 van bijlage III vermelde gebruiksaanwijzing en gegevens; j) in voorkomend
      geval, de EU-inbouwverklaring betreffende niet voltooide machines als vastgesteld in
      bijlage V, deel B, en de montagehandleiding als beschreven in bijlage XI; k) in voorkomend
      geval, kopieën van de EU-conformiteitsverklaringen van de machines of verwante producten,
      alsmede van alle producten die vallen onder andere harmonisatiewetgeving van de Unie
      en die in de machine of het verwante product zijn verwerkt; l) in geval van in serie
      vervaardigde machines of verwante producten, de interne bepalingen die zullen worden
      toegepast ter waarborging dat de machine of het verwante product in overeenstemming
      met deze verordening blijft; m) de broncode of de programmeerlogica van de veiligheidssoftware
      om de overeenstemming van de machine of het verwante product met deze verordening aan
      te tonen, indien een bevoegde nationale autoriteit die nodig heeft om de overeenstemming
      met de essentiële gezondheids- en veiligheidseisen van bijlage III te controleren en
      zij daar een met redenen omkleed verzoek toe doet; n) voor met sensoren gevoede, op
      afstand aangedreven of autonome machines of verwante producten, indien de veiligheidsgerelateerde
      handelingen worden gestuurd door sensorgegevens, een beschrijving, in voorkomend geval,
      van de algemene kenmerken, mogelijkheden en beperkingen van het systeem, de gegevens
      en de ontwikkelings-, test- en valideringsprocessen die zijn gebruikt; o) de resultaten
      van onderzoek en tests met betrekking tot de componenten, het toebehoren of de machine
      of het verwante product die de fabrikant heeft uitgevoerd om vast te stellen of deze/dit
      qua ontwerp en bouw veilig gemonteerd en in bedrijf gesteld kan worden. DEEL B Technische
      documentatie voor niet voltooide machines De technische documentatie moet de middelen
      specificeren die de fabrikant heeft gebruikt om ervoor te zorgen dat de niet voltooide
      machine voldoet aan de in bijlage III vastgestelde relevante essentiële gezondheids-
      en veiligheidseisen. De technische documentatie moet minimaal de volgende elementen
      omvatten: a) een volledige beschrijving van de niet voltooide machine en van de beoogde
      functie indien die is ingebouwd in of gekoppeld aan andere niet voltooide machines of
      uitrusting; b) de documentatie over de risicobeoordeling waaruit de uitgevoerde procedure
      blijkt, met inbegrip van de volgende gegevens: i) een lijst van de essentiële gezondheids-
      en veiligheidseisen die op de niet voltooide machine van toepassing zijn; ii) de beschrijving
      van de beschermingsmaatregelen die zijn toegepast om vastgestelde gevaren weg te nemen
      of onderkende risico’s te verminderen en, in voorkomend geval, informatie over de restrisico’s;
      c) ontwerp- en fabricagetekeningen, alsmede schema’s van de niet voltooide machine en
      van de onderdelen, subassemblages en circuits; d) de beschrijvingen en toelichtingen
      die nodig zijn voor het begrijpen van de in punt c) bedoelde tekeningen en schema’s
      en van de werking van de niet voltooide machine; e) de referenties van de geharmoniseerde
      normen als bedoeld in artikel 20, lid 1, of de door de Commissie overeenkomstig artikel
      20, lid 3, vastgestelde gemeenschappelijke specificaties die zijn toegepast bij het
      ontwerp en de vervaardiging van de niet voltooide machine. Bij gedeeltelijk toegepaste
      geharmoniseerde normen of gemeenschappelijke specificaties moet in de technische documentatie
      worden gespecificeerd welke delen zijn toegepast; f) wanneer geharmoniseerde normen
      of gemeenschappelijke specificaties niet of slechts gedeeltelijk zijn toegepast, een
      beschrijving van de andere technische specificaties die zijn toegepast om te voldoen
      aan alle toepasselijke essentiële gezondheids- en veiligheidseisen; g) rapporten en/of
      resultaten van de ontwerpberekeningen, tests, inspecties en onderzoeken die zijn uitgevoerd
      om de overeenstemming van de niet voltooide machine met de toepasselijke essentiële
      gezondheids- en veiligheidseisen te controleren; h) een beschrijving van de middelen
      die de fabrikant bij de productie van de niet voltooide machine heeft gebruikt om de
      overeenstemming van de niet voltooide machine met de ontwerpspecificaties te garanderen;
      i) een kopie van de in bijlage XI vermelde montagehandleiding voor de niet voltooide
      machine; j) in geval van in serie vervaardigde niet voltooide machines, de interne bepalingen
      die worden toegepast om de overeenstemming van de niet voltooide machines met de toepasselijke
      essentiële gezondheids- en veiligheidseisen te handhaven; k) de broncode of de programmeringslogica
      van de veiligheidssoftware, indien een bevoegde nationale autoriteit die nodig heeft
      om de overeenstemming met de essentiële gezondheids- en veiligheidseisen van bijlage
      III te controleren en zij daar een met redenen omkleed verzoek toe doet; l) voor met
      sensoren gevoede, op afstand aangedreven of autonome niet voltooide machines, indien
      de veiligheidsgerelateerde handelingen worden gestuurd door sensorgegevens, een beschrijving,
      in voorkomend geval, van de algemene kenmerken, mogelijkheden en beperkingen van het
      systeem, de gegevens en de ontwikkelings-, test- en valideringsprocessen die zijn gebruikt;
      m) de resultaten van onderzoek en tests met betrekking tot de componenten, het toebehoren
      of de niet voltooide machine die de fabrikant heeft uitgevoerd om vast te stellen of
      deze qua ontwerp en bouw veilig gemonteerd en ingebouwd kan worden.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230
  - number: bijlage V
    text: >-
      EU-CONFORMITEITSVERKLARING EN EU-INBOUWVERKLARING DEEL A EU-conformiteitsverklaring
      van machines en verwante producten nr. … De EU-conformiteitsverklaring moet de onderstaande
      informatie bevatten: 1. De machine of het verwante product (product, type, model, partij
      of serienummer) of de substantieel gewijzigde machine of het verwante product. 2. Naam
      en adres van de fabrikant en, indien van toepassing, de gemachtigde van de fabrikant.
      3. Voor hijs- of hefmachines die bestemd zijn om permanent in een gebouw of een constructie
      te worden geïnstalleerd en die niet in de bedrijfsruimten van de fabrikant maar alleen
      op de plaats van gebruik kunnen worden gemonteerd, het adres van die plaats. 4. Deze
      conformiteitsverklaring wordt op geheel eigen verantwoording van de fabrikant verstrekt.
      5. Voorwerp van de verklaring (beschrijving aan de hand waarvan de machine of het verwante
      product kan worden getraceerd; deze kan, indien nodig voor de identificatie van de machine
      of het verwante product, een voldoende duidelijke afbeelding in kleur omvatten). 6.
      Het in punt 5 bedoelde voorwerp van de verklaring is in overeenstemming met de volgende
      harmonisatiewetgeving van de Unie. 7. Referentiegegevens van de in artikel 20, lid 1,
      bedoelde geharmoniseerde normen of de door de Commissie overeenkomstig artikel 20, lid
      3, vastgestelde gemeenschappelijke specificaties die werden toegepast, met vermelding
      van de datum van de bekendmaking van de referentie van geharmoniseerde normen in het
      Publicatieblad van de Europese Unie of van de gemeenschappelijke specificatie, of andere
      technische specificaties waarop de conformiteitsverklaring betrekking heeft, met vermelding
      van de datum van de desbetreffende specificatie. Bij gedeeltelijk toegepaste geharmoniseerde
      normen of gemeenschappelijke specificaties moet in de EU-conformiteitsverklaring worden
      gespecificeerd welke delen werden toegepast. 8. Indien van toepassing: “De aangemelde
      instantie … (naam, nummer) … heeft het EU-typeonderzoek (module B) verricht en het certificaat
      van EU-typeonderzoek … (verwijzing naar dat certificaat) afgegeven, gevolgd door conformiteit
      met het type op basis van interne productiecontrole (module C) of conformiteit op basis
      van eenheidskeuring (module G) of volledige kwaliteitsborging (module H)”. 9. Indien
      van toepassing: “De machine of het verwante product is onderworpen aan de conformiteitsbeoordelingsprocedure
      op basis van interne productiecontrole (module A)”. 10. Aanvullende informatie: Ondertekend
      voor en namens: … (plaats en datum van afgifte): (naam, functie) (handtekening): DEEL
      B EU-inbouwverklaring betreffende niet voltooide machines nr. … De inbouwverklaring
      bevat de volgende gegevens: 1. Niet voltooide machine (product, type, model, partij
      of serienummer). 2. Naam en adres van de fabrikant en, indien van toepassing, de gemachtigde
      van de fabrikant. 3. Deze inbouwverklaring wordt op geheel eigen verantwoording van
      de fabrikant verstrekt. 4. Voorwerp van de verklaring (beschrijving aan de hand waarvan
      de niet voltooide machine kan worden getraceerd: deze kan, indien nodig voor de identificatie
      van de niet voltooide machine, een voldoende duidelijke afbeelding in kleur omvatten).
      5. Een zin om te verklaren welke essentiële gezondheids- en veiligheidseisen van bijlage
      III bij Verordening (EU) 2023/1230 van het Europees Parlement en de Raad toegepast en
      vervuld zijn, waarin wordt vermeld dat de relevante technische documenten overeenkomstig
      bijlage IV, deel B, zijn opgesteld, alsmede in voorkomend geval een conformiteitsverklaring
      van de niet voltooide machine met andere toepasselijke harmonisatiewetgeving van de
      Unie. 6. Referentiegegevens van de in artikel 20, lid 1, bedoelde geharmoniseerde normen
      of de door de Commissie overeenkomstig artikel 20, lid 3, vastgestelde gemeenschappelijke
      specificaties die werden toegepast, met vermelding van de datum van de norm of gemeenschappelijke
      specificatie, of andere technische specificaties waarop de conformiteitsverklaring betrekking
      heeft, met vermelding van de datum van de desbetreffende specificatie. Bij gedeeltelijk
      toegepaste geharmoniseerde normen of gemeenschappelijke specificaties moet in de EU-inbouwverklaring
      worden gespecificeerd welke delen werden toegepast. 7. Een verbintenis om de relevante
      informatie over deze niet voltooide machine door te geven indien de nationale autoriteiten
      daar een met redenen omkleed verzoek toe doen. Deze verbintenis moet ook een vermelding
      bevatten van de wijze van doorgifte en moet de intellectuele-eigendomsrechten van de
      fabrikant van de niet voltooide machine onverlet laten. 8. Een verklaring dat de niet
      voltooide machine niet in bedrijf mag worden gesteld totdat de afgewerkte machine waarin
      zij zal worden ingebouwd, in overeenstemming met deze verordening is verklaard. 9. Aanvullende
      informatie: Ondertekend voor en namens: … (plaats en datum van afgifte): (naam, functie)
      (handtekening):
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230
  - number: bijlage VI
    text: >-
      INTERNE PRODUCTIECONTROLE (Module A) 1. Met “interne productiecontrole” wordt de conformiteitsbeoordelingsprocedure
      bedoeld waarbij de fabrikant de verplichtingen in de punten 2, 3 en 4 nakomt en op geheel
      eigen verantwoording garandeert en verklaart dat de machine of het verwante product
      in kwestie voldoet aan de toepasselijke eisen van deze verordening. 2. Technische documentatie
      De fabrikant moet de technische documentatie opstellen die is beschreven in bijlage
      IV, deel A. 3. Fabricage De fabrikant moet alle nodige maatregelen nemen om ervoor te
      zorgen dat het fabricage- en controleproces waarborgt dat de vervaardigde machine of
      het vervaardigde verwante product conform is met de in punt 2 bedoelde technische documentatie
      en met de toepasselijke eisen van deze verordening. 4. CE-markering en EU-conformiteitsverklaring
      4.1. De fabrikant moet de CE-markering aanbrengen op elke afzonderlijke eenheid van
      de machine of het verwante product die aan de toepasselijke eisen van deze verordening
      voldoet. 4.2. De fabrikant moet overeenkomstig artikel 21 voor elk model van machine
      of verwant product een EU-conformiteitsverklaring opstellen en moet deze verklaring,
      samen met de technische documentatie, tot ten minste tien jaar na het in de handel brengen
      of in bedrijf stellen van de machine of het verwante product ter beschikking houden
      van de nationale autoriteiten. In de EU-conformiteitsverklaring moet worden aangegeven
      op welk model van machine of verwant product de verklaring betrekking heeft. Een kopie
      van de EU-conformiteitsverklaring moet aan de bevoegde autoriteiten worden verstrekt
      indien zij daarom verzoeken. 5. Gemachtigde De in punt 4 vervatte verplichtingen van
      de fabrikant kunnen namens en onder de verantwoordelijkheid van de fabrikant worden
      vervuld door de gemachtigde van de fabrikant, op voorwaarde dat deze in het mandaat
      gespecificeerd zijn.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230
  - number: bijlage VII
    text: >-
      EU-TYPEONDERZOEK (Module B) 1. Met “EU-typeonderzoek” wordt dat gedeelte van een conformiteitsbeoordelingsprocedure
      bedoeld waarin de aangemelde instantie het technisch ontwerp van een machine of verwant
      product onderzoekt om te controleren of de machine of het verwante product aan de toepasselijke
      eisen van deze verordening voldoet, en zulks attesteert. 2. Het EU-typeonderzoek moet
      worden verricht door middel van een beoordeling van de geschiktheid van het technisch
      ontwerp van de machine of het verwante product via een onderzoek van de technische documentatie,
      plus een onderzoek van een voor de betrokken productie representatief monster van de
      machine of het verwante product (productietype). 3. Aanvraag voor het EU-typeonderzoek
      De fabrikant moet een aanvraag voor het EU-typeonderzoek indienen bij een aangemelde
      instantie van zijn of haar keuze. De aanvraag moet het volgende omvatten: a) naam en
      adres van de fabrikant en, indien de aanvraag door de gemachtigde van de fabrikant wordt
      ingediend, naam en adres van de gemachtigde; b) een schriftelijke verklaring dat dezelfde
      aanvraag niet is ingediend bij een andere aangemelde instantie; c) de technische documentatie
      zoals beschreven in bijlage IV, deel A; d) toegang tot de voor de geplande productie
      representatieve monsters van de machine of het verwante product. De aangemelde instantie
      kan meer exemplaren verlangen als dit voor het testprogramma nodig is. Voor machines
      en verwante producten die in serie zijn vervaardigd, waarbij elk exemplaar wordt aangepast
      aan een individuele gebruiker, moeten monsters worden verstrekt die representatief zijn
      voor het hele gamma van verschillende gebruikers, terwijl voor machines en verwante
      producten die individueel zijn vervaardigd om te voldoen aan de bijzondere behoeften
      van een individuele gebruiker, een basismodel moet worden verstrekt. 4. EU-typeonderzoek
      De aangemelde instantie moet de volgende handelingen verrichten: a) de technische documentatie
      onderzoeken om te beoordelen of het technisch ontwerp van de machine of het verwante
      product geschikt is. Bij dat onderzoek hoeft geen rekening te worden gehouden met bijlage
      IV, deel A, tweede alinea, punten h) en l); b) voor machines en verwante producten die
      in serie zijn vervaardigd, waarbij elk exemplaar wordt aangepast aan een individuele
      gebruiker, de beschrijving van de maatregelen onderzoeken om te beoordelen of zij toereikend
      zijn; c) controleren of de monsters in overeenstemming met de technische documentatie
      zijn vervaardigd en vaststellen welke elementen overeenkomstig de toepasselijke bepalingen
      van de relevante geharmoniseerde normen of de door de Commissie overeenkomstig artikel
      20, lid 3, vastgestelde gemeenschappelijke specificaties zijn ontworpen, alsook welke
      elementen zijn ontworpen overeenkomstig andere technische specificaties; d) de nodige
      onderzoeken en tests verrichten of laten verrichten om, wanneer de fabrikant ervoor
      heeft gekozen de oplossingen uit de desbetreffende geharmoniseerde normen of de gemeenschappelijke
      specificaties die de Commissie overeenkomstig artikel 20, lid 3, heeft vastgesteld,
      toe te passen, te controleren of deze op de juiste wijze zijn toegepast; e) de nodige
      onderzoeken en tests verrichten of laten verrichten om, ingeval de oplossingen uit de
      relevante geharmoniseerde normen of de door de Commissie overeenkomstig artikel 20,
      lid 3, vastgestelde gemeenschappelijke specificaties niet zijn toegepast, te controleren
      of de door de fabrikant gekozen oplossingen, met inbegrip van oplossingen uit andere
      technische specificaties, aan de desbetreffende essentiële gezondheids- en veiligheidseisen
      voldoen en correct zijn toegepast. 5. Evaluatieverslag De aangemelde instantie moet
      een evaluatieverslag opstellen over de overeenkomstig punt 4 verrichte activiteiten
      en de resultaten daarvan. Onverminderd haar verplichtingen jegens de aanmeldende autoriteiten,
      mag de aangemelde instantie de inhoud van dat verslag uitsluitend met instemming van
      de fabrikant geheel of gedeeltelijk openbaar maken. 6. Certificaat van EU-typeonderzoek
      6.1. Indien het type voldoet aan de toepasselijke essentiële gezondheids- en veiligheidseisen,
      moet de aangemelde instantie de fabrikant een certificaat van EU-typeonderzoek verstrekken.
      De geldigheidsduur van een nieuw certificaat en, in voorkomend geval, van een verlengd
      certificaat, mag niet meer dan vijf jaar bedragen. 6.2. In het certificaat van EU-typeonderzoek
      moeten ten minste de volgende gegevens worden opgenomen: a) naam, adres en identificatienummer
      van de aangemelde instantie; b) naam en adres van de fabrikant en, indien de aanvraag
      door de gemachtigde van de fabrikant wordt ingediend, naam en adres van de gemachtigde;
      c) identificatie van de machine of het verwante product waarop het certificaat betrekking
      heeft (typenummer); d) een verklaring dat het type machine of verwant product voldoet
      aan de toepasselijke essentiële gezondheids- en veiligheidseisen; e) als de geharmoniseerde
      normen of de door de Commissie overeenkomstig artikel 20, lid 3, vastgestelde gemeenschappelijke
      specificaties volledig of gedeeltelijk zijn toegepast, de referenties van die normen
      of gemeenschappelijke specificaties of delen daarvan; f) als andere technische specificaties
      zijn toegepast, de referenties van die technische specificaties; g) de datum van afgifte,
      de vervaldatum en, in voorkomend geval, de datum (data) van verlenging; h) alle voorwaarden
      die aan de afgifte van het certificaat verbonden zijn. 6.3. Het certificaat van EU-typeonderzoek
      kan vergezeld gaan van een of meer bijlagen. 6.4. Wanneer het type niet aan de toepasselijke
      essentiële gezondheids- en veiligheidseisen voldoet, weigert de aangemelde instantie
      een certificaat van EU-typeonderzoek te verstrekken en brengt zij de aanvrager hiervan
      op de hoogte met vermelding van de precieze redenen voor de weigering. 7. Evaluatie
      van het certificaat van EU-typeonderzoek 7.1. De aangemelde instantie moet zich op de
      hoogte houden van elke verandering in de algemeen erkende stand van de techniek; indien
      het goedgekeurde type vanwege deze veranderingen mogelijk niet langer aan de toepasselijke
      essentiële gezondheids- en veiligheidseisen voldoet, moet zij beoordelen of nader onderzoek
      nodig is. Als dit het geval is, brengt de aangemelde instantie de fabrikant daarvan
      op de hoogte. 7.2. De fabrikant moet de aangemelde instantie die de technische documentatie
      betreffende het certificaat van EU-typeonderzoek bewaart, op de hoogte brengen van elke
      wijziging van het goedgekeurde type en van elke wijziging van de technische documentatie
      die van invloed kunnen zijn op de conformiteit van de machine of het verwante product
      met de toepasselijke essentiële gezondheids- en veiligheidseisen of de voorwaarden voor
      de geldigheid van dat certificaat. Dergelijke wijzigingen vereisen een aanvullende goedkeuring
      in de vorm van een aanvulling op het oorspronkelijke certificaat van EU-typeonderzoek.
      7.3. De fabrikant moet ervoor zorgen dat de machine of het verwante product blijft voldoen
      aan de toepasselijke essentiële gezondheids- en veiligheidseisen in het licht van de
      stand van de techniek. 7.4. De fabrikant moet de aangemelde instantie verzoeken om het
      certificaat van EU-typeonderzoek te herzien: a) in geval van een wijziging van het goedgekeurde
      type als bedoeld in punt 7.2; b) in geval van een wijziging in de stand van de techniek
      als bedoeld in punt 7.3; c) uiterlijk vóór de datum waarop het certificaat verstrijkt.
      In het in punt c) bedoelde geval mag de evaluatie slechts tot een vernieuwing van het
      certificaat van EU-typeonderzoek leiden als de fabrikant de aanvraag ten vroegste twaalf
      en ten laatste zes maanden vóór de vervaldatum van het certificaat van EU-typeonderzoek
      indient. Indien de fabrikant de bovengenoemde termijnen niet respecteert, kan de herziening
      alleen leiden tot een goedkeuring in de vorm van een aanvulling op het oorspronkelijke
      certificaat van EU-typeonderzoek en is de vervaldatum van het certificaat die van het
      oorspronkelijke certificaat. 7.5. De aangemelde instantie moet het type machine of verwant
      product onderzoeken en, indien dat nodig is in het licht van de aangebrachte wijzigingen,
      de relevante tests verrichten om te verifiëren dat het goedgekeurde type aan de toepasselijke
      essentiële gezondheids- en veiligheidseisen blijft voldoen. Als de aangemelde instantie
      zich ervan heeft vergewist dat het goedgekeurde type aan de toepasselijke essentiële
      gezondheids- en veiligheidseisen blijft voldoen, verlengt zij het certificaat van EU-typeonderzoek
      of geeft zij een aanvulling af op het oorspronkelijke certificaat van EU-typeonderzoek.
      De aangemelde instantie moet ervoor zorgen dat de evaluatieprocedure vóór de vervaldatum
      van het certificaat van EU-typeonderzoek afgerond is. 7.6. Indien de voorwaarden van
      punt 7.4, punten a) en b), niet vervuld zijn, moet een vereenvoudigde evaluatieprocedure
      worden toegepast. De fabrikant moet de aangemelde instantie het volgende verstrekken:
      a) zijn of haar naam en adres en de gegevens ter identificatie van het betrokken certificaat
      van EU-typeonderzoek; b) de bevestiging dat er geen wijzigingen zijn aangebracht aan
      het goedgekeurde type bedoeld in punt 7.2, met inbegrip van materialen, onderdelen en
      subassemblages, noch aan de relevante geharmoniseerde normen of de door de Commissie
      overeenkomstig artikel 20, lid 3, vastgestelde gemeenschappelijke specificaties of andere
      toegepaste technische specificaties; c) de bevestiging dat er geen verandering is geweest
      in de stand van de techniek bedoeld in punt 7.3; en d) indien nog niet verstrekt, kopieën
      van de huidige producttekeningen en -foto’s, de productmarkering en informatie. Als
      de aangemelde instantie heeft bevestigd dat er geen wijziging is aangebracht aan het
      goedgekeurde type bedoeld in punt 7.2, en dat zich geen verandering heeft voorgedaan
      in de stand van de techniek bedoeld in punt 7.3, moet de vereenvoudigde evaluatieprocedure
      worden toegepast en worden de onderzoeken en tests bedoeld in punt 7.5 niet uitgevoerd.
      In dat geval moet de aangemelde instantie het certificaat van EU-typeonderzoek verlengen.
      De kosten die aan de verlenging verbonden zijn, moeten in verhouding staan tot de administratieve
      lasten die de vereenvoudigde procedure met zich meebrengt. Indien de aangemelde instantie
      oordeelt dat zich een verandering in de stand van de techniek bedoeld in punt 7.3 heeft
      voorgedaan, moet de procedure van punt 7.5 van toepassing zijn. 7.7. Indien de aangemelde
      instantie naar aanleiding van de evaluatie tot de conclusie komt dat het certificaat
      van EU-typeonderzoek niet langer geldig is, moet de instantie het certificaat intrekken
      en moet de fabrikant het in de handel brengen van de machine of het verwante product
      in kwestie stoppen. 8. Elke aangemelde instantie moet de autoriteit die haar heeft aangemeld,
      op de hoogte brengen van de door haar afgegeven of ingetrokken certificaten van EU-typeonderzoek
      en/of aanvullingen daarop, en moet de autoriteit die haar heeft aangemeld, op gezette
      tijden of op verzoek een lijst verstrekken van geweigerde, geschorste of anderszins
      beperkte certificaten en/of aanvullingen daarop. Elke aangemelde instantie moet de andere
      aangemelde instanties op de hoogte brengen van de door haar geweigerde, ingetrokken,
      geschorste of anderszins beperkte certificaten van EU-typeonderzoek en/of aanvullingen
      daarop alsmede, op verzoek, van de door haar verstrekte certificaten van EU-typeonderzoek
      en/of aanvullingen daarop. De Commissie, de lidstaten en de andere aangemelde instanties
      kunnen op verzoek een kopie van de certificaten van EU-typeonderzoek en aanvullingen
      daarop ontvangen. De Commissie en de lidstaten kunnen op verzoek een kopie van de technische
      documentatie en de resultaten van het door de aangemelde instantie verrichte onderzoek
      ontvangen. De aangemelde instantie moet een kopie van het certificaat van EU-typeonderzoek,
      de bijlagen en aanvullingen, alsook het technisch dossier, met inbegrip van de door
      de fabrikant overgelegde documentatie, bewaren voor een periode van vijf jaar na het
      einde van de geldigheidsduur van dat certificaat. 9. De fabrikant houdt tot ten minste
      tien jaar na het in de handel brengen of in bedrijf stellen van de machine of het verwante
      product een kopie van het certificaat van EU-typeonderzoek, de bijlagen en aanvullingen,
      samen met de technische documentatie, ter beschikking van de nationale autoriteiten.
      10. De gemachtigde van de fabrikant kan de in punt 3 bedoelde aanvraag indienen en de
      in de punten 7.2, 7.4 en 9 vermelde verplichtingen vervullen, op voorwaarde dat deze
      in het mandaat worden gespecificeerd.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230
  - number: bijlage VIII
    text: >-
      CONFORMITEIT MET HET TYPE OP BASIS VAN INTERNE PRODUCTIECONTROLE (Module C) 1. Met “conformiteit
      met het type op basis van interne productiecontrole” wordt het gedeelte van een conformiteitsbeoordelingsprocedure
      bedoeld waarin de fabrikant de verplichtingen van de punten 2 en 3 nakomt en op geheel
      eigen verantwoording garandeert en verklaart dat de betrokken machine of het verwante
      product conform is met het type als beschreven in het certificaat van EU-typeonderzoek
      en voldoet aan de toepasselijke eisen van deze verordening. 2. Fabricage De fabrikant
      moet alle nodige maatregelen nemen om ervoor te zorgen dat het fabricage- en controleproces
      waarborgt dat de vervaardigde machine of het verwante product conform is met het type
      als beschreven in het certificaat van EU-typeonderzoek en met de toepasselijke eisen
      van deze verordening. 3. CE-markering en EU-conformiteitsverklaring 3.1. De fabrikant
      moet de CE-markering aanbrengen op elke machine die of elk verwant product dat conform
      is met het type als beschreven in het certificaat van EU-typeonderzoek en voldoet aan
      de toepasselijke eisen van deze verordening. 3.2. De fabrikant moet voor een model van
      machine of verwant product een EU-conformiteitsverklaring opstellen en deze verklaring
      tot tien jaar na het in de handel brengen of in bedrijf stellen van de machine of het
      verwante product ter beschikking van de nationale autoriteiten houden. In de EU-conformiteitsverklaring
      moet worden aangegeven op welke machine of welk verwant product de verklaring betrekking
      heeft. Een kopie van de EU-conformiteitsverklaring moet aan de bevoegde autoriteiten
      worden verstrekt indien zij daarom verzoeken. 4. Gemachtigde De in punt 3 vervatte verplichtingen
      van de fabrikant kunnen namens en onder de verantwoordelijkheid van de fabrikant worden
      vervuld door de gemachtigde van de fabrikant, op voorwaarde dat deze in het mandaat
      gespecificeerd zijn.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230
  - number: bijlage IX
    text: >-
      CONFORMITEIT OP BASIS VAN VOLLEDIGE KWALITEITSBORGING (Module H) 1. Met “conformiteit
      op basis van volledige kwaliteitsborging” wordt de conformiteitsbeoordelingsprocedure
      bedoeld waarbij de fabrikant de verplichtingen in de punten 2 en 5 nakomt en op geheel
      eigen verantwoording garandeert en verklaart dat de betrokken machine of het verwante
      product aan de toepasselijke eisen van deze verordening voldoet. 2. Fabricage De fabrikant
      moet op het ontwerp, het vervaardigen, de eindproductcontrole en de test van de betrokken
      machine of het verwante product een goedgekeurd kwaliteitssysteem als bedoeld in punt
      3 toepassen, waarop overeenkomstig punt 4 toezicht wordt uitgeoefend. 3. Kwaliteitssysteem
      3.1. De fabrikant moet voor de betrokken machine of het verwante product bij een aangemelde
      instantie van zijn of haar keuze een aanvraag tot beoordeling van zijn of haar kwaliteitssysteem
      indienen. De aanvraag moet het volgende omvatten: a) naam en adres van de fabrikant
      en, indien de aanvraag door de gemachtigde van de fabrikant wordt ingediend, naam en
      adres van de gemachtigde; b) de technische documentatie als omschreven in bijlage IV,
      deel A, punten a) tot en met g), i) tot en met k), m) en o), voor één model van elke
      categorie te vervaardigen machines of verwante producten. c) de documentatie over het
      kwaliteitssysteem; en d) een schriftelijke verklaring dat er geen gelijkluidende aanvraag
      bij een andere aangemelde instantie is ingediend. 3.2. Het kwaliteitssysteem moet waarborgen
      dat de machines of verwante producten in overeenstemming zijn met de toepasselijke eisen
      van deze verordening. Alle door de fabrikant vastgestelde gegevens, eisen en bepalingen
      moeten systematisch en geordend worden gebundeld in een document met schriftelijk vastgelegde
      beleidsmaatregelen, procedures en instructies. Aan de hand van deze documentatie van
      het kwaliteitssysteem moeten de kwaliteitsprogramma’s, -plannen, -handboeken en -dossiers
      eenduidig kunnen worden geïnterpreteerd. De documentatie moet met name een behoorlijke
      beschrijving bevatten van: a) de kwaliteitsdoelstellingen, het organisatieschema en
      de verantwoordelijkheden en bevoegdheden van de bedrijfsleiding met betrekking tot ontwerp-
      en productkwaliteit; b) de specificaties van het technisch ontwerp, met inbegrip van
      normen, die worden toegepast en, indien de relevante geharmoniseerde normen of de door
      de Commissie overeenkomstig artikel 20, lid 3, vastgestelde gemeenschappelijke specificaties
      niet volledig worden toegepast, de middelen, inclusief andere technische specificaties
      waarmee wordt gewaarborgd dat aan de essentiële gezondheids- en veiligheidseisen van
      deze verordening die op de machine of het verwante product van toepassing zijn, wordt
      voldaan; c) de controle- en keuringstechnieken voor het ontwerp, de procedés en systematische
      maatregelen die zullen worden toegepast bij het ontwerpen van de machine of het verwante
      product; d) de daarbij gebruikte fabricage-, kwaliteitsbeheersings- en kwaliteitsborgingstechnieken
      en -procedés, alsmede de in dat verband systematisch toe te passen maatregelen; e) de
      onderzoeken en tests die vóór, tijdens en na het vervaardigen worden verricht en de
      frequentie waarmee dat zal gebeuren; f) de kwaliteitsdossiers, zoals inspectieverslagen,
      test- en ijkgegevens, rapporten betreffende de kwalificatie van het betrokken personeel
      enz.; g) de middelen om toezicht te houden op het bereiken van de vereiste ontwerp-
      en productkwaliteit en de doeltreffende werking van het kwaliteitssysteem. 3.3. De aangemelde
      instantie moet het kwaliteitssysteem beoordelen om te controleren of het aan de in punt
      3.2 bedoelde eisen voldoet. Zij moet veronderstellen dat aan deze eisen wordt voldaan
      indien de elementen van het kwaliteitssysteem voldoen aan de desbetreffende specificaties
      van de relevante geharmoniseerde norm. Het auditteam moet ervaring hebben met kwaliteitsmanagementsystemen;
      bovendien moet ten minste één lid van het team ervaring hebben met beoordelingen op
      het gebied van de betrokken machine of het verwante product en de betrokken technologie
      en op de hoogte zijn van de essentiële gezondheids- en veiligheidseisen in bijlage III.
      De audit moet een inspectiebezoek aan de fabrikant omvatten. Het auditteam moet de in
      punt 3.1, b), bedoelde technische documentatie evalueren om te controleren of de fabrikant
      zich bewust is van de toepasselijke essentiële gezondheids- en veiligheidseisen in bijlage
      III en het vereiste onderzoek kan verrichten om te waarborgen dat de machine of het
      verwante product aan die eisen voldoet. De fabrikant of de gemachtigde van de fabrikant
      moet van de beslissing in kennis worden gesteld. In deze kennisgeving moeten de conclusies
      van de audit worden opgenomen, evenals de met redenen omklede beoordelingsbeslissing.
      3.4. De fabrikant moet zich ertoe verbinden de verplichtingen die voortvloeien uit het
      goedgekeurde kwaliteitssysteem na te komen en ervoor te zorgen dat het systeem passend
      en doeltreffend blijft. 3.5. De fabrikant moet de aangemelde instantie die het kwaliteitssysteem
      heeft goedgekeurd op de hoogte brengen van elke voorgenomen wijziging van het kwaliteitssysteem.
      De aangemelde instantie moet de voorgestelde wijzigingen beoordelen en beslissen of
      het gewijzigde kwaliteitssysteem blijft voldoen aan de in punt 3.2 bedoelde eisen dan
      wel of een nieuwe beoordeling noodzakelijk is. Zij moet de fabrikant van haar besluit
      in kennis stellen. De kennisgeving moet de conclusies van het onderzoek en het met redenen
      omklede evaluatiebesluit bevatten. 4. Toezicht onder de verantwoordelijkheid van de
      aangemelde instantie 4.1. Het toezicht heeft tot doel ervoor te zorgen dat de fabrikant
      naar behoren voldoet aan de verplichtingen die voortvloeien uit het goedgekeurde kwaliteitssysteem.
      4.2. De fabrikant moet de aangemelde instantie voor beoordelingsdoeleinden toegang verlenen
      tot de ontwerp-, fabricage-, inspectie-, test- en opslagruimten en haar alle nodige
      informatie verstrekken, met name: a) de documentatie over het kwaliteitssysteem; b)
      de kwaliteitsdossiers als bedoeld in het deel van het kwaliteitssysteem dat betrekking
      heeft op het ontwerp, zoals resultaten van analyses, berekeningen, tests enz.; c) de
      kwaliteitsdossiers als bedoeld in het deel van het kwaliteitssysteem dat betrekking
      heeft op de vervaardiging, zoals inspectieverslagen, test- en kalibratiegegevens, rapporten
      betreffende de kwalificaties van het betrokken personeel enz. 4.3. De aangemelde instantie
      moet periodieke audits verrichten om te controleren of de fabrikant het kwaliteitssysteem
      onderhoudt en toepast, en de fabrikant een auditverslag verstrekken. 4.4. De aangemelde
      instantie kan bovendien onaangekondigde bezoeken aan de fabrikant brengen. Bij die bezoeken
      kan de aangemelde instantie zo nodig producttests verrichten of laten verrichten om
      te controleren of het kwaliteitssysteem goed functioneert. Zij moet de fabrikant een
      verslag van het bezoek en, indien tests zijn verricht, een testverslag verstrekken.
      5. CE-markering en EU-conformiteitsverklaring 5.1. De fabrikant moet overeenkomstig
      deze verordening de vereiste CE-markering en, onder verantwoordelijkheid van de in punt
      3.1 bedoelde aangemelde instantie, het identificatienummer van die instantie aanbrengen
      op elk afzonderlijk product dat aan de toepasselijke eisen van deze verordening voldoet.
      5.2. De fabrikant moet voor elk model van machine of verwant product een schriftelijke
      EU-conformiteitsverklaring opstellen en deze verklaring tot tien jaar na het in de handel
      brengen of in bedrijf stellen van de machine of het verwante product ter beschikking
      van de nationale autoriteiten houden. In de EU-conformiteitsverklaring moet worden aangegeven
      op welk model van machine of verwant product de verklaring betrekking heeft. Een kopie
      van de EU-conformiteitsverklaring moet aan de bevoegde autoriteiten worden verstrekt
      indien zij daarom verzoeken. 6. De fabrikant moet gedurende ten minste tien jaar nadat
      de machine of het verwante product in de handel is gebracht of in bedrijf is gesteld
      de volgende gegevens ter beschikking van de nationale autoriteiten houden: a) de in
      punt 3.1, b), bedoelde technische documentatie; b) de in punt 3.1, c), bedoelde documentatie
      over het kwaliteitssysteem; c) de informatie over de in punt 3.5 bedoelde wijzigingen
      zoals deze zijn goedgekeurd; d) de in de punten 3.5, 4.3 en 4.4 bedoelde beslissingen
      en verslagen van de aangemelde instantie. 7. Elke aangemelde instantie moet de autoriteit
      die haar heeft aangemeld op de hoogte brengen van de besluiten betreffende verleende
      of ingetrokken goedkeuringen voor kwaliteitssystemen en deze autoriteit op gezette tijden
      of op verzoek een lijst van geweigerde, geschorste of anderszins beperkte besluiten
      tot goedkeuring van kwaliteitssystemen verstrekken. Elke aangemelde instantie moet de
      andere aangemelde instanties op de hoogte brengen van de door haar geweigerde, geschorste
      of ingetrokken besluiten tot goedkeuring van kwaliteitssystemen alsmede, op verzoek,
      van de door haar verleende besluiten tot goedkeuring van kwaliteitssystemen. 8. Gemachtigde
      De in punten 3.1, 3.5, 5 en 6 vervatte verplichtingen van de fabrikant kunnen namens
      en onder de verantwoordelijkheid van de fabrikant worden vervuld door de gemachtigde
      van de fabrikant, op voorwaarde dat zij in het mandaat gespecificeerd zijn.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230
  - number: bijlage X
    text: >-
      CONFORMITEIT OP BASIS VAN EENHEIDSKEURING (Module G) 1. Met “conformiteit op basis van
      eenheidskeuring” wordt de conformiteitsbeoordelingsprocedure bedoeld waarbij de fabrikant
      de verplichtingen in de punten 2, 3 en 5 nakomt en op geheel eigen verantwoording garandeert
      en verklaart dat de machine of het verwante product waarop punt 4 van toepassing is,
      voldoet aan de in bijlage III vermelde essentiële gezondheids- en veiligheidseisen.
      2. Technische documentatie De fabrikant moet de technische documentatie samenstellen
      en deze ter beschikking stellen van de in punt 4 bedoelde aangemelde instantie. Aan
      de hand van deze documentatie moet kunnen worden beoordeeld of de machine of het verwante
      product voldoet aan de relevante essentiële gezondheids- en veiligheidseisen in bijlage
      III, en de documentatie moet een adequate risicoanalyse en -beoordeling omvatten. De
      technische documentatie moet de toepasselijke essentiële gezondheids- en veiligheidseisen
      vermelden en – voor zover relevant voor de beoordeling – het ontwerp, het vervaardigen
      en de werking van de machine of het verwante product bestrijken. De technische documentatie
      moet, indien van toepassing, ten minste de volgende elementen bevatten: a) naam en adres
      van de fabrikant en, indien de aanvraag door de gemachtigde van de fabrikant wordt ingediend,
      naam en adres van de gemachtigde; b) de technische documentatie voor de te vervaardigen
      machine-eenheid of verwante producteenheid. Bovendien moet de technische documentatie,
      indien van toepassing, ten minste het volgende bevatten: i) de in bijlage IV, deel A,
      punten a) tot en met g), genoemde elementen; ii) de documentatie over het kwaliteitssysteem;
      en iii) een schriftelijke verklaring dat er geen gelijkluidende aanvraag bij een andere
      aangemelde instantie is ingediend. 2.1 De fabrikant moet tot ten minste tien jaar na
      het in de handel brengen van de machine of het verwante product de technische documentatie
      ter beschikking houden van de desbetreffende nationale autoriteiten. 3. Fabricage De
      fabrikant moet alle nodige maatregelen nemen om ervoor te zorgen dat het fabricageproces
      en de monitoring daarvan waarborgt dat de vervaardigde machine of het verwante product
      voldoet aan de toepasselijke essentiële gezondheids- en veiligheidseisen in bijlage
      III bij deze verordening. 4. Keuring Een door de fabrikant gekozen aangemelde instantie
      moet de nodige onderzoeken en tests verrichten of laten verrichten als omschreven in
      de desbetreffende geharmoniseerde normen en/of gemeenschappelijke specificaties, of
      gelijkwaardige tests, om te controleren of de machine of het verwante product voldoet
      aan de toepasselijke essentiële gezondheids- en veiligheidseisen in bijlage III bij
      deze richtlijn. Indien er geen geharmoniseerde normen en/of gemeenschappelijke specificaties
      zijn, moet de aangemelde instantie in kwestie over de te verrichten passende tests beslissen.
      De aangemelde instantie moet een certificaat afgeven voor de verrichte onderzoeken en
      tests en haar identificatienummer aanbrengen op de goedgekeurde machine of het verwante
      product, of dit onder haar verantwoordelijkheid laten aanbrengen. De fabrikant moet
      tot ten minste tien jaar na het in de handel brengen van de machine of het verwante
      product de certificaten ter beschikking houden van de desbetreffende nationale autoriteiten.
      5. CE-markering en EU-conformiteitsverklaring 5.1. De fabrikant moet de in artikel 10,
      lid 2, omschreven vereiste CE-markering, alsmede, onder verantwoordelijkheid van in
      punt 4 bedoelde aangemelde instantie, het identificatienummer van die instantie aanbrengen
      op de machine die of het verwante product dat voldoet aan de toepasselijke essentiële
      gezondheids- en veiligheidseisen in bijlage III. 5.2. De fabrikant moet een schriftelijke
      EU-conformiteitsverklaring opstellen en deze verklaring tot ten minste tien jaar na
      het in de handel brengen of in bedrijf stellen van de machine of het verwante product
      ter beschikking van de nationale autoriteiten houden. In de EU-conformiteitsverklaring
      moet worden aangegeven op welke machine of welk verwant product de verklaring betrekking
      heeft. Een kopie van de EU-conformiteitsverklaring moet aan de relevante autoriteiten
      worden verstrekt indien zij daarom verzoeken. 6. Gemachtigde De in de punten 2.1 en
      5 vervatte verplichtingen van de fabrikant kunnen worden vervuld door een gemachtigde
      die namens en onder verantwoordelijkheid van de fabrikant handelt, op voorwaarde dat
      die verplichtingen in het mandaat zijn gespecificeerd.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230
  - number: bijlage XI
    text: >-
      MONTAGEHANDLEIDING VOOR NIET VOLTOOIDE MACHINES 1. De montagehandleiding voor niet voltooide
      machines moet een beschrijving bevatten van de voorwaarden waaraan moet worden voldaan
      om ervoor te zorgen dat de niet voltooide machine correct in de machine of andere niet
      voltooide machine of uitrusting wordt ingebouwd en dat de machine of andere niet voltooide
      machine of uitrusting waarin de niet voltooide machine is ingebouwd de gezondheid en
      veiligheid van personen en, in voorkomend geval, huisdieren en eigendommen en, indien
      van toepassing, het milieu niet in gevaar brengt. 2. De handleiding moet relevante informatie
      bevatten die moet worden gebruikt in de gebruiksaanwijzing van de machine of de andere
      niet voltooide machine of uitrusting waarin de niet voltooide machine moet worden gemonteerd.
      Iedere montagehandleiding moet, indien van toepassing, ten minste de volgende informatie
      bevatten: a) een algemene beschrijving van de niet voltooide machine; b) de tekeningen,
      schema’s, beschrijvingen en toelichtingen die nodig zijn om de niet voltooide machine
      in te bouwen in de afgewerkte machine, die te onderhouden en te repareren en om de correcte
      werking ervan te controleren; c) waarschuwingen betreffende te ontraden gebruik van
      de niet voltooide machine dat, naar uit ervaring is gebleken, van de machine kan worden
      gemaakt; d) instructies voor de montage, installatie en aansluiting van de machine,
      met inbegrip van tekeningen, schema’s en de bevestigingsmiddelen, en aanduiding van
      het chassis of de installatie waarop de niet voltooide machine moet worden gemonteerd;
      e) informatie over lawaai of trillingen die door het inbouwen waarschijnlijk zullen
      afnemen; f) informatie over de essentiële gezondheids- en veiligheidseisen in bijlage
      III die op de niet voltooide machine van toepassing zijn; g) de essentiële kenmerken
      van de gereedschappen die op de niet voltooide machine kunnen worden gemonteerd; h)
      de voorwaarden waaronder de niet voltooide machine voldoet aan de stabiliteitseis tijdens
      gebruik, vervoer, montage en ontmanteling, alsmede wanneer deze buiten bedrijf is, tijdens
      tests en bij voorzienbare storingen; i) instructies met het oog op het veilig vervoeren,
      verplaatsen en opslaan van de niet voltooide machine, met vermelding van de massa en
      de verschillende onderdelen ervan, indien deze regelmatig afzonderlijk moeten worden
      vervoerd; j) de te volgen werkwijze bij ongevallen of storingen; indien het optreden
      van een blokkering waarschijnlijk is, de werkwijze om de blokkering van de uitrusting
      zonder risico te verhelpen; k) de beschrijving van de afstellings- en onderhoudswerkzaamheden
      die de gebruiker moet verrichten alsook het in acht te nemen preventieve onderhoud waarbij
      rekening moet worden gehouden met het ontwerp; l) instructies met het oog op het veilig
      afstellen en onderhouden van de niet voltooide machine, met inbegrip van de daarbij
      te nemen beschermingsmaatregelen; m) specificaties betreffende de te gebruiken vervangingsonderdelen,
      indien deze van invloed zijn op de gezondheid en de veiligheid van de bedieners; n)
      een duidelijke beschrijving van de versie van de montagehandleiding die overeenkomt
      met het niet voltooide machinemodel. Indien de niet voltooide machine bestemd is om
      te worden gebruikt in machines waarop bijlage III, hoofdstukken 2 tot en met 6, van
      toepassing is, moet de montagehandleiding ook relevante informatie bevatten die in de
      gebruiksaanwijzing voor deze machine moet worden gebruikt. 3. De montagehandleiding
      voor niet voltooide machines moet de EU-inbouwverklaring, of het internetadres of de
      machineleesbare code om de EU-inbouwverklaring te raadplegen, bevatten.
    url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:32023R1230
  - number: bijlage XII
    text: >-
