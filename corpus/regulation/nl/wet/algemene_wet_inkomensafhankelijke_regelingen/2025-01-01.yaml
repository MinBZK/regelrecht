  - number: '33'
    text: |-
      1 De partner van de belanghebbende is hoofdelijk aansprakelijk voor een door de belanghebbende verschuldigd bedrag
      aan terugvordering, daaronder begrepen de in de [artikelen 27][ref1] en [29][ref2] bedoelde rente alsmede de
      kosten van aanmaning en de kosten van invordering bij dwangbevel. De partner is niet aansprakelijk voor een aan de
      belanghebbende opgelegde bestuurlijke boete, tenzij het belopen daarvan mede aan hem is te wijten.

      2 Indien in een inkomensafhankelijke regeling is bepaald dat naast de draagkracht van de belanghebbende en diens
      partner ook de draagkracht van medebewoners van belang is voor de beoordeling van de aanspraak op of de bepaling
      van de hoogte van een tegemoetkoming, is ieder van de medebewoners hoofdelijk aansprakelijk voor een door de
      belanghebbende verschuldigd bedrag aan terugvordering en, overeenkomstig het eerste lid, voor de in te vorderen
      bedragen die verband houden met die terugvordering.

      3 Een derde die kan beschikken over een bankrekening waarop een voorschot of een tegemoetkoming is uitbetaald, is
      hoofdelijk aansprakelijk voor een door de belanghebbende verschuldigd bedrag aan terugvordering zonder rekening te
      houden met de toepassing van [artikel 26, tweede lid][ref3], voor zover het terug te vorderen bedrag overeenkomstig
      artikel 26, eerste lid, is betaald op die bankrekening. Voor zover een terugvordering voortvloeit uit de toepassing
      van [artikel 24][ref4], wordt het bedrag waarvoor de derde aansprakelijk is, bepaald op het gedeelte van de
      terugvordering overeenkomstig artikel 26, eerste lid, dat in dezelfde verhouding staat tot het bedrag van de
      terugvordering zonder rekening te houden met de toepassing van artikel 26, tweede lid, als de aan de derde over het
      berekeningsjaar uitbetaalde voorschotten in verhouding staan tot het totale bedrag van de over het berekeningsjaar
      uitbetaalde voorschotten.

      4 Aansprakelijkstelling geschiedt bij beschikking van de Dienst Toeslagen. Het bedrag waarvoor de aansprakelijkheid
      bestaat, is invorderbaar zes weken na de dagtekening van de beschikking. De [artikelen 28, derde lid][ref5],
      [30][ref6], [31][ref7] en [32][ref8] zijn van overeenkomstige toepassing.

      5 Op de beschikking, bedoeld in het vierde lid, zijn de
      [artikelen 4:97 tot en met 4:102 van de Algemene wet bestuursrecht][ref9] niet van toepassing

      6 De aansprakelijkheid van de partner, bedoeld in het eerste lid, of van de derde, bedoeld in het derde lid, geldt
      tevens indien deze partner of derde niet in Nederland woont.


