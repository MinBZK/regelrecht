  - number: '32'
    text: |-
      1 Indien de belanghebbende het bedrag van de terugvordering, daaronder begrepen de in [artikel 27][ref1] bedoelde
      rente alsmede bestuurlijke boeten, niet binnen de gestelde termijn betaalt, maant de Dienst Toeslagen hem
      schriftelijk aan om alsnog binnen twee weken na de dagtekening van de aanmaning te betalen.

      2 De invordering van het bedrag van de terugvordering kan geschieden bij een door de Dienst Toeslagen uit te
      vaardigen dwangbevel. In afwijking van [artikel 4:119, eerste lid, van de Algemene wet bestuursrecht][ref2] kunnen
      bij het dwangbevel tevens de kosten van de aanmaning, de kosten van het dwangbevel en de verschuldigde renten
      worden ingevorderd.

      3 De betekening van het dwangbevel geschiedt met overeenkomstige toepassing van
      [artikel 13 van de Invorderingswet 1990][ref3].

      4 De [artikelen 14][ref4], [15][ref5], [18][ref6] en [18a van de Invorderingswet 1990][ref7] zijn van
      overeenkomstige toepassing.

      5 De belanghebbende kan met overeenkomstige toepassing van [artikel 17 van de Invorderingswet 1990][ref8], tegen de
      tenuitvoerlegging van het dwangbevel in verzet komen.

      6 Een derde die aan de belanghebbende loon, pensioen, lijfrente of uitkeringen, een en ander als
      bedoeld in [artikel 19 van de Invorderingswet 1990][ref9], verschuldigd is, of een bank als bedoeld
      in [artikel 1:1 van de Wet op het financieel toezicht][ref10] waarbij belanghebbende een tegoed
      op een rekening heeft, kan op vordering van de Dienst Toeslagen met overeenkomstige toepassing van
      [artikel 19 van de Invorderingswet 1990][ref11] worden verplicht het door de belanghebbende verschuldigde bedrag
      aan terugvordering te betalen.

      7 [Artikel 27, eerste lid, van de Invorderingswet 1990][ref12] is van overeenkomstige toepassing.


