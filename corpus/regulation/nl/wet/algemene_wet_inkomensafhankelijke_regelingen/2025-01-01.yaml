  - number: 37a
    text: >-
      De werking van een uitspraak van de rechtbank of van de voorzieningenrechter wordt opgeschort totdat de termijn
      voor het instellen van hoger beroep is verstreken of, indien hoger beroep is ingesteld, op het hoger beroep
      onherroepelijk is beslist. De eerste volzin geldt niet indien de uitspraak een beroep tegen het niet tijdig nemen
      van een besluit betreft.
    url: https://wetten.overheid.nl/BWBR0018472/2025-01-01#Artikel37a
  - number: '38'
    text: |-
      1 Openbare lichamen met uitzondering van de openbare lichamen Bonaire, Sint Eustatius en Saba en rechtspersonen die
      bij of krachtens een bijzondere wet rechtspersoonlijkheid hebben verkregen, de onder hen ressorterende instellingen
      en diensten, lichamen die hoofdzakelijk uitvoering geven aan het beleid van het Rijk, administratieplichtigen als
      bedoeld in [artikel 52 van de Algemene wet inzake rijksbelastingen][ref1] en verhuurders van een woning als bedoeld
      in [artikel 1, onderdeel k, van de Wet op de huurtoeslag][ref2] verstrekken kosteloos aan de Dienst Toeslagen
      desgevraagd alle gegevens en inlichtingen die van belang kunnen zijn voor de uitvoering van deze wet, de daarop
      berustende bepalingen of een inkomensafhankelijke regeling.

      2 Onverminderd de verplichtingen, bedoeld in het eerste lid, zijn de bij algemene maatregel van bestuur aan te
      wijzen lichamen, instellingen, diensten, rechtspersonen of personen gehouden de bij algemene maatregel van bestuur
      aan te wijzen gegevens en inlichtingen waarvan de kennisneming voor de beoordeling van de aanspraak op of de
      bepaling van de hoogte van de tegemoetkoming of het voorschot van een derde, het herzien van een tegemoetkoming
      van een derde, bedoeld in de [artikelen 21][ref3] en [21a][ref4], of het herzien van een voorschot van een derde,
      bedoeld in [artikel 16, vijfde lid][ref5], van belang kunnen zijn eigener beweging te verstrekken aan de Dienst
      Toeslagen volgens bij algemene maatregel van bestuur te stellen regels.

      3 De gegevens en inlichtingen worden verstrekt binnen een door de Dienst Toeslagen te stellen termijn.

      4 Kindercentra en gastouderbureaus als bedoeld in [artikel 1.1, eerste lid, van de Wet kinderopvang][ref6]
      verstrekken eigener beweging aan de Dienst Toeslagen per ingeschreven kind de volgende gegevens, zoals deze
      bij of krachtens [artikel 1.53][ref7], onderscheidenlijk [artikel 1.56, zesde lid, van die wet][ref8] in de
      administratie worden opgenomen, ten behoeve van de beoordeling van de aanspraak op of de bepaling van de hoogte van
      de tegemoetkoming:

      a. voorletter(s), achternaam, burgerservicenummer en geboortedatum van het kind, de ouder en de partner;

      b. het soort kinderopvang dat wordt afgenomen;

      c. het aantal afgenomen uren;

      d. het gemiddelde uurtarief van de afgenomen uren;

      e. de ingangsdatum en einddatum van de schriftelijke overeenkomst, bedoeld in
      [artikel 1.52, eerste lid, van die wet][ref9]; en

      f. het unieke registratienummer, bedoeld in de [artikelen 1.47b, derde lid][ref10], of
      [artikel 1.48b, derde lid, van die wet][ref11].

      5 De gegevens, bedoeld in het vierde lid, worden uiterlijk op de vijftiende dag van elke maand verstrekt en
      hebben telkens betrekking op alle aan die maand voorafgaande maanden vanaf de aanvang van het berekeningsjaar
      dan wel, indien dat later is, vanaf de ingangsdatum van de schriftelijke overeenkomst, bedoeld in
      [artikel 1.52, eerste lid, van de Wet kinderopvang][ref12], met dien verstande dat in de maand januari de gegevens
      uiterlijk op 27 januari worden verstrekt en betrekking hebben op alle maanden van het voorafgaande berekeningsjaar
      waarin sprake was van een dergelijke overeenkomst. Uiterlijk op 1 maart worden de gegevens met betrekking tot alle
      maanden van het voorafgaande berekeningsjaar nogmaals verstrekt.

      6 Indien de gevraagde gegevens of inlichtingen niet op tijd zijn verstrekt, maant de Dienst Toeslagen aan onder het
      stellen van een nadere termijn om alsnog de gevraagde gegevens en inlichtingen te verstrekken.

      7 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de vermelding van het
      burgerservicenummer van degene op wie de gegevens en inlichtingen betrekking hebben bij het verstrekken van de
      gegevens en inlichtingen.

      8 In de gevallen waarin het burgerservicenummer dient te worden vermeld, is degene op wie de gegevens
      en inlichtingen, bedoeld in het eerste, tweede of vierde lid, betrekking hebben gehouden zijn
      burgerservicenummer te verstrekken aan de in het eerste lid bedoelde openbare lichamen met uitzondering
      van de openbare lichamen Bonaire, Sint Eustatius en Saba en rechtspersonen die bij of krachtens een
      bijzondere wet rechtspersoonlijkheid hebben verkregen, de onder hen ressorterende instellingen en
      diensten, lichamen die hoofdzakelijk uitvoering geven aan het beleid van het Rijk, administratieplichtigen
      als bedoeld in [artikel 52 van de Algemene wet inzake rijksbelastingen][ref13] en verhuurders van een
      woning als bedoeld in [artikel 1, onderdeel k, van de Wet op de huurtoeslag][ref14], aan de lichamen,
      instellingen, diensten, rechtspersonen of personen die ingevolge het tweede lid bij algemene maatregel
      van bestuur zijn aangewezen, onderscheidenlijk aan kindercentra of gastouderbureaus als bedoeld in
      [artikel 1.1, eerste lid, van de Wet kinderopvang][ref15].

      9 Financiële ondernemingen die ingevolge de [Wet op het financieel toezicht][ref16] in Nederland het bedrijf
      van bank mogen uitoefenen maken bij het verwerken van de gegevens die van belang zijn voor de uitbetaling van
      een voorschot of een tegemoetkoming door de Dienst Toeslagen, bedoeld in [artikel 25][ref17], in hun eigen
      administratie gebruik van het burgerservicenummer.

      10 Ingeval een lichaam, instelling, dienst, rechtspersoon, persoon, kindercentrum of gastouderbureau de
      verplichting, bedoeld in het eerste, tweede of vierde lid, is nagekomen maar van oordeel is dat de verplichting
      onrechtmatig is opgelegd, kan op verzoek een vergoeding van kosten die rechtstreeks verband houden met deze
      nakoming worden toegekend. De Dienst Toeslagen kent bij beschikking een redelijke kostenvergoeding toe in geval van
      een onrechtmatig opgelegde verplichting. Voor de toepassing van de wettelijke voorschriften over bezwaar en beroep
      wordt de rechtmatigheid van de opgelegde verplichting van het eerste, tweede of vierde lid geacht deel uit te maken
      van het geschil in bezwaar en beroep tegen de beschikking tot toekenning van een kostenvergoeding.

      11 De voordracht voor een krachtens het tweede lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd. Als binnen die vier
      weken door of namens een der kamers of door ten minste een vijfde van het grondwettelijk aantal leden van een
      der kamers de wens te kennen wordt gegeven dat het onderwerp van de algemene maatregel van bestuur bij wet wordt
      geregeld, wordt in dat geval een daartoe strekkend voorstel van wet zo spoedig mogelijk ingediend en wordt de
      algemene maatregel niet vastgesteld.


