    text: |-
      1 Indien de belanghebbende, zijn partner of een medebewoner de Dienst Toeslagen alsnog de juiste en volledige
      gegevens en inlichtingen verstrekt voordat hij weet of redelijkerwijs moet vermoeden dat de Dienst Toeslagen met de
      onjuistheid of onvolledigheid bekend is of bekend zal worden, wordt aan hem niet de bestuurlijke boete, bedoeld in
      [artikel 40][ref1] of [artikel 41][ref2], opgelegd.

      2 Het eerste lid is niet van toepassing voor zover de juiste en volledige gegevens en inlichtingen,
      bedoeld in het eerste lid, betrekking hebben op inkomen uit aanmerkelijk belang als bedoeld in
      [artikel 4.12 van de Wet inkomstenbelasting 2001][ref3] of op inkomen uit sparen en beleggen als bedoeld in
      [artikel 5.1 van die wet][ref4].


