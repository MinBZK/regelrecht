    machine_readable:
      # Lid 1: het toetsingsinkomen is het inkomensgegeven (artikel 2, eerste
      # lid, onderdeel o: artikel 21, onderdeel e, AWR) dat op het
      # berekeningsjaar (artikel 2, eerste lid, onderdeel b) betrekking heeft.
      # Wat het inkomensgegeven is (verzamelinkomen bij een aanslag, anders
      # belastbaar loon) bepaalt de AWR, niet deze wet.
      # Lid 2: niet in Nederland belastbaar inkomen (artikel 2, eerste lid,
      # onderdeel m), zoals dat bij beschikking is vastgesteld, telt mee.
      # De leden 3 tot en met 7 (herleiding bij einde partnerschap of
      # medebewonerschap, overlijden, en vermindering met voordelen uit
      # schuldsanering) werken op verzoek en zijn niet gemodelleerd.
      execution:
        parameters:
          - name: bsn
            type: string
            required: true
        input:
          - name: berekeningsjaar
            type: number
            source:
              output: berekeningsjaar
          - name: inkomensgegeven
            type: amount
            source:
              regulation: algemene_wet_inzake_rijksbelastingen
              output: inkomensgegeven
              parameters:
                bsn: $bsn
                kalenderjaar: $berekeningsjaar
            type_spec:
              unit: eurocent
          # Lid 2: "zoals dat bij beschikking is vastgesteld". Die beschikking
          # is een gegeven van de uitvoerder, geen berekening in het corpus.
          - name: niet_in_nederland_belastbaar_inkomen
            type: amount
            source: {}
            type_spec:
              unit: eurocent
        output:
          - name: toetsingsinkomen
            type: amount
            type_spec:
              unit: eurocent
        actions:
          - output: toetsingsinkomen
            value:
              operation: ADD
              values:
                - $inkomensgegeven
                - $niet_in_nederland_belastbaar_inkomen
  - number: 8a
    text: |-
      1 Het niet in Nederland belastbaar inkomen wordt vastgesteld door de inspecteur.

      2 Het niet in Nederland belastbaar inkomen is:

      a. ten aanzien van degene die binnenlandse belastingplichtige is voor de inkomstenbelasting: het verschil tussen
      het verzamelinkomen dat hij zou hebben genoten ingeval er geen vrijstelling van interregionaal of internationaal
      recht van toepassing zou zijn en het verzamelinkomen dat hij met toepassing van de vrijstelling geniet;

      b. ten aanzien van degene die buitenlandse belastingplichtige is voor de inkomstenbelasting: het verschil tussen
      enerzijds het verzamelinkomen dat hij zou hebben genoten ingeval hij binnenlandse belastingplichtige zou zijn
      en, in geval van vrijstelling op grond van bepalingen van interregionaal of internationaal recht, zonder die
      vrijstelling, en anderzijds het verzamelinkomen dat hij heeft genoten als buitenlandse belastingplichtige;

      c. ten aanzien van degene die geen belastingplichtige is voor de inkomstenbelasting: het verzamelinkomen dat
      hij zou hebben genoten ingeval hij binnenlandse belastingplichtige zou zijn voor die belasting en, in geval van
      vrijstelling op grond van bepalingen van interregionaal of internationaal recht, zonder die vrijstelling.

      3 Indien er grond is voor het vermoeden dat vaststelling van het niet in Nederland belastbaar inkomen ten onrechte
      achterwege is gelaten of dat dit inkomen tot een te laag bedrag is vastgesteld, kan de inspecteur alsnog het niet
      in Nederland belastbaar inkomen vaststellen dan wel het vastgestelde niet in Nederland belastbaar inkomen herzien.

      4 Bij de in het eerste lid bedoelde vaststelling van het niet in Nederland belastbaar inkomen
      zijn, in afwijking in zoverre van de [Algemene wet bestuursrecht][ref1], de bepalingen van de
      [Algemene wet inzake rijksbelastingen][ref2], met uitzondering van de [hoofdstukken VA][ref3] en [VIIIA][ref4], van
      toepassing als betrof het de vaststelling van een aanslag inkomstenbelasting.

      5 Bij de in het derde lid bedoelde vaststelling dan wel herziening van het niet in Nederland belastbaar
      inkomen zijn, in afwijking in zoverre van de [Algemene wet bestuursrecht][ref5], de bepalingen van de
      [Algemene wet inzake rijksbelastingen][ref6], met uitzondering van de [hoofdstukken VA][ref7] en [VIIIA][ref8], van
      toepassing als betrof het de vaststelling van een navorderingsaanslag inkomstenbelasting.

      6 Een beschikking op grond van dit artikel wordt aangemerkt als een voor bezwaar vatbare beschikking als bedoeld in
      [hoofdstuk V van de Algemene wet inzake rijksbelastingen][ref9].


