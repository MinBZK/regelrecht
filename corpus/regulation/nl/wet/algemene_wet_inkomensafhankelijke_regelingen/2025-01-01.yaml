  - number: '40'
    text: |-
      1 Degene die op grond van deze wet en de daarop berustende bepalingen gehouden is tot het verstrekken van gegevens
      of inlichtingen en deze niet, dan wel niet binnen de daartoe gestelde termijn, heeft verstrekt, begaat een verzuim
      ter zake waarvan de Dienst Toeslagen hem een bestuurlijke boete van ten hoogste € 6.709 kan opleggen.

      2 De bestuurlijke boete, bedoeld in het eerste lid, kan door de Dienst Toeslagen ter zake van een verzuim ten
      aanzien van een verplichting als bedoeld in [artikel 18, eerste lid][ref1], slechts worden opgelegd indien de
      Dienst Toeslagen:

      a. een redelijkerwijs te vergen inspanning heeft verricht om de persoon die niet heeft voldaan aan een verplichting
      als bedoeld in [artikel 18, eerste lid][ref2], in de gelegenheid te stellen alsnog de gevraagde gegevens en
      inlichtingen binnen een redelijke termijn te verstrekken voordat die persoon is aangemaand als bedoeld in artikel
      18, derde lid; en

      b. de gegevens of inlichtingen niet zijn verstrekt binnen de aanmaningstermijn, bedoeld in
      [artikel 18, derde lid][ref3].

      3 Bij het opleggen van de bestuurlijke boete, bedoeld in het eerste lid, is [hoofdstuk VIIIA, afdeling 2][ref4],
      met uitzondering van de [artikelen 67n][ref5] en [67pa, van de Algemene wet inzake rijksbelastingen][ref6] van
      overeenkomstige toepassing.

      4 Bij het opleggen van de bestuurlijke boete, bedoeld in het eerste lid, vindt
      [artikel 5:53 van de Algemene wet bestuursrecht][ref7] geen toepassing.

      5 In afwijking in zoverre van [artikel 5:45 van de Algemene wet bestuursrecht][ref8] vervalt de bevoegdheid tot het
      opleggen van de bestuurlijke boete, bedoeld in het eerste lid, vijf jaren nadat de overtreding is begaan.


