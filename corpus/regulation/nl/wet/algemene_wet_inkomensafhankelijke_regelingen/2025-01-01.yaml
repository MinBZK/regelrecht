      1 Tot het verrichten van de bij of krachtens een wet aan een deurwaarder opgedragen werkzaamheden is, voor zover
      die werkzaamheden geschieden in opdracht van de Dienst Toeslagen, uitsluitend een belastingdeurwaarder als bedoeld
      in [artikel 2, eerste lid, onderdeel j, van de Invorderingswet 1990][ref1], bevoegd.

      2 De Kostenwet invordering rijksbelastingen is van overeenkomstige toepassing.

      3 In afwijking van [artikel 4:92, eerste lid, van de Algemene wet bestuursrecht][ref2] geschiedt de toerekening van
      de betalingen achtereenvolgens aan:

      a. de kosten van invordering;

      b. de rente bij te late betaling;

      c. de terugvordering, de in rekening gebrachte rente bedoeld in [artikel 27][ref3] en de bestuurlijke boete, naar
      evenredigheid.


