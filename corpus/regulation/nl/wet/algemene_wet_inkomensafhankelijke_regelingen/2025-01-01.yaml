  - number: '9'
    text: |-
      1 Indien aan een vreemdeling tijdens een rechtmatig verblijf als bedoeld in
      [artikel 8, onderdelen a tot en met e, en l, van de Vreemdelingenwet 2000][ref1] een tegemoetkoming is
      toegekend, heeft de omstandigheid dat hij aansluitend aan dit verblijf rechtmatig verblijf houdt in de zin van
      [artikel 8, onderdeel g of h, van die wet][ref2] niet tot gevolg dat hij daardoor zijn aanspraak verliest op
      eenzelfde tegemoetkoming gedurende de periode van laatstgenoemd verblijf.

      2 Ingeval de partner van de belanghebbende een vreemdeling is die niet rechtmatig verblijf houdt in de zin van
      [artikel 8 van de Vreemdelingenwet 2000][ref3], heeft de belanghebbende geen aanspraak op een tegemoetkoming.

      3 Indien in een inkomensafhankelijke regeling is bepaald dat naast de draagkracht van de belanghebbende en diens
      partner ook de draagkracht van medebewoners van belang is voor de beoordeling van de aanspraak op of de bepaling
      van de hoogte van een tegemoetkoming, heeft de belanghebbende geen aanspraak op een tegemoetkoming ingeval
      een medebewoner van achttien jaar of ouder een vreemdeling is die niet rechtmatig verblijf houdt in de zin van
      [artikel 8 van de Vreemdelingenwet 2000][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
