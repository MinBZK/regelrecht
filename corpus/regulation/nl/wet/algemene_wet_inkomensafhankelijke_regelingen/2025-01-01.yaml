    text: |-
      1 Het in [artikel 40][ref1] genoemde bedrag wordt elke vijf jaar, met ingang van 1 januari van een jaar,
      bij ministeriële regeling gewijzigd. Deze wijziging vindt voor het eerst plaats per 1 januari 2015. De
      [artikelen 10.1][ref2] en [10.2 van de Wet inkomstenbelasting 2001][ref3] zijn van overeenkomstige toepassing
      met dien verstande dat als tabelcorrectiefactor wordt genomen het product van de factoren van de laatste vijf
      kalenderjaren.

      2 De gewijzigde bedragen vinden voor het eerst toepassing met betrekking tot overtredingen die hebben
      plaatsgevonden na het begin van het kalenderjaar bij de aanvang waarvan de bedragen zijn gewijzigd.


