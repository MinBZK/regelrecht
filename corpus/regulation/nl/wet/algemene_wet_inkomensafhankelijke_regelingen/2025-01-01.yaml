  - number: 9a
    text: |-
      1 Een uitreiziger heeft geen aanspraak op een tegemoetkoming.

      2 Voor de persoon, bedoeld in het eerste lid, ontstaat weer aanspraak op een tegemoetkoming vanaf
      de eerste dag van de maand volgend op de maand waarin niet langer het gegronde vermoeden bestaat dat
      hij zich buiten Nederland bevindt met het doel zich aan te sluiten bij een organisatie als bedoeld in
      [artikel 2, eerste lid, onderdeel q][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel2
