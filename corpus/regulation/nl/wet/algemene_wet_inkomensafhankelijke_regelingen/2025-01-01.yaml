  - number: '10'
    text: >-
      1 Een minderjarige is bekwaam de rechtshandelingen te verrichten die noodzakelijk zijn om een tegemoetkoming te
      verkrijgen. Hij is voorts bekwaam de rechtshandelingen te verrichten die noodzakelijk zijn met betrekking tot de
      uitoefening, onderscheidenlijk de nakoming van de voor hem uit de toekenning van tegemoetkomingen voortvloeiende
      rechten en verplichtingen.


      2 Indien op grond van een inkomensafhankelijke regeling alleen meerderjarigen aanspraak op een tegemoetkoming
      hebben, wordt voor die regeling mede als meerderjarige aangemerkt de minderjarige met een kind of de minderjarige
      van wie beide ouders zijn overleden.
    url: https://wetten.overheid.nl/BWBR0018472/2025-01-01#Artikel10
  - number: '11'
    text: >-
      1 De bepalingen van dit hoofdstuk gelden voor de inkomensafhankelijke regelingen waarvan de uitvoering bij die
      regeling is opgedragen aan de Dienst Toeslagen.


      2 Onder Dienst Toeslagen wordt verstaan: het organisatieonderdeel van de rijksbelastingdienst dat is belast met het
      toekennen, uitbetalen en terugvorderen van tegemoetkomingen.
    url: https://wetten.overheid.nl/BWBR0018472/2025-01-01#Artikel11
  - number: '12'
    text: |-
      1 Voor de toepassing van dit hoofdstuk blijven [titel 4.2][ref1] en
      [artikel 4:125 van de Algemene wet bestuursrecht][ref2] buiten toepassing en zijn [artikel 3:40][ref3],
      [titel 4.1][ref4] en de [hoofdstukken 6][ref5] en [7 van die wet][ref6] niet van toepassing op de
      verrekeningsbeschikking, bedoeld in [artikel 30][ref7].

      2 [Paragraaf 4.1.3.2 van de Algemene wet bestuursrecht][ref8] is niet van toepassing op beschikkingen van de Dienst
      Toeslagen met uitzondering van de beschikking tot toekenning van de tegemoetkoming, bedoeld in artikel 14, alsmede
      beslissingen op bezwaarschriften tegen deze beschikkingen, met dien verstande dat:

      a. een door de Dienst Toeslagen verbeurde dwangsom € 10 bedraagt voor elke week dat hij in gebreke is, doch ten
      hoogste € 100, tenzij de toekenning van de tegemoetkoming leidt tot een na te betalen of terug te vorderen bedrag
      kleiner dan € 100 in welk geval de verbeurde dwangsom ten hoogste € 30 bedraagt;

      b. de Dienst Toeslagen geen dwangsom verbeurt indien de toekenning van de tegemoetkoming leidt tot een na te
      betalen of terug te vorderen bedrag kleiner dan € 30.

      3 Voor de toepassing van dit hoofdstuk kan Onze Minister bij ministeriële regeling
      [paragraaf 4.1.3.2 van de Algemene wet bestuursrecht][ref9] voor een bij die regeling te bepalen periode geheel of
      gedeeltelijk buiten toepassing verklaren indien er sprake is van een ernstige verstoring in het uitvoeringsproces,
      die het naar zijn oordeel aannemelijk maakt dat door belanghebbenden, als direct gevolg van de ernstige storing,
      massaal een beroep wordt gedaan op de dwangsomregeling, bedoeld in deze paragraaf. Na het tot stand komen van
      deze ministeriële regeling wordt zo spoedig mogelijk maar uiterlijk binnen acht weken een voorstel van wet tot
      goedkeuring van de ministeriële regeling aan de Tweede Kamer der Staten-Generaal gezonden. Indien het voorstel
      wordt ingetrokken of indien een van de kamers van de Staten-Generaal besluit het voorstel niet aan te nemen, wordt
      de ministeriële regeling onverwijld ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
