  - number: 41bis
    text: |-
      1 In afwijking van [artikel 5:1 van de Algemene wet bestuursrecht][ref1] wordt onder overtreder mede verstaan:

      a. degene die de overtreding doet plegen;

      b. degene die door giften, beloften, misbruik van gezag, geweld, bedreiging, misleiding of door het verschaffen van
      gelegenheid, middelen of inlichtingen de overtreding opzettelijk uitlokt;

      c. degene die als medeplichtige opzettelijk behulpzaam is bij of opzettelijk gelegenheid, middelen of inlichtingen
      verschaft tot het plegen van de overtreding.

      2 De bestuurlijke boete, bedoeld in [artikel 40, eerste lid][ref2], kan niet worden opgelegd aan een medeplichtige.

      3 Indien de bestuurlijke boete, bedoeld in [artikel 41, eerste lid][ref3], wordt opgelegd aan een medeplichtige,
      wordt het bedrag van de boete dat ten hoogste kan worden opgelegd met een derde verminderd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel51
