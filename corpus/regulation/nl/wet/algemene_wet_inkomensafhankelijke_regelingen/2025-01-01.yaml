  - number: '43'
    text: |-
      1 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Ministers wie het aangaat, aangewezen ambtenaren.

      2 De toezichthouder beschikt niet over de bevoegdheden, genoemd in de [artikelen 5:18][ref1] en
      [5:19 van de Algemene wet bestuursrecht][ref2].

      3 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.


