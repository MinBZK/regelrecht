$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.8.0/schema/v0.8.0/schema.json
$id: algemene_wet_inkomensafhankelijke_regelingen
regulatory_layer: WET
publication_date: '2022-12-27'
valid_from: '2025-01-01'
bwb_id: BWBR0018472
url: https://wetten.overheid.nl/BWBR0018472/2025-01-01
preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:


    Alzo Wij in overweging genomen hebben, dat het wenselijk is inkomensafhankelijke regelingen, zoals die op het punt
    van wonen, kinderen en zorg, zoveel mogelijk te harmoniseren door een aantal algemene begrippen in die regelingen
    onder te brengen in één nieuwe wet, en de uitvoering van deze regelingen te stroomlijnen door deze waar mogelijk te
    laten plaatsvinden door de Belastingdienst/Toeslagen;


    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0018472/2025-01-01#ArtikelAanhef
name: '#wet_naam'
# De Awir als "Awb van de toeslagen": een eigen procedure voor de beschikking
# op een tegemoetkoming. Art. 1: deze wet geldt voor inkomensafhankelijke
# regelingen; een regeling kiest de procedure met `produces.procedure_id`
# (Zorgtoeslagwet art. 1 onder e: de zorgtoeslag is een tegemoetkoming). De
# Awir noemt zo geen enkele toeslag, en haar haken (art. 16) vuren alleen in
# deze fasen, niet op elke beschikking. Dat de fasen hier staan en niet in de
# tekst, is een keuze in de modellering: de wet regelt het voorschot (art. 16)
# en de toekenning (art. 14 lid 1, art. 19) elk als eigen beschikking op de
# aanvraag. Ontwerpnotitie: packages/cel/ONTWERP-proces-zorgtoeslag.md, par. 3.
# Elk van die besluiten wordt bekendgemaakt (Awb 3:40 en 3:41 gelden per
# besluit), dus elk heeft een eigen fase BEKENDMAKING; daarop haakt Awb 6:8,
# zodat de bezwaartermijn per besluit loopt. Ook dat is een eigen keuze in de
# modellering: de Awir geeft geen lijst van fasen.
procedure:
  - id: tegemoetkoming
    applies_to:
      legal_character: BESCHIKKING
    stages:
      - name: AANVRAAG
        description: De belanghebbende vraagt een tegemoetkoming aan (art. 14 lid 1, art. 15)
      - name: VOORSCHOT
        is: BESLUIT
        description: De Dienst Toeslagen verleent een voorschot (art. 16)
        requires:
          - name: dagtekening_voorschot
            type: date
      - name: VOORSCHOT_BEKENDMAKING
        is: BEKENDMAKING
        description: De beschikking tot verlening van het voorschot wordt bekendgemaakt (Awb 3:40, 3:41)
        requires:
          - name: bekendmaking_datum
            type: date
      - name: TOEKENNING
        is: BESLUIT
        description: De Dienst Toeslagen kent de tegemoetkoming toe (art. 14 lid 1, art. 19)
        requires:
          - name: dagtekening_toekenning
            type: date
      - name: TOEKENNING_BEKENDMAKING
        is: BEKENDMAKING
        description: De beschikking tot toekenning wordt bekendgemaakt (Awb 3:40, 3:41)
        requires:
          - name: bekendmaking_datum
            type: date
articles:
  - number: '1'
    text: >-
      1 Deze wet geldt voor inkomensafhankelijke regelingen.


      2 In afwijking van het eerste lid is deze wet op inkomensafhankelijke regelingen die vóór 1 januari 2006 van kracht
      zijn, slechts van toepassing voor zover dit in de desbetreffende inkomensafhankelijke regeling is bepaald.


      3 Onder inkomensafhankelijke regelingen worden verstaan bij of krachtens wet vastgestelde regelingen die
      natuurlijke personen aanspraak geven op een financiële bijdrage van het Rijk in kosten of bijdrageverplichtingen,
      waarbij de hoogte van de bijdrage in die regelingen afhankelijk is gesteld van draagkracht.
    url: https://wetten.overheid.nl/BWBR0018472/2025-01-01#Artikel1
  - number: '2'
    text: |-
      1 In deze wet en de daarop berustende bepalingen, alsmede in inkomensafhankelijke regelingen, wordt verstaan onder:

      a. belastbaar loon: het belastbare loon bedoeld in [artikel 9 van de Wet op de loonbelasting 1964][ref1], met
      uitzondering van loon dat als een eindheffingsbestanddeel in de zin van [die wet][ref2] is belast;

      b. berekeningsjaar: het kalenderjaar waarop de tegemoetkoming betrekking heeft;

      c. kind: de persoon bedoeld in [artikel 4][ref3];

      d. lidstaat: een Staat die lid is van de Europese Unie of een andere Staat, niet zijnde een lidstaat van de
      Europese Unie, die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte;

      e. medebewoner: de persoon die als ingezetene op hetzelfde woonadres is ingeschreven in de basisregistratie
      personen als de belanghebbende, met dien verstande dat als medebewoner niet wordt aangemerkt:

      1°. de partner van de belanghebbende,

      2°. de persoon die op basis van een schriftelijke overeenkomst met de belanghebbende een deel van de woning huurt,
      tenzij deze een bloed- of aanverwant in de eerste graad is van de belanghebbende of van diens partner,

      3°. degene die tot het huishouden van de onder 2° bedoelde persoon behoort;

      f. partner: de persoon bedoeld in [artikel 3][ref4];

      g.

      h. tegemoetkoming: een financiële bijdrage van het Rijk op grond van een inkomensafhankelijke regeling;

      i. toetsingsinkomen: het inkomen bedoeld in [artikel 8][ref5];

      j. verzamelinkomen: het verzamelinkomen bedoeld in [artikel 2.18 van de Wet inkomstenbelasting 2001][ref6];

      k. vreemdeling: hetgeen daaronder wordt verstaan in de [Vreemdelingenwet 2000][ref7];

      l. inspecteur: de inspecteur, bedoeld in
      [artikel 2, derde lid, onderdeel b, van de Algemene wet inzake rijksbelastingen][ref8];

      m. niet in Nederland belastbaar inkomen: inkomen dat niet in het verzamelinkomen of het
      belastbare loon is begrepen omdat het niet behoort tot het Nederlandse inkomen, bedoeld in
      [artikel 7.1 van de Wet inkomstenbelasting 2001][ref9], of omdat het is vrijgesteld op grond van bepalingen van
      interregionaal of internationaal recht;

      n. ontvanger: de ontvanger, bedoeld in [artikel 2, eerste lid, onderdeel i, van de Invorderingswet 1990][ref10];

      o. inkomensgegeven: inkomensgegeven als bedoeld in
      [artikel 21, onderdeel e, van de Algemene wet inzake rijksbelastingen][ref11];

      p. burgerservicenummer: het nummer, bedoeld in
      [artikel 1, onderdeel b, van de Wet algemene bepalingen burgerservicenummer][ref12];

      q. *uitreiziger:* persoon ten aanzien van wie op grond van een melding van de opsporingsdiensten of inlichtingen-
      en veiligheidsdiensten is gebleken dat het gegronde vermoeden bestaat dat deze persoon zich buiten Nederland
      bevindt met het doel om zich aan te sluiten bij een organisatie die is geplaatst op de lijst van organisaties,
      bedoeld in [artikel 14, vierde lid, van de Rijkswet op het Nederlanderschap][ref13].

      2 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      - *Onze Minister:* Onze Minister van Financiën;
      - *beschikking tot vaststelling:* beschikking tot toekenning van de tegemoetkoming, beschikking tot herziening van
      de tegemoetkoming en beschikking tot herziening van een voorschot;
      - *beschikking tot terugvordering:* beschikking tot vaststelling van het bedrag dat wordt teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002471
      [ref3]: https://wetten.overheid.nl/BWBR0018472#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0018472#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0018472#Artikel8
