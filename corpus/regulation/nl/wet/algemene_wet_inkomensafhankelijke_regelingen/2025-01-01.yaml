  - number: '45'
    text: |-
      1 Een tegemoetkoming is niet vatbaar voor vervreemding, verpanding, belening of beslag, waaronder begrepen beslag
      ingevolge faillissement of toepassing van de schuldsaneringsregeling natuurlijke personen, tenzij het betreft
      beslag wegens:

      a. een vordering tot nakoming van een betalingsverplichting wegens een geleverde prestatie waarbij de
      betalingsverplichting ter zake van die prestatie oorzaak is voor de tegemoetkoming;

      b. een door de belanghebbende verschuldigd bedrag aan terugvordering dat betrekking heeft op dezelfde
      inkomensafhankelijke regeling.

      De uitzondering opgenomen in onderdeel a van dit lid is niet van toepassing met betrekking tot een tegemoetkoming
      in het kader van de [Wet op het kindgebonden budget][ref1].

      2 Bij een beslag als bedoeld in het eerste lid is [artikel 475c, tweede lid][ref2], niet van toepassing.

      3 Elk beding dat strijdt met het eerste lid is nietig.


      [ref1]: https://wetten.overheid.nl/BWBR0022751
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
    url: https://wetten.overheid.nl/BWBR0018472/2025-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0022751
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475c
  - number: '46'
    text: >-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de samenloop van tegemoetkomingen
      met tegemoetkomingen op grond van een buitenlandse regeling of een regeling van een volkenrechtelijke organisatie.
    url: https://wetten.overheid.nl/BWBR0018472/2025-01-01#Artikel46
  - number: '47'
    text: |-
      1 Onze Minister is bevoegd in overeenstemming met Onze Ministers die het aangaat voor bepaalde gevallen of groepen
      van gevallen beleidsregels te geven om tegemoet te komen aan onbillijkheden van overwegende aard, die zich bij de
      toepassing van deze wet, de daarop berustende bepalingen of een inkomensafhankelijke regeling mochten voordoen.

      2 Onze Minister is bevoegd in overeenstemming met Onze Ministers die het aangaat bij
      ministeriële regeling voor groepen van gevallen tegemoet te komen aan onbillijkheden van
      overwegende aard, die zich bij de toepassing van [artikel 7, derde of vierde lid][ref1],
      of bij de toepassing van [artikel 3, eerste lid, van de Wet op de zorgtoeslag][ref2] of
      [artikel 1, vierde lid, van de Wet op het kindgebonden budget][ref3] mochten voordoen.

      3 Het ontwerp van een krachtens het tweede lid vast te stellen ministeriële regeling wordt aan beide Kamers der
      Staten-Generaal overgelegd. De ministeriële regeling wordt niet eerder vastgesteld dan twee weken na de overlegging
      van het ontwerp. Indien binnen die termijn door of namens een van de Kamers of door ten minste een vijfde van
      het grondwettelijk aantal leden van een van de Kamers de wens te kennen wordt gegeven dat het onderwerp van de
      ministeriële regeling bij wet wordt geregeld, wordt een daartoe strekkend voorstel van wet zo spoedig mogelijk
      ingediend en wordt de ministeriële regeling niet vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0018451#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0022751#Artikel1
    url: https://wetten.overheid.nl/BWBR0018472/2025-01-01#Artikel47
