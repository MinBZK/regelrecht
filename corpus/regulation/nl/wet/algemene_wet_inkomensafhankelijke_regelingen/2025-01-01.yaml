  - number: '37'
    text: |-
      1 Een bezwaar tegen de toekenning of herziening van een tegemoetkoming wordt, tenzij uit het bezwaarschrift het
      tegendeel blijkt, geacht mede te zijn gericht tegen de beschikking tot terugvordering die in hetzelfde geschrift is
      vervat en die samenhangt met die beschikking tot toekenning of herziening van een tegemoetkoming.

      2 Een bezwaar tegen de beschikking tot terugvordering wordt, tenzij uit het bezwaarschrift het tegendeel blijkt,
      geacht mede te zijn gericht tegen de toekenning of herziening van een tegemoetkoming die in hetzelfde geschrift is
      vervat en die samenhangt met die beschikking tot terugvordering.

      3 Een bezwaar tegen de toekenning of herziening van een tegemoetkoming wordt, tenzij uit het bezwaarschrift het
      tegendeel blijkt, geacht mede te zijn gericht tegen de toekenning of herziening van andere tegemoetkomingen over
      hetzelfde berekeningsjaar die bij hetzelfde geschrift zijn toegekend of herzien, alsmede tegen de in verband
      daarmee berekende rente.

      4 Indien een tegemoetkoming is herzien en naar aanleiding daarvan een bestuurlijke boete is opgelegd die is vervat
      in hetzelfde geschrift als de herziening, wordt een bezwaarschrift tegen de herziening geacht mede te zijn gericht
      tegen de boete.

      5 Een bezwaar tegen de toekenning van een tegemoetkoming wordt, tenzij uit het bezwaarschrift het tegendeel blijkt,
      geacht mede te zijn gericht tegen de voor bezwaar vatbare beschikking, bedoeld in [artikel 14, derde lid][ref1],
      die is vervat in hetzelfde geschrift.

      6 Een bezwaar tegen de voor bezwaar vatbare beschikking, bedoeld in [artikel 14, derde lid][ref2], wordt, tenzij
      uit het bezwaarschrift het tegendeel blijkt, geacht mede te zijn gericht tegen de toekenning van een tegemoetkoming
      die is vervat in hetzelfde geschrift.

      7 Indien de Dienst Toeslagen besluit tot openbaarmaking van een besluit tot oplegging van een bestuurlijke boete
      als bedoeld in [artikel 42a][ref3] en beide besluiten in één geschrift zijn vervat, wordt een bezwaarschrift tegen
      de boete geacht mede te zijn gericht tegen de openbaarmaking ervan, tenzij uit het bezwaarschrift het tegendeel
      blijkt.

      8 De Dienst Toeslagen kan uitspraken op bezwaar in de in het eerste tot en met zevende lid bedoelde gevallen
      vervatten in één geschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel14
