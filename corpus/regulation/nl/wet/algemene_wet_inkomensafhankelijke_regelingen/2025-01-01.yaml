  - number: '13'
    text: |-
      1 In afwijking van [artikel 2:14, eerste lid, van de Algemene wet bestuursrecht][ref1] wordt in het verkeer tussen
      belanghebbenden en de Dienst Toeslagen een bericht uitsluitend elektronisch verzonden.

      2 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de wijze waarop het elektronische
      berichtenverkeer plaatsvindt.

      3 Bij ministeriële regeling kunnen berichten en groepen van belanghebbenden worden aangewezen waarvoor, alsmede
      omstandigheden worden aangewezen waaronder, het berichtenverkeer kan plaatsvinden anders dan langs elektronische
      weg.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel214
    url: https://wetten.overheid.nl/BWBR0018472/2025-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 2:14
  - number: 13a
    text: |-
      1 In afwijking van [artikel 2:7, tweede lid, van de Algemene wet bestuursrecht][ref1] kunnen
      bij ministeriële regeling berichten, groepen van belanghebbenden of partijen als bedoeld in
      [artikel 38, eerste, vierde of negende lid][ref2], of omstandigheden worden aangewezen waarvoor, voor wie,
      onderscheidenlijk waaronder, geldt dat een belanghebbende of een partij als bedoeld in artikel 38, eerste, vierde
      of negende lid, berichten uitsluitend langs elektronische weg dan wel uitsluitend anders dan langs elektronische
      weg aan de Dienst Toeslagen verzendt.

      2 Het ontwerp van een ministeriële regeling als bedoeld in het eerste lid wordt ten minste vier weken voordat de
      regeling wordt vastgesteld, overgelegd aan de beide kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0018472#Artikel38
    url: https://wetten.overheid.nl/BWBR0018472/2025-01-01#Artikel13a
