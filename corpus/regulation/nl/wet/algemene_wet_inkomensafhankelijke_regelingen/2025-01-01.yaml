          # Lid 1, onderdeel b: "berekeningsjaar: het kalenderjaar waarop de
          # tegemoetkoming betrekking heeft". Aanname: de tegemoetkoming die
          # wordt berekend heeft betrekking op het kalenderjaar van de
          # rekendatum. Voor een voorschot in het lopende jaar bestaat het
          # inkomensgegeven over dat jaar nog niet; artikel 16 (voorschot op
