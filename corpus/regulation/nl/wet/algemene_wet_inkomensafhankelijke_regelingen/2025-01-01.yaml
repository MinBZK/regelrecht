    text: |-
      1 Degene die op grond van deze wet en de daarop berustende bepalingen gehouden is tot het verstrekken van gegevens
      of inlichtingen en aan wiens opzet of grove schuld het is te wijten dat geen gegevens of inlichtingen zijn
      verstrekt dan wel degene aan wiens opzet of grove schuld het is te wijten dat onjuiste of onvolledige gegevens of
      inlichtingen zijn verstrekt, begaat een vergrijp ter zake waarvan de Dienst Toeslagen hem een bestuurlijke boete
      kan opleggen van ten hoogste 100 percent van het bedrag dat van de belanghebbende in verband daarmee is of zou
      zijn teruggevorderd.

      2 De bestuurlijke boete, bedoeld in het eerste lid, bedraagt ten hoogste 150 percent van het aldaar bedoelde bedrag
      indien het aan opzet of grove schuld van de belanghebbende, zijn partner of een medebewoner is te wijten dat geen,
      dan wel onjuiste of onvolledige gegevens en inlichtingen zijn verstrekt, mits:

      a. een eerdere overtreding van de belanghebbende, zijn partner of een medebewoner is geconstateerd, en

      b. de bestuurlijke boete of strafrechtelijke sanctie wegens de eerdere overtreding, bedoeld in onderdeel a,
      onherroepelijk is geworden binnen een periode van vijf jaren voorafgaand aan de dag van constatering van de
      overtreding waarvoor de bestuurlijke boete, bedoeld in het eerste lid, wordt opgelegd.

      3 Indien de tegemoetkoming wordt herzien als gevolg van:

      a. een eerste bepaling of herziening van het inkomensgegeven, bedoeld in
      [artikel 21, onderdeel e, onder 1°, van de Algemene wet inzake rijksbelastingen][ref1], ingeval er geen
      inkomstenbelasting verschuldigd is, dan wel de aanslag inkomstenbelasting is vastgesteld op nihil;

      b. een vaststelling of herziening van een beschikking niet in Nederland belastbaar inkomen;

      worden onder de gegevens of inlichtingen, bedoeld in het tweede lid, mede verstaan de gegevens of inlichtingen die
      ten behoeve van deze beschikking aan de inspecteur zijn verstrekt dan wel hadden moeten worden verstrekt.

      4 Bij het opleggen van de bestuurlijke boete, bedoeld in het eerste lid, is [hoofdstuk VIIIA, afdeling 2][ref2],
      met uitzondering van de [artikelen 67n][ref3] en [67pa, van de Algemene wet inzake rijksbelastingen][ref4] van
      overeenkomstige toepassing.

      5 In afwijking van het eerste lid kan de Dienst Toeslagen ter zake van een vergrijp ten aanzien van een verplichting
      als bedoeld in [artikel 38, eerste, tweede of vierde lid][ref5], een bestuurlijke boete opleggen van ten hoogste
      het bedrag van de vierde categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref6].

      6 In afwijking in zoverre van [artikel 5:45 van de Algemene wet bestuursrecht][ref7] vervalt de bevoegdheid tot het
      opleggen van de bestuurlijke boete, bedoeld in het eerste lid, vijf jaren nadat de overtreding is begaan.


