        artikel: 1.1.1
      - id: ref8
        bwb_id: BWBR0035362
        artikel: 2.3.5
    machine_readable:
      # Art 3 lid 1 definieert partner via meerdere categorieën (a, b.1°-7°, c)
      # Lid 1a: huwelijk/geregistreerd partnerschap (niet duurzaam gescheiden)
      # Lid 1b.1°: IB-partnerkeuze
      # Lid 1b.2°: samenlevingscontract (notarieel)
      # Lid 1b.3°: gemeenschappelijk kind
      # Lid 1b.4°: erkend kind
      # Lid 1b.5°: partner in voorafgaand jaar
      # Lid 1b.6°: pensioenregistratie
      # Lid 1b.7°: gezamenlijke eigen woning met hypotheek
      # Lid 1c: gezamenlijke huishouding > 6 maanden (met uitzonderingen)
      definitions:
        geldige_partnertypen:
          value:
            - HUWELIJK
            - GEREGISTREERD_PARTNERSCHAP
            - IB_PARTNERKEUZE
            - SAMENLEVINGSCONTRACT
            - GEMEENSCHAPPELIJK_KIND
            - ERKEND_KIND
            - PARTNER_VOORAFGAAND_JAAR
            - PENSIOENREGISTRATIE
            - GEZAMENLIJKE_EIGEN_WONING
            - GEZAMENLIJKE_HUISHOUDING
      execution:
        parameters:
          - name: bsn
            type: string
            required: true
        input:
          - name: partnerschap_type
            type: string
            source: {}
          # Lid 1: "De partner van de belanghebbende is degene die [...]".
          # Wie die persoon is, staat in de registratie; zonder partner is
          # daar niemand opgenomen (null).
          - name: partner_bsn
            type: string
            nullable: true
            source: {}
        output:
          - name: heeft_toeslagpartner
            type: boolean
          # Het burgerservicenummer van "degene" die lid 1 als partner
          # aanwijst. Afwezig (null) als er volgens lid 1 geen partner is, ook
          # als de registratie wel iemand noemt: een persoon die onder geen van
          # de categorieën valt, is voor deze wet geen partner. Wetten die de
          # draagkracht van de partner meetellen (artikel 7, en bijvoorbeeld
          # artikel 2 en 3 van de Wet op de zorgtoeslag) roepen daarmee de
          # bronnen van die partner aan; bij null slaat de engine die aanroep
          # over (RFC-036).
          - name: bsn_toeslagpartner
            type: string
            nullable: true
        actions:
          - output: heeft_toeslagpartner
            value:
              operation: IN
              subject: $partnerschap_type
              value: $geldige_partnertypen
          - output: bsn_toeslagpartner
            value:
              operation: IF
              cases:
                - when:
                    operation: EQUALS
                    subject: $heeft_toeslagpartner
                    value: true
                  then: $partner_bsn
  - number: 3a
    text: |-
      In afwijking van [artikel 3, eerste lid][ref1], wordt degene die ingevolge
      [artikel 5a, eerste lid, onderdeel a, en derde tot en met zevende lid, van de Algemene wet inzake
      rijksbelastingen][ref2]
      als partner van de belanghebbende wordt aangemerkt, op verzoek van de belanghebbende voor de toepassing van deze
      wet niet als partner aangemerkt gedurende het verblijf van de belanghebbende in een instelling die op grond van
      de [artikelen 1.1.1][ref3], [2.3.3][ref4] en [2.3.5 van de Wet maatschappelijke ondersteuning 2015][ref5] opvang
      verleent voor gevallen waarbij sprake is van een risico voor veiligheid als gevolg van huiselijk geweld.


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel3
