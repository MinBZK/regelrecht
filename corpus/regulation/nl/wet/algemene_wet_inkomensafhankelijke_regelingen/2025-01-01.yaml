  - number: 42a
    text: |-
      1 De Dienst Toeslagen maakt openbaar het besluit tot oplegging van een bestuurlijke boete die is opgelegd aan een
      overtreder als bedoeld in [artikel 5:1, tweede lid, van de Algemene wet bestuursrecht][ref1] vanwege een vergrijp
      als bedoeld in [artikel 41][ref2] dat door de overtreder opzettelijk is begaan tijdens de door hem beroepsmatig
      of bedrijfsmatig verleende bijstand bij het aanvragen of wijzigen van een tegemoetkoming door een belanghebbende,
      binnen tien werkdagen na het laatste van de volgende momenten:

      a. het moment van onherroepelijk worden van het besluit tot openbaarmaking;

      b. het moment van onherroepelijk worden van het besluit tot oplegging van de bestuurlijke boete.

      2 De Dienst Toeslagen stelt de overtreder, bedoeld in het eerste lid, in de gelegenheid een zienswijze naar voren
      te brengen voordat de Dienst Toeslagen besluit tot openbaarmaking.

      3 De Dienst Toeslagen gaat niet over tot openbaarmaking als bedoeld in het eerste lid indien de overtreder, bedoeld
      in het eerste lid, daardoor onevenredig in zijn belang zou worden getroffen.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld voor de toepassing van het tweede en derde lid.

      5 Indien de Dienst Toeslagen het besluit tot oplegging van de bestuurlijke boete, bedoeld in het eerste lid,
      openbaar maakt, maakt hij tevens de volgende gegevens op de website van de Belastingdienst openbaar, voor zover
      deze niet reeds blijken uit het besluit tot oplegging van de bestuurlijke boete:

      a. de naam van de overtreder;

      b. de wettelijke grondslag van de boete;

      c. het bedrag van de boete;

      d. de dagtekening van de boete;

      e. het jaar waarin de beboetbare gedraging is begaan;

      f. de naam van de plaats waar de overtreder het vergrijp, bedoeld in het eerste lid, heeft begaan.

      6 Het besluit tot oplegging van de bestuurlijke boete, bedoeld in het eerste lid, blijft gedurende een periode van
      vijf jaren na openbaarmaking beschikbaar op de website van de Belastingdienst.

      7 De gegevens, bedoeld in het vijfde lid, blijven gedurende een periode van vijf jaren na openbaarmaking
      beschikbaar op de website van de Belastingdienst.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel51
