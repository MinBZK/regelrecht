  - number: 38a
    text: >-
      1 De Dienst Toeslagen kan onder bij of krachtens algemene maatregel van bestuur te bepalen voorwaarden ten behoeve
      van bij algemene maatregel van bestuur aan te wijzen voorzieningen die de dienstverlening voortvloeiende uit de
      uitvoering van deze wet verbeteren, gegevens verstrekken die voor deze dienstverlening noodzakelijk zijn.


      2 De Dienst Toeslagen verstrekt aan de bij algemene maatregel van bestuur aangewezen bestuursorganen waarmee op
      basis van een convenant wordt samengewerkt de gegevens waarvan bij die algemene maatregel van bestuur is bepaald
      dat verstrekking noodzakelijk is voor de goede vervulling van een publiekrechtelijke taak van het betreffende
      bestuursorgaan.


      3 De Dienst Toeslagen verstrekt aan de inspectie belastingen, toeslagen en douane gegevens die noodzakelijk zijn
      voor de uitvoering van de taken van die inspectie. Het is deze inspectie niet toegestaan verkregen gegevens die van
      vertrouwelijke aard zijn aan derden te verstrekken.
    url: https://wetten.overheid.nl/BWBR0018472/2025-01-01#Artikel38a
  - number: '39'
    text: |-
      1 De Dienst Toeslagen en de inspecteur en de ontvanger wisselen de gegevens en inlichtingen uit die nodig zijn
      voor de uitvoering van deze wet en voor de heffing en invordering van rijksbelastingen, onder vermelding van het
      burgerservicenummer van degene op wie de gegevens of inlichtingen betrekking hebben.

      2 Voor de toepassing van de [artikelen 9a][ref1], [16, zevende lid, eerste volzin, aanhef en onderdeel c][ref2],
      [23, eerste lid, aanhef en onderdeel c][ref3] en [24a, aanhef en onderdeel c][ref4], wisselen
      de Dienst Toeslagen en de directeur-generaal Belastingdienst de gegevens en inlichtingen uit die
      nodig zijn voor de uitvoering door de directeur-generaal Belastingdienst of zijn ondergeschikten
      van de werkzaamheden ten behoeve van de Algemene Inlichtingen- en Veiligheidsdienst, bedoeld in
      [artikel 60, eerste en tweede lid, van de Wet op de inlichtingen- en veiligheidsdiensten 2002][ref5].

      3 Onze Minister verstrekt aan Onze Ministers wie het aangaat de inlichtingen die zij nodig hebben voor de
      beleidsvorming en beleidsevaluatie alsmede voor het volgen van de ontwikkeling van de uitgaven, met betrekking tot
      inkomensafhankelijke regelingen.

      4 Onze Ministers wie het aangaat verstrekken aan Onze Minister de inlichtingen die hij nodig heeft voor de
      uitvoering van inkomensafhankelijke regelingen door de Dienst Toeslagen.


