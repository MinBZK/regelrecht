    text: |-
      Ten dienste van de vervolging en berechting van de feiten waarvan de ambtenaren, bedoeld in [artikel 44][ref1],
      zijn belast met de opsporing kan Onze Minister, in overeenstemming met Onze Minister van Justitie en Veiligheid,
      ambtenaren van de Dienst Toeslagen aanwijzen die het contact onderhouden met het openbaar ministerie.


