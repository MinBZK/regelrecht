  - number: 47a
    text: >-
      Onze Minister is bevoegd in overeenstemming met Onze Ministers die het aangaat bij ministeriële regeling regels
      te stellen ter ondersteuning van een belanghebbende bij het verwezenlijken van rechten of het nakomen van
      verplichtingen die uit deze wet, de daarop berustende bepalingen of een inkomensafhankelijke regeling voortvloeien.
    url: https://wetten.overheid.nl/BWBR0018472/2025-01-01#Artikel47a
  - number: '48'
    text: >-
      Onze Minister zendt, in overeenstemming met Onze Ministers wie het mede aangaat, binnen drie jaar na de
      inwerkingtreding van deze wet, en vervolgens vijfjaarlijks, aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0018472/2025-01-01#Artikel48
  - number: '50'
    text: >-
      Deze wet treedt in werking op 1 september 2005 en geldt voor berekeningsjaren die aanvangen op of na 1 januari
      2006.
    url: https://wetten.overheid.nl/BWBR0018472/2025-01-01#Artikel50
