  - number: '4'
    text: |-
      1 Kind is de bloedverwant of aanverwant in de neergaande lijn van de belanghebbende of zijn partner, die in
      belangrijke mate wordt onderhouden door de belanghebbende of zijn partner en als ingezetene op hetzelfde woonadres
      als de belanghebbende is ingeschreven in de basisregistratie personen. Met een bloedverwant of aanverwant in de
      neergaande lijn wordt gelijkgesteld een pleegkind.

      2 De in het eerste lid opgenomen voorwaarde van inschrijving in de basisregistratie personen geldt niet gedurende
      de periode waarin de aldaar bedoelde persoon tegelijkertijd tot de huishoudens van zijn beide ouders behoort en hij
      op hetzelfde woonadres als een van die ouders is ingeschreven in de basisregistratie personen. Voor de toepassing
      van de eerste zin behoort een kind tegelijkertijd tot het huishouden van diens beide ouders indien hij binnen het
      kalenderjaar in nagenoeg gelijke mate in elk van beide huishoudens verblijft. Aan deze voorwaarde wordt in ieder
      geval voldaan wanneer het kind 156 dagen van het kalenderjaar in elk van beide huishoudens verblijft. Indien het
      kind niet gedurende het gehele kalenderjaar, maar wel gedurende ten minste een maand, in elk van beide huishoudens
      verblijft, wordt het aantal dagen, genoemd in de derde zin, naar tijdsgelang herrekend.

      3 Een kind wordt in belangrijke mate onderhouden als bedoeld in het eerste lid indien is voldaan aan de regels
      gesteld krachtens [artikel 1.5 van de Wet inkomstenbelasting 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel1.5
    url: https://wetten.overheid.nl/BWBR0018472/2025-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '1.5'
  - number: '5'
    text: >-
      Voor de toepassing van deze wet en de daarop berustende bepalingen alsmede voor de toepassing van
      inkomensafhankelijke regelingen, wordt een wijziging in de omstandigheden en van de leeftijd van de belanghebbende,
      de partner of een medebewoner die zich voordoet na de eerste dag van de maand, in aanmerking genomen vanaf de
      eerste dag van de daaropvolgende maand.
    url: https://wetten.overheid.nl/BWBR0018472/2025-01-01#Artikel5
  - number: '6'
    text: >-
      1 Voor de toepassing van deze wet en de daarop berustende bepalingen wordt met de basisregistratie personen
      gelijkgesteld een daarmee naar aard en strekking overeenkomende registratie buiten Nederland.


      2 Bij regeling van Onze Minister in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid kunnen
      regels worden gesteld op basis waarvan iemand die niet in Nederland woont, geacht wordt op zijn woonadres te zijn
      ingeschreven in een naar aard en strekking met de basisregistratie personen overeenkomende registratie buiten
      Nederland.


      3 Bij regeling van Onze Minister in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid kunnen
      regels worden gesteld op basis waarvan iemand die in de basisregistratie personen niet op zijn woonadres is
      ingeschreven, geacht wordt daarin wel op dat adres te zijn ingeschreven.


      4 Voor de toepassing van het tweede en derde lid wordt naar de omstandigheden beoordeeld waar iemand woont.
    url: https://wetten.overheid.nl/BWBR0018472/2025-01-01#Artikel6
  - number: '7'
    text: |-
      1 Ter bepaling van de draagkracht voor de toepassing van een inkomensafhankelijke regeling wordt het
      toetsingsinkomen, bedoeld in [artikel 8][ref1], van de belanghebbende en dat van zijn partner in aanmerking
      genomen.

      2 Indien in een inkomensafhankelijke regeling is bepaald dat naast de draagkracht van de belanghebbende en diens
      partner ook de draagkracht van medebewoners van belang is voor de beoordeling van de aanspraak op of de bepaling
      van de hoogte van een tegemoetkoming, wordt mede het toetsingsinkomen van de medebewoners in aanmerking genomen.

      3 Indien in een inkomensafhankelijke regeling de aanspraak op een tegemoetkoming mede afhankelijk is gesteld
      van het vermogen, bestaat geen aanspraak op een tegemoetkoming, indien de rendementsgrondslag, bedoeld
      in [artikel 5.3 van de Wet inkomstenbelasting 2001][ref2], van de belanghebbende aan het begin van het
      berekeningsjaar meer bedraagt dan € 37.395, dan wel meer zou bedragen dan dit bedrag indien geen rekening
      wordt gehouden met de vrijstelling, bedoeld in [artikel 5.13 van de Wet inkomstenbelasting 2001][ref3].
      Indien de belanghebbende het gehele berekeningsjaar dezelfde partner heeft, bestaat geen aanspraak op een
      tegemoetkoming indien de belanghebbende en zijn partner aan het begin van het berekeningsjaar een gezamenlijke
      rendementsgrondslag als bedoeld in artikel 5.3 van de Wet inkomstenbelasting 2001 hebben van meer dan € 74.790.
      [Artikel 10.1, eerste lid, van de Wet inkomstenbelasting 2001][ref4] is van overeenkomstige toepassing op de
      bedragen, genoemd in dit lid.

      4 Indien in een inkomensafhankelijke regeling de aanspraak op een tegemoetkoming mede afhankelijk is
      gesteld van het vermogen van medebewoners, bestaat tevens geen aanspraak op een tegemoetkoming indien de
      rendementsgrondslag van een medebewoner aan het begin van het berekeningsjaar meer bedraagt dan € 37.395,
      dan wel meer zou bedragen dan dit bedrag indien geen rekening wordt gehouden met de vrijstelling, bedoeld
      in [artikel 5.13 van de Wet inkomstenbelasting 2001][ref5]. Het bepaalde in de eerste en tweede volzin
      geldt alleen ten aanzien van degenen van wie het medebewonerschap het gehele berekeningsjaar heeft geduurd.
      [Artikel 10.1, eerste lid, van de Wet inkomstenbelasting 2001][ref6] is van overeenkomstige toepassing op de
      bedragen, genoemd in dit lid.

      5 Voor de toepassing van het derde en vierde lid alsmede voor de toepassing van bepalingen in inkomensafhankelijke
      regelingen die verwijzen naar [artikel 5.3 van de Wet inkomstenbelasting 2001][ref7], worden bezittingen en
      schulden die ten grondslag liggen aan het niet in Nederland belastbare inkomen, begrepen in het bedrag aan
      rendementsgrondslag.

      6 Het toetsingsinkomen van een medebewoner die een eerstegraads bloed- of aanverwant in de neergaande lijn of
      een pleegkind is van de belanghebbende, van zijn partner, of van een medebewoner, en die bij de aanvang van het
      berekeningsjaar de leeftijd van 23 jaar niet heeft bereikt, wordt voor de toepassing van het tweede lid slechts in
      aanmerking genomen voor zover het meer bedraagt dan € 6.042.

      7 Met betrekking tot het bedrag vermeld in het zesde lid zijn de [artikelen 10.1][ref8] en
      [10.2 van de Wet inkomstenbelasting 2001][ref9] van overeenkomstige toepassing.


