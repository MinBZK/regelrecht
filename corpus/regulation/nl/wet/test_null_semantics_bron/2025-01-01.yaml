---
$schema: >-
  https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.5.7/schema/v0.5.7/schema.json
$id: test_null_semantics_bron
name: Testwet afwezig en onbekend (bron)
regulatory_layer: WET
bwb_id: BWBR9999909
publication_date: '2025-01-01'
valid_from: '2025-01-01'
url: https://example.com/test_null_semantics_bron

articles:
  - number: '1'
    url: https://example.com/test_null_semantics_bron/1
    text: >-
      Het geboortejaar is het in de registratie opgenomen geboortejaar. Een
      aanvraag past indien het aangevraagde bedrag meer dan honderd bedraagt.
    machine_readable:
      # Een afnemende wet vraagt deze wet om `geboortejaar` en geeft daarbij
      # enkel `bsn` mee. `aanvraag_bedrag` is een formulierveld dat die afnemer
      # niet altijd heeft; het staat daarom als optioneel gemarkeerd. Geeft de
      # aanroeper het niet mee, dan is `past_aanvraag` onbekend bij gebrek aan
      # dat bedrag; de engine vult het nergens uit aan (RFC-036). Geeft de
      # aanroeper er null voor mee, dan faalt de vergelijking: "geen bedrag"
      # is niet meer dan honderd.
      execution:
        parameters:
          - name: bsn
            type: string
            required: true
          - name: aanvraag_bedrag
            type: number
            required: false
        input:
          - name: geboortejaar
            type: number
            source: {}
            description: Geboortejaar uit de registratie, buiten de wet opgelost.
        output:
          - name: geboortejaar
            type: number
          - name: past_aanvraag
            type: boolean
        actions:
          - output: geboortejaar
            value: $geboortejaar
          - output: past_aanvraag
            value:
              operation: GREATER_THAN
              subject: $aanvraag_bedrag
              value: 100
