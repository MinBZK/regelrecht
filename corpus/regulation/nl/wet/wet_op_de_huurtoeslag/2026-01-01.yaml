    text: >-
      De Dienst Toeslagen verstrekt op verzoek aan burgemeester en wethouders de voor de uitvoering ten
      behoeve van het doen van uitkeringen uit een bij verordening op basis van artikel 108 van de
      Gemeentewet ingesteld gemeentelijk woonlastenfonds benodigde gegevens behoudens het bepaalde in
      artikel 38a van de Algemene wet inkomensafhankelijke regelingen , uitsluitend ten behoeve van dat
      woonlastenfonds.
  - number: '49'
    url: https://wetten.overheid.nl/BWBR0008659/2026-01-01#Artikel49
    text: >-
      1 De Dienst Toeslagen kan voor de huur van nader door Onze Minister aangewezen woningen of
      categorieën van woningen een huurtoeslag toekennen in afwijking van de artikelen 1, onder c en d ,
      en 11 , ten behoeve van experimenten die naar het oordeel van Onze Minister in het belang van de
      volkshuisvesting zijn. Onze Minister bepaalt hierbij vooraf de duur van het experiment. 2 De Dienst
      Toeslagen kan op verzoek van Onze Minister na afsluiting van het experiment af blijven wijken van de
      in het eerste lid genoemde artikelen, voor zover het de bewoners betreft die tijdens de duur van het
      experiment een huurtoeslag ontvingen met toepassing van het eerste lid en zolang een door Onze
      Minister op basis van het experiment noodzakelijk geoordeelde wijziging van deze wet nog niet van
      kracht is geworden en in werking is getreden.
  - number: '50'
    url: https://wetten.overheid.nl/BWBR0008659/2026-01-01#Artikel50
    text: >-
      De voordracht voor een algemene maatregel van bestuur krachtens de artikelen 21, eerste lid , en 27,
      achtste lid , wordt niet gedaan dan nadat het ontwerp aan de beide kamers der Staten-Generaal is
      overgelegd en sedert die overlegging vier weken zijn verstreken.
