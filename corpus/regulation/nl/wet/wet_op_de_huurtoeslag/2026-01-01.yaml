                  - $OPSLAG_BASISHUUR
              - $verlaging_basishuur
  - number: '17'
    url: https://wetten.overheid.nl/BWBR0008659/2026-01-01#Artikel17
    text: >-
      1 Het minimum-inkomensijkpunt wordt verkregen door: a. voor een eenpersoonshuishouden: de uitkomst
      van het bedrag van het bruto- ouderdomspensioen voor de pensioengerechtigde, bedoeld in artikel 9,
      eerste lid, onder a, van de Algemene Ouderdomswet , zoals dat bedrag naar redelijke verwachting in
      het berekeningsjaar zal luiden, vermeerderd met het bedrag van de bruto-vakantie-uitkering,
      vastgesteld overeenkomstig artikel 29, eerste lid, aanhef en onder a, van die wet , zoals dat bedrag
      naar redelijke verwachting in het berekeningsjaar zal luiden, te herrekenen naar een jaarinkomen in
      het berekeningsjaar en dat jaarinkomen te vermeerderen met € 2 340; b. voor een
      meerpersoonshuishouden: de uitkomst van twee maal het bedrag van het bruto- ouderdomspensioen voor
      de pensioengerechtigde, bedoeld in artikel 9, eerste lid, onder b, van de Algemene Ouderdomswet ,
      zoals dat bedrag naar redelijke verwachting in het berekeningsjaar zal luiden, vermeerderd met het
      bedrag van de bruto-vakantie-uitkering, vastgesteld overeenkomstig artikel 29, eerste lid, aanhef en
      onder b, van die wet , zoals dat bedrag naar redelijke verwachting in het berekeningsjaar zal
      luiden, te herrekenen naar een jaarinkomen in het berekeningsjaar en dat jaarinkomen te vermeerderen
      met € 2 512. 2 Bij het minimum-inkomensijkpunt behoort een normhuur van € 252,49. 3 De normhuur,
      bedoeld in het tweede lid, wordt verlaagd met: a. € 1,82 als sprake is van een
      eenpersoonshuishouden, en b. € 3,63 als sprake is van een meerpersoonshuishouden. 4 Het in het
      tweede lid genoemde bedrag wordt met ingang van 1 januari van elk jaar gewijzigd overeenkomstig
      artikel 27 .
    machine_readable:
      definitions:
        OPHOGING_EENPERSOONS:
          value: 234000
          description: 'Art. 17 lid 1 onder a: EUR 2 340'
        OPHOGING_MEERPERSOONS:
          value: 251200
          description: 'Art. 17 lid 1 onder b: EUR 2 512'
        NORMHUUR_BIJ_IJKPUNT:
          value: 25249
          description: 'Art. 17 lid 2: EUR 252,49 (geindexeerd Stcrt. 2025, 39783)'
        VERLAGING_EENPERSOONS:
          value: 182
          description: 'Art. 17 lid 3 onder a: EUR 1,82'
        VERLAGING_MEERPERSOONS:
          value: 363
          description: 'Art. 17 lid 3 onder b: EUR 3,63'
      execution:
        produces:
          legal_character: WAARDEBEPALING
          decision_type: GEEN_BESLUIT
        parameters:
          - name: aow_bruto_jaarbedrag_alleenstaande
            type: amount
            required: true
            type_spec:
              unit: eurocent
            description: Bruto-ouderdomspensioen art. 9 lid 1 onder a AOW plus vakantie-uitkering
              art. 29 lid 1 onder a AOW, naar redelijke verwachting in het berekeningsjaar, herrekend
