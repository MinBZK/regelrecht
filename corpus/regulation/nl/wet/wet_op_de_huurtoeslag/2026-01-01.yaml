    text: >-
      1 Bij ministeriële regeling worden met ingang van 1 januari van elk jaar de bedragen, genoemd in de
      artikelen 13, eerste lid, onderdeel a (maximale huurgrens), en 14, eerste lid (norminkomen),
      gewijzigd met de factor, bedoeld in artikel 10.2 van de Wet inkomstenbelasting 2001 , met dien
      verstande dat in het eerste en tweede lid van laatstgenoemd artikel voor «kalenderjaar» telkens
      wordt gelezen «berekeningsjaar» en dat in het tweede lid van dat artikel voor «Consumentenprijsindex
      Alle Huishoudens afgeleid» wordt gelezen «Consumentenprijsindex Alle Huishoudens». 2 Naast de
      wijziging op grond van het eerste lid kan het bedrag, genoemd in artikel 14, eerste lid
      (norminkomen), bij ministeriële regeling worden gewijzigd ter voorkoming van onbedoelde gevolgen van
      maatregelen met betrekking tot de inkomens boven het minimum-inkomensijkpunt. 3 Bij ministeriële
      regeling worden, met ingang van 1 januari van elk jaar, de bedragen, genoemd in de artikelen 13,
      eerste lid, onderdeel b (maximale huurgrens), 17, tweede lid (bij minimum-inkomensijkpunt behorende
      normhuur), en 20, eerste en tweede lid (kwaliteitskortingsgrens en aftoppingsgrenzen), gewijzigd met
      het percentage van de huurprijsontwikkeling, zoals die naar redelijke verwachting in het tijdvak dat
      loopt van 1 juli van het aan het berekeningsjaar voorafgaande jaar tot 1 juli van het
      berekeningsjaar zal plaatsvinden. 4 Bij ministeriële regeling wordt elk jaar, na overleg met Onze
      Minister van Sociale Zaken en Werkgelegenheid, de hoogte vastgesteld van de bedragen, zoals die met
      ingang van 1 januari krachtens artikel 17, eerste lid , als minimum-inkomensijkpunten gelden. 5 De
      bedragen, bedoeld in het eerste, tweede en derde lid, worden naar boven afgerond op hele eurocenten,
      met uitzondering van de norminkomens, bedoeld in artikel 14, eerste lid, onderdelen a en b (maximum
      inkomen bij een- en meerpersoonshuishoudens), die naar boven worden afgerond op een veelvoud van €
      25. De bedragen, bedoeld in het vierde en vijfde lid, en de som van de bedragen, genoemd in artikel
      14, eerste lid, onderdelen c of d, en bedoeld in artikel 14, tweede lid (maximum inkomen bij een- en
      meerpersoonsouderenhuishoudens), worden naar boven afgerond op een veelvoud van € 25. Bij een
      volgende wijziging van de norminkomens en de bedragen, bedoeld in het vijfde lid, wordt uitgegaan
      van de bedragen zoals die waren, voordat zij werden afgerond. 6 De overeenkomstig het eerste tot en
      met vijfde lid vastgestelde, vanaf 1 januari geldende minimum-inkomensijkpunten,
      referentie-inkomensijkpunten, maximale inkomensgrenzen, normhuren, de als gevolg daarvan voor de
      onderscheiden typen huishouden gewijzigde factoren, bedoeld in artikel 19, tweede lid , maximale
      huur-, kwaliteitskortings- en aftoppingsgrenzen, worden elk jaar uiterlijk op 1 november daaraan
      voorafgaand in de Staatscourant bekendgemaakt. 7 Bij algemene maatregel van bestuur kunnen de
      bedragen, genoemd in de artikelen 16 (verhoging van de normhuur), en 17, eerste lid, onderdelen a en
      b (toeslag bij minimum-inkomensijkpunt), en derde lid, onderdelen a en b (verlaging van de normhuur
      bij minimum-inkomensijkpunt), hoger of lager worden gesteld. 8 Bij ministeriële regeling kan het
      afbouwpercentage, bedoeld in artikel 21, tweede lid , worden gewijzigd voor zover de wijziging van
      de jaarinkomens, bedoeld in artikel 17, eerste lid , onbedoeld afwijkt van de wijziging welke naar
      verwachting plaats zal vinden met betrekking tot de inkomens boven het minimum-inkomensijkpunt.
  - number: '28'
