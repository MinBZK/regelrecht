    text: >-
      1 Onze Minister brengt jaarlijks verslag uit aan de Staten-Generaal over de werking van deze wet. 2
      Onverminderd het bepaalde in het eerste lid zendt Onze Minister binnen drie jaar na de
      inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de doeltreffendheid en de
      effecten van deze wet in de praktijk.
  - number: '58'
    url: https://wetten.overheid.nl/BWBR0008659/2026-01-01#Artikel58
    text: >-
      1 Deze wet treedt in werking met ingang van 1 juli van een bij koninklijk besluit te bepalen jaar,
      met uitzondering van artikel 4, eerste lid, dat zes maanden later in werking treedt, en met
      uitzondering van artikel 10, dat in werking treedt op het tijdstip, bedoeld in artikel 56. 2 In
      afwijking van het eerste lid treden de artikelen 39, 40, 44 en 45 in werking met ingang van de 1
      juli die volgt op het bij koninklijk besluit bepaalde jaar, bedoeld in het eerste lid. 3 Met ingang
      van de dag van inwerkingtreding van deze wet worden de daarin voorkomende bedragen aangepast
      overeenkomstig artikel 27, met als uitgangspunt dat de laatste aanpassing daarvan per 1 juli 1997
      heeft plaatsgevonden. 4 Het derde lid blijft buiten toepassing als deze wet met ingang van 1 juli
      1997 in werking treedt.
  - number: '59'
    url: https://wetten.overheid.nl/BWBR0008659/2026-01-01#Artikel59
    text: >-
      Deze wet wordt aangehaald als: Wet op de huurtoeslag.
