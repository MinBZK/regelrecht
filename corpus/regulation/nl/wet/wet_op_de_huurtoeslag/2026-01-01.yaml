  - number: '1'
    url: https://wetten.overheid.nl/BWBR0008659/2026-01-01#Artikel1
    text: >-
      In deze wet en de bepalingen die daarop berusten wordt verstaan onder: a. burgemeester en
      wethouders: burgemeester en wethouders van de gemeente waar de woning is gelegen waarop de
      huurtoeslag betrekking heeft; b. huurcommissie: de huurcommissie, bedoeld in artikel 3a, eerste lid,
      van de Uitvoeringswet huurprijzen woonruimte ; c. huurder: persoon die zijn hoofdverblijf heeft in
      een door hem gehuurde woning, daaronder begrepen een woonwagen, tenzij: 1°. de overeenkomst van huur
      en verhuur een gebruik van de woning betreft dat naar zijn aard slechts van korte duur is, of 2°. de
      woning onderdeel uitmaakt van een hotel-, pension-, kamp- of vakantiebestedingsbedrijf, ongeacht de
      duur van de huurovereenkomst; d. huurprijs: de prijs die bij huur en verhuur is verschuldigd voor
      het enkele gebruik van een woning; e. huurtoeslag: een tegemoetkoming van het Rijk als bedoeld in
      artikel 2, eerste lid, onderdeel h, van de Algemene wet inkomensafhankelijke regelingen in de kosten
      van het huren van een woning; f. onderhuurder: persoon als bedoeld in artikel 2, eerste lid,
      onderdeel e, onder 2°, van de Algemene wet inkomensafhankelijke regelingen ; g. Onze Minister: Onze
      Minister van Volkshuisvesting en Ruimtelijke Ordening; h. rekenhuur: de rekenhuur, bedoeld in
      artikel 5 ; i. rekeninkomen: de gezamenlijke toetsingsinkomens, bedoeld in artikel 8 van de Algemene
      wet inkomensafhankelijke regelingen , die in aanmerking worden genomen voor het bepalen van de
      draagkracht, bedoeld in artikel 7 van die wet ; j. standplaats: kavel, bestemd voor het plaatsen van
      een woonwagen, waarop voorzieningen aanwezig zijn die op het leidingnet van de openbare
      nutsbedrijven, andere instellingen of van gemeenten kunnen worden aangesloten; k. woning: een
      gebouwde onroerende zaak voor zover deze als zelfstandige woonruimte, onvrije etage dan wel andere
      onzelfstandige woonruimte is verhuurd, alsmede de onroerende aanhorigheden; l. woonwagen: voor
      bewoning bestemd gebouw dat is geplaatst op een standplaats en dat in zijn geheel of in delen kan
      worden verplaatst.
  - number: 1a
    url: https://wetten.overheid.nl/BWBR0008659/2026-01-01#Artikel1a
    text: >-
      1 Op deze wet is de Algemene wet inkomensafhankelijke regelingen , met uitzondering van artikel 6,
      eerste en tweede lid , van toepassing. 2 De uitvoering van het toekennen, uitbetalen en
      terugvorderen van een huurtoeslag is opgedragen aan de Dienst Toeslagen. 3 In afwijking van artikel
      3 van de Algemene wet inkomensafhankelijke regelingen wordt in deze wet en de daarop berustende
      bepalingen de partner uitsluitend als partner aangemerkt indien deze in de basisregistratie personen
      op het adres van de huurder staat ingeschreven.
  - number: '2'
    url: https://wetten.overheid.nl/BWBR0008659/2026-01-01#Artikel2
    text: >-
      In deze wet en de bepalingen die daarop berusten wordt verstaan onder: a. eenpersoonshuishouden: het
      huishouden van een huurder die, afgezien van een eventuele onderhuurder en de tot het huishouden van
      de onderhuurder behorende personen, als enige een woning bewoont; b. meerpersoonshuishouden: het
      huishouden van een huurder die samen met diens partner of een of meer medebewoners een woning
      bewoont.
    machine_readable:
      execution:
        produces:
          legal_character: WAARDEBEPALING
          decision_type: GEEN_BESLUIT
        parameters:
          - name: woont_met_partner_of_medebewoners
            type: boolean
            required: true
            description: 'Feit: bewoont de huurder de woning samen met partner of een of meer medebewoners
              (onderhuurders tellen niet mee)'
        output:
          - name: is_meerpersoonshuishouden
            type: boolean
          - name: is_eenpersoonshuishouden
            type: boolean
        actions:
          - output: is_meerpersoonshuishouden
            value: $woont_met_partner_of_medebewoners
          - output: is_eenpersoonshuishouden
            operation: NOT
            value: $woont_met_partner_of_medebewoners
