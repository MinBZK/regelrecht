  - number: '7'
    url: https://wetten.overheid.nl/BWBR0008659/2026-01-01#Artikel7
    text: >-
      1 Het recht op en de hoogte van de huurtoeslag is afhankelijk van de draagkracht, waaronder begrepen
      het vermogen, van de huurder, diens partner en de medebewoners. 2 Ten aanzien van een bepaalde
      woning kan slechts aan één huurder een huurtoeslag worden toegekend.
  - number: 7a
    url: https://wetten.overheid.nl/BWBR0008659/2026-01-01#Artikel7a
    text: >-
      [Red: Vervallen]
  - number: '8'
    url: https://wetten.overheid.nl/BWBR0008659/2026-01-01#Artikel8
    text: >-
      Een huurtoeslag wordt slechts toegekend aan een huurder die meerderjarig is.
  - number: '9'
    url: https://wetten.overheid.nl/BWBR0008659/2026-01-01#Artikel9
    text: >-
      1 Een huurtoeslag wordt slechts toegekend: a. als de huurder, diens partner alsmede degenen die
      medebewoner van de woning zijn, als ingezetene op het adres van die woning zijn ingeschreven in de
      basisregistratie personen; b. als geen andere personen met dat adres in de basisregistratie personen
      zijn ingeschreven, behoudens eventueel een onderhuurder en personen die behoren tot diens
      huishouden. 2 In afwijking van het eerste lid kan een huurtoeslag worden toegekend, als de onjuiste
      inschrijving in de basisregistratie personen niet aan de huurder kan worden toegerekend.
  - number: '10'
    url: https://wetten.overheid.nl/BWBR0008659/2026-01-01#Artikel10
    text: >-
      De huurder die tijdelijke bescherming geniet als bedoeld in artikel 1 van de Vreemdelingenwet 2000
      omdat hij onder de reikwijdte valt van het Uitvoeringsbesluit (EU) 2022/382 van de Raad van 4 maart
      2022 tot vaststelling van het bestaan van een massale toestroom van ontheemden uit Oekraïne in de
      zin van artikel 5 van Richtlijn 2001/55/EG , en tot invoering van tijdelijke bescherming naar
      aanleiding daarvan (PbEU 2022, L 71/1) of een verlenging van dat besluit, heeft recht op
      huurtoeslag.
  - number: '11'
    url: https://wetten.overheid.nl/BWBR0008659/2026-01-01#Artikel11
    text: >-
      1 Een huurtoeslag wordt slechts toegekend voor de huur van een woning die: a. een zelfstandige
      woonruimte of een onvrije etage is, of b. een onzelfstandige woonruimte is, welke deel uitmaakt van
      een woongebouw of woning, geheel of gedeeltelijk verhuurd ten behoeve van begeleid wonen,
      groepswonen door ouderen of een daarmee vergelijkbare woonvorm, en in eigendom van en aan de huurder
      verhuurd door een rechtspersoon zonder winstoogmerk, die mede op het gebied van de volkshuisvesting
      werkzaam is. 2 Het eerste lid onder b vindt slechts toepassing als de onzelfstandige woonruimte deel
      uitmaakt van een woongebouw of woning, die door de Dienst Toeslagen is aangewezen. Bij algemene
      maatregel van bestuur kunnen terzake nadere regels worden gesteld, waarbij een lagere maximale
      rekenhuur kan worden vastgesteld dan uit artikel 13 voortvloeit. 3 Voor de huur van een woonwagen
      zonder eigen aandrijving wordt slechts een huurtoeslag toegekend, indien deze: a. is geplaatst op
      een standplaats of op een regionaal woonwagencentrum dat tot stand is gekomen voor 1 oktober 1970,
      en b. voldoet aan de eisen, daaraan gesteld krachtens de Omgevingswet .
  - number: '12'
    url: https://wetten.overheid.nl/BWBR0008659/2026-01-01#Artikel12
    text: >-
      [Red: Vervallen]
  - number: '13'
    url: https://wetten.overheid.nl/BWBR0008659/2026-01-01#Artikel13
    text: >-
      1 De maximale huurgrens is: a. € 932,93 per maand als: 1º. de huurder, diens partner of een van de
      medebewoners 21 jaar of ouder is, dan wel de woning deelt met een kind of pleegkind van de huurder,
      diens partner of een medebewoner of 2º. de huurder, diens partner of de medebewoner jonger dan 21
      jaar is, en een handicap heeft of b. € 498,20 per maand in andere gevallen dan bedoeld onder a. 2 De
      in het eerste lid, onder a en b, genoemde bedragen worden met ingang van 1 januari van elk jaar
      gewijzigd overeenkomstig artikel 27 .
