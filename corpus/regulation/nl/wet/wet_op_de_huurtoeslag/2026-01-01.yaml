  - number: '21'
    url: https://wetten.overheid.nl/BWBR0008659/2026-01-01#Artikel21
    text: >-
      1 De hoogte van de huurtoeslag wordt als volgt bepaald: a. het deel van de rekenhuur boven de
      basishuur tot aan de kwaliteitskortingsgrens wordt voor 100 procent gesubsidieerd; b. het deel van
      de rekenhuur boven de kwaliteitskortingsgrens tot aan de aftoppingsgrens wordt voor een bij algemene
      maatregel van bestuur vast te stellen percentage gesubsidieerd; c. het deel van de rekenhuur boven
      de aftoppingsgrens wordt voor een bij algemene maatregel van bestuur vast te stellen percentage
      gesubsidieerd; d. het deel van de rekenhuur boven de maximale huurgrens wordt niet gesubsidieerd. 2
      Voor elk rekeninkomen boven het minimum-inkomensijkpunt, bedoeld in artikel 17 , wordt, per type
      huishouden als bedoeld in artikel 2 , de overeenkomstig het eerste lid bepaalde hoogte van de
      huurtoeslag, verlaagd met de uitkomst van de formule: Y x (afbouwpercentage/12) in welke formule
      voorstelt: Y: het rekeninkomen verminderd met het minimum-inkomensijkpunt, bedoeld in artikel 17 ;
      afbouwpercentage: a. 27% voor eenpersoonshuishoudens, of b. 22% voor meerpersoonshuishoudens.
