  - number: '14'
    url: https://wetten.overheid.nl/BWBR0008659/2026-01-01#Artikel14
    text: >-
      1 Het norminkomen bedraagt: a. € 29.400 bij een eenpersoonshuishouden; b. € 39.925 bij een
      meerpersoonshuishouden; c. € 28.089,78 bij een eenpersoonsouderenhuishouden; d. € 37.183,99 bij een
      meerpersoonsouderenhuishouden. 2 Het norminkomen, genoemd in het eerste lid, onderdelen c en d,
      wordt vermeerderd met € 665 onderscheidenlijk € 1 462. 3 De in het eerste lid genoemde bedragen
      worden met ingang van 1 januari van elk jaar gewijzigd overeenkomstig artikel 27 .
