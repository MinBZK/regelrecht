    text: >-
      De basishuur is het gedeelte van de rekenhuur dat minimaal voor rekening van de huurder blijft. De
      basishuur is het overeenkomstig artikel 17 berekende bedrag van de normhuur verhoogd met € 12 [Red:
      per 1 januari 2023 bij Stb. 2022/528: € 0.] [Red: In Stb. 2023/494 wordt de basishuur aangepast
      vanaf 1 januari 2024.]
    machine_readable:
      definitions:
        OPSLAG_BASISHUUR:
          value: 0
          description: 'Art. 16: "verhoogd met EUR 12"; redactionele correctie bij Stb. 2022/528:
            per 1 januari 2023 EUR 0'
      execution:
        produces:
          legal_character: WAARDEBEPALING
          decision_type: GEEN_BESLUIT
        input:
          - name: normhuur
            type: amount
            source:
              output: normhuur
            type_spec:
              unit: eurocent
          - name: verlaging_basishuur
            type: amount
            source:
              regulation: wet_verlaging_eigen_bijdrage_huurtoeslag
              output: verlaging_basishuur
            type_spec:
              unit: eurocent
        output:
          - name: basishuur
            type: amount
            type_spec:
              unit: eurocent
        actions:
          - output: basishuur
