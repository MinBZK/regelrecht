    text: >-
      De Wet individuele huursubsidie wordt ingetrokken.
  - number: '55'
    url: https://wetten.overheid.nl/BWBR0008659/2026-01-01#Artikel55
    text: >-
      1 Op subsidietijdvakken die zijn aangevangen onder de werking van de Wet individuele huursubsidie
      blijven de daarop vóór de inwerkingtreding van de Huursubsidiewet geldende bepalingen van
      toepassing. Gedurende de eerste vijf subsidiejaren na de inwerkingtreding van artikel 44 , wordt de
      huursubsidie-uitgavennorm zodanig lager vastgesteld dan uit artikel 41 voortvloeit, dat een
      eventuele overschrijding van de huursubsidie-uitgavennorm die is ontstaan gedurende het eerste
      subsidiejaar na inwerkingtreding van deze wet, wordt tenietgedaan. 2 In het eerste subsidiejaar na
      inwerkingtreding van deze wet wordt in afwijking van artikel 4, eerste lid , verstaan onder
      rekenvermogen: het gezamenlijk vermogen van de huurder en de medebewoners op 0.00 uur op de datum
      van inwerkingtreding van artikel 4, eerste lid . 3 Artikel 11 blijft buiten toepassing ten aanzien
      van een huurder van onzelfstandige woonruimte, anders dan bedoeld in dat artikel, indien die
      woonruimte onmiddellijk voorafgaand aan het moment dat de Wet individuele huursubsidie werd
      ingetrokken, was aangewezen als woonruimte aan de huurder waarvan een bijdrage op voet van die wet
      kon worden verstrekt. 4 [Red: Vervallen.] 5 Bij de toepassing van artikel 2 , en bij de toepassing
      van artikel 7 van de Algemene wet inkomensafhankelijke regelingen kan de Dienst Toeslagen op verzoek
      van de huurder het op 31 december 2005 van kracht zijnde beleid toepassen dat Onze Minister heeft
      getroffen op grond van artikel 9 en artikel 26 , eerste lid, zoals die artikelen onmiddellijk
      voorafgaand aan de inwerkingtreding van de Aanpassingswet Algemene wet inkomensafhankelijke
      regelingen luidden. 6 Het vijfde lid geldt uitsluitend in bij of krachtens algemene maatregel van
      bestuur vast te stellen gevallen.
