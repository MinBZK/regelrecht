  - number: '5'
    url: https://wetten.overheid.nl/BWBR0008659/2026-01-01#Artikel5
    text: >-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder rekenhuur: a. de huurprijs die
      de huurder per maand verschuldigd is, of b. als dat lager is dan de huurprijs een bedrag dat gelijk
      is aan de maximale huurprijsgrens, bedoeld in de krachtens de artikelen 10, eerste lid , en 12,
      tweede lid, van de Uitvoeringswet huurprijzen woonruimte gestelde regels, in geval van huur van een
      woonwagen zonder eigen aandrijving vermeerderd met het bedrag dat verschuldigd is voor de huur van
      de standplaats. 2 Bij de toepassing van het eerste lid kan het in onderdeel b van dat lid bedoelde
      bedrag slechts in plaats van de verschuldigde huurprijs in aanmerking worden genomen nadat, op
      verzoek van de Dienst Toeslagen, de huurcommissie, dan wel de voorzitter van de huurcommissie, aan
      de Dienst Toeslagen en aan de huurder advies heeft uitgebracht, dan wel een verklaring heeft
      verstrekt, over de redelijk te achten huurprijs. Bij algemene maatregel van bestuur kunnen omtrent
      die verklaring nadere regels worden gesteld.
    machine_readable:
      execution:
        produces:
          legal_character: WAARDEBEPALING
          decision_type: GEEN_BESLUIT
        parameters:
          - name: huurprijs
            type: amount
            required: true
            type_spec:
              unit: eurocent
            description: 'Art. 1(d): prijs voor het enkele gebruik van de woning, per maand'
          - name: maximale_huurprijsgrens_uhw
            type: amount
            required: true
            type_spec:
              unit: eurocent
            description: Maximale huurprijsgrens krachtens art. 10 lid 1 en 12 lid 2 Uitvoeringswet
              huurprijzen woonruimte; lid 2 stelt een procedurele voorwaarde (advies huurcommissie)
              die hier niet is gemodelleerd
        output:
          - name: rekenhuur
            type: amount
            type_spec:
              unit: eurocent
        actions:
          - output: rekenhuur
            operation: MIN
            values:
              - $huurprijs
              - $maximale_huurprijsgrens_uhw
