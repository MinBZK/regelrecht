---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.8.0/schema/v0.8.0/schema.json
$id: algemene_wet_bestuursrecht
regulatory_layer: WET
publication_date: '2026-01-01'
valid_from: '1994-01-01'
name: Algemene wet bestuursrecht
bwb_id: BWBR0005537
url: https://wetten.overheid.nl/BWBR0005537/2024-01-01

procedure:
  - id: beschikking
    default: true
    applies_to:
      legal_character: BESCHIKKING
    stages:
      - name: AANVRAAG
        description: Belanghebbende dient aanvraag in (AWB 4:1)
        requires:
          - name: aanvraag_datum
            type: date

      - name: BEHANDELING
        description: Bestuursorgaan onderzoekt de aanvraag (AWB 3:2)
        requires:
          - name: beslistermijn_start
            type: date

      - name: BESLUIT
        description: Bestuursorgaan neemt besluit (AWB 1:3)
        requires:
          - name: besluit_datum
            type: date

      - name: BEKENDMAKING
        description: Besluit wordt bekendgemaakt (AWB 3:41)
        requires:
          - name: bekendmaking_datum
            type: date

      - name: BEZWAAR
        description: Bezwaarperiode (AWB 6:4 e.v.)

articles:
  - number: '3:46'
    text: |-
      Een besluit dient te berusten op een deugdelijke motivering.
    url: https://wetten.overheid.nl/BWBR0005537/2024-01-01#Artikel3:46
    machine_readable:
      hooks:
        - hook_point: pre_actions
          applies_to:
            legal_character: BESCHIKKING
            stage: BESLUIT
      execution:
        output:
          - name: motivering_vereist
            type: boolean
        actions:
          - output: motivering_vereist
            value: true

  - number: '4:2'
    text: |-
      1. De aanvraag wordt ondertekend en bevat ten minste:
      a. de naam en het adres van de aanvrager;
      b. de dagtekening;
      c. een aanduiding van de beschikking die wordt gevraagd.
      2. De aanvrager verschaft voorts de gegevens en bescheiden die voor de
      beslissing op de aanvraag nodig zijn en waarover hij redelijkerwijs de
      beschikking kan krijgen.
    url: https://wetten.overheid.nl/BWBR0005537/2024-01-01#Artikel4:2
    machine_readable:
      # Lid 1: de kern van elke aanvraag om een beschikking. Het artikel haakt
      # op elke aanvraag waarop een beschikking wordt genomen (RFC-046); wat de
      # aanvrager hier invult, wordt een veld van de aanvraag (chronolex).
      hooks:
        - hook_point: pre_actions
          applies_to:
            submission: AANVRAAG
            decided_by: BESCHIKKING
      execution:
        produces:
          legal_character: TOETS
          decision_type: GEEN_BESLUIT
          extensions:
            chronolex:
              establishes:
                - extends:
                    submission: AANVRAAG
                  fields: parameters
        parameters:
          - name: naam_aanvrager
            type: string
            nullable: true
            required: false
            description: De naam van de aanvrager (lid 1 onder a).
            origin:
              waarde: BELANGHEBBENDE
              grondslag: algemene_wet_bestuursrecht#4:2 lid 1
          - name: adres_aanvrager
            type: string
            nullable: true
            required: false
            description: Het adres van de aanvrager (lid 1 onder a).
            origin:
              waarde: BELANGHEBBENDE
              grondslag: algemene_wet_bestuursrecht#4:2 lid 1
          - name: dagtekening
            type: date
            nullable: true
            required: false
            description: De dagtekening van de aanvraag (lid 1 onder b).
            origin:
              waarde: BELANGHEBBENDE
              grondslag: algemene_wet_bestuursrecht#4:2 lid 1
          - name: gevraagde_beschikking
            type: string
            nullable: true
            required: false
            description: Een aanduiding van de beschikking die wordt gevraagd (lid 1 onder c).
            origin:
              waarde: BELANGHEBBENDE
              grondslag: algemene_wet_bestuursrecht#4:2 lid 1
              rol: GEVRAAGD_BESLUIT
          - name: ondertekening
            type: string
            nullable: true
            required: false
            description: Wie de aanvraag ondertekende (lid 1, aanhef).
            origin:
              waarde: BELANGHEBBENDE
              grondslag: algemene_wet_bestuursrecht#4:2 lid 1
          - name: nodig_voor_de_beslissing
            type: boolean
            required: false
          - name: redelijkerwijs_te_verkrijgen_door_aanvrager
            type: boolean
            required: false
        output:
          - name: aanvullende_gegevens_vereist
            type: boolean
            description: >-
              Lid 2: de aanvrager verschaft ook wat voor de beslissing nodig is en
              wat hij redelijkerwijs kan krijgen.
        actions:
          - output: aanvullende_gegevens_vereist
            value:
              operation: AND
              conditions:
                - operation: EQUALS
                  subject: $nodig_voor_de_beslissing
                  value: true
                - operation: EQUALS
                  subject: $redelijkerwijs_te_verkrijgen_door_aanvrager
                  value: true

  - number: '4:13'
    text: |-
      1. Een beschikking dient te worden gegeven binnen de bij wettelijk
      voorschrift bepaalde termijn of, bij het ontbreken van zulk een termijn,
      binnen een redelijke termijn na ontvangst van de aanvraag.
      2. De in het eerste lid bedoelde redelijke termijn is in ieder geval
      verstreken wanneer het bestuursorgaan binnen acht weken na ontvangst van
      de aanvraag geen beschikking heeft gegeven, noch een mededeling als
      bedoeld in artikel 4:14, derde lid, heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0005537/2024-01-01#Artikel4:13
    machine_readable:
      # Lid 1: de beslistermijn loopt vanaf de ontvangst van de aanvraag. Dat
      # is het moment dat bij elke aanvraag om een beschikking rechtens telt,
      # dus het moment van het feit in de kroniek (chronolex `effective_at`).
      hooks:
        - hook_point: post_actions
          applies_to:
            submission: AANVRAAG
            decided_by: BESCHIKKING
      execution:
        produces:
          legal_character: TOETS
          decision_type: GEEN_BESLUIT
          extensions:
            chronolex:
              establishes:
                - extends:
                    submission: AANVRAAG
                  effective_at:
                    legal_basis:
                      - algemene_wet_bestuursrecht#4:13 lid 1

  - number: '6:7'
    text: |-
      De termijn voor het indienen van een bezwaar- of
      beroepschrift bedraagt zes weken.
    url: https://wetten.overheid.nl/BWBR0005537/2024-01-01#Artikel6:7
    machine_readable:
      hooks:
        - hook_point: post_actions
          applies_to:
            legal_character: BESCHIKKING
            stage: BESLUIT
      execution:
        output:
          - name: bezwaartermijn_weken
            type: number
        actions:
          - output: bezwaartermijn_weken
            value: 6

  - number: '6:8'
    text: |-
      1. De termijn vangt aan met ingang van de dag na die
      waarop het besluit op de voorgeschreven wijze is
      bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0005537/2024-01-01#Artikel6:8
    machine_readable:
      hooks:
        - hook_point: post_actions
          applies_to:
            legal_character: BESCHIKKING
            stage: BEKENDMAKING
      execution:
        parameters:
          - name: bekendmaking_datum
            type: date
            required: true
            description: Datum waarop het besluit is bekendgemaakt
        input:
          - name: bezwaartermijn_weken
            type: number
            source:
              regulation: algemene_wet_bestuursrecht
              output: bezwaartermijn_weken
        output:
          - name: bezwaartermijn_startdatum
            type: date
          - name: bezwaartermijn_einddatum
            type: date
        actions:
          # "met ingang van de dag na die waarop het besluit is bekendgemaakt"
          # startdatum = bekendmaking + 1 dag (dies a quo: bekendmakingsdatum telt niet mee)
          - output: bezwaartermijn_startdatum
            value:
              operation: DATE_ADD
              date: $bekendmaking_datum
              days: 1
          # einddatum = bekendmaking + termijn (NIET startdatum + termijn).
          # De startdatum is dag 1 van de termijn (inclusief), dus 6 weken
          # = 42 dagen gerekend vanaf startdatum = dag 42 = bekendmaking + 42.
          # startdatum + 6 weken zou dag 43 geven — één dag te veel.
          - output: bezwaartermijn_einddatum
            value:
              operation: DATE_ADD
              date: $bekendmaking_datum
              weeks: $bezwaartermijn_weken
