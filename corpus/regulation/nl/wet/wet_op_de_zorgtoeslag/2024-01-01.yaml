---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.5.8/schema/v0.5.8/schema.json
$id: wet_op_de_zorgtoeslag
regulatory_layer: WET
publication_date: '2023-12-20'
valid_from: '2024-01-01'
bwb_id: BWBR0018451
url: https://wetten.overheid.nl/BWBR0018451/2024-01-01
name: '#wet_naam'
competent_authority: '#bevoegd_gezag'
articles:
  - number: '1'
    text: >-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:


      a. verzekerde: degene die ingevolge de Zorgverzekeringswet verzekerd is; b. toetsingsinkomen: het verzamelinkomen,
      bedoeld in artikel 2.18 van de Wet inkomstenbelasting 2001; c. drempelinkomen: het bedrag, bedoeld in artikel 2,
      tweede lid; d. normpremie: de premie, berekend overeenkomstig artikel 2; e. standaardpremie: de premie, bedoeld in
      artikel 4.
    url: https://wetten.overheid.nl/BWBR0018451/2024-01-01#Artikel1
  - number: 1a
    text: >-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder Onze Minister: Onze Minister van
      Volksgezondheid, Welzijn en Sport.
    url: https://wetten.overheid.nl/BWBR0018451/2024-01-01#Artikel1a
    machine_readable:
      definitions:
        verantwoordelijke_autoriteit: Minister van Volksgezondheid, Welzijn en Sport
  - number: '2'
    text: >-
      1. Indien de normpremie voor een verzekerde in het berekeningsjaar minder bedraagt dan de standaardpremie in dat
      jaar, heeft de verzekerde aanspraak op een zorgtoeslag ter grootte van dat verschil. Voor een verzekerde met een
      toeslagpartner geldt het dubbele van de standaardpremie en worden de verzekerde en de toeslagpartner geacht
      gezamenlijk aanspraak te maken op zorgtoeslag.


      2. De normpremie bedraagt een percentage van het drempelinkomen in het berekeningsjaar, vermeerderd met een
      percentage van het toetsingsinkomen van de verzekerde. Ingeval de verzekerde een toeslagpartner heeft, wordt het
      gezamenlijk toetsingsinkomen van de verzekerde en de toeslagpartner in aanmerking genomen.


      3. De percentages, bedoeld in het tweede lid, bedragen voor een verzekerde met een toeslagpartner 4,256 procent van
      het drempelinkomen, vermeerderd met 13,670 procent van het toetsingsinkomen, en voor een verzekerde zonder
      toeslagpartner 1,879 procent van het drempelinkomen, vermeerderd met 13,670 procent van het toetsingsinkomen. Bij
      ministeriële regeling kunnen deze percentages worden gewijzigd.


      4. In afwijking van het eerste lid bedraagt de aanspraak op een zorgtoeslag voor een verzekerde met een partner die
      geen verzekerde is, vijftig procent van het op grond van het eerste lid berekende bedrag.


      5. De aanspraak op een zorgtoeslag wordt voor iedere kalendermaand afzonderlijk bepaald.


      6. Bij ministeriële regeling kunnen nadere regels worden gesteld.


      7. Onze Minister zendt een voornemen tot wijziging van de percentages, bedoeld in het derde lid, ten minste twee
      weken voor de vaststelling aan beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0018451/2024-01-01#Artikel2
    machine_readable:
      definitions:
        drempelinkomen_alleenstaande:
          value: 3749600
        drempelinkomen_aanvrager_met_toeslagpartner:
          value: 4821800
        percentage_drempelinkomen_alleenstaande:
          value: 0.01879
        percentage_drempelinkomen_partner:
          value: 0.04256
        percentage_toetsingsinkomen:
          value: 0.1367
      execution:
        produces:
          legal_character: BESCHIKKING
          decision_type: TOEKENNING
        parameters:
          - name: bsn
            type: string
            required: true
        input:
          - name: is_verzekerde
            type: boolean
            source:
              regulation: zorgverzekeringswet
              output: is_verzekerd
              parameters:
                bsn: $bsn
          - name: heeft_toeslagpartner
            type: boolean
            source:
              regulation: algemene_wet_inkomensafhankelijke_regelingen
              output: heeft_toeslagpartner
              parameters:
                bsn: $bsn
          - name: toetsingsinkomen
            type: amount
            source:
              regulation: algemene_wet_inkomensafhankelijke_regelingen
              output: toetsingsinkomen
              parameters:
                bsn: $bsn
            type_spec:
              unit: eurocent
          # Lid 2, tweede zin: "Ingeval de verzekerde een toeslagpartner heeft,
          # wordt het gezamenlijk toetsingsinkomen van de verzekerde en de
          # toeslagpartner in aanmerking genomen." De partner volgt uit
          # artikel 3 Awir, zijn toetsingsinkomen uit artikel 8 Awir. Zonder
          # partner is het burgerservicenummer null en slaat de engine de
          # aanroep over (RFC-036).
          - name: bsn_toeslagpartner
            type: string
            nullable: true
            source:
              regulation: algemene_wet_inkomensafhankelijke_regelingen
              output: bsn_toeslagpartner
              parameters:
                bsn: $bsn
          - name: toetsingsinkomen_toeslagpartner
            type: amount
            nullable: true
            source:
              regulation: algemene_wet_inkomensafhankelijke_regelingen
              output: toetsingsinkomen
              parameters:
                bsn: $bsn_toeslagpartner
            type_spec:
              unit: eurocent
          - name: standaardpremie
            type: amount
            source:
              regulation: regeling_standaardpremie
              output: standaardpremie
            type_spec:
              unit: eurocent
          - name: vermogen_onder_grens
            type: boolean
            source:
              output: vermogen_onder_grens
        output:
          - name: heeft_recht_op_zorgtoeslag
            type: boolean
          - name: hoogte_zorgtoeslag
            type: amount
            type_spec:
              unit: eurocent
          - name: in_aanmerking_genomen_toetsingsinkomen
            type: amount
            type_spec:
              unit: eurocent
        actions:
          - output: in_aanmerking_genomen_toetsingsinkomen
            value:
              operation: IF
              cases:
                - when:
                    operation: AND
                    conditions:
                      - operation: EQUALS
                        subject: $heeft_toeslagpartner
                        value: true
                      - operation: NOT
                        value:
                          operation: EQUALS
                          subject: $toetsingsinkomen_toeslagpartner
                          value: null
                  then:
                    operation: ADD
                    values:
                      - $toetsingsinkomen
                      - $toetsingsinkomen_toeslagpartner
              default: $toetsingsinkomen
          - output: hoogte_zorgtoeslag
            value:
              operation: MAX
              values:
                - 0
                - operation: SUBTRACT
                  values:
                    - operation: IF
                      cases:
                        - when:
                            operation: EQUALS
                            subject: $heeft_toeslagpartner
                            value: true
                          then:
                            operation: MULTIPLY
                            values:
                              - 2
                              - $standaardpremie
                      default: $standaardpremie
                    - operation: ADD
                      values:
                        - operation: MULTIPLY
                          values:
                            - operation: IF
                              cases:
                                - when:
                                    operation: EQUALS
                                    subject: $heeft_toeslagpartner
                                    value: true
                                  then: $percentage_drempelinkomen_partner
                              default: $percentage_drempelinkomen_alleenstaande
                            - operation: MIN
                              values:
                                - $in_aanmerking_genomen_toetsingsinkomen
                                - operation: IF
                                  cases:
                                    - when:
                                        operation: EQUALS
                                        subject: $heeft_toeslagpartner
                                        value: true
                                      then: $drempelinkomen_aanvrager_met_toeslagpartner
                                  default: $drempelinkomen_alleenstaande
                        - operation: IF
                          cases:
                            - when:
                                operation: GREATER_THAN
                                subject: $in_aanmerking_genomen_toetsingsinkomen
                                value:
                                  operation: IF
                                  cases:
                                    - when:
                                        operation: EQUALS
                                        subject: $heeft_toeslagpartner
                                        value: true
                                      then: $drempelinkomen_aanvrager_met_toeslagpartner
                                  default: $drempelinkomen_alleenstaande
                              then:
                                operation: MULTIPLY
                                values:
                                  - operation: SUBTRACT
                                    values:
                                      - $in_aanmerking_genomen_toetsingsinkomen
                                      - operation: IF
                                        cases:
                                          - when:
                                              operation: EQUALS
                                              subject: $heeft_toeslagpartner
                                              value: true
                                            then: $drempelinkomen_aanvrager_met_toeslagpartner
                                        default: $drempelinkomen_alleenstaande
                                  - $percentage_toetsingsinkomen
                          default: 0
          - output: heeft_recht_op_zorgtoeslag
            value:
              operation: AND
              conditions:
                - operation: EQUALS
                  subject: $is_verzekerde
                  value: true
                - operation: EQUALS
                  subject: $vermogen_onder_grens
                  value: true
                - operation: GREATER_THAN
                  subject: $hoogte_zorgtoeslag
                  value: 0
  - number: '3'
    text: >-
      Een verzekerde heeft geen aanspraak op zorgtoeslag indien de rendementsgrondslag, bedoeld in artikel 5.2 van de Wet
      inkomstenbelasting 2001, van de verzekerde of, ingeval de verzekerde een toeslagpartner heeft, de gezamenlijke
      rendementsgrondslag van de verzekerde en de toeslagpartner op de peildatum meer bedraagt dan € 127.582 voor een
      verzekerde zonder toeslagpartner, onderscheidenlijk € 161.329 voor een verzekerde met een toeslagpartner.
    url: https://wetten.overheid.nl/BWBR0018451/2024-01-01#Artikel3
    machine_readable:
      definitions:
        vermogensgrens_alleenstaand:
          value: 12758200
        vermogensgrens_aanvrager_met_toeslagpartner:
          value: 16132900
      execution:
        produces:
          legal_character: TOETS
          decision_type: GOEDKEURING
        parameters:
          - name: bsn
            type: string
            required: true
        input:
          - name: vermogen
            type: amount
            source:
              regulation: wet_inkomstenbelasting_2001
              output: rendementsgrondslag
              parameters:
                bsn: $bsn
            type_spec:
              unit: eurocent
          - name: heeft_toeslagpartner
            type: boolean
            source:
              regulation: algemene_wet_inkomensafhankelijke_regelingen
              output: heeft_toeslagpartner
              parameters:
                bsn: $bsn
          # "de gezamenlijke rendementsgrondslag van de verzekerde en de
          # toeslagpartner": die van de partner uit dezelfde bepaling van de
          # Wet IB 2001, met het burgerservicenummer uit artikel 3 Awir.
          - name: bsn_toeslagpartner
            type: string
            nullable: true
            source:
              regulation: algemene_wet_inkomensafhankelijke_regelingen
              output: bsn_toeslagpartner
              parameters:
                bsn: $bsn
          - name: vermogen_toeslagpartner
            type: amount
            nullable: true
            source:
              regulation: wet_inkomstenbelasting_2001
              output: rendementsgrondslag
              parameters:
                bsn: $bsn_toeslagpartner
            type_spec:
              unit: eurocent
        output:
          - name: vermogen_onder_grens
            type: boolean
        actions:
          # De tekst hierboven is die van dit bestand, en die wijkt af van de
          # geldende tekst per 1 januari 2024 op wetten.overheid.nl: daar staat
          # de vermogenstoets in artikel 2a, met grenzen van 140.213 en 177.301
          # euro en de voorwaarde "indien de verzekerde het gehele
          # berekeningsjaar dezelfde partner heeft", zoals in de versie van
          # 2025 (#1564). Dit model volgt de tekst van dit bestand: bij een
          # toeslagpartner de gezamenlijke grondslag tegen de partnergrens,
          # anders de eigen grondslag tegen de grens zonder partner
          # ("onderscheidenlijk"). Een partner zonder burgerservicenummer valt
          # stil terug op de eigen grondslag (#1563), net als het
          # toetsingsinkomen in artikel 2.
          - output: vermogen_onder_grens
            value:
              operation: IF
              cases:
                - when:
                    operation: AND
                    conditions:
                      - operation: EQUALS
                        subject: $heeft_toeslagpartner
                        value: true
                      - operation: NOT
                        value:
                          operation: EQUALS
                          subject: $vermogen_toeslagpartner
                          value: null
                  then:
                    operation: LESS_THAN_OR_EQUAL
                    subject:
                      operation: ADD
                      values:
                        - $vermogen
                        - $vermogen_toeslagpartner
                    value: $vermogensgrens_aanvrager_met_toeslagpartner
              default:
                operation: LESS_THAN_OR_EQUAL
                subject: $vermogen
                value: $vermogensgrens_alleenstaand
  - number: '4'
    text: >-
      Onze Minister stelt uiterlijk 22 dagen voorafgaande aan het berekeningsjaar bij regeling de standaardpremie voor
      het berekeningsjaar vast.
    url: https://wetten.overheid.nl/BWBR0018451/2024-01-01#Artikel4
    machine_readable:
      open_terms:
        - id: standaardpremie
          type: amount
          required: true
          delegated_to: minister
          delegation_type: MINISTERIELE_REGELING
          legal_basis: artikel 4 Wet op de zorgtoeslag
      execution:
        output:
          - name: standaardpremie
            type: amount
            type_spec:
              unit: eurocent
        actions:
          - output: standaardpremie
            value: $standaardpremie
  - number: 4a
    text: >-
      Voor de persoon, bedoeld in artikel 69 van de Zorgverzekeringswet, wordt de standaardpremie aangepast aan de hand
      van de verhouding tussen de zorguitgaven per verzekerde in het land waar de persoon woont en de zorguitgaven per
      verzekerde in Nederland.
    url: https://wetten.overheid.nl/BWBR0018451/2024-01-01#Artikel4a
  - number: '5'
    text: >-
      1. De Dienst Toeslagen is belast met de uitvoering van deze wet.


      2. Tot en met 4. [Procedurele bepalingen over aanvraag en betaling]


      5. De zorgtoeslag komt ten laste van het Rijk.
    url: https://wetten.overheid.nl/BWBR0018451/2024-01-01#Artikel5
    machine_readable:
      execution:
        actions:
          - output: bevoegd_gezag
            value: Dienst Toeslagen
  - number: '6'
    text: >-
      Onze Minister zendt binnen vier jaar na de inwerkingtreding van deze wet, en vervolgens telkens na vier jaar, aan
      de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0018451/2024-01-01#Artikel6
  - number: '7'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0018451/2024-01-01#Artikel7
  - number: '8'
    text: |-
      Deze wet wordt aangehaald als: Wet op de zorgtoeslag.
    url: https://wetten.overheid.nl/BWBR0018451/2024-01-01#Artikel8
    machine_readable:
      execution:
        actions:
          - output: wet_naam
            value: Wet op de zorgtoeslag
