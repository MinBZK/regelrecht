---
$schema: >-
  https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.6.0/schema/v0.6.0/schema.json
$id: test_date_operations
name: Testwet datumoperaties
regulatory_layer: WET
bwb_id: BWBR9999902
publication_date: '2025-01-01'
valid_from: '2025-01-01'
url: https://example.com/test_date_operations

articles:
  - number: '1'
    url: https://example.com/test_date_operations/1
    text: >-
      Een verzoek is tijdig ingediend wanneer de indieningsdatum op of voor de
      peildatum valt, en is op de peildatum ingediend wanneer de
      indieningsdatum gelijk is aan de peildatum. De doorlooptijd is het
      aantal dagen, dan wel het aantal gehele maanden of jaren, tussen de
      indieningsdatum en de peildatum.
    machine_readable:
      execution:
        parameters:
          - name: indieningsdatum
            type: date
            required: true
            description: Datum waarop het verzoek is ingediend
        output:
          - name: tijdig_ingediend
            type: boolean
          - name: op_peildatum_ingediend
            type: boolean
          - name: doorlooptijd_dagen
            type: number
          - name: doorlooptijd_maanden
            type: number
          - name: doorlooptijd_jaren
            type: number
        actions:
          # RFC-021 route A: type-safe comparison of two dates.
          # $referencedate.iso is the peildatum (calculation date).
          - output: tijdig_ingediend
            value:
              operation: LESS_THAN_OR_EQUAL
              subject: $indieningsdatum
              value: $referencedate.iso
          # RFC-021 route A: date-aware EQUALS in the mixed form — a date
          # string against the $referencedate object (no .iso suffix).
          - output: op_peildatum_ingediend
            value:
              operation: EQUALS
              subject: $indieningsdatum
              value: $referencedate
          # RFC-021 route B: DATE_DIFF with an explicit unit.
          - output: doorlooptijd_dagen
            value:
              operation: DATE_DIFF
              from: $indieningsdatum
              to: $referencedate.iso
              in: days
          - output: doorlooptijd_maanden
            value:
              operation: DATE_DIFF
              from: $indieningsdatum
              to: $referencedate.iso
              in: months
          - output: doorlooptijd_jaren
            value:
              operation: DATE_DIFF
              from: $indieningsdatum
              to: $referencedate.iso
              in: years

  - number: '2'
    url: https://example.com/test_date_operations/2
    text: >-
      Het jaar en de maand van een wijziging zijn het jaartal en het
      maandnummer van de wijzigingsdatum. Het begin van de maand is de eerste
      dag van de maand waarin de wijzigingsdatum valt, en het begin van het
      jaar de eerste dag van dat jaar. Een wijziging die zich voordoet na de
      eerste dag van de maand wordt in aanmerking genomen vanaf de eerste dag
      van de daaropvolgende maand, en een wijziging op de eerste dag van de
      maand vanaf die dag zelf.
    machine_readable:
      execution:
        parameters:
          - name: wijzigingsdatum
            type: date
            required: true
            description: Datum waarop de wijziging zich voordoet
        output:
          - name: wijzigingsjaar
            type: number
          - name: wijzigingsmaand
            type: number
          - name: begin_wijzigingsmaand
            type: string
          - name: begin_wijzigingsjaar
            type: string
          - name: eerste_dag_volgende_maand
            type: string
          - name: ingangsdatum_wijziging
            type: string
        actions:
          # RFC-032: DATE_PART reads one component out of a date. The unit is
          # singular, where DATE_DIFF above counts and writes it plural.
          - output: wijzigingsjaar
            value:
              operation: DATE_PART
              date: $wijzigingsdatum
              in: year
          - output: wijzigingsmaand
            value:
              operation: DATE_PART
              date: $wijzigingsdatum
              in: month
          # RFC-032: START_OF truncates down to the start of a calendar unit.
          - output: begin_wijzigingsmaand
            value:
              operation: START_OF
              date: $wijzigingsdatum
              in: month
          - output: begin_wijzigingsjaar
            value:
              operation: START_OF
              date: $wijzigingsdatum
              in: year
          # The canonical "eerste dag van de kalendermaand volgende op":
          # truncate first, add afterwards, so the day-clamping of DATE_ADD
          # never comes into play and 31 January yields 1 February.
          - output: eerste_dag_volgende_maand
            value:
              operation: DATE_ADD
              date:
                operation: START_OF
                date: $wijzigingsdatum
                in: month
              months: 1
          # Awir art. 49: a change after the first of the month counts from the
          # first of the next one, a change on the first counts in that month
          # itself. The day number is what tells the two apart.
          - output: ingangsdatum_wijziging
            value:
              operation: IF
              cases:
                - when:
                    operation: GREATER_THAN
                    subject:
                      operation: DATE_PART
                      date: $wijzigingsdatum
                      in: day
                    value: 1
                  then:
                    operation: DATE_ADD
                    date:
                      operation: START_OF
                      date: $wijzigingsdatum
                      in: month
                    months: 1
              default:
                operation: START_OF
                date: $wijzigingsdatum
                in: month
