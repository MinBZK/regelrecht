      verlaagd met € 37,72; b. in 2025 verlaagd met € 37,14; c. in 2026 verlaagd met € 48,15; d. in 2027
      verlaagd met € 47,57; e. in 2028 verlaagd met € 46,99; f. in 2029 en latere jaren verlaagd met €
      46,42.
