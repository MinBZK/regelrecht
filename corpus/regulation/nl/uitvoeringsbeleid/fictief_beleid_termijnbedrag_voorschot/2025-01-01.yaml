---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.8.0/schema/v0.8.0/schema.json
$id: fictief_beleid_termijnbedrag_voorschot
regulatory_layer: UITVOERINGSBELEID
publication_date: '2025-01-01'
valid_from: '2025-01-01'
# Er is geen bekendgemaakt beleid over de hoogte van een voorschottermijn. De
# url wijst daarom naar het artikel dat dit beleid uitwerkt, niet naar een
# bekendmaking.
url: https://wetten.overheid.nl/BWBR0018472/2025-01-01#Artikel22
name: Termijnbedrag van het voorschot (fictief uitvoeringsbeleid)
competent_authority:
  name: Dienst Toeslagen
articles:
  # FICTIEF. Geen bekendgemaakt beleid van de Dienst Toeslagen, maar een eigen
  # keuze in de modellering (ontwerpnotitie
  # packages/cel/ONTWERP-proces-zorgtoeslag.md, par. 4). Art. 22 Awir zegt
  # wanneer en hoeveel termijnen er zijn, niet hoe hoog een termijn is; dat is
  # een uitvoeringskeuze. Zolang er geen beleid is, staat de keuze hier, apart
  # van de wet en als keuze herkenbaar.
  - number: '1'
    url: https://wetten.overheid.nl/BWBR0018472/2025-01-01#Artikel22
    text: >-
      FICTIEF, eigen keuze in de modellering: geen bekendgemaakt beleid. Het
      termijnbedrag van een voorschot is het voorschotbedrag in gelijke delen
      over de termijnen van artikel 22 van de Algemene wet
      inkomensafhankelijke regelingen, afgerond naar beneden op hele centen,
      met het restant in de laatste termijn. Wordt een deel van het voorschot
      in één bedrag uitbetaald (artikel 22, vierde en vijfde lid), dan is dat
      deel het voorschotbedrag naar rato van de maanden waarop het betrekking
      heeft, en wordt het met de eerste termijn uitbetaald.
    machine_readable:
      execution:
        # Een betaalde termijn is een feit in de kroniek van Toeslagen
        # (chronolex, een executogram: de uitvoering van het voorschot). Een
        # termijn die nog moet komen is geen feit (RFC-044): de cel voert dit
        # artikel uit op een dag (`executed_on`) en legt alleen een gram vast
        # als er in die maand een termijn valt (`record_when`, art. 22 Awir).
        # - refers_to: het voorschot, als het besluit in de fase VOORSCHOT
        #   van de procedure tegemoetkoming van de Awir. Zo noemt dit beleid
        #   geen toeslag.
        # - period: de termijnen rekenen met het beleid van het
        #   berekeningsjaar, ook de termijn in december ervoor (art. 22 lid 1).
        # - once_per: per voorschot ten hoogste één termijn per maand (art. 22
        #   lid 1: "telkens een maand later").
        # - until: na de toekenning wordt geen termijn meer betaald. Eigen
        #   keuze, gelezen uit art. 24 lid 2 Awir: de voorschotten worden met
        #   de tegemoetkoming verrekend, dus wat dan nog niet betaald is, komt
        #   niet meer. Dat volgt uit de toekenning en wordt geen eigen gram.
        produces:
          extensions:
            chronolex:
              establishes:
                - event: voorschottermijn_betaald
                  type: executogram
                  refers_to:
                    voorschot:
                      stage: VOORSCHOT
                      required: true
                  fields: [termijnbedrag]
                  period:
                    parameter: berekeningsjaar
                    unit: year
                  executed_on:
                    parameter: maand
                    once_per: month
                  record_when: termijn_wordt_betaald
                  until:
                    stage: TOEKENNING
        parameters:
          - name: voorschotbedrag
            type: amount
            required: true
            description: Het voorschotbedrag (art. 16 Awir).
          - name: dagtekening_voorschot
            type: date
            required: true
          - name: berekeningsjaar
            type: number
            required: true
          - name: maand
            type: date
            required: true
            description: Een dag in de maand waarnaar gevraagd wordt.
        input:
          - name: termijn_in_maand
            type: boolean
            source:
              regulation: algemene_wet_inkomensafhankelijke_regelingen
              output: termijn_in_maand
              parameters:
                dagtekening_voorschot: $dagtekening_voorschot
                berekeningsjaar: $berekeningsjaar
                maand: $maand
          - name: eerste_termijn
            type: boolean
            source:
              regulation: algemene_wet_inkomensafhankelijke_regelingen
              output: eerste_termijn
              parameters:
                dagtekening_voorschot: $dagtekening_voorschot
                berekeningsjaar: $berekeningsjaar
                maand: $maand
          - name: laatste_termijn
            type: boolean
            source:
              regulation: algemene_wet_inkomensafhankelijke_regelingen
              output: laatste_termijn
              parameters:
                dagtekening_voorschot: $dagtekening_voorschot
                berekeningsjaar: $berekeningsjaar
                maand: $maand
          - name: aantal_termijnen
            type: number
            source:
              regulation: algemene_wet_inkomensafhankelijke_regelingen
              output: aantal_termijnen
              parameters:
                dagtekening_voorschot: $dagtekening_voorschot
                berekeningsjaar: $berekeningsjaar
                maand: $maand
          - name: maanden_ineens
            type: number
            source:
              regulation: algemene_wet_inkomensafhankelijke_regelingen
              output: maanden_ineens
              parameters:
                dagtekening_voorschot: $dagtekening_voorschot
                berekeningsjaar: $berekeningsjaar
                maand: $maand
        output:
          # Art. 22 Awir: valt er in deze maand een termijn, dan wordt die
          # betaald. Zo zegt het beleid wanneer er een betaalde termijn is.
          - name: termijn_wordt_betaald
            type: boolean
          - name: deel_ineens
            type: amount
            type_spec:
              unit: eurocent
          - name: bedrag_per_termijn
            type: amount
            type_spec:
              unit: eurocent
          - name: termijnbedrag
            type: amount
            type_spec:
              unit: eurocent
        actions:
          - output: termijn_wordt_betaald
            value: $termijn_in_maand
          # Het deel in één bedrag: het voorschot naar rato van de maanden.
          - output: deel_ineens
            value:
              operation: ROUND
              precision: 0
              value:
                operation: DIVIDE
                values:
                  - operation: MULTIPLY
                    values:
                      - $voorschotbedrag
                      - $maanden_ineens
                  - 12
          # De rest in gelijke termijnen, naar beneden op hele centen.
          - output: bedrag_per_termijn
            value:
              operation: FLOOR
              precision: 0
              value:
                operation: DIVIDE
                values:
                  - operation: SUBTRACT
                    values:
                      - $voorschotbedrag
                      - $deel_ineens
                  - $aantal_termijnen
          # In een maand met een termijn: in de eerste termijn ook het deel
          # ineens; in de laatste het restant, zodat de termijnen samen het
          # voorschotbedrag zijn.
          - output: termijnbedrag
            value:
              operation: IF
              cases:
                - when:
                    operation: EQUALS
                    subject: $termijn_in_maand
                    value: true
                  then:
                    operation: ADD
                    values:
                      - operation: IF
                        cases:
                          - when:
                              operation: EQUALS
                              subject: $eerste_termijn
                              value: true
                            then: $deel_ineens
                        default: 0
                      - operation: IF
                        cases:
                          - when:
                              operation: EQUALS
                              subject: $laatste_termijn
                              value: true
                            then:
                              operation: SUBTRACT
                              values:
                                - $voorschotbedrag
                                - operation: ADD
                                  values:
                                    - $deel_ineens
                                    - operation: MULTIPLY
                                      values:
                                        - $bedrag_per_termijn
                                        - operation: SUBTRACT
                                          values:
                                            - $aantal_termijnen
                                            - 1
                        default: $bedrag_per_termijn
              default: 0
