---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.5.0/schema/v0.5.0/schema.json
$id: afstemmingsverordening_participatiewet_diemen
regulatory_layer: GEMEENTELIJKE_VERORDENING
publication_date: '2014-12-18'
valid_from: '2015-01-01'
gemeente_code: GM0384
officiele_titel: Afstemmingsverordening Participatiewet, IOAW en IOAZ Diemen 2015
url: https://lokaleregelgeving.overheid.nl/CVDR345917/1
name: Afstemmingsverordening Participatiewet Diemen 2015

# Note: This YAML contains only articles 7 and 9 for the proof of concept.
# The full verordening contains 20 articles.

# Grondslag: Participatiewet artikel 8, eerste lid, onderdeel a
# (gedelegeerd via artikel 18)
legal_basis:
  - law_id: participatiewet
    article: '8'
    description: Artikel 8, eerste lid, onderdeel a - gemeentelijke verordening over verlaging bijstand

articles:
  - number: '7'
    text: |-
      **Gedragingen Participatiewet**

      Gedragingen van een belanghebbende waardoor de verplichting op grond van artikel 9, eerste lid, van de
      Participatiewet niet of onvoldoende is nagekomen worden onderscheiden in de volgende categorieën:

         a. eerste categorie: het zich niet tijdig laten registreren als werkzoekende bij het Uitvoeringsinstituut
         werknemersverzekeringen;

         b. tweede categorie:
            1. het niet of onvoldoende meewerken aan het opstellen, uitvoeren en evalueren van een plan van aanpak als
            bedoeld in artikel 44a van de Participatiewet;
            2. het niet binnen vier weken na melding als bedoeld in artikel 43, vierde en vijfde lid, van de
            Participatiewet voldoende meewerken aan het onderzoek naar de mogelijkheden tot arbeidsinschakeling of
            sociale activering als dit een persoon jonger dan 27 jaar betreft;
            3. het als alleenstaande ouder niet naar vermogen trachten arbeid in deeltijd te verkrijgen;
            4. het niet of onvoldoende verrichten van de door het college opgedragen tegenprestatie als bedoeld in
            artikel 9, eerste lid, onderdeel c, van de Participatiewet;

         c. derde categorie: het niet naar vermogen proberen algemeen geaccepteerde arbeid te verkrijgen.
    url: https://lokaleregelgeving.overheid.nl/CVDR345917/1#Artikel7
    machine_readable:
      # Art. 7 zelf legt geen norm vast (geen verlagingspercentage of -duur);
      # het wijst gedragingen toe aan een categorie. Vandaar INFORMATIEF, niet
      # WAARDEBEPALING (die zit in art. 9, dat de categorie inleest).
      execution:
        produces:
          legal_character: INFORMATIEF
        parameters:
          - name: bsn
            type: string
            required: true
            description: BSN van de belanghebbende
          # Onderdeel a (eerste categorie): niet tijdig registreren als
          # werkzoekende bij het UWV.
          - name: heeft_niet_tijdig_geregistreerd_uwv
            type: boolean
            required: false
            description: >-
              Onderdeel a. Belanghebbende heeft zich niet tijdig laten
              registreren als werkzoekende bij het UWV
          # Onderdeel b, sub 1 t/m 4 (tweede categorie): elk van deze vier
          # gedragingen leidt op zichzelf al tot categorie 2 ("of").
          - name: heeft_niet_meegewerkt_plan_van_aanpak
            type: boolean
            required: false
            description: >-
              Onderdeel b, sub 1. Belanghebbende heeft niet of onvoldoende
              meegewerkt aan het plan van aanpak (art. 44a Pw)
          - name: heeft_niet_meegewerkt_onderzoek_jongeren
            type: boolean
            required: false
            description: >-
              Onderdeel b, sub 2. Belanghebbende (jonger dan 27) heeft niet
              binnen vier weken na melding voldoende meegewerkt aan het
              onderzoek naar arbeidsinschakeling of sociale activering
              (art. 43 vierde en vijfde lid Pw)
          - name: heeft_als_alleenstaande_ouder_geen_deeltijdarbeid_getracht
            type: boolean
            required: false
            description: >-
              Onderdeel b, sub 3. Belanghebbende heeft als alleenstaande
              ouder niet naar vermogen getracht arbeid in deeltijd te
              verkrijgen
          - name: heeft_tegenprestatie_niet_verricht
            type: boolean
            required: false
            description: >-
              Onderdeel b, sub 4. Belanghebbende heeft de opgedragen
              tegenprestatie (art. 9 eerste lid onderdeel c Pw) niet of
              onvoldoende verricht
          # Onderdeel c (derde categorie): niet naar vermogen algemeen
          # geaccepteerde arbeid trachten te verkrijgen.
          - name: heeft_niet_naar_vermogen_arbeid_getracht_te_verkrijgen
            type: boolean
            required: false
            description: >-
              Onderdeel c. Belanghebbende heeft niet naar vermogen algemeen
              geaccepteerde arbeid getracht te verkrijgen
        output:
          # Zonder één van de gedragingen uit lid a t/m c is er geen
          # gedragscategorie: dat is afwezigheid, geen categorie "0" (RFC-036).
          # Art. 9 leest deze output in plaats van een los ingevoerd getal.
          - name: gedragscategorie
            type: number
            nullable: true
            description: >-
              Categorie van de gedraging conform art. 7 (1, 2 of 3), of
              afwezig als geen van de gedragingen zich voordoet
        actions:
          # Bij samenloop geldt de zwaarste categorie (c > b > a); de tekst
          # noemt geen samenloopregel, maar de indeling in "categorieën" van
          # toenemende ernst (5% / 30% / 100% in art. 9) maakt de derde
          # categorie de zwaarste. Categorie 3 wordt daarom als eerste getoetst.
          - output: gedragscategorie
            value:
              operation: IF
              cases:
                - when:
                    operation: EQUALS
                    subject: $heeft_niet_naar_vermogen_arbeid_getracht_te_verkrijgen
                    value: true
                  then: 3
                - when:
                    operation: OR
                    conditions:
                      - operation: EQUALS
                        subject: $heeft_niet_meegewerkt_plan_van_aanpak
                        value: true
                      - operation: EQUALS
                        subject: $heeft_niet_meegewerkt_onderzoek_jongeren
                        value: true
                      - operation: EQUALS
                        subject: $heeft_als_alleenstaande_ouder_geen_deeltijdarbeid_getracht
                        value: true
                      - operation: EQUALS
                        subject: $heeft_tegenprestatie_niet_verricht
                        value: true
                  then: 2
                - when:
                    operation: EQUALS
                    subject: $heeft_niet_tijdig_geregistreerd_uwv
                    value: true
                  then: 1

  - number: '9'
    text: |-
      **Hoogte en duur van de verlaging**

      1. De verlaging bij gedragingen als bedoeld in de artikelen 7 en 8 bedraagt:
         a. eerste categorie: 5 procent van de bijstandsnorm gedurende 1 maand;
         b. tweede categorie: 30 procent van de bijstandsnorm gedurende 1 maand;
         c. derde categorie: 100 procent van de bijstandsnorm gedurende 1 maand.

      2. Het college kan de verlaging afwijkend vaststellen, met een minimum van 5% en een maximum van 100% van de
      bijstandsnorm, als de ernst van de gedraging, de mate van verwijtbaarheid of de individuele omstandigheden van de
      belanghebbende daartoe aanleiding geven.
    url: https://lokaleregelgeving.overheid.nl/CVDR345917/1#Artikel9
    machine_readable:
      implements:
        - law: participatiewet
          article: '8'
          open_term: verlaging_percentage
          gelet_op: Gelet op artikel 8, eerste lid, onderdeel a van de Participatiewet
        - law: participatiewet
          article: '8'
          open_term: duur_maanden
          gelet_op: Gelet op artikel 8, eerste lid, onderdeel a van de Participatiewet
      definitions:
        # Categorie 1 en 2: gemeente bepaalt percentage
        PERCENTAGE_CATEGORIE_1:
          value: 5
        PERCENTAGE_CATEGORIE_2:
          value: 30
        # Categorie 3: percentage komt uit Participatiewet art. 18 lid 5 (zie input)
        DUUR_MAANDEN:
          value: 1
      execution:
        produces:
          legal_character: WAARDEBEPALING
        parameters:
          - name: bsn
            type: string
            required: true
            description: BSN van de belanghebbende
          # Als parameter behouden zodat een aanroeper de categorie nog
          # rechtstreeks kan meegeven (parameter overschrijft source, zie
          # test_service_parameter_override); zonder parameter valt terug
          # op de afgeleide waarde uit art. 7 hieronder.
          - name: gedragscategorie
            type: number
            required: false
            nullable: true
            description: >-
              Gedragscategorie (1, 2 of 3), of afwezig als geen verwijtbare
              gedraging is vastgesteld; indien niet meegegeven wordt dit
              afgeleid via art. 7
        input:
          # Categorie komt uit art. 7 (intra-law): dat artikel leidt de
          # categorie af uit de feitelijke criteria van lid a t/m c.
          # Nullable: geen van de gedragingen betekent afwezigheid van een
          # categorie, niet categorie "0" (RFC-036).
          - name: gedragscategorie
            type: number
            nullable: true
            description: >-
              Gedragscategorie conform art. 7 (1, 2 of 3), of afwezig als
              geen verwijtbare gedraging is vastgesteld
            source:
              output: gedragscategorie
          # Categorie 3 percentage is vastgelegd in Participatiewet art. 18 lid 5
          # Dit is GEEN gemeentelijke bevoegdheid - de rijkswet schrijft 100% voor
          - name: percentage_categorie_3
            type: number
            description: Verlagingspercentage voor categorie 3 uit Participatiewet art. 18 lid 5
            source:
              regulation: participatiewet
              output: verlaging_percentage_lid_5

        output:
          # Art. 9 lid 1 kent drie categorieën (a, b, c) naast "geen gedraging".
          # Voor een gedragscategorie buiten 0 tot en met 3 stelt de verordening
          # geen verlaging en geen duur vast: die waarden zijn dan afwezig, niet
          # nul (RFC-036).
          - name: verlaging_percentage
            type: number
            nullable: true
            description: Verlagingspercentage conform art. 9 lid 1
          - name: duur_maanden
            type: number
            nullable: true
            description: Aantal maanden dat de verlaging duurt
        actions:
          # Zonder categorie (art. 7 leverde geen gedraging op) blijft
          # verlaging_percentage afwezig: geen IF-tak matcht, dus de output
          # is nullable-afwezig in plaats van 0 (RFC-036).
          - output: verlaging_percentage
            value:
              operation: IF
              cases:
                - when:
                    operation: EQUALS
                    subject: $gedragscategorie
                    value: 1
                  then: $PERCENTAGE_CATEGORIE_1
                - when:
                    operation: EQUALS
                    subject: $gedragscategorie
                    value: 2
                  then: $PERCENTAGE_CATEGORIE_2
                - when:
                    operation: EQUALS
                    subject: $gedragscategorie
                    value: 3
                  then: $percentage_categorie_3
          - output: duur_maanden
            value:
              operation: IF
              cases:
                - when:
                    operation: EQUALS
                    subject: $gedragscategorie
                    value: null
                  then: null
              default: $DUUR_MAANDEN
