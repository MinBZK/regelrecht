  - number: '6'
    url: https://wetten.overheid.nl/BWBR0008763/2026-01-01#Artikel6
    text: >-
      De voorzitter van de huurcommissie vermeldt in de verklaring, bedoeld in artikel 6, eerste lid,
      onder b, van de Uitvoeringswet huurprijzen woonruimte , de hoogte van de huurprijs en of deze al dan
      niet redelijk is, beoordeeld naar de bij of krachtens die wet gestelde regels. Indien de voorzitter
      van oordeel is dat de huurprijs niet redelijk is, vermeldt hij tevens het puntenaantal van de woning
      op basis van het waarderingsstelsel, bedoeld in artikel 5 van het Besluit huurprijzen woonruimte .
  - number: '7'
    url: https://wetten.overheid.nl/BWBR0008763/2026-01-01#Artikel7
    text: >-
