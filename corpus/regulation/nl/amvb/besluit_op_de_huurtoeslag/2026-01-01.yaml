  - number: '1'
    url: https://wetten.overheid.nl/BWBR0008763/2026-01-01#Artikel1
    text: >-
      In dit besluit wordt verstaan onder wet: Wet op de huurtoeslag .
  - number: '2'
    url: https://wetten.overheid.nl/BWBR0008763/2026-01-01#Artikel2
    text: >-
      1 Op verzoek blijft voor de toepassing van artikel 2 van de wet , van artikel 7 van de Algemene wet
      inkomensafhankelijke regelingen en de op die artikelen berustende bepalingen voor zover het betreft
      het toekennen van een huurtoeslag, een huurder, diens partner of een medebewoner buiten beschouwing
      indien: a. hij langer dan een jaar op een ander adres verblijft dan het adres waarop hij als
      ingezetene in de basisregistratie personen staat ingeschreven, en b. sprake is van een bijzondere
      omstandigheid. 2 Als een bijzondere omstandigheid als bedoeld in het eerste lid, onderdeel b, wordt
      aangemerkt een verblijf in: a. een verpleeghuis; b. een psychiatrische inrichting; c. een
      penitentiaire inrichting.
  - number: 2a
    url: https://wetten.overheid.nl/BWBR0008763/2026-01-01#Artikel2a
    text: >-
      1 Op verzoek blijft voor de toepassing van artikel 2 van de wet , van artikel 7 van de Algemene wet
      inkomensafhankelijke regelingen en de op die artikelen berustende bepalingen voor zover het betreft
      het toekennen van een huurtoeslag, een partner of medebewoner buiten beschouwing indien sprake is
      van een verzorgingsbehoefte bij de huurder, diens partner of een medebewoner. 2 Het eerste lid geldt
      uitsluitend ten aanzien van de partner of medebewoner die met het oog op de verzorgingsbehoefte van
      de huurder of van hemzelf als ingezetene op hetzelfde woonadres als de huurder staat ingeschreven in
      de basisregistratie personen en is van toepassing indien: a. de verzorgingsbehoefte blijkt uit een
      indicatiebesluit van het CIZ, genoemd in artikel 7.1.1 van de Wet langdurige zorg ; b. het voordeel
      uit sparen en beleggen als bedoeld in artikel 5.2 van de Wet inkomstenbelasting 2001 over het
      berekeningsjaar van de in het eerste lid bedoelde buiten beschouwing te laten persoon, niet meer
      bedraagt dan € 5.516 en c. het gezamenlijke toetsingsinkomen van de huurder, diens partner en de
      medebewoners, met inbegrip van de in het eerste lid bedoelde buiten beschouwing te laten persoon,
      niet meer bedraagt dan € 60.525. 3 Voor de toepassing van het eerste lid wordt geen rekening
      gehouden met de verzorgingsbehoefte van een minderjarige eerstegraads bloed- of aanverwant in de
      neergaande lijn. 4 Artikel 27, eerste lid, van de wet is van overeenkomstige toepassing op de in het
      tweede lid, onderdelen b en c, vermelde bedragen, waarbij ten aanzien van het in het tweede lid,
      onderdeel c, vermelde bedrag het resultaat naar boven wordt afgerond op een veelvoud van € 25.
  - number: 2b
    url: https://wetten.overheid.nl/BWBR0008763/2026-01-01#Artikel2b
    text: >-
      1 Op verzoek blijven bij de toepassing van artikel 7, eerste en tweede lid, van de Algemene wet
      inkomensafhankelijke regelingen voor zover het betreft het toekennen van een huurtoeslag, de
      navolgende bestanddelen van het toetsingsinkomen buiten beschouwing: a. afkoopsommen van ouderdoms-
      of nabestaandenpensioen die in het berekeningsjaar niet meer bedragen dan het bedrag dat is
      opgenomen in artikel 66, eerste lid, van de Pensioenwet en artikel 78, eerste lid, van de Wet
      verplichte beroepspensioenregeling ; b. nabetalingen van inkomsten als bedoeld in afdeling 3.3 en
      3.5 van de Wet inkomstenbelasting 2001 ; c. wezenuitkeringen die met toepassing van artikel 49 van
      de Algemene nabestaandenwet aan een ander dan de wettelijke vertegenwoordiger van het kind
      betaalbaar zijn gesteld; d. afkoopsommen op grond van de Liquidatiewet ongevallenwetten ; e.
      verhogingen op grond van artikel 10 van de Wet arbeidsongeschiktheidsverzekering zelfstandigen ,
      artikel 2:51 of 3:9 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten of artikel 22 van
      de Wet op de arbeidsongeschiktheidsverzekering voorzover het bedrag van de verhoging niet hoger is
      dan het in artikel 6.20, eerste lid, onderdeel a, van de Wet inkomstenbelasting 2001 genoemde
      drempelbedrag voor uitgaven voor specifieke zorgkosten. 2 Indien sprake is van een nabetaling die
      over de berekeningsjaren waarop deze nabetaling betrekking heeft gemiddeld meer dan € 2300 per jaar
      bedraagt, vindt het eerste lid, onderdeel b, uitsluitend toepassing indien over de berekeningsjaren
      waarop de nabetaling betrekking heeft minder huurtoeslag zou worden genoten dan indien de betrokken
      inkomsten niet als nabetaling zouden zijn uitbetaald. 3 Indien de belanghebbende gedurende het
      gehele berekeningsjaar een partner heeft, wordt het in het eerste lid, onderdeel e, bedoelde
      drempelbedrag voor uitgaven voor specifieke zorgkosten verdubbeld.
  - number: 2c
    url: https://wetten.overheid.nl/BWBR0008763/2026-01-01#Artikel2c
    text: >-
      Een verzoek als bedoeld in de artikelen 2, eerste lid , 2a, eerste lid , en 2b, eerste lid,
      onderdelen c en e , wordt geacht mede te zijn gedaan voor op het berekeningsjaar volgende
      berekeningsjaren.
  - number: '3'
    url: https://wetten.overheid.nl/BWBR0008763/2026-01-01#Artikel3
    text: >-
      1 Een woongebouw of een woning waarvan onzelfstandige woonruimte deel uitmaakt als bedoeld in
      artikel 11, eerste lid, onder b, van de wet , kan op voet van artikel 11, tweede lid, van de wet,
      slechts door de Dienst Toeslagen worden aangewezen indien: a. de desbetreffende woonruimten geschikt
      en bestemd zijn voor: 1°. begeleid wonen, of een daarmee vergelijkbare woonvorm, of 2°. groepswonen
      door ouderen, of een daarmee vergelijkbare woonvorm; b. de desbetreffende huurovereenkomst naar haar
      aard niet van korte duur is; c. de rekenhuur niet anders dan door middel van een huurtoeslag wordt
      gesubsidieerd, en d. de desbetreffende woonruimten zodanig zijn verdeeld dat elke huurder over
      minimaal één privé-vertrek beschikt. 2 Een woongebouw of een woning waarvan onzelfstandige
      woonruimte deel uitmaakt, bedoeld in het eerste lid, onderdeel a, onder 1°, kan voorts slechts
      worden aangewezen indien: a. de desbetreffende woonruimten bestemd zijn voor huurders die zonder
      zorg of begeleiding niet zelfstandig kunnen wonen; b. het begeleid wonen of de daarmee vergelijkbare
      woonvorm gericht is op integratie en acceptatie van de bewoners in de nabije omgeving; c. de zorg of
      begeleiding plaatsvindt door een instelling als bedoeld in artikel 1, eerste lid, onderdeel f, van
      de Wet toelating zorginstellingen , die zorg verleent waarop aanspraak bestaat ingevolge de Wet
      langdurige zorg of door een andere deskundige, erkende hulpverleningsinstantie, of de huurders
      beschikken over een persoonsgebonden budget als bedoeld in de Wet langdurige zorg, de
      Zorgverzekeringswet , de Wet maatschappelijke ondersteuning 2015 of de Jeugdwet ; d. er een
      gescheiden huur- en zorgovereenkomst is, en e. de desbetreffende woonruimten niet bestemd zijn om
      uitsluitend te worden bewoond door minderjarige huurders. 3 Een woongebouw of een woning waarvan
      onzelfstandige woonruimte deel uitmaakt, bedoeld in het eerste lid, onderdeel a, onder 2°, kan
      voorts slechts worden aangewezen indien: a. alle huurders van de desbetreffende woonruimten zijn
      genoemd in één overeenkomst van huur en verhuur; b. in de desbetreffende woonruimten ten minste drie
      huishoudens zijn gehuisvest, en c. ten minste 80 procent van de huurders van de desbetreffende
      woonruimten de pensioengerechtigde leeftijd, bedoeld in artikel 7a, eerste lid, van de Algemene
      Ouderdomswet , hebben bereikt. 4 De Dienst Toeslagen kan de aanwijzing intrekken indien niet langer
      wordt voldaan aan het eerste, tweede of derde lid.
