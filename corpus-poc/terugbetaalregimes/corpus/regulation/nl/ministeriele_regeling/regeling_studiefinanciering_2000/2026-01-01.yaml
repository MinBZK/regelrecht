  # VEREENVOUDIGING: de rentepercentages worden in werkelijkheid jaarlijks
  # vastgesteld in een afzonderlijke Staatscourant-regeling (2026:
  # Stcrt. 2025, 39853, o.g.v. artikel 6.3 WSF 2000). Voor deze casus zijn
  # ze als artikel in de Regeling studiefinanciering 2000 gemodelleerd; zie
  # de fidelity-audit-TODO in de README.
  # 2026: 2,29% (SF15-regimes) en 2,33% (SF35 en levenlanglerenkrediet),
  # Stand van de Uitvoering OCW 2026, tabel hoofdstuk 2.
  - number: '5.0'
    text: >-
      Het rentepercentage, bedoeld in artikel 6.3 van de wet, bedraagt voor
      het kalenderjaar 2026: 2,29 voor leningen waarop een
      terugbetalingsperiode van 15 jaren van toepassing is, en 2,33 voor
      leningen waarop een terugbetalingsperiode van 35 jaren van toepassing
      is dan wel die als levenlanglerenkrediet zijn verstrekt.
