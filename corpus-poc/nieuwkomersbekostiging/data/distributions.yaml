# SCHOLEN. `aantal` = echte scholen met minstens één nieuwkomer per jaar;
# de generator schaalt het aantal gesimuleerde scholen mee met de steekproef
# zodat de drempel van vier per school realistisch uitpakt.
# `aantal` telt scholen met minstens een nieuwkomer PER JAAR; de generator
# schaalt daarom tegen de instroom van een jaar, niet tegen de instroom over
# de hele horizon (tot 8 september 2026 deed hij dat wel, waardoor er acht
# keer te weinig gesimuleerde scholen waren, elke school tientallen
# nieuwkomers had en de drempel van vier nooit bond).
# aantal_scholen_totaal: DUO-open data, ca. 6.100 basisscholen en ca.
# 1.400 vo-vestigingen (https://duo.nl/open_onderwijsdata/primair-onderwijs/scholen-en-adressen/
# en https://duo.nl/open_onderwijsdata/voortgezet-onderwijs/scholen-en-adressen/),
# afgerond. Aandeel met nieuwkomers en de verdeling per school per jaar
# zijn AANNAME met lange staart: de meeste scholen met nieuwkomers hebben
# er één tot drie (onder de drempel op een peildatum), enkele nieuwkomers-
# voorzieningen, taalklassen en ISK's hebben er tientallen tot honderden
# (LOWAN telt ruim honderd ISK's). Rekenslag: po 2.700 scholen x
# gemiddeld ca. 5,9 uit de tabel = ca. 15.900; vo 640 x ca. 18 = ca.
# 11.500. Met een venster van 1,2 tot 2 jaar staat op een peildatum ruwweg
# 60 % van de po-scholen met nieuwkomers onder de drempel, samen goed voor
# ca. 10-15 % van de leerlingen. Een betere anker is de DUO-reeks
# "leerlingen per vestiging naar NOAT" (duo_brin6_noat) zodra iemand die
# aan nieuwkomers koppelt.
scholen:
  po:
    aantal: 2700                  # AANNAME, ca. 45 % van de basisscholen
    aantal_scholen_totaal: 6000
    nieuwkomers_per_school:
      - { p: 0.0, value: 1 }
      - { p: 0.25, value: 1 }
      - { p: 0.5, value: 2 }
      - { p: 0.75, value: 4 }
      - { p: 0.9, value: 10 }
      - { p: 0.95, value: 25 }
      - { p: 0.99, value: 60 }
      - { p: 1.0, value: 120 }
  vo:
    aantal: 640                   # AANNAME, ca. 45 % van de vo-vestigingen
    aantal_scholen_totaal: 1400
    nieuwkomers_per_school:
      - { p: 0.0, value: 1 }
      - { p: 0.25, value: 2 }
      - { p: 0.5, value: 4 }
      - { p: 0.75, value: 10 }
      - { p: 0.9, value: 40 }
      - { p: 0.95, value: 80 }
      - { p: 0.99, value: 200 }
      - { p: 1.0, value: 350 }

# Schoolsoort binnen po; nieuwkomers in sbo zijn zeldzaam. AANNAME.
schoolsoort_verdeling_po: { basisschool: 0.97, sbo: 0.03 }

# Aandeel records op internationaal georiënteerd onderwijs (IGBO, WPO
# art. 85a; IGVO), uitgesloten van de bekostiging. AANNAME.
internationaal_georienteerd_fractie: { po: 0.02, vo: 0.01 }

# Kans dat een asielzoeker die vóór 1 februari is ingeschreven ook
# daadwerkelijk als eerstejaars asielzoeker in die 1-februari-telling is
# meegeteld (At in art. 34 lid 9; anders geen 1-januari-correctie).
# AANNAME: niet elke school levert de telling met de nieuwkomer erin aan,
# en een deel is tussen inschrijving en telling al verhuisd.
in_telling_1_februari_prior: 0.6

# Bij ambigu_code en zonder_bsn: aandeel waarvoor het bestuur ASIELZOEKER
# vastlegt (rest OVERIGE_VREEMDELING). AANNAME; bij zonder_bsn ligt het in
# werkelijkheid hoger (asielzoekers in procedure hebben nog geen BSN), bij
# ambigu_code lager.
oordeel_bevoegd_gezag_asielzoeker_fractie: 0.6

# Aandeel van die records waarvoor het bestuur (nog) geen oordeel heeft
# vastgelegd: oordeel_bevoegd_gezag null, engine geeft BESTUUR_BEOORDEELT.
# AANNAME.
oordeel_ontbreekt_fractie: 0.1

# Aandeel records dat op een peildatum werkelijk schoolgaand is; de rest is
# uitgeschreven, verhuisd of langdurig afwezig. AANNAME.
werkelijk_schoolgaand_fractie: 0.98

# INDEXATIE van de bedragen in het corpus (bedragen 2026) per jaar.
# 2025: het corpus draagt de bedragen 2026; voor 2025 rekenen we daarmee,
# tenzij het corpus de regeling 2025 bevat. 2027 en 2028: loon- en
# prijsbijstelling 3 % per jaar, cumulatief. AANNAME.
bedragen_index_per_jaar:
  2025: 1.0
  2026: 1.0
  2027: 1.03
  2028: 1.0609
  2029: 1.0927
  2030: 1.1255

# UITGAVEN-ANKERS voor de plausibiliteitstoets, eurocent per jaar.
# vo: aanvullende bekostiging eerste opvang nieuwkomers, OCW-jaarverslagen
# artikel 3 (rijksfinancien.nl): 2023 EUR 291,3 mln, 2024 EUR 260,9 mln,
# 2025 EUR 262,9 mln. po: geen aparte regel in het jaarverslag; de ADR
# voert een onzekerheidspost van EUR 207,5 mln (2023) op voor de
# nieuwkomersbekostiging po, dus ca. EUR 200-210 mln.
# Rekenslag vo: EUR 262,9 mln / 4 peildata / 19.586 = ca. EUR 3.350 per
# leerling per peildatum, dicht bij het eerste-categoriebedrag (art. 4:
# EUR 3.909,08 per kwartaal in 2026; tweede categorie EUR 1.426,33),
# terwijl een tweejaarsvenster een mix van grofweg de helft eerste en de
# helft tweede categorie geeft (ca. EUR 2.700). Mogelijke verklaring: de
# 1-oktoberstand is een dieptepunt in het jaar (de najaarspiek komt erna;
# de standen van 1 januari en 1 april liggen hoger), zodat het jaargemiddelde
# boven 19.586 ligt. Open vraag voor OCW.
# Rekenslag po: EUR 207,5 mln / 4 / 19.358 = ca. EUR 2.680 per leerling
# per peildatum, te toetsen aan de gewogen mix van de bedragen in art. 34.
uitgaven_realisatie:
  vo:
    2023: 29130000000
    2024: 26090000000
    2025: 26290000000
  po:
    2023: 20750000000   # ADR-onzekerheidspost, geen realisatiecijfer
