    - { p: 0.9, value: 90 }
    - { p: 1.0, value: 180 }
  overige_vreemdeling:
    - { p: 0.0, value: 1 }
    - { p: 0.1, value: 7 }
    - { p: 0.25, value: 14 }
    - { p: 0.5, value: 30 }
    - { p: 0.75, value: 60 }
    - { p: 0.9, value: 120 }
    - { p: 1.0, value: 270 }

