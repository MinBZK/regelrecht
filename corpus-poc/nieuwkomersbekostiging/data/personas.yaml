# Persona's voor de school- en burgerview. Elk record heeft hetzelfde schema
# als een populatierecord uit de generator (zie data/distributions.yaml en
# docs/datamodel.md §1), zodat echte DUO/OCW-microdata (ROD, bestand
# Nieuwkomers) later drop-in vervangbaar is. Veldnamen zijn de inputnamen in
# de wet-YAML; de engine registreert deze lijst als databron 'personas' met
# sleutel bsn. Datums ISO, booleans echt boolean, null = onbekend. Het veld
# `gewicht` ontbreekt bewust: dat heeft alleen de populatie.
#
# De categorie (ASIELZOEKER / OVERIGE_VREEMDELING / BESTUUR_BEOORDEELT / GEEN),
# de aftrek voor de periode vóór de vierde verjaardag en het aantal
# bekostigbare kwartalen worden in de wet afgeleid (regeling art. 34), niet
# hier: verblijfstitel_code, datum_vestiging_nederland, geboortedatum en
# eerste_inschrijfdatum bepalen de uitkomst. De verwachte uitkomst staat per
# persona in de omschrijving en is de toetssteen voor de Gherkin-scenario's.
#
# C1-C6 zijn de zes voorbeelden uit de OCW/DUO-visual "Bekostiging voor
# nieuwkomers in het primair onderwijs" (open.overheid.nl, document
# 2b78b15c-82f4-45de-8c80-9a47671ccc23): p. 3 normale situatie, p. 4 rekening
# houdend met de vierde verjaardag, p. 5 gat tussen vierde verjaardag en
# inschrijving, p. 6 het bestand Nieuwkomers (tabblad 1 eenduidig, 2 ambigu,
# 3 onderwijsnummer), p. 7 de aanvraag en de drempel van vier. De visual noemt
# geen namen, geboortedata of verblijfstitelcodes; die zijn hier zo gekozen
# dat de afleiding exact de kwartalen uit de visual oplevert.
#
# Scholen: 05AB basisschool met vier tellende nieuwkomers in 2025/26 (boven
# de drempel, art. 34 lid 2); 12CD basisschool met twee tellende nieuwkomers
# plus twee leerlingen die niet tellen (onder de drempel); 31GH IGBO-afdeling;
# 20EF vo-vestiging met een internationale schakelklas.
# Datums: de visual speelt in 2024-2026; hier is alles één jaar opgeschoven
# (2024 -> 2025), net als in scenarios/nieuwkomers_po.feature, omdat het corpus
# versies vanaf 2025 kent en de engine geen peildatum vóór de eerste versie
# accepteert. De mechaniek is jaar-onafhankelijk.
