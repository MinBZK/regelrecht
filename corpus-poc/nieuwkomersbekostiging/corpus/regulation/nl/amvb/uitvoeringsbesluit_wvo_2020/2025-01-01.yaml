---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.5.6/schema/v0.5.6/schema.json
$id: uitvoeringsbesluit_wvo_2020
regulatory_layer: AMVB
publication_date: '2021-10-14'
valid_from: '2025-01-01'
valid_to: '2025-12-31'
bwb_id: BWBR0045787
url: https://wetten.overheid.nl/BWBR0045787/2025-09-30
name: Uitvoeringsbesluit WVO 2020
competent_authority:
  name: Minister van Onderwijs, Cultuur en Wetenschap
legal_basis:
  - law_id: wet_voortgezet_onderwijs_2020
    article: '5.8'
    description: >-
      Artikel 5.8, derde lid: bij of krachtens algemene maatregel van
      bestuur nadere regels over de leerlingen die niet worden meegeteld
articles:
  # Redactie zoals die gold tot Stb. 2025, 188 (Besluit van 14 juli 2025):
  # de begripsbepaling "nieuwkomer" knoopt aan bij de verblijfsduur in
  # Nederland (datum vestiging), niet bij de eerste inschrijving op een
  # school. Artikel II van Stb. 2025, 188 houdt deze redactie tot 1 januari
  # 2026 van toepassing op de vaststelling van de aanvullende bekostiging
  # eerste opvang nieuwkomers vo; daarom loopt deze corpusversie tot en met
  # 31 december 2025 (zie de versie 2026-01-01 voor de nieuwe redactie).
  #
  # Alleen de begripsbepaling "nieuwkomer" (artikel 1.1) en artikel 6.8,
  # eerste lid, onderdeel d, zijn opgenomen.
  # ---------------------------------------------------------------- 1.1
  - number: '1.1'
    text: >-
      In dit besluit wordt verstaan onder: (...) nieuwkomer: leerling die:
      a. vreemdeling als bedoeld in artikel 1 van de Vreemdelingenwet 2000
      is, b. als werkelijk schoolgaand staat ingeschreven bij een school, c.
      geen Internationaal georiënteerd voortgezet onderwijs of Europees
      secundair onderwijs volgt, en; d. op de teldatum korter dan twee jaar
      in Nederland verblijft; (...)
    url: https://wetten.overheid.nl/BWBR0045787/2025-09-30#Hoofdstuk1_Artikel1.1
    machine_readable:
      definitions:
        maximale_verblijfsduur_jaren:
          value: 2
          type: number
          description: >-
            Onderdeel d: op de teldatum korter dan twee jaar in Nederland
      execution:
        parameters:
          - name: bsn
            type: string
            required: true
            description: Persoonsgebonden nummer van de leerling
        input:
          - name: is_vreemdeling
            type: boolean
            source:
              description: >-
                Onderdeel a: vreemdeling als bedoeld in artikel 1
                Vreemdelingenwet 2000 (geen Nederlandse nationaliteit)
          - name: werkelijk_schoolgaand
            type: boolean
            source:
              description: >-
                Onderdeel b: als werkelijk schoolgaand ingeschreven bij een
                school op de teldatum (register onderwijsdeelnemers)
          - name: internationaal_georienteerd
            type: boolean
            source:
              description: >-
                Onderdeel c: volgt Internationaal georiënteerd voortgezet
                onderwijs of Europees secundair onderwijs
          - name: woonachtig_in_nederland
            type: boolean
            source:
              description: 'Onderdeel d: verblijft in Nederland'
          - name: datum_vestiging_nederland
            type: date
            source:
              description: >-
                Onderdeel d: datum van vestiging in Nederland (eerste datum
                verblijfstitel of datum in Nederland volgens de BRP, dan wel
                de datum binnenkomst volgens het bevoegd gezag; zie artikel
                4, vijfde en zesde lid, Regeling aanvullende bekostiging
                eerste opvang nieuwkomers vo)
        output:
          - name: jaren_in_nederland
            type: number
            description: >-
              Gehele jaren tussen de datum van vestiging in Nederland en de
              teldatum
          - name: is_nieuwkomer
            type: boolean
            description: >-
              Nieuwkomer in de zin van artikel 1.1: voldoet aan de
              onderdelen a tot en met d op de teldatum
        actions:
          - output: jaren_in_nederland
            value:
              operation: DATE_DIFF
              from: $datum_vestiging_nederland
              to: $referencedate.iso
              in: years
          - output: is_nieuwkomer
            value:
              operation: AND
              conditions:
                - operation: EQUALS
                  subject: $is_vreemdeling
                  value: true
                - operation: EQUALS
                  subject: $werkelijk_schoolgaand
                  value: true
                - operation: EQUALS
                  subject: $internationaal_georienteerd
                  value: false
                - operation: EQUALS
                  subject: $woonachtig_in_nederland
                  value: true
                # "verblijft": de vestiging ligt op of voor de teldatum
                - operation: LESS_THAN_OR_EQUAL
                  subject: $datum_vestiging_nederland
                  value: $referencedate.iso
                - operation: LESS_THAN
                  subject: $jaren_in_nederland
                  value: $maximale_verblijfsduur_jaren

  # ---------------------------------------------------------------- 6.8
  - number: '6.8'
    text: >-
      1. Voor het bepalen van de hoogte van de bekostiging van een school of
      scholengemeenschap worden niet meegeteld de leerlingen die: (...) d.
      voor zover het betreft de bekostiging bedoeld in de artikelen 5.4,
      eerste lid, onderdeel b, en 5.5 van de wet, nieuwkomers zijn die op de
      teldatum korter dan 1 jaar in Nederland zijn.
    url: https://wetten.overheid.nl/BWBR0045787/2025-09-30#Hoofdstuk6_Paragraaf2_Artikel6.8
    machine_readable:
      implements:
        - law: wet_voortgezet_onderwijs_2020
          article: '5.8'
          open_term: niet_meegetelde_leerlingen
          gelet_op: Gelet op artikel 5.8, derde lid, van de Wet voortgezet onderwijs 2020
      definitions:
        maximale_verblijfsduur_jaren:
          value: 1
          type: number
          description: 'Onderdeel d: op de teldatum korter dan 1 jaar in Nederland'
      execution:
        parameters:
          - name: bsn
            type: string
            required: true
            description: Persoonsgebonden nummer van de leerling
        input:
          - name: is_nieuwkomer
            type: boolean
            source:
              output: is_nieuwkomer
            description: Nieuwkomer als bedoeld in artikel 1.1
          - name: datum_vestiging_nederland
            type: date
            source:
              description: Datum van vestiging in Nederland (BRP)
        output:
          - name: jaren_in_nederland_op_teldatum
            type: number
            description: >-
              Gehele jaren tussen de datum van vestiging in Nederland en de
              teldatum
          - name: korter_dan_een_jaar_ingeschreven
            type: boolean
            description: >-
              Onderdeel d (redactie tot 2026): nieuwkomer die op de teldatum
              korter dan 1 jaar in Nederland is en daarom niet meetelt voor
              de reguliere bekostiging; de outputnaam volgt het datamodel en
              de redactie vanaf 2026 (inschrijving), de rekenregel hier is
              de verblijfsduur
        actions:
          - output: jaren_in_nederland_op_teldatum
            value:
              operation: DATE_DIFF
              from: $datum_vestiging_nederland
              to: $referencedate.iso
              in: years
          - output: korter_dan_een_jaar_ingeschreven
            value:
              operation: AND
              conditions:
                - operation: EQUALS
                  subject: $is_nieuwkomer
                  value: true
                - operation: LESS_THAN
                  subject: $jaren_in_nederland_op_teldatum
                  value: $maximale_verblijfsduur_jaren
