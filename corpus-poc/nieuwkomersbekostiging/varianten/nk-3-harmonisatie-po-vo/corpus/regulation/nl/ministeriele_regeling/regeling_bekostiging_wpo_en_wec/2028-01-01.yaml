# VARIANT nk-3 (harmonisatie po-vo): nieuwe versie per 1 januari 2028 waarin het po de
# systematiek van het vo volgt. Eén definitie (elke vreemdeling met een verblijfstitel
# uit de tabel, ook de ambigue codes), twee jaar voor iedereen (in het model: alle codes
# in de lijst van 'asielzoeker', die hier 'nieuwkomer' betekent), de vo-bedragen per
# kwartaal (EUR 3.909,08 eerste jaar = 15.636,32 per jaar; EUR 1.426,33 tweede jaar =
# 5.705,32), ambtshalve vaststelling met accountantsvalidatie, geen drempel.
# Vereenvoudiging: eerste/tweede categorie naar de teldatum 1 oktober is benaderd als
# eerste en tweede jaar na de eerste inschrijving; de vierde-verjaardag-regel blijft
# als knop staan. Publicatiedatum fictief.
---
