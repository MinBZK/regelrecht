              description: >-
                Afdeling voor internationaal georiënteerd basisonderwijs
                (artikel 85a WPO) of afdeling basisonderwijs van de Europese
                school te Den Haag (eerste lid) (personas-databron)
          - name: oordeel_bevoegd_gezag
            type: string
            source:
              description: >-
                Oordeel van het bevoegd gezag, ASIELZOEKER of
                OVERIGE_VREEMDELING, in de gevallen van het elfde lid; null
                zolang dat oordeel er niet is (personas-databron)
          - name: bedrag_per_asielzoeker_eerste_jaar
            type: amount
            type_spec:
              unit: eurocent
            source:
              output: bedrag_per_asielzoeker_eerste_jaar
          - name: bedrag_per_overige_vreemdeling
            type: amount
            type_spec:
              unit: eurocent
            source:
              output: bedrag_per_overige_vreemdeling
          - name: kwartaalfractie
            type: number
            type_spec:
              unit: ratio
            source:
              output: kwartaalfractie
          - name: kwartalen_tweede_jaar_asielzoeker
            type: number
            source:
              output: kwartalen_tweede_jaar_asielzoeker
          - name: bedrag_per_asielzoeker_tweede_jaar
            type: amount
            type_spec:
              unit: eurocent
            source:
              output: bedrag_per_asielzoeker_tweede_jaar
          - name: kwartalen_maximaal_sbo
            type: number
            source:
              output: kwartalen_maximaal_sbo
          - name: bedrag_per_vreemdeling_sbo
            type: amount
            type_spec:
              unit: eurocent
            source:
              output: bedrag_per_vreemdeling_sbo
        output:
          - name: valt_onder_artikel_36
            type: boolean
            description: >-
              Ingeschreven op een speciale school voor basisonderwijs: de
              opvang valt dan onder artikel 36 in plaats van artikel 34 en 35
          - name: geboren_in_nederland
            type: boolean
            description: >-
              Twaalfde lid: geboren in Nederland met de verblijfsrechtelijke
              status van een van de ouders of voogden. Afgeleid uit de data:
              de datum van vestiging in Nederland ligt niet na de
              geboortedatum, want voor een hier geboren kind is de BRP-datum
              van vestiging de geboortedatum
          - name: categorie_nieuwkomer
            type: string
            description: >-
              ASIELZOEKER, OVERIGE_VREEMDELING, BESTUUR_BEOORDEELT (het bevoegd
              gezag moet nog bepalen, elfde lid) of GEEN
          - name: vierde_verjaardag
            type: date
            description: De dag waarop de leerling de leeftijd van vier jaar bereikt
          - name: aftrek_maanden_voor_vierde_verjaardag
            type: number
            type_spec:
              unit: months
            description: >-
              Hele maanden tussen de datum van vestiging in Nederland en het
              bereiken van de leeftijd van vier jaar (vierde lid); 0 als de
              vestiging op of na de vierde verjaardag ligt
          - name: aftrek_kwartalen
            type: number
            description: >-
              De aftrek in hele kwartalen, naar beneden afgerond
              (DUO-werkinstructie)
          - name: bekostigbare_kwartalen_maximaal
            type: number
            description: >-
              Kwartalen zonder aftrek: acht voor een asielzoeker (artikel 34
              en 35), vier voor een overige vreemdeling, vier op een speciale
              school voor basisonderwijs (artikel 36), nul als de leerling niet
              in aanmerking komt
          - name: bekostigbare_kwartalen
            type: number
            description: Kwartalen recht op aanvullende bekostiging na aftrek, minimaal nul
          - name: kwartalen_verstreken
            type: number
            description: >-
              Aantal peildata vóór deze peildatum sinds de eerste dag van
              inschrijving
          - name: telt_op_peildatum
            type: boolean
            description: >-
              De leerling telt op deze peildatum mee voor de aanvullende
              bekostiging
          - name: bekostigingsjaar
            type: number
            description: >-
              1 in de eerste twaalf maanden (artikel 34), 2 daarna (artikel
              35), 0 als de leerling niet meetelt
          - name: bedrag_per_leerling_per_jaar
            type: amount
            type_spec:
              unit: eurocent
            description: Het jaarbedrag dat voor deze leerling op deze peildatum geldt
          - name: bedrag_kwartaal
            type: amount
            type_spec:
              unit: eurocent
            description: >-
              Het bedrag voor deze leerling op deze peildatum: het jaarbedrag
              maal 25,00%, afgerond op hele eurocenten; 0 als de leerling niet
              meetelt
          - name: aanvraag_vereist
            type: boolean
            description: >-
              De aanvullende bekostiging wordt op aanvraag verstrekt (tweede
              en zesde lid)
        actions:
          - output: valt_onder_artikel_36
            value:
              operation: EQUALS
              subject: $schoolsoort
              value: sbo
          # Lid 12: kan niet worden aangevraagd voor leerlingen die geboren
          # zijn in Nederland en de status van een ouder of voogd krijgen.
          - output: geboren_in_nederland
            value:
              operation: LESS_THAN_OR_EQUAL
              subject: $datum_vestiging_nederland
              value: $geboortedatum
          # Lid 1 en artikel 36, eerste en tweede lid: wie komt in aanmerking;
          # lid 10 en 11: de categorie volgt uit de verblijfstitelcode; lid 12
          # sluit in Nederland geboren leerlingen uit.
          - output: categorie_nieuwkomer
            value:
              operation: IF
              cases:
                - when:
                    operation: OR
                    conditions:
                      - operation: NOT
                        value: $is_vreemdeling
                      - $geboren_in_nederland
                      - $internationaal_georienteerd
                      - operation: NOT
                        value: $woonachtig_in_nederland
                      - operation: NOT
                        value: $werkelijk_schoolgaand
                      - operation: NOT
                        value:
                          operation: IN
                          subject: $schoolsoort
                          value: $schoolsoorten_primair_onderwijs
                  then: GEEN
                - when:
                    operation: IN
                    subject: $verblijfstitel_code
                    value: $codes_asielzoeker
                  then: ASIELZOEKER
                - when:
                    operation: IN
                    subject: $verblijfstitel_code
                    value: $codes_overige_vreemdeling
                  then: OVERIGE_VREEMDELING
                # Elfde lid: het bevoegd gezag bepaalt. Een gegeven oordeel
                # wordt gevolgd.
                - when:
                    operation: AND
                    conditions:
                      - operation: NOT
                        value:
                          operation: EQUALS
                          subject: $oordeel_bevoegd_gezag
                          value: null
                      - operation: OR
                        conditions:
                          - operation: IN
                            subject: $verblijfstitel_code
                            value: $codes_bevoegd_gezag_bepaalt
                          - operation: NOT
                            value: $heeft_bsn
                          - operation: EQUALS
                            subject: $verblijfstitel_code
                            value: null
                  then: $oordeel_bevoegd_gezag
                # Artikel 36, elfde lid: op een speciale school voor
                # basisonderwijs telt elke status uit de tabel als vreemdeling;
                # het onderscheid asielzoeker/overige speelt daar niet.
                - when:
                    operation: AND
                    conditions:
                      - $valt_onder_artikel_36
                      - operation: IN
                        subject: $verblijfstitel_code
                        value: $codes_bevoegd_gezag_bepaalt
                  then: OVERIGE_VREEMDELING
                - when:
                    operation: OR
                    conditions:
                      - operation: IN
                        subject: $verblijfstitel_code
                        value: $codes_bevoegd_gezag_bepaalt
                      - operation: NOT
                        value: $heeft_bsn
                      - operation: EQUALS
                        subject: $verblijfstitel_code
                        value: null
                  then: BESTUUR_BEOORDEELT
              default: GEEN
          # Lid 4: aftrek voor de periode tussen vestiging en vierde verjaardag.
          - output: vierde_verjaardag
            value:
              operation: DATE_ADD
              date: $geboortedatum
              years: $leeftijd_vier_jaar
          - output: aftrek_maanden_voor_vierde_verjaardag
            value:
              operation: MAX
              values:
                - $geen_aftrek
                - operation: DATE_DIFF
                  from: $datum_vestiging_nederland
                  to: $vierde_verjaardag
                  in: months
          - output: aftrek_kwartalen
            operation: FLOOR
            precision: 0
            value:
              operation: DIVIDE
              values:
                - $aftrek_maanden_voor_vierde_verjaardag
                - $maanden_per_kwartaal
          # Lid 3 (vier kwartalen), artikel 35, derde lid (nog eens vier voor
          # asielzoekers), artikel 36, vierde lid (vier op sbo).
          - output: bekostigbare_kwartalen_maximaal
            value:
              operation: IF
              cases:
                - when:
                    operation: EQUALS
                    subject: $categorie_nieuwkomer
                    value: GEEN
                  then: $geen_recht_kwartalen
                - when:
                    operation: EQUALS
                    subject: $categorie_nieuwkomer
                    value: BESTUUR_BEOORDEELT
                  then: $geen_recht_kwartalen
                - when: $valt_onder_artikel_36
                  then: $kwartalen_maximaal_sbo
                - when:
                    operation: EQUALS
                    subject: $categorie_nieuwkomer
                    value: ASIELZOEKER
                  then:
                    operation: ADD
                    values:
                      - $kwartalen_eerste_jaar
                      - $kwartalen_tweede_jaar_asielzoeker
              default: $kwartalen_eerste_jaar
          - output: bekostigbare_kwartalen
            value:
              operation: MAX
              values:
                - $geen_recht_kwartalen
                - operation: SUBTRACT
                  values:
                    - $bekostigbare_kwartalen_maximaal
                    - $aftrek_kwartalen
          # Lid 5: peildata zijn kwartaalbegin, dus hele maanden gedeeld door
          # drie telt precies de verstreken peildata.
          - output: kwartalen_verstreken
            value:
              operation: MAX
              values:
                - $geen_verstreken_kwartalen
                - operation: FLOOR
                  precision: 0
                  value:
                    operation: DIVIDE
                    values:
                      - operation: DATE_DIFF
                        from: $eerste_inschrijfdatum
                        to: $referencedate.iso
                        in: months
                      - $maanden_per_kwartaal
          - output: telt_op_peildatum
            value:
              operation: AND
              conditions:
                - operation: LESS_THAN_OR_EQUAL
                  subject: $eerste_inschrijfdatum
                  value: $referencedate.iso
                - operation: LESS_THAN
                  subject: $kwartalen_verstreken
                  value: $bekostigbare_kwartalen
          - output: bekostigingsjaar
            value:
              operation: IF
              cases:
                - when:
                    operation: NOT
                    value: $telt_op_peildatum
                  then: $geen_bekostigingsjaar
                - when:
                    operation: LESS_THAN
                    subject: $kwartalen_verstreken
                    value: $kwartalen_eerste_jaar
                  then: $eerste_bekostigingsjaar
              default: $tweede_bekostigingsjaar
          # Lid 9 (bedragen), artikel 35, achtste lid, artikel 36, tiende lid.
          - output: bedrag_per_leerling_per_jaar
            value:
              operation: IF
              cases:
                - when:
                    operation: NOT
                    value: $telt_op_peildatum
                  then: $geen_bedrag
                - when: $valt_onder_artikel_36
                  then: $bedrag_per_vreemdeling_sbo
                - when:
                    operation: EQUALS
                    subject: $categorie_nieuwkomer
                    value: OVERIGE_VREEMDELING
                  then: $bedrag_per_overige_vreemdeling
                - when:
                    operation: EQUALS
                    subject: $bekostigingsjaar
                    value: $tweede_bekostigingsjaar
                  then: $bedrag_per_asielzoeker_tweede_jaar
              default: $bedrag_per_asielzoeker_eerste_jaar
          - output: bedrag_kwartaal
            operation: ROUND
            precision: 0
            value:
              operation: MULTIPLY
              values:
                - $bedrag_per_leerling_per_jaar
                - $kwartaalfractie
          - output: aanvraag_vereist
            value: false

  # ---------------------------------------------------------------- 34 lid 2
  - number: '34, tweede lid'
    text: |
      2. Het bevoegd gezag van een basisschool waar de eerste opvang in het onderwijs wordt verzorgd voor ten minste één asielzoeker of overige vreemdeling die in aanmerking komt voor de bekostiging als bedoeld in dit artikel, ontvangt ambtshalve aanvullende bekostiging.
    url: https://wetten.overheid.nl/BWBR0052727/2026-06-26/0#Hoofdstuk5_Artikel34_Lid2
    machine_readable:
      definitions:
        drempel_aantal_leerlingen:
          value: 1
          type: number
          description: >-
            ten minste vier asielzoekers of overige vreemdelingen die in
            aanmerking komen voor de bekostiging
        maand_januari:
          value: 1
          type: number
          description: Indien de peildatum 1 januari betreft (negende lid)
        geen_bedrag:
          value: 0
          type: amount
          type_spec:
            unit: eurocent
          description: >-
            geen aanvullende bekostiging: de school haalt de drempel van het
            tweede lid niet
      execution:
        parameters:
          - name: school_id
            type: string
            required: true
            description: Instellingscode van de school
        input:
          - name: schoolsoort
            type: string
            source:
              description: >-
                basisschool of sbo (speciale school voor basisonderwijs,
                artikel 36) (scholen-databron)
          - name: aantal_asielzoekers_peildatum
            type: number
            source:
              description: >-
                Ap = het aantal op de peildatum ingeschreven leerlingen dat
                asielzoeker is (negende lid) (scholen-databron)
          - name: aantal_overige_vreemdelingen_peildatum
            type: number
            source:
              description: >-
                Vp = het aantal op de peildatum ingeschreven leerlingen dat
                overige vreemdeling is (negende lid) (scholen-databron)
          - name: aantal_asielzoekers_telling_1_februari
            type: number
            source:
              description: >-
                At = het totaal aantal op 1 februari van het voorgaande
                schooljaar ingeschreven leerlingen dat eerstejaars asielzoeker
                is (negende lid) (scholen-databron)
          - name: bedrag_per_asielzoeker_eerste_jaar
            type: amount
            type_spec:
              unit: eurocent
            source:
              output: bedrag_per_asielzoeker_eerste_jaar
          - name: bedrag_per_overige_vreemdeling
            type: amount
            type_spec:
              unit: eurocent
            source:
              output: bedrag_per_overige_vreemdeling
          - name: kwartaalfractie
            type: number
            type_spec:
              unit: ratio
            source:
              output: kwartaalfractie
          - name: drempel_aantal_vreemdelingen_sbo
            type: number
            source:
              output: drempel_aantal_vreemdelingen_sbo
          - name: bedrag_per_vreemdeling_sbo
            type: amount
            type_spec:
              unit: eurocent
            source:
              output: bedrag_per_vreemdeling_sbo
        output:
          - name: school_valt_onder_artikel_36
            type: boolean
            description: Speciale school voor basisonderwijs (artikel 36)
          - name: aantal_asielzoekers_en_overige_vreemdelingen
            type: number
            description: Ap + Vp op de peildatum
          - name: voldoet_aan_drempel
            type: boolean
            description: >-
              Ten minste vier asielzoekers of overige vreemdelingen op de
              peildatum (artikel 36, derde lid, voor sbo)
          - name: bedrag_eerste_opvang_peildatum
            type: amount
            type_spec:
              unit: eurocent
            description: >-
              De aanvullende bekostiging voor deze peildatum volgens de
              formules van het negende lid (artikel 36, tiende lid, voor sbo),
              afgerond op hele eurocenten; 0 onder de drempel
        actions:
          - output: school_valt_onder_artikel_36
            value:
              operation: EQUALS
              subject: $schoolsoort
              value: sbo
          - output: aantal_asielzoekers_en_overige_vreemdelingen
            value:
              operation: ADD
              values:
                - $aantal_asielzoekers_peildatum
                - $aantal_overige_vreemdelingen_peildatum
          - output: voldoet_aan_drempel
            value:
              operation: GREATER_THAN_OR_EQUAL
              subject: $aantal_asielzoekers_en_overige_vreemdelingen
              value:
                operation: IF
                cases:
                  - when: $school_valt_onder_artikel_36
                    then: $drempel_aantal_vreemdelingen_sbo
                default: $drempel_aantal_leerlingen
          # Negende lid: op 1 januari worden de eerstejaars asielzoekers uit de
          # 1-februari-telling (At) al via de reguliere bekostiging vergoed en
          # tellen zij hier tegen het tarief voor overige vreemdelingen.
          - output: bedrag_eerste_opvang_peildatum
            operation: ROUND
            precision: 0
            value:
              operation: IF
              cases:
                - when:
                    operation: NOT
                    value: $voldoet_aan_drempel
                  then: $geen_bedrag
                - when: $school_valt_onder_artikel_36
                  then:
                    operation: MULTIPLY
                    values:
                      - $aantal_asielzoekers_en_overige_vreemdelingen
                      - $bedrag_per_vreemdeling_sbo
                      - $kwartaalfractie
                - when:
                    operation: AND
                    conditions:
                      - operation: EQUALS
                        subject: $referencedate.month
                        value: $maand_januari
                      - operation: GREATER_THAN
                        subject: $aantal_asielzoekers_peildatum
                        value: $aantal_asielzoekers_telling_1_februari
                  then:
                    operation: ADD
                    values:
                      - operation: MULTIPLY
                        values:
                          - operation: SUBTRACT
                            values:
                              - $aantal_asielzoekers_peildatum
                              - $aantal_asielzoekers_telling_1_februari
                          - $bedrag_per_asielzoeker_eerste_jaar
                          - $kwartaalfractie
                      - operation: MULTIPLY
                        values:
                          - operation: ADD
                            values:
                              - $aantal_asielzoekers_telling_1_februari
                              - $aantal_overige_vreemdelingen_peildatum
                          - $bedrag_per_overige_vreemdeling
                          - $kwartaalfractie
                - when:
                    operation: EQUALS
                    subject: $referencedate.month
                    value: $maand_januari
                  then:
                    operation: MULTIPLY
                    values:
                      - $aantal_asielzoekers_en_overige_vreemdelingen
                      - $bedrag_per_overige_vreemdeling
                      - $kwartaalfractie
              default:
                operation: ADD
                values:
                  - operation: MULTIPLY
                    values:
                      - $aantal_asielzoekers_peildatum
                      - $bedrag_per_asielzoeker_eerste_jaar
                      - $kwartaalfractie
                  - operation: MULTIPLY
                    values:
                      - $aantal_overige_vreemdelingen_peildatum
                      - $bedrag_per_overige_vreemdeling
                      - $kwartaalfractie

  # ---------------------------------------------------------------- 34 lid 7
  - number: '34, zevende lid'
    text: |
      7. Een basisschool die niet eerder eenmalige aanvullende bekostiging heeft ontvangen voor het verzorgen van de eerste opvang van asielzoekers of overige vreemdelingen, komt in aanmerking voor een eenmalige aanvulling op de aanvullende bekostiging van € 18.174,57.
    url: https://wetten.overheid.nl/BWBR0052727/2026-06-26/0#Hoofdstuk5_Artikel34_Lid7
    machine_readable:
      definitions:
        eenmalige_toeslag:
          value: 1817457
          type: amount
          type_spec:
            unit: eurocent
          description: >-
            een eenmalige aanvulling op de aanvullende bekostiging van
            € 18.174,57
        geen_toeslag:
          value: 0
          type: amount
          type_spec:
            unit: eurocent
          description: >-
            geen toeslag: de school verzorgde al eerder eerste opvang, of
            ontvangt op deze peildatum geen aanvullende bekostiging
      execution:
        parameters:
          - name: school_id
            type: string
            required: true
            description: Instellingscode van de school
        input:
          - name: schoolsoort
            type: string
            source:
              description: >-
                basisschool of sbo (speciale school voor basisonderwijs,
                artikel 36) (scholen-databron)
          - name: eerste_keer_eerste_opvang
            type: boolean
            source:
              description: >-
                De school heeft niet eerder aanvullende bekostiging voor de
                eerste opvang van asielzoekers of overige vreemdelingen
                ontvangen (scholen-databron)
          - name: voldoet_aan_drempel
            type: boolean
            source:
              output: voldoet_aan_drempel
          - name: toeslag_eerste_keer_sbo
            type: amount
            type_spec:
              unit: eurocent
            source:
              output: toeslag_eerste_keer_sbo
        output:
          - name: toeslag_eerste_keer
            type: amount
            type_spec:
              unit: eurocent
            description: >-
              Eenmalige aanvulling bij de eerste keer eerste opvang (artikel
              36, achtste lid, voor sbo); 0 als niet van toepassing
        actions:
          - output: toeslag_eerste_keer
            value:
              operation: IF
              cases:
                - when:
                    operation: NOT
                    value:
                      operation: AND
                      conditions:
                        - $eerste_keer_eerste_opvang
                        - $voldoet_aan_drempel
                  then: $geen_toeslag
                - when:
                    operation: EQUALS
                    subject: $schoolsoort
                    value: sbo
                  then: $toeslag_eerste_keer_sbo
              default: $eenmalige_toeslag

  # ---------------------------------------------------------------- 34 lid 9
  - number: '34, negende lid'
    text: |
      9. De bekostiging, bedoeld in het tweede lid, wordt berekend volgens de formules:
          • Indien de peildatum 1 januari betreft:
              ○ indien Ap groter is dan At: (Ap – At) x € 15.636,32 x 25,00% verhoogd met (At + Vp) x € 15.636,32 x 25,00%.
              ○ indien Ap niet groter is dan At: (Ap + Vp) x € 15.636,32 x 25,00%.
          • Indien de peildatum 1 april, 1 juli of 1 oktober betreft: Ap x € 15.636,32 x 25,00% verhoogd met Vp x € 15.636,32 x 25,00%.
          waarin steeds:
          • Ap = het aantal op de peildatum ingeschreven leerlingen dat asielzoeker is;
          • Vp = het aantal op de peildatum ingeschreven leerlingen dat overige vreemdeling is;
          • At = het totaal aantal op 1 februari van het voorgaande schooljaar ingeschreven leerlingen dat eerstejaars asielzoeker is.
    url: https://wetten.overheid.nl/BWBR0052727/2026-06-26/0#Hoofdstuk5_Artikel34_Lid9
    machine_readable:
      definitions:
        bedrag_per_asielzoeker_eerste_jaar:
          value: 1563632
          type: amount
          type_spec:
            unit: eurocent
          description: Ap x € 15.636,32 (per asielzoeker per jaar)
        bedrag_per_overige_vreemdeling:
          value: 1563632
          type: amount
          type_spec:
            unit: eurocent
          description: Vp x € 15.636,32 (per overige vreemdeling per jaar)
        kwartaalfractie:
          value: 0.25
          type: number
          type_spec:
            unit: ratio
          description: >-
            x 25,00%: een peildatum dekt een periode van drie maanden (vijfde
            lid)
      execution:
        output:
          - name: bedrag_per_asielzoeker_eerste_jaar
            type: amount
            type_spec:
              unit: eurocent
            description: Jaarbedrag per asielzoeker in het eerste jaar
          - name: bedrag_per_overige_vreemdeling
            type: amount
            type_spec:
              unit: eurocent
            description: Jaarbedrag per overige vreemdeling
          - name: kwartaalfractie
