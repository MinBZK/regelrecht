# Machine-uitvoerbare modellering van de nieuwkomersbekostiging in het primair
# onderwijs (hoofdstuk 5, artikelen 34 tot en met 37 en de aanvullende
# bekostiging kleine basisscholen) ten behoeve van de OCW/DUO-casus
# nieuwkomersbekostiging. Het bestand heet naar 1 januari van het kalenderjaar
# waarop de regeling betrekking heeft: de definitieve regeling wordt medio het
# jaar gepubliceerd en werkt terug tot 1 januari.
#
# Opbouw. Artikel 34 kent twee niveaus die in een regelrecht-artikel niet
# samen kunnen (andere parameter, andere databron):
#   - '34'              per leerling (parameter bsn, databron personas):
#                       categorie, kwartalen, telt op peildatum, bedrag.
#   - '34, tweede lid'  per school (parameter school_id, databron scholen):
#                       drempel en de bekostiging volgens de formules van het
#                       negende lid.
#   - '34, zevende lid' per school: eenmalige toeslag.
#   - '34, negende lid' de bedragen en het kwartaalpercentage (constanten).
#   - '35' / '35, tweede lid'  idem voor het tweede jaar asielzoekers.
#   - '36'              speciale scholen voor basisonderwijs (constanten; de
#                       uitvoering loopt via dezelfde outputs als artikel 34).
#   - '37', '43'  tekst plus constanten, geen uitvoering.
#
# Interpretatiekeuzes (zie ook scenarios/nieuwkomers_po.feature):
#   (a) De aftrek voor de periode vóór de vierde verjaardag (artikel 34,
#       vierde lid, en artikel 35, vierde lid) gaat af van het EINDE van het
#       totale recht: de eerste vier kwartalen vallen onder artikel 34, de rest
#       onder artikel 35. Dit volgt de OCW/DUO-visual ("een jaar en twee
#       kwartalen"). Naar de letter kan artikel 34, vierde lid, ook gelezen
#       worden als aftrek van de eerste twaalf maanden; open vraag.
#   (b) DUO rondt de aftrek naar beneden af op hele kwartalen
#       (DUO-werkinstructie, geen regelingtekst).
#   (c) Verstreken kwartalen = hele maanden tussen eerste inschrijving en de
#       peildatum, gedeeld door drie en naar beneden afgerond; exact omdat
#       peildata kwartaalbegin zijn.
#   (d) Categorie op basis van de verblijfstitelcode (tiende lid); bij de codes
#       21, 33, 34, 98, bij inschrijving op onderwijsnummer of bij een
#       onbekende code beslist het bevoegd gezag (elfde lid). Zolang dat
#       oordeel ontbreekt telt de leerling niet mee (BESTUUR_BEOORDEELT).
#   (e) Leerlingen op een speciale school voor basisonderwijs vallen onder
#       artikel 36: één tarief, maximaal vier kwartalen, dezelfde drempel.
#   (f) Artikel 34, twaalfde lid (in Nederland geboren met een van de ouders
#       afgeleide status): "geboren in Nederland" wordt afgeleid uit de data,
#       datum van vestiging in Nederland <= geboortedatum. Voor een hier geboren
#       kind is de BRP-datum van vestiging immers de geboortedatum. Zo'n
#       leerling krijgt categorie GEEN.
# Versie 2026: de tabel in artikel 34, tiende lid, kent sinds deze
# regeling ook de EU-Pact-codes 50 tot en met 56 (allemaal asielzoeker).
# Artikel 43 is de tegenhanger van artikel 44 in de regeling 2025.
articles:
  # ---------------------------------------------------------------- 34
  - number: '34'
    text: |
      1. Voor de toepassing van dit artikel wordt verstaan onder:
          *asielzoeker:*
              a. vreemdeling als bedoeld in de Vreemdelingenwet 2000, die:
                  – ingeschreven staat op een basisschool, niet zijnde een afdeling voor internationaal georiënteerd basisonderwijs als bedoeld in artikel 85a van de WPO of een afdeling basisonderwijs van de Europese school te Den Haag; en
                  – in het bezit is gesteld:
                      1°. door de Minister van Asiel en Migratie van een document of schriftelijke verklaring als bedoeld in artikel 9 van de Vreemdelingenwet 2000 op grond van artikel 8, onderdelen c, d, f, g, h of j, van die wet; of
                      2°. door het Centraal Orgaan opvang asielzoekers van een verklaring waaruit blijkt dat de vreemdeling in afwachting is van een aanvraag voor een verblijfsvergunning als bedoeld in artikel 8, onderdelen c, d, f, g, h of j, van de Vreemdelingenwet 2000 en daarom niet beschikt over het document of schriftelijke verklaring als bedoeld in artikel 9 van die wet; en
                  – woonachtig is in Nederland.
              b. ontheemde op wie de tijdelijke bescherming van artikel 2 van het Uitvoeringsbesluit (EU) 2022/382 van de Raad van 4 maart 2022 tot vaststelling van het bestaan van een massale toestroom van ontheemden uit Oekraïne in de zin van artikel 5 van Richtlijn 2001/55/EG, en tot invoering van tijdelijke bescherming naar aanleiding daarvan (PbEU 2022, L 071) van toepassing is en die ingeschreven staat op een basisschool, niet zijnde een afdeling voor internationaal georiënteerd basisonderwijs als bedoeld in artikel 85a van de WPO of een afdeling basisonderwijs van de Europese school te Den Haag en die woonachtig is in Nederland.
              c. ontheemde op wie de tijdelijke bescherming van artikel 7 van Richtlĳn 2001/55/EG van de Raad van 20 juli 2001 betreffende minimumnormen voor het verlenen van tĳdelĳke bescherming in geval van massale toestroom van ontheemden en maatregelen ter bevordering van een evenwicht tussen de inspanning van de lidstaten voor de opvang en het dragen van de consequenties van de opvang van deze personen (PbEU 2001, L 212) van toepassing is en die ingeschreven staat op een basisschool, niet zijnde een afdeling voor internationaal georiënteerd basisonderwijs als bedoeld in artikel 85a van de WPO of een afdeling basisonderwijs van de Europese school te Den Haag en die woonachtig is in Nederland.
          *overige vreemdeling:* vreemdeling als bedoeld in de Vreemdelingenwet 2000, niet zijnde een asielzoeker, die:
              – ingeschreven staat op een basisschool, niet zijnde een afdeling voor internationaal georiënteerd basisonderwijs als bedoeld in artikel 85a van de WPO of een afdeling basisonderwijs van de Europese school te Den Haag; en
              – in het bezit is gesteld:
                  1°. Door de Minister van Asiel en Migratie van een document of schriftelijke verklaring als bedoeld in artikel 9 van de Vreemdelingenwet 2000; of
                  2°. Van een paspoort of identiteitsbewijs waaruit blijkt dat de vreemdeling burger is van de Europese Unie of een staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland; en
              – woonachtig is in Nederland.

      2. Het bevoegd gezag van een basisschool waar de eerste opvang in het onderwijs wordt verzorgd voor ten minste één asielzoeker of overige vreemdeling die in aanmerking komt voor de bekostiging als bedoeld in dit artikel, ontvangt ambtshalve aanvullende bekostiging.

      3. Het recht van aanvullende bekostiging bedraagt per leerling maximaal twaalf maanden gerekend vanaf de eerste dag van inschrijving op een school met inachtneming van de peildata in het vijfde lid.

      4. In afwijking van het derde lid wordt in het geval de datum van vestiging in Nederland van de leerling voor het vierde levensjaar van deze leerling ligt, de periode tussen de datum van vestiging in Nederland en het bereiken van de leeftijd van vier jaar in mindering gebracht op het recht op deze bekostiging. De datum van vestiging is de oudste datum van inschrijving in Nederland als bedoeld in bijlage 1 van de Regeling register onderwijsdeelnemers.

      5. De aanvullende bekostiging heeft betrekking op een periode van drie maanden, met als peildata:
          a. 1 januari voor de periode januari tot en met maart;
          b. 1 april voor de periode april tot en met juni;
          c. 1 juli voor de periode juli tot en met september;
          d. 1 oktober voor de periode oktober tot en met december.

      6. De minister stelt de aanvullende bekostiging per peildatum ambtshalve vast op basis van de eerste inschrijfdatum in het register onderwijsdeelnemers; het door de accountant gevalideerde aantal nieuwkomers is leidend, zoals in het voortgezet onderwijs.

      7. Een basisschool die niet eerder eenmalige aanvullende bekostiging heeft ontvangen voor het verzorgen van de eerste opvang van asielzoekers of overige vreemdelingen, komt in aanmerking voor een eenmalige aanvulling op de aanvullende bekostiging van € 18.174,57.

      8. [Vervallen.]
          a. naam, instellingscode, postcode en plaats van de school;
          b. indien de peildatum 1 januari betreft, het aantal ingeschreven asielzoekers en het aantal ingeschreven overige vreemdelingen op 1 januari, en het aantal eerstejaars asielzoekers dat op 1 februari van het voorgaande schooljaar aan de basisschool stond ingeschreven of indien de peildatum niet 1 januari betreft het aantal ingeschreven asielzoekers en het aantal ingeschreven overige vreemdelingen op de peildatum; en
          c. in geval van toepassing van het zevende lid, een verklaring dat de basisschool niet eerder de eerste opvang van vreemdelingen respectievelijk de eerste opvang van asielzoekers of overige vreemdelingen heeft verzorgd.

      9. De bekostiging, bedoeld in het tweede lid, wordt berekend volgens de formules:
          • Indien de peildatum 1 januari betreft:
              ○ indien Ap groter is dan At: (Ap – At) x € 15.636,32 x 25,00% verhoogd met (At + Vp) x € 15.636,32 x 25,00%.
              ○ indien Ap niet groter is dan At: (Ap + Vp) x € 15.636,32 x 25,00%.
          • Indien de peildatum 1 april, 1 juli of 1 oktober betreft: Ap x € 15.636,32 x 25,00% verhoogd met Vp x € 15.636,32 x 25,00%.
          waarin steeds:
          • Ap = het aantal op de peildatum ingeschreven leerlingen dat asielzoeker is;
          • Vp = het aantal op de peildatum ingeschreven leerlingen dat overige vreemdeling is;
          • At = het totaal aantal op 1 februari van het voorgaande schooljaar ingeschreven leerlingen dat eerstejaars asielzoeker is.

      10. Het bedrag per leerling wordt vastgesteld overeenkomstig de code van de verblijfsrechtelijke status van de leerling waaruit volgt of de leerling als een asielzoeker of een overige vreemdeling wordt beschouwd. Wanneer een leerling asielzoeker of overige vreemdeling is, wordt dit weergegeven in onderstaande tabel:
          | Code | Omschrijving | Categorie |
          |---|---|---|
          | 21 | Vreemdelingenwet 2000 art. 8, onder a. Verblijfsvergunning voor bepaalde tijd, arbeid vrij. | Asielzoeker of overige vreemdeling |
          | 22 | Vreemdelingenwet 2000 art. 8, sub a. Verblijfsvergunning regulier voor bepaalde tijd met tewerkstellingsvergunning OF gecombineerde vergunning voor verblijf en arbeid. | Overige vreemdeling |
          | 23 | Vreemdelingenwet 2000 art. 8, onder a. Vergunning regulier voor bepaalde tijd, met enkel de mogelijkheid om specifieke arbeid te verrichten (zonder twv). | Overige vreemdeling |
          | 24 | Vreemdelingenwet 2000 art. 8, onder a. Vergunning regulier voor bepaalde tijd, geen arbeid. | Overige vreemdeling |
          | 25 | Vreemdelingenwet 2000 art. 8, sub b. Verblijfsvergunning regulier voor onbepaalde tijd OF EU-verblijfsvergunning voor langdurig ingezetenen. | Overige vreemdeling |
          | 26 | Vreemdelingenwet 2000 art. 8, onder c. Verblijfsvergunning asiel bepaalde tijd, arbeid vrij. | Asielzoeker |
          | 27 | Vreemdelingenwet 2000 art. 8, sub d. Verblijfsvergunning asiel onbepaalde tijd OF EU-verblijfsvergunning voor langdurig ingezetenen. | Asielzoeker |
          | 28 | Vreemdelingenwet 2000 art. 8, onder e. Gemeenschapsonderdaan, economisch actief, arbeid vrij. | Overige vreemdeling |
          | 29 | Vreemdelingenwet 2000 art. 8, onder e. Gemeenschapsonderdaan, economisch niet actief, arbeid vrij. | Overige vreemdeling |
          | 30 | Vreemdelingenwet 2000 art. 8, onder e. Familielid van een gemeenschapsonderdaan, na toetsing aan EU-recht, arbeid vrij. | Overige vreemdeling |
          | 31 | Vreemdelingenwet 2000 art. 8, onder f en h. In procedure voor aanvraag verblijfsvergunning regulier voor bepaalde tijd. | Overige vreemdeling |
          | 32 | Vreemdelingenwet 2000 art. 8, onder f en h. In procedure voor aanvraag verblijfsvergunning asiel voor bepaalde tijd. | Asielzoeker |
          | 33 | Vreemdelingenwet 2000 art. 8, onder g en h. In procedure voor voortgezet verblijf, tijdige aanvraag. | Asielzoeker of overige vreemdeling |
          | 34 | Vreemdelingenwet 2000 art. 8, onder g en h. In procedure voor voortgezet verblijf, ontijdige aanvraag. | Asielzoeker of overige vreemdeling |
          | 35 | Vreemdelingenwet 2000 art. 8, onder I. Onderdaan heeft verblijfsrecht o.b.v. het Associatiebesluit 1/80 van de Associatieraad EEG/Turkije (waarin soepelere regels zijn opgenomen voor Turkse onderdanen). | Overige vreemdeling |
          | 36 | Vreemdelingenwet 2000 art. 8, onder e. Gemeenschapsonderdaan, economisch actief, met enkel de mogelijkheid om specifieke arbeid te verrichten. | Overige vreemdeling |
          | 37 | Vreemdelingenwet 2000 art. 8, onder e. Gemeenschapsonderdaan, economisch niet actief, met enkel de mogelijkheid om specifieke arbeid te verrichten. | Overige vreemdeling |
          | 38 | Vreemdelingenwet 2000 art. 8, onder e. Familielid van een gemeenschapsonderdaan, na toetsing aan EU-recht, met enkel de mogelijkheid om specifieke arbeid te verrichten. | Overige vreemdeling |
          | 39 | Vreemdelingenwet 2000 art. 8, onder m. Persoon is in afwachting van indiening asielaanvraag bij andere lidstaat o.g.v. Dublinverordening. | Asielzoeker |
          | 40 | Vreemdelingenwet 2000 art. 8, onder e. Gemeenschapsonderdaan of familielid met recht op duurzaam verblijf. Dit kan men aanvragen als men 5 jaar rechtmatig in NL heeft verbleven als gemeenschapsonderdaan of familielid. | Overige vreemdeling |
          | 41 | Rechtmatig verblijf Vreemdelingenwet 2000 art. 8, onder e, is beëindigd. | Overige vreemdeling |
          | 42 | Rechtmatig verblijf op grond van voorlopige maatregel EHRM, geen arbeid. | Overige vreemdeling |
          | 43 | Rechtmatig verblijf op aanwijzing Minister van Justitie en Veiligheid, geen arbeid. | Overige vreemdeling |
          | 44 | Vreemdelingenwet 2000 art. 8, onder m. Leerling is in afwachting van overdracht naar andere lidstaat o.g.v. Dublinverordening. | Asielzoeker |
          | 45 | Vreemdelingenwet2000 art. 8, onder i. Leerling heeft verblijfsrecht voor termijn van 180 dagen (bedoeld voor onderzoeker of student). | Overige vreemdeling |
          | 46 | Vreemdelingenwet 2000 art 8, onder f en h, EU-richtlijn 2001/55, in procedure art 28, arbeid loondienst. Verblijfstitel voor Oekraïense ontheemden. | Asielzoeker |
          | 50 | Verordening (EU) 2024/1348, art 26, asielwens, in procedure asiel | Asielzoeker |
          | 51 | Verordening (EU) 2024/1348, art 35 lid 4, in niet versnelde procedure asiel | Asielzoeker |
          | 52 | Verordening (EU) 2024/1348, art 42.1, a t/m f, in versnelde procedure asiel | Asielzoeker |
          | 53 | Verordening (EU) 2024/1348, art 42.1, g t/m j, in versnelde procedure asiel | Asielzoeker |
          | 54 | Vw 2000 na EU-Pact, art 29, lid 1, asiel vluchteling | Asielzoeker |
          | 55 | Vw 2000 na EU-Pact, art 29a, lid 1, asiel subsidiair beschermde | Asielzoeker |
          | 56 | Vw 2000 na EU-Pact, art 29b, 29c, 29d, asiel gezinslid internationaal beschermde | Asielzoeker |
          | 98 | Geen verblijftitel meer. | Asielzoeker of overige vreemdeling |

      11. Het bevoegd gezag bepaalt of een leerling een asielzoeker of een overige vreemdeling is in het geval de leerling:
          a. is ingeschreven op basis van het onderwijsnummer bedoeld in artikel 40b, vierde lid, van de WPO en waarvan het evident is dat hij asielzoeker of overige vreemdeling is; of
          b. een verblijfstitel 21, 33, 34 of 98 heeft als bedoeld in de tabel in het tiende lid.

      12. De aanvullende bekostiging, bedoeld in het tweede lid, kan niet worden aangevraagd voor leerlingen die geboren zijn in Nederland en die de verblijfsrechtelijke status krijgen van één van de ouders of voogden.
