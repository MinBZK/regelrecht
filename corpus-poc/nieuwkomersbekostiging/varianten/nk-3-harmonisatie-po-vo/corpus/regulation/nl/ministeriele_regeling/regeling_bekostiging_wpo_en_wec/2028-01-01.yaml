  # ---------------------------------------------------------------- 43
  # Herrekening van de extra bekostiging kleine basisscholen (Besluit
  # bekostiging WPO 2022, artikel 14, tweede lid) zonder de eerstejaars
  # nieuwkomers; de regeling noemt geen bedragen, alleen de teldata.
  - number: '43'
    text: |
      1. Het bevoegd gezag van een basisschool dat door de eerste opvang van asielzoekers en overige vreemdelingen als bedoeld in artikel 34, eerste lid, geen of minder extra bekostiging kleine basisscholen ontvangt als bedoeld in artikel 14, tweede lid, van het Besluit bekostiging WPO 2022, ontvangt aanvullende bekostiging.

      2. Voor de berekening van de aanvullende bekostiging, bedoeld in het eerste lid, wordt de extra bekostiging kleine bassischolen herrekend, door voor de herrekening uit te gaan van het aantal leerlingen op de basisschool op 1 februari 2025 minus het aantal eerstejaarsasielzoekers en overige vreemdelingen op de basisschool op 1 januari 2025 voor wie bekostiging is toegekend op grond van artikel 34 van Definitieve regeling bekostiging WPO en WEC 2025.

      3. De aanvullende bekostiging, bedoeld in het eerste lid, bedraagt het verschil tussen de herrekende extra bekostiging kleine basisscholen, bedoeld in het tweede lid, en de extra bekostiging kleine basisscholen, bedoeld in artikel 14 tweede lid van het Besluit bekostiging WPO 2022.
