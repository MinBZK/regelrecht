version = 1

# Standaard: alles in deze repository valt onder de EUPL-1.2.
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "Ministerie van Binnenlandse Zaken en Koninkrijksrelaties"
SPDX-License-Identifier = "EUPL-1.2"

# Rijkslogo, rijkswapen en de lettertypes RijksoverheidSans en -Serif.
# Auteursrechtelijk voorbehoud van de Staat (Stcrt. 2008, nr. 115).
[[annotations]]
path = [
  "**/fonts/RO*.woff",
  "frontend-lawmaking/assets/rijkswapen.svg",
  "frontend-demo/public/logos/ANVS.png",
  "frontend-demo/public/logos/BELASTINGDIENST.png",
  "frontend-demo/public/logos/CJIB.png",
  "frontend-demo/public/logos/DJI.png",
  "frontend-demo/public/logos/DOUANE.png",
  "frontend-demo/public/logos/DUO.png",
  "frontend-demo/public/logos/IND.png",
  "frontend-demo/public/logos/JenV.png",
  "frontend-demo/public/logos/JUSTID.png",
  "frontend-demo/public/logos/NVWA.png",
  "frontend-demo/public/logos/RvIG.png",
  "frontend-demo/public/logos/RVO.png",
  "frontend-demo/public/logos/SZW.png",
  "frontend-demo/public/logos/TOESLAGEN.png",
  "frontend-demo/public/logos/VWS.png",
]
precedence = "override"
SPDX-FileCopyrightText = "Staat der Nederlanden"
