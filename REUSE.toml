version = 1

# Standaard: code en tekst in deze repository vallen onder de EUPL-1.2.
#
# De lijst noemt bestandstypes, geen "**". Een beeld, een lettertype of een
# bestandstype dat hier niet staat krijgt daardoor geen licentie vanzelf:
# `reuse lint` faalt tot het bestand hieronder een eigen regel heeft. Dat is de
# bedoeling. Van een logo of lettertype is de rechthebbende zelden dezelfde als
# die van de code eromheen, en dat moet iemand opzoeken, niet aannemen.
[[annotations]]
path = [
  "**.astro",
  "**.conf",
  "**.css",
  "**.example",
  "**.feature",
  "**.html",
  "**.js",
  "**.json",
  "**.lock",
  "**.md",
  "**.mdx",
  "**.mjs",
  "**.py",
  "**.rs",
  "**.sh",
  "**.sql",
  "**.toml",
  "**.ts",
  "**.txt",
  "**.vue",
  "**.xml",
  "**.yaml",
  "**.yml",
  "**CODEOWNERS",
  "**Dockerfile",
  "**Justfile",
  "**.dockerignore",
  "**.gitignore",
  "**.npmrc",
  "**.skill-path-exceptions",
  "**.yamllint",
]
SPDX-FileCopyrightText = "Staat der Nederlanden (Ministerie van Binnenlandse Zaken en Koninkrijksrelaties)"
SPDX-License-Identifier = "EUPL-1.2"

# Eigen beeldmateriaal: het regelrecht-icoon en schermafbeeldingen van de
# eigen applicaties.
[[annotations]]
path = [
  "**/public/regelrecht-icon.svg",
  "docs/src/assets/editor-notities-screenshot.png",
  "docs/src/assets/portaal-screenshot.png",
  "docs/src/assets/simulatie-screenshot.png",
]
SPDX-FileCopyrightText = "Staat der Nederlanden (Ministerie van Binnenlandse Zaken en Koninkrijksrelaties)"
SPDX-License-Identifier = "EUPL-1.2"

# Het corpus en de wetgevingsfixtures van de harvester bevatten letterlijke
# wettekst. Op wetten, besluiten en verordeningen rust geen auteursrecht
# (artikel 11 Auteurswet). Rechthebbende en licentie hieronder gelden voor wat
# eromheen staat: de structuur, de machine-leesbare modellering en de scenario's.
[[annotations]]
path = [
  "corpus/**.yaml",
  "corpus-poc/**.yaml",
  "packages/harvester/tests/fixtures/**.xml",
]
SPDX-FileCopyrightText = "Staat der Nederlanden (Ministerie van Binnenlandse Zaken en Koninkrijksrelaties)"
SPDX-License-Identifier = "EUPL-1.2"

# Het position paper "Rules as Executed" en de bestanden die eruit gegenereerd
# zijn. Gepubliceerd onder CC BY 4.0 (https://doi.org/10.5281/zenodo.22201094).
[[annotations]]
path = [
  "docs/src/research/rules-as-executed.*",
  "docs/public/research/depgraph-zorgtoeslag.svg",
]
precedence = "override"
SPDX-FileCopyrightText = "De auteurs van het paper, zie docs/src/research/rules-as-executed.meta.json"
SPDX-License-Identifier = "CC-BY-4.0"

