---
ci:
  autofix_prs: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - feat
          - fix
          - docs
          - style
          - refactor
          - perf
          - test
          - chore
          - build
          - ci

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]
        types: [yaml]

  - repo: local
    hooks:
      - id: rust-format
        name: Check Rust formatting
        entry: just format
        language: system
        pass_filenames: false
        types: [rust]

      - id: rust-lint
        name: Rust clippy lints
        entry: just lint
        language: system
        pass_filenames: false
        types: [rust]

      - id: validate-law-yaml
        name: Validate law YAML schema
        entry: just validate
        language: system
        pass_filenames: true
        files: ^corpus/regulation/.*\.yaml$
        # Skip dot-prefixed sidecars (.enrichment.yaml, .enrichment-result.yaml):
        # enrichment metadata/result envelopes, not law files.
        exclude: (^|/)\.[^/]*\.yaml$
        types: [yaml]

      - id: tool-pins-in-sync
        name: cargo-chef-pin gelijk in alle Dockerfiles
        entry: script/check-tool-pins.sh
        language: system
        pass_filenames: false
        files: (^frontend/Dockerfile$|^packages/(admin|pipeline)/Dockerfile$)

      - id: review-gate-tests
        name: Merge-poort op de Claude-review doet wat hij belooft
        entry: script/await-claude-review.test.sh
        language: system
        pass_filenames: false
        files: ^(script/await-claude-review(\.test)?\.sh|\.github/workflows/claude-code-review\.yml)$

      - id: ci-gate-tests
        name: Test-poort in ci.yml blokkeert op een gevallen voorganger
        entry: just ci-gate-test
        language: system
        pass_filenames: false
        files: ^(\.github/workflows/ci\.yml|script/ci-gate\.test\.mjs)$

      - id: dockerfile-consistency
        name: Rust-Dockerfiles blijven bij de cargo-workspace
        entry: just dockerfile-consistency-test
        language: system
        pass_filenames: false
        files: ^(frontend/Dockerfile|packages/(admin|pipeline)/Dockerfile|packages/Cargo\.toml|rust-toolchain\.toml|\.github/workflows/deploy\.yml|script/dockerfile-consistency\.test\.mjs)$

      - id: deploy-gate-tests
        name: Deploy-poort op een groene CI doet wat hij belooft
        entry: script/require-ci-green.test.sh
        language: system
        pass_filenames: false
        files: ^(script/require-ci-green(\.test)?\.sh|\.github/workflows/deploy\.yml)$

      - id: deployed-urls-tests
        name: Productiecontrole na de deploy doet wat hij belooft
        entry: script/check-deployed-urls.test.sh
        language: system
        pass_filenames: false
        files: ^(script/check-deployed-urls(\.test)?\.sh|\.github/workflows/deploy\.yml)$
      - id: preview-environments-tests
        name: Controle op achtergebleven previews doet wat hij belooft
        entry: script/check-preview-environments.test.sh
        language: system
        pass_filenames: false
        files: ^(script/check-preview-environments(\.test)?\.sh|\.github/workflows/scheduled-cleanup\.yml)$

      - id: skills-no-casus
        name: Skills blijven dossier-agnostisch (geen casus-inhoud)
        entry: script/check-skills-no-casus.sh
        language: system
        pass_filenames: false
        files: ^\.claude/skills/
